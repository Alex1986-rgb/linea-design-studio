<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Открытые вопросы, принятые допущения и конфликты. Лист 4 из 4" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты. Лист 4 из 4</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации (стартовое совещание 18.10.2026)</text><g data-el="open-issues" data-plan="fixed" data-plan-declared="4"><g data-el="issues-changes"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Изменения проекта после выпуска листов (реестр изменений) (продолжение)</text><rect x="25" y="33" width="385" height="139.2" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="32" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="33" x2="39" y2="172.2" stroke="#000" stroke-width="0.25"/><text x="50" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><line x1="61" y1="33" x2="61" y2="172.2" stroke="#000" stroke-width="0.25"/><text x="91" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><line x1="121" y1="33" x2="121" y2="172.2" stroke="#000" stroke-width="0.25"/><text x="171" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Было</text><line x1="221" y1="33" x2="221" y2="172.2" stroke="#000" stroke-width="0.25"/><text x="283.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Стало</text><line x1="346" y1="33" x2="346" y2="172.2" stroke="#000" stroke-width="0.25"/><text x="378" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Кто решил, подпись</text><g data-el="issue-row" data-kind="change" data-id="ИЗ-7"><text x="32" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-7</text><text x="40.5" y="46.7" font-size="2.5" fill="#000">01.11.2026</text><text x="62.5" y="46.7" font-size="2.5" fill="#000">л. 44 — План отопления</text><text x="62.5" y="50.1" font-size="2.5" fill="#000">л. 92 — Ведомости изделий, техники и</text><text x="62.5" y="53.5" font-size="2.5" fill="#000">фурнитуры</text><text x="62.5" y="56.9" font-size="2.5" fill="#000">л. 109 — Развёртка стены В. Кухня-гостиная</text><text x="62.5" y="60.3" font-size="2.5" fill="#000">(пом. 4)</text><text x="122.5" y="46.7" font-size="2.5" fill="#000">Банкетка Кх7 у окна 2 — экран радиатора РО-6, выведенного листом ОВ</text><text x="122.5" y="50.1" font-size="2.5" fill="#000">900×600 (низ +120, верх +720): прибор под сиденье банкетки не вставал, низ</text><text x="122.5" y="53.5" font-size="2.5" fill="#000">щита сиденья не задан.</text><text x="222.5" y="46.7" font-size="2.5" fill="#000">РО-6 — низкий панельный прибор 1400×200 по ширине окна 2 (привязка 4400, низ +120, верх +320);</text><text x="222.5" y="50.1" font-size="2.5" fill="#000">банкетка Кх7: сиденье +450, низ щита сиденья +400 (верх прибора + 80 мм), решётка в лицевой</text><text x="222.5" y="53.5" font-size="2.5" fill="#000">панели, щель 60 мм у стены. Мощность низкого прибора сверить теплотехническим расчётом ОВ</text><text x="222.5" y="56.9" font-size="2.5" fill="#000">(при нехватке — внутрипольный конвектор у окна).</text><text x="347.5" y="46.7" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 01.11.2026.</text><text x="347.5" y="50.1" font-size="2.5" fill="#000">Предложил: исполнитель (ОВ, мебель).</text></g><line x1="25" y1="63.4" x2="410" y2="63.4" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-8"><text x="32" y="67.1" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-8</text><text x="40.5" y="67.1" font-size="2.5" fill="#000">01.11.2026</text><text x="62.5" y="67.1" font-size="2.5" fill="#000">л. 89 — Остров Кх6 (пом. 4). Чертёж изделия</text><text x="62.5" y="70.5" font-size="2.5" fill="#000">л. 43 — План вентиляции</text><text x="122.5" y="67.1" font-size="2.5" fill="#000">Вытяжка над варочной панелью острова Кх6 не была задана (К-9);</text><text x="122.5" y="70.5" font-size="2.5" fill="#000">предложение исполнителя — островная потолочная вытяжка в режиме</text><text x="122.5" y="73.9" font-size="2.5" fill="#000">рециркуляции — ждало решения.</text><text x="222.5" y="67.1" font-size="2.5" fill="#000">Принято автором (ответ передан координатором): островная потолочная вытяжка 900 мм над Кх6 в</text><text x="222.5" y="70.5" font-size="2.5" fill="#000">режиме рециркуляции (угольный фильтр), низ +1550. Вариант с отводом в вентканал ВК-3 не</text><text x="222.5" y="73.9" font-size="2.5" fill="#000">выбран: короба в потолке нет. После подписи автора вопрос К-9 закрывается, знак предложения</text><text x="222.5" y="77.3" font-size="2.5" fill="#000">снимается. Модель вытяжки не выбрана: крепление к перекрытию и вывод питания на потолке</text><text x="222.5" y="80.7" font-size="2.5" fill="#000">по паспорту модели.</text><text x="347.5" y="67.1" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 01.11.2026.</text><text x="347.5" y="70.5" font-size="2.5" fill="#000">Предложил: Александр Кырлан, решение автора.</text></g><line x1="25" y1="83.8" x2="410" y2="83.8" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-9"><text x="32" y="87.5" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-9</text><text x="40.5" y="87.5" font-size="2.5" fill="#000">01.11.2026</text><text x="62.5" y="87.5" font-size="2.5" fill="#000">л. 28 — План расстановки мебели</text><text x="62.5" y="90.9" font-size="2.5" fill="#000">л. 92 — Ведомости изделий, техники и</text><text x="62.5" y="94.3" font-size="2.5" fill="#000">фурнитуры</text><text x="62.5" y="97.7" font-size="2.5" fill="#000">л. 80 — ТВ-стена Кх12</text><text x="62.5" y="101.1" font-size="2.5" fill="#000">л. 108 — Развёртка стены Б. Кухня-гостиная</text><text x="62.5" y="104.5" font-size="2.5" fill="#000">(пом. 4)</text><text x="122.5" y="87.5" font-size="2.5" fill="#000">Биокамин в ТВ-стене Кх12: модель, мощность, зазоры и приток не заданы</text><text x="122.5" y="90.9" font-size="2.5" fill="#000">(К-13); до ответа нишу камина изготавливать было нельзя.</text><text x="222.5" y="87.5" font-size="2.5" fill="#000">Принято автором (ответ передан координатором): биокамин в ТВ-стене Кх12 остаётся, ниша</text><text x="222.5" y="90.9" font-size="2.5" fill="#000">900×400, низ +350, облицовка негорючая (сталь 2 мм / камень), зазоры 50 мм до панелей. После</text><text x="222.5" y="94.3" font-size="2.5" fill="#000">подписи автора вопрос К-13 «оставлять ли биокамин» закрывается. Модель биокамина не</text><text x="222.5" y="97.7" font-size="2.5" fill="#000">выбрана: зазоры, тепловая мощность и приток воздуха (при мощности &gt; 2 кВт — решение ОВ)</text><text x="222.5" y="101.1" font-size="2.5" fill="#000">уточняются по паспорту модели — пометка на листе остаётся.</text><text x="347.5" y="87.5" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 01.11.2026.</text><text x="347.5" y="90.9" font-size="2.5" fill="#000">Предложил: Александр Кырлан, решение автора.</text></g><line x1="25" y1="107.6" x2="410" y2="107.6" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-10"><text x="32" y="111.3" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-10</text><text x="40.5" y="111.3" font-size="2.5" fill="#000">16.11.2026</text><text x="62.5" y="111.3" font-size="2.5" fill="#000">л. 28 — План расстановки мебели</text><text x="62.5" y="114.7" font-size="2.5" fill="#000">л. 71 — План текстиля и декора</text><text x="62.5" y="118.1" font-size="2.5" fill="#000">л. 68 — Колерная карта</text><text x="62.5" y="121.5" font-size="2.5" fill="#000">л. 70 — Концепция декора и визуализации</text><text x="122.5" y="111.3" font-size="2.5" fill="#000">Приёмка кадров 15.11.2026: в гардеробной-постирочной и в коридоре не</text><text x="122.5" y="114.7" font-size="2.5" fill="#000">читалось ни одного приёма концепции — стены светлые, хранение светлое,</text><text x="122.5" y="118.1" font-size="2.5" fill="#000">цвета и материалов проекта (шалфей, тёмный морёный дуб, латунь, павлиний</text><text x="122.5" y="121.5" font-size="2.5" fill="#000">бархат) в помещениях не было, в концепции они были прямо исключены.</text><text x="222.5" y="111.3" font-size="2.5" fill="#000">Гардеробная-постирочная: система хранения Г1 и шкаф Г2 — морёный тёмный дуб (у Г2 три</text><text x="222.5" y="114.7" font-size="2.5" fill="#000">волнистые рифлёные створки, ручки — латунные планки; штанги и ручки Г1 — латунь); стена А</text><text x="222.5" y="118.1" font-size="2.5" fill="#000">шалфейная (Calke Green, как акцентные стены остальных помещений); у стены А — банкетка Г3</text><text x="222.5" y="121.5" font-size="2.5" fill="#000">900×400 в павлиньем бархате на латунных ножках (единственный бархатный предмет помещения)</text><text x="222.5" y="124.9" font-size="2.5" fill="#000">и два латунных бра Св71, Св72 с плафонами из молочного стекла на линии L6 (3000 K, 400 лм</text><text x="222.5" y="128.3" font-size="2.5" fill="#000">каждое). Коридор: стена А — шалфейная; за скамьёй Кр1 — реечная панель ДС5 из морёного дуба</text><text x="222.5" y="131.7" font-size="2.5" fill="#000">1500 мм до отметки 2300 (рельеф, рейки 30×20 с шагом 60); скамья Кр1 1200×300 (каркас — дуб</text><text x="222.5" y="135.1" font-size="2.5" fill="#000">морёный, сиденье — павлиний бархат, ножки — латунь) оставляет проход 900; над скамьёй</text><text x="222.5" y="138.5" font-size="2.5" fill="#000">чёрно-белая графика ДК13 в тонкой раме из морёного дуба 600×1000 и два латунных бра Св73,</text><text x="222.5" y="141.9" font-size="2.5" fill="#000">Св74 на линии L10 (3000 K). Положение дверей, размеры помещений, инженерные системы и</text><text x="222.5" y="145.3" font-size="2.5" fill="#000">остальные помещения не менялись. Образцы дуба, бархата и латуни не выбраны — позиции</text><text x="222.5" y="148.7" font-size="2.5" fill="#000">описаны характеристиками, артикул выбирается при закупке.</text><text x="347.5" y="111.3" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 16.11.2026.</text><text x="347.5" y="114.7" font-size="2.5" fill="#000">Предложил: исполнитель; предложение</text><text x="347.5" y="118.1" font-size="2.5" fill="#000">проектировщика, утверждено А. С. Кырланом</text><text x="347.5" y="121.5" font-size="2.5" fill="#000">16.11.2026 («все на твое усмотрение и доделай</text><text x="347.5" y="124.9" font-size="2.5" fill="#000">все проекты»).</text></g><line x1="25" y1="151.8" x2="410" y2="151.8" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-11"><text x="32" y="155.5" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-11</text><text x="40.5" y="155.5" font-size="2.5" fill="#000">16.11.2026</text><text x="62.5" y="155.5" font-size="2.5" fill="#000">л. 71 — План текстиля и декора</text><text x="62.5" y="158.9" font-size="2.5" fill="#000">л. 70 — Концепция декора и визуализации</text><text x="122.5" y="155.5" font-size="2.5" fill="#000">Рама графики ДК13 в коридоре — тонкая латунь; концепция проекта запрещает</text><text x="122.5" y="158.9" font-size="2.5" fill="#000">позолоту и яркий золотой хром.</text><text x="222.5" y="155.5" font-size="2.5" fill="#000">Рама графики ДК13 — тонкий морёный дуб, как столярка коридора (панель ДС5, скамья Кр1);</text><text x="222.5" y="158.9" font-size="2.5" fill="#000">размер 600 × 1000 и место над скамьёй не менялись. Латунь в коридоре остаётся в бра и ножках</text><text x="222.5" y="162.3" font-size="2.5" fill="#000">скамьи.</text><text x="347.5" y="155.5" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 16.11.2026.</text><text x="347.5" y="158.9" font-size="2.5" fill="#000">Предложил: исполнитель; предложение</text><text x="347.5" y="162.3" font-size="2.5" fill="#000">проектировщика, утверждено А. С. Кырланом</text><text x="347.5" y="165.7" font-size="2.5" fill="#000">16.11.2026 («все на твое усмотрение и доделай</text><text x="347.5" y="169.1" font-size="2.5" fill="#000">все проекты»).</text></g></g><g data-el="notes"><text x="25" y="184.6" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="189.4" font-size="2.5" fill="#000">1. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text><text x="25" y="192.8" font-size="2.5" fill="#000">2. Графа «Если решения нет» показывает состояние решения на листах; влияние на сроки и стоимость по пунктам не оценивалось.</text><text x="25" y="196.2" font-size="2.5" fill="#000">3. Пункт, по которому принято решение, при следующем выпуске комплекта из таблиц исключается.</text></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">16.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-008-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Квартира с кабинетом</text><text x="297" y="259.2
>2050</text></g><g data-a="r4C8460u5835" data-b="r4C8460u7035" data-dir="h"><line x1="323.31" y1="147.56" x2="323.31" y2="155.06" stroke="#000" stroke-width="0.25"/><line x1="371.31" y1="147.56" x2="371.31" y2="155.06" stroke="#000" stroke-width="0.25"/><line x1="323.31" y1="153.56" x2="371.31" y2="153.56" stroke="#000" stroke-width="0.25"/><line x1="322.25" y1="154.62" x2="324.37" y2="152.5" stroke="#000" stroke-width="0.5"/><line x1="370.25" y1="154.62" x2="372.37" y2="152.5" stroke="#000" stroke-width="0.5"/><text x="347.31" y="152.66" font-size="2.5" text-anchor="middle" fill="#000">1200</text></g><g data-a="r4C8460u7035" data-b="r4C8460u7110" data-dir="h"><line x1="371.31" y1="147.56" x2="371.31" y2="155.06" stroke="#000" stroke-width="0.25"/><line x1="374.31" y1="147.56" x2="374.31" y2="155.06" stroke="#000" stroke-width="0.25"/><line x1="371.31" y1="153.56" x2="374.31" y2="153.56" stroke="#000" stroke-width="0.25"/><line x1="370.25" y1="154.62" x2="372.37" y2="152.5" stroke="#000" stroke-width="0.5"/><line x1="373.25" y1="154.62" x2="375.37" y2="152.5" stroke="#000" stroke-width="0.5"/><g data-el="dim-shelf"><line x1="372.81" y1="153.56" x2="380.31" y2="150.06" stroke="#000" stroke-width="0.25"/><line x1="380.31" y1="150.06" x2="384.11" y2="150.06" stroke="#000" stroke-width="0.25"/><text x="380.81" y="149.46" font-size="2.5" fill="#000">75</text></g></g><g data-a="r4C8460u0" data-b="r4C8460u7110" data-dir="h" data-control="1" data-total="1"><line x1="89.91" y1="147.56" x2="89.91" y2="163.06" stroke="#000" stroke-width="0.25"/><line x1="374.31" y1="147.56" x2="374.31" y2="163.06" stroke="#000" stroke-width="0.25"/><line x1="89.91" y1="161.56" x2="374.31" y2="161.56" stroke="#000" stroke-width="0.25"/><line x1="88.85" y1="162.62" x2="90.97" y2="160.5" stroke="#000" stroke-width="0.5"/><line x1="373.25" y1="162.62" x2="375.37" y2="160.5" stroke="#000" stroke-width="0.5"/><text x="232.11" y="160.66" font-size="2.5" text-anchor="middle" fill="#000">7110</text></g></g></g><g data-el="legend"><text x="25" y="176.06" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><text x="25" y="180.36" font-size="2.5" fill="#000">обозначения этого вида, схема развёрток помещения и ведомость</text><text x="25" y="183.76" font-size="2.5" fill="#000">отделки — на листе 107</text></g><g data-el="ref" data-target="107"/><g data-el="ref-back" data-target="85"/><g data-el="notes"><text x="25" y="238" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="243" font-size="2.5" fill="#000">1. Развёртки — вид на стену изнутри помещения, по часовой стрелке; расположение — на схеме листа 107 и на листе 85; размеры — в мм по чистовым поверхностям;</text><text x="28" y="246.4" font-size="2.5" fill="#000">отметки — в м от ±0,000; высоты Н — от чистого пола помещения до оси изделия, у декора — до центра.</text><text x="25" y="249.8" font-size="2.5" fill="#000">2. Схема мебели, приборов и декора не является технической документацией для производства мебели; габариты — по паспортам изделий.</text><text x="25" y="253.2" font-size="2.5" fill="#000">3. Потолок — у каждой стены свой, по плану потолков (ПТ2); ступени — зоной, кромка короба перед нишей — тонкой линией; в поле потолка: ПТ1 +2,500.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="65" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="65" y1="285.5" x2="65" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="67" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4 К-6" data-level="0"><text x="25.5" y="268.5" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="271.9" font-size="2.5" fill="#000">Основа листа: размеры сняты с растрового плана заказчика с частичными размерами: рисунок не в масштабе, помещения выровнены по подписанным размерам мебели и проходов;</text><text x="25.5" y="275.3" font-size="2.5" fill="#000">контрольный обмер не выполнен (К-1); высота потолка 2700 мм принята: на плане заказчика её нет (К-2); толщины стен 300 / 120 мм приняты по плану заказчика, не замерены (К-1);</text><text x="25.5" y="278.7" font-size="2.5" fill="#000">разрешённая мощность 15 кВт принята по типовым ТУ для квартиры, ТУ заказчиком не переданы (К-4); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-6).</text><text x="25.5" y="282.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1, К-2, К-4, К-6).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke
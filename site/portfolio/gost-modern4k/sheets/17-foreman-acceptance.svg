<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Чек-лист приёмки по этапам. Лист 1 из 4" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Чек-лист приёмки по этапам. Лист 1 из 4</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">По этапам Р-1…Р-N: что проверить, чем, какой допуск и какой акт подписать до закрытия работы</text><g data-el="acceptance"><g data-el="acc-table"><text x="25" y="35.4" font-size="3.5" font-weight="700" fill="#000">Приёмка по этапам: контрольные точки, допуски и акты скрытых работ</text><rect x="25" y="38" width="385" height="150.6" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="48" x2="410" y2="48" stroke="#000" stroke-width="0.5"/><text x="31" y="43.9" font-size="2.5" text-anchor="middle" fill="#000">Этап</text><line x1="37" y1="38" x2="37" y2="188.6" stroke="#000" stroke-width="0.25"/><text x="62" y="42.2" font-size="2.5" text-anchor="middle" fill="#000">Контрольная точка (дальше не</text><text x="62" y="45.6" font-size="2.5" text-anchor="middle" fill="#000">пускают без подписи)</text><line x1="87" y1="38" x2="87" y2="188.6" stroke="#000" stroke-width="0.25"/><text x="118" y="43.9" font-size="2.5" text-anchor="middle" fill="#000">Что проверяют</text><line x1="149" y1="38" x2="149" y2="188.6" stroke="#000" stroke-width="0.25"/><text x="169" y="43.9" font-size="2.5" text-anchor="middle" fill="#000">Чем</text><line x1="189" y1="38" x2="189" y2="188.6" stroke="#000" stroke-width="0.25"/><text x="222" y="43.9" font-size="2.5" text-anchor="middle" fill="#000">Допуск</text><line x1="255" y1="38" x2="255" y2="188.6" stroke="#000" stroke-width="0.25"/><text x="276" y="43.9" font-size="2.5" text-anchor="middle" fill="#000">Основание</text><line x1="297" y1="38" x2="297" y2="188.6" stroke="#000" stroke-width="0.25"/><text x="308" y="43.9" font-size="2.5" text-anchor="middle" fill="#000">Подпись</text><line x1="319" y1="38" x2="319" y2="188.6" stroke="#000" stroke-width="0.25"/><text x="364.5" y="43.9" font-size="2.5" text-anchor="middle" fill="#000">Акт скрытых работ / документ</text><g data-el="acc-row" data-work="Р-1" data-key="dem" data-n="1"><text x="31" y="51.7" font-size="2.5" text-anchor="middle" fill="#000">Р-1</text><text x="38.5" y="51.7" font-size="2.5" fill="#000">Демонтаж</text><text x="38.5" y="55.1" font-size="2.5" fill="#000">До начала демонтажа: запрошены</text><text x="38.5" y="58.5" font-size="2.5" fill="#000">документы на дом и БТИ</text><text x="88.5" y="51.7" font-size="2.5" fill="#000">Что снимается и что не трогается: покрытия,</text><text x="88.5" y="55.1" font-size="2.5" fill="#000">отделка, дверные блоки; несущие стены и</text><text x="88.5" y="58.5" font-size="2.5" fill="#000">перегородки — без изменений</text><text x="150.5" y="51.7" font-size="2.5" fill="#000">осмотр по плану демонтажа</text><text x="190.5" y="51.7" font-size="2.5" fill="#000">снятое — только по плану; несущее не затрагивать</text><text x="256.5" y="51.7" font-size="2.5" fill="#000">практика</text><text x="320.5" y="51.7" font-size="2.5" fill="#000">Фото помещений до и после демонтажа; перечень снятого в журнале</text><text x="320.5" y="55.1" font-size="2.5" fill="#000">работ.</text></g><line x1="25" y1="61.6" x2="410" y2="61.6" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-2" data-key="obmer" data-n="1"><text x="31" y="65.3" font-size="2.5" text-anchor="middle" fill="#000">Р-2</text><text x="38.5" y="65.3" font-size="2.5" fill="#000">Контрольный обмер</text><text x="38.5" y="68.7" font-size="2.5" fill="#000">Контрольный обмер на голых стенах</text><text x="38.5" y="72.1" font-size="2.5" fill="#000">сделан до заказа всего, что делают по</text><text x="38.5" y="75.5" font-size="2.5" fill="#000">размеру</text><text x="88.5" y="65.3" font-size="2.5" fill="#000">Размеры помещений и проёмов, диагонали,</text><text x="88.5" y="68.7" font-size="2.5" fill="#000">положение стояков, щитка, каналов, толщины</text><text x="88.5" y="72.1" font-size="2.5" fill="#000">стен</text><text x="150.5" y="65.3" font-size="2.5" fill="#000">рулетка, лазерный</text><text x="150.5" y="68.7" font-size="2.5" fill="#000">дальномер, уровень</text><text x="190.5" y="65.3" font-size="2.5" fill="#000">допуск задаёт проект; расхождение с планом — в</text><text x="190.5" y="68.7" font-size="2.5" fill="#000">перечень открытых вопросов до заказа</text><text x="256.5" y="65.3" font-size="2.5" fill="#000">практика</text><text x="320.5" y="65.3" font-size="2.5" fill="#000">Протокол контрольного обмера с эскизом; расхождения занесены в</text><text x="320.5" y="68.7" font-size="2.5" fill="#000">открытые вопросы.</text></g><line x1="25" y1="78.6" x2="410" y2="78.6" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-3" data-key="el" data-n="1"><text x="31" y="82.3" font-size="2.5" text-anchor="middle" fill="#000">Р-3</text><text x="38.5" y="82.3" font-size="2.5" fill="#000">Черновая электрика</text><text x="38.5" y="85.7" font-size="2.5" fill="#000">Черновая электрика: трассы, высоты</text><text x="38.5" y="89.1" font-size="2.5" fill="#000">подрозетников, замер изоляции</text><text x="38.5" y="92.5" font-size="2.5" fill="#000">подписаны до заделки</text><text x="88.5" y="82.3" font-size="2.5" fill="#000">Сопротивление изоляции проводки (цепи до</text><text x="88.5" y="85.7" font-size="2.5" fill="#000">1000 В)</text><text x="150.5" y="82.3" font-size="2.5" fill="#000">мегаомметр</text><text x="190.5" y="82.3" font-size="2.5" fill="#000">не менее 0,5 МОм</text><text x="256.5" y="82.3" font-size="2.5" fill="#000">норматив (ПУЭ, гл. 1.8)</text><text x="320.5" y="82.3" font-size="2.5" fill="#000">Акт скрытых работ на трассы проводки и слаботочные линии до</text><text x="320.5" y="85.7" font-size="2.5" fill="#000">закрытия штукатуркой и ГКЛ; исполнительная схема трасс с</text><text x="320.5" y="89.1" font-size="2.5" fill="#000">привязками; заземление и уравнивание потенциалов в санузле</text><text x="320.5" y="92.5" font-size="2.5" fill="#000">протокол и фото.</text></g><line x1="25" y1="95.6" x2="410" y2="95.6" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-3" data-key="el" data-n="2"><text x="88.5" y="99.3" font-size="2.5" fill="#000">Целостность и маркировка: PE</text><text x="88.5" y="102.7" font-size="2.5" fill="#000">жёлто-зелёный, N — синий, L — прочие цвета</text><text x="150.5" y="99.3" font-size="2.5" fill="#000">визуально, прозвонка</text><text x="190.5" y="99.3" font-size="2.5" fill="#000">каждый проводник промаркирован</text><text x="256.5" y="99.3" font-size="2.5" fill="#000">практика</text></g><line x1="25" y1="105.8" x2="410" y2="105.8" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-3" data-key="el" data-n="3"><text x="88.5" y="109.5" font-size="2.5" fill="#000">Высоты подрозетников и привязки — по плану</text><text x="88.5" y="112.9" font-size="2.5" fill="#000">розеток и выключателей</text><text x="150.5" y="109.5" font-size="2.5" fill="#000">рулетка, уровень</text><text x="190.5" y="109.5" font-size="2.5" fill="#000">по проекту; от чистого пола</text><text x="256.5" y="109.5" font-size="2.5" fill="#000">практика</text></g><line x1="25" y1="116" x2="410" y2="116" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-4" data-key="vk" data-n="1"><text x="31" y="119.7" font-size="2.5" text-anchor="middle" fill="#000">Р-4</text><text x="38.5" y="119.7" font-size="2.5" fill="#000">Черновая сантехника</text><text x="38.5" y="123.1" font-size="2.5" fill="#000">Черновая сантехника: опрессовка,</text><text x="38.5" y="126.5" font-size="2.5" fill="#000">отметки выводов, инсталляции</text><text x="38.5" y="129.9" font-size="2.5" fill="#000">подписаны до зашивки</text><text x="88.5" y="119.7" font-size="2.5" fill="#000">Опрессовка водоснабжения: рабочее давление</text><text x="88.5" y="123.1" font-size="2.5" fill="#000">до 0,6 МПа — испытание 0,9 МПа; выше 0,6</text><text x="88.5" y="126.5" font-size="2.5" fill="#000">МПа — по расчёту</text><text x="150.5" y="119.7" font-size="2.5" fill="#000">опрессовочный насос,</text><text x="150.5" y="123.1" font-size="2.5" fill="#000">манометр</text><text x="190.5" y="119.7" font-size="2.5" fill="#000">выдержка 10 мин (поквартирная); падение: пластик</text><text x="190.5" y="123.1" font-size="2.5" fill="#000">не более 0,06 МПа за 30 мин, сталь не более 0,05</text><text x="190.5" y="126.5" font-size="2.5" fill="#000">МПа за 10 мин</text><text x="256.5" y="119.7" font-size="2.5" fill="#000">практика (СП 73.13330)</text><text x="320.5" y="119.7" font-size="2.5" fill="#000">Акт опрессовки (давление, время, результат); акт скрытых работ на</text><text x="320.5" y="123.1" font-size="2.5" fill="#000">трассы в стенах, полу и коробах; инсталляции, скрытые смесители,</text><text x="320.5" y="126.5" font-size="2.5" fill="#000">трапы — фото с рулеткой и отметками.</text></g><line x1="25" y1="133" x2="410" y2="133" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-4" data-key="vk" data-n="2"><text x="88.5" y="136.7" font-size="2.5" fill="#000">Уклон канализации Ø40–50</text><text x="150.5" y="136.7" font-size="2.5" fill="#000">уровень, построитель</text><text x="150.5" y="140.1" font-size="2.5" fill="#000">плоскостей</text><text x="190.5" y="136.7" font-size="2.5" fill="#000">не менее 20 мм на 1 м</text><text x="256.5" y="136.7" font-size="2.5" fill="#000">норматив (СП 30.13330)</text></g><line x1="25" y1="143.2" x2="410" y2="143.2" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-4" data-key="vk" data-n="3"><text x="88.5" y="146.9" font-size="2.5" fill="#000">Протечки в соединениях, сифоны, смесители,</text><text x="88.5" y="150.3" font-size="2.5" fill="#000">гибкая подводка</text><text x="150.5" y="146.9" font-size="2.5" fill="#000">осмотр под давлением,</text><text x="150.5" y="150.3" font-size="2.5" fill="#000">салфетка на стыках</text><text x="190.5" y="146.9" font-size="2.5" fill="#000">нет капель и влажных следов в контрольное время</text><text x="256.5" y="146.9" font-size="2.5" fill="#000">практика</text></g><line x1="25" y1="153.4" x2="410" y2="153.4" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-4" data-key="vk" data-n="4"><text x="88.5" y="157.1" font-size="2.5" fill="#000">Отметки выводов и положение инсталляций</text><text x="88.5" y="160.5" font-size="2.5" fill="#000">до зашивки и гидроизоляции</text><text x="150.5" y="157.1" font-size="2.5" fill="#000">рулетка в кадре, фото</text><text x="190.5" y="157.1" font-size="2.5" fill="#000">по листу выводов</text><text x="256.5" y="157.1" font-size="2.5" fill="#000">практика</text></g><line x1="25" y1="163.6" x2="410" y2="163.6" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-5" data-key="plaster" data-n="1"><text x="31" y="167.3" font-size="2.5" text-anchor="middle" fill="#000">Р-5</text><text x="38.5" y="167.3" font-size="2.5" fill="#000">Штукатурка</text><text x="38.5" y="170.7" font-size="2.5" fill="#000">Маяки стен проверены до штукатурки;</text><text x="38.5" y="174.1" font-size="2.5" fill="#000">коробки скрытых дверей стоят до</text><text x="38.5" y="177.5" font-size="2.5" fill="#000">штукатурки</text><text x="88.5" y="167.3" font-size="2.5" fill="#000">Отклонение от вертикали (простая / улучшенная</text><text x="88.5" y="170.7" font-size="2.5" fill="#000">/ высококачественная штукатурка)</text><text x="150.5" y="167.3" font-size="2.5" fill="#000">отвес, лазерный уровень</text><text x="190.5" y="167.3" font-size="2.5" fill="#000">3 / 2 / 1 мм на 1 м; не более 15 / 10 / 5 мм на</text><text x="190.5" y="170.7" font-size="2.5" fill="#000">высоту</text><text x="256.5" y="167.3" font-size="2.5" fill="#000">практика (СП 71.13330.2017)</text><text x="320.5" y="167.3" font-size="2.5" fill="#000">Фото коробок скрытых дверей с отметкой чистого пола — до</text><text x="320.5" y="170.7" font-size="2.5" fill="#000">штукатурки; класс штукатурки (простая / улучшенная /</text><text x="320.5" y="174.1" font-size="2.5" fill="#000">высококачественная) назван в договоре.</text></g><line x1="25" y1="180.6" x2="410" y2="180.6" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-5" data-key="plaster" data-n="2"><text x="88.5" y="184.3" font-size="2.5" fill="#000">Отклонение от горизонтали</text><text x="150.5" y="184.3" font-size="2.5" fill="#000">уровень, правило</text><text x="190.5" y="184.3" font-size="2.5" fill="#000">3 / 2 / 1 мм на 1 м; не более 15 / 10 / 5 мм на длину</text><text x="256.5" y="184.3" font-size="2.5" fill="#000">практика (СП 71.13330.2017)</text></g></g></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4 К-6" data-level="0"><text x="25.5" y="275.5" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">Основа листа: размеры сняты с растрового плана заказчика с частичными размерами: рисунок не в масштабе, помещения выровнены по подписанным размерам мебели и проходов;</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">контрольный обмер не выполнен (К-1); высота потолка 2700 мм принята: на плане заказчика её нет (К-2); толщины стен 300 / 120 мм приняты по плану заказчика, не замерены (К-1);</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">разрешённая мощность 15 кВт принята по типовым ТУ для квартиры, ТУ заказчиком не переданы (К-4); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-6).</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 7, записи К-1, К-2, К-4, К-6).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="2
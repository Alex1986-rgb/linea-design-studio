<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Открытые вопросы, принятые допущения и конфликты. Лист 2 из 4" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты. Лист 2 из 4</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации (стартовое совещание 18.10.2026)</text><g data-el="open-issues" data-plan="fixed" data-plan-declared="4"><g data-el="issues-questions"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Открытые вопросы и принятые допущения (продолжение)</text><rect x="25" y="33" width="385" height="149.4" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="32" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="33" x2="39" y2="182.4" stroke="#000" stroke-width="0.25"/><text x="122" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Формулировка</text><line x1="205" y1="33" x2="205" y2="182.4" stroke="#000" stroke-width="0.25"/><text x="220" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Вид</text><line x1="235" y1="33" x2="235" y2="182.4" stroke="#000" stroke-width="0.25"/><text x="253" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Кто решает</text><line x1="271" y1="33" x2="271" y2="182.4" stroke="#000" stroke-width="0.25"/><text x="309.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Если решения нет</text><line x1="348" y1="33" x2="348" y2="182.4" stroke="#000" stroke-width="0.25"/><text x="379" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Лист, где это проявляется</text><g data-el="issue-row" data-kind="question" data-id="К-10"><text x="32" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">К-10</text><text x="40.5" y="46.7" font-size="2.5" fill="#000">Душ П10 с трапом (пом. 9, санузел гостевой, по плану заказчика — «душ с трапом и стеклянной перегородкой»): в стяжке 35 мм с</text><text x="40.5" y="50.1" font-size="2.5" fill="#000">облицовкой 14 мм трап не встаёт — монтажная высота трапа ≈ 90 мм от плиты до верха решётки (по паспорту модели) + уклон</text><text x="40.5" y="53.5" font-size="2.5" fill="#000">отвода Ø50 кратчайшим путём вдоль стен до стояка Ст К1-1 (3,11 м × 25 мм/м = 78 мм) = 168 мм при врезке на уровне плиты; врезка</text><text x="40.5" y="56.9" font-size="2.5" fill="#000">выше плиты поднимает подиум на столько же — отметку врезки замерить (К-1). Предложение проектировщика: душевая зона 900 ×</text><text x="40.5" y="60.3" font-size="2.5" fill="#000">1640 у стены В, подиум 120 мм у трапа (решётка +0,105), ступень по открытому краю 127 мм (уклон 15 мм/м к трапу); гидроизоляция</text><text x="40.5" y="63.7" font-size="2.5" fill="#000">по плите под подиумом и по подиуму, весь санузел; отвод от трапа в подиуме — к стене, за краем подиума — в коробе 160×110</text><text x="40.5" y="67.1" font-size="2.5" fill="#000">вдоль стены до стояка (узел 1 на схеме разводки); смеситель — 1100 мм от пола душа. Расстановкой не решено: край подиума — в</text><text x="40.5" y="70.5" font-size="2.5" fill="#000">100 мм от проёма Д-7; не помогает: та же зона глубиной 800 — край в 200 мм; зона 900 × 900 в углу В/Г — край в 100 мм. Решить:</text><text x="40.5" y="73.9" font-size="2.5" fill="#000">(а) зона 900 × 900 в углу В/Б — край в 747 мм от проёма, подиум 110 мм у трапа, ступень 117 мм, отвод 2,74 м; у проёма остаётся</text><text x="40.5" y="77.3" font-size="2.5" fill="#000">пол 740 × 900; кадры визуализации санузла перерисовать; (б) проём Д-7 сдвинуть от зоны (решение архитектора, обмер К-1); (в)</text><text x="40.5" y="80.7" font-size="2.5" fill="#000">оставить зону как есть: ступень у проёма осознанно, кромка ступени контрастная, подсветка у пола. Альтернативы по высоте: низкий</text><text x="40.5" y="84.1" font-size="2.5" fill="#000">поддон на ножках (сифон над полом), сверхплоский трап от 70 мм (подиум 100 мм) или подъём пола всего санузла с порогом.</text><text x="206.5" y="46.7" font-size="2.5" fill="#000">Спорно</text><text x="206.5" y="50.1" font-size="2.5" fill="#000">Ждёт: обмера, затем</text><text x="206.5" y="53.5" font-size="2.5" fill="#000">решения</text><text x="236.5" y="46.7" font-size="2.5" fill="#000">Инженер ВК (вода,</text><text x="236.5" y="50.1" font-size="2.5" fill="#000">канализация)</text><text x="272.5" y="46.7" font-size="2.5" fill="#000">трап и подиум не выполнять, пол санузла 9 до решения не</text><text x="272.5" y="50.1" font-size="2.5" fill="#000">стяжать; гидроизоляцию — по листу</text><text x="349.5" y="46.7" font-size="2.5" fill="#000">л. 45 — План выводов сантехники</text><text x="349.5" y="50.1" font-size="2.5" fill="#000">л. 46 — Схема разводки водопровода и</text><text x="349.5" y="53.5" font-size="2.5" fill="#000">канализации</text><text x="349.5" y="56.9" font-size="2.5" fill="#000">л. 65 — План полов</text></g><line x1="25" y1="87.2" x2="410" y2="87.2" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-11"><text x="32" y="90.9" font-size="2.5" text-anchor="middle" fill="#000">К-11</text><text x="40.5" y="90.9" font-size="2.5" fill="#000">Ванна П1 отдельностоящая со смесителем напольным (пом. 7, ванная, по заказчику): подвод ХВ и ГВ к стойке и выпуск Ø50 идут из</text><text x="40.5" y="94.3" font-size="2.5" fill="#000">пола, а стяжка ванной 35 мм их не укрывает — под водопровод Ø20 в полу нужно ≥ 65 мм (Ø + 45, СП 29.13330, п. 8.2), под выпуск</text><text x="40.5" y="97.7" font-size="2.5" fill="#000">Ø50 до стояка Ст К1-2 (3,6 м × 25 мм/м = 90 мм) — ≥ 185 мм. Решить: (а) подъём пола ванной до 185 мм (порог у двери, пересчёт</text><text x="40.5" y="101.1" font-size="2.5" fill="#000">высот выводов и развёрток), (б) смеситель настенный на стене В (выводы ХВ, ГВ на стене) и выпуск ванны к стене открытым</text><text x="40.5" y="104.5" font-size="2.5" fill="#000">сифоном, (в) смеситель на борт ванны. Место стойки на листах — предложение проектировщика.</text><text x="206.5" y="90.9" font-size="2.5" fill="#000">Спорно</text><text x="206.5" y="94.3" font-size="2.5" fill="#000">Ждёт: решения</text><text x="236.5" y="90.9" font-size="2.5" fill="#000">Инженер ВК (вода,</text><text x="236.5" y="94.3" font-size="2.5" fill="#000">канализация)</text><text x="272.5" y="90.9" font-size="2.5" fill="#000">выводы и выпуск ванны П1 не выполнять, ванну и</text><text x="272.5" y="94.3" font-size="2.5" fill="#000">смеситель не заказывать; остальные выводы ванной — по</text><text x="272.5" y="97.7" font-size="2.5" fill="#000">листу</text><text x="349.5" y="90.9" font-size="2.5" fill="#000">л. 45 — План выводов сантехники</text><text x="349.5" y="94.3" font-size="2.5" fill="#000">л. 46 — Схема разводки водопровода и</text><text x="349.5" y="97.7" font-size="2.5" fill="#000">канализации</text><text x="349.5" y="101.1" font-size="2.5" fill="#000">л. 53 — Спецификация сантехнического</text><text x="349.5" y="104.5" font-size="2.5" fill="#000">оборудования</text></g><line x1="25" y1="107.6" x2="410" y2="107.6" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-12"><text x="32" y="111.3" font-size="2.5" text-anchor="middle" fill="#000">К-12</text><text x="40.5" y="111.3" font-size="2.5" fill="#000">Проверяющий («Пров.») и нормоконтролёр («Н. контр.») комплекта не назначены: графы штампа пусты на всех листах, данные</text><text x="40.5" y="114.7" font-size="2.5" fill="#000">проекта и данные проекта не заданы. Их заполняет только человек, отличный от разработчика: разработчик подписи за них не</text><text x="40.5" y="118.1" font-size="2.5" fill="#000">ставит. Нужно решение автора — кто проверяет и кто ведёт нормоконтроль (фамилии, разные люди), и дата проверки.</text><text x="206.5" y="111.3" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="114.7" font-size="2.5" fill="#000">Ждёт: решения</text><text x="236.5" y="111.3" font-size="2.5" fill="#000">Нормоконтролёр</text><text x="272.5" y="111.3" font-size="2.5" fill="#000">графы «Пров.» и «Н. контр.» остаются пустыми; комплект</text><text x="272.5" y="114.7" font-size="2.5" fill="#000">предварительный, к производству работ не выдаётся</text><text x="349.5" y="111.3" font-size="2.5" fill="#000">л. 2 — Общие данные</text></g><line x1="25" y1="121.2" x2="410" y2="121.2" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-17"><text x="32" y="124.9" font-size="2.5" text-anchor="middle" fill="#000">К-17</text><text x="40.5" y="124.9" font-size="2.5" fill="#000">Циркуляция ГВС в данных не задана — циркуляционного трубопровода на схеме нет. Решить: нужна ли циркуляция</text><text x="206.5" y="124.9" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="128.3" font-size="2.5" fill="#000">Ждёт: решения</text><text x="236.5" y="124.9" font-size="2.5" fill="#000">Инженер ВК (вода,</text><text x="236.5" y="128.3" font-size="2.5" fill="#000">канализация)</text><text x="272.5" y="124.9" font-size="2.5" fill="#000">циркуляции на схеме нет</text><text x="349.5" y="124.9" font-size="2.5" fill="#000">л. 50–52 — Развёртки мокрых зон: выводы ВК.</text><text x="349.5" y="128.3" font-size="2.5" fill="#000">Кухня-гостиная</text><text x="349.5" y="131.7" font-size="2.5" fill="#000">л. 47 — Аксонометрическая схема В1 (холодное</text><text x="349.5" y="135.1" font-size="2.5" fill="#000">водоснабжение)</text><text x="349.5" y="138.5" font-size="2.5" fill="#000">л. 46 — Схема разводки водопровода и</text><text x="349.5" y="141.9" font-size="2.5" fill="#000">канализации</text></g><line x1="25" y1="145" x2="410" y2="145" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-19"><text x="32" y="148.7" font-size="2.5" text-anchor="middle" fill="#000">К-19</text><text x="40.5" y="148.7" font-size="2.5" fill="#000">Кухня-гостиная (пом. 4, 45,5 м², два окна): мощность приборов не подтверждена расчётом — РО-5 500×600 (вынесен из модулей,</text><text x="40.5" y="152.1" font-size="2.5" fill="#000">ИЗ-6) и низкий РО-6 1400×200 под банкеткой-экраном (ИЗ-7, теплоотдача за экраном снижается). Нужен теплотехнический расчёт</text><text x="40.5" y="155.5" font-size="2.5" fill="#000">помещения (теплопотери через наружные стены и окна, параметры теплоносителя дома). При нехватке — вертикальный прибор на</text><text x="40.5" y="158.9" font-size="2.5" fill="#000">месте РО-5 или внутрипольный конвектор у окна 2 (решение ОВ).</text><text x="206.5" y="148.7" font-size="2.5" fill="#000">Отсутствует</text><text x="236.5" y="148.7" font-size="2.5" fill="#000">Инженер ОВ</text><text x="272.5" y="148.7" font-size="2.5" fill="#000">РО-5 и РО-6 не заказывать до расчёта; места, подводки и</text><text x="272.5" y="152.1" font-size="2.5" fill="#000">экран — по листам</text><text x="349.5" y="148.7" font-size="2.5" fill="#000">л. 44 — План отопления</text></g><line x1="25" y1="162" x2="410" y2="162" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-20"><text x="32" y="165.7" font-size="2.5" text-anchor="middle" fill="#000">К-20</text><text x="40.5" y="165.7" font-size="2.5" fill="#000">ТВ-стена Кх12: низ ниши ТВ (+900) — в 150 мм над верхом ниши биокамина (+750). Телевизор и приставка на полке над топкой</text><text x="40.5" y="169.1" font-size="2.5" fill="#000">нагреваются; допустимое расстояние задают паспорта обеих моделей (биокамина — зона нагрева над топкой, телевизора</text><text x="40.5" y="172.5" font-size="2.5" fill="#000">температура эксплуатации). Варианты: (а) выбрать модели и подтвердить расстояние по паспортам; (б) поднять нишу ТВ (низ +1100</text><text x="40.5" y="175.9" font-size="2.5" fill="#000">и выше — центр экрана выше уровня глаз сидящего); (в) развести ниши по ширине стены (камин сбоку от ТВ). Рекомендация</text><text x="40.5" y="179.3" font-size="2.5" fill="#000">исполнителя — (а), при нехватке расстояния — (б).</text><text x="206.5" y="165.7" font-size="2.5" fill="#000">Спорно</text><text x="206.5" y="169.1" font-size="2.5" fill="#000">Ждёт: решения</text><text x="236.5" y="165.7" font-size="2.5" fill="#000">Мебельщик</text><text x="272.5" y="165.7" font-size="2.5" fill="#000">нишу ТВ не изготавливать до выбора моделей; каркас и</text><text x="272.5" y="169.1" font-size="2.5" fill="#000">облицовку вне ниш — по листу</text><text x="349.5" y="165.7" font-size="2.5" fill="#000">л. 80 — ТВ-стена Кх12</text><text x="349.5" y="169.1" font-size="2.5" fill="#000">л. 108 — Развёртка стены Б. Кухня-гостиная</text><text x="349.5" y="172.5" font-size="2.5" fill="#000">(пом. 4)</text></g></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">16.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-008-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-
ize="2.5" fill="#000">В1-11 Кх3</text><text x="226.75" y="91.86" font-size="2.5" fill="#000">Н=550*</text><text x="222.78" y="131.83" font-size="2.5" fill="#000">В1-8 П11</text><text x="222.78" y="134.83" font-size="2.5" fill="#000">Н=1000</text><text x="215.12" y="83.16" font-size="2.5" fill="#000">В1-10 Кх2</text><text x="215.12" y="86.16" font-size="2.5" fill="#000">Н=600*</text><text x="56.72" y="129.71" font-size="2.5" fill="#000">В1-4 П4</text><text x="56.72" y="132.71" font-size="2.5" fill="#000">Н=1000</text><text x="98.36" y="141.68" font-size="2.5" fill="#1f5fbf">Ø20</text><text x="98.36" y="144.68" font-size="2.5" fill="#1f5fbf">L=4,99</text><text x="209.58" y="96.01" font-size="2.5" fill="#1f5fbf">Ø20</text><text x="209.58" y="99.01" font-size="2.5" fill="#1f5fbf">L=1,25</text></g></g><g data-el="legend-box"><g data-el="legend"><text x="310" y="25" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><line x1="310.5" y1="31" x2="317.5" y2="31" stroke="#1f5fbf" stroke-width="0.5"/><text x="321" y="31.9" font-size="2.5" fill="#000">В1 — водопровод хозяйственно-питьевой (ХВС), PP-R Ø20</text><circle cx="314" cy="36" r="1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/><text x="321" y="36.9" font-size="2.5" fill="#000">вывод В1 (код — в ведомости привязок)</text><circle cx="314" cy="41" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="321" y="41.9" font-size="2.5" fill="#000">стояк «Ст К1-N / Ст В1-N» (ГОСТ 21.601), Ø мм</text><circle cx="314" cy="46" r="1.1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/><text x="321" y="46.9" font-size="2.5" fill="#000">стояк в плане (на отметке пола); вертикаль — стояк по высоте,</text><text x="321" y="50.2" font-size="2.5" fill="#000">разрыв — перекрытие</text><circle cx="314" cy="54.3" r="0.6" fill="#000"/><text x="321" y="55.2" font-size="2.5" fill="#000">тройник (ответвление к прибору)</text><path d="M 312 58 L 316 60.6 L 316 58 L 312 60.6 Z" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="321" y="60.2" font-size="2.5" fill="#000">кран шаровой</text></g></g><g data-el="notes"><text x="25" y="240" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="245" font-size="2.5" fill="#000">1. Схема В1 построена по тем же трассам, что план разводки: положение в плане сохранено, глубина — в масштабе ×0,5. Трассы принципиальные; фактическое</text><text x="25" y="248.6" font-size="2.5" fill="#000">положение фиксируется исполнительной схемой до закрытия.</text><text x="25" y="252.2" font-size="2.5" fill="#000">2. Высоты Н — от чистого пола помещения, мм. Прокладка магистрали В1 по данным: в стяжке пола, в стяжке пола, выше плиты</text><text x="25" y="255.8" font-size="2.5" fill="#000">перекрытия; отметка трасс — по пирогу пола.</text><text x="25" y="259.4" font-size="2.5" fill="#000">3. * — высота вывода принята по практике монтажа; сверить по паспорту прибора.</text><text x="25" y="263" font-size="2.5" fill="#000">4. Узел ввода В1 (кран, фильтр, счётчик, обратный клапан, кран) — на схеме разводки; состав узла ввода — по согласованию. Кран шаровой — на первом</text><text x="25" y="266.6" font-size="2.5" fill="#000">участке от стояка.</text><text x="25" y="270.2" font-size="2.5" fill="#000">5. Трубы испытать давлением до закрытия (акт скрытых работ, опрессовка по СП 73.13330.2016).</text><text x="25" y="273.8" font-size="2.5" fill="#000">6. Диаметры, высоты выводов и места кранов — по паспортам выбранных приборов и расчёту проектной организации.</text><text x="25" y="277.4" font-size="2.5" fill="#000">7. Расчёт систем, диаметры магистралей и подбор оборудования выполняет проектная организация.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="45" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="45" y1="285.5" x2="45" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="47" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4 К-6 К-17" data-level="0"><text x="45.5" y="216.6" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="45.5" y="220" font-size="2.5" fill="#000">Основа листа: размеры сняты с растрового плана заказчика с частичными размерами: рисунок не в масштабе, помещения выровнены по подписанным размерам мебели и проходов; контрольный</text><text x="45.5" y="223.4" font-size="2.5" fill="#000">обмер не выполнен (К-1); высота потолка 2700 мм принята: на плане заказчика её нет (К-2); толщины стен 300 / 120 мм приняты по плану заказчика, не замерены (К-1); разрешённая мощность 15</text><text x="45.5" y="226.8" font-size="2.5" fill="#000">кВт принята по типовым ТУ для квартиры, ТУ заказчиком не переданы (К-4); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-6).</text><text x="45.5" y="230.2" font-size="2.5" fill="#000">Открытые вопросы и конфликты по листу: К-17.</text><text x="45.5" y="233.6" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1, К-2, К-4, К-6; лист 7, запись К-17).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="
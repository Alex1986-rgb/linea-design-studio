chor="middle" fill="#000">между чистовыми гранями: черновой 6400 − отделка 15 / 24</text></g><g data-a="r4D0u0" data-b="r4D0u4385" data-dir="h"><line x1="70.77" y1="175.2" x2="70.77" y2="182.7" stroke="#000" stroke-width="0.25"/><line x1="290.02" y1="175.2" x2="290.02" y2="182.7" stroke="#000" stroke-width="0.25"/><line x1="70.77" y1="181.2" x2="290.02" y2="181.2" stroke="#000" stroke-width="0.25"/><line x1="69.71" y1="182.26" x2="71.83" y2="180.14" stroke="#000" stroke-width="0.5"/><line x1="288.96" y1="182.26" x2="291.08" y2="180.14" stroke="#000" stroke-width="0.5"/><text x="180.4" y="180.3" font-size="2.5" text-anchor="middle" fill="#000">4385</text></g><g data-a="r4D0u4385" data-b="r4D0u5585" data-dir="h"><line x1="290.02" y1="175.2" x2="290.02" y2="182.7" stroke="#000" stroke-width="0.25"/><line x1="350.02" y1="175.2" x2="350.02" y2="182.7" stroke="#000" stroke-width="0.25"/><line x1="290.02" y1="181.2" x2="350.02" y2="181.2" stroke="#000" stroke-width="0.25"/><line x1="288.96" y1="182.26" x2="291.08" y2="180.14" stroke="#000" stroke-width="0.5"/><line x1="348.96" y1="182.26" x2="351.08" y2="180.14" stroke="#000" stroke-width="0.5"/><text x="320.02" y="180.3" font-size="2.5" text-anchor="middle" fill="#000">1200</text></g><g data-a="r4D0u5585" data-b="r4D0u6361" data-dir="h"><line x1="350.02" y1="175.2" x2="350.02" y2="182.7" stroke="#000" stroke-width="0.25"/><line x1="388.82" y1="175.2" x2="388.82" y2="182.7" stroke="#000" stroke-width="0.25"/><line x1="350.02" y1="181.2" x2="388.82" y2="181.2" stroke="#000" stroke-width="0.25"/><line x1="348.96" y1="182.26" x2="351.08" y2="180.14" stroke="#000" stroke-width="0.5"/><line x1="387.76" y1="182.26" x2="389.88" y2="180.14" stroke="#000" stroke-width="0.5"/><text x="369.42" y="180.3" font-size="2.5" text-anchor="middle" fill="#000">776</text></g><g data-a="r4D0u0" data-b="r4D0u6361" data-dir="h" data-control="1" data-total="1"><line x1="70.77" y1="175.2" x2="70.77" y2="190.7" stroke="#000" stroke-width="0.25"/><line x1="388.82" y1="175.2" x2="388.82" y2="190.7" stroke="#000" stroke-width="0.25"/><line x1="70.77" y1="189.2" x2="388.82" y2="189.2" stroke="#000" stroke-width="0.25"/><line x1="69.71" y1="190.26" x2="71.83" y2="188.14" stroke="#000" stroke-width="0.5"/><line x1="387.76" y1="190.26" x2="389.88" y2="188.14" stroke="#000" stroke-width="0.5"/><text x="229.8" y="188.3" font-size="2.5" text-anchor="middle" fill="#000">6361</text></g></g></g><g data-el="legend"><text x="25" y="203.7" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><text x="25" y="208" font-size="2.5" fill="#000">обозначения этого вида, схема развёрток помещения и ведомость</text><text x="25" y="211.4" font-size="2.5" fill="#000">отделки — на листе 99</text></g><g data-el="ref" data-target="99"/><g data-el="ref-back" data-target="85"/><g data-el="ref" data-target="98"/><g data-el="notes"><text x="25" y="238" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="243" font-size="2.5" fill="#000">1. Развёртки — вид на стену изнутри помещения, по часовой стрелке; расположение — на схеме листа 99 и на листе 85; размеры — в мм по чистовым поверхностям;</text><text x="28" y="246.4" font-size="2.5" fill="#000">отметки — в м от ±0,000; высоты Н — от чистого пола помещения до оси изделия, у декора — до центра.</text><text x="25" y="249.8" font-size="2.5" fill="#000">2. Стена Г показана двумя видами: здесь — архитектурная развёртка (мебель, отделка, проёмы, высоты), электроточки и выводы ВК с привязками и таблицей — на</text><text x="28" y="253.2" font-size="2.5" fill="#000">листе 98 («Привязки»).</text><text x="25" y="256.6" font-size="2.5" fill="#000">3. Схема мебели, приборов и декора не является технической документацией для производства мебели; габариты — по паспортам изделий.</text><text x="25" y="260" font-size="2.5" fill="#000">4. Картины и зеркала крепить к основанию по паспорту изделия (закладные и анкеры — в перечне скрытых работ); крест — ось центра предмета.</text><text x="25" y="263.4" font-size="2.5" fill="#000">5. Потолок — у каждой стены свой, по плану потолков (ПТ2); ступени — зоной, кромка короба перед нишей — тонкой линией; в поле потолка: ПТ1 +2,500.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="75" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="75" y1="285.5" x2="75" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="77" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4 К-6" data-level="0"><text x="45.5" y="219" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="45.5" y="222.4" font-size="2.5" fill="#000">Основа листа: размеры сняты с растрового плана заказчика с частичными размерами: рисунок не в масштабе, помещения выровнены по подписанным размерам мебели и проходов; контрольный</text><text x="45.5" y="225.8" font-size="2.5" fill="#000">обмер не выполнен (К-1); высота потолка 2700 мм принята: на плане заказчика её нет (К-2); толщины стен 300 / 120 мм приняты по плану заказчика, не замерены (К-1); разрешённая мощность 15</text><text x="45.5" y="229.2" font-size="2.5" fill="#000">кВт принята по типовым ТУ для квартиры, ТУ заказчиком не переданы (К-4); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-6).</text><text x="45.5" y="232.6" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1, К-2, К-4, К-6).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">04.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-008-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Квартира с кабинетом</text><text x="297" y="259.2" font-size="2.5" data-fit="116" fill="#000">Общая площадь 127,29* м² · * размеры со скана, не замерены (реестр — л. 6–8, К-1)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" data-fit="66" fill="#000">Дизайн-проект интерьера</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">97</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">131</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="282.2" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">Развёртка стены Г. Кухня-гостиная (пом. 4),</text><text x="330" y="286" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">кухонный фронт</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М 1:20</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="47" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="13" data-positions="90" data-basis="5"><rect x="314.27" y="6.2" width="99.23" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="316.27" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 13 (реестр — л. 6–8)</text></g></svg>
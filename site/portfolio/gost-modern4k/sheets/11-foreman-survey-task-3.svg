<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Задание на контрольный обмер и обследование. Лист 3 из 3" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Задание на контрольный обмер и обследование. Лист 3 из 3</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Что замерить, вскрыть и получить до заказа материалов и изделий</text><g data-el="survey-task" data-plan="fixed" data-plan-declared="3"><g data-el="survey-field"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Этап 3. После черновых работ, до чистового пола</text><rect x="25" y="33" width="385" height="54.2" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="31" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="37" y1="33" x2="37" y2="87.2" stroke="#000" stroke-width="0.25"/><text x="62" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Где</text><line x1="87" y1="33" x2="87" y2="87.2" stroke="#000" stroke-width="0.25"/><text x="97" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Способ</text><line x1="107" y1="33" x2="107" y2="87.2" stroke="#000" stroke-width="0.25"/><text x="148" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Что сделать</text><line x1="189" y1="33" x2="189" y2="87.2" stroke="#000" stroke-width="0.25"/><text x="208" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Кто выполняет</text><line x1="227" y1="33" x2="227" y2="87.2" stroke="#000" stroke-width="0.25"/><text x="240" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Точность</text><line x1="253" y1="33" x2="253" y2="87.2" stroke="#000" stroke-width="0.25"/><text x="288" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Что пересчитается в альбоме</text><line x1="323" y1="33" x2="323" y2="87.2" stroke="#000" stroke-width="0.25"/><text x="344" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Чем подтверждается</text><line x1="365" y1="33" x2="365" y2="87.2" stroke="#000" stroke-width="0.25"/><text x="387.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Закрывает вопросы реестра</text><g data-el="survey-row" data-id="О-10" data-key="izdeliya-measure-k20" data-closes="К-20" data-method="measure" data-covers="furniture:Кх12"><text x="31" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">О-10</text><text x="38.5" y="46.7" font-size="2.5" fill="#000" textLength="28.25" lengthAdjust="spacingAndGlyphs">Кухня-гостиная (пом. 4): Кх12*</text><text x="88.5" y="46.7" font-size="2.5" fill="#000">Обмер</text><text x="108.5" y="46.7" font-size="2.5" fill="#000" textLength="57.7" lengthAdjust="spacingAndGlyphs">Положение и габариты по готовым стенам и по месту: Кх12*</text><text x="108.5" y="50.1" font-size="2.5" fill="#000">(тв-стена встроенная 1800×400 h 2500). Принято по проекту,</text><text x="108.5" y="53.5" font-size="2.5" fill="#000">подтвердить на объекте перед заказом и монтажом. Основание</text><text x="108.5" y="56.9" font-size="2.5" fill="#000">допущения: Было: предмет 1800×400 h 500 на отметке 0 — на</text><text x="108.5" y="60.3" font-size="2.5" fill="#000">развёртке стены Б низкий короб у пола. Стало: встроенная</text><text x="108.5" y="63.7" font-size="2.5" fill="#000">ТВ-стена до потолка — каркас на стене и облицовка панелями, с</text><text x="108.5" y="67.1" font-size="2.5" fill="#000">нишами ТВ и биокамина; размеры и отметки ниш, облицовка</text><text x="108.5" y="70.5" font-size="2.5" fill="#000">ниши камина и каркас — предложение исполнителя (ИЗ-5),</text><text x="108.5" y="73.9" font-size="2.5" fill="#000">заказчиком не утверждены. Биокамин — оборудование: модель,</text><text x="108.5" y="77.3" font-size="2.5" fill="#000">мощность, зазоры по паспорту и приток — вопрос К-13;</text><text x="108.5" y="80.7" font-size="2.5" fill="#000">биокамин оставлен решением автора (ИЗ-9); модель не выбрана</text><text x="108.5" y="84.1" font-size="2.5" fill="#000">— зазоры и приток по паспорту..</text><text x="190.5" y="46.7" font-size="2.5" fill="#000">Архитектор</text><text x="228.5" y="46.7" font-size="2.5" fill="#000">±5 мм</text><text x="254.5" y="46.7" font-size="2.5" fill="#000">Габариты и привязки предметов на планах</text><text x="254.5" y="50.1" font-size="2.5" fill="#000">расстановки и развёртках; выводы электрики и ВК,</text><text x="254.5" y="53.5" font-size="2.5" fill="#000">если они привязаны к предмету.</text><text x="254.5" y="56.9" font-size="2.5" fill="#000">Листы:</text><text x="254.5" y="60.3" font-size="2.5" fill="#000">л. 20 — План расстановки мебели</text><text x="324.5" y="46.7" font-size="2.5" fill="#000">акт контрольного обмера</text><text x="366.5" y="46.7" font-size="2.5" fill="#000">К-20</text><text x="366.5" y="50.1" font-size="2.5" fill="#000">Результат принимает: Мебельщик</text></g></g><g data-el="survey-offsite"><text x="25" y="99.6" font-size="3.5" font-weight="700" fill="#000">Документы и данные закупки (не на объекте)</text><rect x="25" y="102.2" width="385" height="50.8" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="112.2" x2="410" y2="112.2" stroke="#000" stroke-width="0.5"/><text x="31" y="108.1" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="37" y1="102.2" x2="37" y2="153" stroke="#000" stroke-width="0.25"/><text x="62" y="108.1" font-size="2.5" text-anchor="middle" fill="#000">У кого, откуда</text><line x1="87" y1="102.2" x2="87" y2="153" stroke="#000" stroke-width="0.25"/><text x="97" y="108.1" font-size="2.5" text-anchor="middle" fill="#000">Способ</text><line x1="107" y1="102.2" x2="107" y2="153" stroke="#000" stroke-width="0.25"/><text x="149" y="108.1" font-size="2.5" text-anchor="middle" fill="#000">Что получить</text><line x1="191" y1="102.2" x2="191" y2="153" stroke="#000" stroke-width="0.25"/><text x="219" y="108.1" font-size="2.5" text-anchor="middle" fill="#000">К какому сроку</text><line x1="247" y1="102.2" x2="247" y2="153" stroke="#000" stroke-width="0.25"/><text x="285" y="108.1" font-size="2.5" text-anchor="middle" fill="#000">Что пересчитается в альбоме</text><line x1="323" y1="102.2" x2="323" y2="153" stroke="#000" stroke-width="0.25"/><text x="344" y="108.1" font-size="2.5" text-anchor="middle" fill="#000">Чем подтверждается</text><line x1="365" y1="102.2" x2="365" y2="153" stroke="#000" stroke-width="0.25"/><text x="387.5" y="108.1" font-size="2.5" text-anchor="middle" fill="#000">Закрывает вопросы реестра</text><g data-el="survey-row" data-id="О-11" data-key="tu-moshchnost" data-closes="К-4" data-method="document" data-covers="basis:power"><text x="31" y="115.9" font-size="2.5" text-anchor="middle" fill="#000">О-11</text><text x="38.5" y="115.9" font-size="2.5" fill="#000">Заказчик; организация, выдавшая</text><text x="38.5" y="119.3" font-size="2.5" fill="#000">технические условия</text><text x="88.5" y="115.9" font-size="2.5" fill="#000">Документ</text><text x="108.5" y="115.9" font-size="2.5" fill="#000">Технические условия на присоединение: разрешённая мощность.</text><text x="192.5" y="115.9" font-size="2.5" fill="#000">До утверждения однолинейной схемы щита</text><text x="248.5" y="115.9" font-size="2.5" fill="#000">Однолинейная схема щита: вводной аппарат и группы.</text><text x="248.5" y="119.3" font-size="2.5" fill="#000">Листы:</text><text x="248.5" y="122.7" font-size="2.5" fill="#000">л. 2–5 — Общие данные</text><text x="324.5" y="115.9" font-size="2.5" fill="#000">копия документа</text><text x="366.5" y="115.9" font-size="2.5" fill="#000">К-4</text><text x="366.5" y="119.3" font-size="2.5" fill="#000">Результат принимает:</text><text x="366.5" y="122.7" font-size="2.5" fill="#000">Инженер-электрик</text></g><line x1="25" y1="125.8" x2="410" y2="125.8" stroke="#000" stroke-width="0.25"/><g data-el="survey-row" data-id="О-12" data-key="bti-plan" data-closes="К-5" data-method="document" data-covers=""><text x="31" y="129.5" font-size="2.5" text-anchor="middle" fill="#000">О-12</text><text x="38.5" y="129.5" font-size="2.5" fill="#000">вся квартира</text><text x="88.5" y="129.5" font-size="2.5" fill="#000">Документ</text><text x="108.5" y="129.5" font-size="2.5" fill="#000">Поэтажный план БТИ и техническое заключение о несущих</text><text x="108.5" y="132.9" font-size="2.5" fill="#000">стенах.</text><text x="192.5" y="129.5" font-size="2.5" fill="#000">до демонтажа и возведения перегородок</text><text x="248.5" y="129.5" font-size="2.5" fill="#000">монтажный план, проёмы, развёртки</text><text x="248.5" y="132.9" font-size="2.5" fill="#000">Листы:</text><text x="248.5" y="136.3" font-size="2.5" fill="#000">л. 15 — Обмерный план</text><text x="324.5" y="129.5" font-size="2.5" fill="#000">копия документа</text><text x="366.5" y="129.5" font-size="2.5" fill="#000">К-5</text><text x="366.5" y="132.9" font-size="2.5" fill="#000">Результат принимает: Архитектор</text></g><line x1="25" y1="139.4" x2="410" y2="139.4" stroke="#000" stroke-width="0.25"/><g data-el="survey-row" data-id="О-13" data-key="climate-zone" data-closes="К-6" data-method="document" data-covers=""><text x="31" y="143.1" font-size="2.5" text-anchor="middle" fill="#000">О-13</text><text x="38.5" y="143.1" font-size="2.5" fill="#000">адрес объекта, СП 131.13330</text><text x="88.5" y="143.1" font-size="2.5" fill="#000">Документ</text><text x="108.5" y="143.1" font-size="2.5" fill="#000">Климатический подрайон по СП 131.13330 (по адресу объекта)</text><text x="192.5" y="143.1" font-size="2.5" fill="#000">до заказа каркаса потолков</text><text x="248.5" y="143.1" font-size="2.5" fill="#000">план потолков, разрезы, ведомость объёмов</text><text x="248.5" y="146.5" font-size="2.5" fill="#000">Листы:</text><text x="248.5" y="149.9" font-size="2.5" fill="#000">л. 48 — План потолков</text><text x="324.5" y="143.1" font-size="2.5" fill="#000">копия документа</text><text x="366.5" y="143.1" font-size="2.5" fill="#000">К-6</text><text x="366.5" y="146.5" font-size="2.5" fill="#000">Результат принимает: Архитектор</text></g></g><g data-el="notes"><text x="25" y="165.4" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="170.2" font-size="2.5" fill="#000">1. Подтверждение: акт контрольного обмера (дата, кто присутствовал, прибор, перечень промеров с результатами, подписи присутствующих); к акту — фото вскрытий и узлов и техническое заключение организации, выполнившей обследование.</text><text x="25" y="173.6" font-size="2.5" fill="#000">2. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text><text x="25" y="177" font-size="2.5" fill="#000">3. Пункт исключается из задания при следующем выпуске, когда акт подписан, значение внесено в проект и листы перевыпущены; знак «*» у величины снимается только замером.</text></g></g><g data-el="assumed-notes" data-flags="furniture:Кх12" data-ids="ИЗ-5 ИЗ-9 К-1 К-2 К-4 К-6 К-20" data-level="0"><text x="25.5" y="268.7" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="272.1" font-size="2.5" fill="#000">Основа листа: размеры сняты с растрового плана заказчика с частичными размерами: рисунок не в масштабе, помещения выровнены по подписанным размерам мебели и проходов;</text><text x="25.5" y="275.5" font-size="2.5" fill="#000">контрольный обмер не выполнен (К-1); высота потолка 2700 мм принята: на плане заказчика её нет (К-2); толщины стен 300 / 120 мм приняты по плану заказчика, не замерены (К-1);</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">разрешённая мощность 15 кВт принята по типовым ТУ для квартиры, ТУ заказчиком не переданы (К-4); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-6).</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">Знак «*» — принято, не замерено и не подтверждено (замерить на объекте): ИЗ-5, ИЗ-9, К-20: Кх12 — Было: предмет 1800×400 h 500 на отметке 0 — на развёртке стены Б низкий</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">короб у пола.</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1, К-2, К-4, К-6; лист 7, запись К-20; лист 8, записи ИЗ-5, ИЗ-9).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">04.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-008-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Квартира с кабинетом</text><text x="297" y="259.2" font-size="2.5" data-fit="116" fill="#000">Общая площадь 127,29* м² · * размеры со скана, не замерены (реестр — л. 6–8, К-1)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" data-fit="66" fill="#000">Дизайн-проект интерьера</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">11</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">131</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="283.1" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">Задание на контрольный обмер и обследование.</text><text x="330" y="286.9" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">Лист 3 из 3</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="47" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="13" data-positions="90" data-basis="5"><rect x="314.27" y="6.2" width="99.23" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="316.27" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 13 (реестр — л. 6–8)</text></g></svg>
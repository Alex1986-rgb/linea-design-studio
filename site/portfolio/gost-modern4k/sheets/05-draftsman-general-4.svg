1="127" x2="210" y2="127" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="131.95" font-size="2.5" fill="#000">ГД-2026-008-АИ.В21</text><text x="86.5" y="131.95" font-size="2.5" fill="#000">Визуализация. Интерьер: Кабинет (пом. 3), стена А</text></g><line x1="25" y1="135" x2="210" y2="135" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="139.95" font-size="2.5" fill="#000">ГД-2026-008-АИ.В22</text><text x="86.5" y="139.95" font-size="2.5" fill="#000">Визуализация. Интерьер: Кабинет (пом. 3), стена Б</text></g><line x1="25" y1="143" x2="210" y2="143" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="147.95" font-size="2.5" fill="#000">ГД-2026-008-АИ.В23</text><text x="86.5" y="147.95" font-size="2.5" fill="#000">Визуализация. Интерьер: Кабинет (пом. 3), стена Г</text></g><line x1="25" y1="151" x2="210" y2="151" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="156.85" font-size="2.5" fill="#000">ГД-2026-008-АИ.В24</text><text x="86.5" y="155.15" font-size="2.5" fill="#000">Визуализация. Интерьер: Гардеробная-постирочная (пом. 2), общий</text><text x="86.5" y="158.55" font-size="2.5" fill="#000">вид</text></g></g><g data-el="project-composition"><text x="25" y="173.3" font-size="3.5" font-weight="700" fill="#000">Состав дизайн-проекта</text><rect x="25" y="175.8" width="185" height="87.8" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="190.8" x2="210" y2="190.8" stroke="#000" stroke-width="0.5"/><text x="44" y="184.2" font-size="2.5" text-anchor="middle" fill="#000">Раздел</text><line x1="63" y1="175.8" x2="63" y2="263.6" stroke="#000" stroke-width="0.25"/><text x="121.5" y="184.2" font-size="2.5" text-anchor="middle" fill="#000">Состав</text><line x1="180" y1="175.8" x2="180" y2="263.6" stroke="#000" stroke-width="0.25"/><text x="195" y="184.2" font-size="2.5" text-anchor="middle" fill="#000">Листы</text><g><text x="26.5" y="196.65" font-size="2.5" fill="#000">Обложка</text><text x="64.5" y="194.95" font-size="2.5" fill="#000">Дизайн-проект интерьера; Квартира с кабинетом; автор проекта — Кырлан Александр</text><text x="64.5" y="198.35" font-size="2.5" fill="#000">Сергеевич</text><text x="195" y="196.65" font-size="2.5" text-anchor="middle" fill="#000">1 с.</text></g><line x1="25" y1="200.6" x2="210" y2="200.6" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="206.45" font-size="2.5" fill="#000">Концепция</text><text x="64.5" y="204.75" font-size="2.5" fill="#000">Стиль Модерн (ар-нуво) 60 % + Современный (контемпорари) 40 %: концепция</text><text x="64.5" y="208.15" font-size="2.5" fill="#000">интерьера, палитра и материалы (колерная карта — лист 67)</text><text x="195" y="206.45" font-size="2.5" text-anchor="middle" fill="#000">л. 26</text></g><line x1="25" y1="210.4" x2="210" y2="210.4" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="226.45" font-size="2.5" fill="#000">Визуализации</text><text x="64.5" y="214.55" font-size="2.5" fill="#000">24 изобр.: Вид сверху (3D), схематичная модель по плану: мебель, текстиль и декор</text><text x="64.5" y="217.95" font-size="2.5" fill="#000">из данных проекта; Ванная, стена Б; Ванная, стена В; Ванная, стена Г; Санузел</text><text x="64.5" y="221.35" font-size="2.5" fill="#000">гостевой, стена В; Санузел гостевой, общий вид; Спальня, стена А; Спальня, стена</text><text x="64.5" y="224.75" font-size="2.5" fill="#000">Б; Спальня, стена Г; Коридор, стена В; Прихожая, стена Б; Прихожая, стена В;</text><text x="64.5" y="228.15" font-size="2.5" fill="#000">Прихожая, стена Г; Детская, стена А; Детская, стена Б; Детская, стена Г;</text><text x="64.5" y="231.55" font-size="2.5" fill="#000">Кухня-гостиная, стена А; Кухня-гостиная, стена Б; Кухня-гостиная, стена В;</text><text x="64.5" y="234.95" font-size="2.5" fill="#000">Кухня-гостиная, стена Г; Кабинет, стена А; Кабинет, стена Б; Кабинет, стена Г;</text><text x="64.5" y="238.35" font-size="2.5" fill="#000">Гардеробная-постирочная, общий вид</text><text x="195" y="226.45" font-size="2.5" text-anchor="middle" fill="#000">В1–В24</text></g><line x1="25" y1="240.6" x2="210" y2="240.6" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="246.45" font-size="2.5" fill="#000">Рабочие чертежи</text><text x="64.5" y="244.75" font-size="2.5" fill="#000">планы, развёртки, узлы (развёртки и узлы — листы 49–51, 94, 99, 100, 109, 118,</text><text x="64.5" y="248.15" font-size="2.5" fill="#000">119, 121–123)</text><text x="195" y="246.45" font-size="2.5" text-anchor="middle" fill="#000">л. 1–138</text></g><line x1="25" y1="250.4" x2="210" y2="250.4" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="257.95" font-size="2.5" fill="#000">Спецификации и ведомости</text><text x="64.5" y="257.95" font-size="2.5" fill="#000">оборудование, изделия, отделка, электроточки</text><text x="195" y="254.55" font-size="2.5" text-anchor="middle" fill="#000">л. 25, 28–31, 35,</text><text x="195" y="257.95" font-size="2.5" text-anchor="middle" fill="#000">36, 52, 65–68, 72,</text><text x="195" y="261.35" font-size="2.5" text-anchor="middle" fill="#000">73, 124–128</text></g></g><g data-deviation="sheets-count-every-sheet"/><g data-deviation="scale-in-stamp"/><g data-deviation="elevation-1:40"/><g data-deviation="dim-font-2.5"/><g data-deviation="room-circle-8"/><g data-el="general-ref"><text x="25" y="290.2" font-size="2.5" textLength="182.41" lengthAdjust="spacingAndGlyphs" data-fit="203" fill="#000">Общие указания — лист 6: ±0,000 — чистый пол; несущие конструкции и сети дома — по отдельному проекту; скрытые работы — по актам. Открытые вопросы и допущения — листы 7–9.</text><g data-el="open-issues-ref" data-target="7"/></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4 К-6" data-level="0"><text x="25.5" y="271" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="274.4" font-size="2.5" fill="#000">Основа листа: размеры сняты с растрового плана заказчика с частичными размерами: рисунок не в масштабе, помещения выровнены по подписанным размерам мебели и проходов;</text><text x="25.5" y="277.8" font-size="2.5" fill="#000">контрольный обмер не выполнен (К-1); высота потолка 2700 мм принята: на плане заказчика её нет (К-2); толщины стен 300 / 120 мм приняты по плану заказчика, не замерены (К-1);</text><text x="25.5" y="281.2" font-size="2.5" fill="#000">разрешённая мощность 15 кВт принята по типовым ТУ для квартиры, ТУ заказчиком не переданы (К-4); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-6).</text><text x="25.5" y="284.6" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 7, записи К-1, К-2, К-4, К-6).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">10.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-008-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Квартира с кабинетом</text><text x="297" y="259.2" font-size="2.5" data-fit="116" fill="#000">Общая площадь 127,29* м² · * размеры со скана, не замерены (реестр — л. 7–9, К-1)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" data-fit="66" fill="#000">Дизайн-проект интерьера</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">5</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">138</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="285" font-size="3.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">Общие данные</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="47" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="13" data-positions="90" data-basis="5"><rect x="314.27" y="6.2" width="99.23" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="316.27" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 13 (реестр — л. 7–9)</text></g></svg>
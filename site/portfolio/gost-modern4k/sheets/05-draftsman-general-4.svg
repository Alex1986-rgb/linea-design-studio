"/><text x="44" y="200.2" font-size="2.5" text-anchor="middle" fill="#000">Раздел</text><line x1="63" y1="191.8" x2="63" y2="279.6" stroke="#000" stroke-width="0.25"/><text x="121.5" y="200.2" font-size="2.5" text-anchor="middle" fill="#000">Состав</text><line x1="180" y1="191.8" x2="180" y2="279.6" stroke="#000" stroke-width="0.25"/><text x="195" y="200.2" font-size="2.5" text-anchor="middle" fill="#000">Листы</text><g><text x="26.5" y="212.65" font-size="2.5" fill="#000">Обложка</text><text x="64.5" y="210.95" font-size="2.5" fill="#000">Дизайн-проект интерьера; Квартира с кабинетом; автор проекта — Кырлан Александр</text><text x="64.5" y="214.35" font-size="2.5" fill="#000">Сергеевич</text><text x="195" y="212.65" font-size="2.5" text-anchor="middle" fill="#000">1 с.</text></g><line x1="25" y1="216.6" x2="210" y2="216.6" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="222.45" font-size="2.5" fill="#000">Концепция</text><text x="64.5" y="220.75" font-size="2.5" fill="#000">Стиль Модерн (ар-нуво) 60 % + Современный (контемпорари) 40 %: концепция</text><text x="64.5" y="224.15" font-size="2.5" fill="#000">интерьера, палитра и материалы (колерная карта — лист 68)</text><text x="195" y="222.45" font-size="2.5" text-anchor="middle" fill="#000">л. 27</text></g><line x1="25" y1="226.4" x2="210" y2="226.4" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="242.45" font-size="2.5" fill="#000">Визуализации</text><text x="64.5" y="230.55" font-size="2.5" fill="#000">25 изобр.: Вид сверху (3D), схематичная модель по плану: мебель, текстиль и декор</text><text x="64.5" y="233.95" font-size="2.5" fill="#000">из данных проекта; Ванная, стена Б; Ванная, стена В; Ванная, стена Г; Санузел</text><text x="64.5" y="237.35" font-size="2.5" fill="#000">гостевой, стена В; Санузел гостевой, общий вид; Спальня, стена А; Спальня, стена</text><text x="64.5" y="240.75" font-size="2.5" fill="#000">Б; Спальня, стена Г; Коридор, стена А; Коридор, стена В; Прихожая, стена Б;</text><text x="64.5" y="244.15" font-size="2.5" fill="#000">Прихожая, стена В; Прихожая, стена Г; Детская, стена А; Детская, стена Б;</text><text x="64.5" y="247.55" font-size="2.5" fill="#000">Детская, стена Г; Кухня-гостиная, стена А; Кухня-гостиная, стена Б;</text><text x="64.5" y="250.95" font-size="2.5" fill="#000">Кухня-гостиная, стена В; Кухня-гостиная, стена Г; Кабинет, стена А; Кабинет,</text><text x="64.5" y="254.35" font-size="2.5" fill="#000">стена Б; Кабинет, стена Г; Гардеробная-постирочная, общий вид</text><text x="195" y="242.45" font-size="2.5" text-anchor="middle" fill="#000">В1–В25</text></g><line x1="25" y1="256.6" x2="210" y2="256.6" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="262.45" font-size="2.5" fill="#000">Рабочие чертежи</text><text x="64.5" y="260.75" font-size="2.5" fill="#000">планы, развёртки, узлы (развёртки и узлы — листы 50–52, 95, 100, 101, 110, 119,</text><text x="64.5" y="264.15" font-size="2.5" fill="#000">120, 122–124)</text><text x="195" y="262.45" font-size="2.5" text-anchor="middle" fill="#000">л. 1–139</text></g><line x1="25" y1="266.4" x2="210" y2="266.4" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="273.95" font-size="2.5" fill="#000">Спецификации и ведомости</text><text x="64.5" y="273.95" font-size="2.5" fill="#000">оборудование, изделия, отделка, электроточки</text><text x="195" y="270.55" font-size="2.5" text-anchor="middle" fill="#000">л. 26, 29–32, 36,</text><text x="195" y="273.95" font-size="2.5" text-anchor="middle" fill="#000">37, 53, 66–69, 73,</text><text x="195" y="277.35" font-size="2.5" text-anchor="middle" fill="#000">74, 125–129</text></g></g><g data-deviation="sheets-count-every-sheet"/><g data-deviation="scale-in-stamp"/><g data-deviation="elevation-1:40"/><g data-deviation="dim-font-2.5"/><g data-deviation="room-circle-8"/><g data-el="general-ref"><text x="25" y="290.2" font-size="2.5" textLength="183.55" lengthAdjust="spacingAndGlyphs" data-fit="203" fill="#000">Общие указания — лист 6: ±0,000 — чистый пол; несущие конструкции и сети дома — по отдельному проекту; скрытые работы — по актам. Открытые вопросы и допущения — листы 7–10.</text><g data-el="open-issues-ref" data-target="7"/></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4 К-6" data-level="0"><text x="212.5" y="216.6" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="212.5" y="220" font-size="2.5" fill="#000">Основа листа: размеры сняты с растрового плана заказчика с частичными размерами: рисунок не в масштабе, помещения выровнены по</text><text x="212.5" y="223.4" font-size="2.5" fill="#000">подписанным размерам мебели и проходов; контрольный обмер не выполнен (К-1); высота потолка 2700 мм принята: на плане заказчика её нет</text><text x="212.5" y="226.8" font-size="2.5" fill="#000">(К-2); толщины стен 300 / 120 мм приняты по плану заказчика, не замерены (К-1); разрешённая мощность 15 кВт принята по типовым ТУ для</text><text x="212.5" y="230.2" font-size="2.5" fill="#000">квартиры, ТУ заказчиком не переданы (К-4); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-6).</text><text x="212.5" y="233.6" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 7, записи К-1, К-2, К-4, К-6).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">16.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-008-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Квартира с кабинетом</text><text x="297" y="259.2" font-size="2.5" data-fit="116" fill="#000">Общая площадь 127,29* м² · * размеры со скана, не замерены (реестр — л. 7–10, К-1)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" data-fit="66" fill="#000">Дизайн-проект интерьера</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">5</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">139</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="285" font-size="3.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">Общие данные</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="47" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="1
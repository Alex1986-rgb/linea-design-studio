<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Однолинейная схема щита (продолжение)" data-part="eom" data-sheet="panel" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Однолинейная схема щита (продолжение)</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Щит квартирный ЩК · резервные аппараты · без масштаба</text><g data-el="scheme"><text x="28" y="30" font-size="2.5" fill="#000">Продолжение однолинейной схемы щита ЩК, начало — лист 37</text><line x1="28" y1="42" x2="55" y2="42" stroke="#000" stroke-width="0.7"/><line x1="31.8" y1="44.4" x2="33.6" y2="39.6" stroke="#000" stroke-width="0.35"/><line x1="34.4" y1="44.4" x2="36.2" y2="39.6" stroke="#000" stroke-width="0.35"/><line x1="55" y1="42" x2="143" y2="42" stroke="#000" stroke-width="0.7"/><text x="145" y="43" font-size="2.5" fill="#000">L</text><text x="58" y="40" font-size="3.5" font-weight="700" fill="#000">ЩК</text><g data-el="group" data-reserve="1"><line x1="81" y1="42" x2="81" y2="45" stroke="#000" stroke-width="0.35" stroke-dasharray="1.5 0.8"/><line x1="81" y1="45" x2="81" y2="48" stroke="#000" stroke-width="0.35" stroke-dasharray="1.5 0.8"/><line x1="80.2" y1="47.2" x2="81.8" y2="48.8" stroke="#000" stroke-width="0.35"/><line x1="81.8" y1="47.2" x2="80.2" y2="48.8" stroke="#000" stroke-width="0.35"/><line x1="81" y1="53.5" x2="83.6" y2="48.6" stroke="#000" stroke-width="0.35" stroke-dasharray="1.5 0.8"/><line x1="81" y1="53.5" x2="81" y2="55" stroke="#000" stroke-width="0.35" stroke-dasharray="1.5 0.8"/><text x="81" y="62" font-size="2.5" text-anchor="middle" fill="#000">резерв</text></g><g data-el="group" data-reserve="1"><line x1="109" y1="42" x2="109" y2="45" stroke="#000" stroke-width="0.35" stroke-dasharray="1.5 0.8"/><line x1="109" y1="45" x2="109" y2="48" stroke="#000" stroke-width="0.35" stroke-dasharray="1.5 0.8"/><line x1="108.2" y1="47.2" x2="109.8" y2="48.8" stroke="#000" stroke-width="0.35"/><line x1="109.8" y1="47.2" x2="108.2" y2="48.8" stroke="#000" stroke-width="0.35"/><line x1="109" y1="53.5" x2="111.6" y2="48.6" stroke="#000" stroke-width="0.35" stroke-dasharray="1.5 0.8"/><line x1="109" y1="53.5" x2="109" y2="55" stroke="#000" stroke-width="0.35" stroke-dasharray="1.5 0.8"/><text x="109" y="62" font-size="2.5" text-anchor="middle" fill="#000">резерв</text></g><g data-el="group" data-reserve="1"><line x1="137" y1="42" x2="137" y2="45" stroke="#000" stroke-width="0.35" stroke-dasharray="1.5 0.8"/><line x1="137" y1="45" x2="137" y2="48" stroke="#000" stroke-width="0.35" stroke-dasharray="1.5 0.8"/><line x1="136.2" y1="47.2" x2="137.8" y2="48.8" stroke="#000" stroke-width="0.35"/><line x1="137.8" y1="47.2" x2="136.2" y2="48.8" stroke="#000" stroke-width="0.35"/><line x1="137" y1="53.5" x2="139.6" y2="48.6" stroke="#000" stroke-width="0.35" stroke-dasharray="1.5 0.8"/><line x1="137" y1="53.5" x2="137" y2="55" stroke="#000" stroke-width="0.35" stroke-dasharray="1.5 0.8"/><text x="137" y="62" font-size="2.5" text-anchor="middle" fill="#000">резерв</text></g></g><g data-el="notes"><text x="223" y="108" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="223" y="113" font-size="2.5" fill="#000">1. Лист — продолжение однолинейной схемы щита ЩК: начало, данные щитка и условные обозначения — лист 37. Ввод, учёт, вводной аппарат, УЗИП, шины N и</text><text x="226" y="116.4" font-size="2.5" fill="#000">PE и ГЗШ показаны там же; шина L листа — та же шина щита.</text><text x="223" y="119.8" font-size="2.5" fill="#000">2. Схема однолинейная: одна линия — фаза, N и PE группы; аппараты — в отключённом положении (ГОСТ 2.702, ГОСТ 2.755). Номера групп — как у точек на</text><text x="226" y="123.2" font-size="2.5" fill="#000">планах (гр.). За отметку 0,000 принят уровень чистого пола; высота щита — по плану розеток.</text><text x="223" y="126.6" font-size="2.5" fill="#000">3. Розеточные и мокрые линии — через УЗО или дифавтомат с током утечки не более 30 мА (ПУЭ 7.1.79); в санузле выполнить ДСУП (ПУЭ 7.1.87–7.1.88).</text><text x="223" y="130" font-size="2.5" fill="#000">4. УЗО тип A — для линий с электроникой, стиральной и посудомоечной машиной, LED-драйверами; тип AC — только для чисто активной нагрузки.</text><text x="223" y="133.4" font-size="2.5" fill="#000">5. Кабель — медный, исполнение нг(А)-LS (ГОСТ 31565-2012); скрытая прокладка только горизонтально и вертикально, фактические трассы зафиксировать</text><text x="226" y="136.8" font-size="2.5" fill="#000">исполнительной схемой до закрытия отделкой.</text><text x="223" y="140.2" font-size="2.5" fill="#000">6. Номинал автомата — не выше допустимого тока кабеля: 1,5 мм² — до 10 А, 2,5 мм² — до 16 А. Резерв щита — не менее 20 %</text><text x="226" y="143.6" font-size="2.5" fill="#000">модулей.</text><text x="223" y="147" font-size="2.5" fill="#000">7. Расчёт нагрузок, токов КЗ, селективности и сечений — по проекту ЭОМ организации с допуском СРО; лист задаёт состав, расположение и группы.</text><text x="223" y="150.4" font-size="2.5" fill="#000">8. До подключения нагрузки — приёмо-сдаточные испытания с протоколом: сопротивление изоляции линий не менее 0,5 МОм, срабатывание УЗО по току и</text><text x="226" y="153.8" font-size="2.5" fill="#000">времени, непрерывность защитных проводников PE (ПУЭ, гл. 1.8).</text></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4 К-6" data-level="0"><text x="25.5" y="275.5" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">Основа листа: размеры сняты с растрового плана заказчика с частичными размерами: рисунок не в масштабе, помещения выровнены по подписанным размерам мебели и проходов;</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">контрольный обмер не выполнен (К-1); высота потолка 2700 мм принята: на плане заказчика её нет (К-2); толщины стен 300 / 120 мм приняты по плану заказчика, не замерены (К-1);</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">разрешённая мощность 15 кВт принята по типовым ТУ для квартиры, ТУ заказчиком не переданы (К-4); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-6).</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 7, записи К-1, К-2, К-4, К-6).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">10.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-008-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Квартира с кабинетом</text><text x="297" y="259.2" font-size="2.5" data-fit="116" fill="#000">Общая площадь 127,29* м² · * размеры со скана, не замерены (реестр — л. 7–9, К-1)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" data-fit="66" fill="#000">Дизайн-проект интерьера</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">38</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">138</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="285" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">Однолинейная схема щита (продолжение)</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="47" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="13" data-positions="90" data-basis="5"><rect x="314.27" y="6.2" width="99.23" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="316.27" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 13 (реестр — л. 7–9)</text></g></svg>
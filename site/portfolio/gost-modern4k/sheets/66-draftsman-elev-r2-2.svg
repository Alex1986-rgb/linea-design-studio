313.02" cy="47.4" r="2.5" fill="none" stroke="#000" stroke-width="0.35"/></g><g data-el="room-mark"><circle cx="318.72" cy="47.4" r="2.2" fill="#fff" stroke="#000" stroke-width="0.25"/><text x="318.72" y="48.3" font-size="2.5" text-anchor="middle" fill="#000">2</text></g></g><g data-el="legend"><text x="292" y="74.3" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><g><line x1="290.94" y1="81.86" x2="293.06" y2="79.74" stroke="#c0392b" stroke-width="0.5"/><rect x="292" y="80.64999999999999" width="8" height="0.3" fill="#c0392b"/></g><text x="303" y="81.7" font-size="2.5" fill="#000">привязки точек и выводов от угла и от пола, мм</text><g><rect x="292" y="84.1" width="8" height="5" fill="#fff" stroke="#000" stroke-width="0.35" opacity="0.6"/></g><text x="303" y="87.5" font-size="2.5" fill="#000">мебель и приборы — фасад по расстановке (условно)</text><g><rect x="292" y="90.39999999999999" width="8" height="4" fill="#cfcfcf" stroke="#000" stroke-width="0.7"/></g><text x="303" y="93.3" font-size="2.5" fill="#000">стены и перекрытия в сечении</text><g><rect x="292" y="96.19999999999999" width="8" height="4" fill="#dbd5ca" fill-opacity="0.55" stroke="#000" stroke-width="0.25"/></g><text x="303" y="99.1" font-size="2.5" fill="#000">окраска: тон — цвет по коду производителя (условно)</text><g><text x="296" y="104.9" font-size="2.5" text-anchor="middle" fill="#000">О1</text><circle cx="296" cy="103.99999999999999" r="3.5" fill="none" stroke="#000" stroke-width="0.25"/></g><text x="303" y="104.9" font-size="2.5" fill="#000">марка отделки по реестру отделки альбома</text><g><g data-wall="C"><text x="296" y="111.5" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">А</text><path d="M 296 115.5 L 294.5 113.35 L 297.5 113.35 Z" fill="#000"/><circle cx="296" cy="110.6" r="2.5" fill="none" stroke="#000" stroke-width="0.35"/></g></g><text x="303" y="112.7" font-size="2.5" fill="#000">марка развёртки: буква стены, стрелка — взгляд</text></g><g data-el="finish-table"><text x="292" y="128.6" font-size="3.5" font-weight="700" fill="#000">Ведомость отделки (на листе)</text><rect x="292" y="131.1" width="118" height="29.6" fill="none" stroke="#000" stroke-width="0.5"/><line x1="292" y1="141.1" x2="410" y2="141.1" stroke="#000" stroke-width="0.5"/><text x="297.5" y="137" font-size="2.5" text-anchor="middle" fill="#000">Марка</text><line x1="303" y1="131.1" x2="303" y2="160.7" stroke="#000" stroke-width="0.25"/><text x="311" y="135.3" font-size="2.5" text-anchor="middle" fill="#000">Поверх</text><text x="311" y="138.7" font-size="2.5" text-anchor="middle" fill="#000">ность</text><line x1="319" y1="131.1" x2="319" y2="160.7" stroke="#000" stroke-width="0.25"/><text x="343" y="137" font-size="2.5" text-anchor="middle" fill="#000">Материал, изделие</text><line x1="367" y1="131.1" x2="367" y2="160.7" stroke="#000" stroke-width="0.25"/><text x="381" y="137" font-size="2.5" text-anchor="middle" fill="#000">Цвет, код</text><line x1="395" y1="131.1" x2="395" y2="160.7" stroke="#000" stroke-width="0.25"/><text x="402.5" y="137" font-size="2.5" text-anchor="middle" fill="#000">Кол.</text><g><text x="297.5" y="146.95" font-size="2.5" text-anchor="middle" fill="#000">О4</text><text x="304.5" y="146.95" font-size="2.5" fill="#000">потолок</text><text x="320.5" y="145.25" font-size="2.5" fill="#000">окраска, Tikkurila Anti-Reflex</text><text x="320.5" y="148.65" font-size="2.5" fill="#000">2, глубокоматовая, подготовка Q3</text><text x="368.5" y="145.25" font-size="2.5" fill="#000">Tikkurila V503</text><text x="368.5" y="148.65" font-size="2.5" fill="#000">«Winter»</text><text x="408.5" y="146.95" font-size="2.5" text-anchor="end" fill="#000">5,1 м²</text></g><line x1="292" y1="150.9" x2="410" y2="150.9" stroke="#000" stroke-width="0.25"/><g><text x="297.5" y="156.75" font-size="2.5" text-anchor="middle" fill="#000">О6</text><text x="304.5" y="156.75" font-size="2.5" fill="#000">стены</text><text x="320.5" y="155.05" font-size="2.5" fill="#000">окраска, Tikkurila Harmony,</text><text x="320.5" y="158.45" font-size="2.5" fill="#000">матовая, подготовка Q3</text><text x="368.5" y="155.05" font-size="2.5" fill="#000">Tikkurila V503</text><text x="368.5" y="158.45" font-size="2.5" fill="#000">«Winter»</text><text x="408.5" y="156.75" font-size="2.5" text-anchor="end" fill="#000">6,1 м²</text></g></g><g data-el="ref-back" data-target="62"/><g data-el="notes"><text x="25" y="238" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="243" font-size="2.5" fill="#000">1. Развёртки — вид на стену изнутри помещения, по часовой стрелке; расположение — на схеме листа и на листе 62; размеры — в мм по чистовым поверхностям;</text><text x="28" y="246.4" font-size="2.5" fill="#000">отметки — в м от ±0,000; высоты Н — от чистого пола помещения до оси изделия, у декора — до центра.</text><text x="25" y="249.8" font-size="2.5" fill="#000">2. Красные цепочки — привязки электроточек и выводов: по горизонтали от угла чистовых стен, по вертикали от чистого пола, до оси изделия; звенья короче 3 мм</text><text x="28" y="253.2" font-size="2.5" fill="#000">на листе вынесены во второй ярус (ближняя к стене цепочка).</text><text x="25" y="256.6" font-size="2.5" fill="#000">3. У знака электроточки: марка (Р — розетка, S — выключатель, Св — светильник, ЭВ — вывод кабеля), ×N — число постов в рамке, гр. — группа щита, Н — высота</text><text x="28" y="260" font-size="2.5" fill="#000">оси от чистого пола, мм; группы по клавишам выключателя — на листе выключателей.</text><text x="25" y="263.4" font-size="2.5" fill="#000">4. Схема мебели, приборов и декора не является технической документацией для производства мебели; габариты — по паспортам изделий.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="75" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="75" y1="285.5" x2="75" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="77" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4" data-level="0"><text x="45.5" y="219" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="45.5" y="222.4" font-size="2.5" fill="#000">Основа листа: размеры сняты с растрового плана заказчика с частичными размерами: рисунок не в масштабе, помещения выровнены по подписанным размерам мебели и проходов; контрольный</text><text x="45.5" y="225.8" font-size="2.5" fill="#000">обмер не выполнен (К-1); высота потолка 2700 мм принята: на плане заказчика её нет (К-2); толщины стен 300 / 120 мм приняты по плану заказчика, не замерены (К-1); разрешённая мощность 15</text><text x="45.5" y="229.2" font-size="2.5" fill="#000">кВт принята по типовым ТУ для квартиры, ТУ заказчиком не переданы (К-4).</text><text x="45.5" y="232.6" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1, К-2, К-4).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2
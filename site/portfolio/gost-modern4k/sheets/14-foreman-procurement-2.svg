<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="График закупок и работ. Лист 2 из 3" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">График закупок и работ. Лист 2 из 3</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Что заказывать и когда не раньше чего: относительный порядок без дат; срок поставки — из данных или «не задан» с записью реестра</text><g data-el="proc-schedule" data-plan="fixed" data-plan-declared="3"><g data-el="proc-buy"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Закупки: что заказывается, от чего зависит заказ и какую работу блокирует (продолжение)</text><rect x="25" y="33" width="385" height="30.4" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="31" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="37" y1="33" x2="37" y2="63.4" stroke="#000" stroke-width="0.25"/><text x="70" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Позиция и где</text><line x1="103" y1="33" x2="103" y2="63.4" stroke="#000" stroke-width="0.25"/><text x="131" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">1. Замер до заказа</text><line x1="159" y1="33" x2="159" y2="63.4" stroke="#000" stroke-width="0.25"/><text x="187" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">2. Решение, выбор изделия, паспорт</text><line x1="215" y1="33" x2="215" y2="63.4" stroke="#000" stroke-width="0.25"/><text x="241" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">3. Условие заказа</text><line x1="267" y1="33" x2="267" y2="63.4" stroke="#000" stroke-width="0.25"/><text x="287" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">4. Срок поставки</text><line x1="307" y1="33" x2="307" y2="63.4" stroke="#000" stroke-width="0.25"/><text x="335" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">5. Блокирует работу</text><line x1="363" y1="33" x2="363" y2="63.4" stroke="#000" stroke-width="0.25"/><text x="386.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Закрывает вопросы реестра</text><g data-el="proc-row" data-id="З-8" data-kind="furniture" data-lead="" data-lead-src="none" data-need="Р-15" data-closes="К-1 К-20"><text x="31" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">З-8</text><text x="38.5" y="46.7" font-size="2.5" fill="#000" textLength="45.43" lengthAdjust="spacingAndGlyphs">Встроенная мебель по замеру цеха: Кб1, Кх12*,</text><text x="38.5" y="50.1" font-size="2.5" fill="#000" textLength="14.02" lengthAdjust="spacingAndGlyphs">Кх13, Дт1, Пх1**</text><text x="38.5" y="53.5" font-size="2.5" fill="#000">пом. 3, 4, 6, 8</text><text x="104.5" y="46.7" font-size="2.5" fill="#000" textLength="41.22" lengthAdjust="spacingAndGlyphs">О-10: обмер: Кухня-гостиная (пом. 4): Кх12*</text><text x="104.5" y="50.1" font-size="2.5" fill="#000">(К-20)</text><text x="104.5" y="53.5" font-size="2.5" fill="#000">О-4: обмер: все помещения (К-1); до заказа</text><text x="104.5" y="56.9" font-size="2.5" fill="#000">мебели и дверей</text><text x="160.5" y="46.7" font-size="2.5" fill="#000"></text><text x="216.5" y="46.7" font-size="2.5" fill="#000">После 1 и 2 и после получения срока у</text><text x="216.5" y="50.1" font-size="2.5" fill="#000">поставщика (вопроса о сроках нет);</text><text x="216.5" y="53.5" font-size="2.5" fill="#000">дата заказа — когда срок известен, не</text><text x="216.5" y="56.9" font-size="2.5" fill="#000">позднее чем за срок до начала Р-15.</text><text x="268.5" y="46.7" font-size="2.5" fill="#000">срок поставки не задан</text><text x="268.5" y="50.1" font-size="2.5" fill="#000">(записи реестра нет)</text><text x="268.5" y="53.5" font-size="2.5" fill="#000">Ориентир практики (не срок</text><text x="268.5" y="56.9" font-size="2.5" fill="#000">поставщика): 4–8 нед. от</text><text x="268.5" y="60.3" font-size="2.5" fill="#000">замера</text><text x="308.5" y="46.7" font-size="2.5" fill="#000">Р-15 «кухня и мебель»: цех замеряет по</text><text x="308.5" y="50.1" font-size="2.5" fill="#000">готовым стенам; производство 4–8 недель</text><text x="308.5" y="53.5" font-size="2.5" fill="#000">идёт параллельно с отделкой</text><text x="364.5" y="46.7" font-size="2.5" fill="#000">К-1, К-20</text></g></g></g><g data-el="assumed-notes" data-flags="furniture:Кх12|furniture:Пх1" data-ids="ИЗ-1 ИЗ-5 ИЗ-9 К-1 К-2 К-4 К-6 К-20" data-level="0"><text x="25.5" y="261.9" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="265.3" font-size="2.5" fill="#000">Основа листа: размеры сняты с растрового плана заказчика с частичными размерами: рисунок не в масштабе, помещения выровнены по подписанным размерам мебели и проходов;</text><text x="25.5" y="268.7" font-size="2.5" fill="#000">контрольный обмер не выполнен (К-1); высота потолка 2700 мм принята: на плане заказчика её нет (К-2); толщины стен 300 / 120 мм приняты по плану заказчика, не замерены (К-1);</text><text x="25.5" y="272.1" font-size="2.5" fill="#000">разрешённая мощность 15 кВт принята по типовым ТУ для квартиры, ТУ заказчиком не переданы (К-4); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-6).</text><text x="25.5" y="275.5" font-size="2.5" fill="#000">Знак «*» — принято, не замерено и не подтверждено (замерить на объекте): ИЗ-5, ИЗ-9, К-20: Кх12 — Было: предмет 1800×400 h 500 на отметке 0 — на развёртке стены Б низкий</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">короб у пола.</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">Знак «**» — предложение проектировщика, заказчиком не утверждено (согласовать с заказчиком): ИЗ-1: Пх1 — фасад купе по кадру визуализации прихожей: МДФ 10 мм, эмаль</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">матовая, латунный профиль, зеркальные арочные вставки (поле 100 мм).</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 7, записи К-1, К-2, К-4, К-6; лист 8, записи ИЗ-1, К-20; лист 9, записи ИЗ-5, ИЗ-9).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">11.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-008-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Квартира с кабинетом</text><text x="297" y="259.2" font-size="2.5" data-fit="116" fill="#000">Общая площадь 127,29* м² · * размеры со скана, не замерены (реестр — л. 7–9, К-1)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" data-fit="66" fill="#000">Дизайн-проект интерьера</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">14</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">138</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="285" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">График закупок и работ. Лист 2 из 3</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="47" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="13" data-positions="90" data-basis="5"><rect x="314.27" y="6.2" width="99.23" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="316.27" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 13 (реестр — л. 7–9)</text></g></svg>
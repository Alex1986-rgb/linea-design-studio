font-size="2.5" fill="#000">Стиль Модерн (ар-нуво) 60 % + Современный (контемпорари) 40 %: концепция</text><text x="259.5" y="64.35" font-size="2.5" fill="#000">интерьера, палитра и материалы (колерная карта — лист 42)</text><text x="390" y="62.65" font-size="2.5" text-anchor="middle" fill="#000">л. 15</text></g><line x1="220" y1="66.6" x2="405" y2="66.6" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="87.75" font-size="2.5" fill="#000">Визуализации</text><text x="259.5" y="70.75" font-size="2.5" fill="#000">24 изобр.: Вид сверху (3D): планировка с мебелью, текстилем и декором;</text><text x="259.5" y="74.15" font-size="2.5" fill="#000">Визуализация «room-bath1-wB»; Визуализация «room-bath1-wC»; Визуализация</text><text x="259.5" y="77.55" font-size="2.5" fill="#000">«room-bath1-wD»; Визуализация «room-bath2-wC»; Визуализация «room-bath2-wide»;</text><text x="259.5" y="80.95" font-size="2.5" fill="#000">Визуализация «room-bedroom-wA»; Визуализация «room-bedroom-wB»; Визуализация</text><text x="259.5" y="84.35" font-size="2.5" fill="#000">«room-bedroom-wD»; Визуализация «room-corridor-wC»; Визуализация «room-hall-wB»;</text><text x="259.5" y="87.75" font-size="2.5" fill="#000">Визуализация «room-hall-wC»; Визуализация «room-hall-wD»; Визуализация</text><text x="259.5" y="91.15" font-size="2.5" fill="#000">«room-kids-wA»; Визуализация «room-kids-wB»; Визуализация «room-kids-wD»;</text><text x="259.5" y="94.55" font-size="2.5" fill="#000">Визуализация «room-living-wA»; Визуализация «room-living-wB»; Визуализация</text><text x="259.5" y="97.95" font-size="2.5" fill="#000">«room-living-wC»; Визуализация «room-living-wD»; Визуализация «room-study-wA»;</text><text x="259.5" y="101.35" font-size="2.5" fill="#000">Визуализация «room-study-wB»; Визуализация «room-study-wD»; Визуализация</text><text x="259.5" y="104.75" font-size="2.5" fill="#000">«room-wardrobe-wide»</text><text x="390" y="87.75" font-size="2.5" text-anchor="middle" fill="#000">В1–В24</text></g><line x1="220" y1="107" x2="405" y2="107" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="112.85" font-size="2.5" fill="#000">Рабочие чертежи</text><text x="259.5" y="111.15" font-size="2.5" fill="#000">планы, развёртки, узлы (развёртки и узлы — листы 62–65, 67, 68, 73–76, 81, 83,</text><text x="259.5" y="114.55" font-size="2.5" fill="#000">85)</text><text x="390" y="112.85" font-size="2.5" text-anchor="middle" fill="#000">л. 1–92</text></g><line x1="220" y1="116.8" x2="405" y2="116.8" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="124.35" font-size="2.5" fill="#000">Спецификации и ведомости</text><text x="259.5" y="124.35" font-size="2.5" fill="#000">оборудование, изделия, отделка, электроточки</text><text x="390" y="120.95" font-size="2.5" text-anchor="middle" fill="#000">л. 14, 17–19, 23,</text><text x="390" y="124.35" font-size="2.5" text-anchor="middle" fill="#000">24, 32, 33, 40–43,</text><text x="390" y="127.75" font-size="2.5" text-anchor="middle" fill="#000">47, 48, 86–90</text></g></g><g data-deviation="sheets-count-every-sheet"/><g data-deviation="scale-in-stamp"/><g data-deviation="elevation-1:40"/><g data-deviation="dim-font-2.5"/><g data-deviation="room-circle-8"/><g data-el="general-ref"><text x="25" y="290.2" font-size="2.5" textLength="178.6" lengthAdjust="spacingAndGlyphs" fill="#000">Общие указания — лист 5: ±0,000 — чистый пол; несущие конструкции и сети дома — по отдельному проекту; скрытые работы — по актам. Открытые вопросы и допущения — лист 6.</text><g data-el="open-issues-ref" data-target="6"/></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4" data-level="0"><text x="25.5" y="271" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="274.4" font-size="2.5" fill="#000">Основа листа: размеры сняты с растрового плана заказчика с частичными размерами: рисунок не в масштабе, помещения выровнены по подписанным размерам мебели и проходов;</text><text x="25.5" y="277.8" font-size="2.5" fill="#000">контрольный обмер не выполнен (К-1); высота потолка 2700 мм принята: на плане заказчика её нет (К-2); толщины стен 300 / 120 мм приняты по плану заказчика, не замерены (К-1);</text><text x="25.5" y="281.2" font-size="2.5" fill="#000">разрешённая мощность 15 кВт принята по типовым ТУ для квартиры, ТУ заказчиком не переданы (К-4).</text><text x="25.5" y="284.6" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1, К-2, К-4).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" fill="#000">18.10.26</text><text x="231" y="270.8" font-size="2.5" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" fill="#000">ГД-2026-008-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" fill="#000">Квартира с кабинетом</text><text x="297" y="259.2" font-size="2.5" fill="#000">Общая площадь 127,29* м² · * размеры со скана, не замерены (реестр — л. 6, К-1)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" fill="#000">Дизайн-проект интерьера</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5"
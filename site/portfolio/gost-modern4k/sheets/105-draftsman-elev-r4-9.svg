nt-size="2.5" text-anchor="middle" fill="#000">О1</text><text x="292.3" y="47.25" font-size="2.5" fill="#000">стены</text><text x="308.3" y="45.55" font-size="2.5" fill="#000">окраска, Farrow &amp; Ball Modern Emulsion,</text><text x="308.3" y="48.95" font-size="2.5" fill="#000">матовая, подготовка Q3</text><text x="368.5" y="42.15" font-size="2.5" fill="#000">Farrow &amp; Ball No.</text><text x="368.5" y="45.55" font-size="2.5" fill="#000">15 «Bone — мягкий</text><text x="368.5" y="48.95" font-size="2.5" fill="#000">каменно-серый с</text><text x="368.5" y="52.35" font-size="2.5" fill="#000">зеленцой»</text><text x="408.5" y="47.25" font-size="2.5" text-anchor="end" fill="#000">15,3 м²</text></g><line x1="279.8" y1="54.6" x2="410" y2="54.6" stroke="#000" stroke-width="0.25"/><g><text x="285.3" y="63.85" font-size="2.5" text-anchor="middle" fill="#000">О3</text><text x="292.3" y="63.85" font-size="2.5" fill="#000">плинтус</text><text x="308.3" y="62.15" font-size="2.5" fill="#000">плинтус МДФ, h 80 мм, аналог: плинтус</text><text x="308.3" y="65.55" font-size="2.5" fill="#000">МДФ под покраску 80×16</text><text x="368.5" y="58.75" font-size="2.5" fill="#000">Farrow &amp; Ball No.</text><text x="368.5" y="62.15" font-size="2.5" fill="#000">15 «Bone — мягкий</text><text x="368.5" y="65.55" font-size="2.5" fill="#000">каменно-серый с</text><text x="368.5" y="68.95" font-size="2.5" fill="#000">зеленцой»</text><text x="408.5" y="63.85" font-size="2.5" text-anchor="end" fill="#000">4,6 м</text></g><line x1="279.8" y1="71.2" x2="410" y2="71.2" stroke="#000" stroke-width="0.25"/><g><text x="285.3" y="77.05" font-size="2.5" text-anchor="middle" fill="#000">О4</text><text x="292.3" y="77.05" font-size="2.5" fill="#000">потолок</text><text x="308.3" y="75.35" font-size="2.5" fill="#000">окраска, Tikkurila Anti-Reflex 2,</text><text x="308.3" y="78.75" font-size="2.5" fill="#000">глубокоматовая, подготовка Q3</text><text x="368.5" y="75.35" font-size="2.5" fill="#000">Tikkurila V503</text><text x="368.5" y="78.75" font-size="2.5" fill="#000">«Winter»</text><text x="408.5" y="77.05" font-size="2.5" text-anchor="end" fill="#000">45,5 м²</text></g></g><g data-el="ref-back" data-target="103"/><g data-el="notes"><text x="25" y="238" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="243" font-size="2.5" fill="#000">1. Схема, условные обозначения и ведомость отделки — к развёртке стены Б на листе 103: вид в своём масштабе занимает лист целиком.</text><text x="25" y="246.4" font-size="2.5" fill="#000">2. Расположение развёрток всех помещений — на листе 85; полная ведомость отделки — на листах отделочника.</text></g><g data-el="assumed-notes" data-flags="surface:r4:skirting|surface:r4:apron" data-ids="К-1 К-2 К-4 К-6" data-level="0"><text x="25.5" y="268.7" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="272.1" font-size="2.5" fill="#000">Основа листа: размеры сняты с растрового плана заказчика с частичными размерами: рисунок не в масштабе, помещения выровнены по подписанным размерам мебели и проходов;</text><text x="25.5" y="275.5" font-size="2.5" fill="#000">контрольный обмер не выполнен (К-1); высота потолка 2700 мм принята: на плане заказчика её нет (К-2); толщины стен 300 / 120 мм приняты по плану заказчика, не замерены (К-1);</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">разрешённая мощность 15 кВт принята по типовым ТУ для квартиры, ТУ заказчиком не переданы (К-4); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-6).</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">Знак «**» — предложение проектировщика, заказчиком не утверждено (согласовать с заказчиком): плинтус пом. 4, фартук пом. 4 — артикул изделия не выбран: позиция описана</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">характеристиками («аналог по характеристикам»), артикул выбирается при закупке.</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1, К-2, К-4, К-6).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" dat
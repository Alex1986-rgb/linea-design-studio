<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">График закупок и работ. Лист 3 из 3</text><text x="25" y="17.8" font-size="2.5" fill="#333">Что заказывать и когда не раньше чего: относительный порядок без дат; срок поставки — из данных или «уточняется у поставщика»</text><g data-el="proc-schedule" data-plan="fixed" data-plan-declared="3"><g data-el="notes"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="35.2" font-size="2.5" fill="#000">1. Порядок работ — стадии технологической последовательности из 16 позиций, присутствующих в этом проекте (по строкам ведомости объёмов); остальные стадии таблицы knowledge/remont-tehnologiya.md в проекте не встречаются. Длительности работ не печатаются: их нет ни в данных, ни в нормах для</text><text x="29" y="38.6" font-size="2.5" fill="#000">этого объекта.</text><text x="25" y="42" font-size="2.5" fill="#000">2. Типовые сроки — ориентир практики, не срок поставщика: скрытые двери — короб около 10 дн., полотно под покраску до 3 нед., шпон 4–5 нед., в среднем около 30 дн. (knowledge/workers/foreman.md, п. 2.4 (profil-doors)); кухня и корпусная мебель — 4–8 недель от замера (knowledge/remont-tehnologiya.md,</text><text x="29" y="45.4" font-size="2.5" fill="#000">разд. 2; knowledge/workers/foreman.md, п. 2.4). Заказ по ориентиру не назначается: срок получают у поставщика (вопрос реестра), после чего заказ планируют «не позднее чем за срок до начала работы».</text><text x="25" y="48.8" font-size="2.5" fill="#000">3. Условия заказа берутся из реестра открытых вопросов и задания на контрольный обмер: позиция заказывается, когда закрыты замер (графа 1) и решение (графа 2). Закрывать их может только факт или решение автора с подписью; снять строку с листа можно только закрыв запись реестра.</text><text x="25" y="52.2" font-size="2.5" fill="#000">4. Заказ по размеру до контрольного обмера не делают: двери, кухня и встроенная мебель зависят от обмера (К-11, К-13); скрытые двери, кроме того, зависят от решения по нише санузла 2 (проём Д-5 в перегородке П-1).</text><text x="25" y="55.6" font-size="2.5" fill="#000">5. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text></g></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4" data-level="0"><text x="25.5" y="275.5" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">Основа листа: размеры сняты с растрового плана заказчика с частичными размерами: рисунок не в масштабе, помещения выровнены по подписанным размерам мебели и проходов;</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">контрольный обмер не выполнен (К-1); высота потолка 2700 мм принята: на плане заказчика её нет (К-2); толщины стен 300 / 120 мм приняты по плану заказчика, не замерены (К-1);</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">разрешённая мощность 15 кВт принята по типовым ТУ для квартиры, ТУ заказчиком не переданы (К-4).</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1, К-2, К-4).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" fill="#000">18.10.26</text><text x="231" y="270.8" font-size="2.5" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" fill="#000">ГД-2026-008-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" fill="#000">Квартира с кабинетом</text><text x="297" y="259.2" font-size="2.5" fill="#000">Общая площадь 127,29* м² · * размеры со скана, не замерены (реестр — л. 6, К-1)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" fill="#000">Дизайн-проект интерьера</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">11</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">92</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="285" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">График закупок и работ. Лист 3 из 3</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="4" data-positions="31" data-basis="4"><rect x="318.03" y="6.2" width="95.47" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="320.03" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 4 (реестр — л. 6)</text></g></svg>
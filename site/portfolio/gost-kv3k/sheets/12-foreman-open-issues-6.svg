<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Открытые вопросы, принятые допущения и конфликты. Лист 6 из 6" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты. Лист 6 из 6</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации</text><g data-el="open-issues" data-plan="fixed" data-plan-declared="6"><g data-el="issues-changes"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Изменения проекта после выпуска листов (реестр изменений) (продолжение)</text><rect x="25" y="33" width="385" height="95" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="32" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="33" x2="39" y2="128" stroke="#000" stroke-width="0.25"/><text x="50" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><line x1="61" y1="33" x2="61" y2="128" stroke="#000" stroke-width="0.25"/><text x="91" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><line x1="121" y1="33" x2="121" y2="128" stroke="#000" stroke-width="0.25"/><text x="171" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Было</text><line x1="221" y1="33" x2="221" y2="128" stroke="#000" stroke-width="0.25"/><text x="283.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Стало</text><line x1="346" y1="33" x2="346" y2="128" stroke="#000" stroke-width="0.25"/><text x="378" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Кто решил, подпись</text><g data-el="issue-row" data-kind="change" data-id="ИЗ-17"><text x="32" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-17</text><text x="40.5" y="46.7" font-size="2.5" fill="#000">06.10.2026</text><text x="62.5" y="46.7" font-size="2.5" fill="#000">л. 45 — План слаботочных сетей</text><text x="62.5" y="50.1" font-size="2.5" fill="#000">л. 43 — План принципиальных трасс</text><text x="122.5" y="46.7" font-size="2.5" fill="#000">Состав и места слаботочки в данных проекта заданы проектировщиком: щит</text><text x="122.5" y="50.1" font-size="2.5" fill="#000">слаботочный ЩС, точки доступа Wi-Fi AP1 и AP2. План заказчика их не</text><text x="122.5" y="53.5" font-size="2.5" fill="#000">содержит, подтверждения заказчика в данных нет.</text><text x="222.5" y="46.7" font-size="2.5" fill="#000">Слаботочка остаётся предложением проектировщика, заказчиком не утверждена: щит слаботочный</text><text x="222.5" y="50.1" font-size="2.5" fill="#000">ЩС в Прихожей (стена Г, 3350 мм от угла, высота 1700 мм, рядом со щитом ЩК; ввод оптики, ONT,</text><text x="222.5" y="53.5" font-size="2.5" fill="#000">роутер, патч-панель), точка доступа AP1 в Прихожей (потолок, x 6800, y 6300) и точка доступа AP2 в</text><text x="222.5" y="56.9" font-size="2.5" fill="#000">Кухне-гостиной (потолок, x 12000, y 5500), питание PoE, кабель U/UTP кат. 6. Основание: (если</text><text x="222.5" y="60.3" font-size="2.5" fill="#000">заданы слаботочные точки, задан и слаботочный щит, к которому они сходятся); число и места</text><text x="222.5" y="63.7" font-size="2.5" fill="#000">точек доступа — ориентир практики «одна на 40–60 м²». Заказчик состав и места слаботочки не</text><text x="222.5" y="67.1" font-size="2.5" fill="#000">задавал и не подтверждал: решение исполнителя, знак «**» у ЩС, AP1 и AP2 остаётся до</text><text x="222.5" y="70.5" font-size="2.5" fill="#000">утверждения автором; число и места точек доступа проверить по замеру уровня сигнала после</text><text x="222.5" y="73.9" font-size="2.5" fill="#000">монтажа.</text><text x="347.5" y="46.7" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="50.1" font-size="2.5" fill="#000">исполнителя; предложение проектировщика, на</text><text x="347.5" y="53.5" font-size="2.5" fill="#000">утверждение А. С. Кырлана</text></g><line x1="25" y1="77" x2="410" y2="77" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-18"><text x="32" y="80.7" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-18</text><text x="40.5" y="80.7" font-size="2.5" fill="#000">30.10.2026</text><text x="62.5" y="80.7" font-size="2.5" fill="#000">л. 80 — Кухня (пом. 6). Развёртка гарнитура</text><text x="62.5" y="84.1" font-size="2.5" fill="#000">л. 82 — Кухня (пом. 6). Монтажная схема</text><text x="62.5" y="87.5" font-size="2.5" fill="#000">л. 105 — Развёртка стены В1. Кухня-гостиная</text><text x="62.5" y="90.9" font-size="2.5" fill="#000">(пом. 6), кухонный фронт</text><text x="62.5" y="94.3" font-size="2.5" fill="#000">л. 31 — План дверей и ведомость заполнения</text><text x="62.5" y="97.7" font-size="2.5" fill="#000">проёмов</text><text x="62.5" y="101.1" font-size="2.5" fill="#000">л. 48 — План выводов сантехники</text><text x="62.5" y="104.5" font-size="2.5" fill="#000">л. 33 — План расстановки мебели</text><text x="122.5" y="80.7" font-size="2.5" fill="#000">Кухонный ряд М6…М8 3800 мм посажен от черновой грани стены Б при</text><text x="122.5" y="84.1" font-size="2.5" fill="#000">чистовой длине стены 3770; дверь Д-5 с простенком 50 мм до шахты Ш2; мойка</text><text x="122.5" y="87.5" font-size="2.5" fill="#000">П11 500×450 против выреза 700×480; ТВ в спальне 2 только точками ЭОМ.</text><text x="222.5" y="80.7" font-size="2.5" fill="#000">М8 — 1775 (ряд 3775, зазор 10 мм до чистовой грани под компенсатор); Д-5 — смещение 825</text><text x="222.5" y="84.1" font-size="2.5" fill="#000">(простенок 150); П11 — 700×480 по вырезу М7; в спальне 2 добавлен ТВ С12 на кронштейне над</text><text x="222.5" y="87.5" font-size="2.5" fill="#000">комодом С10. Знак «**» у Д-5 и С12 до подписи автора.</text><text x="347.5" y="80.7" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="84.1" font-size="2.5" fill="#000">исполнителя; предложение проектировщика, на</text><text x="347.5" y="87.5" font-size="2.5" fill="#000">утверждение А. С. Кырлана</text></g><line x1="25" y1="107.6" x2="410" y2="107.6" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-19"><text x="32" y="111.3" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-19</text><text x="40.5" y="111.3" font-size="2.5" fill="#000">10.11.2026</text><text x="62.5" y="111.3" font-size="2.5" fill="#000">л. 37 — План розеток и электровыводов</text><text x="62.5" y="114.7" font-size="2.5" fill="#000">л. 45 — План слаботочных сетей</text><text x="62.5" y="118.1" font-size="2.5" fill="#000">л. 33 — План расстановки мебели</text><text x="122.5" y="111.3" font-size="2.5" fill="#000">ТВ2 и LAN2 на стене C со смещением 2135 и 2285 мм, высота 1100 мм — за</text><text x="122.5" y="114.7" font-size="2.5" fill="#000">телевизором С12 (смещение 1835…3035, 1000…1700 мм от пола): точки</text><text x="122.5" y="118.1" font-size="2.5" fill="#000">закрыты мебелью.</text><text x="222.5" y="111.3" font-size="2.5" fill="#000">ТВ2 — смещение 3200 мм, LAN2 — 3350 мм на стене C (было 2135 и 2285), высота 1100 мм</text><text x="222.5" y="114.7" font-size="2.5" fill="#000">прежняя: выводы вынесены вправо за габарит телевизора С12 (его правый край 3035 мм), зазор до</text><text x="222.5" y="118.1" font-size="2.5" fill="#000">телевизора 165 и 315 мм, до угла не менее 815 мм; кабель в телевизор идёт по стене сбоку от</text><text x="222.5" y="121.5" font-size="2.5" fill="#000">кронштейна. Розетка Р12 (1985 мм, высота 1100 мм, «доступ сбоку») и телевизор С12 не тронуты.</text><text x="222.5" y="124.9" font-size="2.5" fill="#000">Сам телевизор остаётся предложением (ИЗ-18, К-7).</text><text x="347.5" y="111.3" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="114.7" font-size="2.5" fill="#000">исполнителя; на утверждение А. С. Кырлана</text></g></g><g data-el="notes"><text x="25" y="140.4" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="145.2" font-size="2.5" fill="#000">1. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text><text x="25" y="148.6" font-size="2.5" fill="#000">2. Графа «Если решения нет» показывает состояние решения на листах; влияние на сроки и стоимость по пунктам не оценивалось.</text><text x="25" y="152" font-size="2.5" fill="#000">3. Пункт, по которому принято решение, при следующем выпуске комплекта из таблиц исключается.</text></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">10.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-003-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Трёхкомнатная квартира</text><text x="297" y="259.2" font-size="2.5" data-fit="116" fill="#000">Общая площадь 78,95* м² · * размеры со скана, не замерены (реестр — л. 7–12, К-13)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" data-fit="66" fill="#000">Дизайн-проект интерьера трёхкомнатной квартиры</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">12</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">131</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="283.1" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">Открытые вопросы, принятые допущения и</text><text x="330" y="286.9" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">конфликты. Лист 6 из 6</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="47" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="34" data-positions="88" data-basis="9"><rect x="313.01" y="6.2" width="100.49" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="315.01" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 34 (реестр — л. 7–12)</text></g></svg>
тов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">8</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">79</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="283.2" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и</text><text x="330" y="287" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">конфликты. Лист 4 из 4</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="20" data-positions="37" data-basis="7"><rect x="314.27" y="6.2" width="99.23" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="316.27" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 20 (реестр — л. 5–8)</text></g></svg>
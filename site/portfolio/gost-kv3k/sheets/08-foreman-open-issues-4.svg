<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты. Лист 4 из 4</text><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации</text><g data-el="open-issues"><g data-el="issues-changes"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Изменения проекта после выпуска листов (реестр изменений) (продолжение)</text><rect x="25" y="33" width="385" height="159.6" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="32" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="33" x2="39" y2="192.6" stroke="#000" stroke-width="0.25"/><text x="50" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><line x1="61" y1="33" x2="61" y2="192.6" stroke="#000" stroke-width="0.25"/><text x="91" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><line x1="121" y1="33" x2="121" y2="192.6" stroke="#000" stroke-width="0.25"/><text x="171" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Было</text><line x1="221" y1="33" x2="221" y2="192.6" stroke="#000" stroke-width="0.25"/><text x="283.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Стало</text><line x1="346" y1="33" x2="346" y2="192.6" stroke="#000" stroke-width="0.25"/><text x="378" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Кто решил, подпись</text><g data-el="issue-row" data-kind="change" data-id="ИЗ-10"><text x="32" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-10</text><text x="40.5" y="46.7" font-size="2.5" fill="#000">05.10.2026</text><text x="62.5" y="46.7" font-size="2.5" fill="#000">л. 19 — План розеток и электровыводов</text><text x="62.5" y="50.1" font-size="2.5" fill="#000">л. 22 — Ведомость электроточек и изделий</text><text x="122.5" y="46.7" font-size="2.5" fill="#000">Розетки Р7 (стиральная машина) и Р8 (фен) в ванной, Р33 (фен) в санузле 2</text><text x="122.5" y="50.1" font-size="2.5" fill="#000">стояли в зоне 3 по ПУЭ, но ближе 2,5 м от границы зоны 1 по британской</text><text x="122.5" y="53.5" font-size="2.5" fill="#000">норме BS 7671 (п. 701.512.3); какая норма принята — вопрос К-6.</text><text x="222.5" y="46.7" font-size="2.5" fill="#000">Принята норма ПУЭ (п. 7.1.48): розетки в зоне 3 помещения с ванной или душем допустимы при</text><text x="222.5" y="50.1" font-size="2.5" fill="#000">защите УЗО 30 мА. Положение розеток не менялось. Основание: розетки вне зон 0–2 (до границы</text><text x="222.5" y="53.5" font-size="2.5" fill="#000">зоны 1: Р7 — 650 мм, Р8 — 1220 мм, Р33 — 800 мм), исполнение IP44, группы 12 и 13 защищены</text><text x="222.5" y="56.9" font-size="2.5" fill="#000">УЗО 30 мА типа A. Это сознательное отступление от зарубежной нормы BS 7671: в России она не</text><text x="222.5" y="60.3" font-size="2.5" fill="#000">действует, по ней в таком месте допустима только бритвенная розетка с разделительным</text><text x="222.5" y="63.7" font-size="2.5" fill="#000">трансформатором. Высота розеток — отдельный вопрос К-7.</text><text x="347.5" y="46.7" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., автор проекта,</text><text x="347.5" y="50.1" font-size="2.5" fill="#000">05.10.2026. решение автора проекта, оформлено</text><text x="347.5" y="53.5" font-size="2.5" fill="#000">исполнителем по его поручению</text></g><line x1="25" y1="66.8" x2="410" y2="66.8" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-11"><text x="32" y="70.5" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-11</text><text x="40.5" y="70.5" font-size="2.5" fill="#000">05.10.2026</text><text x="62.5" y="70.5" font-size="2.5" fill="#000">л. 28 — План выводов сантехники</text><text x="62.5" y="73.9" font-size="2.5" fill="#000">л. 30 — Спецификация сантехнического</text><text x="62.5" y="77.3" font-size="2.5" fill="#000">оборудования</text><text x="62.5" y="80.7" font-size="2.5" fill="#000">л. 19 — План розеток и электровыводов</text><text x="62.5" y="84.1" font-size="2.5" fill="#000">л. 17 — Спецификация мебели и</text><text x="62.5" y="87.5" font-size="2.5" fill="#000">оборудования</text><text x="122.5" y="70.5" font-size="2.5" fill="#000">Ванная: стиральная машина П4 фронтальной загрузки 600 × 600 мм, габарит</text><text x="122.5" y="73.9" font-size="2.5" fill="#000">условный (модель не выбрана); перед люком ванна П1, свободно 50 мм вместо</text><text x="122.5" y="77.3" font-size="2.5" fill="#000">500 — дверца не откроется (вопросы К-1, К-19).</text><text x="222.5" y="70.5" font-size="2.5" fill="#000">Утверждена стиральная машина с вертикальной загрузкой, габарит в плане 400 × 600 мм (ширина</text><text x="222.5" y="73.9" font-size="2.5" fill="#000">400 вдоль стены Б, глубина 600). На плане П4 уменьшена с 600 × 600 до 400 × 600, место у стены</text><text x="222.5" y="77.3" font-size="2.5" fill="#000">Б прежнее (500 мм от стены А), розетка Р7 остаётся на стене Б у машины. Габарит и тип загрузки</text><text x="222.5" y="80.7" font-size="2.5" fill="#000">— условие закупки, а не пожелание: машина с фронтальной загрузкой или большего габарита</text><text x="222.5" y="84.1" font-size="2.5" fill="#000">проекту не подходит (перед люком ванна П1). Условие записано в спецификации сантехнического</text><text x="222.5" y="87.5" font-size="2.5" fill="#000">оборудования, на листе выводов сантехники и в вопросе К-19 (задание на закупку). Модель</text><text x="222.5" y="90.9" font-size="2.5" fill="#000">по-прежнему не выбрана: габарит и подводку сверить по паспорту до закрытия трасс.</text><text x="222.5" y="94.3" font-size="2.5" fill="#000">Спецификация мебели и оборудования выводит габарит машины по осям плана — 600 × 400 мм:</text><text x="222.5" y="97.7" font-size="2.5" fill="#000">это тот же размер (глубина 600 в комнату, ширина 400 вдоль стены).</text><text x="347.5" y="70.5" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., автор проекта,</text><text x="347.5" y="73.9" font-size="2.5" fill="#000">05.10.2026. решение автора проекта, оформлено</text><text x="347.5" y="77.3" font-size="2.5" fill="#000">исполнителем по его поручению</text></g><line x1="25" y1="100.8" x2="410" y2="100.8" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-12"><text x="32" y="104.5" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-12</text><text x="40.5" y="104.5" font-size="2.5" fill="#000">05.10.2026</text><text x="62.5" y="104.5" font-size="2.5" fill="#000">л. 51 — Кухня (пом. 6). Развёртка гарнитура</text><text x="62.5" y="107.9" font-size="2.5" fill="#000">л. 19 — План розеток и электровыводов</text><text x="62.5" y="111.3" font-size="2.5" fill="#000">л. 17 — Спецификация мебели и</text><text x="62.5" y="114.7" font-size="2.5" fill="#000">оборудования</text><text x="122.5" y="104.5" font-size="2.5" fill="#000">Кухня-гостиная: раскладка гарнитура и выводы техники приняты по типовой</text><text x="122.5" y="107.9" font-size="2.5" fill="#000">расстановке, проект кухни не утверждён (вопрос К-8).</text><text x="222.5" y="104.5" font-size="2.5" fill="#000">Раскладка гарнитура принята проектной: мойка М7 у шахты Ш2, посудомоечная М14 рядом с</text><text x="222.5" y="107.9" font-size="2.5" fill="#000">мойкой, варочная панель и духовой шкаф в М8, вытяжка М15, холодильник М6. Условие: до начала</text><text x="222.5" y="111.3" font-size="2.5" fill="#000">черновых работ сверить раскладку и выводы техники с чертежом кухни от изготовителя;</text><text x="222.5" y="114.7" font-size="2.5" fill="#000">расхождения вносятся в реестр изменений, выводы пересматриваются по его чертежу. Проект</text><text x="222.5" y="118.1" font-size="2.5" fill="#000">кухни остаётся неутверждённым до этой сверки: позиции М7 и М8 сохраняют знак «*»,</text><text x="222.5" y="121.5" font-size="2.5" fill="#000">примечание о выводах кухонной техники на листах сохранено, вопрос К-8 открыт.</text><text x="347.5" y="104.5" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., автор проекта,</text><text x="347.5" y="107.9" font-size="2.5" fill="#000">05.10.2026. решение автора проекта, оформлено</text><text x="347.5" y="111.3" font-size="2.5" fill="#000">исполнителем по его поручению</text></g><line x1="25" y1="124.6" x2="410" y2="124.6" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-13"><text x="32" y="128.3" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-13</text><text x="40.5" y="128.3" font-size="2.5" fill="#000">05.10.2026</text><text x="62.5" y="128.3" font-size="2.5" fill="#000">л. 2 — Общие данные</text><text x="122.5" y="128.3" font-size="2.5" fill="#000">Графы «Пров.» и «Н. контр.» основной надписи пусты (вопрос К-15); как с</text><text x="122.5" y="131.7" font-size="2.5" fill="#000">ними поступать — не записано.</text><text x="222.5" y="128.3" font-size="2.5" fill="#000">Графы «Пров.» и «Н. контр.» остаются пустыми: независимой проверки и нормоконтроля проекта</text><text x="222.5" y="131.7" font-size="2.5" fill="#000">не было, автор проекта сам себе их не подписывает. Комплект выпускается предварительным: пока</text><text x="222.5" y="135.1" font-size="2.5" fill="#000">нет подписи проверяющего и нормоконтролёра, отличных от разработчика, он не считается</text><text x="222.5" y="138.5" font-size="2.5" fill="#000">окончательным.</text><text x="347.5" y="128.3" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., автор проекта,</text><text x="347.5" y="131.7" font-size="2.5" fill="#000">05.10.2026. решение автора проекта, оформлено</text><text x="347.5" y="135.1" font-size="2.5" fill="#000">исполнителем по его поручению</text></g><line x1="25" y1="141.6" x2="410" y2="141.6" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-14"><text x="32" y="145.3" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-14</text><text x="40.5" y="145.3" font-size="2.5" fill="#000">05.10.2026</text><text x="62.5" y="145.3" font-size="2.5" fill="#000">л. 2 — Общие данные</text><text x="122.5" y="145.3" font-size="2.5" fill="#000">Матрицы ответственности (делает / поставляет / принимает / хранит) нет; кто</text><text x="122.5" y="148.7" font-size="2.5" fill="#000">покупает и кто монтирует — не определено.</text><text x="222.5" y="145.3" font-size="2.5" fill="#000">Принята типовая схема частного ремонта: материалы и оборудование покупает заказчик по</text><text x="222.5" y="148.7" font-size="2.5" fill="#000">спецификациям проекта; монтаж ведёт подрядная бригада; приёмку скрытых работ ведёт автор</text><text x="222.5" y="152.1" font-size="2.5" fill="#000">проекта; хранение — по договору подряда. Распределение закреплено по радиаторам,</text><text x="222.5" y="155.5" font-size="2.5" fill="#000">подоконникам, дверям и коробам скрытых дверей, розеткам и выключателям, сантехническим</text><text x="222.5" y="158.9" font-size="2.5" fill="#000">приборам, светильникам, отделочным материалам и плитке. Это схема по умолчанию, не факт:</text><text x="222.5" y="162.3" font-size="2.5" fill="#000">состав подрядчиков и поставщиков от заказчика не получен (вопрос К-22), схема уточняется</text><text x="222.5" y="165.7" font-size="2.5" fill="#000">договором подряда.</text><text x="347.5" y="145.3" font-size="2.5" fill="#000">Утверждено: исполнитель по поручению Кырлана</text><text x="347.5" y="148.7" font-size="2.5" fill="#000">А.С., 05.10.2026. решение исполнителя</text></g><line x1="25" y1="168.8" x2="410" y2="168.8" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-15"><text x="32" y="172.5" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-15</text><text x="40.5" y="172.5" font-size="2.5" fill="#000">05.10.2026</text><text x="62.5" y="172.5" font-size="2.5" fill="#000">л. 19 — План розеток и электровыводов</text><text x="62.5" y="175.9" font-size="2.5" fill="#000">л. 22 — Ведомость электроточек и изделий</text><text x="122.5" y="172.5" font-size="2.5" fill="#000">Розетка Р7 (стиральная машина, ванная) на стене Б со смещением 685 мм:</text><text x="122.5" y="175.9" font-size="2.5" fill="#000">348 мм от стояка холодной воды Ст В1-1 при практике приёмки не ближе 500</text><text x="122.5" y="179.3" font-size="2.5" fill="#000">мм.</text><text x="222.5" y="172.5" font-size="2.5" fill="#000">Р7 на стене Б со смещением 985 мм (на 300 мм дальше вдоль стены, по-прежнему у стиральной</text><text x="222.5" y="175.9" font-size="2.5" fill="#000">машины П4; высота 1000 мм прежняя): до стояка Ст В1-1 644 мм. Новое место — на шве плитки.</text><text x="222.5" y="179.3" font-size="2.5" fill="#000">Расстояние Р7 до границы зоны 1 стало 691 мм вместо 650 мм, названных в ИЗ-10; принятая там</text><text x="222.5" y="182.7" font-size="2.5" fill="#000">норма ПУЭ и положение Р8 и Р33 не затронуты. Положение стояков условно (К-17): отступ сделан</text><text x="222.5" y="186.1" font-size="2.5" fill="#000">от принятого положения, не от замера. Решение исполнителя; знак «*» у Р7 остаётся (высота</text><text x="222.5" y="189.5" font-size="2.5" fill="#000">вопрос К-7).</text><text x="347.5" y="172.5" font-size="2.5" fill="#000">Утверждено: исполнитель по поручению Кырлана</text><text x="347.5" y="175.9" font-size="2.5" fill="#000">А.С., 05.10.2026. решение исполнителя</text></g></g><g data-el="notes"><text x="25" y="205" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="209.8" font-size="2.5" fill="#000">1. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text><text x="25" y="213.2" font-size="2.5" fill="#000">2. Графа «Если решения нет» показывает состояние решения на листах; влияние на сроки и стоимость по пунктам не оценивалось.</text><text x="25" y="216.6" font-size="2.5" fill="#000">3. Пункт, по которому принято решение, при следующем выпуске комплекта из таблиц исключается.</text></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Кол.уч</text><text x="255" y
dth="0.18"/><text x="284.5" y="40.2" font-size="2.5" fill="#000">плинтус МДФ 80×16 под окраску в цвет стены; клей монтажный — к стене, не к полу</text><circle cx="236.5" cy="51" r="0.45" fill="#000"/><line x1="236.5" y1="51" x2="283.5" y2="46.8" stroke="#000" stroke-width="0.18"/><line x1="283.5" y1="46.8" x2="363.9" y2="46.8" stroke="#000" stroke-width="0.18"/><text x="284.5" y="46" font-size="2.5" fill="#000">штукатурка, шпаклёвка Q3, окраска — по ведомости отделки</text><circle cx="238.3" cy="84.4" r="0.45" fill="#000"/><line x1="238.3" y1="84.4" x2="283.5" y2="52.6" stroke="#000" stroke-width="0.18"/><line x1="283.5" y1="52.6" x2="358.3" y2="52.6" stroke="#000" stroke-width="0.18"/><text x="284.5" y="51.8" font-size="2.5" fill="#000">зазор покрытия у стены 8–10 мм закрывается плинтусом</text><circle cx="257.5" cy="84.4" r="0.45" fill="#000"/><line x1="257.5" y1="84.4" x2="283.5" y2="58.4" stroke="#000" stroke-width="0.18"/><line x1="283.5" y1="58.4" x2="319.1" y2="58.4" stroke="#000" stroke-width="0.18"/><text x="284.5" y="57.6" font-size="2.5" fill="#000">инженерная доска на клею</text></g></g><g data-el="legend"><text x="25" y="224.5" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><g><rect x="25" y="228" width="8" height="3.6" fill="url(#h-concrete)" stroke="#000" stroke-width="0.25"/></g><text x="35" y="230.8" font-size="2.5" fill="#000">железобетон (плита, стены)</text><g><rect x="25" y="233.6" width="8" height="3.6" fill="url(#h-brick)" stroke="#000" stroke-width="0.25"/></g><text x="35" y="236.4" font-size="2.5" fill="#000">кладка, перегородка</text><g><rect x="91" y="228" width="8" height="3.6" fill="url(#h-screed)" stroke="#000" stroke-width="0.25"/></g><text x="101" y="230.8" font-size="2.5" fill="#000">стяжка, раствор</text><g><rect x="91" y="233.6" width="8" height="3.6" fill="#e4e4de" stroke="#000" stroke-width="0.25"/></g><text x="101" y="236.4" font-size="2.5" fill="#000">плитка, керамогранит на клею</text><g><rect x="157" y="228" width="8" height="3.6" fill="#d8c3a0" stroke="#000" stroke-width="0.25"/></g><text x="167" y="230.8" font-size="2.5" fill="#000">инженерная доска (покрытие пола)</text><g><rect x="157" y="233.6" width="8" height="3.6" fill="none" stroke="#1a1a1a" stroke-width="0.5"/></g><text x="167" y="236.4" font-size="2.5" fill="#000">гидроизоляция (обмазочная, лента)</text></g><g data-el="ref-back" data-target="48"/><g data-el="notes"><text x="25" y="246.2" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="251.2" font-size="2.5" fill="#000">1. Узлы — типовые решения проекта для мест, отмеченных выносками на листе схемы расположения развёрток и узлов; размеры — в мм, отметки — в м от ±0,000.</text><text x="25" y="254.6" font-size="2.5" fill="#000">2. Узлы с гидроизоляцией, закладными и коробами скрытого монтажа принимаются по актам скрытых работ до закрытия отделкой; гидроизоляция — после теста проливом</text><text x="28" y="258" font-size="2.5" fill="#000">(24 ч).</text><text x="25" y="261.4" font-size="2.5" fill="#000">3. Марки изделий (порог, Т-профиль, короб скрытой двери, люк) — по спецификациям; замена — на аналог с теми же габаритами по согласованию с автором проекта.</text><text x="25" y="264.8" font-size="2.5" fill="#000">4. Узлы комплекта выпущены на 2 листах, нумерация узлов сквозная: 1–4 — лист 66 альбома; 5–6 — лист 67 альбома (данный лист).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1=
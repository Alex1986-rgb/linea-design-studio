<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Развёртка стены Г. Гардеробная (пом. 3)" data-sheet="elevation" data-scale="1:20"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Развёртка стены Г. Гардеробная (пом. 3)</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Гардеробная (пом. 3) · вид изнутри помещения · размеры в мм, отметки в м</text><defs><pattern id="h-concrete" patternUnits="userSpaceOnUse" width="2.5" height="2.5"><line x1="0" y1="2.5" x2="2.5" y2="0" stroke="#000" stroke-width="0.18"/><circle cx="0.7" cy="0.7" r="0.18" fill="#000"/></pattern><pattern id="h-screed" patternUnits="userSpaceOnUse" width="2.4" height="2.4"><circle cx="0.6" cy="0.6" r="0.16" fill="#000"/><circle cx="1.8" cy="1.6" r="0.16" fill="#000"/></pattern></defs><g data-el="view" data-scale="1:20" data-wall="D"><text x="117.32" y="26" font-size="3.5" font-weight="700" text-decoration="underline" fill="#000">Развёртка стены Г</text><g data-el="finish-zones"><clipPath id="ez-r3D0"><rect x="117.32" y="33" width="97" height="135"/></clipPath><g clip-path="url(#ez-r3D0)"><rect x="117.32" y="33" width="97" height="135" fill="#EEEEE9" fill-opacity="0.55" stroke="none"/><rect x="117.32" y="164" width="97" height="4" fill="#fff" stroke="#000" stroke-width="0.25"/></g></g><g data-el="openings"></g><g data-el="furniture" opacity="0.6"><rect x="185.07" y="48" width="29.25" height="120" fill="#fff" stroke="#000" stroke-width="0.35"/></g><text x="199.69" y="51.6" font-size="2.5" text-anchor="middle" fill="#000" textLength="3.26" lengthAdjust="spacingAndGlyphs">Г1**</text><g data-el="walls"><rect x="109.82" y="30" width="7.5" height="144.2" fill="#cfcfcf" stroke="#000" stroke-width="0.7"/><r
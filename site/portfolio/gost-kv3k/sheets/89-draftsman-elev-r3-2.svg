="2.5" fill="#000">марка отделки по реестру отделки альбома</text><g><g data-wall="C"><text x="296" y="102.6" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">А</text><path d="M 296 106.6 L 294.5 104.45 L 297.5 104.45 Z" fill="#000"/><circle cx="296" cy="101.7" r="2.5" fill="none" stroke="#000" stroke-width="0.35"/></g></g><text x="303" y="103.8" font-size="2.5" fill="#000">марка развёртки: буква стены, стрелка — взгляд</text></g><g data-el="finish-table"><text x="292" y="119.7" font-size="3.5" font-weight="700" fill="#000">Ведомость отделки (на листе)</text><rect x="292" y="122.2" width="118" height="39.4" fill="none" stroke="#000" stroke-width="0.5"/><line x1="292" y1="132.2" x2="410" y2="132.2" stroke="#000" stroke-width="0.5"/><text x="297.5" y="128.1" font-size="2.5" text-anchor="middle" fill="#000">Марка</text><line x1="303" y1="122.2" x2="303" y2="161.6" stroke="#000" stroke-width="0.25"/><text x="311" y="126.4" font-size="2.5" text-anchor="middle" fill="#000">Поверх</text><text x="311" y="129.8" font-size="2.5" text-anchor="middle" fill="#000">ность</text><line x1="319" y1="122.2" x2="319" y2="161.6" stroke="#000" stroke-width="0.25"/><text x="343" y="128.1" font-size="2.5" text-anchor="middle" fill="#000">Материал, изделие</text><line x1="367" y1="122.2" x2="367" y2="161.6" stroke="#000" stroke-width="0.25"/><text x="381" y="128.1" font-size="2.5" text-anchor="middle" fill="#000">Цвет, код</text><line x1="395" y1="122.2" x2="395" y2="161.6" stroke="#000" stroke-width="0.25"/><text x="402.5" y="128.1" font-size="2.5" text-anchor="middle" fill="#000">Кол.</text><g><text x="297.5" y="138.05" font-size="2.5" text-anchor="middle" fill="#000">О4</text><text x="304.5" y="138.05" font-size="2.5" fill="#000">потолок</text><text x="320.5" y="136.35" font-size="2.5" fill="#000">окраска, Tikkurila Anti-Reflex</text><text x="320.5" y="139.75" font-size="2.5" fill="#000">2, глубокоматовая, подготовка Q3</text><text x="368.5" y="136.35" font-size="2.5" fill="#000">Tikkurila V503</text><text x="368.5" y="139.75" font-size="2.5" fill="#000">«Winter»</text><text x="408.5" y="138.05" font-size="2.5" text-anchor="end" fill="#000">1,9 м²</text></g><line x1="292" y1="142" x2="410" y2="142" stroke="#000" stroke-width="0.25"/><g><text x="297.5" y="147.85" font-size="2.5" text-anchor="middle" fill="#000">О9</text><text x="304.5" y="147.85" font-size="2.5" fill="#000">стены</text><text x="320.5" y="146.15" font-size="2.5" fill="#000">окраска, Tikkurila Harmony,</text><text x="320.5" y="149.55" font-size="2.5" fill="#000">матовая, подготовка Q3</text><text x="368.5" y="146.15" font-size="2.5" fill="#000">Tikkurila V503</text><text x="368.5" y="149.55" font-size="2.5" fill="#000">«Winter»</text><text x="408.5" y="147.85" font-size="2.5" text-anchor="end" fill="#000">5,2 м²</text></g><line x1="292" y1="151.8" x2="410" y2="151.8" stroke="#000" stroke-width="0.25"/><g><text x="297.5" y="157.65" font-size="2.5" text-anchor="middle" fill="#000">О10</text><text x="304.5" y="157.65" font-size="2.5" fill="#000">плинтус</text><text x="320.5" y="155.95" font-size="2.5" fill="#000">плинтус МДФ, h 80 мм, аналог:</text><text x="320.5" y="159.35" font-size="2.5" fill="#000">плинтус МДФ под покраску 80×16</text><text x="368.5" y="155.95" font-size="2.5" fill="#000">Tikkurila V503</text><text x="368.5" y="159.35" font-size="2.5" fill="#000">«Winter»</text><text x="408.5" y="157.65" font-size="2.5" text-anchor="end" fill="#000">1,9 м</text></g></g><g data-el="ref-back" data-target="79"/><g data-el="notes"><text x="25" y="238" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="243" font-size="2.5" fill="#000">1. Развёртки — вид на стену изнутри помещения, по часовой стрелке; расположение — на схеме листа и на листе 79; размеры — в мм по чистовым поверхностям;</text><text x="28" y="246.4" font-size="2.5" fill="#000">отметки — в м от ±0,000; высоты Н — от чистого пола помещения до оси изделия, у декора — до центра.</text><text x="25" y="249.8" font-size="2.5" fill="#000">2. Схема мебели, приборов и декора не является технической документацией для производства мебели; габариты — по паспортам изделий.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="75" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="75" y1="285.5" x2="75" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="77" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="furniture:Г1|datum:existingFloor" data-ids="К-9 К-11 К-12 К-13 К-14 К-18 К-20 К-27 К-29" data-level="0"><text x="45.5" y="198.6" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="45.5" y="202" font-size="2.5" fill="#000">Основа листа: размеры сняты со скана плана заказчика по размерным цепочкам, контрольный обмер на объекте не выполнялся (К-13); высота потолка 2700 мм принята: на плане заказчика не</text><text x="45.5" y="205.4" font-size="2.5" fill="#000">указана (К-11); толщины стен приняты: наружные 250 мм, перегородки 150 мм (на плане 85–190 мм) (К-13); разрешённая мощность 15 кВт принята по типовой квартире, технических условий нет</text><text x="45.5" y="208.8" font-size="2.5" fill="#000">(К-14); утолщение стены 190 × 1360 мм и элемент 1470 × 160 мм плана заказчика не определены (К-12); ниши санузла 2 закрыты перегородкой и фальш-стеной: проектное решение, на плане</text><text x="45.5" y="212.2" font-size="2.5" fill="#000">заказчика ниша у входа открыта (К-18); несущие стены не определены: до технического заключения все существующие стены считаются несущими (К-20); окна существующие и сохраняются;</text><text x="45.5" y="215.6" font-size="2.5" fill="#000">подоконная доска и глубина откосов не заданы — приняты, не замерены (К-27); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-29).</text><text x="45.5" y="219" font-size="2.5" fill="#000">Знак «*» — принято, не замерено и не подтверждено (замерить на объекте): К-13: отметка существующего пола — отметка существующего пола и верха плиты не замерена: на плане заказчика</text><text x="45.5" y="222.4" font-size="2.5" fill="#000">отметок нет; нивелировка — в задании на обмер (К-13).</text><text x="45.5" y="225.8" font-size="2.5" fill="#000">Знак «**» — предложение проектировщика, заказчиком не утверждено (согласовать с заказчиком): К-9: Г1 — гардеробная 880 мм: система глубиной 600 вдоль длинной стены оставляла проход 280</text><text x="45.5" y="229.2" font-size="2.5" fill="#000">мм — система перенесена на торцевую стену А, проход по всей ширине 880 мм.</text><text x="45.5" y="232.6" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, запись К-9; лист 7, записи К-11–К-14, К-18, К-20; лист 8, записи К-27, К-29).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262"
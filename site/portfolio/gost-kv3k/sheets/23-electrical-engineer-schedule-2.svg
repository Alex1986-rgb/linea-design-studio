ize="2.5" text-anchor="start" fill="#000">L18: Св52</text><line x1="25" y1="81" x2="117" y2="81" stroke="#000" stroke-width="0.18"/><text x="26.5" y="79.3" font-size="2.5" text-anchor="start" fill="#000">S14</text><text x="37.5" y="79.3" font-size="2.5" text-anchor="start" fill="#000">8</text><text x="45.5" y="79.3" font-size="2.5" text-anchor="start" fill="#000">900</text><text x="55.5" y="79.3" font-size="2.5" text-anchor="start" fill="#000">1</text><text x="64.5" y="79.3" font-size="2.5" text-anchor="start" fill="#000">перекрёстный</text><text x="84.5" y="79.3" font-size="2.5" text-anchor="start" textLength="27.57" lengthAdjust="spacingAndGlyphs" fill="#000">L10: Св26–Св29, Св53, Св54</text><line x1="25" y1="87" x2="117" y2="87" stroke="#000" stroke-width="0.18"/><text x="26.5" y="85.3" font-size="2.5" text-anchor="start" fill="#000">S15</text><text x="37.5" y="85.3" font-size="2.5" text-anchor="start" fill="#000">8</text><text x="45.5" y="85.3" font-size="2.5" text-anchor="start" fill="#000">900</text><text x="55.5" y="85.3" font-size="2.5" text-anchor="start" fill="#000">1</text><text x="64.5" y="85.3" font-size="2.5" text-anchor="start" fill="#000">обычный</text><text x="84.5" y="85.3" font-size="2.5" text-anchor="start" fill="#000">L4: Св12–Св14</text><line x1="25" y1="93" x2="117" y2="93" stroke="#000" stroke-width="0.18"/><text x="26.5" y="91.3" font-size="2.5" text-anchor="start" fill="#000"></text><text x="37.5" y="91.3" font-size="2.5" text-anchor="start" fill="#000"></text><text x="45.5" y="91.3" font-size="2.5" text-anchor="start" fill="#000"></text><text x="55.5" y="91.3" font-size="2.5" text-anchor="start" fill="#000">2</text><text x="64.5" y="91.3" font-size="2.5" text-anchor="start" fill="#000">обычный</text><text x="84.5" y="91.3" font-size="2.5" text-anchor="start" fill="#000">L5: Св15</text><line x1="25" y1="99" x2="117" y2="99" stroke="#000" stroke-width="0.18"/><text x="26.5" y="97.3" font-size="2.5" text-anchor="start" fill="#000">S16</text><text x="37.5" y="97.3" font-size="2.5" text-anchor="start" fill="#000">8</text><text x="45.5" y="97.3" font-size="2.5" text-anchor="start" fill="#000">900</text><text x="55.5" y="97.3" font-size="2.5" text-anchor="start" fill="#000">1</text><text x="64.5" y="97.3" font-size="2.5" text-anchor="start" fill="#000">обычный</text><text x="84.5" y="97.3" font-size="2.5" text-anchor="start" fill="#000">L6: Св16</text><text x="26.5" y="103.3" font-size="2.5" text-anchor="start" fill="#000"></text><text x="37.5" y="103.3" font-size="2.5" text-anchor="start" fill="#000"></text><text x="45.5" y="103.3" font-size="2.5" text-anchor="start" fill="#000"></text><text x="55.5" y="103.3" font-size="2.5" text-anchor="start" fill="#000">2</text><text x="64.5" y="103.3" font-size="2.5" text-anchor="start" fill="#000">проходной</text><text x="84.5" y="103.3" font-size="2.5" text-anchor="start" textLength="27.57" lengthAdjust="spacingAndGlyphs" fill="#000">L10: Св26–Св29, Св53, Св54</text></g><g data-el="notes"><text x="25" y="241" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="246" font-size="2.5" fill="#000">1. Продолжение ведомостей: лист 2 из 2 этого наименования; таблицы, прерванные на предыдущем листе, продолжены с заголовком «(продолжение)».</text><text x="25" y="249.4" font-size="2.5" fill="#000">2. За отметку 0,000 принят уровень чистого пола. Высоты Н — от чистого пола до оси изделия; привязки — от чистовой грани стены до оси механизма (у рамки на</text><text x="28" y="252.8" font-size="2.5" fill="#000">несколько постов — до оси рамки).</text><text x="25" y="256.2" font-size="2.5" fill="#000">3. Розеточные и мокрые линии — через УЗО или дифавтомат с током утечки не более 30 мА (ПУЭ 7.1.79); в санузле выполнить ДСУП (ПУЭ 7.1.87–7.1.88).</text><text x="25" y="259.6" font-size="2.5" fill="#000">4. Кабель — медный, исполнение нг(А)-LS (ГОСТ 31565-2012); скрытая прокладка только горизонтально и вертикально, фактические трассы зафиксировать исполнительной</text><text x="28" y="263" font-size="2.5" fill="#000">схемой до закрытия отделкой.</text><text x="25" y="266.4" font-size="2.5" fill="#000">5. Расчёт нагрузок, токов КЗ, селективности и сечений — по проекту ЭОМ организации с допуском СРО; лист задаёт состав, расположение и группы.</text></g><g data-el="assumed-notes" data-flags="point:S11|point:S12|point:Св42|point:Св44|point:Св49" data-ids="ИЗ-3 К-11 К-12 К-13 К-14 К-18 К-20" data-level="0"><text x="22.5" y="213.7" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="22.5" y="217.1" font-size="2.5" fill="#000">Основа листа: размеры сняты со скана плана заказчика по размерным цепочкам, контрольный обмер на объекте не выполнялся (К-13); высота потолка 2700 мм принята: на плане заказчика не</text><text x="22.5" y="220.5" font-size="2.5" fill="#000">указана (К-11); толщины стен приняты: наружные 250 мм, перегородки 150 мм (на плане 85–190 мм) (К-13); разрешённая мощность 15 кВт принята по типовой квартире, технических условий нет</text><text x="22.5" y="223.9" font-size="2.5" fill="#000">(К-14); утолщение стены 190 × 1360 мм и элемент 1470 × 160 мм плана заказчика не определены (К-12); ниши санузла 2 закрыты перегородкой и фальш-стеной: проектное решение, на плане</text><text x="22.5" y="227.3" font-size="2.5" fill="#000">заказчика ниша у входа открыта (К-18); несущие стены не определены: до технического заключения все существующие стены считаются несущими (К-20).</text><text x="22.5" y="230.7" font-size="2.5" fill="#000">Знак «*» — предложение проектировщика, заказчиком не утверждено: ИЗ-3: S11, S12, Св42, Св44, Св49.</text><text x="22.5" y="234.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-11–К-14, К-18, К-20; лист 7, запись ИЗ-3).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" fill="#000">05.10.26</text><text x="231" y="270.8" font-size="2.5" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" fill="#000">ГД-2026-003-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" fill="#000">Трёхкомнатная квартира</text><text x="297" y="259.2" font-size="2.5" fill="#000">Общая площадь 78,95* м² · * размеры со скана, не замерены (реестр — л. 5–8, К-13)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" fill="#000">Дизайн-проект интерьера трёхкомнатной квартиры</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">23</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">79</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="283.2" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">Ведомость электроточек и изделий</text><text x="330" y="287" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">(продолжение)</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="20" data-positions="37" data-basis="7"><rect x="314.27" y="6.2" width="99.23" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="316.27" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 20 (реестр — л. 5–8)</text></g></svg>
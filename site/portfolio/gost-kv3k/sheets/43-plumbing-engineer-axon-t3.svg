<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Аксонометрическая схема Т3 (горячее водоснабжение)" data-sheet="plumbing" data-scale="1:100"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Аксонометрическая схема Т3 (горячее водоснабжение)</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">аксонометрия · диаметры, уклоны, отметки, стояки и приборы · трассы принципиальные</text><g data-el="view" data-scale="1:100"><text x="25" y="22" font-size="3.5" font-weight="700" fill="#000">Схема Т3 (М 1:100; по вертикали и горизонтали один масштаб, глубина — ×0,5 под 45°)</text><g data-el="rooms-ctx"><path d="M 61.71 76.97 L 84.21 76.97 L 77.25 83.94 L 54.75 83.94 Z" fill="none" stroke="#9a9a9a" stroke-width="0.18"/><path d="M 56.06 103.03 L 72.06 103.03 L 67 108.09 L 51 108.09 Z" fill="none" stroke="#9a9a9a" stroke-width="0.18"/><path d="M 70.52 88.57 L 127.22 88.57 L 116.19 99.6 L 59.49 99.6 Z" fill="none" stroke="#9a9a9a" stroke-width="0.18"/></g><g data-el="pipes"><path d="M 81.79 78 L 81.49 78 L 81.91 77.58 L 62.81 77.58 L 58.11 82.28 L 56.41 82.28" fill="none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><path d="M 56.41 82.28 L 56.41 76.28" fill="none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><path d="M 68.14 107.7 L 65.69 107.7 L 69.75 103.63 L 58.7 103.63 L 59.31 103.03" fill="none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><path d="M 59.31 103.03 L 59.31 91.03" fill="none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><path d="M 68.36 77.58 L 68.96 76.97" fill="none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><path d="M 68.96 76.97 L 68.96 68.97" fill="none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><path d="M 68.14 107.7 L 71.79 107.7 L 71.08 108.41 L 79.88 108.41 L 79.28 109.01" fill="none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><path d="M 79.28 109.01 L 79.28 103.01" fill="none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><path d="M 66.89 106.5 L 68.59 106.5" fill="none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><path d="M 68.59 106.5 L 68.59 100.5" fill="none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/></g><g data-el="pl-marks"><circle cx="68.14" cy="107.7" r="0.6" fill="#c0392b"/><circle cx="68.36" cy="77.58" r="0.6" fill="#c0392b"/><circle cx="68.14" cy="107.7" r="0.6" fill="#c0392b"/><circle cx="66.89" cy="106.5" r="0.6" fill="#c0392b"/><g data-el="pl-outlet" data-index="Т3"><circle cx="56.41" cy="76.28" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="Т3"><circle cx="59.31" cy="91.03" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="Т3"><circle cx="68.96" cy="68.97" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="Т3"><circle cx="79.28" cy="103.01" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="Т3"><circle cx="68.59" cy="100.5" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/></g></g><g data-el="risers"><g data-el="riser" data-index="Т3"><path d="M 81.79 80.5 L 81.79 51" fill="none" stroke="#c0392b" stroke-width="0.7" stroke-dasharray="1.6 1"/><path d="M 79.99 80 L 81.19 81 L 82.39 80 L 83.59 81" fill="none" stroke="#000" stroke-width="0.25"/><path d="M 79.99 50.5 L 81.19 51.5 L 82.39 50.5 L 83.59 51.5" fill="none" stroke="#000" stroke-width="0.25"/><circle cx="81.79" cy="78" r="1.1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/></g><g data-el="riser" data-index="Т3"><path d="M 68.14 110.2 L 68.14 80.7" fill="none" stroke="#c0392b" stroke-width="0.7" stroke-dasharray="1.6 1"/><path d="M 66.34 109.7 L 67.54 110.7 L 68.74 109.7 L 69.94 110.7" fill="none" stroke="#000" stroke-width="0.25"/><path d="M 66.34 80.2 L 67.54 81.2 L 68.74 80.2 L 69.94 81.2" fill="none" stroke="#000" stroke-width="0.25"/><circle cx="68.14" cy="107.7" r="1.1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/></g></g><g data-el="pl-labels"><text x="44.05" y="84.54" font-size="2.5" fill="#555">2 Ванная</text><text x="37.5" y="108.69" font-size="2.5" fill="#555">7 Санузел 2</text><text x="41.27" y="100.2" font-size="2.5" fill="#555">6 Кухня-гостиная</text><text x="75.5" y="45.4" font-size="2.5" fill="#c0392b">Ст Т3-1* Ø32</text><text x="75.5" y="48.4" font-size="2.5" fill="#c0392b">+2,700</text><text x="85.09" y="74" font-size="2.5" fill="#000">−0,015</text><text x="71.44" y="112.9" font-size="2.5" fill="#000">−0,015</text><text x="52.68" y="70.68" font-size="2.5" fill="#000">Т3-2 П3</text><text x="52.68" y="73.68" font-size="2.5" fill="#000">Н=600*</text><text x="49.37" y="90.13" font-size="2.5" fill="#000">Т3-4 П6</text><text x="49.37" y="93.13" font-size="2.5" fill="#000">Н=1200*</text><text x="70.86" y="68.07" font-size="2.5" fill="#000">Т3-1 П1</text><text x="70.86" y="71.07" font-size="2.5" fill="#000">Н=800*</text><text x="81.18" y="106.81" font-size="2.5" fill="#000" textLength="8.61" lengthAdjust="spacingAndGlyphs">Т3-3 П11*</text><text x="81.18" y="109.81" font-size="2.5" fill="#000">Н=600</text><text x="71.89" y="93.5" font-size="2.5" fill="#000">Т3-5 П8</text><text x="71.89" y="96.5" font-size="2.5" fill="#000">Н=600*</text></g></g><g data-el="legend-box"><g data-el="legend"><text x="310" y="25" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><line x1="310.5" y1="31" x2="317.5" y2="31" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><text x="321" y="31.9" font-size="2.5" fill="#000">Т3 — горячее водоснабжение, подача (ГВС), PP-R Ø20</text><circle cx="314" cy="36" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/><text x="321" y="36.9" font-size="2.5" fill="#000">вывод Т3 (код — в ведомости привязок)</text><circle cx="314" cy="41" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="321" y="41.9" font-size="2.5" fill="#000">стояк «Ст К1-N / Ст В1-N» (ГОСТ 21.601), Ø мм</text><circle cx="314" cy="46" r="1.1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/><text x="321" y="46.9" font-size="2.5" fill="#000">стояк в плане (на отметке пола); вертикаль — стояк по высоте,</text><text x="321" y="50.2" font-size="2.5" fill="#000">разрыв — перекрытие</text><circle cx="314" cy="54.3" r="0.6" fill="#000"/><text x="321" y="55.2" font-size="2.5" fill="#000">тройник (ответвление к прибору)</text><path d="M 312 58 L 316 60.6 L 316 58 L 312 60.6 Z" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="321" y="60.2" font-size="2.5" fill="#000">кран шаровой</text><circle cx="314" cy="64.3" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35" stroke-dasharray="0.8 0.6"/><text x="321" y="65.2" font-size="2.5" fill="#000">* стояк Т3 не на обмере — принят в шахте рядом со Ст В1, сверить</text></g></g><g data-el="notes"><text x="25" y="198" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="203" font-size="2.5" fill="#000">1. Схема Т3 построена по тем же трассам, что план разводки: положение в плане сохранено, глубина — в масштабе ×0,5. Трассы принципиальные; фактическое</text><text x="25" y="206.6" font-size="2.5" fill="#000">положение фиксируется исполнительной схемой до закрытия.</text><text x="25" y="210.2" font-size="2.5" fill="#000">2. Высоты Н — от чистого пола помещения, мм. Отметка прокладки магистрали Т3 (в стяжке, в стене или по полу) в данных не задана: участки показаны на</text><text x="25" y="213.8" font-size="2.5" fill="#000">уровне пола условно (записи реестра нет).</text><text x="25" y="217.4" font-size="2.5" fill="#000">3. * — высота вывода принята по практике монтажа; сверить по паспорту прибора.</text><text x="25" y="221" font-size="2.5" fill="#000">4. Узел ввода Т3 (кран, фильтр, счётчик, обратный клапан, кран) — на схеме разводки; состав узла ввода — по согласованию. Кран шаровой — на первом</text><text x="25" y="224.6" font-size="2.5" fill="#000">участке от стояка.</text><text x="25" y="228.2" font-size="2.5" fill="#000">5. Циркуляция ГВС в данных не задана — циркуляционного трубопровода на схеме нет (записи реестра нет).</text><text x="25" y="231.8" font-size="2.5" fill="#000" textLength="141.35" lengthAdjust="spacingAndGlyphs">6. Ст Т3-1, Ст Т3-2 на обмере не показаны: приняты рядом с Ст В1-1*, Ст В1-2* (в МКД стоят группой); положение сверить на объекте до разводки.</text><text x="25" y="235.4" font-size="2.5" fill="#000">7. Допущение проекта: санузел 2 — проектное решение: ниша 1600 × 1840 у входа (на плане открыта в кухню-гостиную) закрыта перегородкой по линии низа</text><text x="25" y="239" font-size="2.5" fill="#000">прихожей; ниша 660 × 260 у наружной стены (уступ по плану) закрыта фальш-стеной по линии уступа, в ней рама инсталляции унитаза.</text><text x="25" y="242.6" font-size="2.5" fill="#000">8. Допущение проекта: стояки: у ванной — в коробе Ш1 248 × 459; у санузла 2 — в стене-пилоне 270 мм (Ш2) между санузлом 2 и кухней; люки 300 × 400;</text><text x="25" y="246.2" font-size="2.5" fill="#000">положение стояков условно — сверить на объекте.</text><text x="25" y="249.8" font-size="2.5" fill="#000" textLength="155.44" lengthAdjust="spacingAndGlyphs">9. Допущение проекта: кухня: раскладка гарнитура принята проектной, решение автора (ИЗ-12) — мойка М7* у шахты Ш2, ПММ М14* рядом с мойкой, варочная и</text><text x="25" y="253.4" font-size="2.5" fill="#000" textLength="157.42" lengthAdjust="spacingAndGlyphs">духовой шкаф в М8*, вытяжка М15**, холодильник М6**; выводы техники — по типовой расстановке; условие: до начала черновых работ сверить раскладку и выводы</text><text x="25" y="257" font-size="2.5" fill="#000">с чертежом кухни от изготовителя, выводы пересматриваются по его чертежу (вопрос К-8).</text><text x="25" y="260.6" font-size="2.5" fill="#000" textLength="151.52" lengthAdjust="spacingAndGlyphs">10. Допущение проекта: стиральная машина П4* — вертикальной загрузки, габарит в плане 400 × 600 мм (ширина 400 вдоль стены Б): условие закупки, а не</text><text x="25" y="264.2" font-size="2.5" fill="#000">пожелание, решение автора (ИЗ-11); машина с фронтальной загрузкой или большего габарита не подходит — перед люком ванна П1; модель не выбрана, габарит</text><text x="25" y="267.8" font-size="2.5" fill="#000">и подводку сверить по паспорту до закрытия трасс (вопрос К-19).</text><text x="25" y="271.4" font-size="2.5" fill="#000" textLength="84.21" lengthAdjust="spacingAndGlyphs">11. Марки из допущений, которых нет на этом листе: М6**, М7*, М8*, М14*, М15** — лист 70.</text><text x="25" y="275" font-size="2.5" fill="#000">12. Трубы испытать давлением до закрытия (акт скрытых работ, опрессовка по СП 73.13330.2016).</text><text x="25" y="278.6" font-size="2.5" fill="#000">13. Диаметры, высоты выводов и места кранов — по паспортам выбранных приборов и расчёту проектной организации.</text><text x="25" y="282.2" font-size="2.5" fill="#000">14. Расчёт систем, диаметры магистралей и подбор оборудования выполняет проектная организация.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="35" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="35" y1="285.5" x2="35" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="37" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="fixture:П4|furniture:М6|furniture:М7|furniture:М14|furniture:М8|furniture:М15|fixture:П11|riser:Ст В1-1|riser:Ст В1-2|riser:Ст К1-1|riser:Ст К1-2" data-ids="ИЗ-5 ИЗ-11 К-8 К-11 К-12 К-13 К-14 К-17 К-18 К-19 К-20 К-27 К-29" data-level="0"><text x="45.5" y="155.2" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="45.5" y="158.6" font-size="2.5" fill="#000">Основа листа: размеры сняты со скана плана заказчика по размерным цепочкам, контрольный обмер на объекте не выполнялся (К-13); высота потолка 2700 мм принята: на плане заказчика не</text><text x="45.5" y="162" font-size="2.5" fill="#000">указана (К-11); толщины стен приняты: наружные 250 мм, перегородки 150 мм (на плане 85–190 мм) (К-13); разрешённая мощность 15 кВт принята по типовой квартире, технических условий нет</text><text x="45.5" y="165.4" font-size="2.5" fill="#000">(К-14); утолщение стены 190 × 1360 мм и элемент 1470 × 160 мм плана заказчика не определены (К-12); ниши санузла 2 закрыты перегородкой и фальш-стеной: проектное решение, на плане</text><text x="45.5" y="168.8" font-size="2.5" fill="#000">заказчика ниша у входа открыта (К-18); несущие стены не определены: до технического заключения все существующие стены считаются несущими (К-20); окна существующие и сохраняются;</text><text x="45.5" y="172.2" font-size="2.5" fill="#000">подоконная доска и глубина откосов не заданы — приняты, не замерены (К-27); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-29).</text><text x="45.5" y="175.6" font-size="2.5" fill="#000">Знак «*» — принято, не замерено и не подтверждено (замерить на объекте): ИЗ-11, К-19: П4 — вертикальная загрузка 400 × 600 мм — условие закупки (решение автора, ИЗ-11); модель не выбрана,</text><text x="45.5" y="179" font-size="2.5" fill="#000">габарит сверить по паспорту; К-8: М7, М14; М8 — Ряд М6…М8 стена-в-стену: было 600+800+600+1800 = 3800 от x 9730 до черновой грани стены Б (13530); чистовая длина стены по развёртке 3770</text><text x="45.5" y="182.4" font-size="2.5" fill="#000">(отделка 15/15) — гарнитур длиннее стены на 30 мм, зазора под компенсатор нет; П11 — Размер мойки — один источник: вырез в столешнице М7 на плане столешницы и в ведомости техники</text><text x="45.5" y="185.8" font-size="2.5" fill="#000">700×480, в данных прибора было 500×450; К-17: Ст В1-1, Ст В1-2, Ст К1-1, Ст К1-2.</text><text x="45.5" y="189.2" font-size="2.5" fill="#000">Знак «**» — предложение проектировщика, заказчиком не утверждено (согласовать с заказчиком): ИЗ-5, К-8: М6, М15.</text><text x="45.5" y="192.6" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, запись К-8; лист 7, записи К-11–К-14, К-17–К-20; лист 8, записи К-27, К-29; лист 9, запись ИЗ-5; лист 10, запись ИЗ-11).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Ведомость демонтажа и монтажа перегородок</text><text x="25" y="17.8" font-size="2.5" fill="#333">Демонтаж — красным, монтаж — синим (на плане) · размеры в мм</text><g data-el="schedule"><text x="25" y="28" font-size="3.5" font-weight="700" fill="#000">Ведомость демонтажа и монтажа</text><rect x="25" y="30" width="152" height="43.8" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="38" x2="177" y2="38" stroke="#000" stroke-width="0.5"/><text x="32" y="35.3" font-size="2.5" text-anchor="middle" fill="#000">Марка</text><line x1="39" y1="30" x2="39" y2="73.8" stroke="#000" stroke-width="0.25"/><text x="62" y="35.3" font-size="2.5" text-anchor="middle" fill="#000">Конструкция</text><line x1="85" y1="30" x2="85" y2="73.8" stroke="#000" stroke-width="0.25"/><text x="94" y="35.3" font-size="2.5" text-anchor="middle" fill="#000">Длина, мм</text><line x1="103" y1="30" x2="103" y2="73.8" stroke="#000" stroke-width="0.25"/><text x="111" y="35.3" font-size="2.5" text-anchor="middle" fill="#000">Толщ., мм</text><line x1="119" y1="30" x2="119" y2="73.8" stroke="#000" stroke-width="0.25"/><text x="129" y="35.3" font-size="2.5" text-anchor="middle" fill="#000">Высота</text><line x1="139" y1="30" x2="139" y2="73.8" stroke="#000" stroke-width="0.25"/><text x="158" y="35.3" font-size="2.5" text-anchor="middle" fill="#000">Примечание</text><line x1="25" y1="54.2" x2="177" y2="54.2" stroke="#000" stroke-width="0.18"/><text x="26.5" y="42.3" font-size="2.5" text-anchor="start" fill="#000" textLength="3.3" lengthAdjust="spacingAndGlyphs">П-1**</text><text x="40.5" y="42.3" font-size="2.5" text-anchor="start" fill="#000">монтаж: ГКЛВ 2 слоя с каждой</text><text x="40.5" y="45.7" font-size="2.5" text-anchor="start" fill="#000">стороны по металлическому</text><text x="40.5" y="49.1" font-size="2.5" text-anchor="start" fill="#000">каркасу ПС 100, С112</text><text x="86.5" y="42.3" font-size="2.5" text-anchor="start" fill="#000">1600</text><text x="104.5" y="42.3" font-size="2.5" text-anchor="start" fill="#000">150</text><text x="120.5" y="42.3" font-size="2.5" text-anchor="start" textLength="14.65" lengthAdjust="spacingAndGlyphs" fill="#000">до плиты, 2700</text><text x="140.5" y="42.3" font-size="2.5" text-anchor="start" fill="#000">закрывает нишу 1600×1840;</text><text x="140.5" y="45.7" font-size="2.5" text-anchor="start" fill="#000">проём Д-5 700, обрамление</text><text x="140.5" y="49.1" font-size="2.5" text-anchor="start" fill="#000">УА; упор — наружная стена</text><text x="140.5" y="52.5" font-size="2.5" text-anchor="start" fill="#000">и пилон Ш2</text><text x="26.5" y="58.5" font-size="2.5" text-anchor="start" fill="#000" textLength="3.3" lengthAdjust="spacingAndGlyphs">П-2**</text><text x="40.5" y="58.5" font-size="2.5" text-anchor="start" fill="#000">монтаж: фальш-стена</text><text x="40.5" y="61.9" font-size="2.5" text-anchor="start" fill="#000">(облицовка), ГКЛВ 2 слоя по</text><text x="40.5" y="65.3" font-size="2.5" text-anchor="start" fill="#000">раме инсталляции унитаза;</text><text x="40.5" y="68.7" font-size="2.5" text-anchor="start" fill="#000">лицевая плоскость по линии</text><text x="40.5" y="72.1" font-size="2.5" text-anchor="start" fill="#000">уступа стены, без системы Knauf</text><text x="86.5" y="58.5" font-size="2.5" text-anchor="start" fill="#000">660</text><text x="104.5" y="58.5" font-size="2.5" text-anchor="start" fill="#000">25</text><text x="120.5" y="58.5" font-size="2.5" text-anchor="start" fill="#000">до потолка,</text><text x="120.5" y="61.9" font-size="2.5" text-anchor="start" fill="#000">2389</text><text x="140.5" y="58.5" font-size="2.5" text-anchor="start" fill="#000">закрывает нишу 660×260 у</text><text x="140.5" y="61.9" font-size="2.5" text-anchor="start" fill="#000">наружной стены; за ней</text><text x="140.5" y="65.3" font-size="2.5" text-anchor="start" fill="#000">рама инсталляции</text></g><g data-el="notes"><text x="25" y="87.8" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="92.8" font-size="2.5" fill="#000">1. План демонтажа и монтажа в масштабе 1:50 — лист 22; марки в ведомости — те же, что на плане.</text><text x="25" y="96.4" font-size="2.5" fill="#000">2. Демонтаж несущих стен и плит перекрытия не производится.</text><text x="25" y="100" font-size="2.5" fill="#000">3. Новые перегородки и фальш-стены (синим) привязаны от капитальных стен и наружного контура; высота — по ведомости («до плиты» — до низа плиты</text><text x="25" y="103.6" font-size="2.5" fill="#000">перекрытия); проёмы в них усилить стойками каркаса.</text><text x="25" y="107.2" font-size="2.5" fill="#000">4. Знак «**» — предложение проектировщика, заказчиком не утверждено (согласовать с заказчиком) у конструкций (вопросы К-18, К-4): до решения не</text><text x="25" y="110.8" font-size="2.5" fill="#000">возводить. На обмере они показаны контуром — на объекте их нет.</text><text x="25" y="114.4" font-size="2.5" fill="#000">5. Перепланировку согласовать до начала работ (ЖК РФ, ст. 26); план не передавать в работу до допуска главного инженера проекта.</text><text x="25" y="118" font-size="2.5" fill="#000">6. Дверные блоки — по плану дверей (лист 24); существующие проёмы не расширяются.</text><text x="25" y="121.6" font-size="2.5" fill="#000">7. Знак «*» — положение проёма не замерено: двери пом. 5, 8, 8. Реестр: листы 6–11, вопросы К-26, К-25.</text><text x="25" y="125.2" font-size="2.5" fill="#000">8. Демонтаж существующих покрытий пола, стен и потолка, дверных блоков и сантехприборов (если есть) — до основания; объёмы демонтажа — для справки, по</text><text x="25" y="128.8" font-size="2.5" fill="#000">факту на объекте.</text><text x="25" y="132.4" font-size="2.5" fill="#000">9. За отметку ±0,000 принят чистый пол, не существующий (блок отметок). Размеры — в мм по чистовой поверхности стен до отделки.</text><text x="25" y="136" font-size="2.5" fill="#000">10. Размеры проверить на месте до начала работ: расхождение с обмером — не более 2 % (иначе — к архитектору).</text><text x="25" y="139.6" font-size="2.5" fill="#000">11. Несущие стены не определены: до технического заключения все стены считать несущими — проёмы, ниши и штробы в них не выполнять.</text></g><g data-el="assumed-notes" data-flags="partition:П-1|partition:П-2" data-ids="К-4 К-11 К-12 К-13 К-14 К-18 К-20 К-27" data-level="0"><text x="25.5" y="258.5" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="261.9" font-size="2.5" fill="#000">Основа листа: размеры сняты со скана плана заказчика по размерным цепочкам, контрольный обмер на объекте не выполнялся (К-13); высота потолка 2700 мм принята: на плане</text><text x="25.5" y="265.3" font-size="2.5" fill="#000">заказчика не указана (К-11); толщины стен приняты: наружные 250 мм, перегородки 150 мм (на плане 85–190 мм) (К-13); разрешённая мощность 15 кВт принята по типовой квартире,</text><text x="25.5" y="268.7" font-size="2.5" fill="#000">технических условий нет (К-14); утолщение стены 190 × 1360 мм и элемент 1470 × 160 мм плана заказчика не определены (К-12); ниши санузла 2 закрыты перегородкой и</text><text x="25.5" y="272.1" font-size="2.5" fill="#000">фальш-стеной: проектное решение, на плане заказчика ниша у входа открыта (К-18); несущие стены не определены: до технического заключения все существующие стены считаются</text><text x="25.5" y="275.5" font-size="2.5" fill="#000">несущими (К-20); окна существующие и сохраняются; подоконная доска и глубина откосов не заданы — приняты, не замерены (К-27).</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">Знак «**» — предложение проектировщика, заказчиком не утверждено (согласовать с заказчиком): К-4, К-18: П-1 — проектное решение исполнителя: на плане заказчика ниша у входа</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">открыта в кухню-гостиную; конструкция не утверждена автором (вопрос К-18), положение и размеры сняты со скана (К-13); К-18: П-2 — проектное решение исполнителя: на плане</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">заказчика у наружной стены уступ 660 × 260 мм; конструкция не утверждена автором (вопрос К-18).</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-4, К-11; лист 7, записи К-12–К-14, К-18, К-20; лист 8, запись К-27).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" fill="#000">05.10.26</text><text x="231" y="270.8" font-size="2.5" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" fill="#000">ГД-2026-003-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" fill="#000">Трёхкомнатная квартира</text><text x="297" y="259.2" font-size="2.5" fill="#000">Общая площадь 78,95* м² · * размеры со скана, не замерены (реестр — л. 6–11, К-13)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" fill="#000">Дизайн-проект интерьера трёхкомнатной квартиры</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">23</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">94</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="285" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">Ведомость демонтажа и монтажа перегородок</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="31" data-positions="62" data-basis="8"><rect x="313.01" y="6.2" width="100.49" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="315.01" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 31 (реестр — л. 6–11)</text></g></svg>
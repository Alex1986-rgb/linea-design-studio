<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-sheet="general" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Общие данные</text><text x="25" y="17.8" font-size="2.5" fill="#333">Комплект ГД-2026-003-АИ · лист 3 общих данных (продолжение)</text><g data-el="project-composition"><text x="25" y="29.5" font-size="3.5" font-weight="700" fill="#000">Состав дизайн-проекта</text><rect x="25" y="32" width="185" height="72.4" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="47" x2="210" y2="47" stroke="#000" stroke-width="0.5"/><text x="44" y="40.4" font-size="2.5" text-anchor="middle" fill="#000">Раздел</text><line x1="63" y1="32" x2="63" y2="104.4" stroke="#000" stroke-width="0.25"/><text x="121.5" y="40.4" font-size="2.5" text-anchor="middle" fill="#000">Состав</text><line x1="180" y1="32" x2="180" y2="104.4" stroke="#000" stroke-width="0.25"/><text x="195" y="40.4" font-size="2.5" text-anchor="middle" fill="#000">Листы</text><g><text x="26.5" y="52.85" font-size="2.5" fill="#000">Обложка</text><text x="64.5" y="51.15" font-size="2.5" fill="#000">Дизайн-проект интерьера трёхкомнатной квартиры; Трёхкомнатная квартира; автор</text><text x="64.5" y="54.55" font-size="2.5" fill="#000">проекта — Кырлан Александр Сергеевич</text><text x="195" y="52.85" font-size="2.5" text-anchor="middle" fill="#000">1 с.</text></g><line x1="25" y1="56.8" x2="210" y2="56.8" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="62.65" font-size="2.5" fill="#000">Концепция</text><text x="64.5" y="60.95" font-size="2.5" fill="#000">Стиль Современный (контемпорари): концепция интерьера, палитра и материалы</text><text x="64.5" y="64.35" font-size="2.5" fill="#000">(колерная карта — лист 32)</text><text x="195" y="62.65" font-size="2.5" text-anchor="middle" fill="#000">л. 8</text></g><line x1="25" y1="66.6" x2="210" y2="66.6" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="75.85" font-size="2.5" fill="#000">Визуализации</text><text x="64.5" y="70.75" font-size="2.5" fill="#000">15 изобр.: Вид сверху (3D): планировка с мебелью, текстилем и декором; Потолок:</text><text x="64.5" y="74.15" font-size="2.5" fill="#000">Ванная; Потолок: Спальня 1; Потолок: Спальня 2; Потолок: Прихожая; Потолок:</text><text x="64.5" y="77.55" font-size="2.5" fill="#000">Кухня-гостиная; Потолок; Ванная; Спальня 1; Спальня 2; Прихожая; Кухня-гостиная;</text><text x="64.5" y="80.95" font-size="2.5" fill="#000">Кухня-гостиная; Визуализация «room-living-tv»; Визуализация «room-wc2»</text><text x="195" y="75.85" font-size="2.5" text-anchor="middle" fill="#000">В1–В15</text></g><line x1="25" y1="83.2" x2="210" y2="83.2" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="88.15" font-size="2.5" fill="#000">Рабочие чертежи</text><text x="64.5" y="88.15" font-size="2.5" fill="#000">планы, развёртки, узлы (развёртки и узлы — листы 48–56, 60–64, 66)</text><text x="195" y="88.15" font-size="2.5" text-anchor="middle" fill="#000">л. 1–70</text></g><line x1="25" y1="91.2" x2="210" y2="91.2" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="98.75" font-size="2.5" fill="#000">Спецификации и ведомости</text><text x="64.5" y="98.75" font-size="2.5" fill="#000">оборудование, изделия, отделка, электроточки</text><text x="195" y="95.35" font-size="2.5" text-anchor="middle" fill="#000">л. 7, 10, 11, 15,</text><text x="195" y="98.75" font-size="2.5" text-anchor="middle" fill="#000">22, 23, 31–33, 37,</text><text x="195" y="102.15" font-size="2.5" text-anchor="middle" fill="#000">38, 67–69</text></g></g><g data-el="legend"><text x="25" y="117.4" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><g><line x1="27" y1="124" x2="27" y2="127" stroke="#000" stroke-width="0.25"/><line x1="35" y1="124" x2="35" y2="127" stroke="#000" stroke-width="0.25"/><rect x="27" y="125.25" width="8" height="0.5" fill="#000"/></g><text x="39" y="126.4" font-size="2.5" fill="#000">контрольный отрезок 1000 мм натуры: по нему проверяют печать 1:1</text><g><line x1="32" y1="131.5" x2="26" y2="131.5" stroke="#000" stroke-width="0.25"/><polygon points="30,131.5 31,132.5 32,131.5" fill="#fff" stroke="#000" stroke-width="0.25"/></g><text x="39" y="133.4" font-size="2.5" fill="#000">отметка уровня, м: ±0,000 — чистый пол жилых помещений</text><g><g data-wall="C"><text x="31" y="139.6" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">А</text><path d="M 31 143.6 L 29.5 141.45 L 32.5 141.45 Z" fill="#000"/><circle cx="31" cy="138.7" r="2.5" fill="none" stroke="#000" stroke-width="0.35"/></g></g><text x="39" y="140.4" font-size="2.5" fill="#000">марка развёртки: буква стены, стрелка — взгляд</text><g><text x="31" y="150.4" font-size="2.5" text-anchor="middle" fill="#000">О1</text><circle cx="31" cy="149.5" r="3.5" fill="none" stroke="#000" stroke-width="0.25"/></g><text x="39" y="150.4" font-size="2.5" fill="#000">марка отделки по реестру отделки альбома</text><g><line x1="30.4" y1="157.1" x2="32.5" y2="155.5" stroke="#000" stroke-width="0.25"/><line x1="32.5" y1="155.5" x2="37" y2="155.5" stroke="#000" stroke-width="0.25"/><circle cx="29" cy="158.5" r="2.2" fill="none" stroke="#000" stroke-width="0.25"/></g><text x="39" y="159.4" font-size="2.5" fill="#000">выноска узла: над полкой — узел, под полкой — лист</text></g><g data-el="general-notes"><text x="25" y="174.4" font-size="3.5" font-weight="700" fill="#000">Общие указания</text><text x="25" y="180.4" font-size="2.5" fill="#000">1. Рабочие чертежи интерьера разработаны на основании задания на проектирование и обмерного плана (лист 5). Объект: Трёхкомнатная</text><text x="28" y="183.9" font-size="2.5" fill="#000">квартира; автор проекта — Кырлан Александр Сергеевич; общая площадь 78,95 м², жилая 59,75 м², помещений 8.</text><text x="25" y="187.4" font-size="2.5" fill="#000">2. Рабочие чертежи выполнены в соответствии с заданием на проектирование и нормативными документами, перечисленными в п. 3.</text><text x="25" y="190.9" font-size="2.5" fill="#000">3. Нормативные документы, на которые есть ссылки в листах комплекта: ГОСТ Р 21.101-2026; ГОСТ 21.501-2018; ГОСТ 2.302-68; ГОСТ</text><text x="28" y="194.4" font-size="2.5" fill="#000">2.303-68; ГОСТ 2.304-81; ГОСТ 2.307-2011; СП 54.13330.2022; СП 71.13330.2017; СП 73.13330.2016; ПУЭ (7-е изд.), гл. 1.8, 7.1;</text><text x="28" y="197.9" font-size="2.5" fill="#000">ГОСТ Р 50571.7.701-2024; СанПиН 1.2.3685-21; ГОСТ 2.702; ГОСТ 2.755; ГОСТ 21.110-2013; ГОСТ 21.601; ГОСТ 13996-2019; ГОСТ</text><text x="28" y="201.4" font-size="2.5" fill="#000">23166-2021; ГОСТ 31565-2012; ГОСТ 31975; ГОСТ 32414-2013; ГОСТ 32415-2013; ГОСТ Р 56387-2018; СП 29.13330.2011; СП 30.13330.2020;</text><text x="28" y="204.9" font-size="2.5" fill="#000">СП 51.13330.2011; СП 52.13330.2016. Документы из ведомости ссылочных документов здесь не повторяются.</text><text x="25" y="208.4" font-size="2.5" fill="#000">4. За отметку ±0,000 принят уровень чистого пола жилых помещений квартиры (относительная отметка; абсолютная — по проекту дома).</text><text x="28" y="211.9" font-size="2.5" fill="#000">Отметка чистого пола мокрых помещений — −0,015. Размеры — в миллиметрах, отметки — в метрах, площади — в м²; высоты установки Н</text><text x="28" y="215.4" font-size="2.5" fill="#000">от чистого пола своего помещения до оси изделия.</text><text x="25" y="218.9" font-size="2.5" fill="#000">5. Несущие конструкции, общедомовые стояки, вентиляционные каналы и сети не изменять; работы, затрагивающие их, — только по</text><text x="28" y="222.4" font-size="2.5" fill="#000">отдельному проекту, согласованному в установленном порядке.</text><text x="25" y="225.9" font-size="2.5" fill="#000">6. Трассы инженерных сетей на листах — принципиальные. Расчёты электрических нагрузок и токов КЗ, гидравлики, воздухообмена,</text><text x="28" y="229.4" font-size="2.5" fill="#000">освещённости и нагрузок на перекрытие выполняются в проектах ЭОМ, ВК, ОВ и КР организацией с допуском СРО; фактические трассы до</text><text x="28" y="232.9" font-size="2.5" fill="#000">закрытия отделкой фиксируются исполнительными схемами.</text><text x="25" y="236.4" font-size="2.5" fill="#000">7. Стиль интерьера — Современный (контемпорари). Палитра проекта: основной 60 % — Tikkurila V503 «Winter», Farrow &amp; Ball No. 241</text><text x="28" y="239.9" font-size="2.5" fill="#000">«Skimming Stone»; дополнительный 30 % — Tikkurila H487 «Pumice»; акцент 10 % — Farrow &amp; Ball No. 30 «Hague Blue». Коды цвета — по</text><text x="28" y="243.4" font-size="2.5" fill="#000">веерам производителей; цвет утверждается по выкрасу на объекте при освещении проекта.</text><text x="25" y="246.9" font-size="2.5" fill="#000">8. Площади поверхностей — по чистым граням стен до отделки: стены = периметр × высоту от чистого пола помещения до низа потолка</text><text x="28" y="250.4" font-size="2.5" fill="#000">минус проёмы (облицовка плиткой — до верха облицовки); плинтус = периметр минус дверные проёмы; пол и потолок — по площади</text><text x="28" y="253.9" font-size="2.5" fill="#000">помещения. Количество плиток — по раскладке. Способ один для всех листов комплекта (ведомость отделки, колерная карта, раскладка</text><text x="28" y="257.4" font-size="2.5" fill="#000">плитки, развёртки).</text><text x="25" y="260.9" font-size="2.5" fill="#000">9. Марки: стены помещения на всех листах — А (верхняя по плану), Б (правая), В (нижняя), Г (левая); марка отделки О — одна на</text><text x="28" y="264.4" font-size="2.5" fill="#000">весь альбом; реестр марок отделки (с позициями колерной карты К/М той же отделки) и марки позиций по видам — на листе 47.</text><text x="25" y="267.9" font-size="2.5" fill="#000">10. Развёртки стен выполнены по всем помещениям для стен с электроточками, мебелью, декором и отделкой: санузлы и кухонный фронт</text><text x="28" y="271.4" font-size="2.5" fill="#000">— в М 1:25, остальные стены — в М 1:40; расположение развёрток и узлов — на листе 48, узлы — на листе 66.</text><text x="25" y="274.9" font-size="2.5" fill="#000">11. Перечень скрытых работ, на которые составляются акты освидетельствования (форма по приказу Минстроя России № 344/пр):</text><text x="28" y="278.4" font-size="2.5" fill="#000">гидроизоляция пола и стен мокрых помещений (с тестом проливом); стяжка пола (толщина, прочность, влажность основания); скрытая</text><text x="28" y="281.9" font-size="2.5" fill="#000">электропроводка в штробах и за облицовкой (исполнительная схема трасс); трубопроводы водоснабжения и канализации до закрытия</text><text x="28" y="285.4" font-size="2.5" fill="#000">(опрессовка, уклоны); закладные и усиления под подвесные приборы, мебель и тяжёлый декор, рамы инсталляций; короба дверей</text></g><g data-el="general-notes"><text x="223" y="30" font-size="2.5" fill="#000">скрытого монтажа до штукатурки; каркасы ГКЛ потолков, коробов и перегородок до обшивки.</text><text x="220" y="33.5" font-size="2.5" fill="#000">12. Критерии приёмки: допуски отделочных покрытий — по СП 71.13330.2017; испытания систем водоснабжения и канализации — по СП</text><text x="223" y="37" font-size="2.5" fill="#000">73.13330.2016 до закрытия трасс; приёмо-сдаточные испытания электроустановки — по ПУЭ, гл. 1.8, с протоколом электролаборатории.</text><text x="220" y="40.5" font-size="2.5" fill="#000">13. Осознанные отступления от ГОСТ Р 21.101-2026, принятые в комплекте: номер листа и число листов («Листов») указаны на каждом</text><g data-deviation="sheets-count-every-sheet"/><g data-deviation="scale-in-stamp"/><g data-deviation="elevation-1:40"/><g data-deviation="dim-font-2.5"/><g data-deviation="room-circle-8"/><text x="223" y="44" font-size="2.5" fill="#000">листе; на масштабных листах в основной надписи указан фактический масштаб и дан контрольный отрезок 1000 мм; развёртки стен</text><text x="223" y="47.5" font-size="2.5" fill="#000">выполнены в М 1:25 и 1:40 (ГОСТ 21.507-81 — 1:50…1:500) ради читаемости привязок; размерные числа и марки элементов (Д-1, ОК-1,</text><text x="223" y="51" font-size="2.5" fill="#000">О6) — кеглем 2,5 мм, номера помещений — в кружке Ø 8 мм (канон — 3,5 мм и Ø 12 мм): так насыщенные листы А3 читаются без</text><text x="223" y="54.5" font-size="2.5" fill="#000">наложений надписей.</text><text x="220" y="58" font-size="2.5" fill="#000">14. Графы «Пров.», «Н. контр.», «Утв.» основной надписи заполняются при согласовании комплекта с заказчиком; до согласования</text><text x="223" y="61.5" font-size="2.5" fill="#000">комплект подписывает автор проекта (графа «Разраб.»).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="8.6" lengthAdjust="spacingAndGlyphs" fill="#000">21.09.26</text><text x="231" y="270.8" font-size="2.5" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" fill="#000">ГД-2026-003-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" fill="#000">Трёхкомнатная квартира</text><text x="297" y="259.2" font-size="2.5" fill="#000">Общая площадь 78,95 м²</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" fill="#000">Дизайн-проект интерьера трёхкомнатной квартиры</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">4</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">70</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="285" font-size="3.5" text-anchor="middle" font-weight="700" fill="#000">Общие данные</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">Кырлан Александр Сергеевич</text></g></svg>
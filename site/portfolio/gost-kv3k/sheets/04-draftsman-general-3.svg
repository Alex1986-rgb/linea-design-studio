<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-sheet="general" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Общие данные</text><text x="25" y="17.8" font-size="2.5" fill="#333">Комплект ГД-2026-003-АИ · лист 3 общих данных (продолжение)</text><g data-el="ref-docs"><text x="25" y="29.5" font-size="3.5" font-weight="700" fill="#000">Ведомость ссылочных и прилагаемых документов</text><rect x="25" y="32" width="185" height="190.2" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="47" x2="210" y2="47" stroke="#000" stroke-width="0.5"/><text x="55" y="40.4" font-size="2.5" text-anchor="middle" fill="#000">Обозначение</text><line x1="85" y1="32" x2="85" y2="222.2" stroke="#000" stroke-width="0.25"/><text x="132.5" y="40.4" font-size="2.5" text-anchor="middle" fill="#000">Наименование</text><line x1="180" y1="32" x2="180" y2="222.2" stroke="#000" stroke-width="0.25"/><text x="195" y="40.4" font-size="2.5" text-anchor="middle" fill="#000">Примечание</text><g><text x="86.5" y="51.95" font-size="2.5" text-decoration="underline" fill="#000">Ссылочные документы</text></g><line x1="25" y1="55" x2="210" y2="55" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="60.85" font-size="2.5" fill="#000">ГОСТ 21.201-2011</text><text x="86.5" y="59.15" font-size="2.5" fill="#000">СПДС. Условные графические изображения элементов зданий,</text><text x="86.5" y="62.55" font-size="2.5" fill="#000">сооружений и конструкций</text></g><line x1="25" y1="64.8" x2="210" y2="64.8" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="69.75" font-size="2.5" fill="#000">ГОСТ 21.205-2016</text><text x="86.5" y="69.75" font-size="2.5" fill="#000">СПДС. Условные обозначения элементов санитарно-техни
я (пом. 5)</text></g><line x1="25" y1="190.2" x2="210" y2="190.2" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="195.15" font-size="2.5" fill="#000">ГД-2026-003-АИ.В12</text><text x="86.5" y="195.15" font-size="2.5" fill="#000">Визуализация. Интерьер: Кухня-гостиная (пом. 6)</text></g><line x1="25" y1="198.2" x2="210" y2="198.2" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="203.15" font-size="2.5" fill="#000">ГД-2026-003-АИ.В13</text><text x="86.5" y="203.15" font-size="2.5" fill="#000">Визуализация. Интерьер: Кухня-гостиная (пом. 6)</text></g><line x1="25" y1="206.2" x2="210" y2="206.2" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="211.15" font-size="2.5" fill="#000">ГД-2026-003-АИ.В14</text><text x="86.5" y="211.15" font-size="2.5" fill="#000">Визуализация. Визуализация «room-living-tv»</text></g><line x1="25" y1="214.2" x2="210" y2="214.2" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="219.15" font-size="2.5" fill="#000">ГД-2026-003-АИ.В15</text><text x="86.5" y="219.15" font-size="2.5" fill="#000">Визуализация. Визуализация «room-wc2»</text></g></g><g data-el="project-composition"><text x="220" y="29.5" font-size="3.5" font-weight="700" fill="#000">Состав дизайн-проекта</text><rect x="220" y="32" width="185" height="75.8" fill="none" stroke="#000" stroke-width="0.5"/><line x1="220" y1="47" x2="405" y2="47" stroke="#000" stroke-width="0.5"/><text x="239" y="40.4" font-size="2.5" text-anchor="middle" fill="#000">Раздел</text><line x1="258" y1="32" x2="258" y2="107.8" stroke="#000" stroke-width="0.25"/><text x="316.5" y="40.4" font-size="2.5" text-anchor="middle" fill="#000">Состав</text><line x1="375" y1="32" x2="375" y2="107.8" stroke="#000" stroke-width="0.25"/><text x="390" y="40.4" font-size="2.5" text-anchor="middle" fill="#000">Листы</text><g><text x="221.5" y="52.85" font-size="2.5" fill="#000">Обложка</text><text x="259.5" y="51.15" font-size="2.5" fill="#000">Дизайн-проект интерьера трёхкомнатной квартиры; Трёхкомнатная квартира; автор</text><text x="259.5" y="54.55" font-size="2.5" fill="#000">проекта — Кырлан Александр Сергеевич</text><text x="390" y="52.85" font-size="2.5" text-anchor="middle" fill="#000">1 с.</text></g><line x1="220" y1="56.8" x2="405" y2="56.8" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="62.65" font-size="2.5" fill="#000">Концепция</text><text x="259.5" y="60.95" font-size="2.5" fill="#000">Стиль Современный (контемпорари): концепция интерьера, палитра и материалы</text><text x="259.5" y="64.35" font-size="2.5" fill="#000">(колерная карта — лист 52)</text><text x="390" y="62.65" font-size="2.5" text-anchor="middle" fill="#000">л. 25</text></g><line x1="220" y1="66.6" x2="405" y2="66.6" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="75.85" font-size="2.5" fill="#000">Визуализации</text><text x="259.5" y="70.75" font-size="2.5" fill="#000">15 изобр.: Вид сверху (3D): планировка с мебелью, текстилем и декором; Потолок:</text><text x="259.5" y="74.15" font-size="2.5" fill="#000">Ванная; Потолок: Спальня 1; Потолок: Спальня 2; Потолок: Прихожая; Потолок:</text><text x="259.5" y="77.55" font-size="2.5" fill="#000">Кухня-гостиная; Потолок; Ванная; Спальня 1; Спальня 2; Прихожая; Кухня-гостиная;</text><text x="259.5" y="80.95" font-size="2.5" fill="#000">Кухня-гостиная; Визуализация «room-living-tv»; Визуализация «room-wc2»</text><text x="390" y="75.85" font-size="2.5" text-anchor="middle" fill="#000">В1–В15</text></g><line x1="220" y1="83.2" x2="405" y2="83.2" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="88.15" font-size="2.5" fill="#000">Рабочие чертежи</text><text x="259.5" y="88.15" font-size="2.5" fill="#000">планы, развёртки, узлы (развёртки и узлы — листы 68–76, 80–84, 86)</text><text x="390" y="88.15" font-size="2.5" text-anchor="middle" fill="#000">л. 1–94</text></g><line x1="220" y1="91.2" x2="405" y2="91.2" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="100.45" font-size="2.5" fill="#000">Спецификации и ведомости</text><text x="259.5" y="100.45" font-size="2.5" fill="#000">оборудование, изделия, отделка, электроточки</text><text x="390" y="95.35" font-size="2.5" text-anchor="middle" fill="#000">л. 23, 24, 27, 28,</text><text x="390" y="98.75" font-size="2.5" text-anchor="middle" fill="#000">32, 33, 41, 42,</text><text x="390" y="102.15" font-size="2.5" text-anchor="middle" fill="#000">51–53, 57, 58,</text><text x="390" y="105.55" font-size="2.5" text-anchor="middle" fill="#000">87–92</text></g></g><g data-deviation="sheets-count-every-sheet"/><g data-deviation="scale-in-stamp"/><g data-deviation="elevation-1:40"/><g data-deviation="dim-font-2.5"/><g data-deviation="room-circle-8"/><g data-el="general-ref"><text x="25" y="290.2" font-size="2.5" textLength="183.55" lengthAdjust="spacingAndGlyphs" fill="#000">Общие указания — лист 5: ±0,000 — чистый пол; несущие конструкции и сети дома — по отдельному проекту; скрытые работы — по актам. Открытые вопросы и допущения — листы 6–11.</text><g data-el="open-issues-ref" data-target="6"/></g><g data-el="assumed-notes" data-flags="" data-ids="К-11 К-12 К-13 К-14 К-18 К-20 К-27" data-level="0"><text x="25.5" y="264.2" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="267.6" font-size="2.5" fill="#000">Основа листа: размеры сняты со скана плана заказчика по размерным цепочкам, контрольный обмер на объекте не выполнялся (К-13); высота потолка 2700 мм принята: на плане</text><text x="25.5" y="271" font-size="2.5" fill="#000">заказчика не указана (К-11); толщины стен приняты: наружные 250 мм, перегородки 150 мм (на плане 85–190 мм) (К-13); разрешённая мощность 15 кВт принята по типовой квартире,</text><text x="25.5" y="274.4" font-size="2.5" fill="#000">технических условий нет (К-14); утолщение стены 190 × 1360 мм и элемент 1470 × 160 мм плана заказчика не определены (К-12); ниши санузла 2 закрыты перегородкой и</text><text x="25.5" y="277.8" font-size="2.5" fill="#000">фальш-стеной: проектное решение, на плане заказчика ниша у входа открыта (К-18); несущие стены не определены: до технического заключения все существующие стены считаются</text><text x="25.5" y="281.2" font-size="2.5" fill="#000">несущими (К-20); окна существующие и сохраняются; подоконная доска и глубина откосов не заданы — приняты, не замерены (К-27).</text><text x="25.5" y="284.6" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, запись К-11; лист 7, записи К-12–К-14, К-18, К-20; лист 8, запись К-27).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" fill="#000">05.10.26</text><text x="231" y="270.8" font-size="2.5" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" fill="#000">ГД-2026-003-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" fill="#000">Трёхкомнатная квартира</text><text x="297" y="259.2" font-size="2.5" fill="#000">Общая площадь 78,95* м² · * размеры со скана, не замерены (реестр — л. 6–11, К-13)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" fill="#000">Дизайн-проект интерьера трёхкомнатной квартиры</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">4</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">94</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="285" font-size="3.5" text-anchor="middle" font-weight="700" fill="#000">Общие данные</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="31" data-positions="62" data-basis="8"><rect x="313.01" y="6.2" width="100.49" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="315.01" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 31 (реестр — л. 6–11)</text></g></svg>
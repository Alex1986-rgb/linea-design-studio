iddle" fill="#000">Листы</text><g><text x="26.5" y="202.85" font-size="2.5" fill="#000">Обложка</text><text x="64.5" y="201.15" font-size="2.5" fill="#000">Дизайн-проект интерьера трёхкомнатной квартиры; Трёхкомнатная квартира; автор</text><text x="64.5" y="204.55" font-size="2.5" fill="#000">проекта — Кырлан Александр Сергеевич</text><text x="195" y="202.85" font-size="2.5" text-anchor="middle" fill="#000">1 с.</text></g><line x1="25" y1="206.8" x2="210" y2="206.8" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="212.65" font-size="2.5" fill="#000">Концепция</text><text x="64.5" y="210.95" font-size="2.5" fill="#000">Стиль Современный (контемпорари): концепция интерьера, палитра и материалы</text><text x="64.5" y="214.35" font-size="2.5" fill="#000">(колерная карта — лист 69)</text><text x="195" y="212.65" font-size="2.5" text-anchor="middle" fill="#000">л. 32</text></g><line x1="25" y1="216.6" x2="210" y2="216.6" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="232.65" font-size="2.5" fill="#000">Визуализации</text><text x="64.5" y="220.75" font-size="2.5" fill="#000">31 изобр.: Вид сверху (3D): планировка с мебелью, текстилем и декором; Потолок:</text><text x="64.5" y="224.15" font-size="2.5" fill="#000">Ванная; Потолок: Спальня 1; Потолок: Спальня 2; Потолок: Прихожая; Потолок:</text><text x="64.5" y="227.55" font-size="2.5" fill="#000">Кухня-гостиная; Потолок; Ванная; Ванная, стена Б; Ванная, стена В; Ванная, стена</text><text x="64.5" y="230.95" font-size="2.5" fill="#000">Г; Санузел 2, стена Б; Санузел 2, стена В; Спальня 1; Спальня 1, стена А; Спальня</text><text x="64.5" y="234.35" font-size="2.5" fill="#000">1, стена Б; Спальня 2; Спальня 2, стена А; Спальня 2, стена В; Спальня 2, стена</text><text x="64.5" y="237.75" font-size="2.5" fill="#000">Г; Коридор, стена А; Коридор, стена В; Прихожая; Прихожая, стена В;</text><text x="64.5" y="241.15" font-size="2.5" fill="#000">Кухня-гостиная; Кухня-гостиная; Кухня-гостиная; Кухня-гостиная, стена Б;</text><text x="64.5" y="244.55" font-size="2.5" fill="#000">Кухня-гостиная, стена В; Кухня-гостиная, стена Г; Гардеробная, общий вид</text><text x="195" y="232.65" font-size="2.5" text-anchor="middle" fill="#000">В1–В31</text></g><line x1="25" y1="246.8" x2="210" y2="246.8" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="251.75" font-size="2.5" fill="#000">Рабочие чертежи</text><text x="64.5" y="251.75" font-size="2.5" fill="#000">планы, развёртки, узлы (развёртки и узлы — листы 53–55, 88, 93–96, 102, 107–114)</text><text x="195" y="251.75" font-size="2.5" text-anchor="middle" fill="#000">л. 1–131</text></g><line x1="25" y1="254.8" x2="210" y2="254.8" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="262.35" font-size="2.5" fill="#000">Спецификации и ведомости</text><text x="64.5" y="262.35" font-size="2.5" fill="#000">оборудование, изделия, отделка, электроточки</text><text x="195" y="258.95" font-size="2.5" text-anchor="middle" fill="#000">л. 30, 31, 34–36,</text><text x="195" y="262.35" font-size="2.5" text-anchor="middle" fill="#000">40, 41, 56, 67–70,</text><text x="195" y="265.75" font-size="2.5" text-anchor="middle" fill="#000">74, 75, 115–121</text></g></g><g data-deviation="sheets-count-every-sheet"/><g data-deviation="scale-in-stamp"/><g data-deviation="elevation-1:40"/><g data-deviation="dim-font-2.5"/><g data-deviation="room-circle-8"/><g data-el="general-ref"><text x="25" y="290.2" font-size="2.5" textLength="183.55" lengthAdjust="spacingAndGlyphs" data-fit="203" fill="#000">Общие указания — лист 6: ±0,000 — чистый пол; несущие конструкции и сети дома — по отдельному проекту; скрытые работы — по актам. Открытые вопросы и допущения — листы 7–12.</text><g data-el="open-issues-ref" data-target="7"/></g><g data-el="assumed-notes" data-flags="" data-ids="К-11 К-12 К-13 К-14 К-18 К-20 К-27 К-29" data-level="0"><text x="212.5" y="206.9" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="212.5" y="210.3" font-size="2.5" fill="#000">Основа листа: размеры сняты со скана плана заказчика по размерным цепочкам, контрольный обмер на объекте не выполнялся (К-13); высота</text><text x="212.5" y="213.7" font-size="2.5" fill="#000">потолка 2700 мм принята: на плане заказчика не указана (К-11); толщины стен приняты: наружные 250 мм, перегородки 150 мм (на плане 85–190 мм)</text><text x="212.5" y="217.1" font-size="2.5" fill="#000">(К-13); разрешённая мощность 15 кВт принята по типовой квартире, технических условий нет (К-14); утолщение стены 190 × 1360 мм и элемент 1470</text><text x="212.5" y="220.5" font-size="2.5" fill="#000">× 160 мм плана заказчика не определены (К-12); ниши санузла 2 закрыты перегородкой и фальш-стеной: проектное решение, на плане заказчика</text><text x="212.5" y="223.9" font-size="2.5" fill="#000">ниша у входа открыта (К-18); несущие стены не определены: до технического заключения все существующие стены считаются несущими (К-20); окна</text><text x="212.5" y="227.3" font-size="2.5" fill="#000">существующие и сохраняются; подоконная доска и глубина откосов не заданы — приняты, не замерены (К-27); подрайон климата не задан — принят</text><text x="212.5" y="230.7" font-size="2.5" fill="#000">не северный (жилые от 2,5 м) (К-29).</text><text x="212.5" y="234.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 8, записи К-11–К-14, К-18, К-20; лист 9, записи К-27, К-29).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">10.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-003-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Трёхкомнатная квартира</text><text x="297" y="259.2" font-size="2.5" data-fit="116" fill="#000">Общая площадь 78,95* м² · * размеры со скана, не замерены (реестр — л. 7–12, К-13)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" data-fit="66" fill="#000">Дизайн-проект интерьера трёхкомнатной квартиры</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">5</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">131</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="285" font-size="3.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">Общие данные</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="47" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="34" data-positions="88" data-basis="9"><rect x="313.01" y="6.2" width="100.49" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="315.01" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 34 (реестр — л. 7–12)</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Задание на контрольный обмер и обследование. Лист 3 из 3</text><text x="25" y="17.8" font-size="2.5" fill="#333">Что замерить, вскрыть и получить до заказа материалов и изделий</text><g data-el="survey-task"><g data-el="survey-offsite"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Документы и данные закупки (не на объекте) (продолжение)</text><rect x="25" y="33" width="385" height="67.8" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="31" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="37" y1="33" x2="37" y2="100.8" stroke="#000" stroke-width="0.25"/><text x="62" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">У кого, откуда</text><line x1="87" y1="33" x2="87" y2="100.8" stroke="#000" stroke-width="0.25"/><text x="97" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Способ</text><line x1="107" y1="33" x2="107" y2="100.8" stroke="#000" stroke-width="0.25"/><text x="149" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Что получить</text><line x1="191" y1="33" x2="191" y2="100.8" stroke="#000" stroke-width="0.25"/><text x="219" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">К какому сроку</text><line x1="247" y1="33" x2="247" y2="100.8" stroke="#000" stroke-width="0.25"/><text x="285" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Что пересчитается в альбоме</text><line x1="323" y1="33" x2="323" y2="100.8" stroke="#000" stroke-width="0.25"/><text x="344" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Чем подтверждается</text><line x1="365" y1="33" x2="365" y2="100.8" stroke="#000" stroke-width="0.25"/><text x="387.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Закрывает вопросы реестра</text><g data-el="survey-row" data-id="О-10" data-key="tu-moshchnost" data-closes="К-14" data-method="document"><text x="31" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">О-10</text><text x="38.5" y="46.7" font-size="2.5" fill="#000">Заказчик; организация, выдавшая</text><text x="38.5" y="50.1" font-size="2.5" fill="#000">технические условия</text><text x="88.5" y="46.7" font-size="2.5" fill="#000">Документ</text><text x="108.5" y="46.7" font-size="2.5" fill="#000">Технические условия на присоединение: разрешённая мощность</text><text x="108.5" y="50.1" font-size="2.5" fill="#000">(принято 15 кВт по типовой квартире, расчётная 11,8 кВт).</text><text x="192.5" y="46.7" font-size="2.5" fill="#000">До утверждения однолинейной схемы щита</text><text x="248.5" y="46.7" font-size="2.5" fill="#000">Однолинейная схема щита: вводной аппарат и группы;</text><text x="248.5" y="50.1" font-size="2.5" fill="#000">сверка расчётной мощности 11,8 кВт с разрешённой.</text><text x="248.5" y="53.5" font-size="2.5" fill="#000">Листы:</text><text x="248.5" y="56.9" font-size="2.5" fill="#000">л. 24 — Однолинейная схема щита</text><text x="324.5" y="46.7" font-size="2.5" fill="#000">копия документа</text><text x="366.5" y="46.7" font-size="2.5" fill="#000">К-14</text><text x="366.5" y="50.1" font-size="2.5" fill="#000">Результат принимает:</text><text x="366.5" y="53.5" font-size="2.5" fill="#000">Инженер-электрик</text></g><line x1="25" y1="60" x2="410" y2="60" stroke="#000" stroke-width="0.25"/><g data-el="survey-row" data-id="О-11" data-key="stiralka-pasport" data-closes="К-19" data-method="procure"><text x="31" y="63.7" font-size="2.5" text-anchor="middle" fill="#000">О-11</text><text x="38.5" y="63.7" font-size="2.5" fill="#000">Поставщик стиральной машины;</text><text x="38.5" y="67.1" font-size="2.5" fill="#000">модель пока не выбрана</text><text x="88.5" y="63.7" font-size="2.5" fill="#000">Закупка</text><text x="108.5" y="63.7" font-size="2.5" fill="#000" textLength="61.07" lengthAdjust="spacingAndGlyphs">Паспорт выбранной модели стиральной машины П4*: габарит и</text><text x="108.5" y="67.1" font-size="2.5" fill="#000">положение подводки. Сейчас принят условный габарит:</text><text x="108.5" y="70.5" font-size="2.5" fill="#000">фронтальная загрузка 600 × 600 мм.</text><text x="192.5" y="63.7" font-size="2.5" fill="#000">До закрытия люка и разводки</text><text x="248.5" y="63.7" font-size="2.5" fill="#000" textLength="45.08" lengthAdjust="spacingAndGlyphs">Габарит и подводка П4*; зазоры в ванной (К-1).</text><text x="248.5" y="67.1" font-size="2.5" fill="#000">Листы:</text><text x="248.5" y="70.5" font-size="2.5" fill="#000">л. 28 — План выводов сантехники</text><text x="248.5" y="73.9" font-size="2.5" fill="#000">л. 30 — Спецификация сантехнического оборудования</text><text x="324.5" y="63.7" font-size="2.5" fill="#000">паспорт изделия или партии</text><text x="366.5" y="63.7" font-size="2.5" fill="#000">К-19</text><text x="366.5" y="67.1" font-size="2.5" fill="#000">Результат принимает: Инженер</text><text x="366.5" y="70.5" font-size="2.5" fill="#000">ВК (вода, канализация)</text></g><line x1="25" y1="80.4" x2="410" y2="80.4" stroke="#000" stroke-width="0.25"/><g data-el="survey-row" data-id="О-12" data-key="dom-dokumenty" data-closes="К-20" data-method="document"><text x="31" y="84.1" font-size="2.5" text-anchor="middle" fill="#000">О-12</text><text x="38.5" y="84.1" font-size="2.5" fill="#000">Заказчик (документы на квартиру и</text><text x="38.5" y="87.5" font-size="2.5" fill="#000">дом)</text><text x="88.5" y="84.1" font-size="2.5" fill="#000">Документ</text><text x="108.5" y="84.1" font-size="2.5" fill="#000">Проект дома и план БТИ: тип и серия дома, какие стены несущие.</text><text x="192.5" y="84.1" font-size="2.5" fill="#000">До любого демонтажа, проёмов и</text><text x="192.5" y="87.5" font-size="2.5" fill="#000">штробления в стенах</text><text x="248.5" y="84.1" font-size="2.5" fill="#000">Разметка несущих и ненесущих стен на обмерном плане и</text><text x="248.5" y="87.5" font-size="2.5" fill="#000">плане демонтажа; допустимость демонтажа, проёмов и</text><text x="248.5" y="90.9" font-size="2.5" fill="#000">штроб (пока все стены считаются несущими).</text><text x="248.5" y="94.3" font-size="2.5" fill="#000">Листы:</text><text x="248.5" y="97.7" font-size="2.5" fill="#000">л. 13 — План демонтажа и монтажа перегородок</text><text x="324.5" y="84.1" font-size="2.5" fill="#000">копия документа</text><text x="366.5" y="84.1" font-size="2.5" fill="#000">К-20</text><text x="366.5" y="87.5" font-size="2.5" fill="#000">Результат принимает: Архитектор</text></g></g><g data-el="notes"><text x="25" y="113.2" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="118" font-size="2.5" fill="#000">1. Подтверждение: акт контрольного обмера (дата, кто присутствовал, прибор, перечень промеров с результатами, подписи присутствующих); к акту — фото вскрытий и узлов и техническое заключение организации, выполнившей обследование.</text><text x="25" y="121.4" font-size="2.5" fill="#000">2. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text><text x="25" y="124.8" font-size="2.5" fill="#000">3. Пункт исключается из задания при следующем выпуске, когда акт подписан, значение внесено в проект и листы перевыпущены; знак «*» у величины снимается только замером.</text></g></g><g data-el="assumed-notes" data-flags="fixture:П4" data-ids="ИЗ-11 К-11 К-12 К-13 К-14 К-18 К-19 К-20" data-level="0"><text x="25.5" y="265.3" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="268.7" font-size="2.5" fill="#000">Основа листа: размеры сняты со скана плана заказчика по размерным цепочкам, контрольный обмер на объекте не выполнялся (К-13); высота потолка 2700 мм принята: на плане</text><text x="25.5" y="272.1" font-size="2.5" fill="#000">заказчика не указана (К-11); толщины стен приняты: наружные 250 мм, перегородки 150 мм (на плане 85–190 мм) (К-13); разрешённая мощность 15 кВт принята по типовой квартире,</text><text x="25.5" y="275.5" font-size="2.5" fill="#000">технических условий нет (К-14); утолщение стены 190 × 1360 мм и элемент 1470 × 160 мм плана заказчика не определены (К-12); ниши санузла 2 закрыты перегородкой и</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">фальш-стеной: проектное решение, на плане заказчика ниша у входа открыта (К-18); несущие стены не определены: до технического заключения все существующие стены считаются</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">несущими (К-20).</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">Знак «*» — принято, не замерено и не подтверждено: ИЗ-11, К-19: П4.</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-11–К-14, К-18–К-20; лист 8, запись ИЗ-11).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" fill="#000">05.10.26</text><text x="231" y="270.8" font-size="2.5" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" fill="#000">ГД-2026-003-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" fill="#000">Трёхкомнатная квартира</text><text x="297" y="259.2" font-size="2.5" fill="#000">Общая площадь 78,95* м² · * размеры со скана, не замерены (реестр — л. 5–8, К-13)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" fill="#000">Дизайн-проект интерьера трёхкомнатной квартиры</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">11</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">79</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="283.2" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">Задание на контрольный обмер и обследование.</text><text x="330" y="287" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">Лист 3 из 3</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="20" data-positions="37" data-basis="7"><rect x="314.27" y="6.2" width="99.23" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="316.27" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 20 (реестр — л. 5–8)</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Лист → мастер" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Лист → мастер</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Мастер → листы альбома и документы, которые ему нужны</text><g data-el="masters"><g data-el="mas-table"><text x="25" y="35.4" font-size="3.5" font-weight="700" fill="#000">Какому мастеру какие листы (номера — как в штампе)</text><rect x="25" y="38" width="385" height="113.4" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="48" x2="410" y2="48" stroke="#000" stroke-width="0.5"/><text x="60" y="43.9" font-size="2.5" text-anchor="middle" fill="#000">Мастер</text><line x1="95" y1="38" x2="95" y2="151.4" stroke="#000" stroke-width="0.25"/><text x="160" y="43.9" font-size="2.5" text-anchor="middle" fill="#000">Что делает по альбому</text><line x1="225" y1="38" x2="225" y2="151.4" stroke="#000" stroke-width="0.25"/><text x="275" y="43.9" font-size="2.5" text-anchor="middle" fill="#000">Листы</text><line x1="325" y1="38" x2="325" y2="151.4" stroke="#000" stroke-width="0.25"/><text x="357.5" y="43.9" font-size="2.5" text-anchor="middle" fill="#000">Кроме чертежей — документы</text><line x1="390" y1="38" x2="390" y2="151.4" stroke="#000" stroke-width="0.25"/><text x="400" y="43.9" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><g data-el="mas-row" data-master="obmer" data-n="16"><text x="26.5" y="51.7" font-size="2.5" fill="#000">Замерщик и прораб (до начала работ)</text><text x="96.5" y="51.7" font-size="2.5" fill="#000">Контрольный обмер на голых стенах, сверка размеров и диагоналей, ответы на открытые вопросы до</text><text x="96.5" y="55.1" font-size="2.5" fill="#000">заказа</text><text x="226.5" y="51.7" font-size="2.5" fill="#000">2–16, 27</text><text x="326.5" y="51.7" font-size="2.5" fill="#000">Задание на контрольный обмер; лист открытых</text><text x="326.5" y="55.1" font-size="2.5" fill="#000">вопросов</text><text x="400" y="51.7" font-size="2.5" text-anchor="middle" fill="#000">16</text></g><line x1="25" y1="58.2" x2="410" y2="58.2" stroke="#000" stroke-width="0.25"/><g data-el="mas-row" data-master="gkl" data-n="8"><text x="26.5" y="61.9" font-size="2.5" fill="#000">Гипсокартонщик и монтажник перегородок</text><text x="96.5" y="61.9" font-size="2.5" fill="#000">Демонтаж и возведение перегородок, каркас, короба инсталляции, ниши, потолки; закладные под</text><text x="96.5" y="65.3" font-size="2.5" fill="#000">навесное</text><text x="226.5" y="61.9" font-size="2.5" fill="#000">28–29, 58–61, 83, 85</text><text x="326.5" y="61.9" font-size="2.5" fill="#000">Ведомость материалов каркаса; акт скрытых работ</text><text x="326.5" y="65.3" font-size="2.5" fill="#000">на каркас</text><text x="400" y="61.9" font-size="2.5" text-anchor="middle" fill="#000">8</text></g><line x1="25" y1="68.4" x2="410" y2="68.4" stroke="#000" stroke-width="0.25"/><g data-el="mas-row" data-master="el" data-n="35"><text x="26.5" y="72.1" font-size="2.5" fill="#000">Электрик</text><text x="96.5" y="72.1" font-size="2.5" fill="#000">Группы щита, подрозетники и высоты, трассы, свет, управление светом, слаботочка, тёплый пол</text><text x="226.5" y="72.1" font-size="2.5" fill="#000">37–45, 57, 89–113</text><text x="326.5" y="72.1" font-size="2.5" fill="#000">Таблица нагрузок; ведомость изделий; протокол</text><text x="326.5" y="75.5" font-size="2.5" fill="#000">электролаборатории</text><text x="400" y="72.1" font-size="2.5" text-anchor="middle" fill="#000">35</text></g><line x1="25" y1="78.6" x2="410" y2="78.6" stroke="#000" stroke-width="0.25"/><g data-el="mas-row" data-master="vk" data-n="34"><text x="26.5" y="82.3" font-size="2.5" fill="#000">Сантехник</text><text x="96.5" y="82.3" font-size="2.5" fill="#000">Выводы воды и канализации, разводка, аксонометрии, инсталляции, короба стояков</text><text x="226.5" y="82.3" font-size="2.5" fill="#000">48–56, 89–113</text><text x="326.5" y="82.3" font-size="2.5" fill="#000">Спецификация ВК; акт опрессовки; акт пролива</text><text x="400" y="82.3" font-size="2.5" text-anchor="middle" fill="#000">34</text></g><line x1="25" y1="86.6" x2="410" y2="86.6" stroke="#000" stroke-width="0.25"/><g data-el="mas-row" data-master="hvac" data-n="2"><text x="26.5" y="90.3" font-size="2.5" fill="#000">Монтажник вентиляции, отопления и кондиционеров</text><text x="96.5" y="90.3" font-size="2.5" fill="#000">Вентиляция, радиаторы и тёплые полы, кондиционеры: места, размеры, трассы и дренаж</text><text x="226.5" y="90.3" font-size="2.5" fill="#000">46–47</text><text x="326.5" y="90.3" font-size="2.5" fill="#000">Акт опрессовки азотом (кондиционеры); фото</text><text x="326.5" y="93.7" font-size="2.5" fill="#000">воздуховодов до закрытия</text><text x="400" y="90.3" font-size="2.5" text-anchor="middle" fill="#000">2</text></g><line x1="25" y1="96.8" x2="410" y2="96.8" stroke="#000" stroke-width="0.25"/><g data-el="mas-row" data-master="finish" data-n="32"><text x="26.5" y="100.5" font-size="2.5" fill="#000">Штукатур, шпаклёвщик, маляр, паркетчик</text><text x="96.5" y="100.5" font-size="2.5" fill="#000">Основание стен, окраска и обои по колерной карте, полы и пороги, плинтус, узлы стыков</text><text x="226.5" y="100.5" font-size="2.5" fill="#000">66–70, 89–115</text><text x="326.5" y="100.5" font-size="2.5" fill="#000">Колерная карта и выкрасы; спецификация</text><text x="326.5" y="103.9" font-size="2.5" fill="#000">отделочных материалов</text><text x="400" y="100.5" font-size="2.5" text-anchor="middle" fill="#000">32</text></g><line x1="25" y1="107" x2="410" y2="107" stroke="#000" stroke-width="0.25"/><g data-el="mas-row" data-master="tile" data-n="34"><text x="26.5" y="110.7" font-size="2.5" fill="#000">Плиточник</text><text x="96.5" y="110.7" font-size="2.5" fill="#000">Раскладка и подрезка плитки стен, пола и фартука, гидроизоляция, швы, выводы в плитке</text><text x="226.5" y="110.7" font-size="2.5" fill="#000">53–55, 62–65, 89–115</text><text x="326.5" y="110.7" font-size="2.5" fill="#000">Ведомость плитки; акт теста проливом</text><text x="400" y="110.7" font-size="2.5" text-anchor="middle" fill="#000">34</text></g><line x1="25" y1="115" x2="410" y2="115" stroke="#000" stroke-width="0.25"/><g data-el="mas-row" data-master="doors" data-n="1"><text x="26.5" y="118.7" font-size="2.5" fill="#000">Монтажник дверей и окон</text><text x="96.5" y="118.7" font-size="2.5" fill="#000">Заполнение проёмов: размеры коробок, открывание, пороги, скрытые двери</text><text x="226.5" y="118.7" font-size="2.5" fill="#000">30</text><text x="326.5" y="118.7" font-size="2.5" fill="#000">Ведомость проёмов; паспорта на полотна</text><text x="400" y="118.7" font-size="2.5" text-anchor="middle" fill="#000">1</text></g><line x1="25" y1="123" x2="410" y2="123" stroke="#000" stroke-width="0.25"/><g data-el="mas-row" data-master="furn" data-n="16"><text x="26.5" y="126.7" font-size="2.5" fill="#000">Мебельщик, кухонный монтажник</text><text x="96.5" y="126.7" font-size="2.5" fill="#000">Кухня и мебель на заказ: габариты, членение, фурнитура, связка с электрикой и сантехникой</text><text x="226.5" y="126.7" font-size="2.5" fill="#000">32–36, 77–87</text><text x="326.5" y="126.7" font-size="2.5" fill="#000">Ведомость изделий; замер кухни по готовым</text><text x="326.5" y="130.1" font-size="2.5" fill="#000">стенам</text><text x="400" y="126.7" font-size="2.5" text-anchor="middle" fill="#000">16</text></g><line x1="25" y1="133.2" x2="410" y2="133.2" stroke="#000" stroke-width="0.25"/><g data-el="mas-row" data-master="buy" data-n="28"><text x="26.5" y="136.9" font-size="2.5" fill="#000">Заказчик и комплектатор</text><text x="96.5" y="136.9" font-size="2.5" fill="#000">Что и когда покупать, сколько с запасом, во что это обойдётся; свет, декор и текстиль; визуализации</text><text x="96.5" y="140.3" font-size="2.5" fill="#000">как должно получиться</text><text x="226.5" y="136.9" font-size="2.5" fill="#000">1, 17–21, 57, 71–72, 75–76, 116–132</text><text x="326.5" y="136.9" font-size="2.5" fill="#000">Список покупок; смета; календарный график</text><text x="400" y="136.9" font-size="2.5" text-anchor="middle" fill="#000">28</text></g><line x1="25" y1="143.4" x2="410" y2="143.4" stroke="#000" stroke-width="0.25"/><g data-el="mas-row" data-master="accept" data-n="6"><text x="26.5" y="147.1" font-size="2.5" fill="#000">Прораб и технадзор (приёмка)</text><text x="96.5" y="147.1" font-size="2.5" fill="#000">Приёмка этапов, акты скрытых работ, дефектная ведомость</text><text x="226.5" y="147.1" font-size="2.5" fill="#000">21–26</text><text x="326.5" y="147.1" font-size="2.5" fill="#000">Чек-лист приёмки по этапам; календарный график</text><text x="400" y="147.1" font-size="2.5" text-anchor="middle" fill="#000">6</text></g></g><g data-el="notes"><text x="25" y="163.8" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="168.6" font-size="2.5" fill="#000">1. Номера листов — как в основной надписи: основные подряд (1, 2, 3…), «Д» — детализация мебели, «С» — ведомости, спецификации, узлы и сметы, «П» — приложение единого комплекта. «12–18» — все листы с 12 по 18.</text><text x="25" y="172" font-size="2.5" fill="#000">2. Лист может быть у нескольких мастеров: развёртка стены нужна электрику (высоты точек), сантехнику (выводы), отделочнику (материалы) и плиточнику (раскладка). Общие листы (обмер, список листов, перечень вопросов) прораб раздаёт всем.</text><text x="25" y="175.4" font-size="2.5" fill="#000">3. Мастер работает по чертежам и берёт в руки то, что назначено ему здесь; закупки, смету и график ведёт заказчик с прорабом. Лист, которого нет в таблице ни у одного мастера, — вопрос прорабу: чей он.</text></g></g><g data-el="assumed-notes" data-flags="" data-ids="К-11 К-12 К-13 К-14 К-18 К-20 К-27 К-29" data-level="0"><text x="25.5" y="265.3" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="268.7" font-size="2.5" fill="#000">Основа листа: размеры сняты со скана плана заказчика по размерным цепочкам, контрольный обмер на объекте не выполнялся (К-13); высота потолка 2700 мм принята: на плане</text><text x="25.5" y="272.1" font-size="2.5" fill="#000">заказчика не указана (К-11); толщины стен приняты: наружные 250 мм, перегородки 150 мм (на плане 85–190 мм) (К-13); разрешённая мощность 15 кВт принята по типовой квартире,</text><text x="25.5" y="275.5" font-size="2.5" fill="#000">технических условий нет (К-14); утолщение стены 190 × 1360 мм и элемент 1470 × 160 мм плана заказчика не определены (К-12); ниши санузла 2 закрыты перегородкой и</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">фальш-стеной: проектное решение, на плане заказчика ниша у входа открыта (К-18); несущие стены не определены: до технического заключения все существующие стены считаются</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">несущими (К-20); окна существующие и сохраняются; подоконная доска и глубина откосов не заданы — приняты, не замерены (К-27); подрайон климата не задан — принят не</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">северный (жилые от 2,5 м) (К-29).</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 7, записи К-11–К-14, К-18, К-20; лист 8, записи К-27, К-29).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">14.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-003-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Трёхкомнатная квартира</text><text x="297" y="259.2" font-size="2.5" data-fit="116" fill="#000">Общая площадь 78,95* м² · * размеры со скана, не замерены (реестр — л. 6–11, К-13)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" data-fit="66" fill="#000">Дизайн-проект интерьера трёхкомнатной квартиры</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">26</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">132</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="285" font-size="3.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">Лист → мастер</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="47" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="28" data-positions="110" data-basis="9"><rect x="313.01" y="6.2" width="100.49" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="315.01" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 28 (реестр — л. 6–11)</text></g></svg>
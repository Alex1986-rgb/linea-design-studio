stroke="#000" stroke-width="0.25"/><text x="132" y="119.3" font-size="2.5" text-anchor="middle" fill="#000">Высота</text><line x1="142" y1="114" x2="142" y2="131.4" stroke="#000" stroke-width="0.25"/><text x="161" y="119.3" font-size="2.5" text-anchor="middle" fill="#000">Примечание</text><text x="29.5" y="126.3" font-size="2.5" text-anchor="start" fill="#000"></text><text x="43.5" y="126.3" font-size="2.5" text-anchor="start" fill="#000">Демонтаж и возведение стен и</text><text x="43.5" y="129.7" font-size="2.5" text-anchor="start" fill="#000">перегородок не выполняются</text><text x="89.5" y="126.3" font-size="2.5" text-anchor="start" fill="#000"></text><text x="107.5" y="126.3" font-size="2.5" text-anchor="start" fill="#000"></text><text x="123.5" y="126.3" font-size="2.5" text-anchor="start" fill="#000"></text><text x="143.5" y="126.3" font-size="2.5" text-anchor="start" fill="#000">перепланировки нет</text></g><g data-el="legend"><text x="28" y="137" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><rect x="28" y="141" width="8" height="4" fill="#6b6b6b" stroke="#000" stroke-width="0.7"/><text x="39" y="144.3" font-size="2.5" fill="#000">существующие стены — сохраняются;</text><text x="39" y="150.8" font-size="2.5" fill="#000">несущие не определены — считать несущими</text><rect x="28" y="154" width="8" height="4" fill="url(#h-demolish)" stroke="#c00000" stroke-width="0.5" stroke-dasharray="2 1"/><text x="39" y="157.3" font-size="2.5" fill="#000">демонтируемые конструкции — на плане нет</text><rect x="28" y="160.5" width="8" height="4" fill="#c9d8f5" stroke="#1f4fbf" stroke-width="0.5"/><text x="39" y="163.8" font-size="2.5" fill="#000">возводимые перегородки — на плане нет</text><line x1="29" y1="166.5" x2="29" y2="171.5" stroke="#000" stroke-width="0.25"/><line x1="35" y1="166.5" x2="35" y2="171.5" stroke="#000" stroke-width="0.25"/><text x="39" y="170.3" font-size="2.5" fill="#000">проём существующий (откосы)</text><circle cx="32" cy="175.5" r="2.6" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="32" y="176.4" font-size="2.5" text-anchor="middle" fill="#000">1</text><text x="39" y="176.8" font-size="2.5" fill="#000">номер помещения, площадь м²</text></g><g data-el="notes"><text x="28" y="186" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="28" y="191" font-size="2.5" fill="#000">1. Перепланировка не выполняется: несущие и ненесущие стены, перегородки и плиты перекрытия не</text><text x="28" y="194.6" font-size="2.5" fill="#000">демонтируются, новые стены не возводятся; существующие стены и перегородки сохраняются.</text><text x="28" y="198.2" font-size="2.5" fill="#000">2. Дверные блоки — по плану дверей (лист 7); существующие проёмы не расширяются.</text><text x="28" y="201.8" font-size="2.5" fill="#000">3. Демонтаж существующих покрытий пола, стен и потолка, дверных блоков и сантехприборов (если есть)</text><text x="28" y="205.4" font-size="2.5" fill="#000">— до основания; объёмы демонтажа — для справки, по факту на объекте.</text><text x="28" y="209" font-size="2.5" fill="#000">4. За отметку 0.000 принят уровень существующего (чистого) пола; размеры — в мм по чистовой</text><text x="28" y="212.6" font-size="2.5" fill="#000">поверхности стен до отделки.</text><text x="28" y="216.2" font-size="2.5" fill="#000">5. Размеры проверить на месте до начала работ: расхождение с обмером — не более 2 % (иначе — к</text><text x="28" y="219.8" font-size="2.5" fill="#000">архитектору).</text><text x="28" y="223.4" font-size="2.5" fill="#000">6. Несущие стены не определены: до технического заключения все стены считать несущими — проёмы, ниши</text><text x="28" y="227" font-size="2.5" fill="#000">и штробы в них не выполнять.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="45" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="45" y1="285.5" x2="45" y2="288.5" stroke="#000" stroke-width=
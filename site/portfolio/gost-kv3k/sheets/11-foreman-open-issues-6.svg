<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Открытые вопросы, принятые допущения и конфликты. Лист 6 из 6" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты. Лист 6 из 6</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации</text><g data-el="open-issues" data-plan="fixed" data-plan-declared="6"><g data-el="issues-changes"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Изменения проекта после выпуска листов (реестр изменений) (продолжение)</text><rect x="25" y="33" width="385" height="129" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="32" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="33" x2="39" y2="162" stroke="#000" stroke-width="0.25"/><text x="50" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><line x1="61" y1="33" x2="61" y2="162" stroke="#000" stroke-width="0.25"/><text x="91" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><line x1="121" y1="33" x2="121" y2="162" stroke="#000" stroke-width="0.25"/><text x="171" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Было</text><line x1="221" y1="33" x2="221" y2="162" stroke="#000" stroke-width="0.25"/><text x="283.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Стало</text><line x1="346" y1="33" x2="346" y2="162" stroke="#000" stroke-width="0.25"/><text x="378" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Кто решил, подпись</text><g data-el="issue-row" data-kind="change" data-id="ИЗ-15"><text x="32" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-15</text><text x="40.5" y="46.7" font-size="2.5" fill="#000">05.10.2026</text><text x="62.5" y="46.7" font-size="2.5" fill="#000">л. 30 — План розеток и электровыводов</text><text x="62.5" y="50.1" font-size="2.5" fill="#000">л. 33, 34 — Ведомость электроточек и изделий</text><text x="122.5" y="46.7" font-size="2.5" fill="#000">Розетка Р7 (стиральная машина, ванная) на стене Б со смещением 685 мм:</text><text x="122.5" y="50.1" font-size="2.5" fill="#000">348 мм от стояка холодной воды Ст В1-1 при практике приёмки не ближе 500</text><text x="122.5" y="53.5" font-size="2.5" fill="#000">мм.</text><text x="222.5" y="46.7" font-size="2.5" fill="#000">Р7 на стене Б со смещением 985 мм (на 300 мм дальше вдоль стены, по-прежнему у стиральной</text><text x="222.5" y="50.1" font-size="2.5" fill="#000">машины П4; высота 1000 мм прежняя): до стояка Ст В1-1 644 мм. Новое место — на шве плитки.</text><text x="222.5" y="53.5" font-size="2.5" fill="#000">Расстояние Р7 до границы зоны 1 стало 691 мм вместо 650 мм, названных в ИЗ-10; принятая там</text><text x="222.5" y="56.9" font-size="2.5" fill="#000">норма ПУЭ и положение Р8 и Р33 не затронуты. Положение стояков условно (К-17): отступ сделан</text><text x="222.5" y="60.3" font-size="2.5" fill="#000">от принятого положения, не от замера. Решение исполнителя; знак «**» у Р7 остаётся (высота</text><text x="222.5" y="63.7" font-size="2.5" fill="#000">вопрос К-7).</text><text x="347.5" y="46.7" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="50.1" font-size="2.5" fill="#000">исполнителя; на утверждение А. С. Кырлана</text></g><line x1="25" y1="66.8" x2="410" y2="66.8" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-16"><text x="32" y="70.5" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-16</text><text x="40.5" y="70.5" font-size="2.5" fill="#000">06.10.2026</text><text x="62.5" y="70.5" font-size="2.5" fill="#000">л. 40 — План выводов сантехники</text><text x="62.5" y="73.9" font-size="2.5" fill="#000">л. 41 — Схема разводки водопровода и</text><text x="62.5" y="77.3" font-size="2.5" fill="#000">канализации</text><text x="62.5" y="80.7" font-size="2.5" fill="#000">л. 49 — Спецификация сантехнического</text><text x="62.5" y="84.1" font-size="2.5" fill="#000">оборудования</text><text x="62.5" y="87.5" font-size="2.5" fill="#000">л. 112 — Узлы. Лист 1 из 2</text><text x="122.5" y="70.5" font-size="2.5" fill="#000">Короб стояков Ш1 в углу ванной: в данных 180 × 450 мм (x 7890), на листе</text><text x="122.5" y="73.9" font-size="2.5" fill="#000">узлов 248 × 459 мм. Стояк канализации Ø110 с изоляцией 20 мм и просветом</text><text x="122.5" y="77.3" font-size="2.5" fill="#000">40 мм до стенки в 180 мм не помещается: размер не годился ни как</text><text x="122.5" y="80.7" font-size="2.5" fill="#000">внутренний, ни как наружный. Стиральная машина П4 стояла в 50 мм от</text><text x="122.5" y="84.1" font-size="2.5" fill="#000">короба (y 500).</text><text x="222.5" y="70.5" font-size="2.5" fill="#000">Один источник габарита: внутренний 195 × 406 мм (трубы Ст К1-1 Ø110 и Ст В1-1 Ø32, изоляция 20</text><text x="222.5" y="73.9" font-size="2.5" fill="#000">мм, просвет 40 мм, считая от стен угла), обшивка 53 мм (профиль 28 + ГКЛВ 2 × 12,5) на свободных</text><text x="222.5" y="77.3" font-size="2.5" fill="#000">сторонах, наружный габарит каркаса 248 × 459 мм; короб остаётся в углу у стен (x 7822, y 0).</text><text x="222.5" y="80.7" font-size="2.5" fill="#000">Облицовка плиткой — сверх наружного габарита. Стиральная машина П4 сдвинута на 10 мм (y 510)</text><text x="222.5" y="84.1" font-size="2.5" fill="#000">— зазор до короба 51 мм при требовании не менее 50 мм. Положение стояков по-прежнему</text><text x="222.5" y="87.5" font-size="2.5" fill="#000">условно (К-17), размер короба пересчитывается по замеру. Решение исполнителя; знак «*» у</text><text x="222.5" y="90.9" font-size="2.5" fill="#000">стояков Ст К1-1 и Ст В1-1 (от них — положение и размер короба, К-17) и у машины П4 остаётся:</text><text x="222.5" y="94.3" font-size="2.5" fill="#000">автор их поштучно не утверждал.</text><text x="347.5" y="70.5" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="73.9" font-size="2.5" fill="#000">исполнителя; на утверждение А. С. Кырлана</text></g><line x1="25" y1="97.4" x2="410" y2="97.4" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-17"><text x="32" y="101.1" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-17</text><text x="40.5" y="101.1" font-size="2.5" fill="#000">06.10.2026</text><text x="62.5" y="101.1" font-size="2.5" fill="#000">л. 37 — План слаботочных сетей</text><text x="62.5" y="104.5" font-size="2.5" fill="#000">л. 36 — План принципиальных трасс</text><text x="122.5" y="101.1" font-size="2.5" fill="#000">Состав и места слаботочки в данных проекта заданы проектировщиком: щит</text><text x="122.5" y="104.5" font-size="2.5" fill="#000">слаботочный ЩС, точки доступа Wi-Fi AP1 и AP2. План заказчика их не</text><text x="122.5" y="107.9" font-size="2.5" fill="#000">содержит, подтверждения заказчика в данных нет.</text><text x="222.5" y="101.1" font-size="2.5" fill="#000">Слаботочка остаётся предложением проектировщика, заказчиком не утверждена: щит слаботочный</text><text x="222.5" y="104.5" font-size="2.5" fill="#000">ЩС в Прихожей (стена Г, 3350 мм от угла, высота 1700 мм, рядом со щитом ЩК; ввод оптики, ONT,</text><text x="222.5" y="107.9" font-size="2.5" fill="#000">роутер, патч-панель), точка доступа AP1 в Прихожей (потолок, x 6800, y 6300) и точка доступа AP2 в</text><text x="222.5" y="111.3" font-size="2.5" fill="#000">Кухне-гостиной (потолок, x 12000, y 5500), питание PoE, кабель U/UTP кат. 6. Основание: (если</text><text x="222.5" y="114.7" font-size="2.5" fill="#000">заданы слаботочные точки, задан и слаботочный щит, к которому они сходятся); число и места</text><text x="222.5" y="118.1" font-size="2.5" fill="#000">точек доступа — ориентир практики «одна на 40–60 м²». Заказчик состав и места слаботочки не</text><text x="222.5" y="121.5" font-size="2.5" fill="#000">задавал и не подтверждал: решение исполнителя, знак «**» у ЩС, AP1 и AP2 остаётся до</text><text x="222.5" y="124.9" font-size="2.5" fill="#000">утверждения автором; число и места точек доступа проверить по замеру уровня сигнала после</text><text x="222.5" y="128.3" font-size="2.5" fill="#000">монтажа.</text><text x="347.5" y="101.1" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="104.5" font-size="2.5" fill="#000">исполнителя; предложение проектировщика, на</text><text x="347.5" y="107.9" font-size="2.5" fill="#000">утверждение А. С. Кырлана</text></g><line x1="25" y1="131.4" x2="410" y2="131.4" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-18"><text x="32" y="135.1" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-18</text><text x="40.5" y="135.1" font-size="2.5" fill="#000">30.10.2026</text><text x="62.5" y="135.1" font-size="2.5" fill="#000">л. 74 — Кухня (пом. 6). Развёртка гарнитура</text><text x="62.5" y="138.5" font-size="2.5" fill="#000">л. 75 — Кухня (пом. 6). Монтажная схема</text><text x="62.5" y="141.9" font-size="2.5" fill="#000">л. 99 — Развёртка стены В1. Кухня-гостиная</text><text x="62.5" y="145.3" font-size="2.5" fill="#000">(пом. 6), кухонный фронт</text><text x="62.5" y="148.7" font-size="2.5" fill="#000">л. 24 — План дверей и ведомость заполнения</text><text x="62.5" y="152.1" font-size="2.5" fill="#000">проёмов</text><text x="62.5" y="155.5" font-size="2.5" fill="#000">л. 40 — План выводов сантехники</text><text x="62.5" y="158.9" font-size="2.5" fill="#000">л. 26 — План расстановки мебели</text><text x="122.5" y="135.1" font-size="2.5" fill="#000">Кухонный ряд М6…М8 3800 мм посажен от черновой грани стены Б при</text><text x="122.5" y="138.5" font-size="2.5" fill="#000">чистовой длине стены 3770; дверь Д-5 с простенком 50 мм до шахты Ш2; мойка</text><text x="122.5" y="141.9" font-size="2.5" fill="#000">П11 500×450 против выреза 700×480; ТВ в спальне 2 только точками ЭОМ.</text><text x="222.5" y="135.1" font-size="2.5" fill="#000">М8 — 1775 (ряд 3775, зазор 10 мм до чистовой грани под компенсатор); Д-5 — смещение 825</text><text x="222.5" y="138.5" font-size="2.5" fill="#000">(простенок 150); П11 — 700×480 по вырезу М7; в спальне 2 добавлен ТВ С12 на кронштейне над</text><text x="222.5" y="141.9" font-size="2.5" fill="#000">комодом С10. Знак «**» у Д-5 и С12 до подписи автора.</text><text x="347.5" y="135.1" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="138.5" font-size="2.5" fill="#000">исполнителя; предложение проектировщика, на</text><text x="347.5" y="141.9" font-size="2.5" fill="#000">утверждение А. С. Кырлана</text></g></g><g data-el="notes"><text x="25" y="174.4" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="179.2" font-size="2.5" fill="#000">1. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text><text x="25" y="182.6" font-size="2.5" fill="#000">2. Графа «Если решения нет» показывает состояние решения на листах; влияние на сроки и стоимость по пунктам не оценивалось.</text><text x="25" y="186" font-size="2.5" fill="#000">3. Пункт, по которому принято решение, при следующем выпуске комплекта из таблиц исключается.</text></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">04.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-003-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Трёхкомнатная квартира</text><text x="297" y="259.2" font-size="2.5" data-fit="116" fill="#000">Общая площадь 78,95* м² · * размеры со скана, не замерены (реестр — л. 6–11, К-13)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" data-fit="66" fill="#000">Дизайн-проект интерьера трёхкомнатной квартиры</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">11</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">122</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="283.1" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">Открытые вопросы, принятые допущения и</text><text x="330" y="286.9" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">конфликты. Лист 6 из 6</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="47" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="33" data-positions="88" data-basis="9"><rect x="313.01" y="6.2" width="100.49" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="315.01" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 33 (реестр — л. 6–11)</text></g></svg>
M 146.2 89 L 134.2 101 M 146.2 91.2 L 134.2 103.2 M 146.2 93.4 L 134.2 105.4 M 146.2 95.6 L 134.2 107.6 M 146.2 97.8 L 134.2 109.8 M 146.2 100 L 134.2 112 M 146.2 102.2 L 134.2 114.2 M 146.2 104.4 L 135 115.6 M 146.2 106.6 L 137.2 115.6 M 146.2 108.8 L 139.4 115.6 M 146.2 111 L 141.6 115.6 M 146.2 113.2 L 143.8 115.6 M 146.2 115.4 L 146 115.6 " fill="none" stroke="#7F9AA5" stroke-width="0.18"/><path d="M 138.7 99.6 L 141.7 99.6 M 140.2 98.1 L 140.2 101.1" stroke="#000" stroke-width="0.25"/><text x="141.4" y="98.6" font-size="2.5" fill="#000">ц 1100</text></g><g data-el="dims"><line x1="120.2" y1="122.6" x2="120.2" y2="130.6" stroke="#000" stroke-width="0.25"/><line x1="119.14" y1="129.66" x2="121.26" y2="127.54" stroke="#000" stroke-width="0.5"/><line x1="134.2" y1="122.6" x2="134.2" y2="130.6" stroke="#000" stroke-width="0.25"/><line x1="133.14" y1="129.66" x2="135.26" y2="127.54" stroke="#000" stroke-width="0.5"/><line x1="146.2" y1="122.6" x2="146.2" y2="130.6" stroke="#000" stroke-width="0.25"/><line x1="145.14" y1="129.66" x2="147.26" y2="127.54" stroke="#000" stroke-width="0.5"/><line x1="120.2" y1="128.6" x2="146.2" y2="128.6" stroke="#000" stroke-width="0.25"/><text x="127.2" y="127.6" font-size="2.5" text-anchor="middle" fill="#000">700</text><text x="140.2" y="127.6" font-size="2.5" text-anchor="middle" fill="#000">600</text><line x1="161.2" y1="121.6" x2="169.2" y2="121.6" stroke="#000" stroke-width="0.25"/><line x1="161.2" y1="115.6" x2="169.2" y2="115.6" stroke="#000" stroke-width="0.25"/><line x1="167.2" y1="121.6" x2="167.2" y2="115.6" stroke="#000" stroke-width="0.25"/><line x1="166.14" y1="122.66" x2="168.26" y2="120.54" stroke="#000" stroke-width="0.5"/><line x1="166.14" y1="116.66" x2="168.26" y2="114.54" stroke="#000" stroke-width="0.5"/><text x="166.2" y="119.6" font-size="2.5" text-anchor="middle" transform="rotate(-90 166.2 119.6)" fill="#000">300</text><line x1="161.2" y1="115.6" x2="169.2" y2="115.6" stroke="#000" stroke-width="0.25"/><line x1="161.2" y1="83.6" x2="169.2" y2="83.6" stroke="#000" stroke-width="0.25"/><line x1="167.2" y1="115.6" x2="167.2" y2="83.6" stroke="#000" stroke-width="0.25"/><line x1="166.14" y1="116.66" x2="168.26" y2="114.54" stroke="#000" stroke-width="0.5"/><line x1="166.14" y1="84.66" x2="168.26" y2="82.54" stroke="#000" stroke-width="0.5"/><text x="166.2" y="99.6" font-size="2.5" text-anchor="middle" transform="rotate(-90 166.2 99.6)" fill="#000">1600</text></g></g><g data-el="notes"><text x="25" y="262.4" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="267.4" font-size="2.5" fill="#000">1. Высоты — от чистого пола помещения до низа изделия, «ц» — до центра; привязки — от чистовой грани угла стены, мм.</text><text x="25" y="271" font-size="2.5" fill="#000">2. Над мебелью низ изделия — на 150–250 мм выше спинки или изголовья; без мебели центр — на 1450–1600 мм от пола.</text><text x="25" y="274.6" font-size="2.5" fill="#000">3. Изделия до 5 кг — на два подвеса по основанию; тяжелее — на анкеры с нагрузкой не меньше двойной массы; на ГКЛ — только по закладной или анкеру для</text><text x="25" y="278.2" font-size="2.5" fill="#000">пустотелых оснований.</text><text x="25" y="281.8" font-size="2.5" fill="#000">4. Зеркала в рост — с креплением от опрокидывания; в санузлах — влагостойкие, на клей для зеркал и нейтральный силикон.</text><text x="25" y="285.4" font-size="2.5" fill="#000">5. Места изделий — план текстиля и декора (лист 40).</text></g><g data-el="legend"><rect x="298" y="22" width="8" height="4" fill="#E9DDCB" stroke="#5E4630" stroke-width="0.35"/><text x="308" y="24.9" font-size="2.5" fill="#000">картина</text><rect x="332" y="22" width="8" height="4" fill="#D3E1E7" stroke="#4F6D7A" stroke-width="0.35"/><text x="342" y="24.9" font-size="2.5" fill="#000">зеркало</text><rect x="366" y="22" width="8" height="4" fill="#fff" stroke="#6b6b6b" stroke-width="0.25"/><text x="376" y="24.9" font-size="2.5" fill="#000">мебель под изделием</text></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4" data-level="0"><text x="25.5" y="242" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="245.4" font-size="2.5" fill="#000">Основа листа: размеры сняты с растрового плана заказчика без размеров: масштаб восстановлен по площадям помещений (≈ 11,8 мм на пиксель), контрольный обмер не выполнен</text><text x="25.5" y="248.8" font-size="2.5" fill="#000">(К-1); высота потолка 2700 мм принята: на плане заказчика её нет (К-2); толщины стен 300 / 120 мм приняты по плану заказчика, не замерены (К-1); разрешённая мощность 15 кВт</text><text x="25.5" y="252.2" font-size="2.5" fill="#000">принята по типовым ТУ для квартиры, ТУ заказчиком не переданы (К-4).</text><text x="25.5" y="255.6" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 5, записи К-1, К-2, К-4).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0
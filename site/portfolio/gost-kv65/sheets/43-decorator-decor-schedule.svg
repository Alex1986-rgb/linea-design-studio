<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Ведомость декора. Схемы развески</text><text x="25" y="17.8" font-size="2.5" fill="#333">Картины, зеркала, растения, настольный декор · схемы развески (М 1:50) · высоты — мм от чистого пола</text><g data-el="schedule"><g data-el="decor-table"><text x="25" y="25" font-size="3.5" font-weight="700" fill="#000">Декор: картины, зеркала, растения, предметы</text><rect x="25" y="27" width="385" height="23.4" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="35" x2="410" y2="35" stroke="#000" stroke-width="0.5"/><text x="30.5" y="32.3" font-size="2.5" text-anchor="middle" fill="#000">Поз.</text><line x1="36" y1="27" x2="36" y2="50.4" stroke="#000" stroke-width="0.25"/><text x="41" y="32.3" font-size="2.5" text-anchor="middle" fill="#000">Пом.</text><line x1="46" y1="27" x2="46" y2="50.4" stroke="#000" stroke-width="0.25"/><text x="81" y="32.3" font-size="2.5" text-anchor="middle" fill="#000">Предмет</text><line x1="116" y1="27" x2="116" y2="50.4" stroke="#000" stroke-width="0.25"/><text x="131" y="32.3" font-size="2.5" text-anchor="middle" fill="#000">Размер, мм</text><line x1="146" y1="27" x2="146" y2="50.4" stroke="#000" stroke-width="0.25"/><text x="182" y="32.3" font-size="2.5" text-anchor="middle" fill="#000">Место: стена, высота от пола, мм</text><line x1="218" y1="27" x2="218" y2="50.4" stroke="#000" stroke-width="0.25"/><text x="226" y="32.3" font-size="2.5" text-anchor="middle" fill="#000">Масса, кг</text><line x1="234" y1="27" x2="234" y2="50.4" stroke="#000" stroke-width="0.25"/><text x="278" y="32.3" font-size="2.5" text-anchor="middle" fill="#000">Крепёж и основание</text><line x1="322" y1="27" x2="322" y2="50.4" stroke="#000" stroke-width="0.25"/><text x="361" y="32.3" font-size="2.5" text-anchor="middle" fill="#000">Свет места, отделка</text><line x1="400" y1="27" x2="400" y2="50.4" stroke="#000" stroke-width="0.25"/><text x="405" y="32.3" font-size="2.5" text-anchor="middle" fill="#000">Кол.</text><line x1="25" y1="41" x2="410" y2="41" stroke="#000" stroke-width="0.18"/><text x="26.5" y="39.3" font-size="2.5" text-anchor="start" fill="#000">ДК3</text><text x="37.5" y="39.3" font-size="2.5" text-anchor="start" fill="#000">9</text><text x="47.5" y="39.3" font-size="2.5" text-anchor="start" fill="#000">Картина над кроватью</text><text x="117.5" y="39.3" font-size="2.5" text-anchor="start" fill="#000">1000×700</text><text x="147.5" y="39.3" font-size="2.5" text-anchor="start" fill="#000">стена А, привязка 1560; низ 1300, центр 1650; над С7</text><text x="219.5" y="39.3" font-size="2.5" text-anchor="start" fill="#000">4</text><text x="235.5" y="39.3" font-size="2.5" text-anchor="start" fill="#000">подвес по основанию, 2 точки</text><text x="323.5" y="39.3" font-size="2.5" text-anchor="start" fill="#000">рама — дуб</text><text x="401.5" y="39.3" font-size="2.5" text-anchor="start" fill="#000">1</text><text x="26.5" y="45.3" font-size="2.5" text-anchor="start" fill="#000">ДК4</text><text x="37.5" y="45.3" font-size="2.5" text-anchor="start" fill="#000">9</text><text x="47.5" y="45.3" font-size="2.5" text-anchor="start" fill="#000">Зеркало в рост в тонкой чёрной раме</text><text x="117.5" y="45.3" font-size="2.5" text-anchor="start" fill="#000">600×1600</text><text x="147.5" y="45.3" font-size="2.5" text-anchor="start" fill="#000">стена Г, привязка 700; низ 300, центр 1100</text><text x="219.5" y="45.3" font-size="2.5" text-anchor="start" fill="#000">12</text><text x="235.5" y="45.3" font-size="2.5" text-anchor="start" fill="#000">анкер для пустотелых оснований, 4 шт.; основание: перегородка</text><text x="235.5" y="48.7" font-size="2.5" text-anchor="start" fill="#000">— определить обмером до монтажа; нагрузка 30 кг</text><text x="323.5" y="45.3" font-size="2.5" text-anchor="start" fill="#000">рама — чёрный матовый металл</text><text x="401.5" y="45.3" font-size="2.5" text-anchor="start" fill="#000">1</text></g><g data-pos="ДК3" data-qty="1"></g><g data-pos="ДК4" data-qty="1"></g></g><g data-el="view" data-scale="1:50"><text x="25" y="62.4" font-size="2.5" font-weight="700" fill="#000">ДК3 — Детская (пом. 9), стена А (М 1:50)</text><rect x="29" y="67.6" width="65.2" height="54" fill="#F7F5F1"/><path d="M 27.5 121.6 L 95.7 121.6" stroke="#000" stroke-width="0.5"/><path d="M 29 67.6 L 94.2 67.6" stroke="#000" stroke-width="0.35"/><path d="M 29 121.6 L 29 67.6" stroke="#000" stroke-width="0.35"/><g data-el="furniture-under"><rect x="109.8" y="106.6" width="-15.6" height="15" fill="#fff" stroke="#6b6b6b" stroke-width="0.25"/><text x="102" y="115" font-size="2.5" text-anchor="middle" fill="#555">С7</text></g><g data-el="decor-item"><rect x="60.2" y="81.6" width="20" height="14" fill="#E9DDCB" stroke="#5E4630" stroke-width="0.35"/><rect x="61.4" y="82.8" width="17.6" height="11.6" fill="none" stroke="#8C6A45" stroke-width="0.18"/><path d="M 68.7 88.6 L 71.7 88.6 M 70.2 87.1 L 70.2 90.1" stroke="#000" stroke-width="0.25"/><text x="71.4" y="87.6" font-size="2.5" fill="#000">ц 1650</text></g><g data-el="dims"><line x1="29" y1="122.6" x2="29" y2="130.6" stroke="#000" stroke-width="0.25"/><line x1="27.94" y1="129.66" x2="30.06" y2="127.54" stroke="#000" stroke-width="0.5"/><line x1="60.2" y1="122.6" x2="60.2" y2="130.6" stroke="#000" stroke-width="0.25"/><line x1="59.14" y1="129.66" x2="61.26" y2="127.54" stroke="#000" stroke-width="0.5"/><line x1="80.2" y1="122.6" x2="80.2" y2="130.6" stroke="#000" stroke-width="0.25"/><line x1="79.14" y1="129.66" x2="81.26" y2="127.54" stroke="#000" stroke-width="0.5"/><line x1="29" y1="128.6" x2="80.2" y2="128.6" stroke="#000" stroke-width="0.25"/><text x
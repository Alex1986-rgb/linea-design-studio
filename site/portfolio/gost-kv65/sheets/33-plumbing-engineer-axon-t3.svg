none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><path d="M 165.14 105 L 164.36 105.78 L 175.76 105.78 L 179.51 102.03 L 182.91 102.03" fill="none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><path d="M 182.91 102.03 L 182.91 91.03" fill="none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/></g><g data-el="pl-marks"><circle cx="165.14" cy="105" r="0.6" fill="#c0392b"/><circle cx="185.74" cy="105" r="0.6" fill="#c0392b"/><circle cx="165.14" cy="105" r="0.6" fill="#c0392b"/><path d="M 158.14 103.7 L 162.14 106.3 L 162.14 103.7 L 158.14 106.3 Z" fill="#fff" stroke="#c0392b" stroke-width="0.35"/><g data-el="pl-outlet" data-index="Т3"><circle cx="89.16" cy="95.98" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="Т3"><circle cx="204.66" cy="95.98" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="Т3"><circle cx="185.95" cy="85.39" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="Т3"><circle cx="182.91" cy="91.03" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/></g></g><g data-el="risers"><g data-el="riser" data-index="Т3"><path d="M 165.14 110 L 165.14 51" fill="none" stroke="#c0392b" stroke-width="0.7"/><path d="M 163.34 109.5 L 164.54 110.5 L 165.74 109.5 L 166.94 110.5" fill="none" stroke="#000" stroke-width="0.25"/><path d="M 163.34 50.5 L 164.54 51.5 L 165.74 50.5 L 166.94 51.5" fill="none" stroke="#000" stroke-width="0.25"/><circle cx="165.14" cy="105" r="1.1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/></g></g><g data-el="pl-labels"><text x="32.78" y="98.74" font-size="2.5" fill="#555">3 Кухня-гостиная</text><text x="175.96" y="110.78" font-size="2.5" fill="#555">7 Ванная</text><text x="151.45" y="110.78" font-size="2.5" fill="#555">6 Санузел</text><text x="159.25" y="45.4" font-size="2.5" fill="#c0392b">Ст Т3-1 Ø32</text><text x="159.25" y="48.4" font-size="2.5" fill="#c0392b">+2,700</text><text x="85.43" y="90.38" font-size="2.5" fill="#000">Т3-1 П4</text><text x="85.43" y="93.38" font-size="2.5" fill="#000">Н=550</text><text x="200.93" y="90.38" font-size="2.5" fill="#000">Т3-4 П3</text><text x="200.93" y="93.38" font-size="2.5" fill="#000">Н=550</text><text x="187.85" y="84.49" font-size="2.5" fill="#000">Т3-3 П1</text><text x="187.85" y="87.49" font-size="2.5" fill="#000">Н=800</text><text x="172.4" y="90.13" font-size="2.5" fill="#000">Т3-2 П21</text><text x="172.4" y="93.13" font-size="2.5" fill="#000">Н=550</text><text x="109.9" y="109.58" font-size="2.5" fill="#c0392b">Ø20</text><text x="109.9" y="112.58" font-size="2.5" fill="#c0392b">L=3,98</text><text x="197.31" y="100.18" font-size="2.5" fill="#c0392b">Ø20</text><text x="197.31" y="103.18" font-size="2.5" fill="#c0392b">L=2,35</text><line x1="170.06" y1="105.78" x2="170.06" y2="121.78" stroke="#000" stroke-width="0.18"/><text x="166.9" y="123.98" font-size="2.5" fill="#c0392b">Ø20</text><text x="166.9" y="126.98" font-size="2.5" fill="#c0392b">L=1,38</text></g></g><g data-el="legend-box"><g data-el="legend"><text x="310" y="25" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><line x1="310.5" y1="31" x2="317.5" y2="31" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><text x="321" y="31.9" font-size="2.5" fill="#000">Т3 — горячее водоснабжение, подача (ГВС), PP-R Ø20</text><circle cx="314" cy="36" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/><text x="321" y="36.9" font-size="2.5" fill="#000">вывод Т3 (код — в ведомости привязок)</text><circle cx="314" cy="41" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="321" y="41.9" font-size="2.5" fill="#000">стояк «Ст К1-N / Ст В1-N» (ГОСТ 21.601), Ø мм</text><circle cx="314" cy="46" r="1.1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/><text x="321" y="46.9" font-size="2.5" fill="#000">стояк в плане (на отметке пола); вертикаль — стояк по высоте,</text><text x="321" y="50.2" font-size="2.5" fill="#000">разрыв — перекрытие</text><circle cx="314" cy="54.3" r="0.6" fill="#000"/><text x="321" y="55.2" font-size="2.5" fill="#000">тройник (ответвление к прибору)</text><path d="M 312 58 L 316 60.6 L 316 58 L 312 60.6 Z" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="321" y="60.2" font-size="2.5" fill="#000">кран шаровой</text></g></g><g data-el="notes"><text x="25" y="240" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="245" font-size="2.5" fill="#000">1. Схема Т3 построена по тем же трассам, что план разводки: положение в плане сохранено, глубина — в масштабе ×0,5. Трассы принципиальные; фактическое</text><text x="25" y="248.6" font-size="2.5" fill="#000">положение фиксируется исполнительной схемой до закрытия.</text><text x="25" y="252.2" font-size="2.5" fill="#000">2. Высоты Н — от чистого пола помещения, мм. Прокладка магистрали Т3 по данным: в стяжке пола, в стяжке пола, выше плиты</text><text x="25" y="255.8" font-size="2.5" fill="#000">перекрытия; отметка трасс — по пирогу пола.</text><text x="25" y="259.4" font-size="2.5" fill="#000">3. Узел ввода Т3 (кран, фильтр, счётчик, обратный клапан, кран) — на схеме разводки; состав узла ввода — по согласованию. Кран шаровой — на первом</text><text x="25" y="263" font-size="2.5" fill="#000">участке от стояка.</text><text x="25" y="266.6" font-size="2.5" fill="#000">4. Циркуляция ГВС в данных не задана — циркуляционного трубопровода на схеме нет (запись реестра К-12).</text><text x="25" y="270.2" font-size="2.5" fill="#000">5. Трубы испытать давлением до закрытия (акт скрытых работ, опрессовка по СП 73.13330.2016).</text><text x="25" y="273.8" font-size="2.5" fill="#000">6. Диаметры, высоты выводов и места кранов — по паспортам выбранных приборов и расчёту проектной организации.</text><text x="25" y="277.4" font-size="2.5" fill="#000">7. Расчёт систем, диаметры магистралей и подбор оборудования выполняет проектная организация.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="45" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="45" y1="285.5" x2="45" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="47" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4 К-9" data-level="0"><text x="45.5" y="220.5" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="45.5" y="223.9" font-size="2.5" fill="#000">Основа листа: размеры сняты с растрового плана заказчика без размеров: масштаб восстановлен по площадям помещений (≈ 11,8 мм на пиксель), контрольный обмер не выполнен (К-1); высота</text><text x="45.5" y="227.3" font-size="2.5" fill="#000">потолка 2700 мм принята: на плане заказчика её нет (К-2); толщины стен 300 / 120 мм приняты по плану заказчика, не замерены (К-1); разрешённая мощность 15 кВт принята по типовым ТУ для</text><text x="45.5" y="230.7" font-size="2.5" fill="#000">квартиры, ТУ заказчиком не переданы (К-4); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-9).</text><text x="45.5" y="234.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1, К-2, К-4, К-9).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">04.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-007-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Квартира 65 м²</text><text x="297" y="259.2" font-size="2.5" data-fit="116" fill="#000">Общая площадь 65,24* м² · * размеры со скана, не замерены (реестр — л. 6, 7, К-1)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" data-fit="66" fill="#000">Дизайн-проект интерьера</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">33</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">103</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="282.2" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">Аксонометрическая схема Т3 (горячее</text><text x="330" y="286" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">водоснабжение)</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М 1:50</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="47" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="12" data-positions="14" data-basis="5"><rect x="314.2" y="6.2" width="99.3" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="316.2" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 12 (реестр — л. 6, 7)</text></g></svg>
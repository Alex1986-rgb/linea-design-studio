<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Открытые вопросы, принятые допущения и конфликты. Лист 2 из 2" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты. Лист 2 из 2</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации (стартовое совещание 09.10.2026)</text><g data-el="open-issues" data-plan="fixed" data-plan-declared="2"><g data-el="issues-questions"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Открытые вопросы и принятые допущения (продолжение)</text><rect x="25" y="33" width="385" height="74.6" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="32" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="33" x2="39" y2="107.6" stroke="#000" stroke-width="0.25"/><text x="122" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Формулировка</text><line x1="205" y1="33" x2="205" y2="107.6" stroke="#000" stroke-width="0.25"/><text x="220" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Вид</text><line x1="235" y1="33" x2="235" y2="107.6" stroke="#000" stroke-width="0.25"/><text x="253" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Кто решает</text><line x1="271" y1="33" x2="271" y2="107.6" stroke="#000" stroke-width="0.25"/><text x="309.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Если решения нет</text><line x1="348" y1="33" x2="348" y2="107.6" stroke="#000" stroke-width="0.25"/><text x="379" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Лист, где это проявляется</text><g data-el="issue-row" data-kind="question" data-id="К-12"><text x="32" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">К-12</text><text x="40.5" y="46.7" font-size="2.5" fill="#000">Циркуляция ГВС в данных не задана — циркуляционного трубопровода на схеме нет. Решить: нужна ли циркуляция</text><text x="206.5" y="46.7" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="50.1" font-size="2.5" fill="#000">Ждёт: решения</text><text x="236.5" y="46.7" font-size="2.5" fill="#000">Инженер ВК (вода,</text><text x="236.5" y="50.1" font-size="2.5" fill="#000">канализация)</text><text x="272.5" y="46.7" font-size="2.5" fill="#000">циркуляции на схеме нет</text><text x="349.5" y="46.7" font-size="2.5" fill="#000">л. 42–44 — Развёртки мокрых зон: выводы ВК.</text><text x="349.5" y="50.1" font-size="2.5" fill="#000">Кухня-гостиная</text><text x="349.5" y="53.5" font-size="2.5" fill="#000">л. 39 — Аксонометрическая схема В1 (холодное</text><text x="349.5" y="56.9" font-size="2.5" fill="#000">водоснабжение)</text><text x="349.5" y="60.3" font-size="2.5" fill="#000">л. 38 — Схема разводки водопровода и</text><text x="349.5" y="63.7" font-size="2.5" fill="#000">канализации</text></g><line x1="25" y1="66.8" x2="410" y2="66.8" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-13"><text x="32" y="70.5" font-size="2.5" text-anchor="middle" fill="#000">К-13</text><text x="40.5" y="70.5" font-size="2.5" fill="#000">Помещение «Гардеробная»: выключатель основного света L6 (S1) не у входа — у двери Д-3 со стороны ручки свободного места нет</text><text x="40.5" y="73.9" font-size="2.5" fill="#000">(проём в 100 мм от угла, мебель у двери, чужие точки или выключатель общий с соседним помещением; расстановка мебель и</text><text x="40.5" y="77.3" font-size="2.5" fill="#000">двери не двигает). Варианты: (а) петли на другую сторону — ручка уходит от угла, выключатель встаёт у ручки; (б) шкаф или тумбу у</text><text x="40.5" y="80.7" font-size="2.5" fill="#000">двери сдвинуть на 300 мм — место освобождается; (в) беспроводной выключатель на клее у ручки (реле в подрозетнике ближней</text><text x="40.5" y="84.1" font-size="2.5" fill="#000">стены) — по согласованию с заказчиком; (г) оставить как есть (S1): рука дальше 350 мм от ручки.</text><text x="206.5" y="70.5" font-size="2.5" fill="#000">Спорно</text><text x="206.5" y="73.9" font-size="2.5" fill="#000">Ждёт: решения</text><text x="236.5" y="70.5" font-size="2.5" fill="#000">Инженер-электрик</text><text x="272.5" y="70.5" font-size="2.5" fill="#000">выключатель L6 остаётся на месте (S1); закладные под</text><text x="272.5" y="73.9" font-size="2.5" fill="#000">выключатель у двери не делать до решения</text><text x="349.5" y="70.5" font-size="2.5" fill="#000">л. 29 — План выключателей и схема включения</text></g><line x1="25" y1="87.2" x2="410" y2="87.2" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-14"><text x="32" y="90.9" font-size="2.5" text-anchor="middle" fill="#000">К-14</text><text x="40.5" y="90.9" font-size="2.5" fill="#000">Помещение «Коридор»: выключатель основного света L3 (S3, S5) не у входа — у двери A 150, Д-2, Д-2, Д-5, Д-4 со стороны ручки</text><text x="40.5" y="94.3" font-size="2.5" fill="#000">свободного места нет (проём в 100 мм от угла, мебель у двери, чужие точки или выключатель общий с соседним помещением;</text><text x="40.5" y="97.7" font-size="2.5" fill="#000">расстановка мебель и двери не двигает). Варианты: (а) петли на другую сторону — ручка уходит от угла, выключатель встаёт у</text><text x="40.5" y="101.1" font-size="2.5" fill="#000">ручки; (б) шкаф или тумбу у двери сдвинуть на 300 мм — место освобождается; (в) беспроводной выключатель на клее у ручки (реле</text><text x="40.5" y="104.5" font-size="2.5" fill="#000">в подрозетнике ближней стены) — по согласованию с заказчиком; (г) оставить как есть (S3, S5): рука дальше 350 мм от ручки.</text><text x="206.5" y="90.9" font-size="2.5" fill="#000">Спорно</text><text x="206.5" y="94.3" font-size="2.5" fill="#000">Ждёт: решения</text><text x="236.5" y="90.9" font-size="2.5" fill="#000">Инженер-электрик</text><text x="272.5" y="90.9" font-size="2.5" fill="#000">выключатель L3 остаётся на месте (S3, S5); закладные под</text><text x="272.5" y="94.3" font-size="2.5" fill="#000">выключатель у двери не делать до решения</text><text x="349.5" y="90.9" font-size="2.5" fill="#000">л. 29 — План выключателей и схема включения</text></g></g><g data-el="issues-changes"><text x="25" y="120" font-size="3.5" font-weight="700" fill="#000">Изменения проекта после выпуска листов (реестр изменений)</text><rect x="25" y="122.6" width="385" height="50.8" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="132.6" x2="410" y2="132.6" stroke="#000" stroke-width="0.5"/><text x="32" y="128.5" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="122.6" x2="39" y2="173.4" stroke="#000" stroke-width="0.25"/><text x="50" y="128.5" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><line x1="61" y1="122.6" x2="61" y2="173.4" stroke="#000" stroke-width="0.25"/><text x="91" y="128.5" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><line x1="121" y1="122.6" x2="121" y2="173.4" stroke="#000" stroke-width="0.25"/><text x="171" y="128.5" font-size="2.5" text-anchor="middle" fill="#000">Было</text><line x1="221" y1="122.6" x2="221" y2="173.4" stroke="#000" stroke-width="0.25"/><text x="283.5" y="128.5" font-size="2.5" text-anchor="middle" fill="#000">Стало</text><line x1="346" y1="122.6" x2="346" y2="173.4" stroke="#000" stroke-width="0.25"/><text x="378" y="128.5" font-size="2.5" text-anchor="middle" fill="#000">Кто решил, подпись</text><g data-el="issue-row" data-kind="change" data-id="ИЗ-1"><text x="32" y="136.3" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-1</text><text x="40.5" y="136.3" font-size="2.5" fill="#000">30.10.2026</text><text x="62.5" y="136.3" font-size="2.5" fill="#000">л. 24 — План расстановки мебели</text><text x="62.5" y="139.7" font-size="2.5" fill="#000">л. 25 — Спецификация мебели и</text><text x="62.5" y="143.1" font-size="2.5" fill="#000">оборудования</text><text x="62.5" y="146.5" font-size="2.5" fill="#000">л. 27 — План розеток и электровыводов</text><text x="62.5" y="149.9" font-size="2.5" fill="#000">л. 82 — Развёртка стены В2. Кухня-гостиная</text><text x="62.5" y="153.3" font-size="2.5" fill="#000">(пом. 3), кухонный фронт</text><text x="122.5" y="136.3" font-size="2.5" fill="#000">Кухня-гостиная (пом. 3): диван М1 2200×950 стоял в полосе 1400 мм между</text><text x="122.5" y="139.7" font-size="2.5" fill="#000">спальней и кухней (x 2900…5100, y 3000…3950) — единственном проходе от</text><text x="122.5" y="143.1" font-size="2.5" fill="#000">двери Д-2; стыки частей 0–1 — 290 мм, 1–3 — 200, 1–4 — 0, 2–3 — 600; кресло</text><text x="122.5" y="146.5" font-size="2.5" fill="#000">М3 в x 800, стол М2 в x 1000, y 2700. Вопрос К-5 открыт.</text><text x="222.5" y="136.3" font-size="2.5" fill="#000">Диван М1 у стены А основной части (x 250…2450, y 1650…2600), стол М2 перед ним (x 1100…2100, y</text><text x="222.5" y="139.7" font-size="2.5" fill="#000">2800…3800), кресло М3 у окна 2 (x 400…1150, y 3700…4450); розетки «у дивана» перенесены на</text><text x="222.5" y="143.1" font-size="2.5" fill="#000">стену А (x 700, 2300), розетка торшера — на стену Г (смещение 1900). Части помещения 2–4</text><text x="222.5" y="146.5" font-size="2.5" fill="#000">перекроены без изменения контура: кухонный ряд М4…М8 и ниша С4 — одна часть (0…4850 ×</text><text x="222.5" y="149.9" font-size="2.5" fill="#000">4550…5800), связка 2700…4850 × 4050…4550; стык частей 2–3 проходил сквозь кухонный ряд (600</text><text x="222.5" y="153.3" font-size="2.5" fill="#000">мм — глубина столешницы, не проход). Знак «**» у М1, М2, М3 до подписи автора; К-5 — у автора.</text><text x="347.5" y="136.3" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="139.7" font-size="2.5" fill="#000">исполнителя; предложение проектировщика, на</text><text x="347.5" y="143.1" font-size="2.5" fill="#000">утверждение А. С. Кырлана</text></g><line x1="25" y1="156.4" x2="410" y2="156.4" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-2"><text x="32" y="160.1" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-2</text><text x="40.5" y="160.1" font-size="2.5" fill="#000">10.11.2026</text><text x="62.5" y="160.1" font-size="2.5" fill="#000">л. 24 — План расстановки мебели</text><text x="62.5" y="163.5" font-size="2.5" fill="#000">л. 27 — План розеток и электровыводов</text><text x="122.5" y="160.1" font-size="2.5" fill="#000">Диван М1 стоял на y 1700 мм, а чистая грань стены А помещения — на y 1710;</text><text x="122.5" y="163.5" font-size="2.5" fill="#000">розетка «у дивана» на стене А (смещение 200 мм, высота 300) — в 50 мм от</text><text x="122.5" y="166.9" font-size="2.5" fill="#000">бока дивана (x 250), закрыта мебелью.</text><text x="222.5" y="160.1" font-size="2.5" fill="#000">Диван М1 — y 1710 мм (было 1700), по чистой грани стены А: x 250…2450, y 1710…2660; размеры</text><text x="222.5" y="163.5" font-size="2.5" fill="#000">2200 × 950 мм и положение по x прежние. Розетка «у дивана» на стене А — смещение 150 мм</text><text x="222.5" y="166.9" font-size="2.5" fill="#000">(было 200), высота 300 мм прежняя: 100 мм до бока дивана, 150 мм до угла. Вторая розетка у</text><text x="222.5" y="170.3" font-size="2.5" fill="#000">дивана (смещение 2550) не тронута. Диван остаётся предложением (ИЗ-1, К-5).</text><text x="347.5" y="160.1" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="163.5" font-size="2.5" fill="#000">исполнителя; на утверждение А. С. Кырлана</text></g></g><g data-el="notes"><text x="25" y="185.8" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="190.6" font-size="2.5" fill="#000">1. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text><text x="25" y="194" font-size="2.5" fill="#000">2. Графа «Если решения нет» показывает состояние решения на листах; влияние на сроки и стоимость по пунктам не оценивалось.</text><text x="25" y="197.4" font-size="2.5" fill="#000">3. Пункт, по которому принято решение, при следующем выпуске комплекта из таблиц исключается.</text></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">11.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-007-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Квартира 65 м²</text><text x="297" y="259.2" font-size="2.5" data-fit="116" fill="#000">Общая площадь 65,24* м² · * размеры со скана, не замерены (реестр — л. 6, 7, К-1)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" data-fit="66" fill="#000">Дизайн-проект интерьера</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/
6" r="1.1" fill="#fff" stroke="#6b4f2a" stroke-width="0.25"/><path d="M 180.56 99.8 L 182.16 101.4 M 182.16 99.8 L 180.56 101.4" fill="none" stroke="#6b4f2a" stroke-width="0.25" data-sym="revision"/></g><circle cx="182.62" cy="103.84" r="0.6" fill="#6b4f2a"/><g data-el="revision"><circle cx="183.26" cy="103.16" r="1.1" fill="#fff" stroke="#6b4f2a" stroke-width="0.25"/><path d="M 182.46 102.36 L 184.06 103.96 M 184.06 102.36 L 182.46 103.96" fill="none" stroke="#6b4f2a" stroke-width="0.25" data-sym="revision"/></g><path d="M 161.69 105.49 L 164.47 104.64 L 164.5 106.24 Z" fill="#6b4f2a"/><path d="M 201.99 104.53 L 204.77 103.66 L 204.81 105.26 Z" fill="#6b4f2a"/><path d="M 114.48 104.46 L 111.67 105.19 L 111.71 103.59 Z" fill="#6b4f2a"/><path d="M 171.29 105.22 L 174.07 104.35 L 174.11 105.95 Z" fill="#6b4f2a"/><g data-el="pl-outlet" data-index="К1"><circle cx="168.16" cy="99.86" r="1" fill="#fff" stroke="#6b4f2a" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="К1"><circle cx="235.08" cy="83.14" r="1" fill="#fff" stroke="#6b4f2a" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="К1"><circle cx="88.16" cy="96.86" r="1" fill="#fff" stroke="#6b4f2a" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="К1"><circle cx="203.66" cy="94.26" r="1" fill="#fff" stroke="#6b4f2a" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="К1"><circle cx="182.56" cy="89.66" r="1" fill="#fff" stroke="#6b4f2a" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="К1"><circle cx="182.06" cy="101.56" r="1" fill="#fff" stroke="#6b4f2a" stroke-width="0.35"/></g></g><g data-el="risers"><g data-el="riser" data-index="К1"><path d="M 160.22 110 L 160.22 51" fill="none" stroke="#6b4f2a" stroke-width="0.7"/><path d="M 158.42 109.5 L 159.62 110.5 L 160.82 109.5 L 162.02 110.5" fill="none" stroke="#000" stroke-width="0.25"/><path d="M 158.42 50.5 L 159.62 51.5 L 160.82 50.5 L 162.02 51.5" fill="none" stroke="#000" stroke-width="0.25"/><circle cx="160.22" cy="103.2" r="1.1" fill="#fff" stroke="#6b4f2a" stroke-width="0.35"/></g></g><g data-el="pl-labels"><text x="144.64" y="101.66" font-size="2.5" fill="#555">6 Санузел</text><text x="175.96" y="109.46" font-size="2.5" fill="#555">7 Ванная</text><text x="32.78" y="96.62" font-size="2.5" fill="#555">3 Кухня-гостиная</text><text x="153.79" y="45.4" font-size="2.5" fill="#6b4f2a">Ст К1-1 Ø110</text><text x="153.79" y="48.4" font-size="2.5" fill="#6b4f2a">+2,700</text><text x="236.98" y="82.24" font-size="2.5" fill="#000">К1-6 П22</text><text x="236.98" y="85.24" font-size="2.5" fill="#000">Н=600</text><text x="84.46" y="91.26" font-size="2.5" fill="#000">К1-1 П4</text><text x="84.46" y="94.26" font-size="2.5" fill="#000">Н=400</text><text x="205.56" y="98.06" font-size="2.5" fill="#000">К1-5 П3</text><text x="205.56" y="101.06" font-size="2.5" fill="#000">Н=500</text><text x="178.28" y="84.06" font-size="2.5" fill="#000">К1-3 П21</text><text x="178.28" y="87.06" font-size="2.5" fill="#000">Н=500</text><text x="165.19" y="109.26" font-size="2.5" fill="#6b4f2a">Ø110 i=20</text><text x="165.19" y="112.26" font-size="2.5" fill="#6b4f2a">L=0,76</text><text x="199.36" y="108.29" font-size="2.5" fill="#6b4f2a">Ø50 i=25</text><text x="199.36" y="111.29" font-size="2.5" fill="#6b4f2a">L=4,66</text><text x="108.66" y="98.82" font-size="2.5" fill="#6b4f2a">Ø50 i=25</text><text x="108.66" y="101.82" font-size="2.5" fill="#6b4f2a">L=3,62</text></g></g><g data-el="legend-box"><g data-el="legend"><text x="310" y="25" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><line x1="310.5" y1="31" x2="317.5" y2="31" stroke="#6b4f2a" stroke-width="0.5" stroke-dasharray="6 1.2"/><text x="321" y="31.9" font-size="2.5" fill="#000">К1 — канализация бытовая</text><circle cx="314" cy="36" r="1" fill="#fff" stroke="#6b4f2a" stroke-width="0.35"/><text x="321" y="36.9" font-size="2.5" fill="#000">вывод К1 (код — в ведомости привязок)</text><circle cx="314" cy="41" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="321" y="41.9" font-size="2.5" fill="#000">стояк «Ст К1-N / Ст В1-N» (ГОСТ 21.601), Ø мм</text><circle cx="314" cy="46" r="1.1" fill="#fff" stroke="#6b4f2a" stroke-width="0.35"/><text x="321" y="46.9" font-size="2.5" fill="#000">стояк в плане (на отметке пола); вертикаль — стояк по высоте,</text><text x="321" y="50.2" font-size="2.5" fill="#000">разрыв — перекрытие</text><line x1="310.5" y1="54.3" x2="316" y2="54.3" stroke="#000" stroke-width="0.25"/><path d="M 317.5 54.3 L 315.7 53.599999999999994 L 315.7 55 Z" fill="#000"/><text x="321" y="55.2" font-size="2.5" fill="#000">направление уклона К1 / пола: Ø, мм на 1 м</text><circle cx="314" cy="59.3" r="1.1" fill="#fff" stroke="#000" stroke-width="0.25"/><path d="M 313.2 58.5 L 314.8 60.1 M 314.8 58.5 L 313.2 60.1" fill="none" stroke="#000" stroke-width="0.25" data-sym="revision"/><text x="321" y="60.2" font-size="2.5" fill="#000">ревизия (прочистка) К1 — доступ сохранить</text><circle cx="314" cy="64.3" r="0.6" fill="#000"/><text x="321" y="65.2" font-size="2.5" fill="#000">тройник (ответвление к прибору)</text></g></g><g data-el="notes"><text x="25" y="240" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="245" font-size="2.5" fill="#000">1. Схема К1 построена по тем же трассам, что план разводки: положение в плане сохранено, глубина — в масштабе ×0,5. Трассы принципиальные; фактическое</text><text x="25" y="248.6" font-size="2.5" fill="#000">положение фиксируется исполнительной схемой до закрытия.</text><text x="25" y="252.2" font-size="2.5" fill="#000">2. Отметки — от плиты перекрытия: низ трубы у врезки в стояк — отметка из данных выпуска, к прибору труба поднимается на уклон i, мм/м (уклон не менее</text><text x="25" y="255.8" font-size="2.5" fill="#000">1/d и не более 150 мм/м, СП 30.13330.2020, п. 19.1); чистый пол — выше плиты на стяжку (высота пирога пола). Высота выпуска прибора Н — от чистого</text><text x="25" y="259.4" font-size="2.5" fill="#000">пола.</text><text x="25" y="263" font-size="2.5" fill="#000">3. Ревизия — на повороте и в начале участка; стояк К1 в коробе с люком — звукоизоляция стояка в коробе; поворот — двумя отводами 45°.</text><text x="25" y="266.6" font-size="2.5" fill="#000">4. Трубы испытать давлением до закрытия (акт скрытых работ, опрессовка по СП 73.13330.2016).</text><text x="25" y="270.2" font-size="2.5" fill="#000">5. Диаметры, высоты выводов и места кранов — по паспортам выбранных приборов и расчёту проектной организации.</text><text x="25" y="273.8" font-size="2.5" fill="#000">6. Расчёт систем, диаметры магистралей и подбор оборудования выполняет проектная организация.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="45" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="45" y1="285.5" x2="45" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="47" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4 К-9" data-level="0"><text x="45.5" y="220.5" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="45.5" y="223.9" font-size="2.5" fill="#000">Основа листа: размеры сняты с растрового плана заказчика без размеров: масштаб восстановлен по площадям помещений (≈ 11,8 мм на пиксель), контрольный обмер не выполнен (К-1); высота</text><text x="45.5" y="227.3" font-size="2.5" fill="#000">потолка 2700 мм принята: на плане заказчика её нет (К-2); толщины стен 300 / 120 мм приняты по плану заказчика, не замерены (К-1); разрешённая мощность 15 кВт принята по типовым ТУ для</text><text x="45.5" y="230.7" font-size="2.5" fill="#000">квартиры, ТУ заказчиком не переданы (К-4); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-9).</text><text x="45.5" y="234.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1, К-2, К-4, К-9).</text></g>
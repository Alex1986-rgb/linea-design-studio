<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Аксонометрическая схема К1 (канализация)" data-sheet="plumbing" data-scale="1:50"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Аксонометрическая схема К1 (канализация)</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">аксонометрия · диаметры, уклоны, отметки, стояки и приборы · трассы принципиальные</text><g data-el="view" data-scale="1:50"><text x="25" y="22" font-size="3.5" font-weight="700" fill="#000">Схема К1 (М 1:50; по вертикали и горизонтали один масштаб, глубина — ×0,5 под 45°)</text><g data-el="rooms-ctx"><path d="M 168.31 92.31 L 189.91 92.31 L 177.96 104.26 L 156.36 104.26 Z" fill="none" stroke="#9a9a9a" stroke-width="0.18"/><path d="M 192.31 92.31 L 237.91 92.31 L 225.96 104.26 L 180.36 104.26 Z" fill="none" stroke="#9a9a9a" stroke-width="0.18"/><path d="M 71.08 75.94 L 123.88 75.94 L 103.8 96.02 L 51 96.02 Z" fill="none" stroke="#9a9a9a" stroke-width="0.18"/></g><g data-el="pipes"><path d="M 160.22 105 L 158.62 104.97 L 157.99 105.57 L 168.59 105.36 L 168.16 105.76" fill="none" stroke="#6b4f2a" stroke-width="0.5" stroke-dasharray="6 1.2"/><path d="M 168.16 105.76 L 168.16 99.86" fill="none" stroke="#6b4f2a" stroke-width="0.5" stroke-dasharray="6 1.2"/><path d="M 160.22 105 L 182.62 104.44 L 181.99 105.03 L 225.19 103.95 L 233.88 94.64 L 235.08 94.61" fill="none" stroke="#6b4f2a" stroke-width="0.5" stroke-dasharray="6 1.2"/><path d="M 235.08 94.61 L 235.08 83.14" fill="none" stroke="#6b4f2a" stroke-width="0.5" stroke-dasharray="6 1.2"/><path d="M 158.62 104.96 L 137.82 104.44 L 137.19 105.03 L 88.59 103.82 L 88.16 104.21" fill="none" stroke="#6b4f2a" stroke-width="0.5" stroke-dasharray="6 1.2"/><
">0,68</text><text x="26.5" y="154.3" font-size="2.5" text-anchor="start" data-fit="29.95" fill="#000">Т3-2</text><text x="59.45" y="154.3" font-size="2.5" text-anchor="start" data-fit="112.79" fill="#000">П21 умывальник</text><text x="175.24" y="154.3" font-size="2.5" text-anchor="start" data-fit="34.68" fill="#000">550</text><text x="212.92" y="154.3" font-size="2.5" text-anchor="start" data-fit="46.16" fill="#000">20</text><text x="262.08" y="154.3" font-size="2.5" text-anchor="start" data-fit="40.42" fill="#000">1,38</text></g><g data-el="legend"><text x="312" y="122" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><line x1="312.5" y1="128" x2="319.5" y2="128" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><text x="323" y="128.9" font-size="2.5" fill="#000">Т3 — горячее водоснабжение, подача (ГВС), PP-R Ø20</text><circle cx="316" cy="133" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/><text x="323" y="133.9" font-size="2.5" fill="#000">вывод Т3 (код — в ведомости привязок)</text><circle cx="316" cy="138" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="323" y="138.9" font-size="2.5" fill="#000">стояк «Ст К1-N / Ст В1-N» (ГОСТ 21.601), Ø мм</text><circle cx="316" cy="143" r="1.1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/><text x="323" y="143.9" font-size="2.5" fill="#000">стояк в плане (на отметке пола); вертикаль — стояк по высоте,</text><text x="323" y="147.2" font-size="2.5" fill="#000">разрыв — перекрытие</text><circle cx="316" cy="151.3" r="0.6" fill="#000"/><text x="323" y="152.2" font-size="2.5" fill="#000">тройник (ответвление к прибору)</text><path d="M 314 155 L 318 157.6 L 318 155 L 314 157.6 Z" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="323" y="157.2" font-size="2.5" fill="#000">кран шаровой</text></g><g data-el="notes"><text x="25" y="240" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="245" font-size="2.5" fill="#000" textLength="156.77" lengthAdjust="spacingAndGlyphs">1. Схема Т3** построена по тем же трассам, что план разводки: положение в плане сохранено, глубина — в масштабе ×0,5. Трассы принципиальные; фактическое</text><text x="25" y="248.6" font-size="2.5" fill="#000">положение фиксируется исполнительной схемой до закрытия.</text><text x="25" y="252.2" font-size="2.5" fill="#000" textLength="125.65" lengthAdjust="spacingAndGlyphs">2. Высоты Н — от чистого пола помещения, мм. Прокладка магистрали Т3** по данным: в стяжке пола, в стяжке пола, выше плиты</text><text x="25" y="255.8" font-size="2.5" fill="#000">перекрытия; отметка трасс — по пирогу пола.</text><text x="25" y="259.4" font-size="2.5" fill="#000" textLength="150.99" lengthAdjust="spacingAndGlyphs">3. Узел ввода Т3** (кран, фильтр, счётчик, обратный клапан, кран) — на схеме разводки; состав узла ввода — по согласованию. Кран шаровой — на первом</text><text x="25" y="263" font-size="2.5" fill="#000">участке от стояка.</text><text x="25" y="266.6" font-size="2.5" fill="#000">4. Циркуляция ГВС в данных не задана — циркуляционного трубопровода на схеме нет (запись реестра К-12).</text><text x="25" y="270.2" font-size="2.5" fill="#000">5. Трубы испытать давлением до закрытия (акт скрытых работ, опрессовка по СП 73.13330.2016).</text><text x="25" y="273.8" font-size="2.5" fill="#000">6. Диаметры, высоты выводов и места кранов — по паспортам выбранных приборов и расчёту проектной организации.</text><text x="25" y="277.4" font-size="2.5" fill="#000">7. Расчёт систем, диаметры магистралей и подбор оборудования выполняет проектная организация.</text></g><g data-el="assume-compact"></g><g data-el="scale-bar"><line x1="25" y1="287" x2="45" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="45" y1="285.5" x2="45" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="47" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="textile:Т3" data-ids="ИЗ-4 К-1 К-2 К-4 К-9" data-level="3"><text x="74.5" y="285.7" font-size="2.5" fill="#000">Допущения и предложения на листе. Знак «**» предложено (согласовать). См. лист открытых вопросов</text><text x="74.5" y="289.1" font-size="2.5" fill="#000">(листы 6–8).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5"
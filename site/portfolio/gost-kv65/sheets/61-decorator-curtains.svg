<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Шторы и карнизы" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Шторы и карнизы</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Схемы окон «шина → полотно» (М 1:50) · отметки от чистого пола помещения · размеры в мм</text><g data-el="view" data-scale="1:50"><text x="25" y="26" font-size="2.5" font-weight="700" data-fit="86.4" fill="#000">Окно 1 — Детская (пом. 9): Т7, Т8 (М 1:50)</text><clipPath id="dccl2"><rect x="42" y="39" width="54.4" height="54.41"/></clipPath><rect x="42" y="43.4" width="54.4" height="50" fill="#F7F5F1"/><path d="M 40 93.4 L 98.4 93.4" stroke="#000" stroke-width="0.5"/><path d="M 42 43.4 L 96.4 43.4" stroke="#000" stroke-width="0.35"/><path d="M 42 41.4 L 96.4 41.4" fill="none" stroke="#000" stroke-width="0.25" stroke-dasharray="1.6 0.8"/><g data-el="opening"><rect x="51.4" y="45.4" width="30" height="32" fill="#E8EEF1" stroke="#000" stroke-width="0.35"/><rect x="52.4" y="46.4" width="28" height="30" fill="none" stroke="#6b6b6b" stroke-width="0.18"/><path d="M 50.4 77.4 L 82.4 77.4" stroke="#000" stroke-width="0.5"/></g><g clip-path="url(#dccl2)" data-el="textile"><rect x="51" y="41.4" width="36.4" height="51.8" fill="#EEEEE9" fill-opacity="0.45" stroke="#9B9B97" stroke-width="0.18"/><path d="M 53.4 42 L 53.4 92.9 M 55.8 42 L 55.8 92.9 M 58.2 42 L 58.2 92.9 M 60.6 42 L 60.6 92.9 M 63 42 L 63 92.9 M 65.4 42 L 65.4 92.9 M 67.8 42 L 67.8 92.9 M 70.2 42 L 70.2 92.9 M 72.6 42 L 72.6 92.9 M 75 42 L 75 92.9 M 77.4 42 L 77.4 92.9 M 79.8 42 L 79.8 92.9 M 82.2 42 L 82.2 92.9 M 84.6 42 L 84.6 92.9 " fill="none" stroke="#B3B3AF" stroke-width="0.18"/><rect x="5
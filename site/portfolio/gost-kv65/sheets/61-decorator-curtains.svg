"2.5" text-anchor="middle" data-fit="19" fill="#000">Окно, пом.</text><line x1="57" y1="121.4" x2="57" y2="141.4" stroke="#000" stroke-width="0.25"/><text x="74" y="126.7" font-size="2.5" text-anchor="middle" data-fit="33" fill="#000">Проём Ш×В, подоконник</text><line x1="91" y1="121.4" x2="91" y2="141.4" stroke="#000" stroke-width="0.25"/><text x="99" y="126.7" font-size="2.5" text-anchor="middle" data-fit="15" fill="#000">Верх ниши</text><line x1="107" y1="121.4" x2="107" y2="141.4" stroke="#000" stroke-width="0.25"/><text x="120" y="126.7" font-size="2.5" text-anchor="middle" data-fit="25" fill="#000">Изделие</text><line x1="133" y1="121.4" x2="133" y2="141.4" stroke="#000" stroke-width="0.25"/><text x="159" y="126.7" font-size="2.5" text-anchor="middle" data-fit="51" fill="#000">Шина / карниз: длина, крепление</text><line x1="185" y1="121.4" x2="185" y2="141.4" stroke="#000" stroke-width="0.25"/><text x="193" y="126.7" font-size="2.5" text-anchor="middle" data-fit="15" fill="#000">Верх шины</text><line x1="201" y1="121.4" x2="201" y2="141.4" stroke="#000" stroke-width="0.25"/><text x="218" y="126.7" font-size="2.5" text-anchor="middle" data-fit="33" fill="#000">Полотно: длина, низ</text><line x1="235" y1="121.4" x2="235" y2="141.4" stroke="#000" stroke-width="0.25"/><text x="257" y="126.7" font-size="2.5" text-anchor="middle" data-fit="43" fill="#000">Управление</text><line x1="25" y1="135.4" x2="279" y2="135.4" stroke="#000" stroke-width="0.18"/><text x="26.5" y="133.7" font-size="2.5" text-anchor="start" data-fit="9" fill="#000">Т7</text><text x="38.5" y="133.7" font-size="2.5" text-anchor="start" data-fit="17" fill="#000">1, пом. 9</text><text x="58.5" y="133.7" font-size="2.5" text-anchor="start" data-fit="31" fill="#000">1500×1600, подок. 800</text><text x="92.5" y="133.7" font-size="2.5" text-anchor="start" data-fit="13" fill="#000">+2,600</text><text x="108.5" y="133.7" font-size="2.5" text-anchor="start" data-fit="23" fill="#000">портьеры</text><text x="134.5" y="133.7" font-size="2.5" text-anchor="start" data-fit="49" fill="#000">шина, 1820, в нише потолка, вынос 150</text><text x="186.5" y="133.7" font-size="2.5" text-anchor="start" data-fit="13" fill="#000">+2,600</text><text x="202.5" y="133.7" font-size="2.5" text-anchor="start" data-fit="31" fill="#000">2590, низ 10 (парит)</text><text x="236.5" y="133.7" font-size="2.5" text-anchor="start" data-fit="41" fill="#000">вручную</text><text x="26.5" y="139.7" font-size="2.5" text-anchor="start" data-fit="9" fill="#000">Т8</text><text x="38.5" y="139.7" font-size="2.5" text-anchor="start" data-fit="17" fill="#000">1, пом. 9</text><text x="58.5" y="139.7" font-size="2.5" text-anchor="start" data-fit="31" fill="#000">1500×1600, подок. 800</text><text x="92.5" y="139.7" font-size="2.5" text-anchor="start" data-fit="13" fill="#000">+2,600</text><text x="108.5" y="139.7" font-size="2.5" text-anchor="start" data-fit="23" fill="#000">тюль</text><text x="134.5" y="139.7" font-size="2.5" text-anchor="start" data-fit="49" fill="#000">шина, 1820, в нише потолка, вынос 150</text><text x="186.5" y="139.7" font-size="2.5" text-anchor="start" data-fit="13" fill="#000">+2,600</text><text x="202.5" y="139.7" font-size="2.5" text-anchor="start" data-fit="31" fill="#000">2590, низ 10 (парит)</text><text x="236.5" y="139.7" font-size="2.5" text-anchor="start" data-fit="41" fill="#000">вручную</text></g><g data-el="tasks"><text x="285" y="119.4" font-size="3.5" font-weight="700" fill="#000">Задания смежникам</text><rect x="285" y="121.4" width="122" height="26.8" fill="none" stroke="#000" stroke-width="0.5"/><line x1="285" y1="129.4" x2="407" y2="129.4" stroke="#000" stroke-width="0.5"/><text x="298" y="126.7" font-size="2.5" text-anchor="middle" data-fit="25" fill="#000">Кому</text><line x1="311" y1="121.4" x2="311" y2="148.2" stroke="#000" stroke-width="0.25"/><text x="353" y="126.7" font-size="2.5" text-anchor="middle" data-fit="83" fill="#000">Задание</text><line x1="395" y1="121.4" x2="395" y2="148.2" stroke="#000" stroke-width="0.25"/><text x="401" y="126.7" font-size="2.5" text-anchor="middle" data-fit="11" fill="#000">Пом.</text><line x1="285" y1="142.2" x2="407" y2="142.2" stroke="#000" stroke-width="0.18"/><text x="286.5" y="133.7" font-size="2.5" text-anchor="start" data-fit="23" fill="#000">Гипсокартонщик</text><text x="312.5" y="133.7" font-size="2.5" text-anchor="start" data-fit="81" fill="#000">окно 1 (1500×1600, Т7, Т8): ниша под шторы 150×100, верх</text><text x="312.5" y="137.1" font-size="2.5" text-anchor="start" data-fit="81" fill="#000">+2,600; закладная под шину L 1820 по всей длине — до</text><text x="312.5" y="140.5" font-size="2.5" text-anchor="start" data-fit="81" fill="#000">обшивки</text><text x="396.5" y="133.7" font-size="2.5" text-anchor="start" data-fit="9" fill="#000">9</text><text x="286.5" y="146.5" font-size="2.5" text-anchor="start" data-fit="23" fill="#000">Электрик</text><text x="312.5" y="146.5" font-size="2.5" text-anchor="start" data-fit="81" fill="#000">выводы под электрокарнизы не требуются (управление вручную)</text><text x="396.5" y="146.5" font-size="2.5" text-anchor="start" data-fit="9" fill="#000"></text></g><g data-el="legend"><text x="25" y="159.2" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><rect x="25" y="163.2" width="8" height="4" fill="#CAC5BD" stroke="#6F6C68" stroke-width="0.25"/><text x="35" y="166.1" font-size="2.5" fill="#000">портьеры в открытом положении</text><rect x="105" y="163.2" width="8" height="4" fill="#EEEEE9" fill-opacity="0.45" stroke="#9B9B97" stroke-width="0.18"/><text x="115" y="166.1" font-size="2.5" fill="#000">тюль (на виде окна — прозрачная плашка)</text><rect x="25" y="168.7" width="8" height="4" fill="none" stroke="#6B645C" stroke-width="0.25" stroke-dasharray="1.6 0.8"/><rect x="25" y="168.7" width="8" height="1.5" fill="#C3B6A7" stroke="#6B645C" stroke-width="0.25"/><text x="35" y="171.6" font-size="2.5" fill="#000">римская штора: сложена / опущена</text><path d="M 105 170.70000000000002 L 113 170.70000000000002" stroke="#5B4A38" stroke-width="0.7"/><text x="115" y="171.6" font-size="2.5" fill="#000">шина или карниз на отметке верха</text><path d="M 25 176.20000000000002 L 33 176.20000000000002" fill="none" stroke="#000" stroke-width="0.25" stroke-dasharray="1.6 0.8"/><text x="35" y="177.1" font-size="2.5" fill="#000">верх ниши под шторы в потолке</text><rect x="105" y="174.2" width="8" height="4" fill="#E8EEF1" stroke="#000" stroke-width="0.35"/><text x="115" y="177.1" font-size="2.5" fill="#000">оконный проём</text></g><g data-el="notes"><text x="25" y="241" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="246" font-size="2.5" fill="#000">1. Отметки — от чистого пола помещения; размеры — мм.</text><text x="25" y="249.6" font-size="2.5" fill="#000">2. Шины в нишах потолка: закладная (брус или профиль) по всей длине ниши — до обшивки ГКЛ; ниша и её отметка — узел ниши на плане потолков (лист 47).</text><text x="25" y="253.2" font-size="2.5" fill="#000">3. Шина в нише — на отметке верха ниши (крепление к закладной в потолке ниши); длина полотна — от верха шины до чистого пола за вычетом зазора.</text><text x="25" y="256.8" font-size="2.5" fill="#000">4. Полотно портьер «парит» над полом на 10 мм; сборка портьер — 2,0, тюля — 2,5 (ширина полотна — в ведомости текстиля).</text><text x="25" y="260.4" font-size="2.5" fill="#000">5. Электрокарнизы не предусмотрены; при замене на электропривод — вывод кабеля в нише у края шины (задание электрику).</text><text x="25" y="264" font-size="2.5" fill="#000">6. Марки изделий — по плану текстиля и декора (лист 60) и ведомости текстиля (лист 62).</text></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4 К-9" data-level="0"><text x="25.5" y="275.5" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">Основа листа: размеры сняты с растрового плана заказчика без размеров: масштаб восстановлен по площадям помещений (≈ 11,8 мм на пиксель), контрольный обмер не выполнен</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">(К-1); высота потолка 2700 мм принята: на плане заказчика её нет (К-2); толщины стен 300 / 120 мм приняты по плану заказчика, не замерены (К-1); разрешённая мощность 15 кВт</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">принята по типовым ТУ для квартиры, ТУ заказчиком не переданы (К-4); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-9).</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1, К-2, К-4, К-9).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">10.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-007-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Квартира 65 м²</text><text x="297" y="259.2" font-size="2.5" data-fit="116" fill="#000">Общая площадь 65,24* м² · * размеры со скана, не замерены (реестр — л. 6, 7, К-1)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/
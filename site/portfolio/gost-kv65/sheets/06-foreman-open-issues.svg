<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Открытые вопросы, принятые допущения и конфликты. Лист 1 из 3" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты. Лист 1 из 3</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации (стартовое совещание 09.10.2026)</text><g data-el="open-issues" data-plan="fixed" data-plan-declared="3"><text x="25" y="27.2" font-size="2.5" fill="#000">Комплект предварительный по пунктам этих таблиц. Пока по пункту нет ответа или решения, показанное на указанном листе — допущение проектировщика, а не утверждённое решение.</text><text x="25" y="30.6" font-size="2.5" fill="#000">Сводка: открытых вопросов — 12 (из них ждут факта объекта — 5: контрольного обмера, обследования или документа); изменений в реестре — 5, из них без подписи — 2.</text><text x="25" y="34" font-size="2.5" fill="#000">Пункты, ответ на которые лежит на объекте, а не за столом проектировщика (графа «Вид», строка «Ждёт»), собраны на листе «Задание на контрольный обмер и обследование» (листы 9–11): что и где замерить, с какой точностью и чем подтвердить. Пункты, ждущие решения человека, на объекте не</text><text x="25" y="37.4" font-size="2.5" fill="#000">закрываются.</text><g data-el="issues-questions"><text x="25" y="49" font-size="3.5" font-weight="700" fill="#000">Открытые вопросы и принятые допущения</text><rect x="25" y="51.6" width="385" height="108.6" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="61.6" x2="410" y2="61.6" stroke="#000" stroke-width="0.5"/><text x="32" y="57.5" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="51.6" x2="39" y2="160.2" stroke="#000" stroke-width="0.25"/><text x="122" y="57.5" font-size="2.5" text-anchor="middle" fill="#000">Формулировка</text><line x1="205" y1="51.6" x2="205" y2="160.2" stroke="#000" stroke-width="0.25"/><text x="220" y="57.5" font-size="2.5" text-anchor="middle" fill="#000">Вид</text><line x1="235" y1="51.6" x2="235" y2="160.2" stroke="#000" stroke-width="0.25"/><text x="253" y="57.5" font-size="2.5" text-anchor="middle" fill="#000">Кто решает</text><line x1="271" y1="51.6" x2="271" y2="160.2" stroke="#000" stroke-width="0.25"/><text x="309.5" y="57.5" font-size="2.5" text-anchor="middle" fill="#000">Если решения нет</text><line x1="348" y1="51.6" x2="348" y2="160.2" stroke="#000" stroke-width="0.25"/><text x="379" y="57.5" font-size="2.5" text-anchor="middle" fill="#000">Лист, где это проявляется</text><g data-el="issue-row" data-kind="question" data-id="К-1"><text x="32" y="65.3" font-size="2.5" text-anchor="middle" fill="#000">К-1</text><text x="40.5" y="65.3" font-size="2.5" fill="#000">Размеры квартиры сняты с растрового плана заказчика без размерных цепочек: масштаб восстановлен по подписанным площадям</text><text x="40.5" y="68.7" font-size="2.5" fill="#000">помещений. До заказа мебели, дверей и материалов нужен контрольный обмер всех помещений и проёмов.</text><text x="206.5" y="65.3" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="68.7" font-size="2.5" fill="#000">Ждёт: обмера</text><text x="236.5" y="65.3" font-size="2.5" fill="#000">Архитектор-планировщик</text><text x="272.5" y="65.3" font-size="2.5" fill="#000">размеры на листах — по плану заказчика, уточняются по</text><text x="272.5" y="68.7" font-size="2.5" fill="#000">месту; мебель на заказ и материалы по ним не заказывать</text><text x="349.5" y="65.3" font-size="2.5" fill="#000">л. 21 — Обмерный план</text><text x="349.5" y="68.7" font-size="2.5" fill="#000">л. 25 — План расстановки мебели</text></g><line x1="25" y1="71.8" x2="410" y2="71.8" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-2"><text x="32" y="75.5" font-size="2.5" text-anchor="middle" fill="#000">К-2</text><text x="40.5" y="75.5" font-size="2.5" fill="#000">Высота потолка на плане заказчика не указана, принята 2700 мм.</text><text x="206.5" y="75.5" font-size="2.5" fill="#000">Отсутствует</text><text x="236.5" y="75.5" font-size="2.5" fill="#000">Архитектор-планировщик</text><text x="272.5" y="75.5" font-size="2.5" fill="#000">высоты на развёртках и потолки — от 2700 мм, уточнить</text><text x="272.5" y="78.9" font-size="2.5" fill="#000">при обмере</text><text x="349.5" y="75.5" font-size="2.5" fill="#000">л. 21 — Обмерный план</text><text x="349.5" y="78.9" font-size="2.5" fill="#000">л. 49 — План потолков</text></g><line x1="25" y1="82" x2="410" y2="82" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-4"><text x="32" y="85.7" font-size="2.5" text-anchor="middle" fill="#000">К-4</text><text x="40.5" y="85.7" font-size="2.5" fill="#000">Разрешённая мощность квартиры по ТУ неизвестна, принята 15 кВт.</text><text x="206.5" y="85.7" font-size="2.5" fill="#000">Отсутствует</text><text x="236.5" y="85.7" font-size="2.5" fill="#000">Инженер-электрик</text><text x="272.5" y="85.7" font-size="2.5" fill="#000">щит и группы рассчитаны на 15 кВт; при меньших ТУ</text><text x="272.5" y="89.1" font-size="2.5" fill="#000">пересчёт</text><text x="349.5" y="85.7" font-size="2.5" fill="#000">л. 33 — Однолинейная схема щита</text><text x="349.5" y="89.1" font-size="2.5" fill="#000">л. 29 — План розеток и электровыводов</text></g><line x1="25" y1="92.2" x2="410" y2="92.2" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-5"><text x="32" y="95.9" font-size="2.5" text-anchor="middle" fill="#000">К-5</text><text x="40.5" y="95.9" font-size="2.5" fill="#000">Кухня-гостиная (пом. 3): диван М1 2200 × 950 стоит в полосе 1400 мм между спальней и кухней — единственном проходе от двери из</text><text x="40.5" y="99.3" font-size="2.5" fill="#000">коридора в комнату; за спинкой остаётся щель 290 мм, в выпуске для заказчика это ошибка. Полоса годится только под проход и</text><text x="40.5" y="102.7" font-size="2.5" fill="#000">неглубокую мебель (до 700 мм). В основной части (2700 × 2900 мм) диван, обеденная группа на 4 места, рабочее место С4 и кресло</text><text x="40.5" y="106.1" font-size="2.5" fill="#000">М3 вместе с проходами не помещаются. Нужно решение по составу зоны: (1) диван в основную часть лицом к ТВ на стене Г,</text><text x="40.5" y="109.5" font-size="2.5" fill="#000">обеденный стол — в нишу у колонны М8, рабочее место С4 — в спальню или детскую; (2) диван двухместный 1600 мм у стены</text><text x="40.5" y="112.9" font-size="2.5" fill="#000">спальни в основной части; (3) вместо обеденной группы — барная стойка. До решения расстановка кухни-гостиной не годится для</text><text x="40.5" y="116.3" font-size="2.5" fill="#000">заказа мебели. Решение исполнителя (ИЗ-1, 30.10.2026, на утверждение автора): вариант 1 без переноса рабочего места — диван</text><text x="40.5" y="119.7" font-size="2.5" fill="#000">М1 у стены А основной части (x 250…2450, y 1650…2600), обеденный стол М2 перед ним (x 1100…2100, y 2800…3800), кресло М3 у</text><text x="40.5" y="123.1" font-size="2.5" fill="#000">окна 2 (x 400…1150, y 3700…4450), ТВ остаётся на стене Г; полоса 1400 у спальни свободна под проход; части 2–4 помещения</text><text x="40.5" y="126.5" font-size="2.5" fill="#000">перекроены (кухонный ряд и ниша — одна часть) без изменения контура. Стыки частей ≥ 700 мм.</text><text x="206.5" y="95.9" font-size="2.5" fill="#000">Спорно</text><text x="206.5" y="99.3" font-size="2.5" fill="#000">Ждёт: решения</text><text x="236.5" y="95.9" font-size="2.5" fill="#000">Дизайнер интерьера</text><text x="272.5" y="95.9" font-size="2.5" fill="#000">расстановка М1, М2, М3 остаётся предложением со знаком</text><text x="272.5" y="99.3" font-size="2.5" fill="#000">«**»: мебель кухни-гостиной не заказывать до подписи ИЗ-1</text><text x="349.5" y="95.9" font-size="2.5" fill="#000">л. 25 — План расстановки мебели</text></g><line x1="25" y1="129.6" x2="410" y2="129.6" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-6"><text x="32" y="133.3" font-size="2.5" text-anchor="middle" fill="#000">К-6</text><text x="40.5" y="133.3" font-size="2.5" fill="#000">Спальня (пом. 2) без окна (К-3): приток не решён — бризер на внутренней стене Б не работает (нужно отверстие в наружной стене),</text><text x="40.5" y="136.7" font-size="2.5" fill="#000">а наружная стена А занята изголовьем кровати С1 (бризер над кроватью — холодный поток на спящего). Радиатор Р-2 оставлен на</text><text x="40.5" y="140.1" font-size="2.5" fill="#000">стене Б у двери. После решения по окну: бризер или клапан — у окна, радиатор — под окно; если помещение станет нежилым</text><text x="40.5" y="143.5" font-size="2.5" fill="#000">приток не нужен.</text><text x="206.5" y="133.3" font-size="2.5" fill="#000">Решение</text><text x="236.5" y="133.3" font-size="2.5" fill="#000">Инженер ОВ</text><text x="272.5" y="133.3" font-size="2.5" fill="#000">приток в спальню не обеспечен: на плане вентиляции</text><text x="272.5" y="136.7" font-size="2.5" fill="#000">«!» в графе притока; радиатор Р-2 — на стене Б</text><text x="349.5" y="133.3" font-size="2.5" fill="#000">л. 37 — План вентиляции</text><text x="349.5" y="136.7" font-size="2.5" fill="#000">л. 38 — План отопления</text></g><line x1="25" y1="146.6" x2="410" y2="146.6" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-7"><text x="32" y="150.3" font-size="2.5" text-anchor="middle" fill="#000">К-7</text><text x="40.5" y="150.3" font-size="2.5" fill="#000">Вентканалы на плане заказчика не показаны: ВК-1 и ВК-2 приняты проектировщиком у кухни, ванная (пом. 7) от них далеко</text><text x="40.5" y="153.7" font-size="2.5" fill="#000">вытяжка ВР3 идёт воздуховодом ≈ 4 м через санузел. Замерить положение и сечение каналов; если канал у ванной есть — решётку</text><text x="40.5" y="157.1" font-size="2.5" fill="#000">в его стенку, воздуховод не нужен.</text><text x="206.5" y="150.3" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="153.7" font-size="2.5" fill="#000">Ждёт: обмера</text><text x="236.5" y="150.3" font-size="2.5" fill="#000">Инженер ОВ</text><text x="272.5" y="150.3" font-size="2.5" fill="#000">вытяжка ванной — вентилятором с обратным клапаном и</text><text x="272.5" y="153.7" font-size="2.5" fill="#000">воздуховодом под потолком до ВК-2; места решёток — до</text><text x="272.5" y="157.1" font-size="2.5" fill="#000">обмера</text><text x="349.5" y="150.3" font-size="2.5" fill="#000">л. 37 — План вентиляции</text></g></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">13.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-007-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Квартира 65 м²</text><text x="297" y="259.2" font-size="2.5" data-fit="116" fill="#000">Общая площадь 65,24* м² · * размеры со скана, не замерены (реестр — л. 6–8, К-1)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" data-fit="66" fill="#000">Дизайн-проект интерьера</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">6</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">117</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="283.1" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">Открытые вопросы, принятые допущения и</text><text x="330" y="286.9" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">конфликты. Лист 1 из 3</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="47" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="14" data-positions="40" data-basis="5"><rect x="314.27" y="6.2" width="99.23" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="316.27" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 14 (реестр — л. 6–8)</text></g></svg>
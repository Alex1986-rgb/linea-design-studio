114.91" lengthAdjust="spacingAndGlyphs" fill="#000">Стул обеденный к столу С8; обивка — ткань, цвет NCS S 1500-N; каркас — дуб натуральный; Ш×Г×В 450×500×820 мм</text><text x="266.5" y="51.3" font-size="2.5" text-anchor="start" fill="#000">аналог по характеристикам</text><text x="320" y="51.3" font-size="2.5" text-anchor="middle" fill="#000">шт.</text><text x="340" y="51.3" font-size="2.5" text-anchor="middle" fill="#000">2</text><text x="376.5" y="51.3" font-size="2.5" text-anchor="start" fill="#000">пом. 9; замена ≤ габарита</text></g><line x1="20" y1="59" x2="415" y2="59" stroke="#000" stroke-width="0.18"/><g data-el="spec-section"><text x="105" y="57.8" font-size="2.5" text-anchor="middle" font-weight="700" text-decoration="underline" fill="#000">Техника встраиваемая и бытовая, светильники под розетки</text></g><line x1="20" y1="65" x2="415" y2="65" stroke="#000" stroke-width="0.18"/><g><text x="41.5" y="63.3" font-size="2.5" text-anchor="start" fill="#000">Варочная панель встраиваемая, электрическая, в модуле М5</text><text x="266.5" y="63.3" font-size="2.5" text-anchor="start" fill="#000">аналог по характеристикам</text><text x="320" y="63.3" font-size="2.5" text-anchor="middle" fill="#000">шт.</text><text x="340" y="63.3" font-size="2.5" text-anchor="middle" fill="#000">1</text><text x="376.5" y="63.3" font-size="2.5" text-anchor="start" fill="#000">пом. 3; по схеме изготовителя</text></g><line x1="20" y1="71" x2="415" y2="71" stroke="#000" stroke-width="0.18"/><g><text x="41.5" y="69.3" font-size="2.5" text-anchor="start" fill="#000">Холодильник, в модуле М8</text><text x="266.5" y="69.3" font-size="2.5" text-anchor="start" fill="#000">аналог по характеристикам</text><text x="320" y="69.3" font-size="2.5" text-anchor="middle" fill="#000">шт.</text><text x="340" y="69.3" font-size="2.5" text-anchor="middle" fill="#000">1</text><text x="376.5" y="69.3" font-size="2.5" text-anchor="start" fill="#000">пом. 3; по схеме изготовителя</text></g><line x1="20" y1="77" x2="415" y2="77" stroke="#000" stroke-width="0.18"/><g><text x="41.5" y="75.3" font-size="2.5" text-anchor="start" fill="#000">Стиральная машина, место по листу ВК (П22); Ш×Г 600×600 мм</text><text x="266.5" y="75.3" font-size="2.5" text-anchor="start" fill="#000">аналог по характеристикам</text><text x="320" y="75.3" font-size="2.5" text-anchor="middle" fill="#000">шт.</text><text x="340" y="75.3" font-size="2.5" text-anchor="middle" fill="#000">1</text><text x="376.5" y="75.3" font-size="2.5" text-anchor="start" fill="#000">пом. 7; по схеме изготовителя</text></g><line x1="20" y1="86.4" x2="415" y2="86.4" stroke="#000" stroke-width="0.18"/><g><text x="41.5" y="81.3" font-size="2.5" text-anchor="start" fill="#000">Торшер, у поз. М3; абажур — ткань или опаловое стекло; лампа 3000 K</text><text x="266.5" y="81.3" font-size="2.5" text-anchor="start" fill="#000">аналог по характеристикам</text><text x="320" y="81.3" font-size="2.5" text-anchor="middle" fill="#000">шт.</text><text x="340" y="81.3" font-size="2.5" text-anchor="middle" fill="#000">1</text><text x="376.5" y="81.3" font-size="2.5" text-anchor="start" fill="#000">пом. 3; розетка — по плану</text><text x="376.5" y="84.7" font-size="2.5" text-anchor="start" fill="#000">розеток (ЭОМ)</text></g><line x1="20" y1="92.4" x2="415" y2="92.4" stroke="#000" stroke-width="0.18"/><g data-el="spec-section"><text x="105" y="91.2" font-size="2.5" text-anchor="middle" font-weight="700" text-decoration="underline" fill="#000">Текстиль</text></g><line x1="20" y1="98.4" x2="415" y2="98.4" stroke="#000" stroke-width="0.18"/><g><text x="30" y="96.7" font-size="2.5" text-anchor="middle" fill="#000">Т7</text><text x="41.5" y="96.7" font-size="2.5" text-anchor="start" fill="#000">Портьеры-волна; лён 100 %; цвет Tikkurila H487; карниз 1820 мм, высота 2610 мм, сборка 2</text><text x="266.5" y="96.7" font-size="2.5" text-anchor="start" fill="#000">аналог по характеристикам</text><text x="320" y="96.7" font-size="2.5" text-anchor="midd
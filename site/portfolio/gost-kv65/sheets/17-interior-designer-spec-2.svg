 характеристикам</text><text x="320" y="114.7" font-size="2.5" text-anchor="middle" fill="#000">шт.</text><text x="340" y="114.7" font-size="2.5" text-anchor="middle" fill="#000">3</text><text x="376.5" y="114.7" font-size="2.5" text-anchor="start" fill="#000">пом. 9</text></g><line x1="20" y1="122.4" x2="415" y2="122.4" stroke="#000" stroke-width="0.18"/><g><text x="30" y="120.7" font-size="2.5" text-anchor="middle" fill="#000">Т11</text><text x="41.5" y="120.7" font-size="2.5" text-anchor="start" fill="#000">Подушки на кровать, акцент; хлопковый бархат 100 %; цвет Farrow &amp; Ball No. 47</text><text x="266.5" y="120.7" font-size="2.5" text-anchor="start" fill="#000">аналог по характеристикам</text><text x="320" y="120.7" font-size="2.5" text-anchor="middle" fill="#000">шт.</text><text x="340" y="120.7" font-size="2.5" text-anchor="middle" fill="#000">2</text><text x="376.5" y="120.7" font-size="2.5" text-anchor="start" fill="#000">пом. 9</text></g><line x1="20" y1="128.4" x2="415" y2="128.4" stroke="#000" stroke-width="0.18"/><g><text x="30" y="126.7" font-size="2.5" text-anchor="middle" fill="#000">Т12</text><text x="41.5" y="126.7" font-size="2.5" text-anchor="start" fill="#000">Плед на кровать; шерсть мериноса 100 %; цвет Farrow &amp; Ball No. 30</text><text x="266.5" y="126.7" font-size="2.5" text-anchor="start" fill="#000">аналог по характеристикам</text><text x="320" y="126.7" font-size="2.5" text-anchor="middle" fill="#000">шт.</text><text x="340" y="126.7" font-size="2.5" text-anchor="middle" fill="#000">1</text><text x="376.5" y="126.7" font-size="2.5" text-anchor="start" fill="#000">пом. 9</text></g><line x1="20" y1="134.4" x2="415" y2="134.4" stroke="#000" stroke-width="0.18"/><g data-el="spec-section"><text x="105" y="133.2" font-size="2.5" text-anchor="middle" font-weight="700" text-decoration="underline" fill="#000">Декор</text></g><line x1="20" y1="140.4" x2="415" y2="140.4" stroke="#000" stroke-width="0.18"/><g><text x="30" y="138.7" font-size="2.5" text-anchor="middle" fill="#000">ДК3</text><text x="41.5" y="138.7" font-size="2.5" text-anchor="start" fill="#000">Картина над кроватью: графика в паспарту, рама — дуб; 1000×700 мм; низ на 1300 мм от пола</text><text x="266.5" y="138.7" font-size="2.5" text-anchor="start" fill="#000">аналог по характеристикам</text><text x="320" y="138.7" font-size="2.5" text-anchor="middle" fill="#000">шт.</text><text x="340" y="138.7" font-size="2.5" text-anchor="middle" fill="#000">1</text><text x="362.5" y="138.7" font-size="2.5" text-anchor="middle" fill="#000">4</text><text x="376.5" y="138.7" font-size="2.5" text-anchor="start" fill="#000">пом. 9; крепление к стене</text></g><g><text x="30" y="144.7" font-size="2.5" text-anchor="middle" fill="#000">ДК4</text><text x="41.5" y="144.7" font-size="2.5" text-anchor="start" fill="#000">Зеркало в рост в тонкой чёрной раме; рама — чёрный матовый; 600×1600 мм; низ на 300 мм от пола</text><text x="266.5" y="144.7" font-size="2.5" text-anchor="start" fill="#000">аналог по характеристикам</text><text x="320" y="144.7" font-size="2.5" text-anchor="middle" fill="#000">шт.</text><text x="340" y="144.7" font-size="2.5" text-anchor="middle" fill="#000">1</text><text x="362.5" y="144.7" font-size="2.5" text-anchor="middle" fill="#000">12</text><text x="376.5" y="144.7" font-size="2.5" text-anchor="start" fill="#000">пом. 9; крепление: анкер для</text><text x="376.5" y="148.1" font-size="2.5" text-anchor="start" fill="#000">пустотелых оснований, 4 шт.</text></g></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4" data-level="0"><text x="25.5" y="275.5" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">Основа листа: размеры сняты с растрового плана заказчика без размеров: масштаб восстановлен по площадям помещений (≈ 11,8 мм на пиксель), контрольный обмер не выполнен</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">(К-1); высота п
 fill="#000">ДК4 — Детская (пом. 9), стена Г (М 1:50)</text><rect x="131.8" y="65.6" width="60" height="50" fill="#F7F5F1"/><path d="M 130.3 115.6 L 193.3 115.6" stroke="#000" stroke-width="0.5"/><path d="M 131.8 65.6 L 191.8 65.6" stroke="#000" stroke-width="0.35"/><path d="M 131.8 115.6 L 131.8 65.6" stroke="#000" stroke-width="0.35"/><path d="M 191.8 115.6 L 191.8 65.6" stroke="#000" stroke-width="0.35"/><g data-el="decor-item" data-item="ДК4"><rect x="176.8" y="77.6" width="12" height="32" fill="#D3E1E7" stroke="#4F6D7A" stroke-width="0.35"/><path d="M 178.8 77.6 L 176.8 79.6 M 181 77.6 L 176.8 81.8 M 183.2 77.6 L 176.8 84 M 185.4 77.6 L 176.8 86.2 M 187.6 77.6 L 176.8 88.4 M 188.8 78.6 L 176.8 90.6 M 188.8 80.8 L 176.8 92.8 M 188.8 83 L 176.8 95 M 188.8 85.2 L 176.8 97.2 M 188.8 87.4 L 176.8 99.4 M 188.8 89.6 L 176.8 101.6 M 188.8 91.8 L 176.8 103.8 M 188.8 94 L 176.8 106 M 188.8 96.2 L 176.8 108.2 M 188.8 98.4 L 177.6 109.6 M 188.8 100.6 L 179.8 109.6 M 188.8 102.8 L 182 109.6 M 188.8 105 L 184.2 109.6 M 188.8 107.2 L 186.4 109.6 M 188.8 109.4 L 188.6 109.6 " fill="none" stroke="#7F9AA5" stroke-width="0.18"/><path d="M 181.3 93.6 L 184.3 93.6 M 182.8 92.1 L 182.8 95.1" stroke="#000" stroke-width="0.25"/><line x1="176.2" y1="93.6" x2="181.3" y2="93.6" stroke="#000" stroke-width="0.18"/><text x="175.6" y="94.5" font-size="2.5" text-anchor="end" fill="#000">ц 1100</text></g><g data-el="dims"><line x1="131.8" y1="116.6" x2="131.8" y2="124.6" stroke="#000" stroke-width="0.25"/><line x1="130.74" y1="123.66" x2="132.86" y2="121.54" stroke="#000" stroke-width="0.5"/><line x1="176.8" y1="116.6" x2="176.8" y2="124.6" stroke="#000" stroke-width="0.25"/><line x1="175.74" y1="123.66" x2="177.86" y2="121.54" stroke="#000" stroke-width="0.5"/><line x1="188.8" y1="116.6" x2="188.8" y2="124.6" stroke="#000" stroke-width="0.25"/><line x1="187.74" y1="123.66" x2="189.86" y2="121.54" stroke="#000" stroke-width="0.5"/><line x1="131.8" y1="122.6" x2="188.8" y2="122.6" stroke="#000" stroke-width="0.25"/><text x="154.3" y="121.6" font-size="2.5" text-anchor="middle" fill="#000">2250</text><text x="182.8" y="121.6" font-size="2.5" text-anchor="middle" fill="#000">600</text><line x1="192.8" y1="115.6" x2="200.8" y2="115.6" stroke="#000" stroke-width="0.25"/><line x1="192.8" y1="109.6" x2="200.8" y2="109.6" stroke="#000" stroke-width="0.25"/><line x1="198.8" y1="115.6" x2="198.8" y2="109.6" stroke="#000" stroke-width="0.25"/><line x1="197.74" y1="116.66" x2="199.86" y2="114.54" stroke="#000" stroke-width="0.5"/><line x1="197.74" y1="110.66" x2="199.86" y2="108.54" stroke="#000" stroke-width="0.5"/><text x="197.8" y="113.6" font-size="2.5" text-anchor="middle" transform="rotate(-90 197.8 113.6)" fill="#000">300</text><line x1="192.8" y1="109.6" x2="200.8" y2="109.6" stroke="#000" stroke-width="0.25"/><line x1="192.8" y1="77.6" x2="200.8" y2="77.6" stroke="#000" stroke-width="0.25"/><line x1="198.8" y1="109.6" x2="198.8" y2="77.6" stroke="#000" stroke-width="0.25"/><line x1="197.74" y1="110.66" x2="199.86" y2="108.54" stroke="#000" stroke-width="0.5"/><line x1="197.74" y1="78.66" x2="199.86" y2="76.54" stroke="#000" stroke-width="0.5"/><text x="197.8" y="93.6" font-size="2.5" text-anchor="middle" transform="rotate(-90 197.8 93.6)" fill="#000">1600</text></g></g><g data-el="notes"><text x="25" y="262.4" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="267.4" font-size="2.5" fill="#000">1. Высоты — от чистого пола помещения до низа изделия, «ц» — до центра; привязки — от чистовой грани угла стены, мм.</text><text x="25" y="271" font-size="2.5" fill="#000">2. Над мебелью низ изделия — на 150–250 мм выше спинки или изголовья; без мебели центр — на 1450–1600 мм от пола.</text><text x="25" y="274.6" font-size="2.5" fill="#000">3. Изделия до 5 кг — на два подвеса по основанию; тяжелее — на анкеры с нагрузкой не меньше двойной массы; на ГКЛ — только по закладной или анкеру для</text><text x="25" y="278.2" font-size="2.5" fill="#000">пустотелых оснований.</text><text x="25" y="281.8" font-size="2.5" fill="#000">4. Зеркала в рост — с креплением от опрокидывания; в санузлах — влагостойкие, на клей для зеркал и нейтральный силикон.</text><text x="25" y="285.4" font-size="2.5" fill="#000">5. Места изделий — план текстиля и декора (лист 60).</text></g><g data-el="legend"><rect x="298" y="22" width="8" height="4" fill="#E9DDCB" stroke="#5E4630" stroke-width="0.35"/><text x="308" y="24.9" font-size="2.5" fill="#000">картина</text><rect x="332" y="22" width="8" height="4" fill="#D3E1E7" stroke="#4F6D7A" stroke-width="0.35"/><text x="342" y="24.9" font-size="2.5" fill="#000">зеркало</text><rect x="366" y="22" width="8" height="4" fill="#fff" stroke="#6b6b6b" stroke-width="0.25"/><text x="376" y="24.9" font-size="2.5" fill="#000">мебель под изделием</text></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4 К-9" data-level="0"><text x="25.5" y="242" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="245.4" font-size="2.5" fill="#000">Основа листа: размеры сняты с растрового плана заказчика без размеров: масштаб восстановлен по площадям помещений (≈ 11,8 мм на пиксель), контрольный обмер не выполнен</text><text x="25.5" y="248.8" font-size="2.5" fill="#000">(К-1); высота потолка 2700 мм принята: на плане заказчика её нет (К-2); толщины стен 300 / 120 мм приняты по плану заказчика, не замерены (К-1); разрешённая мощность 15 кВт</text><text x="25.5" y="252.2" font-size="2.5" fill="#000">принята по типовым ТУ для квартиры, ТУ заказчиком не переданы (К-4); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-9).</text><text x="25.5" y="255.6" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1, К-2, К-4, К-9).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size
ta-deviation="room-circle-8"/><g data-el="general-ref"><text x="25" y="290.2" font-size="2.5" textLength="182.41" lengthAdjust="spacingAndGlyphs" data-fit="203" fill="#000">Общие указания — лист 5: ±0,000 — чистый пол; несущие конструкции и сети дома — по отдельному проекту; скрытые работы — по актам. Открытые вопросы и допущения — листы 6–8.</text><g data-el="open-issues-ref" data-target="6"/></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4 К-9" data-level="0"><text x="25.5" y="271" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="274.4" font-size="2.5" fill="#000">Основа листа: размеры сняты с растрового плана заказчика без размеров: масштаб восстановлен по площадям помещений (≈ 11,8 мм на пиксель), контрольный обмер не выполнен</text><text x="25.5" y="277.8" font-size="2.5" fill="#000">(К-1); высота потолка 2700 мм принята: на плане заказчика её нет (К-2); толщины стен 300 / 120 мм приняты по плану заказчика, не замерены (К-1); разрешённая мощность 15 кВт</text><text x="25.5" y="281.2" font-size="2.5" fill="#000">принята по типовым ТУ для квартиры, ТУ заказчиком не переданы (К-4); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-9).</text><text x="25.5" y="284.6" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1, К-2, К-4; лист 7, запись К-9).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="
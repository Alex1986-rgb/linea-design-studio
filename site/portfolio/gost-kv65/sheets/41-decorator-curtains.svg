roke-width="0.25"/><text x="35" y="161.3" font-size="2.5" fill="#000">портьеры в открытом положении</text><rect x="105" y="158.4" width="8" height="4" fill="#EEEEE9" fill-opacity="0.45" stroke="#9B9B97" stroke-width="0.18"/><text x="115" y="161.3" font-size="2.5" fill="#000">тюль (на виде окна — прозрачная плашка)</text><rect x="25" y="163.9" width="8" height="4" fill="none" stroke="#6B645C" stroke-width="0.25" stroke-dasharray="1.6 0.8"/><rect x="25" y="163.9" width="8" height="1.5" fill="#C3B6A7" stroke="#6B645C" stroke-width="0.25"/><text x="35" y="166.8" font-size="2.5" fill="#000">римская штора: сложена / опущена</text><path d="M 105 165.9 L 113 165.9" stroke="#5B4A38" stroke-width="0.7"/><text x="115" y="166.8" font-size="2.5" fill="#000">шина или карниз на отметке верха</text><path d="M 25 171.4 L 33 171.4" fill="none" stroke="#000" stroke-width="0.25" stroke-dasharray="1.6 0.8"/><text x="35" y="172.3" font-size="2.5" fill="#000">верх ниши под шторы в потолке</text><rect x="105" y="169.4" width="8" height="4" fill="#E8EEF1" stroke="#000" stroke-width="0.35"/><text x="115" y="172.3" font-size="2.5" fill="#000">оконный проём</text></g><g data-el="notes"><text x="25" y="241" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="246" font-size="2.5" fill="#000">1. Отметки — от чистого пола помещения; размеры — мм. Длины полотен уточняются замером после чистовой отделки пола и потолка, до раскроя.</text><text x="25" y="249.6" font-size="2.5" fill="#000">2. Карнизы — на анкеры по основанию; на ГКЛ — только по закладной.</text><text x="25" y="253.2" font-size="2.5" fill="#000">3. Полотно портьер «парит» над полом на 10 мм; сборка портьер — 2,0, тюля — 2,5 (ширина полотна — в ведомости текстиля).</text><text x="25" y="256.8" font-size="2.5" fill="#000">4. Электрокарнизы не предусмотрены; при замене на электропривод — вывод кабеля в нише у края шины (задание электрику).</text><text x="25" y="260.4" font-size="2.5" fill="#000">5. Марки изделий — по плану текстиля и декора (лист 40) и ведомости текстиля (лист 42).</text></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4" data-level="0"><text x="25.5" y="275.5" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">Основа листа: размеры сняты с растрового плана заказчика без размеров: масштаб восстановлен по площадям помещений (≈ 11,8 мм на пиксель), контрольный обмер не выполнен</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">(К-1); высота потолка 2700 мм принята: на плане заказчика её нет (К-2); толщины стен 300 / 120 мм приняты по плану заказчика, не замерены (К-1); разрешённая мощность 15 кВт</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">принята по типовым ТУ для квартиры, ТУ заказчиком не переданы (К-4).</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 5, записи К-1, К-2, К-4).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-wid
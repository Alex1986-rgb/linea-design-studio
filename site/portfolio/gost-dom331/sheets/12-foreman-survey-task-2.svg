<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Задание на контрольный обмер и обследование. Лист 2 из 4" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Задание на контрольный обмер и обследование. Лист 2 из 4</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Что замерить, вскрыть и получить до заказа материалов и изделий</text><g data-el="survey-task" data-plan="fixed" data-plan-declared="4"><g data-el="survey-field"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Этап 1. До демонтажа (продолжение)</text><rect x="25" y="33" width="385" height="101.8" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="31" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="37" y1="33" x2="37" y2="134.8" stroke="#000" stroke-width="0.25"/><text x="62" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Где</text><line x1="87" y1="33" x2="87" y2="134.8" stroke="#000" stroke-width="0.25"/><text x="97" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Способ</text><line x1="107" y1="33" x2="107" y2="134.8" stroke="#000" stroke-width="0.25"/><text x="148" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Что сделать</text><line x1="189" y1="33" x2="189" y2="134.8" stroke="#000" stroke-width="0.25"/><text x="208" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Кто выполняет</text><line x1="227" y1="33" x2="227" y2="134.8" stroke="#000" stroke-width="0.25"/><text x="240" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Точность</text><line x1="253" y1="33" x2="253" y2="134.8" stroke="#000" stroke-width="0.25"/><text x="288" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Что пересчитается в альбоме</text><line x1="323" y1="33" x2="323" y2="134.8" stroke="#000" stroke-width="0.25"/><text x="344" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Чем подтверждается</text><line x1="365" y1="33" x2="365" y2="134.8" stroke="#000" stroke-width="0.25"/><text x="387.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Закрывает вопросы реестра</text><g data-el="survey-row" data-id="О-5" data-key="vysota-potolka" data-closes="К-2" data-method="measure" data-covers="basis:ceiling"><text x="31" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">О-5</text><text x="38.5" y="46.7" font-size="2.5" fill="#000">Все помещения квартиры</text><text x="88.5" y="46.7" font-size="2.5" fill="#000">Обмер</text><text x="108.5" y="46.7" font-size="2.5" fill="#000">Высота потолка в каждом помещении в нескольких точках:</text><text x="108.5" y="50.1" font-size="2.5" fill="#000">центр, углы, у проёмов.</text><text x="190.5" y="46.7" font-size="2.5" fill="#000">Архитектор</text><text x="228.5" y="46.7" font-size="2.5" fill="#000">±5 мм</text><text x="254.5" y="46.7" font-size="2.5" fill="#000">Вертикальные размеры альбома: развёртки, шкафы,</text><text x="254.5" y="50.1" font-size="2.5" fill="#000">плитка, объёмы работ.</text><text x="254.5" y="53.5" font-size="2.5" fill="#000">Листы:</text><text x="254.5" y="56.9" font-size="2.5" fill="#000">л. 2–7 — Общие данные</text><text x="324.5" y="46.7" font-size="2.5" fill="#000">акт контрольного обмера</text><text x="366.5" y="46.7" font-size="2.5" fill="#000">К-2</text><text x="366.5" y="50.1" font-size="2.5" fill="#000">Результат принимает: Архитектор</text></g><line x1="25" y1="60" x2="410" y2="60" stroke="#000" stroke-width="0.25"/><g data-el="survey-row" data-id="О-6" data-key="stair-floor-height" data-closes="К-6" data-method="measure" data-covers=""><text x="31" y="63.7" font-size="2.5" text-anchor="middle" fill="#000">О-6</text><text x="38.5" y="63.7" font-size="2.5" fill="#000">холл с лестницей / холл мансарды</text><text x="88.5" y="63.7" font-size="2.5" fill="#000">Обмер</text><text x="108.5" y="63.7" font-size="2.5" fill="#000">Разность отметок чистых полов 1-го этажа и мансарды, толщина</text><text x="108.5" y="67.1" font-size="2.5" fill="#000">перекрытия, положение и размеры проёма над маршем (по</text><text x="108.5" y="70.5" font-size="2.5" fill="#000">проекту КР или по факту).</text><text x="190.5" y="63.7" font-size="2.5" fill="#000">исполнитель</text><text x="228.5" y="63.7" font-size="2.5" fill="#000"></text><text x="254.5" y="63.7" font-size="2.5" fill="#000" textLength="47.04" lengthAdjust="spacingAndGlyphs">лист «Лестница Л-1*», планы этажей, ведомость</text><text x="254.5" y="67.1" font-size="2.5" fill="#000">ограждений</text><text x="254.5" y="70.5" font-size="2.5" fill="#000">Листы:</text><text x="254.5" y="73.9" font-size="2.5" fill="#000">architect/stairs-л-1 (лист по названию не найден)</text><text x="324.5" y="63.7" font-size="2.5" fill="#000"></text><text x="366.5" y="63.7" font-size="2.5" fill="#000">К-6</text><text x="366.5" y="67.1" font-size="2.5" fill="#000">Результат принимает: Архитектор</text></g><line x1="25" y1="77" x2="410" y2="77" stroke="#000" stroke-width="0.25"/><g data-el="survey-row" data-id="О-7" data-key="osnova-climate" data-closes="К-7" data-method="measure" data-covers="basis:climate"><text x="31" y="80.7" font-size="2.5" text-anchor="middle" fill="#000">О-7</text><text x="38.5" y="80.7" font-size="2.5" fill="#000">По месту</text><text x="88.5" y="80.7" font-size="2.5" fill="#000">Обмер</text><text x="108.5" y="80.7" font-size="2.5" fill="#000">Подтвердить на объекте принятое: подрайон климата не задан</text><text x="108.5" y="84.1" font-size="2.5" fill="#000">— принят не северный (жилые от 2,5 м)</text><text x="190.5" y="80.7" font-size="2.5" fill="#000">Архитектор</text><text x="228.5" y="80.7" font-size="2.5" fill="#000">±5 мм</text><text x="254.5" y="80.7" font-size="2.5" fill="#000">Листы, где используется принятая величина.</text><text x="254.5" y="84.1" font-size="2.5" fill="#000">Листы:</text><text x="254.5" y="87.5" font-size="2.5" fill="#000">л. 2–7 — Общие данные</text><text x="324.5" y="80.7" font-size="2.5" fill="#000">акт контрольного обмера</text><text x="366.5" y="80.7" font-size="2.5" fill="#000">К-7</text><text x="366.5" y="84.1" font-size="2.5" fill="#000">Результат принимает: Архитектор</text></g><line x1="25" y1="90.6" x2="410" y2="90.6" stroke="#000" stroke-width="0.25"/><g data-el="survey-row" data-id="О-8" data-key="ventkanaly" data-closes="К-12" data-method="measure" data-covers=""><text x="31" y="94.3" font-size="2.5" text-anchor="middle" fill="#000">О-8</text><text x="38.5" y="94.3" font-size="2.5" fill="#000">санузел, ванная, кухня</text><text x="88.5" y="94.3" font-size="2.5" fill="#000">Обмер</text><text x="108.5" y="94.3" font-size="2.5" fill="#000">Положение и сечение вентканалов (вентблока), тяга.</text><text x="190.5" y="94.3" font-size="2.5" fill="#000">исполнитель</text><text x="228.5" y="94.3" font-size="2.5" fill="#000">±10 мм</text><text x="254.5" y="94.3" font-size="2.5" fill="#000">план вентиляции, потолки, короба</text><text x="254.5" y="97.7" font-size="2.5" fill="#000">Листы:</text><text x="254.5" y="101.1" font-size="2.5" fill="#000">л. 52, 53 — План вентиляции</text><text x="254.5" y="104.5" font-size="2.5" fill="#000">л. 19, 21, 23, 28, 30, 37, 39, 41, 48, 50, 52, 54, 56, 58,</text><text x="254.5" y="107.9" font-size="2.5" fill="#000">64, 65, 73, 85, 88, 100, 108, 127, 140–142 — 1-й этаж</text><text x="324.5" y="94.3" font-size="2.5" fill="#000">акт контрольного обмера</text><text x="366.5" y="94.3" font-size="2.5" fill="#000">К-12</text><text x="366.5" y="97.7" font-size="2.5" fill="#000">Результат принимает: Инженер</text><text x="366.5" y="101.1" font-size="2.5" fill="#000">ОВ</text></g><line x1="25" y1="111" x2="410" y2="111" stroke="#000" stroke-width="0.25"/><g data-el="survey-row" data-id="О-9" data-key="veranda-slab" data-closes="К-13" data-method="measure" data-covers=""><text x="31" y="114.7" font-size="2.5" text-anchor="middle" fill="#000">О-9</text><text x="38.5" y="114.7" font-size="2.5" fill="#000">веранда (пом. 11), крыльцо (пом. 12)</text><text x="88.5" y="114.7" font-size="2.5" fill="#000">Обмер</text><text x="108.5" y="114.7" font-size="2.5" fill="#000">Отметка верха плиты веранды и крыльца от ±0,000 дома</text><text x="108.5" y="118.1" font-size="2.5" fill="#000">(нивелиром), конструкция плиты.</text><text x="190.5" y="114.7" font-size="2.5" fill="#000">исполнитель</text><text x="228.5" y="114.7" font-size="2.5" fill="#000">±5 мм</text><text x="254.5" y="114.7" font-size="2.5" fill="#000">экспликация полов, ведомость объёмов</text><text x="254.5" y="118.1" font-size="2.5" fill="#000">Листы:</text><text x="254.5" y="121.5" font-size="2.5" fill="#000">л. 88, 89 — План полов</text><text x="254.5" y="124.9" font-size="2.5" fill="#000">л. 19, 21, 23, 28, 30, 37, 39, 41, 48, 50, 52, 54, 56, 58,</text><text x="254.5" y="128.3" font-size="2.5" fill="#000">64, 65, 73, 85, 88, 100, 108, 127, 140–142 — 1-й этаж</text><text x="254.5" y="131.7" font-size="2.5" fill="#000">л. 19, 20 — Обмерный план</text><text x="324.5" y="114.7" font-size="2.5" fill="#000">акт контрольного обмера</text><text x="366.5" y="114.7" font-size="2.5" fill="#000">К-13</text><text x="366.5" y="118.1" font-size="2.5" fill="#000">Результат принимает: Архитектор</text></g></g></g><g data-el="assumed-notes" data-flags="stair:Л-1" data-ids="К-1 К-2 К-4 К-6 К-7" data-level="0"><text x="25.5" y="265.3" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="268.7" font-size="2.5" fill="#000">Основа листа: размеры и контуры этажей подобраны проектировщиком по составу помещений и площадям этажей с картинки 470 px (размеры на ней не читаются); обмер и исходный</text><text x="25.5" y="272.1" font-size="2.5" fill="#000">проект — задание (К-1); высоты: 1-й этаж 2800 мм, мансарда 2700 мм (горизонтальная часть) приняты; скаты кровли мансарды приняты по картинке: колено 1200 мм, уклон 45°, конёк</text><text x="25.5" y="275.5" font-size="2.5" fill="#000">вдоль длинной стороны; проект КР — задание (К-2); наружные стены 400 мм, перегородки 120 мм приняты (К-1); разрешённая мощность 15 кВт принята по типовым ТУ для частного</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">дома (К-4); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-7).</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">Знак «*» — принято, не замерено и не подтверждено (замерить на объекте): К-6: Л-1 — габарит марша снят с картинки заказчика (11 проступей в холле 3,6 м), а до отм. +3,150 нужно</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">18 подъёмов — одномаршевая не встаёт: решение по К-6.</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 8, записи К-1, К-2, К-4, К-6, К-7).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="
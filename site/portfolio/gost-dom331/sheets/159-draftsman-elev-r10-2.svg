e="#000" stroke-width="0.5"/><line x1="358.94" y1="158.62" x2="361.06" y2="156.5" stroke="#000" stroke-width="0.5"/><text x="342" y="156.66" font-size="2.5" text-anchor="middle" fill="#000">900</text></g><g data-a="r10B3000u6785" data-b="r10B3000u6970" data-dir="h"><line x1="360" y1="151.56" x2="360" y2="159.06" stroke="#000" stroke-width="0.25"/><line x1="367.4" y1="151.56" x2="367.4" y2="159.06" stroke="#000" stroke-width="0.25"/><line x1="360" y1="157.56" x2="367.4" y2="157.56" stroke="#000" stroke-width="0.25"/><line x1="358.94" y1="158.62" x2="361.06" y2="156.5" stroke="#000" stroke-width="0.5"/><line x1="366.34" y1="158.62" x2="368.46" y2="156.5" stroke="#000" stroke-width="0.5"/><text x="363.7" y="156.66" font-size="2.5" text-anchor="middle" fill="#000">185</text></g><g data-a="r10B3000u0" data-b="r10B3000u6970" data-dir="h" data-control="1" data-total="1"><line x1="88.6" y1="151.56" x2="88.6" y2="167.06" stroke="#000" stroke-width="0.25"/><line x1="367.4" y1="151.56" x2="367.4" y2="167.06" stroke="#000" stroke-width="0.25"/><line x1="88.6" y1="165.56" x2="367.4" y2="165.56" stroke="#000" stroke-width="0.25"/><line x1="87.54" y1="166.62" x2="89.66" y2="164.5" stroke="#000" stroke-width="0.5"/><line x1="366.34" y1="166.62" x2="368.46" y2="164.5" stroke="#000" stroke-width="0.5"/><text x="228" y="164.66" font-size="2.5" text-anchor="middle" fill="#000">6970</text></g></g></g><g data-el="legend"><text x="25" y="180.06" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><text x="25" y="184.36" font-size="2.5" fill="#000">обозначения этого вида, схема развёрток помещения и ведомость</text><text x="25" y="187.76" font-size="2.5" fill="#000">отделки — на листе 160</text></g><g data-el="ref" data-target="160"/><g data-el="ref-back" data-target="127"/><g data-el="notes"><text x="25" y="238" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="243" font-size="2.5" fill="#000">1. Развёртки — вид на стену изнутри помещения, по часовой стрелке; расположение — на схеме листа 160 и на листе 127; размеры — в мм по чистовым поверхностям;</text><text x="28" y="246.4" font-size="2.5" fill="#000">отметки — в м от ±0,000 (чистый пол 1-го этажа); высоты Н — от чистого пола помещения до оси изделия, у декора — до центра.</text><text x="25" y="249.8" font-size="2.5" fill="#000">2. Схема мебели, приборов и декора не является технической документацией для производства мебели; габариты — по паспортам изделий.</text><text x="25" y="253.2" font-size="2.5" fill="#000">3. Картины и зеркала крепить к основанию по паспорту изделия (закладные и анкеры — в перечне скрытых работ); крест — ось центра предмета.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="65" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="65" y1="285.5" x2="65" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="67" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4 К-7" data-level="0"><text x="25.5" y="265.1" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="268.5" font-size="2.5" fill="#000">Основа листа: размеры и контуры этажей подобраны проектировщиком по составу помещений и площадям этажей с картинки 470 px (размеры на ней не читаются); обмер и исходный</text><text x="25.5" y="271.9" font-size="2.5" fill="#000">проект — задание (К-1); высоты: 1-й этаж 2800 мм, мансарда 2700 мм (горизонтальная часть) приняты; скаты кровли мансарды приняты по картинке: колено 1200 мм, уклон 45°, конёк</text><text x="25.5" y="275.3" font-size="2.5" fill="#000">вдоль длинной стороны; проект КР — задание (К-2); наружные стены 400 мм, перегородки 120 мм приняты (К-1); разрешённая мощность 15 кВт принята по типовым ТУ для частного</text><text x="25.5" y="278.7" font-size="2.5" fill="#000">дома (К-4); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-7).</text><text x="25.5" y="282.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 8, записи К-1, К-2, К-4, К-7).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-f
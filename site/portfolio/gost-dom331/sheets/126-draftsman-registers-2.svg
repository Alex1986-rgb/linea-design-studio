<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Реестр марок отделки и позиций альбома (продолжение)" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Реестр марок отделки и позиций альбома (продолжение)</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Реестр марок отделки (О ↔ позиции колерной карты) и марки позиций по видам</text><g data-el="mark-register"><text x="25" y="29.5" font-size="3.5" font-weight="700" fill="#000">Марки позиций альбома по видам (продолжение)</text><rect x="25" y="32" width="185" height="96.6" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="42" x2="210" y2="42" stroke="#000" stroke-width="0.5"/><text x="35" y="37.9" font-size="2.5" text-anchor="middle" fill="#000">Префикс</text><line x1="45" y1="32" x2="45" y2="128.6" stroke="#000" stroke-width="0.25"/><text x="107.5" y="37.9" font-size="2.5" text-anchor="middle" fill="#000">Что обозначает, позиции</text><line x1="170" y1="32" x2="170" y2="128.6" stroke="#000" stroke-width="0.25"/><text x="190" y="37.9" font-size="2.5" text-anchor="middle" fill="#000">Листы</text><g><text x="35" y="46.45" font-size="2.5" text-anchor="middle" fill="#000">ИП</text><text x="46.5" y="46.45" font-size="2.5" fill="#000" textLength="73.23" lengthAdjust="spacingAndGlyphs">извещатели: ИП1, ИП2, ИП3**, ИП4, ИП6**, ИП7, ИП8, ИП9**, ИП10, ИП11, ИП12**</text><text x="190" y="46.45" font-size="2.5" text-anchor="middle" fill="#000">37–51</text></g><line x1="25" y1="49" x2="210" y2="49" stroke="#000" stroke-width="0.25"/><g><text x="35" y="53.45" font-size="2.5" text-anchor="middle" fill="#000">ТВ</text><text x="46.5" y="53.45" font-size="2.5" fill="#000">розетки ТВ: ТВ1–ТВ5</text><text x="190" y="53.45" font-size="2.5" text-anchor="middle" fill="#000">37–51</text></g><line x1="25" y1="56" x2="210" y2="56" stroke="#000" stroke-width="0.25"/><g><text x="35" y="60.45" font-size="2.5" text-anchor="middle" fill="#000">LAN</text><text x="46.5" y="60.45" font-size="2.5" fill="#000">розетки компьютерные: LAN1–LAN6</text><text x="190" y="60.45" font-size="2.5" text-anchor="middle" fill="#000">37–51</text></g><line x1="25" y1="63" x2="210" y2="63" stroke="#000" stroke-width="0.25"/><g><text x="35" y="67.45" font-size="2.5" text-anchor="middle" fill="#000">КУП</text><text x="46.5" y="67.45" font-size="2.5" fill="#000" textLength="48.44" lengthAdjust="spacingAndGlyphs">электроустановочные изделия: КУП1**, КУП2**, КУП3**</text><text x="190" y="67.45" font-size="2.5" text-anchor="middle" fill="#000">37–51</text></g><line x1="25" y1="70" x2="210" y2="70" stroke="#000" stroke-width="0.25"/><g><text x="35" y="74.45" font-size="2.5" text-anchor="middle" fill="#000" textLength="7.92" lengthAdjust="spacingAndGlyphs">ЩК, ЩС**</text><text x="46.5" y="74.45" font-size="2.5" fill="#000" textLength="14.22" lengthAdjust="spacingAndGlyphs">щиты: ЩК, ЩС**</text><text x="190" y="74.45" font-size="2.5" text-anchor="middle" fill="#000">37–51</text></g><line x1="25" y1="77" x2="210" y2="77" stroke="#000" stroke-width="0.25"/><g><text x="35" y="81.45" font-size="2.5" text-anchor="middle" fill="#000">ДФ</text><text x="46.5" y="81.45" font-size="2.5" fill="#000">домофон: ДФ1</text><text x="190" y="81.45" font-size="2.5" text-anchor="middle" fill="#000">37–51</text></g><line x1="25" y1="84" x2="210" y2="84" stroke="#000" stroke-width="0.25"/><g><text x="35" y="88.45" font-size="2.5" text-anchor="middle" fill="#000">AP</text><text x="46.5" y="88.45" font-size="2.5" fill="#000" textLength="23.89" lengthAdjust="spacingAndGlyphs">точки доступа Wi-Fi: AP1**</text><text x="190" y="88.45" font-size="2.5" text-anchor="middle" fill="#000">37–51</text></g><line x1="25" y1="91" x2="210" y2="91" stroke="#000" stroke-width="0.25"/><g><text x="35" y="95.15" font-size="2.5" text-anchor="middle" fill="#000">Ст В1, Ст</text><text x="35" y="98.55" font-size="2.5" text-anchor="middle" fill="#000">К1, Ст К1-2</text><text x="35" y="101.95" font-size="2.5" text-anchor="middle" fill="#000">(кухня), Ст</text><text x="35" y="105.35" font-size="2.5" text-anchor="middle" fill="#000">Т3</text><text x="46.5" y="98.55" font-size="2.5" fill="#000">стояки (системы В1, Т3, К1): Ст В1-1, Ст В1-2, Ст В1-3, Ст К1-1, Ст К1-2 (кухня), Ст</text><text x="46.5" y="101.95" font-size="2.5" fill="#000">К1-3, Ст Т3-1, Ст Т3-2, Ст Т3-3</text><text x="190" y="100.25" font-size="2.5" text-anchor="middle" fill="#000">56–70</text></g><line x1="25" y1="107.6" x2="210" y2="107.6" stroke="#000" stroke-width="0.25"/><g><text x="35" y="112.05" font-size="2.5" text-anchor="middle" fill="#000">О</text><text x="46.5" y="112.05" font-size="2.5" fill="#000">марки отделки (реестр альбома): О1–О27</text><text x="190" y="112.05" font-size="2.5" text-anchor="middle" fill="#000">2–7, 125–206</text></g><line x1="25" y1="114.6" x2="210" y2="114.6" stroke="#000" stroke-width="0.25"/><g><text x="35" y="119.05" font-size="2.5" text-anchor="middle" fill="#000">К, КМ</text><text x="46.5" y="119.05" font-size="2.5" fill="#000">позиции колерной карты: К1–К18, КМ1–КМ8</text><text x="190" y="119.05" font-size="2.5" text-anchor="middle" fill="#000">95–98</text></g><line x1="25" y1="121.6" x2="210" y2="121.6" stroke="#000" stroke-width="0.25"/><g><text x="35" y="126.05" font-size="2.5" text-anchor="middle" fill="#000">РО</text><text x="46.5" y="126.05" font-size="2.5" fill="#000" textLength="90.85" lengthAdjust="spacingAndGlyphs">радиаторы отопления: РО-1**, РО-2**, РО-3**, РО-4**, РО-5**, РО-6**, РО-7**, РО-8**, РО-9**, РО-10**, РО-11**</text><text x="190" y="126.05" font-size="2.5" text-anchor="middle" fill="#000">52–55</text></g></g><g data-el="notes"><text x="25" y="141.6" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="147.6" font-size="2.5" fill="#000">1. Марка отделки О — одна на весь альбом: одна и та же отделка (материал, изделие, цвет, формат) на всех листах имеет одну марку;</text><text x="28" y="151.1" font-size="2.5" fill="#000">на развёртках и планах стоят марки этого реестра.</text><text x="25" y="154.6" font-size="2.5" fill="#000">2. Столбец «Колер. карта» — позиции колерной карты (лист 95): К — окраска по коду цвета, КМ — материал без кода цвета;</text><text x="28" y="158.1" font-size="2.5" fill="#000">«Помещения» — номера по экспликации; количества — по ведомости отделки помещений (лист 91).</text><text x="25" y="161.6" font-size="2.5" fill="#000">3. Марки позиций: один префикс — один вид позиций на весь альбом (двери Д, окна ОК, мебель М, сантехприборы П, декор ДК, текстиль</text><text x="28" y="165.1" font-size="2.5" fill="#000">Т, колерная карта К и КМ, радиаторы РО, розетки Р, выключатели S, светильники Св; стояки — «Ст» и система, например «Ст К1-1»).</text><text x="28" y="168.6" font-size="2.5" fill="#000">Совпадение префиксов у разных видов — замечание к исходным данным, при выпуске исправляется в модели.</text></g><g data-el="assumed-notes" data-flags="radiator:РО-1|radiator:РО-2|radiator:РО-3|point:КУП1|radiator:РО-4|radiator:РО-5|point:ИП6|point:ИП3|point:ИП12|radiator:РО-6|radiator:РО-7|point:КУП3|radiator:РО-8|point:ИП9|radiator:РО-9|radiator:РО-10|radiator:РО-11|point:КУП2|point:ЩС|point:AP1|surface:r1:skirting|surface:r1:apron|surface:r2:skirting|surface:r3:floor|surface:r4:skirting|surface:r5:skirting|surface:r5:accent:0|surface:r6:skirting|surface:r7:skirting|surface:r8:skirting|surface:r9:skirting|surface:r10:floor|surface:r10:skirting|surface:r11:floor|surface:r11:skirting|surface:r12:floor|surface:r12:skirting|surface:r13:skirting|surface:r14:skirting|surface:r15:floor|surface:r16:skirting|surface:r17:skirting|surface:r20:floor" data-ids="ИЗ-2 К-1 К-2 К-4 К-7 К-11 К-13 Кф-1" data-level="0"><text x="184.5" y="152.5" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="184.5" y="155.9" font-size="2.5" fill="#000">Основа листа: размеры и контуры этажей подобраны проектировщиком по составу помещений и площадям этажей с картинки 470 px (размеры на ней не читаются); обмер и исходный проект —</text><text x="184.5" y="159.3" font-size="2.5" fill="#000">задание (К-1); высоты: 1-й этаж 2800 мм, мансарда 2700 мм (горизонтальная часть) приняты; скаты кровли мансарды приняты по картинке: колено 1200 мм, уклон 45°, конёк вдоль длинной стороны;</text><text x="184.5" y="162.7" font-size="2.5" fill="#000">проект КР — задание (К-2); наружные стены 400 мм, перегородки 120 мм приняты (К-1); разрешённая мощность 15 кВт принята по типовым ТУ для частного дома (К-4); подрайон климата не задан —</text><text x="184.5" y="166.1" font-size="2.5" fill="#000">принят не северный (жилые от 2,5 м) (К-7).</text><text x="184.5" y="169.5" font-size="2.5" fill="#000">Знак «*» — принято, не замерено и не подтверждено (замерить на объекте): К-13: пол пом. 11, 12 — отметка верха плиты −0,170 принята по пирогу (плита веранды и крыльца своя, ниже плиты</text><text x="184.5" y="172.9" font-size="2.5" fill="#000">дома) — подтвердить по проекту КР или обмером (К-13).</text><text x="184.5" y="176.3" font-size="2.5" fill="#000">Знак «**» — предложение проектировщика, заказчиком не утверждено (согласовать с заказчиком): КУП1 — по образцу: Добавлены выводы к вентиляторам: ЭВ4 (ВР1, ванная) и ЭВ5 (ВР3, санузел 2)</text><text x="184.5" y="179.7" font-size="2.5" fill="#000">— группа 3, высота 2389 мм, включение с основным светом, таймер выбега в вентиляторе; и коробки уравнивания потенциалов КУП1 (ванная) и КУП2 (санузел 2) — высота 300 мм, у входа, вне зон</text><text x="184.5" y="183.1" font-size="2.5" fill="#000">0–2, проводник от шины PE щита ЩК …; сдвиг под раскладку плитки стены В на 131 мм вдоль стены — ось на шве или в центре плитки, привязка по таблице листа; ИП6, ИП3, ИП9 — дымовой</text><text x="184.5" y="186.5" font-size="2.5" fill="#000">автономный вместо теплового образца: жилой дом — автономные дымовые в путях эвакуации (СП 486, пункт сверить по действующей редакции); ИП12 — жилой дом — автономные дымовые</text><text x="184.5" y="189.9" font-size="2.5" fill="#000">извещатели в жилых комнатах и путях эвакуации (СП 486, пункт сверить по действующей редакции); место — центр помещения, не ближе 500 мм к светильнику; КУП3 — по образцу: Добавлены</text><text x="184.5" y="193.3" font-size="2.5" fill="#000">выводы к вентиляторам: ЭВ4 (ВР1, ванная) и ЭВ5 (ВР3, санузел 2) — группа 3, высота 2389 мм, включение с основным светом, таймер выбега в вентиляторе; и коробки уравнивания потенциалов</text><text x="184.5" y="196.7" font-size="2.5" fill="#000">КУП3 (ванная) и КУП2 (санузел 2) — высота 300 мм, у входа, вне зон 0–2, проводник от шины PE щита ЩК …; сдвиг под раскладку плитки стены Г на 71 мм вдоль стены — ось на шве или в центре</text><text x="184.5" y="200.1" font-size="2.5" fill="#000">плитки, привязка по таблице листа; КУП2 — по образцу: Добавлены выводы к вентиляторам: ЭВ4 (ВР1, ванная) и ЭВ5 (ВР3, санузел 2) — группа 3, высота 2389 мм, включение с основным светом,</text><text x="184.5" y="203.5" font-size="2.5" fill="#000">таймер выбега в вентиляторе; и коробки уравнивания потенциалов КУП1 (ванная) и КУП2 (санузел 2) — высота 300 мм, у входа, вне зон 0–2, проводник от шины PE щита ЩК …; сдвиг под раскладку</text><text x="184.5" y="206.9" font-size="2.5" fill="#000">плитки стены А на 27 мм вдоль стены — ось на шве или в центре плитки, привязка по таблице листа; ЩС — щит слаботочный: место и состав; AP1 — точка доступа Wi-Fi: число и места; плинтус</text><text x="184.5" y="210.3" font-size="2.5" fill="#000">пом. 1, 2, 4–14, 16, 17, фартук пом. 1, акцент пом. 5 — артикул изделия не выбран: позиция описана характеристиками («аналог по характеристикам»), артикул выбирается при закупке; пол пом. 3,</text><text x="184.5" y="213.7" font-size="2.5" fill="#000">15, 20 — пирог пола: стяжка 33 мм и обмазочная гидроизоляция добавлены разработчиком проекта; артикул изделия не выбран: позиция описана характеристиками («аналог по характеристикам»),</text><text x="184.5" y="217.1" font-size="2.5" fill="#000">артикул выбирается при закупке; пол пом. 10 — покрытие пола гаража — предложение исполнителя: выдерживает шины, масло и антигололёдные реагенты, без швов; ИЗ-2, К-11, Кф-1: РО-1 —</text><text x="184.5" y="220.5" font-size="2.5" fill="#000">перенос из-под окна стены А (привязка 1050, 900 мм — был внутри модулей Кх6, Кх1 с мойкой и Кх2 с ПММ, Кф-1) на свободный участок наружной стены Г за окном, у угла со стеной В (y 3500…4100,</text><text x="184.5" y="223.9" font-size="2.5" fill="#000">100 мм до угла, 110 мм до розетки Р23): прибор открыт, ряд под окном А без коллизии — предложение ОВ (ИЗ-2), на утверждение; окно А без прибора — мощность РО-1 + РО-2 сверить</text><text x="184.5" y="227.3" font-size="2.5" fill="#000">теплотехническим расчётом ОВ (котёл не выбран, К-11); К-11: РО-2, РО-3, РО-4, РО-5, РО-6, РО-7, РО-8, РО-9, РО-10, РО-11 — прибор под окном по оси проёма, ширина ≈ 0,7 ширины окна —</text><text x="184.5" y="230.7" font-size="2.5" fill="#000">предложение ОВ (лист ОВ выводил его сам до, теперь он в данных — один источник для листа, мебели, DXF и IFC); котёл и мощность не выбраны (К-11) — размер по теплотехническому расчёту.</text><text x="184.5" y="234.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 8, записи К-1, К-2, К-4, К-7; лист 9, записи К-11, К-13; лист 10, записи ИЗ-2, Кф-1).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor=
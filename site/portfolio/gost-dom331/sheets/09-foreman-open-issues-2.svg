<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Открытые вопросы, принятые допущения и конфликты. Лист 2 из 3" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты. Лист 2 из 3</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации (стартовое совещание 18.10.2026)</text><g data-el="open-issues" data-plan="fixed" data-plan-declared="3"><g data-el="issues-questions"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Открытые вопросы и принятые допущения (продолжение)</text><rect x="25" y="33" width="385" height="183.4" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="32" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="33" x2="39" y2="216.4" stroke="#000" stroke-width="0.25"/><text x="122" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Формулировка</text><line x1="205" y1="33" x2="205" y2="216.4" stroke="#000" stroke-width="0.25"/><text x="220" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Вид</text><line x1="235" y1="33" x2="235" y2="216.4" stroke="#000" stroke-width="0.25"/><text x="253" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Кто решает</text><line x1="271" y1="33" x2="271" y2="216.4" stroke="#000" stroke-width="0.25"/><text x="309.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Если решения нет</text><line x1="348" y1="33" x2="348" y2="216.4" stroke="#000" stroke-width="0.25"/><text x="379" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Лист, где это проявляется</text><g data-el="issue-row" data-kind="question" data-id="К-8"><text x="32" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">К-8</text><text x="40.5" y="46.7" font-size="2.5" fill="#000">Душ Сн1 с трапом (санузел 1-го этажа): в стяжке 35 мм трап не встаёт — монтажная высота трапа ≈ 90 мм (по паспорту модели) +</text><text x="40.5" y="50.1" font-size="2.5" fill="#000">уклон отвода Ø50 до стояка Ст К1-1 (1,70 м × 25 мм/м = 42 мм) = 132 мм. Предложение проектировщика: душевая зона у стены Б под</text><text x="40.5" y="53.5" font-size="2.5" fill="#000">стояками (не на них), подиум 1190 × 900 высотой 100 мм (гидроизоляция по плите под подиумом и по подиуму, весь санузел; узел 1</text><text x="40.5" y="56.9" font-size="2.5" fill="#000">на схеме разводки). Альтернативы: пол 1-го этажа по грунту или перекрытию с пирогом ≥ 132 мм по проекту АР/КР (тогда без</text><text x="40.5" y="60.3" font-size="2.5" fill="#000">подиума), низкий поддон на ножках.</text><text x="206.5" y="46.7" font-size="2.5" fill="#000">Спорно</text><text x="206.5" y="50.1" font-size="2.5" fill="#000">Ждёт: документа,</text><text x="206.5" y="53.5" font-size="2.5" fill="#000">затем решения</text><text x="236.5" y="46.7" font-size="2.5" fill="#000">Инженер ВК (вода,</text><text x="236.5" y="50.1" font-size="2.5" fill="#000">канализация)</text><text x="272.5" y="46.7" font-size="2.5" fill="#000">трап и подиум не выполнять, пол санузла до решения не</text><text x="272.5" y="50.1" font-size="2.5" fill="#000">стяжать</text><text x="349.5" y="46.7" font-size="2.5" fill="#000">л. 56, 57 — План выводов сантехники</text><text x="349.5" y="50.1" font-size="2.5" fill="#000">л. 19, 21, 23, 28, 30, 37, 39, 41, 48, 50, 52, 54, 56,</text><text x="349.5" y="53.5" font-size="2.5" fill="#000">58, 64, 65, 73, 85, 88, 100, 108, 127, 140–142</text><text x="349.5" y="56.9" font-size="2.5" fill="#000">1-й этаж</text><text x="349.5" y="60.3" font-size="2.5" fill="#000">л. 58, 59 — Схема разводки водопровода и</text><text x="349.5" y="63.7" font-size="2.5" fill="#000">канализации</text><text x="349.5" y="67.1" font-size="2.5" fill="#000">л. 19, 21, 23, 28, 30, 37, 39, 41, 48, 50, 52, 54, 56,</text><text x="349.5" y="70.5" font-size="2.5" fill="#000">58, 64, 65, 73, 85, 88, 100, 108, 127, 140–142</text><text x="349.5" y="73.9" font-size="2.5" fill="#000">1-й этаж</text><text x="349.5" y="77.3" font-size="2.5" fill="#000">л. 88, 89 — План полов</text><text x="349.5" y="80.7" font-size="2.5" fill="#000">л. 19, 21, 23, 28, 30, 37, 39, 41, 48, 50, 52, 54, 56,</text><text x="349.5" y="84.1" font-size="2.5" fill="#000">58, 64, 65, 73, 85, 88, 100, 108, 127, 140–142</text><text x="349.5" y="87.5" font-size="2.5" fill="#000">1-й этаж</text></g><line x1="25" y1="90.6" x2="410" y2="90.6" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-9"><text x="32" y="94.3" font-size="2.5" text-anchor="middle" fill="#000">К-9</text><text x="40.5" y="94.3" font-size="2.5" fill="#000">Дверь Д-4 гостиной (пом. 5) на террасу, проём 2400 × 2100, остеклённая: число полотен и ширина полотна в данных не заданы (ряд</text><text x="40.5" y="97.7" font-size="2.5" fill="#000">полотен — до 1200 мм), толщина и класс безопасного стекла тоже. Одним полотном 2400 мм дверь при открывании на 90° задевает</text><text x="40.5" y="101.1" font-size="2.5" fill="#000">диван Гс2, такое полотно не изготовить. Решить: двупольная 2 × 1150 (сектор полотна 1150 до дивана не доходит), раздвижная или</text><text x="40.5" y="104.5" font-size="2.5" fill="#000">портальная система; стекло — закалённое или многослойное, толщина и класс — по выбору системы (передать стекольщику).</text><text x="206.5" y="94.3" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="97.7" font-size="2.5" fill="#000">Ждёт: решения</text><text x="236.5" y="94.3" font-size="2.5" fill="#000">Архитектор-планировщик</text><text x="272.5" y="94.3" font-size="2.5" fill="#000">Д-4 остаётся проёмом без заданного полотна: дверь не</text><text x="272.5" y="97.7" font-size="2.5" fill="#000">заказать, зона открывания на плане мебели — по ширине</text><text x="272.5" y="101.1" font-size="2.5" fill="#000">проёма</text><text x="349.5" y="94.3" font-size="2.5" fill="#000">л. 23, 24 — План дверей</text><text x="349.5" y="97.7" font-size="2.5" fill="#000">л. 19, 21, 23, 28, 30, 37, 39, 41, 48, 50, 52, 54, 56,</text><text x="349.5" y="101.1" font-size="2.5" fill="#000">58, 64, 65, 73, 85, 88, 100, 108, 127, 140–142</text><text x="349.5" y="104.5" font-size="2.5" fill="#000">1-й этаж</text><text x="349.5" y="107.9" font-size="2.5" fill="#000">л. 30, 31 — План расстановки мебели</text><text x="349.5" y="111.3" font-size="2.5" fill="#000">л. 19, 21, 23, 28, 30, 37, 39, 41, 48, 50, 52, 54, 56,</text><text x="349.5" y="114.7" font-size="2.5" fill="#000">58, 64, 65, 73, 85, 88, 100, 108, 127, 140–142</text><text x="349.5" y="118.1" font-size="2.5" fill="#000">1-й этаж</text></g><line x1="25" y1="121.2" x2="410" y2="121.2" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-10"><text x="32" y="124.9" font-size="2.5" text-anchor="middle" fill="#000">К-10</text><text x="40.5" y="124.9" font-size="2.5" fill="#000">Кухня-столовая (пом. 1): мойка Кх1 и модули Кх6, Кх2 стоят под окном 1400 × 1500 стены А с низом проёма +0,900 — подоконник в</text><text x="40.5" y="128.3" font-size="2.5" fill="#000">уровне столешницы (+0,900). Смеситель мойки упирается в створку, открывающуюся внутрь, примыкание столешницы к откосу и</text><text x="40.5" y="131.7" font-size="2.5" fill="#000">подоконнику не решено. Выбрать: створка над мойкой глухая или поворотно-откидная с ограничителем, подоконник поднять (низ</text><text x="40.5" y="135.1" font-size="2.5" fill="#000">проёма от +1,050) или столешница заходит в проём вместо подоконника.</text><text x="206.5" y="124.9" font-size="2.5" fill="#000">Решение</text><text x="206.5" y="128.3" font-size="2.5" fill="#000">Ждёт: решения</text><text x="236.5" y="124.9" font-size="2.5" fill="#000">Дизайнер интерьера</text><text x="272.5" y="124.9" font-size="2.5" fill="#000">столешница у окна не раскраивается, мойка Кх1 и</text><text x="272.5" y="128.3" font-size="2.5" fill="#000">смеситель не заказываются; монтажная схема кухни</text><text x="272.5" y="131.7" font-size="2.5" fill="#000">показывает проём и конфликт</text><text x="349.5" y="124.9" font-size="2.5" fill="#000">л. 120 — Кухня (пом. 1). Монтажная схема</text></g><line x1="25" y1="138.2" x2="410" y2="138.2" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-11"><text x="32" y="141.9" font-size="2.5" text-anchor="middle" fill="#000">К-11</text><text x="40.5" y="141.9" font-size="2.5" fill="#000">Тип котла (газ / электро / твёрдое топливо) и его мощность не выбраны. От них зависят воздухообмен и приток котельной (пом. 4;</text><text x="40.5" y="145.3" font-size="2.5" fill="#000">при газе — СП 62.13330, дымоход), вытяжка гаража (пом. 10) наружу своим каналом и разводка отопления от коллектора. Выбрать</text><text x="40.5" y="148.7" font-size="2.5" fill="#000">котёл.</text><text x="206.5" y="141.9" font-size="2.5" fill="#000">Решение</text><text x="236.5" y="141.9" font-size="2.5" fill="#000">Инженер ОВ</text><text x="272.5" y="141.9" font-size="2.5" fill="#000">котельная и гараж без устройств вентиляции; разводка</text><text x="272.5" y="145.3" font-size="2.5" fill="#000">отопления — принципиальная</text><text x="349.5" y="141.9" font-size="2.5" fill="#000">л. 54, 55 — План отопления</text><text x="349.5" y="145.3" font-size="2.5" fill="#000">л. 19, 21, 23, 28, 30, 37, 39, 41, 48, 50, 52, 54, 56,</text><text x="349.5" y="148.7" font-size="2.5" fill="#000">58, 64, 65, 73, 85, 88, 100, 108, 127, 140–142</text><text x="349.5" y="152.1" font-size="2.5" fill="#000">1-й этаж</text><text x="349.5" y="155.5" font-size="2.5" fill="#000">л. 52, 53 — План вентиляции</text><text x="349.5" y="158.9" font-size="2.5" fill="#000">л. 19, 21, 23, 28, 30, 37, 39, 41, 48, 50, 52, 54, 56,</text><text x="349.5" y="162.3" font-size="2.5" fill="#000">58, 64, 65, 73, 85, 88, 100, 108, 127, 140–142</text><text x="349.5" y="165.7" font-size="2.5" fill="#000">1-й этаж</text></g><line x1="25" y1="168.8" x2="410" y2="168.8" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-12"><text x="32" y="172.5" font-size="2.5" text-anchor="middle" fill="#000">К-12</text><text x="40.5" y="172.5" font-size="2.5" fill="#000">Вентканалы ВК-1…ВК-3 приняты проектировщиком (на картинке заказчика не показаны). У санузла мансарды (пом. 20) канала нет:</text><text x="40.5" y="175.9" font-size="2.5" fill="#000">вытяжка ВР4 — воздуховодом ≈ 6 м до ВК-3. Нужен канал или шахта у санузла (проект дома / решение) либо подтверждение</text><text x="40.5" y="179.3" font-size="2.5" fill="#000">воздуховода с вентилятором по напору.</text><text x="206.5" y="172.5" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="175.9" font-size="2.5" fill="#000">Ждёт: обмера</text><text x="236.5" y="172.5" font-size="2.5" fill="#000">Инженер ОВ</text><text x="272.5" y="172.5" font-size="2.5" fill="#000">вытяжка санузла мансарды — вентилятором с обратным</text><text x="272.5" y="175.9" font-size="2.5" fill="#000">клапаном и воздуховодом под потолком до ВК-3</text><text x="349.5" y="172.5" font-size="2.5" fill="#000">л. 52, 53 — План вентиляции</text><text x="349.5" y="175.9" font-size="2.5" fill="#000">л. 19, 21, 23, 28, 30, 37, 39, 41, 48, 50, 52, 54, 56,</text><text x="349.5" y="179.3" font-size="2.5" fill="#000">58, 64, 65, 73, 85, 88, 100, 108, 127, 140–142</text><text x="349.5" y="182.7" font-size="2.5" fill="#000">1-й этаж</text></g><line x1="25" y1="185.8" x2="410" y2="185.8" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-13"><text x="32" y="189.5" font-size="2.5" text-anchor="middle" fill="#000">К-13</text><text x="40.5" y="189.5" font-size="2.5" fill="#000">Веранда (пом. 11) и крыльцо (пом. 12): чистый пол −0,030, пирог 140 мм (утеплитель XPS 100, сборное основание ГВЛВ 25, клей 5,</text><text x="40.5" y="192.9" font-size="2.5" fill="#000">керамогранит 10) — верх плиты принят −0,170, то есть своя плита на 106 мм ниже плиты дома (−0,064). Отметка и конструкция</text><text x="40.5" y="196.3" font-size="2.5" fill="#000">плиты веранды и крыльца не известны: проект КР не передан (К-5). Подтвердить по проекту КР или обмером; если плита в уровне</text><text x="40.5" y="199.7" font-size="2.5" fill="#000">дома — пирог свести к 34 мм.</text><text x="206.5" y="189.5" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="192.9" font-size="2.5" fill="#000">Ждёт: обмера</text><text x="236.5" y="189.5" font-size="2.5" fill="#000">Архитектор-планировщик</text><text x="272.5" y="189.5" font-size="2.5" fill="#000">плита веранды и крыльца — на отметке −0,170 (по пирогу);</text><text x="272.5" y="192.9" font-size="2.5" fill="#000">утеплитель и основание не заказывать до подтверждения</text><text x="272.5" y="196.3" font-size="2.5" fill="#000">отметки</text><text x="349.5" y="189.5" font-size="2.5" fill="#000">л. 88, 89 — План полов</text><text x="349.5" y="192.9" font-size="2.5" fill="#000">л. 19, 21, 23, 28, 30, 37, 39, 41, 48, 50, 52, 54, 56,</text><text x="349.5" y="196.3" font-size="2.5" fill="#000">58, 64, 65, 73, 85, 88, 100, 108, 127, 140–142</text><text x="349.5" y="199.7" font-size="2.5" fill="#000">1-й этаж</text><text x="349.5" y="203.1" font-size="2.5" fill="#000">л. 19, 20 — Обмерный план</text><text x="349.5" y="206.5" font-size="2.5" fill="#000">л. 19, 21, 23, 28, 30, 37, 39, 41, 48, 50, 52, 54, 56,</text><text x="349.5" y="209.9" font-size="2.5" fill="#000">58, 64, 65, 73, 85, 88, 100, 108, 127, 140–142</text><text x="349.5" y="213.3" font-size="2.5" fill="#000">1-й этаж</text></g></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/>
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">График закупок и работ. Лист 2 из 4</text><text x="25" y="17.8" font-size="2.5" fill="#333">Что заказывать и когда не раньше чего: относительный порядок без дат; срок поставки — из данных или «уточняется у поставщика»</text><g data-el="proc-schedule" data-plan="fixed" data-plan-declared="4"><g data-el="proc-buy"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Закупки: что заказывается, от чего зависит заказ и какую работу блокирует (продолжение)</text><rect x="25" y="33" width="385" height="156.2" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="31" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="37" y1="33" x2="37" y2="189.2" stroke="#000" stroke-width="0.25"/><text x="70" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Позиция и где</text><line x1="103" y1="33" x2="103" y2="189.2" stroke="#000" stroke-width="0.25"/><text x="131" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">1. Замер до заказа</text><line x1="159" y1="33" x2="159" y2="189.2" stroke="#000" stroke-width="0.25"/><text x="187" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">2. Решение, выбор изделия, паспорт</text><line x1="215" y1="33" x2="215" y2="189.2" stroke="#000" stroke-width="0.25"/><text x="241" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">3. Условие заказа</text><line x1="267" y1="33" x2="267" y2="189.2" stroke="#000" stroke-width="0.25"/><text x="287" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">4. Срок поставки</text><line x1="307" y1="33" x2="307" y2="189.2" stroke="#000" stroke-width="0.25"/><text x="335" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">5. Блокирует работу</text><line x1="363" y1="33" x2="363" y2="189.2" stroke="#000" stroke-width="0.25"/><text x="386.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Закрывает вопросы реестра</text><g data-el="proc-row" data-id="З-6" data-kind="tile" data-lead="" data-lead-src="none" data-need="Р-9" data-closes=""><text x="31" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">З-6</text><text x="38.5" y="46.7" font-size="2.5" fill="#000">Керамогранит и плитка: 3 поз. по артикулу и</text><text x="38.5" y="50.1" font-size="2.5" fill="#000">формату, 126,65 м² по раскладке</text><text x="38.5" y="53.5" font-size="2.5" fill="#000">пом. 3, 4, 8, 9, 11, 12, 15, 20</text><text x="104.5" y="46.7" font-size="2.5" fill="#000">О-8: обмер: Кухня-столовая (пом. 1),</text><text x="104.5" y="50.1" font-size="2.5" fill="#000">Кабинет-гостевая (пом. 2), Санузел 1 этажа</text><text x="104.5" y="53.5" font-size="2.5" fill="#000">(пом. 3), Котельная (пом. 4), Гостиная (пом.</text><text x="104.5" y="56.9" font-size="2.5" fill="#000">5), Холл с лестницей (пом. 6), Кладовая</text><text x="104.5" y="60.3" font-size="2.5" fill="#000">(пом. 7), Прихожая (пом. 8), Тамбур (пом.</text><text x="104.5" y="63.7" font-size="2.5" fill="#000">9), Гараж (пом. 10), Веранда (пом. 11),</text><text x="104.5" y="67.1" font-size="2.5" fill="#000">Крыльцо (пом. 12), Спальня мастер (пом.</text><text x="104.5" y="70.5" font-size="2.5" fill="#000">13), Гардеробная мастер (пом. 14),</text><text x="104.5" y="73.9" font-size="2.5" fill="#000">Санузел мастер (пом. 15), Спальня 2 (пом.</text><text x="104.5" y="77.3" font-size="2.5" fill="#000">16), Холл мансарды (пом. 17), Спальня 3</text><text x="104.5" y="80.7" font-size="2.5" fill="#000">(пом. 18), Спальня 4 (пом. 19), Санузел 2</text><text x="104.5" y="84.1" font-size="2.5" fill="#000">(пом. 20)</text><text x="104.5" y="87.5" font-size="2.5" fill="#000">О-9: обмер: Кухня-столовая (пом. 1),</text><text x="104.5" y="90.9" font-size="2.5" fill="#000">Кабинет-гостевая (пом. 2), Санузел 1 этажа</text><text x="104.5" y="94.3" font-size="2.5" fill="#000">(пом. 3), Котельная (пом. 4), Гостиная (пом.</text><text x="104.5" y="97.7" font-size="2.5" fill="#000">5), Холл с лестницей (пом. 6), Кладовая</text><text x="104.5" y="101.1" font-size="2.5" fill="#000">(пом. 7), Прихожая (пом. 8), Тамбур (пом.</text><text x="104.5" y="104.5" font-size="2.5" fill="#000">9), Гараж (пом. 10), Веранда (пом. 11),</text><text x="104.5" y="107.9" font-size="2.5" fill="#000">Крыльцо (пом. 12), Спальня мастер (пом.</text><text x="104.5" y="111.3" font-size="2.5" fill="#000">13), Гардеробная мастер (пом. 14),</text><text x="104.5" y="114.7" font-size="2.5" fill="#000">Санузел мастер (пом. 15), Спальня 2 (пом.</text><text x="104.5" y="118.1" font-size="2.5" fill="#000">16), Холл мансарды (пом. 17), Спальня 3</text><text x="104.5" y="121.5" font-size="2.5" fill="#000">(пом. 18), Спальня 4 (пом. 19), Санузел 2</text><text x="104.5" y="124.9" font-size="2.5" fill="#000">(пом. 20)</text><text x="160.5" y="46.7" font-size="2.5" fill="#000"></text><text x="216.5" y="46.7" font-size="2.5" fill="#000">После 1 и 2 и после получения срока у</text><text x="216.5" y="50.1" font-size="2.5" fill="#000">поставщика (вопроса о сроках нет);</text><text x="216.5" y="53.5" font-size="2.5" fill="#000">дата заказа — когда срок известен, не</text><text x="216.5" y="56.9" font-size="2.5" fill="#000">позднее чем за срок до начала Р-9.</text><text x="268.5" y="46.7" font-size="2.5" fill="#000">срок уточняется у поставщика</text><text x="308.5" y="46.7" font-size="2.5" fill="#000">Р-9 «плитка»: калибр партии измеряют до</text><text x="308.5" y="50.1" font-size="2.5" fill="#000">раскладки, раскладку пересчитывают до</text><text x="308.5" y="53.5" font-size="2.5" fill="#000">заказа</text><text x="364.5" y="46.7" font-size="2.5" fill="#000"></text></g><line x1="25" y1="128" x2="410" y2="128" stroke="#000" stroke-width="0.25"/><g data-el="proc-row" data-id="З-7" data-kind="board" data-lead="" data-lead-src="none" data-need="Р-12" data-closes=""><text x="31" y="131.7" font-size="2.5" text-anchor="middle" fill="#000">З-7</text><text x="38.5" y="131.7" font-size="2.5" fill="#000">Покрытие пола (доска) и плинтус: пом. 1, 2, 5, 6, 7,</text><text x="38.5" y="135.1" font-size="2.5" fill="#000">13, 14, 16, 17, 18, 19</text><text x="38.5" y="138.5" font-size="2.5" fill="#000">пом. 1, 2, 5, 6, 7, 13, 14, 16, 17, 18, 19</text><text x="104.5" y="131.7" font-size="2.5" fill="#000">О-8: обмер: Кухня-столовая (пом. 1),</text><text x="104.5" y="135.1" font-size="2.5" fill="#000">Кабинет-гостевая (пом. 2), Санузел 1 этажа</text><text x="104.5" y="138.5" font-size="2.5" fill="#000">(пом. 3), Котельная (пом. 4), Гостиная (пом.</text><text x="104.5" y="141.9" font-size="2.5" fill="#000">5), Холл с лестницей (пом. 6), Кладовая</text><text x="104.5" y="145.3" font-size="2.5" fill="#000">(пом. 7), Прихожая (пом. 8), Тамбур (пом.</text><text x="104.5" y="148.7" font-size="2.5" fill="#000">9), Гараж (пом. 10), Веранда (пом. 11),</text><text x="104.5" y="152.1" font-size="2.5" fill="#000">Крыльцо (пом. 12), Спальня мастер (пом.</text><text x="104.5" y="155.5" font-size="2.5" fill="#000">13), Гардеробная мастер (пом. 14),</text><text x="104.5" y="158.9" font-size="2.5" fill="#000">Санузел мастер (пом. 15), Спальня 2 (пом.</text><text x="104.5" y="162.3" font-size="2.5" fill="#000">16), Холл мансарды (пом. 17), Спальня 3</text><text x="104.5" y="165.7" font-size="2.5" fill="#000">(пом. 18), Спальня 4 (пом. 19), Санузел 2</text><text x="104.5" y="169.1" font-size="2.5" fill="#000">(пом. 20)</text><text x="160.5" y="131.7" font-size="2.5" fill="#000"></text><text x="216.5" y="131.7" font-size="2.5" fill="#000">После 1 и 2 и после получения срока у</text><text x="216.5" y="135.1" font-size="2.5" fill="#000">поставщика (вопроса о сроках нет);</text><text x="216.5" y="138.5" font-size="2.5" fill="#000">дата заказа — когда срок известен, не</text><text x="216.5" y="141.9" font-size="2.5" fill="#000">позднее чем за срок до начала Р-12.</text><text x="268.5" y="131.7" font-size="2.5" fill="#000">срок уточняется у поставщика</text><text x="308.5" y="131.7" font-size="2.5" fill="#000">Р-12 «чистовые полы»: артикул и партия</text><text x="308.5" y="135.1" font-size="2.5" fill="#000">— до заказа; доску привозят к чистовым</text><text x="308.5" y="138.5" font-size="2.5" fill="#000">полам</text><text x="364.5" y="131.7" font-size="2.5" fill="#000"></text></g><line x1="25" y1="172.2" x2="410" y2="172.2" stroke="#000" stroke-width="0.25"/><g data-el="proc-row" data-id="З-8" data-kind="furniture" data-lead="" data-lead-src="none" data-need="Р-15" data-closes="К-1"><text x="31" y="175.9" font-size="2.5" text-anchor="middle" fill="#000">З-8</text><text x="38.5" y="175.9" font-size="2.5" fill="#000">Встроенная мебель по замеру цеха: Пр1, С3, Д3,</text><text x="38.5" y="179.3" font-size="2.5" fill="#000">Д6</text><text x="38.5" y="182.7" font-size="2.5" fill="#000">пом. 8, 16, 18, 19</text><text x="104.5" y="175.9" font-size="2.5" fill="#000">О-4: обмер: все помещения (К-1); до заказа</text><text x="104.5" y="179.3" font-size="2.5" fill="#000">мебели и дверей</text><text x="160.5" y="175.9" font-size="2.5" fill="#000"></text><text x="216.5" y="175.9" font-size="2.5" fill="#000">После 1 и 2 и после получения срока у</text><text x="216.5" y="179.3" font-size="2.5" fill="#000">поставщика (вопроса о сроках нет);</text><text x="216.5" y="182.7" font-size="2.5" fill="#000">дата заказа — когда срок известен, не</text><text x="216.5" y="186.1" font-size="2.5" fill="#000">позднее чем за срок до начала Р-15.</text><text x="268.5" y="175.9" font-size="2.5" fill="#000">срок уточняется у поставщика</text><text x="268.5" y="179.3" font-size="2.5" fill="#000">Ориентир практики (не срок</text><text x="268.5" y="182.7" font-size="2.5" fill="#000">поставщика): 4–8 нед. от</text><text x="268.5" y="186.1" font-size="2.5" fill="#000">замера</text><text x="308.5" y="175.9" font-size="2.5" fill="#000">Р-15 «кухня и мебель»: цех замеряет по</text><text x="308.5" y="179.3" font-size="2.5" fill="#000">готовым стенам; производство 4–8 недель</text><text x="308.5" y="182.7" font-size="2.5" fill="#000">идёт параллельно с отделкой</text><text x="364.5" y="175.9" font-size="2.5" fill="#000">К-1</text></g></g></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4 К-7" data-level="0"><text x="25.5" y="272.1" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="275.5" font-size="2.5" fill="#000">Основа листа: размеры и контуры этажей подобраны проектировщиком по составу помещений и площадям этажей с картинки 470 px (размеры на ней не читаются); обмер и исходный</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">проект — задание (К-1); высоты: 1-й этаж 2800 мм, мансарда 2700 мм (горизонтальная часть) приняты; скаты кровли мансарды приняты по картинке: колено 1200 мм, уклон 45°, конёк</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">вдоль длинной стороны; проект КР — задание (К-2); наружные стены 400 мм, перегородки 120 мм приняты (К-1); разрешённая мощность 15 кВт принята по типовым ТУ для частного</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">дома (К-4); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-7).</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 7, записи К-1, К-2, К-4, К-7).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Реестр марок отделки и позиций альбома (продолжение)</text><text x="25" y="17.8" font-size="2.5" fill="#333">Реестр марок отделки (О ↔ позиции колерной карты) и марки позиций по видам</text><g data-el="mark-register"><text x="25" y="29.5" font-size="3.5" font-weight="700" fill="#000">Марки позиций альбома по видам (продолжение)</text><rect x="25" y="32" width="185" height="47.6" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="42" x2="210" y2="42" stroke="#000" stroke-width="0.5"/><text x="35" y="37.9" font-size="2.5" text-anchor="middle" fill="#000">Префикс</text><line x1="45" y1="32" x2="45" y2="79.6" stroke="#000" stroke-width="0.25"/><text x="107.5" y="37.9" font-size="2.5" text-anchor="middle" fill="#000">Что обозначает, позиции</text><line x1="170" y1="32" x2="170" y2="79.6" stroke="#000" stroke-width="0.25"/><text x="190" y="37.9" font-size="2.5" text-anchor="middle" fill="#000">Листы</text><g><text x="35" y="46.15" font-size="2.5" text-anchor="middle" fill="#000">Ст В1, Ст</text><text x="35" y="49.55" font-size="2.5" text-anchor="middle" fill="#000">К1, Ст К1-2</text><text x="35" y="52.95" font-size="2.5" text-anchor="middle" fill="#000">(кухня), Ст</text><text x="35" y="56.35" font-size="2.5" text-anchor="middle" fill="#000">Т3</text><text x="46.5" y="49.55" font-size="2.5" fill="#000">стояки (системы В1, Т3, К1): Ст В1-1, Ст В1-2, Ст В1-3, Ст К1-1, Ст К1-2 (кухня), Ст</text><text x="46.5" y="52.95" font-size="2.5" fill="#000">К1-3, Ст Т3-1, Ст Т3-2, Ст Т3-3</text><text x="190" y="51.25" font-size="2.5" text-anchor="middle" fill="#000">47–51</text></g><line x1="25" y1="58.6" x2="210" y2="58.6" stroke="#000" stroke-width="0.25"/><g><text x="35" y="63.05" font-size="2.5" text-anchor="middle" fill="#000">О</text><text x="46.5" y="63.05" font-size="2.5" fill="#000">марки отделки (реестр альбома): О1–О22</text><text x="190" y="63.05" font-size="2.5" text-anchor="middle" fill="#000">2–6, 94–143</text></g><line x1="25" y1="65.6" x2="210" y2="65.6" stroke="#000" stroke-width="0.25"/><g><text x="35" y="70.05" font-size="2.5" text-anchor="middle" fill="#000">К, КМ</text><text x="46.5" y="70.05" font-size="2.5" fill="#000">позиции колерной карты: К1–К15, КМ1–КМ6</text><text x="190" y="70.05" font-size="2.5" text-anchor="middle" fill="#000">67–70</text></g><line x1="25" y1="72.6" x2="210" y2="72.6" stroke="#000" stroke-width="0.25"/><g><text x="35" y="77.05" font-size="2.5" text-anchor="middle" fill="#000">РО</text><text x="46.5" y="77.05" font-size="2.5" fill="#000">радиаторы отопления: РО-1–РО-11</text><text x="190" y="77.05" font-size="2.5" text-anchor="middle" fill="#000">43–46</text></g></g><g data-el="notes"><text x="25" y="92.6" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="98.6" font-size="2.5" fill="#000">1. Марка отделки О — одна на весь альбом: одна и та же отделка (материал, изделие, цвет, формат) на всех листах имеет одну марку;</text><text x="28" y="102.1" font-size="2.5" fill="#000">на развёртках и планах стоят марки этого реестра.</text><text x="25" y="105.6" font-size="2.5" fill="#000">2. Столбец «Колер. карта» — позиции колерной карты (лист 67): К — окраска по коду цвета, КМ — материал без кода цвета;</text><text x="28" y="109.1" font-size="2.5" fill="#000">«Помещения» — номера по экспликации; количества — по ведомости отделки помещений (лист 64).</text><text x="25" y="112.6" font-size="2.5" fill="#000">3. Марки позиций: один префикс — один вид позиций на весь альбом (двери Д, окна ОК, мебель М, сантехприборы П, декор ДК, текстиль</text><text x="28" y="116.1" font-size="2.5" fill="#000">Т, колерная карта К и КМ, радиаторы РО, розетки Р, выключатели S, светильники Св; стояки — «Ст» и система, например «Ст К1-1»).</text><text x="28" y="119.6" font-size="2.5" fill="#000">Совпадение префиксов у разных видов — замечание к исходным данным, при выпуске исправляется в модели.</text></g><g data-el="assumed-notes" data-flags="surface:r1:skirting|surface:r1:apron|surface:r2:skirting|surface:r4:skirting|surface:r5:skirting|surface:r5:accent:0|surface:r6:skirting|surface:r7:skirting|surface:r8:skirting|surface:r9:skirting|surface:r10:floor|surface:r10:skirting|surface:r11:skirting|surface:r12:skirting|surface:r13:skirting|surface:r14:skirting|surface:r16:skirting|surface:r17:skirting" data-ids="К-1 К-2 К-4" data-level="0"><text x="25.5" y="261.9" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="265.3" font-size="2.5" fill="#000">Основа листа: размеры и контуры этажей подобраны проектировщиком по составу помещений и площадям этажей с картинки 470 px (размеры на ней не читаются); обмер и исходный</text><text x="25.5" y="268.7" font-size="2.5" fill="#000">проект — задание (К-1); высоты: 1-й этаж 2800 мм, мансарда 2700 мм (горизонтальная часть) приняты; скаты кровли мансарды приняты по картинке: колено 1200 мм, уклон 45°, конёк</text><text x="25.5" y="272.1" font-size="2.5" fill="#000">вдоль длинной стороны; проект КР — задание (К-2); наружные стены 400 мм, перегородки 120 мм приняты (К-1); разрешённая мощность 15 кВт принята по типовым ТУ для частного</text><text x="25.5" y="275.5" font-size="2.5" fill="#000">дома (К-4).</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">Знак «**» — предложение проектировщика, заказчиком не утверждено (согласовать с заказчиком): записи в реестре нет: плинтус пом. 1, 2, 4–14, 16, 17, фартук пом. 1, акцент пом. 5 —</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">артикул изделия не выбран: позиция описана характеристиками («аналог по характеристикам»), артикул выбирается при закупке; пол пом. 10 — покрытие пола гаража —</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">предложение исполнителя: выдерживает шины, масло и антигололёдные реагенты, без швов.</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 7, записи К-1, К-2, К-4).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" fill="#000">18.10.26</text><text x="231" y="270.8" font-size="2.5" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" fill="#000">ГД-2026-010-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" fill="#000">Дом 331 м²</text><text x="297" y="259.2" font-size="2.5" fill="#000">Общая площадь 270,67* м² · * размеры приняты, не замерены (реестр — л. 7, К-1)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" fill="#000">Дизайн-проект интерьера</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">95</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">152</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="283.2" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">Реестр марок отделки и позиций альбома</text><text x="330" y="287" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">(продолжение)</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="4" data-positions="38" data-basis="4"><rect x="318.03" y="6.2" width="95.47" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="320.03" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 4 (реестр — л. 7)</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Открытые вопросы, принятые допущения и конфликты. Лист 3 из 3" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты. Лист 3 из 3</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации (стартовое совещание 18.10.2026)</text><g data-el="open-issues" data-plan="fixed" data-plan-declared="3"><g data-el="issues-conflicts"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Конфликты между разделами</text><rect x="25" y="33" width="385" height="47.4" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="32" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="33" x2="39" y2="80.4" stroke="#000" stroke-width="0.25"/><text x="114" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Формулировка</text><line x1="189" y1="33" x2="189" y2="80.4" stroke="#000" stroke-width="0.25"/><text x="209" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Разделы</text><line x1="229" y1="33" x2="229" y2="80.4" stroke="#000" stroke-width="0.25"/><text x="242" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Статус</text><line x1="255" y1="33" x2="255" y2="80.4" stroke="#000" stroke-width="0.25"/><text x="273" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Кто решает</text><line x1="291" y1="33" x2="291" y2="80.4" stroke="#000" stroke-width="0.25"/><text x="320.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Если решения нет</text><line x1="350" y1="33" x2="350" y2="80.4" stroke="#000" stroke-width="0.25"/><text x="380" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Лист, где это проявляется</text><g data-el="issue-row" data-kind="conflict" data-id="Кф-1"><text x="32" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">Кф-1</text><text x="40.5" y="46.7" font-size="2.5" fill="#000">Кухня-столовая (пом. 1): радиатор РО-1 под окном стены А (800…2200, выведен листом ОВ по оси окна) попадает в</text><text x="40.5" y="50.1" font-size="2.5" fill="#000">объём нижних модулей Кх6 (300…1100), Кх1 (мойка, 1100…1900) и Кх2 (посудомоечная, 1900…2500) — те же модули,</text><text x="40.5" y="53.5" font-size="2.5" fill="#000">что в К-10 (подоконник в уровне столешницы). Экран в модуле невозможен. Решение ОВ: перенос прибора на</text><text x="40.5" y="56.9" font-size="2.5" fill="#000">свободную стену (Г, у окна 1200…2800) или внутрипольный конвектор у окна; либо дизайнер меняет состав ряда у окна.</text><text x="40.5" y="60.3" font-size="2.5" fill="#000">Решение исполнителя (ИЗ-2, 02.11.2026, на утверждение автора): РО-1 перенесён на свободный участок стены Г у угла</text><text x="40.5" y="63.7" font-size="2.5" fill="#000">со стеной В (привязка 3500, 600 × 600, низ +120); ряд под окном А без прибора. Конфликт закрывается подписью ИЗ-2.</text><text x="190.5" y="46.7" font-size="2.5" fill="#000">ОВ; мебель</text><text x="230.5" y="46.7" font-size="2.5" fill="#000">У владельца</text><text x="230.5" y="50.1" font-size="2.5" fill="#000">раздела, круг 3</text><text x="256.5" y="46.7" font-size="2.5" fill="#000">Инженер ОВ</text><text x="292.5" y="46.7" font-size="2.5" fill="#000">до подписи ИЗ-2 модули Кх6, Кх1, Кх2 и</text><text x="292.5" y="50.1" font-size="2.5" fill="#000">подводки к РО-1 не выполнять</text><text x="351.5" y="46.7" font-size="2.5" fill="#000">л. 54, 55 — План отопления</text><text x="351.5" y="50.1" font-size="2.5" fill="#000">л. 19, 21, 23, 28, 30, 37, 39, 41, 48, 50, 52, 54,</text><text x="351.5" y="53.5" font-size="2.5" fill="#000">56, 58, 64, 65, 73, 85, 88, 100, 108, 127,</text><text x="351.5" y="56.9" font-size="2.5" fill="#000">140–142 — 1-й этаж</text><text x="351.5" y="60.3" font-size="2.5" fill="#000">л. 124 — Ведомости изделий, техники и</text><text x="351.5" y="63.7" font-size="2.5" fill="#000">фурнитуры</text><text x="351.5" y="67.1" font-size="2.5" fill="#000">л. 30, 31 — План расстановки мебели</text><text x="351.5" y="70.5" font-size="2.5" fill="#000">л. 19, 21, 23, 28, 30, 37, 39, 41, 48, 50, 52, 54,</text><text x="351.5" y="73.9" font-size="2.5" fill="#000">56, 58, 64, 65, 73, 85, 88, 100, 108, 127,</text><text x="351.5" y="77.3" font-size="2.5" fill="#000">140–142 — 1-й этаж</text></g></g><g data-el="issues-changes"><text x="25" y="92.8" font-size="3.5" font-weight="700" fill="#000">Изменения проекта после выпуска листов (реестр изменений)</text><rect x="25" y="95.4" width="385" height="81.4" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="105.4" x2="410" y2="105.4" stroke="#000" stroke-width="0.5"/><text x="32" y="101.3" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="95.4" x2="39" y2="176.8" stroke="#000" stroke-width="0.25"/><text x="50" y="101.3" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><line x1="61" y1="95.4" x2="61" y2="176.8" stroke="#000" stroke-width="0.25"/><text x="91" y="101.3" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><line x1="121" y1="95.4" x2="121" y2="176.8" stroke="#000" stroke-width="0.25"/><text x="171" y="101.3" font-size="2.5" text-anchor="middle" fill="#000">Было</text><line x1="221" y1="95.4" x2="221" y2="176.8" stroke="#000" stroke-width="0.25"/><text x="283.5" y="101.3" font-size="2.5" text-anchor="middle" fill="#000">Стало</text><line x1="346" y1="95.4" x2="346" y2="176.8" stroke="#000" stroke-width="0.25"/><text x="378" y="101.3" font-size="2.5" text-anchor="middle" fill="#000">Кто решил, подпись</text><g data-el="issue-row" data-kind="change" data-id="ИЗ-1"><text x="32" y="109.1" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-1</text><text x="40.5" y="109.1" font-size="2.5" fill="#000">30.10.2026</text><text x="62.5" y="109.1" font-size="2.5" fill="#000">л. 41, 42 — План выключателей и схема</text><text x="62.5" y="112.5" font-size="2.5" fill="#000">включения</text><text x="62.5" y="115.9" font-size="2.5" fill="#000">л. 19, 21, 23, 28, 30, 37, 39, 41, 48, 50, 52, 54,</text><text x="62.5" y="119.3" font-size="2.5" fill="#000">56, 58, 64, 65, 73, 85, 88, 100, 108, 127,</text><text x="62.5" y="122.7" font-size="2.5" fill="#000">140–142 — 1-й этаж</text><text x="62.5" y="126.1" font-size="2.5" fill="#000">л. 39, 40 — План освещения</text><text x="62.5" y="129.5" font-size="2.5" fill="#000">л. 19, 21, 23, 28, 30, 37, 39, 41, 48, 50, 52, 54,</text><text x="62.5" y="132.9" font-size="2.5" fill="#000">56, 58, 64, 65, 73, 85, 88, 100, 108, 127,</text><text x="62.5" y="136.3" font-size="2.5" fill="#000">140–142 — 1-й этаж</text><text x="122.5" y="109.1" font-size="2.5" fill="#000">Линия L17 объединяла светильники веранды (Св59), крыльца (Св60) и санузла</text><text x="122.5" y="112.5" font-size="2.5" fill="#000">2 мансарды (Св50, Св51, вентилятор В5); единственный выключатель S9 стоял</text><text x="122.5" y="115.9" font-size="2.5" fill="#000">в кухне-столовой; бра Св52 (L18) без выключателя (прим. 8 «назначить</text><text x="122.5" y="119.3" font-size="2.5" fill="#000">управление до монтажа»).</text><text x="222.5" y="109.1" font-size="2.5" fill="#000">Веранда — линия L12, выключатель S30 в гостиной у двери Д-4; крыльцо — линия L13,</text><text x="222.5" y="112.5" font-size="2.5" fill="#000">выключатель S31 в тамбуре у входной двери; санузел 2 — L17 (свет и вентилятор) и L18 (бра),</text><text x="222.5" y="115.9" font-size="2.5" fill="#000">двухклавишный S32 в холле мансарды у двери Д-13. S9 снят. Конфликт радиатора РО-1 с</text><text x="222.5" y="119.3" font-size="2.5" fill="#000">модулями кухни под окном записан как Кф-1.</text><text x="347.5" y="109.1" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="112.5" font-size="2.5" fill="#000">исполнителя; на утверждение А. С. Кырлана</text></g><line x1="25" y1="139.4" x2="410" y2="139.4" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-2"><text x="32" y="143.1" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-2</text><text x="40.5" y="143.1" font-size="2.5" fill="#000">02.11.2026</text><text x="62.5" y="143.1" font-size="2.5" fill="#000">л. 54, 55 — План отопления</text><text x="62.5" y="146.5" font-size="2.5" fill="#000">л. 19, 21, 23, 28, 30, 37, 39, 41, 48, 50, 52, 54,</text><text x="62.5" y="149.9" font-size="2.5" fill="#000">56, 58, 64, 65, 73, 85, 88, 100, 108, 127,</text><text x="62.5" y="153.3" font-size="2.5" fill="#000">140–142 — 1-й этаж</text><text x="62.5" y="156.7" font-size="2.5" fill="#000">л. 124 — Ведомости изделий, техники и</text><text x="62.5" y="160.1" font-size="2.5" fill="#000">фурнитуры</text><text x="62.5" y="163.5" font-size="2.5" fill="#000">л. 30, 31 — План расстановки мебели</text><text x="62.5" y="166.9" font-size="2.5" fill="#000">л. 19, 21, 23, 28, 30, 37, 39, 41, 48, 50, 52, 54,</text><text x="62.5" y="170.3" font-size="2.5" fill="#000">56, 58, 64, 65, 73, 85, 88, 100, 108, 127,</text><text x="62.5" y="173.7" font-size="2.5" fill="#000">140–142 — 1-й этаж</text><text x="122.5" y="143.1" font-size="2.5" fill="#000">Радиатор РО-1 выводился листом ОВ под окном стены А кухни-столовой</text><text x="122.5" y="146.5" font-size="2.5" fill="#000">(привязка 1050, 900 × 600) — внутри нижних модулей Кх6 (ящики), Кх1 (мойка)</text><text x="122.5" y="149.9" font-size="2.5" fill="#000">и Кх2 (посудомоечная машина): экран невозможен. Радиаторы дома в данных</text><text x="122.5" y="153.3" font-size="2.5" fill="#000">не были заданы, лист ОВ выводил их сам.</text><text x="222.5" y="143.1" font-size="2.5" fill="#000">РО-1 — на свободном участке наружной стены Г у угла со стеной В: привязка 3500, 600 × 600, низ</text><text x="222.5" y="146.5" font-size="2.5" fill="#000">+120; ряд под окном А без прибора. Мощность РО-1 + РО-2 сверить теплотехническим расчётом</text><text x="222.5" y="149.9" font-size="2.5" fill="#000">ОВ (котёл и мощность не выбраны, К-11). Все радиаторы дома теперь в данных — одни и те же на</text><text x="222.5" y="153.3" font-size="2.5" fill="#000">листе ОВ, в мебели, DXF и IFC.</text><text x="347.5" y="143.1" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="146.5" font-size="2.5" fill="#000">исполнителя (ОВ); предложение проектировщика,</text><text x="347.5" y="149.9" font-size="2.5" fill="#000">на утверждение А. С. Кырлана</text></g></g><g data-el="notes"><text x="25" y="189.2" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="194" font-size="2.5" fill="#000">1. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text><text x="25" y="197.4" font-size="2.5" fill="#000">2. Графа «Если решения нет» показывает состояние решения на листах; влияние на сроки и стоимость по пунктам не оценивалось.</text><text x="25" y="200.8" font-size="2.5" fill="#000">3. Пункт, по которому принято решение, при следующем выпуске комплекта из таблиц исключается.</text></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width=
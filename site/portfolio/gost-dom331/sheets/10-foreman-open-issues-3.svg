ddle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="47" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="15" data-positions="77" data-basis="5"><rect x="313.01" y="6.2" width="100.49" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="315.01" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 15 (реестр — л. 8–10)</text></g></svg>
ht="700" fill="#000">Примечания</text><text x="25" y="243" font-size="2.5" fill="#000">1. Схема, условные обозначения и ведомость отделки — к развёртке стены Г на листе 162: вид в своём масштабе занимает лист целиком.</text><text x="25" y="246.4" font-size="2.5" fill="#000">2. Расположение развёрток всех помещений — на листе 127; полная ведомость отделки — на листах отделочника.</text></g><g data-el="assumed-notes" data-flags="surface:r10:floor|surface:r10:skirting" data-ids="К-1 К-2 К-4 К-7" data-level="0"><text x="25.5" y="261.9" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="265.3" font-size="2.5" fill="#000">Основа листа: размеры и контуры этажей подобраны проектировщиком по составу помещений и площадям этажей с картинки 470 px (размеры на ней не читаются); обмер и исходный</text><text x="25.5" y="268.7" font-size="2.5" fill="#000">проект — задание (К-1); высоты: 1-й этаж 2800 мм, мансарда 2700 мм (горизонтальная часть) приняты; скаты кровли мансарды приняты по картинке: колено 1200 мм, уклон 45°, конёк</text><text x="25.5" y="272.1" font-size="2.5" fill="#000">вдоль длинной стороны; проект КР — задание (К-2); наружные стены 400 мм, перегородки 120 мм приняты (К-1); разрешённая мощность 15 кВт принята по типовым ТУ для частного</text><text x="25.5" y="275.5" font-size="2.5" fill="#000">дома (К-4); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-7).</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">Знак «**» — предложение проектировщика, заказчиком не утверждено (согласовать с заказчиком): пол пом. 10 — покрытие пола гаража — предложение исполнителя: выдерживает</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">шины, масло и антигололёдные реагенты, без швов; плинтус пом. 10 — артикул изделия не выбран: позиция описана характеристиками («аналог по характеристикам»), артикул</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">выбирается при закупке.</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 8, записи К-1, К-2, К-4, К-7).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" fon
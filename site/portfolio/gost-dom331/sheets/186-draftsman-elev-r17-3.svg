l="#000">плинтус МДФ, h 80 мм, аналог: плинтус МДФ под покраску 80×16</text><text x="316.1" y="51.95" font-size="2.5" fill="#000">Farrow &amp; Ball No. 226</text><text x="316.1" y="55.35" font-size="2.5" fill="#000">«Joa's White»</text><text x="368.1" y="53.65" font-size="2.5" text-anchor="end" fill="#000">3,9 м</text></g><line x1="194.6" y1="57.6" x2="369.6" y2="57.6" stroke="#000" stroke-width="0.25"/><g><text x="200.1" y="63.45" font-size="2.5" text-anchor="middle" fill="#000">О9</text><text x="207.1" y="63.45" font-size="2.5" fill="#000">потолок</text><text x="223.1" y="61.75" font-size="2.5" fill="#000">окраска, Little Greene Absolute Matt, глубокоматовая, подготовка</text><text x="223.1" y="65.15" font-size="2.5" fill="#000">Q3</text><text x="316.1" y="61.75" font-size="2.5" fill="#000">Little Greene No. 105</text><text x="316.1" y="65.15" font-size="2.5" fill="#000">«Slaked Lime»</text><text x="368.1" y="63.45" font-size="2.5" text-anchor="end" fill="#000">21,7 м²</text></g></g><g data-el="ref-back" data-target="185"/><g data-el="notes"><text x="25" y="238" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="243" font-size="2.5" fill="#000">1. Схема, условные обозначения и ведомость отделки — к развёртке стены Б на листе 185: вид в своём масштабе занимает лист целиком.</text><text x="25" y="246.4" font-size="2.5" fill="#000">2. Расположение развёрток всех помещений — на листе 128; полная ведомость отделки — на листах отделочника.</text></g><g data-el="assumed-notes" data-flags="surface:r17:skirting|level:L2" data-ids="К-1 К-2 К-4 К-7" data-level="0"><text x="25.5" y="258.5" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="261.9" font-size="2.5" fill="#000">Основа листа: размеры и контуры этажей подобраны проектировщиком по составу помещений и площадям этажей с картинки 470 px (размеры на ней не читаются); обмер и исходный</text><text x="25.5" y="265.3" font-size="2.5" fill="#000">проект — задание (К-1); высоты: 1-й этаж 2800 мм, мансарда 2700 мм (горизонтальная часть) приняты; скаты кровли мансарды приняты по картинке: колено 1200 мм, уклон 45°, конёк</text><text x="25.5" y="268.7" font-size="2.5" fill="#000">вдоль длинной стороны; проект КР — задание (К-2); наружные стены 400 мм, перегородки 120 мм приняты (К-1); разрешённая мощность 15 кВт принята по типовым ТУ для частного</text><text x="25.5" y="272.1" font-size="2.5" fill="#000">дома (К-4); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-7).</text><text x="25.5" y="275.5" font-size="2.5" fill="#000">Знак «*» — принято, не замерено и не подтверждено (замерить на объекте): К-2: отметка чистого пола этажа «Мансарда» +3,150 — принята без источника, все отметки мансарды</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">считаются от неё.</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">Знак «**» — предложение проектировщика, заказчиком не утверждено (согласовать с заказчиком): плинтус пом. 17 — артикул изделия не выбран: позиция описана характеристиками</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">(«аналог по характеристикам»), артикул выбирается при закупке.</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 8, записи К-1, К-2, К-4, К-7).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">04.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5"
 stroke-width="0.18"/><text x="183.5" y="31.4" font-size="2.5" fill="#000">плитка целая; тонкая линия — шов</text><rect x="173" y="35.5" width="7" height="4" fill="#eadfc4" stroke="#6f6f6f" stroke-width="0.18"/><text x="183.5" y="38.4" font-size="2.5" fill="#000">плитка с подрезкой (размер — на цепочке)</text><line x1="173" y1="44.5" x2="178" y2="44.5" stroke="#b03a2e" stroke-width="0.25" stroke-dasharray="4 1 0.6 1"/><path d="M 180.3 44.5 L 178.3 43.7 L 178.3 45.3 Z" fill="#b03a2e"/><text x="183.5" y="45.4" font-size="2.5" fill="#000">ось старта; стрелки — направление укладки</text><line x1="173" y1="52.5" x2="175.5" y2="50.5" stroke="#000" stroke-width="0.18"/><line x1="175.5" y1="50.5" x2="180.5" y2="50.5" stroke="#000" stroke-width="0.25"/><circle cx="173" cy="52.5" r="0.5" fill="#000"/><text x="183.5" y="52.4" font-size="2.5" fill="#000">отметка чистого пола на полке выноски, м</text><g data-el="mark"><circle cx="176.5" cy="58.5" r="2.5" fill="#fff" stroke="#000" stroke-width="0.25"/><text x="176.5" y="59.4" font-size="2.5" text-anchor="middle" fill="#000">А</text></g><text x="183.5" y="59.4" font-size="2.5" fill="#000">обозначение стены А–Г (как на развёртках)</text></g><g data-el="spec"><text x="242.8" y="23" font-size="3.5" font-weight="700" fill="#000">Подсчёт плитки</text><rect x="242.8" y="25" width="107" height="14" fill="none" stroke="#000" stroke-width="0.5"/><line x1="242.8" y1="33" x2="349.8" y2="33" stroke="#000" stroke-width="0.5"/><text x="263.8" y="30.3" font-size="2.5" text-anchor="middle" fill="#000">Поверхность</text><line x1="284.8" y1="25" x2="284.8" y2="39" stroke="#000" stroke-width="0.25"/><text x="293.3" y="30.3" font-size="2.5" text-anchor="middle" fill="#000">Формат</text><line x1="301.8" y1="25" x2="301.8" y2="39" stroke="#000" stroke-width="0.25"/><text x="307.8" y="30.3" font-size="2.5" text-anchor="middle" fill="#000">S, м²</text><line x1="313.8" y1="25" x2="313.8" y2="39" stroke="#000" stroke-width="0.25"/><text x="319.3" y="30.3" font-size="2.5" text-anchor="middle" fill="#000">Целых</text><line x1="324.8" y1="25" x2="324.8" y2="39" stroke="#000" stroke-width="0.25"/><text x="329.8" y="30.3" font-size="2.5" text-anchor="middle" fill="#000">Подр.</text><line x1="334.8" y1="25" x2="334.8" y2="39" stroke="#000" stroke-width="0.25"/><text x="342.3" y="30.3" font-size="2.5" text-anchor="middle" fill="#000">С запасом</text><text x="244.3" y="37.3" font-size="2.5" text-anchor="start" fill="#000">Крыльцо, пол</text><text x="286.3" y="37.3" font-size="2.5" text-anchor="start" fill="#000">600×1200</text><text x="312.3" y="37.3" font-size="2.5" text-anchor="end" fill="#000">3,38</text><text x="315.3" y="37.3" font-size="2.5" text-anchor="start" fill="#000">0</text><text x="326.3" y="37.3" font-size="2.5" text-anchor="start" fill="#000">6</text><text x="336.3" y="37.3" font-size="2.5" text-anchor="start" fill="#000">7</text></g><g data-el="notes"><text x="172.5" y="70.5" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="172.5" y="75.5" font-size="2.5" fill="#000">1. Крыльцо: керамогранит 600×1200, длинная сторона — вдоль стен Б и Г, шов 2 мм, прямая раскладка от центра. Стены окрашены: раскладка от чистового контура минус штукатурка и шпаклёвка</text><text x="172.5" y="79.1" font-size="2.5" fill="#000">15 мм на сторону (принято); подрезки 553 / 954 мм, срез — под плинтус.</text><text x="172.5" y="82.7" font-size="2.5" fill="#000">2. Крыльцо: деформационный зазор по периметру 8–10 мм под плинтусом; в проёмах — стык с соседним покрытием по оси полотна двери. Клей C2 TE S1, затирка CG2WA.</text><text x="172.5" y="86.3" font-size="2.5" fill="#000">3. Клей, затирка и итог по форматам — в ведомостях листа «Раскладка плитки. Планы полов».</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="75" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="75" y1="285.5" x2="75" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="77" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="surface:r12:skirting" data-ids="К-1 К-2 К-4" data-level="0"><text x="25.5" y="258.3" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="261.7" font-size="2.5" fill="#000">Основа листа: размеры и контуры этажей подобраны проектировщиком по составу помещений и площадям этажей с картинки 470 px (размеры на ней не читаются); обмер и исходный</text><text x="25.5" y="265.1" font-size="2.5" fill="#000">проект — задание (К-1); высоты: 1-й этаж 2800 мм, мансарда 2700 мм (горизонтальная часть) приняты; скаты кровли мансарды приняты по картинке: колено 1200 мм, уклон 45°, конёк</text><text x="25.5" y="268.5" font-size="2.5" fill="#000">вдоль длинной стороны; проект КР — задание (К-2); наружные стены 400 мм, перегородки 120 мм приняты (К-1); разрешённая мощность 15 кВт принята по типовым ТУ для частного</text><text x="25.5" y="271.9" font-size="2.5" fill="#000">дома (К-4).</text><text x="25.5" y="275.3" font-size="2.5" fill="#000">Знак «**» — предложение проектировщика, заказчиком не утверждено (согласовать с заказчиком): записи в реестре нет: плинтус пом. 12 — артикул изделия не выбран: позиция</text><text x="25.5" y="278.7" font-size="2.5" fill="#000">описана характеристиками («аналог по характеристикам»), артикул выбирается при закупке.</text><text x="25.5" y="282.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 7, записи К-1, К-2, К-4).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262"
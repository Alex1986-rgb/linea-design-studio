000">18</text><text x="35.5" y="139.3" font-size="2.5" text-anchor="start" data-fit="31" fill="#000">Спальня 3</text><text x="69.5" y="139.3" font-size="2.5" text-anchor="start" data-fit="165" fill="#000">общий — L7; рабочий — L9; акцентный — L8</text><text x="253.5" y="139.3" font-size="2.5" text-anchor="end" data-fit="16" fill="#000">233,2</text><line x1="25" y1="147" x2="255" y2="147" stroke="#000" stroke-width="0.18"/><text x="29.5" y="145.3" font-size="2.5" text-anchor="middle" data-fit="6" fill="#000">19</text><text x="35.5" y="145.3" font-size="2.5" text-anchor="start" data-fit="31" fill="#000">Спальня 4</text><text x="69.5" y="145.3" font-size="2.5" text-anchor="start" data-fit="165" fill="#000">общий — L7; рабочий — L9; акцентный — L8</text><text x="253.5" y="145.3" font-size="2.5" text-anchor="end" data-fit="16" fill="#000">141,6</text><text x="29.5" y="151.3" font-size="2.5" text-anchor="middle" data-fit="6" fill="#000">20</text><text x="35.5" y="151.3" font-size="2.5" text-anchor="start" data-fit="31" fill="#000">Санузел 2</text><text x="69.5" y="151.3" font-size="2.5" text-anchor="start" data-fit="165" fill="#000">общий — L17; рабочий — L18</text><text x="253.5" y="151.3" font-size="2.5" text-anchor="end" data-fit="16" fill="#000">21</text></g><g data-el="layers-key"><text x="263" y="23" font-size="3.5" font-weight="700" fill="#000">Слои света</text><text x="263" y="28.5" font-size="2.5" data-fit="147" fill="#000">общий — равномерный свет помещения, по норме освещённости</text><text x="263" y="32.7" font-size="2.5" data-fit="147" fill="#000">рабочий — местный свет задачи: столешница, зеркало, чтение у кровати</text><text x="263" y="36.9" font-size="2.5" data-fit="147" fill="#000">акцентный — подсветка потолка, стен и ниш; не входит в поток общего света</text><text x="263" y="41.1" font-size="2.5" data-fit="147" fill="#000">ночной — путь спальня → санузел: не выше 2700 K, малая яркость, датчик движения</text></g><g data-el="notes"><text x="25" y="241" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="246" font-size="2.5" data-fit="200" fill="#000">1. Продолжение листа 71: позиции, марки и группы — те же, что на основном листе.</text><text x="25" y="249.4" font-size="2.5" data-fit="200" fill="#000">2. Σ Р — установленная мощность освещения помещения, Вт; группы L — по плану выключателей.</text></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4 К-7" data-level="0"><text x="25.5" y="272.1" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="275.5" font-size="2.5" fill="#000">Основа листа: размеры и контуры этажей подобраны проектировщиком по составу помещений и площадям этажей с картинки 470 px (размеры на ней не читаются); обмер и исходный</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">проект — задание (К-1); высоты: 1-й этаж 2800 мм, мансарда 2700 мм (горизонтальная часть) приняты; скаты кровли мансарды приняты по картинке: колено 1200 мм, уклон 45°, конёк</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">вдоль длинной стороны; проект КР — задание (К-2); наружные стены 400 мм, перегородки 120 мм приняты (К-1); разрешённая мощность 15 кВт принята по типовым ТУ для частного</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">дома (К-4); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-7).</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 8, записи К-1, К-2, К-4, К-7).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="
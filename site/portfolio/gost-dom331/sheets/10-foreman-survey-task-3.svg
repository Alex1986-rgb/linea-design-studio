<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Задание на контрольный обмер и обследование. Лист 3 из 3</text><text x="25" y="17.8" font-size="2.5" fill="#333">Что замерить, вскрыть и получить до заказа материалов и изделий</text><g data-el="survey-task" data-plan="fixed" data-plan-declared="3"><g data-el="survey-offsite"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Документы и данные закупки (не на объекте)</text><rect x="25" y="33" width="385" height="44" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="31" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="37" y1="33" x2="37" y2="77" stroke="#000" stroke-width="0.25"/><text x="62" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">У кого, откуда</text><line x1="87" y1="33" x2="87" y2="77" stroke="#000" stroke-width="0.25"/><text x="97" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Способ</text><line x1="107" y1="33" x2="107" y2="77" stroke="#000" stroke-width="0.25"/><text x="149" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Что получить</text><line x1="191" y1="33" x2="191" y2="77" stroke="#000" stroke-width="0.25"/><text x="219" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">К какому сроку</text><line x1="247" y1="33" x2="247" y2="77" stroke="#000" stroke-width="0.25"/><text x="285" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Что пересчитается в альбоме</text><line x1="323" y1="33" x2="323" y2="77" stroke="#000" stroke-width="0.25"/><text x="344" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Чем подтверждается</text><line x1="365" y1="33" x2="365" y2="77" stroke="#000" stroke-width="0.25"/><text x="387.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Закрывает вопросы реестра</text><g data-el="survey-row" data-id="О-8" data-key="tu-moshchnost" data-closes="К-4" data-method="document" data-covers="basis:power"><text x="31" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">О-8</text><text x="38.5" y="46.7" font-size="2.5" fill="#000">Заказчик; организация, выдавшая</text><text x="38.5" y="50.1" font-size="2.5" fill="#000">технические условия</text><text x="88.5" y="46.7" font-size="2.5" fill="#000">Документ</text><text x="108.5" y="46.7" font-size="2.5" fill="#000">Технические условия на присоединение: разрешённая мощность.</text><text x="192.5" y="46.7" font-size="2.5" fill="#000">До утверждения однолинейной схемы щита</text><text x="248.5" y="46.7" font-size="2.5" fill="#000">Однолинейная схема щита: вводной аппарат и группы.</text><text x="248.5" y="50.1" font-size="2.5" fill="#000">Листы:</text><text x="248.5" y="53.5" font-size="2.5" fill="#000">л. 2–6 — Общие данные</text><text x="324.5" y="46.7" font-size="2.5" fill="#000">копия документа</text><text x="366.5" y="46.7" font-size="2.5" fill="#000">К-4</text><text x="366.5" y="50.1" font-size="2.5" fill="#000">Результат принимает:</text><text x="366.5" y="53.5" font-size="2.5" fill="#000">Инженер-электрик</text></g><line x1="25" y1="56.6" x2="410" y2="56.6" stroke="#000" stroke-width="0.25"/><g data-el="survey-row" data-id="О-9" data-key="bti-plan" data-closes="К-5" data-method="document" data-covers=""><text x="31" y="60.3" font-size="2.5" text-anchor="middle" fill="#000">О-9</text><text x="38.5" y="60.3" font-size="2.5" fill="#000">вся квартира</text><text x="88.5" y="60.3" font-size="2.5" fill="#000">Документ</text><text x="108.5" y="60.3" font-size="2.5" fill="#000">Поэтажный план БТИ и техническое заключение о несущих</text><text x="108.5" y="63.7" font-size="2.5" fill="#000">стенах.</text><text x="192.5" y="60.3" font-size="2.5" fill="#000">до демонтажа и возведения перегородок</text><text x="248.5" y="60.3" font-size="2.5" fill="#000">монтажный план, проёмы, развёртки</text><text x="248.5" y="63.7" font-size="2.5" fill="#000">Листы:</text><text x="248.5" y="67.1" font-size="2.5" fill="#000">л. 15, 16 — Обмерный план</text><text x="248.5" y="70.5" font-size="2.5" fill="#000">л. 15, 17, 19, 21, 23, 29, 31, 33, 39, 41, 43, 45, 47, 49, 53, 58,</text><text x="248.5" y="73.9" font-size="2.5" fill="#000">61, 72, 78, 102–104 — 1-й этаж</text><text x="324.5" y="60.3" font-size="2.5" fill="#000">копия документа</text><text x="366.5" y="60.3" font-size="2.5" fill="#000">К-5</text><text x="366.5" y="63.7" font-size="2.5" fill="#000">Результат принимает: Архитектор</text></g></g><g data-el="notes"><text x="25" y="89.4" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="94.2" font-size="2.5" fill="#000">1. Подтверждение: акт контрольного обмера (дата, кто присутствовал, прибор, перечень промеров с результатами, подписи присутствующих); к акту — фото вскрытий и узлов и техническое заключение организации, выполнившей обследование.</text><text x="25" y="97.6" font-size="2.5" fill="#000">2. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text><text x="25" y="101" font-size="2.5" fill="#000">3. Пункт исключается из задания при следующем выпуске, когда акт подписан, значение внесено в проект и листы перевыпущены; знак «*» у величины снимается только замером.</text></g></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4" data-level="0"><text x="25.5" y="272.1" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="275.5" font-size="2.5" fill="#000">Основа листа: размеры и контуры этажей подобраны проектировщиком по составу помещений и площадям этажей с картинки 470 px (размеры на ней не читаются); обмер и исходный</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">проект — задание (К-1); высоты: 1-й этаж 2800 мм, мансарда 2700 мм (горизонтальная часть) приняты; скаты кровли мансарды приняты по картинке: колено 1200 мм, уклон 45°, конёк</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">вдоль длинной стороны; проект КР — задание (К-2); наружные стены 400 мм, перегородки 120 мм приняты (К-1); разрешённая мощность 15 кВт принята по типовым ТУ для частного</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">дома (К-4).</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 7, записи К-1, К-2, К-4).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" fill="#000">18.10.26</text><text x="231" y="270.8" font-size="2.5" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" fill="#000">ГД-2026-010-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" fill="#000">Дом 331 м²</text><text x="297" y="259.2" font-size="2.5" fill="#000">Общая площадь 270,67* м² · * размеры приняты, не замерены (реестр — л. 7, К-1)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" fill="#000">Дизайн-проект интерьера</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="3
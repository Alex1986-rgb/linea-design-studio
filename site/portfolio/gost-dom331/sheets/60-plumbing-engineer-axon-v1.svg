l="riser" data-index="В1"><path d="M 172.94 89.99 L 172.94 59.49" fill="none" stroke="#1f5fbf" stroke-width="0.7"/><path d="M 171.14 89.49 L 172.34 90.49 L 173.54 89.49 L 174.74 90.49" fill="none" stroke="#000" stroke-width="0.25"/><path d="M 171.14 58.99 L 172.34 59.99 L 173.54 58.99 L 174.74 59.99" fill="none" stroke="#000" stroke-width="0.25"/><circle cx="172.94" cy="87.49" r="1.1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/></g><g data-el="riser" data-index="В1"><path d="M 121.43 81.5 L 121.43 51" fill="none" stroke="#1f5fbf" stroke-width="0.7"/><path d="M 119.63 81 L 120.83 82 L 122.03 81 L 123.23 82" fill="none" stroke="#000" stroke-width="0.25"/><path d="M 119.63 50.5 L 120.83 51.5 L 122.03 50.5 L 123.23 51.5" fill="none" stroke="#000" stroke-width="0.25"/><circle cx="121.43" cy="79" r="1.1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/></g><g data-el="riser" data-index="В1"><path d="M 147.49 115.44 L 147.49 84.94" fill="none" stroke="#1f5fbf" stroke-width="0.7"/><path d="M 145.69 114.94 L 146.89 115.94 L 148.09 114.94 L 149.29 115.94" fill="none" stroke="#000" stroke-width="0.25"/><path d="M 145.69 84.44 L 146.89 85.44 L 148.09 84.44 L 149.29 85.44" fill="none" stroke="#000" stroke-width="0.25"/><circle cx="147.49" cy="112.94" r="1.1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/></g></g><g data-el="pl-labels"><text x="121.83" y="96.73" font-size="2.5" fill="#555">3 Санузел 1 этажа</text><text x="126.27" y="82.57" font-size="2.5" fill="#555">15 Санузел мастер</text><text x="32.38" y="93.53" font-size="2.5" fill="#555">1 Кухня-столовая</text><text x="106.24" y="114.25" font-size="2.5" fill="#555">20 Санузел 2</text><text x="167" y="53.89" font-size="2.5" fill="#1f5fbf">Ст В1-1 Ø32</text><text x="167" y="56.89" font-size="2.5" fill="#1f5fbf">+2,800</text><text x="115.48" y="45.4" font-size="2.5" fill="#1f5fbf">Ст В1-2 Ø32</text><text x="115.48" y="48.4" font-size="2.5" fill="#1f5fbf">+2,800</text><text x="124.73" y="75" font-size="2.5" fill="#000">±0,000</text><text x="150.79" y="118.14" font-size="2.5" fill="#000">+3,135</text><text x="175.54" y="71.09" font-size="2.5" fill="#000" textLength="8.76" lengthAdjust="spacingAndGlyphs">В1-1 Сн1**</text><text x="175.54" y="74.09" font-size="2.5" fill="#000">Н=1300*</text><text x="157.24" y="71.39" font-size="2.5" fill="#000">В1-6 См3</text><text x="157.24" y="74.39" font-size="2.5" fill="#000">Н=600*</text><text x="69.78" y="71.39" font-size="2.5" fill="#000">В1-11 Кх1</text><text x="69.78" y="74.39" font-size="2.5" fill="#000">Н=600*</text><text x="85.54" y="71.89" font-size="2.5" fill="#000">В1-12 Кх2</text><text x="85.54" y="74.89" font-size="2.5" fill="#000">Н=550*</text><text x="185.59" y="72.14" font-size="2.5" fill="#000">В1-5 См2</text><text x="185.59" y="75.14" font-size="2.5" fill="#000">Н=250*</text><text x="122.32" y="100.65" font-size="2.5" fill="#000">В1-10 Сд4</text><text x="122.32" y="103.65" font-size="2.5" fill="#000">Н=600*</text><text x="158.1" y="99.53" font-size="2.5" fill="#000">В1-7 Сд1</text><text x="158.1" y="102.53" font-size="2.5" fill="#000">Н=1200*</text><text x="98.05" y="73.12" font-size="2.5" fill="#1f5fbf">Ø20</text><text x="98.05" y="76.12" font-size="2.5" fill="#1f5fbf">L=4,30</text><text x="134.29" y="117.02" font-size="2.5" fill="#1f5fbf">Ø20</text><text x="134.29" y="120.02" font-size="2.5" fill="#1f5fbf">L=2,07</text></g></g><g data-el="legend-box"><g data-el="legend"><text x="310" y="25" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><line x1="310.5" y1="31" x2="317.5" y2="31" stroke="#1f5fbf" stroke-width="0.5"/><text x="321" y="31.9" font-size="2.5" fill="#000">В1 — водопровод хозяйственно-питьевой (ХВС), PP-R Ø20</text><circle cx="314" cy="36" r="1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/><text x="321" y="36.9" font-size="2.5" fill="#000">вывод В1 (код — в ведомости привязок)</text><circle cx="314" cy="41" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="321" y="41.9" font-size="2.5" fill="#000">стояк «Ст К1-N / Ст В1-N» (ГОСТ 21.601), Ø мм</text><circle cx="314" cy="46" r="1.1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/><text x="321" y="46.9" font-size="2.5" fill="#000">стояк в плане (на отметке пола); вертикаль — стояк по высоте,</text><text x="321" y="50.2" font-size="2.5" fill="#000">разрыв — перекрытие</text><circle cx="314" cy="54.3" r="0.6" fill="#000"/><text x="321" y="55.2" font-size="2.5" fill="#000">тройник (ответвление к прибору)</text><path d="M 312 58 L 316 60.6 L 316 58 L 312 60.6 Z" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="321" y="60.2" font-size="2.5" fill="#000">кран шаровой</text></g></g><g data-el="notes"><text x="25" y="240" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="245" font-size="2.5" fill="#000">1. Схема В1 построена по тем же трассам, что план разводки: положение в плане сохранено, глубина — в масштабе ×0,5. Трассы принципиальные; фактическое</text><text x="25" y="248.6" font-size="2.5" fill="#000">положение фиксируется исполнительной схемой до закрытия.</text><text x="25" y="252.2" font-size="2.5" fill="#000">2. Высоты Н — от чистого пола помещения, мм. Отметка прокладки магистрали В1 (в стяжке, в стене или по полу) в данных не задана: участки показаны на</text><text x="25" y="255.8" font-size="2.5" fill="#000">уровне пола условно (записи реестра нет).</text><text x="25" y="259.4" font-size="2.5" fill="#000">3. * — высота вывода принята по практике монтажа; сверить по паспорту прибора.</text><text x="25" y="263" font-size="2.5" fill="#000">4. Узел ввода В1 (кран, фильтр, счётчик, обратный клапан, кран) — на схеме разводки; состав узла ввода — по согласованию. Кран шаровой — на первом</text><text x="25" y="266.6" font-size="2.5" fill="#000">участке от стояка.</text><text x="25" y="270.2" font-size="2.5" fill="#000">5. Трубы испытать давлением до закрытия (акт скрытых работ, опрессовка по СП 73.13330.2016).</text><text x="25" y="273.8" font-size="2.5" fill="#000">6. Диаметры, высоты выводов и места кранов — по паспортам выбранных приборов и расчёту проектной организации.</text><text x="25" y="277.4" font-size="2.5" fill="#000">7. Расчёт систем, диаметры магистралей и подбор оборудования выполняет проектная организация.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="35" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="35" y1="285.5" x2="35" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="37" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="fixture:Сн1" data-ids="К-1 К-2 К-4 К-7 К-8" data-level="0"><text x="45.5" y="210.3" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="45.5" y="213.7" font-size="2.5" fill="#000">Основа листа: размеры и контуры этажей подобраны проектировщиком по составу помещений и площадям этажей с картинки 470 px (размеры на ней не читаются); обмер и исходный проект —</text><text x="45.5" y="217.1" font-size="2.5" fill="#000">задание (К-1); высоты: 1-й этаж 2800 мм, мансарда 2700 мм (горизонтальная часть) приняты; скаты кровли мансарды приняты по картинке: колено 1200 мм, уклон 45°, конёк вдоль длинной стороны;</text><text x="45.5" y="220.5" font-size="2.5" fill="#000">проект КР — задание (К-2); наружные стены 400 мм, перегородки 120 мм приняты (К-1); разрешённая мощность 15 кВт принята по типовым ТУ для частного дома (К-4); подрайон климата не задан —</text><text x="45.5" y="223.9" font-size="2.5" fill="#000">принят не северный (жилые от 2,5 м) (К-7).</text><text x="45.5" y="227.3" font-size="2.5" fill="#000">Знак «**» — предложение проектировщика, заказчиком не утверждено (согласовать с заказчиком): К-8: Сн1 — Подиум душевой зоны 100 мм — предложение проектировщика: трап в стяжке 35 мм не</text><text x="45.5" y="230.7" font-size="2.5" fill="#000">встаёт (монтажная высота трапа 90 + уклон отвода до стояка 42 = 132 мм).</text><text x="45.5" y="234.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 8, записи К-1, К-2, К-4, К-7; лист 9, запись К-8).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="midd
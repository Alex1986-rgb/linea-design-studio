 x1="220" y1="55" x2="405" y2="55" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="59.95" font-size="2.5" fill="#000">ГД-2026-010-АИ.В24</text><text x="281.5" y="59.95" font-size="2.5" fill="#000">Визуализация. Визуализация «room-living-wD»</text></g><line x1="220" y1="63" x2="405" y2="63" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="67.95" font-size="2.5" fill="#000">ГД-2026-010-АИ.В25</text><text x="281.5" y="67.95" font-size="2.5" fill="#000">Визуализация. Визуализация «room-storage1-wide»</text></g><line x1="220" y1="71" x2="405" y2="71" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="75.95" font-size="2.5" fill="#000">ГД-2026-010-АИ.В26</text><text x="281.5" y="75.95" font-size="2.5" fill="#000">Визуализация. Визуализация «room-storage2-wide»</text></g><line x1="220" y1="79" x2="405" y2="79" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="83.95" font-size="2.5" fill="#000">ГД-2026-010-АИ.В27</text><text x="281.5" y="83.95" font-size="2.5" fill="#000">Визуализация. Визуализация «room-storage3-wide»</text></g><line x1="220" y1="87" x2="405" y2="87" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="91.95" font-size="2.5" fill="#000">ГД-2026-010-АИ.В28</text><text x="281.5" y="91.95" font-size="2.5" fill="#000">Визуализация. Визуализация «room-study-wA»</text></g><line x1="220" y1="95" x2="405" y2="95" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="99.95" font-size="2.5" fill="#000">ГД-2026-010-АИ.В29</text><text x="281.5" y="99.95" font-size="2.5" fill="#000">Визуализация. Визуализация «room-study-wD»</text></g><line x1="220" y1="103" x2="405" y2="103" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="107.95" font-size="2.5" fill="#000">ГД-2026-010-АИ.В30</text><text x="281.5" y="107.95" font-size="2.5" fill="#000">Визуализация. Визуализация «room-wardrobe-wide»</text></g></g><g data-deviation="sheets-count-every-sheet"/><g data-deviation="scale-in-stamp"/><g data-deviation="elevation-1:40"/><g data-deviation="dim-font-2.5"/><g data-deviation="room-circle-8"/><g data-el="general-ref"><text x="25" y="290.2" font-size="2.5" textLength="178.6" lengthAdjust="spacingAndGlyphs" fill="#000">Общие указания — лист 6: ±0,000 — чистый пол; несущие конструкции и сети дома — по отдельному проекту; скрытые работы — по актам. Открытые вопросы и допущения — лист 7.</text><g data-el="open-issues-ref" data-target="7"/></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4" data-level="0"><text x="212.5" y="216.6" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="212.5" y="220" font-size="2.5" fill="#000">Основа листа: размеры и контуры этажей подобраны проектировщиком по составу помещений и площадям этажей с картинки 470 px (размеры на</text><text x="212.5" y="223.4" font-size="2.5" fill="#000">ней не читаются); обмер и исходный проект — задание (К-1); высоты: 1-й этаж 2800 мм, мансарда 2700 мм (горизонтальная часть) приняты; скаты</text><text x="212.5" y="226.8" font-size="2.5" fill="#000">кровли мансарды приняты по картинке: колено 1200 мм, уклон 45°, конёк вдоль длинной стороны; проект КР — задание (К-2); наружные стены 400</text><text x="212.5" y="230.2" font-size="2.5" fill="#000">мм, перегородки 120 мм приняты (К-1); разрешённая мощность 15 кВт принята по типовым ТУ для частного дома (К-4).</text><text x="212.5" y="233.6" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 7, записи К-1, К-2, К-4).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1=
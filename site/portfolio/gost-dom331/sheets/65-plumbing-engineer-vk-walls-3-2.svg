2.19" stroke="#000" stroke-width="0.5"/><line x1="221.54" y1="161.81" x2="223.66" y2="159.69" stroke="#000" stroke-width="0.5"/><text x="221.6" y="66.63" font-size="2.5" text-anchor="middle" transform="rotate(-90 221.6 66.63)" fill="#000">1465</text><text x="221.6" y="132" font-size="2.5" text-anchor="middle" transform="rotate(-90 221.6 132)" fill="#000">1150</text></g><text x="214.6" y="161.55" font-size="2.5" text-anchor="end" fill="#000">−0,015</text><text x="214.6" y="30.8" font-size="2.5" text-anchor="end" fill="#000">+2,600</text><line x1="215.4" y1="160.75" x2="218.6" y2="160.75" stroke="#000" stroke-width="0.25"/><line x1="215.4" y1="30" x2="218.6" y2="30" stroke="#000" stroke-width="0.25"/></g><g data-el="outlet-table"><text x="25" y="192.75" font-size="3.5" font-weight="700" fill="#000">Ведомость привязок выводов (от чистого пола и угла)</text><rect x="25" y="194.75" width="287" height="20" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="202.75" x2="312" y2="202.75" stroke="#000" stroke-width="0.5"/><text x="37.51" y="200.05" font-size="2.5" text-anchor="middle" data-fit="24.02" fill="#000">Код</text><line x1="50.02" y1="194.75" x2="50.02" y2="214.75" stroke="#000" stroke-width="0.25"/><text x="103.32" y="200.05" font-size="2.5" text-anchor="middle" data-fit="105.6" fill="#000">Прибор</text><line x1="156.61" y1="194.75" x2="156.61" y2="214.75" stroke="#000" stroke-width="0.25"/><text x="165.25" y="200.05" font-size="2.5" text-anchor="middle" data-fit="16.26" fill="#000">Ø</text><line x1="173.88" y1="194.75" x2="173.88" y2="214.75" stroke="#000" stroke-width="0.25"/><text x="185.89" y="200.05" font-size="2.5" text-anchor="middle" data-fit="23.02" fill="#000">Н, мм</text><line x1="197.89" y1="194.75" x2="197.89" y2="214.75" stroke="#000" stroke-width="0.25"/><text x="254.95" y="200.05" font-size="2.5" text-anchor="middle" data-fit="113.11" fill="#000">Привязка, мм</text><line x1="25" y1="208.75" x2="312" y2="208.75" stroke="#000" stroke-width="0.18"/><text x="26.5" y="207.05" font-size="2.5" text-anchor="start" data-fit="22.02" fill="#000">Т3-3</text><text x="51.52" y="207.05" font-size="2.5" text-anchor="start" data-fit="103.6" fill="#000">Сн4 полотенцесушитель</text><text x="158.11" y="207.05" font-size="2.5" text-anchor="start" data-fit="14.26" fill="#000">½″</text><text x="175.38" y="207.05" font-size="2.5" text-anchor="start" data-fit="21.02" fill="#000">1150*</text><text x="199.39" y="207.05" font-size="2.5" text-anchor="start" data-fit="111.11" fill="#000">ст. Г: 341 от лев. угла</text><text x="26.5" y="213.05" font-size="2.5" text-anchor="start" data-fit="22.02" fill="#000">Т3-4</text><text x="51.52" y="213.05" font-size="2.5" text-anchor="start" data-fit="103.6" fill="#000">Сн4 полотенцесушитель</text><text x="158.11" y="213.05" font-size="2.5" text-anchor="start" data-fit="14.26" fill="#000">½″</text><text x="175.38" y="213.05" font-size="2.5" text-anchor="start" data-fit="21.02" fill="#000">1150*</text><text x="199.39" y="213.05" font-size="2.5" text-anchor="start" data-fit="111.11" fill="#000">ст. Г: 791 от лев. угла</text></g><g data-el="legend"><text x="320" y="192.75" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><circle cx="324" cy="198.75" r="1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/><text x="331" y="199.65" font-size="2.5" fill="#000">вывод В1 (код — в ведомости привязок)</text><circle cx="324" cy="203.75" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/><text x="331" y="204.65" font-size="2.5" fill="#000">вывод Т3 (код — в ведомости привязок)</text><circle cx="324" cy="208.75" r="1" fill="#fff" stroke="#6b4f2a" stroke-width="0.35"/><text x="331" y="209.65" font-size="2.5" fill="#000">вывод К1 (код — в ведомости привязок)</text><rect x="320.5" y="211.75" width="7" height="4" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="331" y="214.65" font-size="2.5" fill="#000">сантехприбор по расстановке (габарит модели)</text><rect x="320.5" y="216.75" width="7" height="4" fill="#fff" stroke="#000" stroke-width="0.25" stroke-dasharray="2 0.8"/><text x="331" y="219.65" font-size="2.5" fill="#000">дверной проём; окно — сплошной контур</text></g><g data-el="notes"><text x="25" y="240" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="245" font-size="2.5" fill="#000">1. Габариты и высоты приборов, межосевые смесителей и места кранов — по паспортам выбранных приборов, сверяются до разметки стен.</text><text x="25" y="248.6" font-size="2.5" fill="#000">2. Высоты Н — от чистого пола помещения, мм; отметка чистого пола и потолка — у левого края вида (от ±0,000 объекта). Привязки — от левого чистового</text><text x="25" y="252.2" font-size="2.5" fill="#000">угла вида (облицовка стен вычтена), как на развёртках стен.</text><text x="25" y="255.8" font-size="2.5" fill="#000">3. * — высота принята по практике монтажа: в данных прибора её нет; до разметки стен сверить по паспорту выбранного прибора (смеситель,</text><text x="25" y="259.4" font-size="2.5" fill="#000">инсталляция, сифон).</text><text x="25" y="263" font-size="2.5" fill="#000">4. Выводы в полу (К1-1): трап, лоток, выпуск отдельностоящей ванны, подвод к стойке напольного смесителя — на развёртке их нет; место и пирог пола</text><text x="25" y="266.6" font-size="2.5" fill="#000">лист «Схема разводки» (профиль К1, узел 1).</text><text x="25" y="270.2" font-size="2.5" fill="#000">5. Стояки в помещении: Ст К1-1 Ø110, Ст В1-1 Ø32, Ст Т3-1 Ø32 — положение на плане выводов; выводы подключаются к ним по схеме разводки.</text><text x="25" y="273.8" font-size="2.5" fill="#000">6. Ревизионные люки к арматуре и ревизиям в данных не заданы: место и размер не определены (записи реестра нет).</text><text x="25" y="277.4" font-size="2.5" fill="#000">7. Помещение «Санузел 1 этажа» — 2 листа: стены 1) А, Б; 2) В, Г.</text><text x="25" y="281" font-size="2.5" fill="#000">8. Расчёт систем водоснабжения и канализации и подбор оборудования выполняет проектная организация; лист задаёт места и высоты выводов.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="75" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="75" y1="285.5" x2="75" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="77" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="fixture:Сн1" data-ids="К-1 К-2 К-4 К-7 К-8" data-level="0"><text x="313.5" y="135.1" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="313.5" y="138.5" font-size="2.5" fill="#000">Основа листа: размеры и контуры этажей подобраны проектировщиком по</text><text x="313.5" y="141.9" font-size="2.5" fill="#000">составу помещений и площадям этажей с картинки 470 px (размеры на ней не</text><text x="313.5" y="145.3" font-size="2.5" fill="#000">читаются); обмер и исходный проект — задание (К-1); высоты: 1-й этаж 2800</text><text x="313.5" y="148.7" font-size="2.5" fill="#000">мм, мансарда 2700 мм (горизонтальная часть) приняты; скаты кровли</text><text x="313.5" y="152.1" font-size="2.5" fill="#000">мансарды приняты по картинке: колено 1200 мм, уклон 45°, конёк вдоль</text><text x="313.5" y="155.5" font-size="2.5" fill="#000">длинной стороны; проект КР — задание (К-2); наружные стены 400 мм,</text><text x="313.5" y="158.9" font-size="2.5" fill="#000">перегородки 120 мм приняты (К-1); разрешённая мощность 15 кВт принята по</text><text x="313.5" y="162.3" font-size="2.5" fill="#000">типовым ТУ для частного дома (К-4); подрайон климата не задан — принят не</text><text x="313.5" y="165.7" font-size="2.5" fill="#000">северный (жилые от 2,5 м) (К-7).</text><text x="313.5" y="169.1" font-size="2.5" fill="#000">Знак «**» — предложение проектировщика, заказчиком не утверждено</text><text x="313.5" y="172.5" font-size="2.5" fill="#000">(согласовать с заказчиком): К-8: Сн1 — Подиум душевой зоны 100 мм —</text><text x="313.5" y="175.9" font-size="2.5" fill="#000">предложение проектировщика: трап в стяжке 35 мм не встаёт (монтажная</text><text x="313.5" y="179.3" font-size="2.5" fill="#000">высота трапа 90 + уклон отвода до стояка 42 = 132 мм).</text><text x="313.5" y="182.7" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 8, записи К-1, К-2, К-4, К-7; лист 9, запись</text><text x="313.5" y="186.1" font-size="2.5" fill="#000">К-8).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" s
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты</text><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации (стартовое совещание 18.10.2026)</text><g data-el="open-issues" data-plan="fixed" data-plan-declared="1"><text x="25" y="27.2" font-size="2.5" fill="#000">Комплект предварительный по пунктам этих таблиц. Пока по пункту нет ответа или решения, показанное на указанном листе — допущение проектировщика, а не утверждённое решение.</text><text x="25" y="30.6" font-size="2.5" fill="#000">Сводка: открытых вопросов — 5 (из них ждут факта объекта — 3: контрольного обмера, обследования или документа).</text><text x="25" y="34" font-size="2.5" fill="#000">Пункты, ответ на которые лежит на объекте, а не за столом проектировщика (графа «Вид», строка «Ждёт»), собраны на листе «Задание на контрольный обмер и обследование» (листы 8–10): что и где замерить, с какой точностью и чем подтвердить. Пункты, ждущие решения человека, на объекте не</text><text x="25" y="37.4" font-size="2.5" fill="#000">закрываются.</text><g data-el="issues-questions"><text x="25" y="49" font-size="3.5" font-weight="700" fill="#000">Открытые вопросы и принятые допущения</text><rect x="25" y="51.6" width="385" height="112" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="61.6" x2="410" y2="61.6" stroke="#000" stroke-width="0.5"/><text x="32" y="57.5" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="51.6" x2="39" y2="163.6" stroke="#000" stroke-width="0.25"/><text x="122" y="57.5" font-size="2.5" text-anchor="middle" fill="#000">Формулировка</text><line x1="205" y1="51.6" x2="205" y2="163.6" stroke="#000" stroke-width="0.25"/><text x="220" y="57.5" font-size="2.5" text-anchor="middle" fill="#000">Вид</text><line x1="235" y1="51.6" x2="235" y2="163.6" stroke="#000" stroke-width="0.25"/><text x="253" y="57.5" font-size="2.5" text-anchor="middle" fill="#000">Кто решает</text><line x1="271" y1="51.6" x2="271" y2="163.6" stroke="#000" stroke-width="0.25"/><text x="309.5" y="57.5" font-size="2.5" text-anchor="middle" fill="#000">Если решения нет</text><line x1="348" y1="51.6" x2="348" y2="163.6" stroke="#000" stroke-width="0.25"/><text x="379" y="57.5" font-size="2.5" text-anchor="middle" fill="#000">Лист, где это проявляется</text><g data-el="issue-row" data-kind="question" data-id="К-1"><text x="32" y="65.3" font-size="2.5" text-anchor="middle" fill="#000">К-1</text><text x="40.5" y="65.3" font-size="2.5" fill="#000">Размеры дома на картинке заказчика (470 px) не читаются: состав помещений и форма сняты с картинки, размеры подобраны</text><text x="40.5" y="68.7" font-size="2.5" fill="#000">проектировщиком под площади этажей 185,80 и 145,73 м². Нужен исходный проект дома (АР) или обмер.</text><text x="206.5" y="65.3" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="68.7" font-size="2.5" fill="#000">Ждёт: обмера</text><text x="236.5" y="65.3" font-size="2.5" fill="#000">Архитектор-планировщик</text><text x="272.5" y="65.3" font-size="2.5" fill="#000">размеры на листах — предложение проектировщика;</text><text x="272.5" y="68.7" font-size="2.5" fill="#000">мебель на заказ и материалы по ним не заказывать</text><text x="349.5" y="65.3" font-size="2.5" fill="#000">л. 15, 16 — Обмерный план</text><text x="349.5" y="68.7" font-size="2.5" fill="#000">л. 15, 17, 19, 22, 24, 31, 33, 35, 41, 43, 45, 47, 49,</text><text x="349.5" y="72.1" font-size="2.5" fill="#000">51, 55, 60, 63, 74, 80, 104–106 — 1-й этаж</text><text x="349.5" y="75.5" font-size="2.5" fill="#000">л. 24, 25 — План расстановки мебели</text><text x="349.5" y="78.9" font-size="2.5" fill="#000">л. 15, 17, 19, 22, 24, 31, 33, 35, 41, 43, 45, 47, 49,</text><text x="349.5" y="82.3" font-size="2.5" fill="#000">51, 55, 60, 63, 74, 80, 104–106 — 1-й этаж</text></g><line x1="25" y1="85.4" x2="410" y2="85.4" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-2"><text x="32" y="89.1" font-size="2.5" text-anchor="middle" fill="#000">К-2</text><text x="40.5" y="89.1" font-size="2.5" fill="#000">Высоты этажей и кровля не известны: приняты 2800 мм (1-й этаж) и 2700 мм (горизонтальная часть потолка мансарды); скаты</text><text x="40.5" y="92.5" font-size="2.5" fill="#000">двускатная кровля, конёк вдоль длинной стороны, колено 1200 мм, уклон 45° (по перспективе и фасаду с картинки).</text><text x="206.5" y="89.1" font-size="2.5" fill="#000">Отсутствует</text><text x="236.5" y="89.1" font-size="2.5" fill="#000">Архитектор-планировщик</text><text x="272.5" y="89.1" font-size="2.5" fill="#000">высоты — принятые, уточнить по проекту АР</text><text x="349.5" y="89.1" font-size="2.5" fill="#000">л. 15, 16 — Обмерный план</text><text x="349.5" y="92.5" font-size="2.5" fill="#000">л. 15, 17, 19, 22, 24, 31, 33, 35, 41, 43, 45, 47, 49,</text><text x="349.5" y="95.9" font-size="2.5" fill="#000">51, 55, 60, 63, 74, 80, 104–106 — 1-й этаж</text><text x="349.5" y="99.3" font-size="2.5" fill="#000">л. 55, 56 — План потолков</text><text x="349.5" y="102.7" font-size="2.5" fill="#000">л. 15, 17, 19, 22, 24, 31, 33, 35, 41, 43, 45, 47, 49,</text><text x="349.5" y="106.1" font-size="2.5" fill="#000">51, 55, 60, 63, 74, 80, 104–106 — 1-й этаж</text></g><line x1="25" y1="109.2" x2="410" y2="109.2" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-4"><text x="32" y="112.9" font-size="2.5" text-anchor="middle" fill="#000">К-4</text><text x="40.5" y="112.9" font-size="2.5" fill="#000">Разрешённая мощность дома по ТУ неизвестна, принята 15 кВт.</text><text x="206.5" y="112.9" font-size="2.5" fill="#000">Отсутствует</text><text x="236.5" y="112.9" font-size="2.5" fill="#000">Инженер-электрик</text><text x="272.5" y="112.9" font-size="2.5" fill="#000">щит и группы рассчитаны на 15 кВт; при меньших ТУ</text><text x="272.5" y="116.3" font-size="2.5" fill="#000">пересчёт</text><text x="349.5" y="112.9" font-size="2.5" fill="#000">л. 39 — Однолинейная схема щита</text><text x="349.5" y="116.3" font-size="2.5" fill="#000">л. 31, 32 — План розеток и электровыводов</text><text x="349.5" y="119.7" font-size="2.5" fill="#000">л. 15, 17, 19, 22, 24, 31, 33, 35, 41, 43, 45, 47, 49,</text><text x="349.5" y="123.1" font-size="2.5" fill="#000">51, 55, 60, 63, 74, 80, 104–106 — 1-й этаж</text></g><line x1="25" y1="126.2" x2="410" y2="126.2" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-5"><text x="32" y="129.9" font-size="2.5" text-anchor="middle" fill="#000">К-5</text><text x="40.5" y="129.9" font-size="2.5" fill="#000">Планировка этажей — предложение проектировщика по составу помещений с картинки (несущие стены, лестница, перекрытие не</text><text x="40.5" y="133.3" font-size="2.5" fill="#000">известны): нужен проект АР/КР дома.</text><text x="206.5" y="129.9" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="133.3" font-size="2.5" fill="#000">Ждёт: документа</text><text x="236.5" y="129.9" font-size="2.5" fill="#000">Архитектор-планировщик</text><text x="272.5" y="129.9" font-size="2.5" fill="#000">перегородки и проёмы — предложение, к строительству не</text><text x="272.5" y="133.3" font-size="2.5" fill="#000">выдаются</text><text x="349.5" y="129.9" font-size="2.5" fill="#000">л. 15, 16 — Обмерный план</text><text x="349.5" y="133.3" font-size="2.5" fill="#000">л. 15, 17, 19, 22, 24, 31, 33, 35, 41, 43, 45, 47, 49,</text><text x="349.5" y="136.7" font-size="2.5" fill="#000">51, 55, 60, 63, 74, 80, 104–106 — 1-й этаж</text></g><line x1="25" y1="139.8" x2="410" y2="139.8" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-6" data-unresolved="1"><text x="32" y="143.5" font-size="2.5" text-anchor="middle" fill="#000">К-6</text><text x="40.5" y="143.5" font-size="2.5" fill="#000">Лестница Л-1 на картинке заказчика — одномаршевая в холле 1-го этажа (3,0×3,6 м), видно 11 проступей. До пола мансарды +3,150</text><text x="40.5" y="146.9" font-size="2.5" fill="#000">нужно 18 подъёмов по 175 мм (равные ступени — СП 55.13330.2016 п. 8.2), то есть 17 проступей по 280 мм = 4,76 м длины марша; в</text><text x="40.5" y="150.3" font-size="2.5" fill="#000">холл 3,48 м в свету одномаршевая не встаёт (не хватает 1,66 м). Варианты: Г-образная с 3 забежными ступенями (8 + 3 + 6</text><text x="40.5" y="153.7" font-size="2.5" fill="#000">подъёмов по 175 — встаёт в холл 3,24×2,68 м; при детях забежные — компромисс), Г-образная с площадкой (9 + 7 подъёмов по</text><text x="40.5" y="157.1" font-size="2.5" fill="#000">197 мм — круче практики 150–180, для дома допустимо: уклон не нормируется, СП 55 п. 7.5), перенос лестницы или иная высота</text><text x="40.5" y="160.5" font-size="2.5" fill="#000">этажа по проекту АР/КР. Нужны: решение по типу марша и проект АР/КР (высота этажа, перекрытие, проём).</text><text x="206.5" y="143.5" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="146.9" font-size="2.5" fill="#000">Ждёт: обмера, затем</text><text x="206.5" y="150.3" font-size="2.5" fill="#000">решения</text><text x="236.5" y="143.5" font-size="2.5" fill="#000">Архитектор-планировщик</text><text x="272.5" y="143.5" font-size="2.5" fill="#000">марш на планах и лист «Лестница Л-1» — по картинке (11</text><text x="272.5" y="146.9" font-size="2.5" fill="#000">проступей, до отм. +2,100), ограждение и проём считаются</text><text x="272.5" y="150.3" font-size="2.5" fill="#000">по этому габариту; изделие не заказывать, проём в</text><text x="272.5" y="153.7" font-size="2.5" fill="#000">перекрытии не резать</text><text x="349.5" y="143.5" font-size="2.5" fill="#000">architect/stairs-л-1 (лист по названию не найден)</text></g></g><g data-el="notes"><text x="25" y="176" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="180.8" font-size="2.5" fill="#000">1. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text><text x="25" y="184.2" font-size="2.5" fill="#000">2. Графа «Если решения нет» показывает состояние решения на листах; влияние на сроки и стоимость по пунктам не оценивалось.</text><text x="25" y="187.6" font-size="2.5" fill="#000">3. Пункт, по которому принято решение, при следующем выпуске комплекта из таблиц исключается.</text></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" fill="#000">19.10.26</text><text x="231" y="270.8" font-size="2.5" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" fill="#000">ГД-2026-010-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" fill="#000">Дом 331 м²</text><text x="297" y="259.2" font-size="2.5" fill="#000">Общая площадь 270,67* м² · * размеры приняты, не замерены (реестр — л. 7, К-1)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" fill="#000">Дизайн-проект интерьера</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">7</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">155</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="283.2" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и</text><text x="330" y="287" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">конфликты</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="5" data-positions="39" data-basis="4"><rect x="318.03" y="6.2" width="95.47" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="320.03" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 5 (реестр — л. 7)</text></g></svg>
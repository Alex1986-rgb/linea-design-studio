<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Шкафы. Монтажная схема" data-sheet="furniture-mount" data-scale="1:25"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Шкафы. Монтажная схема</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">крепление к стене, установочные размеры, зазоры под отделку · размеры в мм</text><defs><pattern id="fm-hatch" patternUnits="userSpaceOnUse" width="2" height="2"><line x1="0" y1="2" x2="2" y2="0" stroke="#000" stroke-width="0.18"/></pattern><pattern id="fm-appl" patternUnits="userSpaceOnUse" width="3" height="3"><line x1="0" y1="3" x2="3" y2="0" stroke="#000" stroke-width="0.18"/><line x1="0" y1="0" x2="3" y2="3" stroke="#000" stroke-width="0.18"/></pattern><pattern id="fm-wall" patternUnits="userSpaceOnUse" width="1.6" height="1.6"><line x1="0" y1="1.6" x2="1.6" y2="0" stroke="#000" stroke-width="0.18"/></pattern></defs><g data-el="elevation"><text x="88.18" y="24" font-size="3.5" text-anchor="middle" font-weight="700" text-decoration="underline" fill="#000" textLength="45.33" lengthAdjust="spacingAndGlyphs">Шкаф-купе М5** (пом. 4) (М 1:25)</text><path d="M 43.4 145 L 132.96 145" fill="none" stroke="#000" stroke-width="0.5"/><path d="M 43.4 43 L 132.96 43" fill="none" stroke="#000" stroke-width="0.5"/><rect x="43.4" y="41.4" width="89.56" height="1.6" fill="url(#fm-wall)" stroke="none"/><rect x="43" y="43" width="2" height="102" fill="url(#fm-wall)" stroke="#000" stroke-width="0.5"/><g data-el="level" data-v="0"><path d="M 26 144 L 27 145 L 28 144" fill="none" stroke="#000" stroke-width="0.25"/><line x1="27" y1="144" x2="39" y2="144" stroke="#000" stroke-width="0.25"/><text x="28" y="143.2" font-size="2.5" fill="#000">±0,00
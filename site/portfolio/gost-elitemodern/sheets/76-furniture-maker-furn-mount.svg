" font-size="2.5" text-anchor="middle" fill="#000">559</text><line x1="67.36" y1="146" x2="67.36" y2="154" stroke="#000" stroke-width="0.25"/><line x1="131.36" y1="146" x2="131.36" y2="154" stroke="#000" stroke-width="0.25"/><line x1="67.36" y1="152" x2="131.36" y2="152" stroke="#000" stroke-width="0.25"/><line x1="66.3" y1="153.06" x2="68.42" y2="150.94" stroke="#000" stroke-width="0.5"/><line x1="130.3" y1="153.06" x2="132.42" y2="150.94" stroke="#000" stroke-width="0.5"/><text x="99.36" y="151" font-size="2.5" text-anchor="middle" fill="#000">1600</text></g><g data-el="finish-gaps"><text x="25" y="169" font-size="3.5" font-weight="700" fill="#000">Крепление и зазоры под отделку</text><rect x="25" y="171" width="206" height="17.4" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="179" x2="231" y2="179" stroke="#000" stroke-width="0.5"/><text x="31" y="176.3" font-size="2.5" text-anchor="middle" data-fit="11" fill="#000">Марка</text><line x1="37" y1="171" x2="37" y2="188.4" stroke="#000" stroke-width="0.25"/><text x="57" y="176.3" font-size="2.5" text-anchor="middle" data-fit="39" fill="#000">Помещение, стена</text><line x1="77" y1="171" x2="77" y2="188.4" stroke="#000" stroke-width="0.25"/><text x="97" y="176.3" font-size="2.5" text-anchor="middle" data-fit="39" fill="#000">Основание</text><line x1="117" y1="171" x2="117" y2="188.4" stroke="#000" stroke-width="0.25"/><text x="133" y="176.3" font-size="2.5" text-anchor="middle" data-fit="31" fill="#000">Отделка стены</text><line x1="149" y1="171" x2="149" y2="188.4" stroke="#000" stroke-width="0.25"/><text x="157" y="176.3" font-size="2.5" text-anchor="middle" data-fit="15" fill="#000">Зазор, мм</text><line x1="165" y1="171" x2="165" y2="188.4" stroke="#000" stroke-width="0.25"/><text x="183" y="176.3" font-size="2.5" text-anchor="middle" data-fit="35" fill="#000">Крепёж по планке</text><line x1="201" y1="171" x2="201" y2="188.4" stroke="#000" stroke-width="0.25"/><text x="216" y="176.3" font-size="2.5" text-anchor="middle" data-fit="29" fill="#000">От опрокидывания</text><text x="26.5" y="183.3" font-size="2.5" text-anchor="start" data-fit="9" fill="#000">М5**</text><text x="38.5" y="183.3" font-size="2.5" text-anchor="start" data-fit="37" fill="#000">Прихожая (4), стена Б</text><text x="78.5" y="183.3" font-size="2.5" text-anchor="start" data-fit="37" fill="#000">по основанию — см. таблицу</text><text x="78.5" y="186.7" font-size="2.5" text-anchor="start" data-fit="37" fill="#000">крепежа</text><text x="118.5" y="183.3" font-size="2.5" text-anchor="start" data-fit="29" fill="#000">окраска</text><text x="150.5" y="183.3" font-size="2.5" text-anchor="start" data-fit="13" fill="#000">5</text><text x="166.5" y="183.3" font-size="2.5" text-anchor="start" data-fit="33" fill="#000">анкер 4 шт., шаг 500</text><text x="202.5" y="183.3" font-size="2.5" text-anchor="start" data-fit="27" fill="#000">уголки 2 шт.</text></g><g data-el="anchors-table"><text x="235" y="169" font-size="3.5" font-weight="700" fill="#000">Крепёж по основанию стены</text><rect x="235" y="171" width="174" height="32" fill="none" stroke="#000" stroke-width="0.5"/><line x1="235" y1="179" x2="409" y2="179" stroke="#000" stroke-width="0.5"/><text x="253" y="176.3" font-size="2.5" text-anchor="middle" data-fit="35" fill="#000">Основание стены</text><line x1="271" y1="171" x2="271" y2="203" stroke="#000" stroke-width="0.25"/><text x="340" y="176.3" font-size="2.5" text-anchor="middle" data-fit="137" fill="#000">Крепёж</text><line x1="235" y1="185" x2="409" y2="185" stroke="#000" stroke-width="0.18"/><text x="236.5" y="183.3" font-size="2.5" text-anchor="start" data-fit="33" fill="#000">бетон, ж/б</text><text x="272.5" y="183.3" font-size="2.5" text-anchor="start" data-fit="135" fill="#000">анкер-шуруп 7,5×72 или дюбель 8×60 с шурупом 5×70</text><line x1="235" y1="191" x2="409" y2="191" stroke="#000" stroke-width="0.18"/><text x="236.5" y="189.3" font-size="2.5" text-anchor="start" data-fit="33" fill="#000">кирпич полнотелый</text><text x="272.5" y="189.3" font-size="2.5" text-anchor="start" data-fit="135" fill="#000">дюбель 8×80 с шурупом 5×90</text><line x1="235" y1="197" x2="409" y2="197" stroke="#000" stroke-width="0.18"/><text x="236.5" y="195.3" font-size="2.5" text-anchor="start" data-fit="33" fill="#000">газобетон, пазогребень</text><text x="272.5" y="195.3" font-size="2.5" text-anchor="start" data-fit="135" fill="#000">дюбель для газобетона 10×100 или химический анкер</text><text x="236.5" y="201.3" font-size="2.5" text-anchor="start" data-fit="33" fill="#000">гипсокартон</text><text x="272.5" y="201.3" font-size="2.5" text-anchor="start" data-fit="135" fill="#000">закладная до обшивки (брус 40×80 или фанера 18 мм), саморез в закладную</text></g><g data-el="legend"><text x="25" y="211" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><path d="M 28.45 217.1 L 32.05 220.7" fill="none" stroke="#000" stroke-width="0.35"/><path d="M 28.45 220.7 L 32.05 217.1" fill="none" stroke="#000" stroke-width="0.35"/><text x="39" y="219.4" font-size="2.5" fill="#000">анкер / уголок крепления к стене</text><rect x="25" y="223.1" width="10.5" height="4.6" fill="#ece7df" stroke="#000" stroke-width="0.25"/><text x="39" y="225.9" font-size="2.5" fill="#000">корпус и полки ЛДСП (вид на стену)</text><rect x="25" y="229.6" width="10.5" height="4.6" fill="url(#fm-hatch)" stroke="#000" stroke-width="0.25"/><text x="39" y="232.4" font-size="2.5" fill="#000">компенсатор — короб до потолка</text></g><g data-el="notes"><text x="121" y="211" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="121" y="216" font-size="2.5" fill="#000">1. Установочные размеры — от чистого пола и чистых стен; перед установкой</text><text x="121" y="219.6" font-size="2.5" fill="#000">контрольный замер после отделки.</text><text x="121" y="223.2" font-size="2.5" fill="#000">2. Порядок: корпус выставить по уровню опорами цоколя → закрепить к стене по</text><text x="121" y="226.8" font-size="2.5" fill="#000">задней планке → навесить двери и фасады, отрегулировать зазоры → подогнать и</text><text x="121" y="230.4" font-size="2.5" fill="#000">закрепить компенсатор.</text><text x="121" y="234" font-size="2.5" fill="#000">3. Анкеры — с шагом не более 500 мм, не ближе 50 мм от края планки; на ГКЛ</text><text x="121" y="237.6" font-size="2.5" fill="#000">только в закладную, установленную до обшивки.</text><text x="121" y="241.2" font-size="2.5" fill="#000">4. Скрытые коммуникации под анкеры проверить детектором; трассы электрики</text><text x="121" y="244.8" font-size="2.5" fill="#000">по плану розеток.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="65" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="65" y1="285.5" x2="65" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="67" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="furniture:М5" data-ids="К-1 К-2 К-3 К-5 К-6 К-7 К-9 К-26" data-level="0"><text x="25.5" y="258.3" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="261.7" font-size="2.5" fill="#000">Основа листа: планировка по обводу плана заказчика, не замерена (К-1); высота до плиты 2650 мм от чистого пола — решение автора (ИЗ-1); отметки плана потолков сдвинуты на -95</text><text x="25.5" y="265.1" font-size="2.5" fill="#000">мм (+2.745 плана = низ плиты), не замерено (К-2); толщины стен приняты: наружные 260 мм, перегородки 130 мм (К-1); положение стен и проёмов — по брифу без обмера и плана</text><text x="25.5" y="268.5" font-size="2.5" fill="#000">БТИ (К-1); разрешённая мощность 10 кВт принята, ТУ не переданы (К-6); вентканалы приняты, в брифе не заданы (К-5); тип дома, перекрытие и несущие стены не известны —</text><text x="25.5" y="271.9" font-size="2.5" fill="#000">документов нет (К-3); плита электрическая — принята, в брифе не указано (К-6); система заземления TN-C-S принята, ТУ не переданы (К-6); число жильцов 2 принято, в брифе не</text><text x="25.5" y="275.3" font-size="2.5" fill="#000">указано (К-9); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-26).</text><text x="25.5" y="278.7" font-size="2.5" fill="#000">Знак «**» — предложение проектировщика, заказчиком не утверждено (согласовать с заказчиком): К-7: М5.</text><text x="25.5" y="282.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1, К-3, К-5–К-7, К-9; лист 7, запись К-26).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><l
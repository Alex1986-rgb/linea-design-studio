<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Аксонометрическая схема Т3 (горячее водоснабжение)" data-sheet="plumbing" data-scale="1:50"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Аксонометрическая схема Т3 (горячее водоснабжение)</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">аксонометрия · диаметры, уклоны, отметки, стояки и приборы · трассы принципиальные</text><g data-el="view" data-scale="1:50"><text x="25" y="22" font-size="3.5" font-weight="700" fill="#000">Схема Т3 (М 1:50; по вертикали и горизонтали один масштаб, глубина — ×0,5 под 45°)</text><g data-el="rooms-ctx"><path d="M 136.46 103.15 L 213.36 103.15 L 192.71 123.8 L 115.81 123.8 Z" fill="none" stroke="#9a9a9a" stroke-width="0.18"/><path d="M 63.06 103.15 L 84.76 103.15 L 72.7 115.21 L 51 115.21 Z" fill="none" stroke="#9a9a9a" stroke-width="0.18"/><path d="M 87.36 103.15 L 133.86 103.15 L 121.8 115.21 L 75.3 115.21 Z" fill="none" stroke="#9a9a9a" stroke-width="0.18"/></g><g data-el="pipes"><path d="M 100.81 104 L 100.45 104.35 L 186.95 104.35 L 188.16 103.15" fill="none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><path d="M 188.16 103.15 L 188.16 91.15" fill="none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><path d="M 100.45 104.35 L 65.25 104.35 L 60.09 109.52 L 56.69 109.52" fill="none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><path d="M 56.69 109.52 L 56.69 98.52" fill="none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><path d="M 129.25 104.35 L 124.98 108.63 L 128.38 108.63" fill="none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><path d="M 128.38 108.63 L 128.38 92.63" fill="none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><path d="M 89.55 104.35 L 84.04 109.87 L 80.64 109.87" fill="none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><path d="M 80.64 109.87 L 80.64 98.87" fill="none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><path d="M 78.55 104.35 L 79.76 103.15" fill="none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><path d="M 79.76 103.15 L 79.76 88.15" fill="none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/></g><g data-el="pl-marks"><circle cx="100.45" cy="104.35" r="0.6" fill="#c0392b"/><circle cx="129.25" cy="104.35" r="0.6" fill="#c0392b"/><circle cx="89.55" cy="104.35" r="0.6" fill="#c0392b"/><circle cx="78.55" cy="104.35" r="0.6" fill="#c0392b"/><g data-el="pl-outlet" data-index="Т3"><circle cx="188.16" cy="91.15" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="Т3"><circle cx="56.69" cy="98.52" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="Т3"><circle cx="128.38" cy="92.63" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="Т3"><circle cx="80.64" cy="98.87" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="Т3"><circle cx="79.76" cy="88.15" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/></g></g><g data-el="risers"><g data-el="riser" data-index="Т3"><path d="M 100.81 109 L 100.81 51" fill="none" stroke="#c0392b" stroke-width="0.7" stroke-dasharray="1.6 1"/><path d="M 99.01 108.5 L 100.21 109.5 L 101.41 108.5 L 102.61 109.5" fill="none" stroke="#000" stroke-width="0.25"/><path d="M 99.01 50.5 L 100.21 51.5 L 101.41 50.5 L 102.61 51.5" fill="none" stroke="#000" stroke-width="0.25"/><circle cx="100.81" cy="104" r="1.1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/></g></g><g data-el="pl-labels"><text x="97.19" y="124.4" font-size="2.5" fill="#555">5 Кухня-столовая</text><text x="39.27" y="115.81" font-size="2.5" fill="#555">2 Санузел</text><text x="70.9" y="119.01" font-size="2.5" fill="#555">3 Ванная</text><text x="94.52" y="45.4" font-size="2.5" fill="#c0392b">Ст Т3-3* Ø32</text><text x="94.52" y="48.4" font-size="2.5" fill="#c0392b">+2,650</text><text x="104.11" y="100" font-size="2.5" fill="#000">−0,015</text><text x="190.06" y="90.25" font-size="2.5" fill="#000">Т3-5 П1</text><text x="190.06" y="93.25" font-size="2.5" fill="#000">Н=600</text><text x="58.59" y="97.62" font-size="2.5" fill="#000">Т3-2 П7</text><text x="58.59" y="100.62" font-size="2.5" fill="#000">Н=550</text><text x="130.28" y="91.73" font-size="2.5" fill="#000" textLength="7.7" lengthAdjust="spacingAndGlyphs">Т3-3 П9**</text><text x="130.28" y="94.73" font-size="2.5" fill="#000">Н=800</text><text x="82.54" y="97.97" font-size="2.5" fill="#000" textLength="8.67" lengthAdjust="spacingAndGlyphs">Т3-4 П10**</text><text x="82.54" y="100.97" font-size="2.5" fill="#000">Н=550</text><text x="81.66" y="87.25" font-size="2.5" fill="#000" textLength="7.7" lengthAdjust="spacingAndGlyphs">Т3-1 П5**</text><text x="81.66" y="90.25" font-size="2.5" fill="#000">Н=750</text><text x="140.54" y="108.15" font-size="2.5" fill="#c0392b">Ø20</text><text x="140.54" y="111.15" font-size="2.5" fill="#c0392b">L=4,54</text></g></g><g data-el="legend-box"><g data-el="legend"><text x="310" y="25" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><line x1="310.5" y1="31" x2="317.5" y2="31" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><text x="321" y="31.9" font-size="2.5" fill="#000">Т3 — горячее водоснабжение, подача (ГВС), PP-R Ø20</text><circle cx="314" cy="36" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/><text x="321" y="36.9" font-size="2.5" fill="#000">вывод Т3 (код — в ведомости привязок)</text><circle cx="314" cy="41" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="321" y="41.9" font-size="2.5" fill="#000">стояк «Ст К1-N / Ст В1-N» (ГОСТ 21.601), Ø мм</text><circle cx="314" cy="46" r="1.1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/><text x="321" y="46.9" font-size="2.5" fill="#000">стояк в плане (на отметке пола); вертикаль — стояк по высоте,</text><text x="321" y="50.2" font-size="2.5" fill="#000">разрыв — перекрытие</text><circle cx="314" cy="54.3" r="0.6" fill="#000"/><text x="321" y="55.2" font-size="2.5" fill="#000">тройник (ответвление к прибору)</text><path d="M 312 58 L 316 60.6 L 316 58 L 312 60.6 Z" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="321" y="60.2" font-size="2.5" fill="#000">кран шаровой</text><circle cx="314" cy="64.3" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35" stroke-dasharray="0.8 0.6"/><text x="321" y="65.2" font-size="2.5" fill="#000">* стояк Т3 не на обмере — принят в шахте рядом со Ст В1, сверить</text></g></g><g data-el="notes"><text x="25" y="240" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="245" font-size="2.5" fill="#000">1. Схема Т3 построена по тем же трассам, что план разводки: положение в плане сохранено, глубина — в масштабе ×0,5. Трассы принципиальные; фактическое</text><text x="25" y="248.6" font-size="2.5" fill="#000">положение фиксируется исполнительной схемой до закрытия.</text><text x="25" y="252.2" font-size="2.5" fill="#000">2. Высоты Н — от чистого пола помещения, мм. Прокладка магистрали Т3 по данным: коллекторная разводка, в стяжке пола, в стяжке</text><text x="25" y="255.8" font-size="2.5" fill="#000">пола, выше плиты перекрытия; отметка трасс — по пирогу пола.</text><text x="25" y="259.4" font-size="2.5" fill="#000">3. Узел ввода Т3 (кран, фильтр, счётчик, обратный клапан, кран) — на схеме разводки; состав узла ввода — по согласованию. Кран шаровой — на первом</text><text x="25" y="263" font-size="2.5" fill="#000">участке от стояка.</text><text x="25" y="266.6" font-size="2.5" fill="#000">4. Циркуляция ГВС в данных не задана — циркуляционного трубопровода на схеме нет (запись реестра К-29).</text><text x="25" y="270.2" font-size="2.5" fill="#000" textLength="148.5" lengthAdjust="spacingAndGlyphs">5. Ст Т3-3* на обмере не показаны: положение принято (исполнитель по плану заказчика), не замерено (К-4); положение сверить на объекте до разводки.</text><text x="25" y="273.8" font-size="2.5" fill="#000">6. Трубы испытать давлением до закрытия (акт скрытых работ, опрессовка по СП 73.13330.2016).</text><text x="25" y="277.4" font-size="2.5" fill="#000">7. Диаметры, высоты выводов и места кранов — по паспортам выбранных приборов и расчёту проектной организации.</text><text x="25" y="281" font-size="2.5" fill="#000">8. Расчёт систем, диаметры магистралей и подбор оборудования выполняет проектная организация.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="45" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="45" y1="285.5" x2="45" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="47" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="fixture:П5|fixture:П9|fixture:П10|riser:Ст Т3-3|riser:Ст К1-1|riser:Ст В1-2" data-ids="ИЗ-3 К-1 К-2 К-3 К-4 К-5 К-6 К-7 К-9 К-26 К-28" data-level="0"><text x="45.5" y="200.1" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="45.5" y="203.5" font-size="2.5" fill="#000">Основа листа: планировка по обводу плана заказчика, не замерена (К-1); высота до плиты 2650 мм от чистого пола — решение автора (ИЗ-1); отметки плана потолков сдвинуты на -95 мм (+2.745</text><text x="45.5" y="206.9" font-size="2.5" fill="#000">плана = низ плиты), не замерено (К-2); толщины стен приняты: наружные 260 мм, перегородки 130 мм (К-1); положение стен и проёмов — по брифу без обмера и плана БТИ (К-1); разрешённая</text><text x="45.5" y="210.3" font-size="2.5" fill="#000">мощность 10 кВт принята, ТУ не переданы (К-6); вентканалы приняты, в брифе не заданы (К-5); тип дома, перекрытие и несущие стены не известны — документов нет (К-3); плита электрическая —</text><text x="45.5" y="213.7" font-size="2.5" fill="#000">принята, в брифе не указано (К-6); система заземления TN-C-S принята, ТУ не переданы (К-6); число жильцов 2 принято, в брифе не указано (К-9); подрайон климата не задан — принят не северный</text><text x="45.5" y="217.1" font-size="2.5" fill="#000">(жилые от 2,5 м) (К-26).</text><text x="45.5" y="220.5" font-size="2.5" fill="#000">Знак «*» — принято, не замерено и не подтверждено (замерить на объекте): К-4: Ст Т3-3, Ст К1-1, Ст В1-2 — положение стояка снято с обвода плана, не замерено.</text><text x="45.5" y="223.9" font-size="2.5" fill="#000">Знак «**» — предложение проектировщика, заказчиком не утверждено (согласовать с заказчиком): П5 — гигиенический душ у унитаза — предложение по умолчанию (ревизия «квартира под ключ»),</text><text x="45.5" y="227.3" font-size="2.5" fill="#000">заказчик может снять; закладные выводы ставятся до плитки; ИЗ-3, К-7: П10 — раковина у левой стены: светильники 14 плана — у зеркала над ней; отвод К1 к стояку в углу короткий; ИЗ-3, К-28: П9</text><text x="45.5" y="230.7" font-size="2.5" fill="#000">— ванна 1700 × 750 у правой стены на всю глубину помещения (1700 мм по плану) — стояк в левом углу свободен.</text><text x="45.5" y="234.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 5, записи К-1, К-3–К-7, К-9; лист 6, запись К-26; лист 7, записи ИЗ-3, К-28).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">04.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-020-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Квартира 68 м², элитный модерн</text><text x="297" y="259.2" font-size="2.5" data-fit="116" fill="#000">Общая площадь 68,47* м² · * размеры приняты, не замерены (реестр — л. 5–7, К-1)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" data-fit="66" fill="#000">Дизайн-проект интерьера</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">37</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">105</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="282.2" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">Аксонометрическая схема Т3 (горячее</text><text x="330" y="286" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">водоснабжение)</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М 1:50</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="47" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="25" data-positions="138" data-basis="11"><rect x="314.27" y="6.2" width="99.23" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="316.27" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 25 (реестр — л. 5–7)</text></g></svg>
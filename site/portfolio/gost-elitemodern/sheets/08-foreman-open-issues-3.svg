<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Открытые вопросы, принятые допущения и конфликты. Лист 3 из 6" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты. Лист 3 из 6</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации (стартовое совещание 03.11.2026)</text><g data-el="open-issues" data-plan="fixed" data-plan-declared="6"><g data-el="issues-questions"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Открытые вопросы и принятые допущения (продолжение)</text><rect x="25" y="33" width="385" height="149.4" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="32" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="33" x2="39" y2="182.4" stroke="#000" stroke-width="0.25"/><text x="122" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Формулировка</text><line x1="205" y1="33" x2="205" y2="182.4" stroke="#000" stroke-width="0.25"/><text x="220" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Вид</text><line x1="235" y1="33" x2="235" y2="182.4" stroke="#000" stroke-width="0.25"/><text x="253" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Кто решает</text><line x1="271" y1="33" x2="271" y2="182.4" stroke="#000" stroke-width="0.25"/><text x="309.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Если решения нет</text><line x1="348" y1="33" x2="348" y2="182.4" stroke="#000" stroke-width="0.25"/><text x="379" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Лист, где это проявляется</text><g data-el="issue-row" data-kind="question" data-id="К-25"><text x="32" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">К-25</text><text x="40.5" y="46.7" font-size="2.5" fill="#000">Узел ввода воды принят по умолчанию (предложение): на ХВС и ГВС — кран → фильтр грубой очистки → счётчик → обратный клапан</text><text x="40.5" y="50.1" font-size="2.5" fill="#000">→ редуктор давления → кран с электроприводом (защита от протечек) → коллектор на 13 выходов; разводка — коллекторная, в</text><text x="40.5" y="53.5" font-size="2.5" fill="#000">стяжке пола, отдельной трубой к каждому прибору, без соединений в полу. Не известны: место узла и коллектора, давление на</text><text x="40.5" y="56.9" font-size="2.5" fill="#000">вводе, Ду вводов, наличие счётчиков и разрешённый способ учёта (УК) — положение стояков принято без обмера (К-4). Нужны</text><text x="40.5" y="60.3" font-size="2.5" fill="#000">обмер, справка УК и решение по составу узла.</text><text x="206.5" y="46.7" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="50.1" font-size="2.5" fill="#000">Ждёт: решения</text><text x="236.5" y="46.7" font-size="2.5" fill="#000">Инженер ВК (вода,</text><text x="236.5" y="50.1" font-size="2.5" fill="#000">канализация)</text><text x="272.5" y="46.7" font-size="2.5" fill="#000">узел ввода, коллектор и электрокраны — предложение,</text><text x="272.5" y="50.1" font-size="2.5" fill="#000">место на листах условное; трубы и арматуру не закупать,</text><text x="272.5" y="53.5" font-size="2.5" fill="#000">штробы и закладные в стяжке не делать до обмера и</text><text x="272.5" y="56.9" font-size="2.5" fill="#000">решения</text><text x="349.5" y="46.7" font-size="2.5" fill="#000">л. 49 — Схема разводки водопровода и</text><text x="349.5" y="50.1" font-size="2.5" fill="#000">канализации</text><text x="349.5" y="53.5" font-size="2.5" fill="#000">л. 48 — План выводов сантехники</text></g><line x1="25" y1="63.4" x2="410" y2="63.4" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-26"><text x="32" y="67.1" font-size="2.5" text-anchor="middle" fill="#000">К-26</text><text x="40.5" y="67.1" font-size="2.5" fill="#000">Климатический подрайон (СП 131.13330) не задан: принят не северный — жилые комнаты и кухня под потолком от 2,5 м (СП 54, п.</text><text x="40.5" y="70.5" font-size="2.5" fill="#000">5.12); в IА, IБ, IГ, IД, IVА — от 2,7 м.</text><text x="206.5" y="67.1" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="70.5" font-size="2.5" fill="#000">Ждёт: документа</text><text x="236.5" y="67.1" font-size="2.5" fill="#000">Архитектор-планировщик</text><text x="272.5" y="67.1" font-size="2.5" fill="#000">отметки потолков жилых — по 2,5 м; при северном</text><text x="272.5" y="70.5" font-size="2.5" fill="#000">подрайоне уровни ниже 2,7 м пересчитать до заказа каркаса</text><text x="349.5" y="67.1" font-size="2.5" fill="#000">л. 58 — План потолков</text></g><line x1="25" y1="73.6" x2="410" y2="73.6" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-27"><text x="32" y="77.3" font-size="2.5" text-anchor="middle" fill="#000">К-27</text><text x="40.5" y="77.3" font-size="2.5" fill="#000">Унитаз подвесной П4 (пом. 2 «Санузел»), выпуск К1-1 Ø110: выпуск Ø110 на высоте 220 мм в инсталляции; трасса до Ст К1-1</text><text x="40.5" y="80.7" font-size="2.5" fill="#000">задана «в полу», а в пол она не помещается (нужно 210 мм при пироге 90 мм). Рекомендация исполнителя — короб 170×140 над</text><text x="40.5" y="84.1" font-size="2.5" fill="#000">чистым полом вдоль стен до Ст К1-1 (1,26 м): плитка обходит короб, у двери короб не проходит; это штатная прокладка для</text><text x="40.5" y="87.5" font-size="2.5" fill="#000">подвесного прибора: отвод идёт за инсталляцией и в коробе, пол не поднимается. Варианты: (а) короб 170×140 над чистым полом</text><text x="40.5" y="90.9" font-size="2.5" fill="#000">вдоль стен до Ст К1-1 (1,26 м): плитка обходит короб, у двери короб не проходит; (б) подиум или подъём пола на 120 мм — ступень</text><text x="40.5" y="94.3" font-size="2.5" fill="#000">и порог у входа, высота двери в свету и выводов прибора меняются, пересчёт раскладки плитки; (в) прибор ближе к стояку Ст К1-1</text><text x="40.5" y="97.7" font-size="2.5" fill="#000">— меняется планировка санузла (расстановка, выводы, раскладка); (г) насосная установка (КНС) у прибора — шум, обслуживание,</text><text x="40.5" y="101.1" font-size="2.5" fill="#000">электропитание, согласование; только если другие варианты невозможны. Решение меняет санузел (высоты, раскладку плитки) — за</text><text x="40.5" y="104.5" font-size="2.5" fill="#000">автором с заказчиком.</text><text x="206.5" y="77.3" font-size="2.5" fill="#000">Спорно</text><text x="206.5" y="80.7" font-size="2.5" fill="#000">Ждёт: решения</text><text x="236.5" y="77.3" font-size="2.5" fill="#000">Инженер ВК (вода,</text><text x="236.5" y="80.7" font-size="2.5" fill="#000">канализация)</text><text x="272.5" y="77.3" font-size="2.5" fill="#000">выпуск К1-1 и прибор П4 не выполнять до решения;</text><text x="272.5" y="80.7" font-size="2.5" fill="#000">остальное — по листам</text><text x="349.5" y="77.3" font-size="2.5" fill="#000">л. 49 — Схема разводки водопровода и</text><text x="349.5" y="80.7" font-size="2.5" fill="#000">канализации</text><text x="349.5" y="84.1" font-size="2.5" fill="#000">л. 48 — План выводов сантехники</text></g><line x1="25" y1="107.6" x2="410" y2="107.6" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-28"><text x="32" y="111.3" font-size="2.5" text-anchor="middle" fill="#000">К-28</text><text x="40.5" y="111.3" font-size="2.5" fill="#000">Ванна П9 (пом. 3 «Ванная»), выпуск К1-3 Ø50: в полу не помещается: врезка + перепад 62 (2,06 м × 30 мм/м) + Ø50 + слой над</text><text x="40.5" y="114.7" font-size="2.5" fill="#000">трубой 45 = 187 мм при пироге 90 мм. Рекомендация исполнителя — короб 150×110 над чистым полом вдоль стен до Ст К1-1 (2,06</text><text x="40.5" y="118.1" font-size="2.5" fill="#000">м): плитка обходит короб, у двери короб не проходит; сифон и выпуск прибора — над полом за экраном/корпусом. Варианты: (а)</text><text x="40.5" y="121.5" font-size="2.5" fill="#000">короб 150×110 над чистым полом вдоль стен до Ст К1-1 (2,06 м): плитка обходит короб, у двери короб не проходит; (б) подиум или</text><text x="40.5" y="124.9" font-size="2.5" fill="#000">подъём пола на 100 мм — ступень и порог у входа, высота двери в свету и выводов прибора меняются, пересчёт раскладки плитки;</text><text x="40.5" y="128.3" font-size="2.5" fill="#000">(в) прибор ближе к стояку Ст К1-1 — меняется планировка санузла (расстановка, выводы, раскладка); (г) насосная установка (КНС) у</text><text x="40.5" y="131.7" font-size="2.5" fill="#000">прибора — шум, обслуживание, электропитание, согласование; только если другие варианты невозможны. Решение меняет санузел</text><text x="40.5" y="135.1" font-size="2.5" fill="#000">(высоты, раскладку плитки) — за автором с заказчиком.</text><text x="206.5" y="111.3" font-size="2.5" fill="#000">Спорно</text><text x="206.5" y="114.7" font-size="2.5" fill="#000">Ждёт: решения</text><text x="236.5" y="111.3" font-size="2.5" fill="#000">Инженер ВК (вода,</text><text x="236.5" y="114.7" font-size="2.5" fill="#000">канализация)</text><text x="272.5" y="111.3" font-size="2.5" fill="#000">выпуск К1-3 и прибор П9 не выполнять до решения;</text><text x="272.5" y="114.7" font-size="2.5" fill="#000">остальное — по листам</text><text x="349.5" y="111.3" font-size="2.5" fill="#000">л. 49 — Схема разводки водопровода и</text><text x="349.5" y="114.7" font-size="2.5" fill="#000">канализации</text><text x="349.5" y="118.1" font-size="2.5" fill="#000">л. 48 — План выводов сантехники</text></g><line x1="25" y1="138.2" x2="410" y2="138.2" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-29"><text x="32" y="141.9" font-size="2.5" text-anchor="middle" fill="#000">К-29</text><text x="40.5" y="141.9" font-size="2.5" fill="#000">Циркуляция ГВС в данных не задана — циркуляционного трубопровода на схеме нет. Решить: нужна ли циркуляция</text><text x="206.5" y="141.9" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="145.3" font-size="2.5" fill="#000">Ждёт: решения</text><text x="236.5" y="141.9" font-size="2.5" fill="#000">Инженер ВК (вода,</text><text x="236.5" y="145.3" font-size="2.5" fill="#000">канализация)</text><text x="272.5" y="141.9" font-size="2.5" fill="#000">циркуляции на схеме нет</text><text x="349.5" y="141.9" font-size="2.5" fill="#000">л. 53–55 — Развёртки мокрых зон: выводы ВК.</text><text x="349.5" y="145.3" font-size="2.5" fill="#000">Санузел</text><text x="349.5" y="148.7" font-size="2.5" fill="#000">л. 50 — Аксонометрическая схема В1 (холодное</text><text x="349.5" y="152.1" font-size="2.5" fill="#000">водоснабжение)</text><text x="349.5" y="155.5" font-size="2.5" fill="#000">л. 49 — Схема разводки водопровода и</text><text x="349.5" y="158.9" font-size="2.5" fill="#000">канализации</text></g><line x1="25" y1="162" x2="410" y2="162" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-33"><text x="32" y="165.7" font-size="2.5" text-anchor="middle" fill="#000">К-33</text><text x="40.5" y="165.7" font-size="2.5" fill="#000">Лента скрытой подсветки коробов (Св64 гостиная, Св65 спальня, Св66 кабинет, Св67 кухня-столовая) — класс изделия по решению</text><text x="40.5" y="169.1" font-size="2.5" fill="#000">проектировщика (ИЗ-11): 24 В, 19,2 Вт/м, Ra ≥ 90, 3000 K, паспортный поток не ниже 1500 лм/м, алюминиевый профиль с опаловым</text><text x="40.5" y="172.5" font-size="2.5" fill="#000">рассеивателем; бренд и артикул не выбраны — «аналог по согласованию». Доля потока, доходящая из ниши до помещения, — 0,35:</text><text x="40.5" y="175.9" font-size="2.5" fill="#000">оценка студии LINEA (практика, не норма) и не паспорт. При закупке подтвердить паспортом поток ≥ 1500 лм/м и Ra ≥ 90,</text><text x="40.5" y="179.3" font-size="2.5" fill="#000">пропускание рассеивателя; при меньшем потоке — добавить ленту или линию, сетку точек не возвращать.</text><text x="206.5" y="165.7" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="169.1" font-size="2.5" fill="#000">Ждёт: данных</text><text x="206.5" y="172.5" font-size="2.5" fill="#000">закупки</text><text x="236.5" y="165.7" font-size="2.5" fill="#000">Светотехник</text><text x="272.5" y="165.7" font-size="2.5" fill="#000">ленту и профиль не закупать до паспорта; освещённость по</text><text x="272.5" y="169.1" font-size="2.5" fill="#000">считается по классу изделия и оценке студии (доля из ниши</text><text x="272.5" y="172.5" font-size="2.5" fill="#000">0,35)</text><text x="349.5" y="165.7" font-size="2.5" fill="#000">л. 37 — План освещения</text><text x="349.5" y="169.1" font-size="2.5" fill="#000">л. 58 — План потолков</text></g></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">16.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-020-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-
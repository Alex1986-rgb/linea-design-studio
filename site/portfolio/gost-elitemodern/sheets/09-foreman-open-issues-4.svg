<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Открытые вопросы, принятые допущения и конфликты. Лист 4 из 6" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты. Лист 4 из 6</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации (стартовое совещание 03.11.2026)</text><g data-el="open-issues" data-plan="fixed" data-plan-declared="6"><g data-el="issues-questions"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Открытые вопросы и принятые допущения (продолжение)</text><rect x="25" y="33" width="385" height="71.2" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="32" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="33" x2="39" y2="104.2" stroke="#000" stroke-width="0.25"/><text x="122" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Формулировка</text><line x1="205" y1="33" x2="205" y2="104.2" stroke="#000" stroke-width="0.25"/><text x="220" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Вид</text><line x1="235" y1="33" x2="235" y2="104.2" stroke="#000" stroke-width="0.25"/><text x="253" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Кто решает</text><line x1="271" y1="33" x2="271" y2="104.2" stroke="#000" stroke-width="0.25"/><text x="309.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Если решения нет</text><line x1="348" y1="33" x2="348" y2="104.2" stroke="#000" stroke-width="0.25"/><text x="379" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Лист, где это проявляется</text><g data-el="issue-row" data-kind="question" data-id="К-34"><text x="32" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">К-34</text><text x="40.5" y="46.7" font-size="2.5" fill="#000">Элитный уровень: межкомнатные двери (Д-1…Д-5, Д-7) приняты скрытого монтажа «до потолка» — полотно по ряду изготовителя в</text><text x="40.5" y="50.1" font-size="2.5" fill="#000">существующем проёме 2100 мм и панель над проёмом до потолка в плоскости стены. Полотно 2400–3000 мм не принято: проём в</text><text x="40.5" y="53.5" font-size="2.5" fill="#000">существующей стене нельзя поднимать, пока несущие не определены (К-3, ИЗ-4); решение о подъёме проёмов — после</text><text x="40.5" y="56.9" font-size="2.5" fill="#000">технического заключения и обмера проёмов (толщина стены, перемычка). Размер короба, полотна и высоту панели подтвердить по</text><text x="40.5" y="60.3" font-size="2.5" fill="#000">выбранному ряду изготовителя (изделие — «аналог по согласованию»).</text><text x="206.5" y="46.7" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="50.1" font-size="2.5" fill="#000">Ждёт: обмера,</text><text x="206.5" y="53.5" font-size="2.5" fill="#000">данных закупки,</text><text x="206.5" y="56.9" font-size="2.5" fill="#000">затем решения</text><text x="236.5" y="46.7" font-size="2.5" fill="#000">Архитектор-планировщик</text><text x="272.5" y="46.7" font-size="2.5" fill="#000">двери скрытые с панелью до потолка над проёмом прежней</text><text x="272.5" y="50.1" font-size="2.5" fill="#000">высоты 2100; проёмы не поднимать, короба и полотна не</text><text x="272.5" y="53.5" font-size="2.5" fill="#000">заказывать до обмера проёмов и выбора ряда изготовителя</text><text x="349.5" y="46.7" font-size="2.5" fill="#000">л. 28 — План дверей</text><text x="349.5" y="50.1" font-size="2.5" fill="#000">л. 67 — Ведомость отделки помещений. Лист 1</text><text x="349.5" y="53.5" font-size="2.5" fill="#000">из 2</text><text x="349.5" y="56.9" font-size="2.5" fill="#000">л. 58 — План потолков</text></g><line x1="25" y1="63.4" x2="410" y2="63.4" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-35"><text x="32" y="67.1" font-size="2.5" text-anchor="middle" fill="#000">К-35</text><text x="40.5" y="67.1" font-size="2.5" fill="#000">Элитный уровень: под окнами кабинета, кухни-столовой, гостиной и спальни (РО-1…РО-4) открытые панельные радиаторы заменены</text><text x="40.5" y="70.5" font-size="2.5" fill="#000">внутрипольными конвекторами (ИЗ-12) — решётка вровень с чистым полом вдоль окна, глубина решётки 300 мм, короб в стяжке.</text><text x="40.5" y="73.9" font-size="2.5" fill="#000">Глубина короба зависит от выбранного изделия и должна поместиться в пирог пола; толщина существующей стяжки и перекрытия не</text><text x="40.5" y="77.3" font-size="2.5" fill="#000">известна — не замерена и не вскрыта. Если короб не помещается, запасной вариант — радиатор в нише за решёткой в тон стены</text><text x="40.5" y="80.7" font-size="2.5" fill="#000">(ниша в существующей стене — только после технического заключения, К-3) либо изделие меньшей глубины. Тепловая мощность и</text><text x="40.5" y="84.1" font-size="2.5" fill="#000">длина прибора — по теплотехническому расчёту и паспорту: расчёта теплопотерь нет, прежние 1430–1820 Вт панельных</text><text x="40.5" y="87.5" font-size="2.5" fill="#000">радиаторов были допущением генератора и на конвекторы не переносятся (в ведомости радиаторов — «расч.»); изделие — класс</text><text x="40.5" y="90.9" font-size="2.5" fill="#000">«внутрипольный конвектор, аналог по согласованию». Шторы кабинета, гостиной и спальни (Т1, Т2, Т4, Т5, Т10, Т11) опускаются до</text><text x="40.5" y="94.3" font-size="2.5" fill="#000">пола над задней частью решётки (вынос карниза 250 и 150 мм при решётке 300 мм); признак «радиатор не мешает шторе» у них</text><text x="40.5" y="97.7" font-size="2.5" fill="#000">поставлен для панельного радиатора глубиной 140 мм и для конвектора не подтверждён — вынос карниза или длину штор над</text><text x="40.5" y="101.1" font-size="2.5" fill="#000">решёткой решает декоратор до заказа.</text><text x="206.5" y="67.1" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="70.5" font-size="2.5" fill="#000">Ждёт: обмера,</text><text x="206.5" y="73.9" font-size="2.5" fill="#000">данных закупки,</text><text x="206.5" y="77.3" font-size="2.5" fill="#000">затем решения</text><text x="236.5" y="67.1" font-size="2.5" fill="#000">Инженер ОВ</text><text x="272.5" y="67.1" font-size="2.5" fill="#000">конвекторы и стяжку под ними не заказывать и не заливать</text><text x="272.5" y="70.5" font-size="2.5" fill="#000">до вскрытия пола и паспорта изделия; решение о нише</text><text x="272.5" y="73.9" font-size="2.5" fill="#000">после технического заключения; мощность и длину — по</text><text x="272.5" y="77.3" font-size="2.5" fill="#000">расчёту</text><text x="349.5" y="67.1" font-size="2.5" fill="#000">л. 47 — План отопления</text><text x="349.5" y="70.5" font-size="2.5" fill="#000">л. 112 — Ведомость объёмов работ</text><text x="349.5" y="73.9" font-size="2.5" fill="#000">л. 67 — Ведомость отделки помещений. Лист 1</text><text x="349.5" y="77.3" font-size="2.5" fill="#000">из 2</text></g></g><g data-el="issues-changes"><text x="25" y="116.6" font-size="3.5" font-weight="700" fill="#000">Изменения проекта после выпуска листов (реестр изменений)</text><rect x="25" y="119.2" width="385" height="78" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="129.2" x2="410" y2="129.2" stroke="#000" stroke-width="0.5"/><text x="32" y="125.1" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="119.2" x2="39" y2="197.2" stroke="#000" stroke-width="0.25"/><text x="50" y="125.1" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><line x1="61" y1="119.2" x2="61" y2="197.2" stroke="#000" stroke-width="0.25"/><text x="91" y="125.1" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><line x1="121" y1="119.2" x2="121" y2="197.2" stroke="#000" stroke-width="0.25"/><text x="171" y="125.1" font-size="2.5" text-anchor="middle" fill="#000">Было</text><line x1="221" y1="119.2" x2="221" y2="197.2" stroke="#000" stroke-width="0.25"/><text x="283.5" y="125.1" font-size="2.5" text-anchor="middle" fill="#000">Стало</text><line x1="346" y1="119.2" x2="346" y2="197.2" stroke="#000" stroke-width="0.25"/><text x="378" y="125.1" font-size="2.5" text-anchor="middle" fill="#000">Кто решил, подпись</text><g data-el="issue-row" data-kind="change" data-id="ИЗ-1"><text x="32" y="132.9" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-1</text><text x="40.5" y="132.9" font-size="2.5" fill="#000">03.11.2026</text><text x="62.5" y="132.9" font-size="2.5" fill="#000">л. 26 — Обмерный план</text><text x="62.5" y="136.3" font-size="2.5" fill="#000">л. 58 — План потолков</text><text x="122.5" y="132.9" font-size="2.5" fill="#000">Высота до плиты 2745 мм — по отметке +2.745 плана потолков (К-2).</text><text x="222.5" y="132.9" font-size="2.5" fill="#000">Решение автора: от чистого пола до плиты 2650 мм; отметки плана −95 мм, перепады сохранены:</text><text x="222.5" y="136.3" font-size="2.5" fill="#000">по плите +2.650, комнаты +2.590, прихожая +2.550, санузел и ванная +2.505. Датум отметок плана</text><text x="222.5" y="139.7" font-size="2.5" fill="#000">— допущение (отдельный вопрос).</text><text x="347.5" y="132.9" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 03.11.2026.</text><text x="347.5" y="136.3" font-size="2.5" fill="#000">Предложил: Александр Кырлан, решение автора.</text></g><line x1="25" y1="142.8" x2="410" y2="142.8" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-2"><text x="32" y="146.5" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-2</text><text x="40.5" y="146.5" font-size="2.5" fill="#000">03.11.2026</text><text x="62.5" y="146.5" font-size="2.5" fill="#000">л. 31 — План расстановки мебели</text><text x="122.5" y="146.5" font-size="2.5" fill="#000">Назначение помещений не подписано (К-11).</text><text x="222.5" y="146.5" font-size="2.5" fill="#000">Решение автора — по предложению исполнителя: кабинет у окна (бра 12), кухня-столовая с</text><text x="222.5" y="149.9" font-size="2.5" fill="#000">эркером (подсветка 13), гостиная, спальня (подвесы 13-А/13-Б, кровать 1800 между ними).</text><text x="347.5" y="146.5" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 03.11.2026.</text><text x="347.5" y="149.9" font-size="2.5" fill="#000">Предложил: Александр Кырлан, решение автора.</text></g><line x1="25" y1="153" x2="410" y2="153" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-3"><text x="32" y="156.7" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-3</text><text x="40.5" y="156.7" font-size="2.5" fill="#000">03.11.2026</text><text x="62.5" y="156.7" font-size="2.5" fill="#000">л. 48 — План выводов сантехники</text><text x="62.5" y="160.1" font-size="2.5" fill="#000">л. 63 — Раскладка плитки. Планы полов</text><text x="122.5" y="156.7" font-size="2.5" fill="#000">Ванная и санузел не подписаны (К-12).</text><text x="222.5" y="156.7" font-size="2.5" fill="#000">Решение автора: большее — ванная (ванна 1700 у правой стены, умывальник на тумбе 800,</text><text x="222.5" y="160.1" font-size="2.5" fill="#000">стиральная машина 600 × 600 с выводами и розеткой на своей группе); меньшее — санузел</text><text x="222.5" y="163.5" font-size="2.5" fill="#000">(подвесной унитаз, гигиенический душ, раковина 400).</text><text x="347.5" y="156.7" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 03.11.2026.</text><text x="347.5" y="160.1" font-size="2.5" fill="#000">Предложил: Александр Кырлан, решение автора.</text></g><line x1="25" y1="166.6" x2="410" y2="166.6" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-4"><text x="32" y="170.3" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-4</text><text x="40.5" y="170.3" font-size="2.5" fill="#000">03.11.2026</text><text x="62.5" y="170.3" font-size="2.5" fill="#000">л. 27 — План демонтажа и монтажа</text><text x="62.5" y="173.7" font-size="2.5" fill="#000">перегородок</text><text x="122.5" y="170.3" font-size="2.5" fill="#000">Несущие стены не известны (К-13).</text><text x="222.5" y="170.3" font-size="2.5" fill="#000">Решение автора: все существующие стены — несущие до техзаключения; демонтаж и штробление</text><text x="222.5" y="173.7" font-size="2.5" fill="#000">— после него.</text><text x="347.5" y="170.3" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 03.11.2026.</text><text x="347.5" y="173.7" font-size="2.5" fill="#000">Предложил: Александр Кырлан, решение автора.</text></g><line x1="25" y1="176.8" x2="410" y2="176.8" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-5"><text x="32" y="180.5" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-5</text><text x="40.5" y="180.5" font-size="2.5" fill="#000">03.11.2026</text><text x="62.5" y="180.5" font-size="2.5" fill="#000">л. 37 — План освещения</text><text x="62.5" y="183.9" font-size="2.5" fill="#000">л. 58 — План потолков</text><text x="122.5" y="180.5" font-size="2.5" fill="#000">Споты 70 мм в 60 мм запотолочного (К-31).</text><text x="222.5" y="180.5" font-size="2.5" fill="#000">Решение: встраиваемые светильники тонкие, монтажная глубина ≤ 50 мм; марки исходного плана</text><text x="222.5" y="183.9" font-size="2.5" fill="#000">сохранены; тип — в спецификации с пометкой «глубина ≤ 50 мм».</text><text x="347.5" y="180.5" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 03.11.2026.</text><text x="347.5" y="183.9" font-size="2.5" fill="#000">Предложил: Александр Кырлан, решение автора.</text></g><line x1="25" y1="187" x2="410" y2="187" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-6"><text x="32" y="190.7" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-6</text><text x="40.5" y="190.7" font-size="2.5" fill="#000">03.11.2026</text><text x="62.5" y="190.7" font-size="2.5" fill="#000">л. 46 — План вентиляции</text><text x="122.5" y="190.7" font-size="2.5" fill="#000">Вентилятор 11 в потолке мокрых: 145 &lt; 150 мм (К-32).</text><text x="222.5" y="190.7" font-size="2.5" fill="#000">Решение: вытяжная решётка на стене санузла и ванной в канал, вентилятор канальный настенный</text><text x="222.5" y="194.1" font-size="2.5" fill="#000">с обратным клапаном; знак 11 плана — не в потолке.</text><text x="347.5" y="190.7" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 03.11.2026.</text><text x="347.5" y="194.1" font-size="2.5" fill="#000">Предложил: Александр Кырлан, решение автора.</text></g></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0
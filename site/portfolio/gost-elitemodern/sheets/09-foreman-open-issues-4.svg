<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Открытые вопросы, принятые допущения и конфликты. Лист 4 из 4" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты. Лист 4 из 4</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации (стартовое совещание 03.11.2026)</text><g data-el="open-issues" data-plan="fixed" data-plan-declared="4"><g data-el="issues-changes"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Изменения проекта после выпуска листов (реестр изменений) (продолжение)</text><rect x="25" y="33" width="385" height="142.6" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="32" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="33" x2="39" y2="175.6" stroke="#000" stroke-width="0.25"/><text x="50" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><line x1="61" y1="33" x2="61" y2="175.6" stroke="#000" stroke-width="0.25"/><text x="91" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><line x1="121" y1="33" x2="121" y2="175.6" stroke="#000" stroke-width="0.25"/><text x="171" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Было</text><line x1="221" y1="33" x2="221" y2="175.6" stroke="#000" stroke-width="0.25"/><text x="283.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Стало</text><line x1="346" y1="33" x2="346" y2="175.6" stroke="#000" stroke-width="0.25"/><text x="378" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Кто решил, подпись</text><g data-el="issue-row" data-kind="change" data-id="ИЗ-3"><text x="32" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-3</text><text x="40.5" y="46.7" font-size="2.5" fill="#000">03.11.2026</text><text x="62.5" y="46.7" font-size="2.5" fill="#000">л. 44 — План выводов сантехники</text><text x="62.5" y="50.1" font-size="2.5" fill="#000">л. 57 — Раскладка плитки. Планы полов</text><text x="122.5" y="46.7" font-size="2.5" fill="#000">Ванная и санузел не подписаны (К-12).</text><text x="222.5" y="46.7" font-size="2.5" fill="#000">Решение автора: большее — ванная (ванна 1700 у правой стены, умывальник на тумбе 800,</text><text x="222.5" y="50.1" font-size="2.5" fill="#000">стиральная машина 600 × 600 с выводами и розеткой на своей группе); меньшее — санузел</text><text x="222.5" y="53.5" font-size="2.5" fill="#000">(подвесной унитаз, гигиенический душ, раковина 400).</text><text x="347.5" y="46.7" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 03.11.2026.</text><text x="347.5" y="50.1" font-size="2.5" fill="#000">Предложил: Александр Кырлан, решение автора.</text></g><line x1="25" y1="56.6" x2="410" y2="56.6" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-4"><text x="32" y="60.3" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-4</text><text x="40.5" y="60.3" font-size="2.5" fill="#000">03.11.2026</text><text x="62.5" y="60.3" font-size="2.5" fill="#000">л. 24 — План демонтажа и монтажа</text><text x="62.5" y="63.7" font-size="2.5" fill="#000">перегородок</text><text x="122.5" y="60.3" font-size="2.5" fill="#000">Несущие стены не известны (К-13).</text><text x="222.5" y="60.3" font-size="2.5" fill="#000">Решение автора: все существующие стены — несущие до техзаключения; демонтаж и штробление</text><text x="222.5" y="63.7" font-size="2.5" fill="#000">— после него.</text><text x="347.5" y="60.3" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 03.11.2026.</text><text x="347.5" y="63.7" font-size="2.5" fill="#000">Предложил: Александр Кырлан, решение автора.</text></g><line x1="25" y1="66.8" x2="410" y2="66.8" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-5"><text x="32" y="70.5" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-5</text><text x="40.5" y="70.5" font-size="2.5" fill="#000">03.11.2026</text><text x="62.5" y="70.5" font-size="2.5" fill="#000">л. 33 — План освещения</text><text x="62.5" y="73.9" font-size="2.5" fill="#000">л. 54 — План потолков</text><text x="122.5" y="70.5" font-size="2.5" fill="#000">Споты 70 мм в 60 мм запотолочного (К-31).</text><text x="222.5" y="70.5" font-size="2.5" fill="#000">Решение: встраиваемые светильники тонкие, монтажная глубина ≤ 50 мм; марки исходного плана</text><text x="222.5" y="73.9" font-size="2.5" fill="#000">сохранены; тип — в спецификации с пометкой «глубина ≤ 50 мм».</text><text x="347.5" y="70.5" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 03.11.2026.</text><text x="347.5" y="73.9" font-size="2.5" fill="#000">Предложил: Александр Кырлан, решение автора.</text></g><line x1="25" y1="77" x2="410" y2="77" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-6"><text x="32" y="80.7" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-6</text><text x="40.5" y="80.7" font-size="2.5" fill="#000">03.11.2026</text><text x="62.5" y="80.7" font-size="2.5" fill="#000">л. 42 — План вентиляции</text><text x="122.5" y="80.7" font-size="2.5" fill="#000">Вентилятор 11 в потолке мокрых: 145 &lt; 150 мм (К-32).</text><text x="222.5" y="80.7" font-size="2.5" fill="#000">Решение: вытяжная решётка на стене санузла и ванной в канал, вентилятор канальный настенный</text><text x="222.5" y="84.1" font-size="2.5" fill="#000">с обратным клапаном; знак 11 плана — не в потолке.</text><text x="347.5" y="80.7" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 03.11.2026.</text><text x="347.5" y="84.1" font-size="2.5" fill="#000">Предложил: Александр Кырлан, решение автора.</text></g><line x1="25" y1="87.2" x2="410" y2="87.2" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-7"><text x="32" y="90.9" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-7</text><text x="40.5" y="90.9" font-size="2.5" fill="#000">03.11.2026</text><text x="62.5" y="90.9" font-size="2.5" fill="#000">л. 23 — Обмерный план</text><text x="122.5" y="90.9" font-size="2.5" fill="#000">Датум отметок плана не известен (К-30).</text><text x="222.5" y="90.9" font-size="2.5" fill="#000">Решение: допущение сохраняется — отметки дизайнера на 95 мм ниже чистого пола; подтвердить</text><text x="222.5" y="94.3" font-size="2.5" fill="#000">на обмере (не блокирует выпуск).</text><text x="347.5" y="90.9" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 03.11.2026.</text><text x="347.5" y="94.3" font-size="2.5" fill="#000">Предложил: Александр Кырлан, решение автора.</text></g><line x1="25" y1="97.4" x2="410" y2="97.4" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-8"><text x="32" y="101.1" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-8</text><text x="40.5" y="101.1" font-size="2.5" fill="#000">12.11.2026</text><text x="62.5" y="101.1" font-size="2.5" fill="#000">л. 67 — План текстиля и декора</text><text x="62.5" y="104.5" font-size="2.5" fill="#000">л. 69 — Ведомость текстиля</text><text x="62.5" y="107.9" font-size="2.5" fill="#000">л. 70 — Ведомость декора. Схемы развески</text><text x="62.5" y="111.3" font-size="2.5" fill="#000">л. 68 — Шторы и карнизы</text><text x="62.5" y="114.7" font-size="2.5" fill="#000">л. 33 — План освещения</text><text x="62.5" y="118.1" font-size="2.5" fill="#000">л. 27 — План расстановки мебели</text><text x="122.5" y="101.1" font-size="2.5" fill="#000">Разбор двух критиков по кадрам: «элитный модерн не читается» — дорого</text><text x="122.5" y="104.5" font-size="2.5" fill="#000">выглядят только кухня и умывальник, гостиная и кабинет — типовая квартира,</text><text x="122.5" y="107.9" font-size="2.5" fill="#000">авторского света нет, санузлы пустые. В данных: в гостиной нет журнального</text><text x="122.5" y="111.3" font-size="2.5" fill="#000">стола и кресла, в кабинете — рабочего кресла; светильники — только споты</text><text x="122.5" y="114.7" font-size="2.5" fill="#000">плана потолков, одно бра и два подвеса без наименований; подвес L5 над</text><text x="122.5" y="118.1" font-size="2.5" fill="#000">столом назван у выключателя S3, а точки нет; панели ТВ-стены есть только в</text><text x="122.5" y="121.5" font-size="2.5" fill="#000">наименовании М19. Противоречия позиций: стол М1 «шпон ореха, латунные</text><text x="122.5" y="124.9" font-size="2.5" fill="#000">опоры» при полях «дуб» и чёрный металл; ТВ-стена М19 и консоль М23</text><text x="122.5" y="128.3" font-size="2.5" fill="#000">«шпон ореха» при поле «дуб»; картины ДК4, ДК5, ДК7 — «в латунной раме,</text><text x="122.5" y="131.7" font-size="2.5" fill="#000">рама — дуб», у всех трёх один сюжет, у ДК5 в наименовании «фотография</text><text x="122.5" y="135.1" font-size="2.5" fill="#000">города в дожде»; умывальник П10 — тумба одновременно «на ножках» и</text><text x="122.5" y="138.5" font-size="2.5" fill="#000">«подвесная»; текстиль — в наименованиях бархат, бордо, шалфей, терракота,</text><text x="122.5" y="141.9" font-size="2.5" fill="#000">в полях лён и нейтральные цвета; подушек 5 на диван и 5 на кровать;</text><text x="122.5" y="145.3" font-size="2.5" fill="#000">монстера ДК8 стояла на тумбе М26 и углу кровати.</text><text x="222.5" y="101.1" font-size="2.5" fill="#000">Противоречия сняты: М1, М19, М23 — орех и латунь; стеллаж М3 — встроенный, шпон ореха и</text><text x="222.5" y="104.5" font-size="2.5" fill="#000">латунь; П10 — тумба подвесная; зеркало ДК1 — латунная рама; картины ДК4 (абстракция), ДК5</text><text x="222.5" y="107.9" font-size="2.5" fill="#000">(горный пейзаж), ДК7 (графика дугами) — латунные рамы, у каждой свой сюжет, без людей и</text><text x="222.5" y="111.3" font-size="2.5" fill="#000">городов. Текстиль приведён к наименованиям: портьеры — бархат (кабинет — светлый</text><text x="222.5" y="114.7" font-size="2.5" fill="#000">серо-бежевый, гостиная — шалфей, спальня — чернильный синий), подушки 2 + 2 (гостиная:</text><text x="222.5" y="118.1" font-size="2.5" fill="#000">бархат бордо и жаккард шалфей; спальня: бархат шалфей и жаккард синий), пледы и ковры — в</text><text x="222.5" y="121.5" font-size="2.5" fill="#000">тонах палитры; бордо No. 43 в текстиле — осознанный акцент палитры проекта. Свет:</text><text x="222.5" y="124.9" font-size="2.5" fill="#000">люстры-подвесы в кабинете (L17, клавиша 2 у S1) и гостиной (L15, клавиша 2 у S6), подсветка</text><text x="222.5" y="128.3" font-size="2.5" fill="#000">картины ДК4 (L16, клавиша 2 у S5), подвес над обеденным столом (L5, клавиша 2 у S3); бра Св7 и</text><text x="222.5" y="131.7" font-size="2.5" fill="#000">подвесы Св58, Св59 получили наименования (латунь, матовое стекло, алебастр). Гостиная:</text><text x="222.5" y="135.1" font-size="2.5" fill="#000">журнальный стол М21 (мрамор, латунь), кресло М22 (бархат бордо; 345 мм до радиатора РО-3),</text><text x="222.5" y="138.5" font-size="2.5" fill="#000">панели шпона ореха на ТВ-стене (ДС1), книги и керамика на столе, лампа и керамика на консоли;</text><text x="222.5" y="141.9" font-size="2.5" fill="#000">между диваном и столом 500 мм, между столом и ТВ-тумбой 625 мм. Кабинет: рабочее кресло М2</text><text x="222.5" y="145.3" font-size="2.5" fill="#000">(сдвинуто к правому краю стола — перед столом свободно 900 мм), ковёр, картина над столом и</text><text x="222.5" y="148.7" font-size="2.5" fill="#000">абстракция на стене В, настольная лампа; кресло для чтения не задано — перекрывает проход у</text><text x="222.5" y="152.1" font-size="2.5" fill="#000">полотна двери Д-1. Спальня: кресло М27 в эркере, зеркало в рост, книги и керамика на тумбах,</text><text x="222.5" y="155.5" font-size="2.5" fill="#000">монстера ДК8 перенесена в эркер. Кухня: керамика на столешнице. Санузел: ваза и свеча на полке</text><text x="222.5" y="158.9" font-size="2.5" fill="#000">короба инсталляции, графика на стене Б. Ванная: полотенца для рук и керамика на тумбе, свеча на</text><text x="222.5" y="162.3" font-size="2.5" fill="#000">бортике ванны; коврик не задан — свободный пол перед ванной заметает полотно двери Д-3 и</text><text x="222.5" y="165.7" font-size="2.5" fill="#000">дверца стиральной машины; полотенцесушителя в данных ванной нет — банные полотенца не</text><text x="222.5" y="169.1" font-size="2.5" fill="#000">заданы. Прихожая: свободных стен нет (двери, щиты, домофон) — добавлений нет. Знак «**» у</text><text x="222.5" y="172.5" font-size="2.5" fill="#000">позиций до подписи автора.</text><text x="347.5" y="101.1" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="104.5" font-size="2.5" fill="#000">исполнителя; предложение проектировщика, на</text><text x="347.5" y="107.9" font-size="2.5" fill="#000">утверждение А. С. Кырлана</text></g></g><g data-el="notes"><text x="25" y="188" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="192.8" font-size="2.5" fill="#000">1. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text><text x="25" y="196.2" font-size="2.5" fill="#000">2. Графа «Если решения нет» показывает состояние решения на листах; влияние на сроки и стоимость по пунктам не оценивалось.</text><text x="25" y="199.6" font-size="2.5" fill="#000">3. Пункт, по которому принято решение, при следующем выпуске комплекта из таблиц исключается.</text></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><t
 font-size="2.5" text-anchor="start" data-fit="46.16" fill="#000">20</text><text x="262.08" y="162.1" font-size="2.5" text-anchor="start" data-fit="40.42" fill="#000">0,78</text><line x1="25" y1="169.8" x2="304" y2="169.8" stroke="#000" stroke-width="0.18"/><text x="26.5" y="168.1" font-size="2.5" text-anchor="start" data-fit="29.95" fill="#000">Т3-4</text><text x="59.45" y="168.1" font-size="2.5" text-anchor="start" data-fit="112.79" fill="#000">П10** умывальник</text><text x="175.24" y="168.1" font-size="2.5" text-anchor="start" data-fit="34.68" fill="#000">550</text><text x="212.92" y="168.1" font-size="2.5" text-anchor="start" data-fit="46.16" fill="#000">20</text><text x="262.08" y="168.1" font-size="2.5" text-anchor="start" data-fit="40.42" fill="#000">0,95</text><text x="26.5" y="174.1" font-size="2.5" text-anchor="start" data-fit="29.95" fill="#000">Т3-1</text><text x="59.45" y="174.1" font-size="2.5" text-anchor="start" data-fit="112.79" fill="#000">П5** гигиенический душ</text><text x="175.24" y="174.1" font-size="2.5" text-anchor="start" data-fit="34.68" fill="#000">750</text><text x="212.92" y="174.1" font-size="2.5" text-anchor="start" data-fit="46.16" fill="#000">20</text><text x="262.08" y="174.1" font-size="2.5" text-anchor="start" data-fit="40.42" fill="#000">0,17</text></g><g data-el="legend"><text x="312" y="135.8" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><line x1="312.5" y1="141.8" x2="319.5" y2="141.8" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><text x="323" y="142.7" font-size="2.5" fill="#000">Т3 — горячее водоснабжение, подача (ГВС), PP-R Ø20</text><circle cx="316" cy="146.8" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/><text x="323" y="147.7" font-size="2.5" fill="#000">вывод Т3 (код — в ведомости привязок)</text><circle cx="316" cy="151.79898987322332" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="323" y="152.7" font-size="2.5" fill="#000">стояк «Ст К1-N / Ст В1-N» (ГОСТ 21.601), Ø мм</text><circle cx="316" cy="156.79898987322332" r="1.1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/><text x="323" y="157.7" font-size="2.5" fill="#000">стояк в плане (на отметке пола); вертикаль — стояк по высоте,</text><text x="323" y="161" font-size="2.5" fill="#000">разрыв — перекрытие</text><circle cx="316" cy="165.1" r="0.6" fill="#000"/><text x="323" y="166" font-size="2.5" fill="#000">тройник (ответвление к прибору)</text><path d="M 314 168.8 L 318 171.4 L 318 168.8 L 314 171.4 Z" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="323" y="171" font-size="2.5" fill="#000">кран шаровой</text><circle cx="316" cy="175.09898987322333" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35" stroke-dasharray="0.8 0.6"/><text x="323" y="176" font-size="2.5" fill="#000">* стояк Т3 не на обмере — принят в шахте рядом со Ст В1,</text><text x="323" y="179.3" font-size="2.5" fill="#000">сверить</text></g><g data-el="notes"><text x="25" y="240" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="245" font-size="2.5" fill="#000">1. Схема Т3 построена по тем же трассам, что план разводки: положение в плане сохранено, глубина — в масштабе ×0,5. Трассы принципиальные; фактическое</text><text x="25" y="248.6" font-size="2.5" fill="#000">положение фиксируется исполнительной схемой до закрытия.</text><text x="25" y="252.2" font-size="2.5" fill="#000">2. Высоты Н — от чистого пола помещения, мм. Прокладка магистрали Т3 по данным: коллекторная разводка, в стяжке пола, в стяжке</text><text x="25" y="255.8" font-size="2.5" fill="#000">пола, выше плиты перекрытия; отметка трасс — по пирогу пола.</text><text x="25" y="259.4" font-size="2.5" fill="#000">3. Узел ввода Т3 (кран, фильтр, счётчик, обратный клапан, кран) — на схеме разводки; состав узла ввода — по согласованию. Кран шаровой — на первом</text><text x="25" y="263" font-size="2.5" fill="#000">участке от стояка.</text><text x="25" y="266.6" font-size="2.5" fill="#000">4. Циркуляция ГВС в данных не задана — циркуляционного трубопровода на схеме нет (запись реестра К-29).</text><text x="25" y="270.2" font-size="2.5" fill="#000" textLength="148.5" lengthAdjust="spacingAndGlyphs">5. Ст Т3-3* на обмере не показаны: положение принято (исполнитель по плану заказчика), не замерено (К-4); положение сверить на объекте до разводки.</text><text x="25" y="273.8" font-size="2.5" fill="#000">6. Трубы испытать давлением до закрытия (акт скрытых работ, опрессовка по СП 73.13330.2016).</text><text x="25" y="277.4" font-size="2.5" fill="#000">7. Диаметры, высоты выводов и места кранов — по паспортам выбранных приборов и расчёту проектной организации.</text><text x="25" y="281" font-size="2.5" fill="#000">8. Расчёт систем, диаметры магистралей и подбор оборудования выполняет проектная организация.</text></g><g data-el="assume-compact"></g><g data-el="scale-bar"><line x1="25" y1="287" x2="45" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="45" y1="285.5" x2="45" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="47" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="fixture:П5|fixture:П9|fixture:П10|riser:Ст Т3-3|riser:Ст К1-1|riser:Ст В1-2" data-ids="ИЗ-3 К-1 К-2 К-3 К-4 К-5 К-6 К-7 К-9 К-26 К-28" data-level="3"><text x="45.5" y="233.6" font-size="2.5" fill="#000">Допущения и предложения на листе. Знак «*» принято (замерить): Ст К1-1, Ст В1-2. Знак «**» предложено (согласовать). См. лист открытых вопросов (листы 6–8).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="
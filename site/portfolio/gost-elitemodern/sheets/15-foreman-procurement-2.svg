<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="График закупок и работ. Лист 2 из 3" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">График закупок и работ. Лист 2 из 3</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Что заказывать и когда не раньше чего: относительный порядок без дат; срок поставки — из данных или «не задан» с записью реестра</text><g data-el="proc-schedule" data-plan="fixed" data-plan-declared="3"><g data-el="proc-buy"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Закупки: что заказывается, от чего зависит заказ и какую работу блокирует (продолжение)</text><rect x="25" y="33" width="385" height="47.4" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="31" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="37" y1="33" x2="37" y2="80.4" stroke="#000" stroke-width="0.25"/><text x="70" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Позиция и где</text><line x1="103" y1="33" x2="103" y2="80.4" stroke="#000" stroke-width="0.25"/><text x="131" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">1. Замер до заказа</text><line x1="159" y1="33" x2="159" y2="80.4" stroke="#000" stroke-width="0.25"/><text x="187" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">2. Решение, выбор изделия, паспорт</text><line x1="215" y1="33" x2="215" y2="80.4" stroke="#000" stroke-width="0.25"/><text x="241" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">3. Условие заказа</text><line x1="267" y1="33" x2="267" y2="80.4" stroke="#000" stroke-width="0.25"/><text x="287" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">4. Срок поставки</text><line x1="307" y1="33" x2="307" y2="80.4" stroke="#000" stroke-width="0.25"/><text x="335" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">5. Блокирует работу</text><line x1="363" y1="33" x2="363" y2="80.4" stroke="#000" stroke-width="0.25"/><text x="386.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Закрывает вопросы реестра</text><g data-el="proc-row" data-id="З-6" data-kind="board" data-lead="" data-lead-src="none" data-need="Р-12" data-closes=""><text x="31" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">З-6</text><text x="38.5" y="46.7" font-size="2.5" fill="#000">Покрытие пола (доска) и плинтус: пом. 1, 5, 6, 7</text><text x="38.5" y="50.1" font-size="2.5" fill="#000">пом. 1, 5, 6, 7</text><text x="104.5" y="46.7" font-size="2.5" fill="#000">О-19: обмер: Кабинет (пом. 1), Санузел</text><text x="104.5" y="50.1" font-size="2.5" fill="#000">(пом. 2), Ванная (пом. 3), Прихожая (пом.</text><text x="104.5" y="53.5" font-size="2.5" fill="#000">4), Кухня-столовая (пом. 5), Гостиная (пом.</text><text x="104.5" y="56.9" font-size="2.5" fill="#000">6), Спальня (пом. 7)</text><text x="160.5" y="46.7" font-size="2.5" fill="#000"></text><text x="216.5" y="46.7" font-size="2.5" fill="#000">После 1 и 2 и после получения срока у</text><text x="216.5" y="50.1" font-size="2.5" fill="#000">поставщика (вопроса о сроках нет);</text><text x="216.5" y="53.5" font-size="2.5" fill="#000">дата заказа — когда срок известен, не</text><text x="216.5" y="56.9" font-size="2.5" fill="#000">позднее чем за срок до начала Р-12.</text><text x="268.5" y="46.7" font-size="2.5" fill="#000">срок поставки не задан</text><text x="268.5" y="50.1" font-size="2.5" fill="#000">(записи реестра нет)</text><text x="308.5" y="46.7" font-size="2.5" fill="#000">Р-12 «чистовые полы»: артикул и партия</text><text x="308.5" y="50.1" font-size="2.5" fill="#000">— до заказа; доску привозят к чистовым</text><text x="308.5" y="53.5" font-size="2.5" fill="#000">полам</text><text x="364.5" y="46.7" font-size="2.5" fill="#000"></text></g><line x1="25" y1="60" x2="410" y2="60" stroke="#000" stroke-width="0.25"/><g data-el="proc-row" data-id="З-7" data-kind="furniture" data-lead="" data-lead-src="none" data-need="Р-15" data-closes="К-1"><text x="31" y="63.7" font-size="2.5" text-anchor="middle" fill="#000">З-7</text><text x="38.5" y="63.7" font-size="2.5" fill="#000" textLength="38.5" lengthAdjust="spacingAndGlyphs">Встроенная мебель по замеру цеха: М5**</text><text x="38.5" y="67.1" font-size="2.5" fill="#000">пом. 4</text><text x="104.5" y="63.7" font-size="2.5" fill="#000">О-3: обмер: все помещения, обход по</text><text x="104.5" y="67.1" font-size="2.5" fill="#000">часовой стрелке от входа (К-1); до заказа</text><text x="104.5" y="70.5" font-size="2.5" fill="#000">мебели и дверей</text><text x="160.5" y="63.7" font-size="2.5" fill="#000"></text><text x="216.5" y="63.7" font-size="2.5" fill="#000">После 1 и 2 и после получения срока у</text><text x="216.5" y="67.1" font-size="2.5" fill="#000">поставщика (вопроса о сроках нет);</text><text x="216.5" y="70.5" font-size="2.5" fill="#000">дата заказа — когда срок известен, не</text><text x="216.5" y="73.9" font-size="2.5" fill="#000">позднее чем за срок до начала Р-15.</text><text x="268.5" y="63.7" font-size="2.5" fill="#000">срок поставки не задан</text><text x="268.5" y="67.1" font-size="2.5" fill="#000">(записи реестра нет)</text><text x="268.5" y="70.5" font-size="2.5" fill="#000">Ориентир практики (не срок</text><text x="268.5" y="73.9" font-size="2.5" fill="#000">поставщика): 4–8 нед. от</text><text x="268.5" y="77.3" font-size="2.5" fill="#000">замера</text><text x="308.5" y="63.7" font-size="2.5" fill="#000">Р-15 «кухня и мебель»: цех замеряет по</text><text x="308.5" y="67.1" font-size="2.5" fill="#000">готовым стенам; производство 4–8 недель</text><text x="308.5" y="70.5" font-size="2.5" fill="#000">идёт параллельно с отделкой</text><text x="364.5" y="63.7" font-size="2.5" fill="#000">К-1</text></g></g><g data-el="proc-work"><text x="25" y="92.8" font-size="3.5" font-weight="700" fill="#000">Работы: порядок и что не даёт начать</text><rect x="25" y="95.4" width="385" height="86" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="105.4" x2="410" y2="105.4" stroke="#000" stroke-width="0.5"/><text x="31" y="101.3" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="37" y1="95.4" x2="37" y2="181.4" stroke="#000" stroke-width="0.25"/><text x="83" y="101.3" font-size="2.5" text-anchor="middle" fill="#000">Работа (стадия технологической последовательности)</text><line x1="129" y1="95.4" x2="129" y2="181.4" stroke="#000" stroke-width="0.25"/><text x="149" y="101.3" font-size="2.5" text-anchor="middle" fill="#000">После</text><line x1="169" y1="95.4" x2="169" y2="181.4" stroke="#000" stroke-width="0.25"/><text x="233" y="101.3" font-size="2.5" text-anchor="middle" fill="#000">Что должно быть к началу: условия и закупки</text><line x1="297" y1="95.4" x2="297" y2="181.4" stroke="#000" stroke-width="0.25"/><text x="353.5" y="101.3" font-size="2.5" text-anchor="middle" fill="#000">Не начинать, пока открыто в реестре</text><g data-el="work-row" data-id="Р-1" data-key="dem" data-after=""><text x="31" y="109.1" font-size="2.5" text-anchor="middle" fill="#000">Р-1</text><text x="38.5" y="109.1" font-size="2.5" fill="#000">Демонтаж покрытий, отделки стен и потолков, дверных блоков и</text><text x="38.5" y="112.5" font-size="2.5" fill="#000">приборов; конструкции, стены и перегородки не трогать до технического</text><text x="38.5" y="115.9" font-size="2.5" fill="#000">заключения (стадия 1)</text><text x="130.5" y="109.1" font-size="2.5" fill="#000"></text><text x="170.5" y="109.1" font-size="2.5" fill="#000">до начала: запрошены документы на дом и БТИ; контрольный обмер до демонтажа (что видно)</text><text x="170.5" y="112.5" font-size="2.5" fill="#000">сделан</text><text x="298.5" y="109.1" font-size="2.5" fill="#000"></text></g><line x1="25" y1="119" x2="410" y2="119" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-2" data-key="obmer" data-after="Р-1"><text x="31" y="122.7" font-size="2.5" text-anchor="middle" fill="#000">Р-2</text><text x="38.5" y="122.7" font-size="2.5" fill="#000">Контрольный обмер на голых стенах и обследование (задание — лист</text><text x="38.5" y="126.1" font-size="2.5" fill="#000">«Задание на контрольный обмер») (стадия 2)</text><text x="130.5" y="122.7" font-size="2.5" fill="#000">Р-1</text><text x="170.5" y="122.7" font-size="2.5" fill="#000">после снятия отделки: видны стояки, каналы, щиток, толщины стен; до заказа всего, что делают по</text><text x="170.5" y="126.1" font-size="2.5" fill="#000">размеру</text><text x="298.5" y="122.7" font-size="2.5" fill="#000"></text></g><line x1="25" y1="129.2" x2="410" y2="129.2" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-3" data-key="el" data-after="Р-2"><text x="31" y="132.9" font-size="2.5" text-anchor="middle" fill="#000">Р-3</text><text x="38.5" y="132.9" font-size="2.5" fill="#000">Черновая электрика: штробы, короба, гофра, подрозетники, щит (стадия</text><text x="38.5" y="136.3" font-size="2.5" fill="#000">4)</text><text x="130.5" y="132.9" font-size="2.5" fill="#000">Р-2</text><text x="170.5" y="132.9" font-size="2.5" fill="#000">до начала: план электрики с высотами утверждён; штробы в стенах — только после технического</text><text x="170.5" y="136.3" font-size="2.5" fill="#000">заключения; мебель расставлена</text><text x="298.5" y="132.9" font-size="2.5" fill="#000">К-6: Разрешённая мощность по ТУ в брифе не указана; принята 10 кВт (квартира с</text><text x="298.5" y="136.3" font-size="2.5" fill="#000">электроплитой).</text></g><line x1="25" y1="139.4" x2="410" y2="139.4" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-4" data-key="vk" data-after="Р-2"><text x="31" y="143.1" font-size="2.5" text-anchor="middle" fill="#000">Р-4</text><text x="38.5" y="143.1" font-size="2.5" fill="#000">Черновая сантехника и вентиляция: разводка, выводы, инсталляции,</text><text x="38.5" y="146.5" font-size="2.5" fill="#000">короба стояков (стадия 5)</text><text x="130.5" y="143.1" font-size="2.5" fill="#000">Р-2</text><text x="170.5" y="143.1" font-size="2.5" fill="#000">до начала: положение стояков замерено; модели инсталляций и машины выбраны (габариты рамы,</text><text x="170.5" y="146.5" font-size="2.5" fill="#000">подводка); инсталляцию ставят до обшивки ГКЛВ и до гидроизоляции</text><text x="170.5" y="149.9" font-size="2.5" fill="#000">Закупки к началу: З-3 (стиральная машина), З-4 (сантехника)</text><text x="298.5" y="143.1" font-size="2.5" fill="#000">К-4: Стояки: на плане потолков есть только знак ⊘ в верхнем левом углу ванной (120 мм</text><text x="298.5" y="146.5" font-size="2.5" fill="#000">от стены) — принят за стояк канализации К1 Ø110; стояки В1 и Т3 на плане не показаны и</text><text x="298.5" y="149.9" font-size="2.5" fill="#000">приняты в том же коробе (предложение).</text></g><line x1="25" y1="153" x2="410" y2="153" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-5" data-key="plaster" data-after="Р-2 Р-3 Р-4"><text x="31" y="156.7" font-size="2.5" text-anchor="middle" fill="#000">Р-5</text><text x="38.5" y="156.7" font-size="2.5" fill="#000">Коробки скрытых дверей, затем штукатурка стен и откосов (стадия 6)</text><text x="130.5" y="156.7" font-size="2.5" fill="#000">Р-2, Р-3, Р-4</text><text x="170.5" y="156.7" font-size="2.5" fill="#000">до начала: электрика и сантехника смонтированы, штробы заделаны; коробки скрытых дверей</text><text x="170.5" y="160.1" font-size="2.5" fill="#000">установлены до штукатурки (поэтому заказ дверей — раньше работы)</text><text x="298.5" y="156.7" font-size="2.5" fill="#000"></text></g><line x1="25" y1="163.2" x2="410" y2="163.2" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-6" data-key="screed" data-after="Р-5"><text x="31" y="166.9" font-size="2.5" text-anchor="middle" fill="#000">Р-6</text><text x="38.5" y="166.9" font-size="2.5" fill="#000">Стяжка пола и тёплый пол (стадия 7)</text><text x="130.5" y="166.9" font-size="2.5" fill="#000">Р-5</text><text x="170.5" y="166.9" font-size="2.5" fill="#000">до начала: штукатурка сделана; трубы под стяжкой приняты; нивелировка плиты выполнена</text><text x="298.5" y="166.9" font-size="2.5" fill="#000"></text></g><line x1="25" y1="171.2" x2="410" y2="171.2" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-7" data-key="wp" data-after="Р-6"><text x="31" y="174.9" font-size="2.5" text-anchor="middle" fill="#000">Р-7</text><text x="38.5" y="174.9" font-size="2.5" fill="#000">Гидроизоляция санузлов и тест проливом (стадия 8)</text><text x="130.5" y="174.9" font-size="2.5" fill="#000">Р-6</text><text x="170.5" y="174.9" font-size="2.5" fill="#000">до начала: стяжка набрала прочность и сухая по инструкции гидроизоляции; выводы стоят на</text><text x="170.5" y="178.3" font-size="2.5" fill="#000">проектных отметках</text><text x="298.5" y="174.9" font-size="2.5" fill="#000"></text></g></g></g><g data-el="assumed-notes" data-flags="furniture:М5" data-ids="К-1 К-2 К-3 К-5 К-6 К-7 К-9 К-26" data-level="0"><text x="25.5" y="265.3" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="268.7" font-size="2.5" fill="#000">Основа листа: планировка по обводу плана заказчика, не замерена (К-1); высота до плиты 2650 мм от чистого пола — решение автора (ИЗ-1); отметки плана потолков сдвинуты на -95</text><text x="25.5" y="272.1" font-size="2.5" fill="#000">мм (+2.745 плана = низ плиты), не замерено (К-2); толщины стен приняты: наружные 260 мм, перегородки 130 мм (К-1); положение стен и проёмов — по брифу без обмера и плана</text><text x="25.5" y="275.5" font-size="2.5" fill="#000">БТИ (К-1); разрешённая мощность 10 кВт принята, ТУ не переданы (К-6); вентканалы приняты, в брифе не заданы (К-5); тип дома, перекрытие и несущие стены не известны —</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">документов нет (К-3); плита электрическая — принята, в брифе не указано (К-6); система заземления TN-C-S принята, ТУ не переданы (К-6); число жильцов 2 принято, в брифе не</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">указано (К-9); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-26).</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">Знак «**» — предложение проектировщика, заказчиком не утверждено (согласовать с заказчиком): К-7: М5.</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1, К-3, К-5–К-7, К-9; лист 8, запись К-26).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">13.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-020-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Квартира 68 м², элитный модерн</text><text x="297" y="259.2" font-size="2.5" data-fit="116" fill="#000">Общая площадь 68,47* м² · * размеры приняты, не заме
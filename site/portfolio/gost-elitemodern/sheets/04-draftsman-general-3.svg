ill="#000">Ссылочные документы</text></g><line x1="25" y1="181" x2="210" y2="181" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="186.85" font-size="2.5" fill="#000">ГОСТ 21.201-2011</text><text x="86.5" y="185.15" font-size="2.5" fill="#000">СПДС. Условные графические изображения элементов зданий,</text><text x="86.5" y="188.55" font-size="2.5" fill="#000">сооружений и конструкций</text></g><line x1="25" y1="190.8" x2="210" y2="190.8" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="195.75" font-size="2.5" fill="#000">ГОСТ 21.205-2016</text><text x="86.5" y="195.75" font-size="2.5" fill="#000">СПДС. Условные обозначения элементов санитарно-технических систем</text></g><line x1="25" y1="198.8" x2="210" y2="198.8" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="204.65" font-size="2.5" fill="#000">ГОСТ 21.210-2014</text><text x="86.5" y="202.95" font-size="2.5" fill="#000">СПДС. Изображения условные графические электрооборудования и</text><text x="86.5" y="206.35" font-size="2.5" fill="#000">проводок на планах</text></g><line x1="25" y1="208.6" x2="210" y2="208.6" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="214.45" font-size="2.5" fill="#000">ГОСТ 2.306-68</text><text x="86.5" y="212.75" font-size="2.5" fill="#000">ЕСКД. Обозначения графические материалов и правила их нанесения</text><text x="86.5" y="216.15" font-size="2.5" fill="#000">на чертежах</text></g><line x1="25" y1="218.4" x2="210" y2="218.4" stroke="#000" stroke-width="0.25"/><g><text x="86.5" y="223.35" font-size="2.5" text-decoration="underline" fill="#000">Прилагаемые документы</text></g><line x1="25" y1="226.4" x2="210" y2="226.4" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="232.25" font-size="2.5" fill="#000">ГД-2026-020-АИ.В1</text><text x="86.5" y="230.55" font-size="2.5" fill="#000">Визуализация. Вид сверху (3D), схематичная модель по плану:</text><text x="86.5" y="233.95" font-size="2.5" fill="#000">мебель, текстиль и декор из данных проекта</text><text x="181.5" y="232.25" font-size="2.5" fill="#000">альбом визуализаций</text></g></g><g data-el="project-composition"><text x="220" y="29.5" font-size="3.5" font-weight="700" fill="#000">Состав дизайн-проекта</text><rect x="220" y="32" width="185" height="67.4" fill="none" stroke="#000" stroke-width="0.5"/><line x1="220" y1="47" x2="405" y2="47" stroke="#000" stroke-width="0.5"/><text x="239" y="40.4" font-size="2.5" text-anchor="middle" fill="#000">Раздел</text><line x1="258" y1="32" x2="258" y2="99.4" stroke="#000" stroke-width="0.25"/><text x="316.5" y="40.4" font-size="2.5" text-anchor="middle" fill="#000">Состав</text><line x1="375" y1="32" x2="375" y2="99.4" stroke="#000" stroke-width="0.25"/><text x="390" y="40.4" font-size="2.5" text-anchor="middle" fill="#000">Листы</text><g><text x="221.5" y="52.85" font-size="2.5" fill="#000">Обложка</text><text x="259.5" y="51.15" font-size="2.5" fill="#000">Дизайн-проект интерьера; Квартира 68 м², элитный модерн; автор проекта — Кырлан</text><text x="259.5" y="54.55" font-size="2.5" fill="#000">Александр Сергеевич</text><text x="390" y="52.85" font-size="2.5" text-anchor="middle" fill="#000">1 с.</text></g><line x1="220" y1="56.8" x2="405" y2="56.8" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="62.65" font-size="2.5" fill="#000">Концепция</text><text x="259.5" y="60.95" font-size="2.5" fill="#000">Стиль Современный (контемпорари) 60 % + Тихая роскошь (quiet luxury) 40 %:</text><text x="259.5" y="64.35" font-size="2.5" fill="#000">концепция интерьера, палитра и материалы (колерная карта — лист 64)</text><text x="390" y="62.65" font-size="2.5" text-anchor="middle" fill="#000">л. 26</text></g><line x1="220" y1="66.6" x2="405" y2="66.6" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="72.45" font-size="2.5" fill="#000">Визуализации</text><text x="259.5" y="70.75" font-size="2.5" fill="#000">1 изобр.: Вид сверху (3D), схематичная модель по плану: мебель, текстиль и декор</text><text x="259.5" y="74.15" font-size="2.5" fill="#000">из данных проекта</text><text x="390" y="72.45" font-size="2.5" text-anchor="middle" fill="#000">В1–В1</text></g><line x1="220" y1="76.4" x2="405" y2="76.4" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="82.25" font-size="2.5" fill="#000">Рабочие чертежи</text><text x="259.5" y="80.55" font-size="2.5" fill="#000">планы, развёртки, узлы (развёртки и узлы — листы 49–51, 82, 84, 86–89, 91, 94,</text><text x="259.5" y="83.95" font-size="2.5" fill="#000">95, 98, 100, 103)</text><text x="390" y="82.25" font-size="2.5" text-anchor="middle" fill="#000">л. 1–118</text></g><line x1="220" y1="86.2" x2="405" y2="86.2" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="93.75" font-size="2.5" fill="#000">Спецификации и ведомости</text><text x="259.5" y="93.75" font-size="2.5" fill="#000">оборудование, изделия, отделка, электроточки</text><text x="390" y="90.35" font-size="2.5" text-anchor="middle" fill="#000">л. 25, 28–31, 35,</text><text x="390" y="93.75" font-size="2.5" text-anchor="middle" fill="#000">36, 52, 62–65, 69,</text><text x="390" y="97.15" font-size="2.5" text-anchor="middle" fill="#000">70, 104–108</text></g></g><g data-deviation="sheets-count-every-sheet"/><g data-deviation="scale-in-stamp"/><g data-deviation="elevation-1:40"/><g data-deviation="dim-font-2.5"/><g data-deviation="room-circle-8"/><g data-el="general-ref"><text x="25" y="290.2" font-size="2.5" textLength="182.41" lengthAdjust="spacingAndGlyphs" data-fit="203" fill="#000">Общие указания — лист 5: ±0,000 — чистый пол; несущие конструкции и сети дома — по отдельному проекту; скрытые работы — по актам. Открытые вопросы и допущения — листы 6–9.</text><g data-el="open-issues-ref" data-target="6"/></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-3 К-5 К-6 К-9 К-26" data-level="0"><text x="25.5" y="264.2" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="267.6" font-size="2.5" fill="#000">Основа листа: планировка по обводу плана заказчика, не замерена (К-1); высота до плиты 2650 мм от чистого пола — решение автора (ИЗ-1); отметки плана потолков сдвинуты на -95</text><text x="25.5" y="271" font-size="2.5" fill="#000">мм (+2.745 плана = низ плиты), не замерено (К-2); толщины стен приняты: наружные 260 мм, перегородки 130 мм (К-1); положение стен и проёмов — по брифу без обмера и плана</text><text x="25.5" y="274.4" font-size="2.5" fill="#000">БТИ (К-1); разрешённая мощность 10 кВт принята, ТУ не переданы (К-6); вентканалы приняты, в брифе не заданы (К-5); тип дома, перекрытие и несущие стены не известны —</text><text x="25.5" y="277.8" font-size="2.5" fill="#000">документов нет (К-3); плита электрическая — принята, в брифе не указано (К-6); система заземления TN-C-S принята, ТУ не переданы (К-6); число жильцов 2 принято, в брифе не</text><text x="25.5" y="281.2" font-size="2.5" fill="#000">указано (К-9); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-26).</text><text x="25.5" y="284.6" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1, К-3, К-5, К-6, К-9; лист 8, запись К-26).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke
#1f5fbf" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="В1"><circle cx="57.4" cy="97.81" r="1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="В1"><circle cx="81.35" cy="98.16" r="1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="В1"><circle cx="76.86" cy="83.15" r="1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="В1"><circle cx="81.76" cy="88.15" r="1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="В1"><circle cx="107.36" cy="91.15" r="1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/></g></g><g data-el="risers"><g data-el="riser" data-index="В1"><path d="M 98.81 109 L 98.81 51" fill="none" stroke="#1f5fbf" stroke-width="0.7" stroke-dasharray="1.6 1"/><path d="M 97.01 108.5 L 98.21 109.5 L 99.41 108.5 L 100.61 109.5" fill="none" stroke="#000" stroke-width="0.25"/><path d="M 97.01 50.5 L 98.21 51.5 L 99.41 50.5 L 100.61 51.5" fill="none" stroke="#000" stroke-width="0.25"/><circle cx="98.81" cy="104" r="1.1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/></g></g><g data-el="pl-labels"><text x="97.19" y="124.4" font-size="2.5" fill="#555">5 Кухня-столовая</text><text x="70.9" y="119.01" font-size="2.5" fill="#555">3 Ванная</text><text x="39.27" y="115.81" font-size="2.5" fill="#555">2 Санузел</text><text x="92.46" y="45.4" font-size="2.5" fill="#1f5fbf">Ст В1-2* Ø32</text><text x="92.46" y="48.4" font-size="2.5" fill="#1f5fbf">+2,650</text><text x="88.78" y="100" font-size="2.5" fill="#000">−0,015</text><text x="197.06" y="91.25" font-size="2.5" fill="#000">В1-8 П2</text><text x="197.06" y="94.25" font-size="2.5" fill="#000">Н=550</text><text x="180.67" y="90.25" font-size="2.5" fill="#000">В1-7 П1</text><text x="180.67" y="93.25" font-size="2.5" fill="#000">Н=600</text><text x="168.77" y="91.25" font-size="2.5" fill="#000" textLength="7.8" lengthAdjust="spacingAndGlyphs">В1-9 П3**</text><text x="168.77" y="94.25" font-size="2.5" fill="#000">Н=550</text><text x="129.22" y="92.79" font-size="2.5" fill="#000" textLength="7.8" lengthAdjust="spacingAndGlyphs">В1-4 П9**</text><text x="129.22" y="95.79" font-size="2.5" fill="#000">Н=800</text><text x="59.3" y="96.91" font-size="2.5" fill="#000">В1-3 П7</text><text x="59.3" y="99.91" font-size="2.5" fill="#000">Н=550</text><text x="83.25" y="92.56" font-size="2.5" fill="#000" textLength="8.77" lengthAdjust="spacingAndGlyphs">В1-5 П10**</text><text x="83.25" y="95.56" font-size="2.5" fill="#000">Н=550</text><text x="78.76" y="82.25" font-size="2.5" fill="#000">В1-1 П4</text><text x="78.76" y="85.25" font-size="2.5" fill="#000">Н=1000</text><text x="109.26" y="90.25" font-size="2.5" fill="#000" textLength="8.77" lengthAdjust="spacingAndGlyphs">В1-6 П16**</text><text x="109.26" y="93.25" font-size="2.5" fill="#000">Н=600</text><text x="143.39" y="98.4" font-size="2.5" fill="#1f5fbf">Ø20</text><text x="143.39" y="101.4" font-size="2.5" fill="#1f5fbf">L=4,89</text></g></g><g data-el="legend-box"><g data-el="legend"><text x="310" y="25" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><line x1="310.5" y1="31" x2="317.5" y2="31" stroke="#1f5fbf" stroke-width="0.5"/><text x="321" y="31.9" font-size="2.5" fill="#000">В1 — водопровод хозяйственно-питьевой (ХВС), PP-R Ø20</text><circle cx="314" cy="36" r="1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/><text x="321" y="36.9" font-size="2.5" fill="#000">вывод В1 (код — в ведомости привязок)</text><circle cx="314" cy="41" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="321" y="41.9" font-size="2.5" fill="#000">стояк «Ст К1-N / Ст В1-N» (ГОСТ 21.601), Ø мм</text><circle cx="314" cy="46" r="1.1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/><text x="321" y="46.9" font-size="2.5" fill="#000">стояк в плане (на отметке пола); вертикаль — стояк по высоте,</text><text x="321" y="50.2" font-size="2.5" fill="#000">разрыв — перекрытие</text><circle cx="314" cy="54.3" r="0.6" fill="#000"/><text x="321" y="55.2" font-size="2.5" fill="#000">тройник (ответвление к прибору)</text><path d="M 312 58 L 316 60.6 L 316 58 L 312 60.6 Z" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="321" y="60.2" font-size="2.5" fill="#000">кран шаровой</text><circle cx="314" cy="64.3" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35" stroke-dasharray="0.8 0.6"/><text x="321" y="65.2" font-size="2.5" fill="#000">* стояк Т3 не на обмере — принят в шахте рядом со Ст В1, сверить</text></g></g><g data-el="notes"><text x="25" y="240" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="245" font-size="2.5" fill="#000">1. Схема В1 построена по тем же трассам, что план разводки: положение в плане сохранено, глубина — в масштабе ×0,5. Трассы принципиальные; фактическое</text><text x="25" y="248.6" font-size="2.5" fill="#000">положение фиксируется исполнительной схемой до закрытия.</text><text x="25" y="252.2" font-size="2.5" fill="#000">2. Высоты Н — от чистого пола помещения, мм. Прокладка магистрали В1 по данным: коллекторная разводка, в стяжке пола, в стяжке</text><text x="25" y="255.8" font-size="2.5" fill="#000">пола, выше плиты перекрытия; отметка трасс — по пирогу пола.</text><text x="25" y="259.4" font-size="2.5" fill="#000">3. Узел ввода В1 (кран, фильтр, счётчик, обратный клапан, кран) — на схеме разводки; состав узла ввода — по согласованию. Кран шаровой — на первом</text><text x="25" y="263" font-size="2.5" fill="#000">участке от стояка.</text><text x="25" y="266.6" font-size="2.5" fill="#000" textLength="148.62" lengthAdjust="spacingAndGlyphs">4. Ст В1-2* на обмере не показаны: положение принято (исполнитель по плану заказчика), не замерено (К-4); положение сверить на объекте до разводки.</text><text x="25" y="270.2" font-size="2.5" fill="#000">5. Трубы испытать давлением до закрытия (акт скрытых работ, опрессовка по СП 73.13330.2016).</text><text x="25" y="273.8" font-size="2.5" fill="#000">6. Диаметры, высоты выводов и места кранов — по паспортам выбранных приборов и расчёту проектной организации.</text><text x="25" y="277.4" font-size="2.5" fill="#000">7. Расчёт систем, диаметры магистралей и подбор оборудования выполняет проектная организация.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="45" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="45" y1="285.5" x2="45" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="47" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="fixture:П9|fixture:П10|fixture:П16|fixture:П3|riser:Ст В1-2|riser:Ст К1-1|riser:Ст Т3-3" data-ids="ИЗ-3 К-1 К-2 К-3 К-4 К-5 К-6 К-7 К-9 К-26 К-28 К-29" data-level="0"><text x="45.5" y="193.3" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="45.5" y="196.7" font-size="2.5" fill="#000">Основа листа: планировка по обводу плана заказчика, не замерена (К-1); высота до плиты 2650 мм от чистого пола — решение автора (ИЗ-1); отметки плана потолков сдвинуты на -95 мм (+2.745</text><text x="45.5" y="200.1" font-size="2.5" fill="#000">плана = низ плиты), не замерено (К-2); толщины стен приняты: наружные 260 мм, перегородки 130 мм (К-1); положение стен и проёмов — по брифу без обмера и плана БТИ (К-1); разрешённая</text><text x="45.5" y="203.5" font-size="2.5" fill="#000">мощность 10 кВт принята, ТУ не переданы (К-6); вентканалы приняты, в брифе не заданы (К-5); тип дома, перекрытие и несущие стены не известны — документов нет (К-3); плита электрическая —</text><text x="45.5" y="206.9" font-size="2.5" fill="#000">принята, в брифе не указано (К-6); система заземления TN-C-S принята, ТУ не переданы (К-6); число жильцов 2 принято, в брифе не указано (К-9); подрайон климата не задан — принят не северный</text><text x="45.5" y="210.3" font-size="2.5" fill="#000">(жилые от 2,5 м) (К-26).</text><text x="45.5" y="213.7" font-size="2.5" fill="#000">Знак «*» — принято, не замерено и не подтверждено (замерить на объекте): К-4: Ст В1-2, Ст К1-1, Ст Т3-3 — положение стояка снято с обвода плана, не замерено.</text><text x="45.5" y="217.1" font-size="2.5" fill="#000">Знак «**» — предложение проектировщика, заказчиком не утверждено (согласовать с заказчиком): П3 — питьевая вода без бытового фильтра в доме не гарантирована; фильтр под мойкой —</text><text x="45.5" y="220.5" font-size="2.5" fill="#000">предложение по умолчанию, заказчик может снять (с дренажом отдельной врезкой); ИЗ-3, К-7: П10 — раковина у левой стены: светильники 14 плана — у зеркала над ней; отвод К1 к стояку в углу</text><text x="45.5" y="223.9" font-size="2.5" fill="#000">короткий; П16 — место стиральной машины — в ванной у верхней стены, правее короба стояка; подход 1100 мм перед дверцей, выводы ХВС и К1 Ø40 за машиной; ИЗ-3, К-28: П9 — ванна 1700 ×</text><text x="45.5" y="227.3" font-size="2.5" fill="#000">750 у правой стены на всю глубину помещения (1700 мм по плану) — стояк в левом углу свободен.</text><text x="45.5" y="230.7" font-size="2.5" fill="#000">Открытые вопросы и конфликты по листу: К-29.</text><text x="45.5" y="234.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 5, записи К-1, К-3–К-7, К-9; лист 6, запись К-26; лист 7, записи ИЗ-3, К-28, К-29).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">04.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">
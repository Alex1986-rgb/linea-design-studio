size="2.5" text-anchor="middle" transform="rotate(-90 33 95)" fill="#000">4330</text></g></g><g data-el="legend"><g><rect x="26" y="158" width="6" height="4" fill="#a98a48" stroke="#000" stroke-width="0.25"/></g><text x="36" y="160.9" font-size="2.5" fill="#000">ПТ4 — низ +2,460</text><g><rect x="60.37" y="158" width="6" height="4" fill="#e3d1a8" stroke="#000" stroke-width="0.25"/></g><text x="70.37" y="160.9" font-size="2.5" fill="#000">ПТ5 — низ +2,550</text><g><rect x="94.73" y="158" width="6" height="4" fill="#ffffff" stroke="#000" stroke-width="0.25"/></g><text x="104.73" y="160.9" font-size="2.5" fill="#000">ПТ6 — низ +2,650</text></g></g></g><g data-el="notes"><text x="25" y="241" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="246" font-size="2.5" fill="#000">1. ГКЛ 12,5 мм по каркасу П113; узлы коробов и ниш под шторы: узел 1 — лист 59; узел 2 — лист 59; условные обозначения разрезов — на листе 59.</text><text x="25" y="249.4" font-size="2.5" fill="#000">2. Фрагмент 1 (план потолков — лист 58) — фигурные уровни потолка крупно: привязки краёв и центров фигур к чистым граням стен, радиусы (R) с центрами, хорда и стрелка дуги, отметки низа каждого</text><text x="28" y="252.8" font-size="2.5" fill="#000">уровня; цвета уровней — как на плане потолков.</text><text x="25" y="256.2" font-size="2.5" fill="#000">3. Фигурные уровни: борт — ГКЛ по ПН с надрезами (на дуге шаг стоек борта 300 мм при R до 2500, 400 — до 5000) или по гнутому заводскому профилю (СП 163, 6.3.3).</text></g><g data-el="ref-back" data-target="58"/><g data-el="scale-bar"><line x1="25" y1="287" x2="45" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="45" y1="285.5" x2="45" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="47" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-3 К-5 К-6 К-9 К-26" data-level="0"><text x="22.5" y="213.7" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="22.5" y="217.1" font-size="2.5" fill="#000">Основа листа: планировка по обводу плана заказчика, не замерена (К-1); высота до плиты 2650 мм от чистого пола — решение автора (ИЗ-1); отметки плана потолков сдвинуты на -95 мм (+2.745</text><text x="22.5" y="220.5" font-size="2.5" fill="#000">плана = низ плиты), не замерено (К-2); толщины стен приняты: наружные 260 мм, перегородки 130 мм (К-1); положение стен и проёмов — по брифу без обмера и плана БТИ (К-1); разрешённая</text><text x="22.5" y="223.9" font-size="2.5" fill="#000">мощность 10 кВт принята, ТУ не переданы (К-6); вентканалы приняты, в брифе не заданы (К-5); тип дома, перекрытие и несущие стены не известны — документов нет (К-3); плита электрическая —</text><text x="22.5" y="227.3" font-size="2.5" fill="#000">принята, в брифе не указано (К-6); система заземления TN-C-S принята, ТУ не переданы (К-6); число жильцов 2 принято, в брифе не указано (К-9); подрайон климата не задан — принят не северный</text><text x="22.5" y="230.7" font-size="2.5" fill="#000">(жилые от 2,5 м) (К-26).</text><text x="22.5" y="234.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1, К-3, К-5, К-6, К-9; лист 7, запись К-26).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1
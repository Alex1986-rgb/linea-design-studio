<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Открытые вопросы, принятые допущения и конфликты. Лист 3 из 3" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты. Лист 3 из 3</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации (стартовое совещание 03.11.2026)</text><g data-el="open-issues" data-plan="fixed" data-plan-declared="3"><g data-el="issues-questions"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Открытые вопросы и принятые допущения (продолжение)</text><rect x="25" y="33" width="385" height="64.4" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="32" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="33" x2="39" y2="97.4" stroke="#000" stroke-width="0.25"/><text x="122" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Формулировка</text><line x1="205" y1="33" x2="205" y2="97.4" stroke="#000" stroke-width="0.25"/><text x="220" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Вид</text><line x1="235" y1="33" x2="235" y2="97.4" stroke="#000" stroke-width="0.25"/><text x="253" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Кто решает</text><line x1="271" y1="33" x2="271" y2="97.4" stroke="#000" stroke-width="0.25"/><text x="309.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Если решения нет</text><line x1="348" y1="33" x2="348" y2="97.4" stroke="#000" stroke-width="0.25"/><text x="379" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Лист, где это проявляется</text><g data-el="issue-row" data-kind="question" data-id="К-28"><text x="32" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">К-28</text><text x="40.5" y="46.7" font-size="2.5" fill="#000">Ванна П9 (пом. 3 «Ванная»), выпуск К1-3 Ø50: в полу не помещается: врезка + перепад 62 (2,06 м × 30 мм/м) + Ø50 + слой над</text><text x="40.5" y="50.1" font-size="2.5" fill="#000">трубой 45 = 187 мм при пироге 90 мм. Рекомендация исполнителя — короб 150×110 над чистым полом вдоль стен до Ст К1-1 (2,06</text><text x="40.5" y="53.5" font-size="2.5" fill="#000">м): плитка обходит короб, у двери короб не проходит; сифон и выпуск прибора — над полом за экраном/корпусом. Варианты: (а)</text><text x="40.5" y="56.9" font-size="2.5" fill="#000">короб 150×110 над чистым полом вдоль стен до Ст К1-1 (2,06 м): плитка обходит короб, у двери короб не проходит; (б) подиум или</text><text x="40.5" y="60.3" font-size="2.5" fill="#000">подъём пола на 100 мм — ступень и порог у входа, высота двери в свету и выводов прибора меняются, пересчёт раскладки плитки;</text><text x="40.5" y="63.7" font-size="2.5" fill="#000">(в) прибор ближе к стояку Ст К1-1 — меняется планировка санузла (расстановка, выводы, раскладка); (г) насосная установка (КНС) у</text><text x="40.5" y="67.1" font-size="2.5" fill="#000">прибора — шум, обслуживание, электропитание, согласование; только если другие варианты невозможны. Решение меняет санузел</text><text x="40.5" y="70.5" font-size="2.5" fill="#000">(высоты, раскладку плитки) — за автором с заказчиком.</text><text x="206.5" y="46.7" font-size="2.5" fill="#000">Спорно</text><text x="206.5" y="50.1" font-size="2.5" fill="#000">Ждёт: решения</text><text x="236.5" y="46.7" font-size="2.5" fill="#000">Инженер ВК (вода,</text><text x="236.5" y="50.1" font-size="2.5" fill="#000">канализация)</text><text x="272.5" y="46.7" font-size="2.5" fill="#000">выпуск К1-3 и прибор П9 не выполнять до решения;</text><text x="272.5" y="50.1" font-size="2.5" fill="#000">остальное — по листам</text><text x="349.5" y="46.7" font-size="2.5" fill="#000">л. 35 — Схема разводки водопровода и</text><text x="349.5" y="50.1" font-size="2.5" fill="#000">канализации</text><text x="349.5" y="53.5" font-size="2.5" fill="#000">л. 34 — План выводов сантехники</text></g><line x1="25" y1="73.6" x2="410" y2="73.6" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-29"><text x="32" y="77.3" font-size="2.5" text-anchor="middle" fill="#000">К-29</text><text x="40.5" y="77.3" font-size="2.5" fill="#000">Циркуляция ГВС в данных не задана — циркуляционного трубопровода на схеме нет. Решить: нужна ли циркуляция</text><text x="206.5" y="77.3" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="80.7" font-size="2.5" fill="#000">Ждёт: решения</text><text x="236.5" y="77.3" font-size="2.5" fill="#000">Инженер ВК (вода,</text><text x="236.5" y="80.7" font-size="2.5" fill="#000">канализация)</text><text x="272.5" y="77.3" font-size="2.5" fill="#000">циркуляции на схеме нет</text><text x="349.5" y="77.3" font-size="2.5" fill="#000">л. 39–42 — Развёртки мокрых зон: выводы ВК.</text><text x="349.5" y="80.7" font-size="2.5" fill="#000">Санузел</text><text x="349.5" y="84.1" font-size="2.5" fill="#000">л. 36 — Аксонометрическая схема В1 (холодное</text><text x="349.5" y="87.5" font-size="2.5" fill="#000">водоснабжение)</text><text x="349.5" y="90.9" font-size="2.5" fill="#000">л. 35 — Схема разводки водопровода и</text><text x="349.5" y="94.3" font-size="2.5" fill="#000">канализации</text></g></g><g data-el="issues-changes"><text x="25" y="109.8" font-size="3.5" font-weight="700" fill="#000">Изменения проекта после выпуска листов (реестр изменений)</text><rect x="25" y="112.4" width="385" height="88.2" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="122.4" x2="410" y2="122.4" stroke="#000" stroke-width="0.5"/><text x="32" y="118.3" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="112.4" x2="39" y2="200.6" stroke="#000" stroke-width="0.25"/><text x="50" y="118.3" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><line x1="61" y1="112.4" x2="61" y2="200.6" stroke="#000" stroke-width="0.25"/><text x="91" y="118.3" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><line x1="121" y1="112.4" x2="121" y2="200.6" stroke="#000" stroke-width="0.25"/><text x="171" y="118.3" font-size="2.5" text-anchor="middle" fill="#000">Было</text><line x1="221" y1="112.4" x2="221" y2="200.6" stroke="#000" stroke-width="0.25"/><text x="283.5" y="118.3" font-size="2.5" text-anchor="middle" fill="#000">Стало</text><line x1="346" y1="112.4" x2="346" y2="200.6" stroke="#000" stroke-width="0.25"/><text x="378" y="118.3" font-size="2.5" text-anchor="middle" fill="#000">Кто решил, подпись</text><g data-el="issue-row" data-kind="change" data-id="ИЗ-1"><text x="32" y="126.1" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-1</text><text x="40.5" y="126.1" font-size="2.5" fill="#000">03.11.2026</text><text x="62.5" y="126.1" font-size="2.5" fill="#000">л. 15 — Обмерный план</text><text x="62.5" y="129.5" font-size="2.5" fill="#000">л. 45 — План потолков</text><text x="122.5" y="126.1" font-size="2.5" fill="#000">Высота до плиты 2745 мм — по отметке +2.745 плана потолков (К-2).</text><text x="222.5" y="126.1" font-size="2.5" fill="#000">Решение автора: от чистого пола до плиты 2650 мм; отметки плана −95 мм, перепады сохранены:</text><text x="222.5" y="129.5" font-size="2.5" fill="#000">по плите +2.650, комнаты +2.590, прихожая +2.550, санузел и ванная +2.505. Датум отметок плана</text><text x="222.5" y="132.9" font-size="2.5" fill="#000">— допущение (отдельный вопрос).</text><text x="347.5" y="126.1" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 03.11.2026.</text><text x="347.5" y="129.5" font-size="2.5" fill="#000">Предложил: Александр Кырлан, решение автора.</text></g><line x1="25" y1="136" x2="410" y2="136" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-2"><text x="32" y="139.7" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-2</text><text x="40.5" y="139.7" font-size="2.5" fill="#000">03.11.2026</text><text x="62.5" y="139.7" font-size="2.5" fill="#000">л. 19 — План расстановки мебели</text><text x="122.5" y="139.7" font-size="2.5" fill="#000">Назначение помещений не подписано (К-11).</text><text x="222.5" y="139.7" font-size="2.5" fill="#000">Решение автора — по предложению исполнителя: кабинет у окна (бра 12), кухня-столовая с</text><text x="222.5" y="143.1" font-size="2.5" fill="#000">эркером (подсветка 13), гостиная, спальня (подвесы 13-А/13-Б, кровать 1800 между ними).</text><text x="347.5" y="139.7" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 03.11.2026.</text><text x="347.5" y="143.1" font-size="2.5" fill="#000">Предложил: Александр Кырлан, решение автора.</text></g><line x1="25" y1="146.2" x2="410" y2="146.2" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-3"><text x="32" y="149.9" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-3</text><text x="40.5" y="149.9" font-size="2.5" fill="#000">03.11.2026</text><text x="62.5" y="149.9" font-size="2.5" fill="#000">л. 34 — План выводов сантехники</text><text x="62.5" y="153.3" font-size="2.5" fill="#000">л. 49 — Раскладка плитки. Планы полов</text><text x="122.5" y="149.9" font-size="2.5" fill="#000">Ванная и санузел не подписаны (К-12).</text><text x="222.5" y="149.9" font-size="2.5" fill="#000">Решение автора: большее — ванная (ванна 1700 у правой стены, умывальник на тумбе 800,</text><text x="222.5" y="153.3" font-size="2.5" fill="#000">стиральная машина 600 × 600 с выводами и розеткой на своей группе); меньшее — санузел</text><text x="222.5" y="156.7" font-size="2.5" fill="#000">(подвесной унитаз, гигиенический душ, раковина 400).</text><text x="347.5" y="149.9" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 03.11.2026.</text><text x="347.5" y="153.3" font-size="2.5" fill="#000">Предложил: Александр Кырлан, решение автора.</text></g><line x1="25" y1="159.8" x2="410" y2="159.8" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-4"><text x="32" y="163.5" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-4</text><text x="40.5" y="163.5" font-size="2.5" fill="#000">03.11.2026</text><text x="62.5" y="163.5" font-size="2.5" fill="#000">л. 16 — План демонтажа и монтажа</text><text x="62.5" y="166.9" font-size="2.5" fill="#000">перегородок</text><text x="122.5" y="163.5" font-size="2.5" fill="#000">Несущие стены не известны (К-13).</text><text x="222.5" y="163.5" font-size="2.5" fill="#000">Решение автора: все существующие стены — несущие до техзаключения; демонтаж и штробление</text><text x="222.5" y="166.9" font-size="2.5" fill="#000">— после него.</text><text x="347.5" y="163.5" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 03.11.2026.</text><text x="347.5" y="166.9" font-size="2.5" fill="#000">Предложил: Александр Кырлан, решение автора.</text></g><line x1="25" y1="170" x2="410" y2="170" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-5"><text x="32" y="173.7" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-5</text><text x="40.5" y="173.7" font-size="2.5" fill="#000">03.11.2026</text><text x="62.5" y="173.7" font-size="2.5" fill="#000">л. 24 — План освещения</text><text x="62.5" y="177.1" font-size="2.5" fill="#000">л. 45 — План потолков</text><text x="122.5" y="173.7" font-size="2.5" fill="#000">Споты 70 мм в 60 мм запотолочного (К-31).</text><text x="222.5" y="173.7" font-size="2.5" fill="#000">Решение: встраиваемые светильники тонкие, монтажная глубина ≤ 50 мм; марки исходного плана</text><text x="222.5" y="177.1" font-size="2.5" fill="#000">сохранены; тип — в спецификации с пометкой «глубина ≤ 50 мм».</text><text x="347.5" y="173.7" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 03.11.2026.</text><text x="347.5" y="177.1" font-size="2.5" fill="#000">Предложил: Александр Кырлан, решение автора.</text></g><line x1="25" y1="180.2" x2="410" y2="180.2" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-6"><text x="32" y="183.9" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-6</text><text x="40.5" y="183.9" font-size="2.5" fill="#000">03.11.2026</text><text x="62.5" y="183.9" font-size="2.5" fill="#000">л. 32 — План вентиляции</text><text x="122.5" y="183.9" font-size="2.5" fill="#000">Вентилятор 11 в потолке мокрых: 145 &lt; 150 мм (К-32).</text><text x="222.5" y="183.9" font-size="2.5" fill="#000">Решение: вытяжная решётка на стене санузла и ванной в канал, вентилятор канальный настенный</text><text x="222.5" y="187.3" font-size="2.5" fill="#000">с обратным клапаном; знак 11 плана — не в потолке.</text><text x="347.5" y="183.9" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 03.11.2026.</text><text x="347.5" y="187.3" font-size="2.5" fill="#000">Предложил: Александр Кырлан, решение автора.</text></g><line x1="25" y1="190.4" x2="410" y2="190.4" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-7"><text x="32" y="194.1" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-7</text><text x="40.5" y="194.1" font-size="2.5" fill="#000">03.11.2026</text><text x="62.5" y="194.1" font-size="2.5" fill="#000">л. 15 — Обмерный план</text><text x="122.5" y="194.1" font-size="2.5" fill="#000">Датум отметок плана не известен (К-30).</text><text x="222.5" y="194.1" font-size="2.5" fill="#000">Решение: допущение сохраняется — отметки дизайнера на 95 мм ниже чистого пола; подтвердить</text><text x="222.5" y="197.5" font-size="2.5" fill="#000">на обмере (не блокирует выпуск).</text><text x="347.5" y="194.1" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 03.11.2026.</text><text x="347.5" y="197.5" font-size="2.5" fill="#000">Предложил: Александр Кырлан, решение автора.</text></g></g><g data-el="notes"><text x="25" y="213" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="217.8" font-size="2.5" fill="#000">1. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text><text x="25" y="221.2" font-size="2.5" fill="#000">2. Графа «Если решения нет» показывает состояние решения на листах; влияние на сроки и стоимость по пунктам не оценивалось.</text><text x="25" y="224.6" font-size="2.5" fill="#000">3. Пункт, по которому принято решение, при следующем выпуске комплекта из таблиц исключается.</text></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="29
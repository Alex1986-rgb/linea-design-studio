<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Открытые вопросы, принятые допущения и конфликты. Лист 5 из 5" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты. Лист 5 из 5</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации (стартовое совещание 03.11.2026)</text><g data-el="open-issues" data-plan="fixed" data-plan-declared="5"><g data-el="issues-changes"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Изменения проекта после выпуска листов (реестр изменений) (продолжение)</text><rect x="25" y="33" width="385" height="149.4" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="32" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="33" x2="39" y2="182.4" stroke="#000" stroke-width="0.25"/><text x="50" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><line x1="61" y1="33" x2="61" y2="182.4" stroke="#000" stroke-width="0.25"/><text x="91" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><line x1="121" y1="33" x2="121" y2="182.4" stroke="#000" stroke-width="0.25"/><text x="171" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Было</text><line x1="221" y1="33" x2="221" y2="182.4" stroke="#000" stroke-width="0.25"/><text x="283.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Стало</text><line x1="346" y1="33" x2="346" y2="182.4" stroke="#000" stroke-width="0.25"/><text x="378" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Кто решил, подпись</text><g data-el="issue-row" data-kind="change" data-id="ИЗ-11"><text x="32" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-11</text><text x="40.5" y="46.7" font-size="2.5" fill="#000">15.11.2026</text><text x="62.5" y="46.7" font-size="2.5" fill="#000">л. 36 — План освещения</text><text x="62.5" y="50.1" font-size="2.5" fill="#000">л. 56 — Техническое задание на подбор</text><text x="62.5" y="53.5" font-size="2.5" fill="#000">светильников</text><text x="62.5" y="56.9" font-size="2.5" fill="#000">л. 57 — План потолков</text><text x="122.5" y="46.7" font-size="2.5" fill="#000">Лента скрытой подсветки коробов (Св64–Св67) — допущение исполнителя без</text><text x="122.5" y="50.1" font-size="2.5" fill="#000">паспорта: 1200 лм/м, 14,4 Вт/м; блоки питания БП1 200, БП2 200, БП3 200, БП4</text><text x="122.5" y="53.5" font-size="2.5" fill="#000">150 Вт; питание с двух концов только у Св64 и Св65 (К-33 «паспорта ленты</text><text x="122.5" y="56.9" font-size="2.5" fill="#000">нет»).</text><text x="222.5" y="46.7" font-size="2.5" fill="#000">Класс ленты выбран проектировщиком: 24 В, 19,2 Вт/м, Ra ≥ 90, 3000 K, паспортный поток не ниже</text><text x="222.5" y="50.1" font-size="2.5" fill="#000">1500 лм/м, алюминиевый профиль с опаловым рассеивателем (бренд и артикул не выбраны</text><text x="222.5" y="53.5" font-size="2.5" fill="#000">аналог по согласованию; поток подтвердить паспортом при закупке, К-33). Поток лент: Св64 15 450</text><text x="222.5" y="56.9" font-size="2.5" fill="#000">лм, Св65 16 500, Св66 14 550, Св67 9 750; мощность 197,8 / 211,2 / 186,2 / 124,8 Вт; блоки питания</text><text x="222.5" y="60.3" font-size="2.5" fill="#000">БП1 300, БП2 300, БП3 240, БП4 200 Вт (загрузка не больше 80 %); питание с двух концов у всех</text><text x="222.5" y="63.7" font-size="2.5" fill="#000">лент (длиннее 5 м, 0,8 А/м на 24 В). Доля потока из ниши 0,35 — оценка студии (практика, не</text><text x="222.5" y="67.1" font-size="2.5" fill="#000">норма). Освещённость: кабинет +24 %, кухня-столовая +26 %, гостиная +39 %, спальня +43 % к</text><text x="222.5" y="70.5" font-size="2.5" fill="#000">требуемому потоку. Знак «**» у позиций до подписи автора.</text><text x="347.5" y="46.7" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="50.1" font-size="2.5" fill="#000">исполнителя; предложение проектировщика, на</text><text x="347.5" y="53.5" font-size="2.5" fill="#000">утверждение А. С. Кырлана</text></g><line x1="25" y1="73.6" x2="410" y2="73.6" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-10"><text x="32" y="77.3" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-10</text><text x="40.5" y="77.3" font-size="2.5" fill="#000">15.11.2026</text><text x="62.5" y="77.3" font-size="2.5" fill="#000">л. 27 — План дверей</text><text x="62.5" y="80.7" font-size="2.5" fill="#000">л. 25 — Обмерный план</text><text x="62.5" y="84.1" font-size="2.5" fill="#000">л. 70 — План текстиля и декора</text><text x="62.5" y="87.5" font-size="2.5" fill="#000">л. 65 — Ведомость отделки помещений. Лист</text><text x="62.5" y="90.9" font-size="2.5" fill="#000">1 из 2</text><text x="122.5" y="77.3" font-size="2.5" fill="#000">Межкомнатные двери Д-1…Д-5 и Д-7 — обычные, 2100 мм, с наличниками (три</text><text x="122.5" y="80.7" font-size="2.5" fill="#000">кадра с красным флагом по «двери с наличником», план узлов 15.11.2026).</text><text x="222.5" y="77.3" font-size="2.5" fill="#000">Двери Д-1…Д-5 и Д-7 — скрытого монтажа, полотно под покраску в цвет стены, без наличника</text><text x="222.5" y="80.7" font-size="2.5" fill="#000">(«дверь скрытого монтажа под покраску» — аналог по согласованию, ряд изготовителя не выбран).</text><text x="222.5" y="84.1" font-size="2.5" fill="#000">Высота: проём 2100 мм не меняется — стены существующие, несущие не определены (К-3, ИЗ-4),</text><text x="222.5" y="87.5" font-size="2.5" fill="#000">поднимать проём до 2400 нельзя; над проёмом — панель до потолка в плоскости стены с теневым</text><text x="222.5" y="90.9" font-size="2.5" fill="#000">швом, дверь читается «до потолка» (К-34). Входная дверь Д-6 без изменений. Знак «**» у позиций</text><text x="222.5" y="94.3" font-size="2.5" fill="#000">до подписи автора.</text><text x="347.5" y="77.3" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="80.7" font-size="2.5" fill="#000">исполнителя; предложение проектировщика, на</text><text x="347.5" y="84.1" font-size="2.5" fill="#000">утверждение А. С. Кырлана</text></g><line x1="25" y1="97.4" x2="410" y2="97.4" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-13" data-unresolved="1"><text x="32" y="101.1" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-13</text><text x="40.5" y="101.1" font-size="2.5" fill="#000">15.11.2026</text><text x="62.5" y="101.1" font-size="2.5" fill="#000">л. 70 — План текстиля и декора</text><text x="62.5" y="104.5" font-size="2.5" fill="#000">л. 72 — Ведомость текстиля</text><text x="62.5" y="107.9" font-size="2.5" fill="#000">л. 65 — Ведомость отделки помещений. Лист</text><text x="62.5" y="111.3" font-size="2.5" fill="#000">1 из 2</text><text x="62.5" y="114.7" font-size="2.5" fill="#000">л. 30 — План расстановки мебели</text><text x="62.5" y="118.1" font-size="2.5" fill="#000">визуализация (лист по названию не найден)</text><text x="122.5" y="101.1" font-size="2.5" fill="#000">Концепция проекта («тёмный орех обнимает светлый камень», орех</text><text x="122.5" y="104.5" font-size="2.5" fill="#000">главный материал, мрамор, латунь, одна стена-событие в комнате) в данных</text><text x="122.5" y="107.9" font-size="2.5" fill="#000">комнат не читалась, и кадры визуализации возвращал арт-директор («нет</text><text x="122.5" y="111.3" font-size="2.5" fill="#000">ореховых панелей и мрамора», «подушки случайных цветов»). Было:</text><text x="122.5" y="114.7" font-size="2.5" fill="#000">ореховая панель — только ТВ-стена гостиной (ДС1); спальня — акцентная</text><text x="122.5" y="118.1" font-size="2.5" fill="#000">краска Calke Green за изголовьем, подушки шалфей + шалфей + чернильный</text><text x="122.5" y="121.5" font-size="2.5" fill="#000">синий, плед светло-бежевый, изголовье по таблице шалфейное; кабинет,</text><text x="122.5" y="124.9" font-size="2.5" fill="#000">прихожая — без панелей; подушки гостиной бордо + шалфей; фартук кухни по</text><text x="122.5" y="128.3" font-size="2.5" fill="#000">ведомости — керамогранит под травертин, а столешница и фартук М11 в</text><text x="122.5" y="131.7" font-size="2.5" fill="#000">наименовании — мрамор «одним слэбом»; шкаф-купе М5 — «шпон / эмаль»</text><text x="122.5" y="135.1" font-size="2.5" fill="#000">без породы; камеры кадров гостиной m1, кухни m2, прихожей s1 не показывали</text><text x="122.5" y="138.5" font-size="2.5" fill="#000">стену-событие и героя комнаты.</text><text x="222.5" y="101.1" font-size="2.5" fill="#000">Стена-событие в орехе: спальня — панели ДС2 за изголовьем (стена С, 3300 мм по оси кровати,</text><text x="222.5" y="104.5" font-size="2.5" fill="#000">0–2590), акцентная краска стены С снята; кабинет — панели ДС3 за столом (стена А, 2200 мм по</text><text x="222.5" y="107.9" font-size="2.5" fill="#000">оси стола, 0–2590); прихожая — панели ДС4 у скамьи со стеной Г (1250 мм, 0–2550), зеркало ДК1</text><text x="222.5" y="111.3" font-size="2.5" fill="#000">увеличено до 600×1450, низ на 650 мм (на 200 мм выше скамьи), ваза ДК27 на скамье; шкаф-купе</text><text x="222.5" y="114.7" font-size="2.5" fill="#000">М5 — двери шпон американского ореха, вставка — бронзовое зеркало. Мрамор: фартук кухни</text><text x="222.5" y="118.1" font-size="2.5" fill="#000">слэб того же камня, что столешница М11 (в ведомости отделки керамогранит заменён камнем,</text><text x="222.5" y="121.5" font-size="2.5" fill="#000">образец — по согласованию). Текстиль: подушки гостиной — бордо (единственный акцент) и</text><text x="222.5" y="124.9" font-size="2.5" fill="#000">светлый серо-бежевый в тон дивана; спальня — подушки Shaded White и молочная в тон постели,</text><text x="222.5" y="128.3" font-size="2.5" fill="#000">плед бордо — единственный акцент, изголовье Shaded White; число подушек не менялось (диван</text><text x="222.5" y="131.7" font-size="2.5" fill="#000">1+1, кровать 2+1). Картина над изголовьем ДК7 — чёрно-белая фотография сухих трав на оси</text><text x="222.5" y="135.1" font-size="2.5" fill="#000">кровати, 1450 над полом. Камеры пересчитаны: гостиная m1 (ТВ-стена, кресло, мраморный стол),</text><text x="222.5" y="138.5" font-size="2.5" fill="#000">кухня m2 (рабочая стена), кабинет m1 (панель ДС3, стол, лампа, фотография), прихожая s1</text><text x="222.5" y="141.9" font-size="2.5" fill="#000">(шкаф-купе и панель со скамьёй), ванная s1 (ванна целиком); спальня m1 — камера прежняя,</text><text x="222.5" y="145.3" font-size="2.5" fill="#000">панель ДС2 в кадре; кадры кухни m1, ванной d1, d2 и санузла wc-s1 не тронуты. Изделия — класс и</text><text x="222.5" y="148.7" font-size="2.5" fill="#000">характеристики, бренды и артикулы не выбраны («аналог по согласованию»). Знак «**» у позиций</text><text x="222.5" y="152.1" font-size="2.5" fill="#000">до подписи автора. Картинки не перерисованы — кадры гостиной m1, спальни, кабинета, прихожей,</text><text x="222.5" y="155.5" font-size="2.5" fill="#000">кухни m2 к перерисовке по новой глине.</text><text x="347.5" y="101.1" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="104.5" font-size="2.5" fill="#000">исполнителя; предложение проектировщика, на</text><text x="347.5" y="107.9" font-size="2.5" fill="#000">утверждение А. С. Кырлана</text></g><line x1="25" y1="158.6" x2="410" y2="158.6" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-12"><text x="32" y="162.3" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-12</text><text x="40.5" y="162.3" font-size="2.5" fill="#000">15.11.2026</text><text x="62.5" y="162.3" font-size="2.5" fill="#000">л. 46 — План отопления</text><text x="62.5" y="165.7" font-size="2.5" fill="#000">л. 110 — Ведомость объёмов работ</text><text x="122.5" y="162.3" font-size="2.5" fill="#000">Открытые панельные радиаторы «панельный 22» под окнами кабинета (РО-1,</text><text x="122.5" y="165.7" font-size="2.5" fill="#000">1400×500), кухни-столовой (РО-2, 1100×500), гостиной (РО-3, 1400×500) и</text><text x="122.5" y="169.1" font-size="2.5" fill="#000">спальни (РО-4, 1400×500) — мощности 1820 / 1430 / 1820 / 1820 Вт были</text><text x="122.5" y="172.5" font-size="2.5" fill="#000">допущением генератора без теплотехнического расчёта.</text><text x="222.5" y="162.3" font-size="2.5" fill="#000">РО-1…РО-4 — внутрипольные конвекторы: решётка 300 мм вровень с чистым полом вдоль окна,</text><text x="222.5" y="165.7" font-size="2.5" fill="#000">место и длина прибора прежние (ось окна), короб в стяжке; на стене под окном прибора нет.</text><text x="222.5" y="169.1" font-size="2.5" fill="#000">Мощность не задана — «расч.» по теплотехническому расчёту, паспорт и глубина короба — при</text><text x="222.5" y="172.5" font-size="2.5" fill="#000">закупке (К-35). Пирог пола под окнами не обмерян: если короб конвектора в него не помещается</text><text x="222.5" y="175.9" font-size="2.5" fill="#000">радиатор в нише за решёткой в тон стены (после технического заключения, К-3). Изделие</text><text x="222.5" y="179.3" font-size="2.5" fill="#000">«аналог по согласованию», бренд и артикул не выбраны. Знак «**» у позиций до подписи автора.</text><text x="347.5" y="162.3" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="165.7" font-size="2.5" fill="#000">исполнителя; предложение проектировщика, на</text><text x="347.5" y="169.1" font-size="2.5" fill="#000">утверждение А. С. Кырлана</text></g></g><g data-el="notes"><text x="25" y="194.8" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="199.6" font-size="2.5" fill="#000">1. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text><text x="25" y="203" font-size="2.5" fill="#000">2. Графа «Если решения нет» показывает состояние решения на листах; влияние на сроки и стоимость по пунктам не оценивалось.</text><text x="25" y="206.4" font-size="2.5" fill="#000">3. Пункт, по которому принято решение, при следующем выпуске комплекта из таблиц исключается.</text></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke
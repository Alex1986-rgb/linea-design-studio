<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Чек-лист приёмки по этапам. Лист 3 из 4" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Чек-лист приёмки по этапам. Лист 3 из 4</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">По этапам Р-1…Р-N: что проверить, чем, какой допуск и какой акт подписать до закрытия работы</text><g data-el="acceptance"><g data-el="acc-table"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Приёмка по этапам: контрольные точки, допуски и акты скрытых работ (продолжение)</text><rect x="25" y="33" width="385" height="166.6" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="31" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Этап</text><line x1="37" y1="33" x2="37" y2="199.6" stroke="#000" stroke-width="0.25"/><text x="62" y="37.2" font-size="2.5" text-anchor="middle" fill="#000">Контрольная точка (дальше не</text><text x="62" y="40.6" font-size="2.5" text-anchor="middle" fill="#000">пускают без подписи)</text><line x1="87" y1="33" x2="87" y2="199.6" stroke="#000" stroke-width="0.25"/><text x="118" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Что проверяют</text><line x1="149" y1="33" x2="149" y2="199.6" stroke="#000" stroke-width="0.25"/><text x="169" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Чем</text><line x1="189" y1="33" x2="189" y2="199.6" stroke="#000" stroke-width="0.25"/><text x="222" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Допуск</text><line x1="255" y1="33" x2="255" y2="199.6" stroke="#000" stroke-width="0.25"/><text x="276" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Основание</text><line x1="297" y1="33" x2="297" y2="199.6" stroke="#000" stroke-width="0.25"/><text x="308" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Подпись</text><line x1="319" y1="33" x2="319" y2="199.6" stroke="#000" stroke-width="0.25"/><text x="364.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Акт скрытых работ / документ</text><g data-el="acc-row" data-work="Р-9" data-key="tile" data-n="1"><text x="31" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">Р-9</text><text x="38.5" y="46.7" font-size="2.5" fill="#000">Плитка</text><text x="38.5" y="50.1" font-size="2.5" fill="#000">Раскладка плитки: первая плита и</text><text x="38.5" y="53.5" font-size="2.5" fill="#000">первый ряд проверены по развёртке;</text><text x="38.5" y="56.9" font-size="2.5" fill="#000">плитка выбрана, калибр партии</text><text x="38.5" y="60.3" font-size="2.5" fill="#000">измерен</text><text x="88.5" y="46.7" font-size="2.5" fill="#000">Уступы между смежными плитками</text><text x="150.5" y="46.7" font-size="2.5" fill="#000">линейка, на просвет</text><text x="190.5" y="46.7" font-size="2.5" fill="#000">не более 1 мм</text><text x="256.5" y="46.7" font-size="2.5" fill="#000">норматив (СП 71.13330.2017)</text><text x="320.5" y="46.7" font-size="2.5" fill="#000">Раскладка подписана до начала плитки; протокол первого ряда; акт</text><text x="320.5" y="50.1" font-size="2.5" fill="#000">теста проливом приложен (этап гидроизоляции).</text></g><line x1="25" y1="63.4" x2="410" y2="63.4" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-9" data-key="tile" data-n="2"><text x="88.5" y="67.1" font-size="2.5" fill="#000">Ширина шва и его прямолинейность</text><text x="150.5" y="67.1" font-size="2.5" fill="#000">линейка, калибр</text><text x="190.5" y="67.1" font-size="2.5" fill="#000">до 6 мм ручная укладка; фактическая по проекту</text><text x="190.5" y="70.5" font-size="2.5" fill="#000">±0,5 мм</text><text x="256.5" y="67.1" font-size="2.5" fill="#000">практика</text></g><line x1="25" y1="73.6" x2="410" y2="73.6" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-9" data-key="tile" data-n="3"><text x="88.5" y="77.3" font-size="2.5" fill="#000">Отклонение рядов от вертикали и горизонтали</text><text x="150.5" y="77.3" font-size="2.5" fill="#000">уровень, правило, отвес</text><text x="190.5" y="77.3" font-size="2.5" fill="#000">1,5 мм на 1 м длины</text><text x="256.5" y="77.3" font-size="2.5" fill="#000">практика</text></g><line x1="25" y1="81.6" x2="410" y2="81.6" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-9" data-key="tile" data-n="4"><text x="88.5" y="85.3" font-size="2.5" fill="#000">Ровность облицовки</text><text x="150.5" y="85.3" font-size="2.5" fill="#000">правило 2 м и щуп</text><text x="190.5" y="85.3" font-size="2.5" fill="#000">не более 2–4 мм (цифра расходится по</text><text x="190.5" y="88.7" font-size="2.5" fill="#000">источникам)</text><text x="256.5" y="85.3" font-size="2.5" fill="#000">практика</text></g><line x1="25" y1="91.8" x2="410" y2="91.8" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-9" data-key="tile" data-n="5"><text x="88.5" y="95.5" font-size="2.5" fill="#000">Пустоты под плиткой</text><text x="150.5" y="95.5" font-size="2.5" fill="#000">простукивание всей площади</text><text x="190.5" y="95.5" font-size="2.5" fill="#000">до 10 % площади допустимо; свыше 25 % под</text><text x="190.5" y="98.9" font-size="2.5" fill="#000">одной плиткой — брак</text><text x="256.5" y="95.5" font-size="2.5" fill="#000">практика</text></g><line x1="25" y1="102" x2="410" y2="102" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-10" data-key="putty" data-n="1"><text x="31" y="105.7" font-size="2.5" text-anchor="middle" fill="#000">Р-10</text><text x="38.5" y="105.7" font-size="2.5" fill="#000">Шпаклёвка</text><text x="38.5" y="109.1" font-size="2.5" fill="#000">Шпаклёвка Q3/Q4: проверка боковым</text><text x="38.5" y="112.5" font-size="2.5" fill="#000">светом до окраски</text><text x="88.5" y="105.7" font-size="2.5" fill="#000">Класс основания под окраску: Q3 — сплошное</text><text x="88.5" y="109.1" font-size="2.5" fill="#000">финишное шпаклевание; Q4 — под</text><text x="88.5" y="112.5" font-size="2.5" fill="#000">направленный свет</text><text x="150.5" y="105.7" font-size="2.5" fill="#000">переносной прожектор у</text><text x="150.5" y="109.1" font-size="2.5" fill="#000">поверхности под острым</text><text x="150.5" y="112.5" font-size="2.5" fill="#000">углом</text><text x="190.5" y="105.7" font-size="2.5" fill="#000">Q3: царапины от абразива до 0,5 мм; Q4 — без</text><text x="190.5" y="109.1" font-size="2.5" fill="#000">видимых царапин и теней; неровность на 2 м: Q3</text><text x="190.5" y="112.5" font-size="2.5" fill="#000">— 1 мм, Q4 — 0,5 мм</text><text x="256.5" y="105.7" font-size="2.5" fill="#000">практика (Q-классы — не</text><text x="256.5" y="109.1" font-size="2.5" fill="#000">норматив СП, а согласованный</text><text x="256.5" y="112.5" font-size="2.5" fill="#000">критерий)</text><text x="320.5" y="105.7" font-size="2.5" fill="#000">Класс (Q3 или Q4) назван в договоре; грунтование и армирование</text><text x="320.5" y="109.1" font-size="2.5" fill="#000">стыков перед шпаклёвкой — запись в журнале.</text></g><line x1="25" y1="115.6" x2="410" y2="115.6" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-11" data-key="paint" data-n="1"><text x="31" y="119.3" font-size="2.5" text-anchor="middle" fill="#000">Р-11</text><text x="38.5" y="119.3" font-size="2.5" fill="#000">Окраска</text><text x="38.5" y="122.7" font-size="2.5" fill="#000">Выкрасы утверждены, колеровка</text><text x="38.5" y="126.1" font-size="2.5" fill="#000">одной партией</text><text x="88.5" y="119.3" font-size="2.5" fill="#000">Окраска без полос, подтёков, пропусков; цвет</text><text x="88.5" y="122.7" font-size="2.5" fill="#000">— по колерной карте</text><text x="150.5" y="119.3" font-size="2.5" fill="#000">боковой свет, образец</text><text x="150.5" y="122.7" font-size="2.5" fill="#000">выкраса</text><text x="190.5" y="119.3" font-size="2.5" fill="#000">без видимых дефектов при боковом свете</text><text x="256.5" y="119.3" font-size="2.5" fill="#000">практика</text><text x="320.5" y="119.3" font-size="2.5" fill="#000">Утверждённые выкрасы; остаток колеровки одной партии — для</text><text x="320.5" y="122.7" font-size="2.5" fill="#000">подкраски.</text></g><line x1="25" y1="129.2" x2="410" y2="129.2" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-11" data-key="paint" data-n="2"><text x="88.5" y="132.9" font-size="2.5" fill="#000">Основание сухое, огрунтованное; защита от</text><text x="88.5" y="136.3" font-size="2.5" fill="#000">прямого солнца при высыхании</text><text x="150.5" y="132.9" font-size="2.5" fill="#000">осмотр</text><text x="190.5" y="132.9" font-size="2.5" fill="#000">по ТУ краски</text><text x="256.5" y="132.9" font-size="2.5" fill="#000">норматив (СП 71.13330.2017, п.</text><text x="256.5" y="136.3" font-size="2.5" fill="#000">7.5.2)</text></g><line x1="25" y1="139.4" x2="410" y2="139.4" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-12" data-key="floor" data-n="1"><text x="31" y="143.1" font-size="2.5" text-anchor="middle" fill="#000">Р-12</text><text x="38.5" y="143.1" font-size="2.5" fill="#000">Чистовые полы</text><text x="38.5" y="146.5" font-size="2.5" fill="#000">Чистовые полы: влажность, ровность,</text><text x="38.5" y="149.9" font-size="2.5" fill="#000">уступы, зазоры — до укладки доски;</text><text x="38.5" y="153.3" font-size="2.5" fill="#000">мокрые работы закончены</text><text x="88.5" y="143.1" font-size="2.5" fill="#000">Деформационный зазор у стен и порогов (доска,</text><text x="88.5" y="146.5" font-size="2.5" fill="#000">ламинат)</text><text x="150.5" y="143.1" font-size="2.5" fill="#000">линейка, клинья при укладке</text><text x="190.5" y="143.1" font-size="2.5" fill="#000">8–15 мм (чаще 10 мм); у ламината 5–10 мм по СП</text><text x="190.5" y="146.5" font-size="2.5" fill="#000">71</text><text x="256.5" y="143.1" font-size="2.5" fill="#000">практика (требования</text><text x="256.5" y="146.5" font-size="2.5" fill="#000">производителей); норматив (СП</text><text x="256.5" y="149.9" font-size="2.5" fill="#000">71, п. 8.10.14)</text><text x="320.5" y="143.1" font-size="2.5" fill="#000">Протокол CM-влажности стяжки до укладки; паспорт и партия доски.</text></g><line x1="25" y1="156.4" x2="410" y2="156.4" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-12" data-key="floor" data-n="2"><text x="88.5" y="160.1" font-size="2.5" fill="#000">Перепад основания под покрытие</text><text x="150.5" y="160.1" font-size="2.5" fill="#000">правило 2 м и щуп</text><text x="190.5" y="160.1" font-size="2.5" fill="#000">не более 2 мм на 2 м</text><text x="256.5" y="160.1" font-size="2.5" fill="#000">практика</text></g><line x1="25" y1="164.4" x2="410" y2="164.4" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-12" data-key="floor" data-n="3"><text x="88.5" y="168.1" font-size="2.5" fill="#000">Зазоры и перепады между досками; скрип;</text><text x="88.5" y="171.5" font-size="2.5" fill="#000">видимый зазор в замке — брак</text><text x="150.5" y="168.1" font-size="2.5" fill="#000">щуп, рука, шаг</text><text x="190.5" y="168.1" font-size="2.5" fill="#000">«ступеньки» нет</text><text x="256.5" y="168.1" font-size="2.5" fill="#000">практика</text></g><line x1="25" y1="174.6" x2="410" y2="174.6" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-12" data-key="floor" data-n="4"><text x="88.5" y="178.3" font-size="2.5" fill="#000">Влажность помещения при укладке и после</text><text x="150.5" y="178.3" font-size="2.5" fill="#000">гигрометр</text><text x="190.5" y="178.3" font-size="2.5" fill="#000">не более 60 %, без сквозняков</text><text x="256.5" y="178.3" font-size="2.5" fill="#000">норматив (СП 71, п. 8.1.7)</text></g><line x1="25" y1="182.6" x2="410" y2="182.6" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-13" data-key="doors" data-n="1"><text x="31" y="186.3" font-size="2.5" text-anchor="middle" fill="#000">Р-13</text><text x="38.5" y="186.3" font-size="2.5" fill="#000">Двери и плинтусы</text><text x="38.5" y="189.7" font-size="2.5" fill="#000">Полотна и плинтусы — после</text><text x="38.5" y="193.1" font-size="2.5" fill="#000">чистового пола; скрытые полотна</text><text x="38.5" y="196.5" font-size="2.5" fill="#000">после чистовой отделки стен</text><text x="88.5" y="186.3" font-size="2.5" fill="#000">Отклонение коробки от вертикали</text><text x="150.5" y="186.3" font-size="2.5" fill="#000">отвес, уровень</text><text x="190.5" y="186.3" font-size="2.5" fill="#000">1,5 мм на 1 м, не более 3 мм на коробку</text><text x="256.5" y="186.3" font-size="2.5" fill="#000">практика (ТР 105-00, пересказ)</text><text x="320.5" y="186.3" font-size="2.5" fill="#000">Коробки скрытых дверей приняты до штукатурки (этап штукатурки);</text><text x="320.5" y="189.7" font-size="2.5" fill="#000">паспорт на полотна.</text></g></g></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4 К-8" data-level="0"><text x="25.5" y="272.1" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="275.5" font-size="2.5" fill="#000">Основа листа: размеры сняты со скана обмерного плана KV оформление (см): часть подписей не читается, помещения выровнены по читаемым размерам; контрольный обмер не</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">выполнен (К-1); высота потолка 2650 мм принята по отметкам обмера (Н = 2,50…2,66 м, ригель 2,28 м) — уточнить при обмере (К-2); толщины стен 300 / 120 мм приняты,</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">межквартирная стена и колонны — по скану, не замерены (К-1); разрешённая мощность 15 кВт принята по типовым ТУ; при объединении двух квартир — переоформление ТУ (К-4);</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-8).</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1, К-2, К-4; лист 7, запись К-8).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000"
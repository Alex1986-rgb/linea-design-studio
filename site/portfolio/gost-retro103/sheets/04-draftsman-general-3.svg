арта — лист 42)</text><text x="390" y="62.65" font-size="2.5" text-anchor="middle" fill="#000">л. 15</text></g><line x1="220" y1="66.6" x2="405" y2="66.6" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="89.45" font-size="2.5" fill="#000">Визуализации</text><text x="259.5" y="70.75" font-size="2.5" fill="#000">26 изобр.: Вид сверху (3D): планировка с мебелью, текстилем и декором;</text><text x="259.5" y="74.15" font-size="2.5" fill="#000">Визуализация «room-bath1-wB»; Визуализация «room-bath1-wC»; Визуализация</text><text x="259.5" y="77.55" font-size="2.5" fill="#000">«room-bath1-wD»; Визуализация «room-bath2-wide»; Визуализация «room-bedroom1-wA»;</text><text x="259.5" y="80.95" font-size="2.5" fill="#000">Визуализация «room-bedroom1-wB»; Визуализация «room-bedroom1-wD»; Визуализация</text><text x="259.5" y="84.35" font-size="2.5" fill="#000">«room-bedroom2-wA»; Визуализация «room-bedroom2-wB»; Визуализация</text><text x="259.5" y="87.75" font-size="2.5" fill="#000">«room-bedroom2-wC»; Визуализация «room-bedroom2-wD»; Визуализация</text><text x="259.5" y="91.15" font-size="2.5" fill="#000">«room-corridor-wB»; Визуализация «room-hall-wA»; Визуализация «room-hall-wB»;</text><text x="259.5" y="94.55" font-size="2.5" fill="#000">Визуализация «room-kitchen-wB»; Визуализация «room-kitchen-wC»; Визуализация</text><text x="259.5" y="97.95" font-size="2.5" fill="#000">«room-living-wA»; Визуализация «room-living-wB»; Визуализация «room-living-wC»;</text><text x="259.5" y="101.35" font-size="2.5" fill="#000">Визуализация «room-living-wD»; Визуализация «room-storage-wide»; Визуализация</text><text x="259.5" y="104.75" font-size="2.5" fill="#000">«room-study-wA»; Визуализация «room-study-wB»; Визуализация «room-study-wD»;</text><text x="259.5" y="108.15" font-size="2.5" fill="#000">Визуализация «room-wardrobe-wide»</text><text x="390" y="89.45" font-size="2.5" text-anchor="middle" fill="#000">В1–В26</text></g><line x1="220" y1="110.4" x2="405" y2="110.4" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="115.35" font-size="2.5" fill="#000">Рабочие чертежи</text><text x="259.5" y="115.35" font-size="2.5" fill="#000">планы, развёртки, узлы (развёртки и узлы — листы 65–72, 77, 80–83, 85–89)</text><text x="390" y="115.35" font-size="2.5" text-anchor="middle" fill="#000">л. 1–96</text></g><line x1="220" y1="118.4" x2="405" y2="118.4" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="125.95" font-size="2.5" fill="#000">Спецификации и ведомости</text><text x="259.5" y="125.95" font-size="2.5" fill="#000">оборудование, изделия, отделка, электроточки</text><text x="390" y="122.55" font-size="2.5" text-anchor="middle" fill="#000">л. 14, 17–19, 23,</text><text x="390" y="125.95" font-size="2.5" text-anchor="middle" fill="#000">24, 32, 33, 40–45,</text><text x="390" y="129.35" font-size="2.5" text-anchor="middle" fill="#000">49, 50, 90–94</text></g></g><g data-deviation="sheets-count-every-sheet"/><g data-deviation="scale-in-stamp"/><g data-deviation="elevation-1:40"/><g data-deviation="dim-font-2.5"/><g data-deviation="room-circle-8"/><g data-el="general-ref"><text x="25" y="290.2" font-size="2.5" textLength="178.6" lengthAdjust="spacingAndGlyphs" fill="#000">Общие указания — лист 5: ±0,000 — чистый пол; несущие конструкции и сети дома — по отдельному проекту; скрытые работы — по актам. Открытые вопросы и допущения — лист 6.</text><g data-el="open-issues-ref" data-target="6"/></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4" data-level="0"><text x="25.5" y="271" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="274.4" font-size="2.5" fill="#000">Основа листа: размеры сняты со скана обмерного плана KV design (см): часть подписей не читается, помещения выровнены по читаемым размерам; контрольный обмер не выполнен</text><text x="25.5" y="277.8" font-size="2.5" fill="#000">(К-1); высота потолка 2650 мм принята по отметкам обмера (Н = 2,50…2,66 м, ригель 2,28 м) — уточнить при обмере (К-2); толщины стен 300 / 120 мм приняты, межквартирная стена и</text><text x="25.5" y="281.2" font-size="2.5" fill="#000">колонны — по скану, не замерены (К-1); разрешённая мощность 15 кВт принята по типовым ТУ; при объединении двух квартир — переоформление ТУ (К-4).</text><text x="25.5" y="284.6" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1, К-2, К-4).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="2
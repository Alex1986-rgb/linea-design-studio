" fill="none" stroke="#c0392b" stroke-width="0.7"/><path d="M 81.22 108.95 L 82.42 109.95 L 83.62 108.95 L 84.82 109.95" fill="none" stroke="#000" stroke-width="0.25"/><path d="M 81.22 79.95 L 82.42 80.95 L 83.62 79.95 L 84.82 80.95" fill="none" stroke="#000" stroke-width="0.25"/><circle cx="83.02" cy="106.95" r="1.1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/></g><g data-el="riser" data-index="Т3"><path d="M 135.77 105.6 L 135.77 76.6" fill="none" stroke="#c0392b" stroke-width="0.7" stroke-dasharray="1.6 1"/><path d="M 133.97 105.1 L 135.17 106.1 L 136.37 105.1 L 137.57 106.1" fill="none" stroke="#000" stroke-width="0.25"/><path d="M 133.97 76.1 L 135.17 77.1 L 136.37 76.1 L 137.57 77.1" fill="none" stroke="#000" stroke-width="0.25"/><circle cx="135.77" cy="103.1" r="1.1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/></g><g data-el="riser" data-index="Т3"><path d="M 155.37 80 L 155.37 51" fill="none" stroke="#c0392b" stroke-width="0.7"/><path d="M 153.57 79.5 L 154.77 80.5 L 155.97 79.5 L 157.17 80.5" fill="none" stroke="#000" stroke-width="0.25"/><path d="M 153.57 50.5 L 154.77 51.5 L 155.97 50.5 L 157.17 51.5" fill="none" stroke="#000" stroke-width="0.25"/><circle cx="155.37" cy="77.5" r="1.1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/></g></g><g data-el="pl-labels"><text x="74.3" y="118.67" font-size="2.5" fill="#555">6 Ванная</text><text x="113.12" y="104.69" font-size="2.5" fill="#555">11 Ванная мастер</text><text x="41.84" y="115.47" font-size="2.5" fill="#555">5 Кухня</text><text x="83.13" y="74.85" font-size="2.5" fill="#c0392b">Ст Т3-1 Ø32</text><text x="83.13" y="77.85" font-size="2.5" fill="#c0392b">+2,650</text><text x="92.32" y="102.95" font-size="2.5" fill="#000">−0,015</text><text x="69.34" y="74.85" font-size="2.5" fill="#c0392b">Ст Т3-2 Ø32</text><text x="69.34" y="77.85" font-size="2.5" fill="#c0392b">+2,650</text><text x="72.99" y="102.95" font-size="2.5" fill="#000">±0,000</text><text x="129.48" y="71" font-size="2.5" fill="#c0392b">Ст Т3-3* Ø32</text><text x="129.48" y="74" font-size="2.5" fill="#c0392b">+2,650</text><text x="139.07" y="108.3" font-size="2.5" fill="#000">−0,015</text><text x="149.48" y="45.4" font-size="2.5" fill="#c0392b">Ст Т3-4 Ø32</text><text x="149.48" y="48.4" font-size="2.5" fill="#c0392b">+2,650</text><text x="158.67" y="78.1" font-size="2.5" fill="#000">±0,000</text><text x="150.77" y="92.1" font-size="2.5" fill="#000">Т3-4 См3</text><text x="150.77" y="95.1" font-size="2.5" fill="#000">Н=600*</text><text x="142.83" y="85.09" font-size="2.5" fill="#000">Т3-3 См1</text><text x="142.83" y="88.09" font-size="2.5" fill="#000">Н=1200*</text><text x="72.96" y="94.91" font-size="2.5" fill="#000">Т3-5 Кх1</text><text x="72.96" y="97.91" font-size="2.5" fill="#000">Н=600*</text></g></g><g data-el="legend-box"><g data-el="legend"><text x="310" y="25" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><line x1="310.5" y1="31" x2="317.5" y2="31" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><text x="321" y="31.9" font-size="2.5" fill="#000">Т3 — горячее водоснабжение, подача (ГВС), PP-R Ø20</text><circle cx="314" cy="36" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/><text x="321" y="36.9" font-size="2.5" fill="#000">вывод Т3 (код — в ведомости привязок)</text><circle cx="314" cy="41" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="321" y="41.9" font-size="2.5" fill="#000">стояк «Ст К1-N / Ст В1-N» (ГОСТ 21.601), Ø мм</text><circle cx="314" cy="46" r="1.1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/><text x="321" y="46.9" font-size="2.5" fill="#000">стояк в плане (на отметке пола); вертикаль — стояк по высоте,</text><text x="321" y="50.2" font-size="2.5" fill="#000">разрыв — перекрытие</text><circle cx="314" cy="54.3" r="0.6" fill="#000"/><text x="321" y="55.2" font-size="2.5" fill="#000">тройник (ответвление к прибору)</text><path d="M 312 58 L 316 60.6 L 316 58 L 312 60.6 Z" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="321" y="60.2" font-size="2.5" fill="#000">кран шаровой</text><circle cx="314" cy="64.3" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35" stroke-dasharray="0.8 0.6"/><text x="321" y="65.2" font-size="2.5" fill="#000">* стояк Т3 не на обмере — принят в шахте рядом со Ст В1, сверить</text></g></g><g data-el="notes"><text x="25" y="237" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="242" font-size="2.5" fill="#000">1. Схема Т3 построена по тем же трассам, что план разводки: положение в плане сохранено, глубина — в масштабе ×0,5. Трассы принципиальные; фактическое</text><text x="25" y="245.6" font-size="2.5" fill="#000">положение фиксируется исполнительной схемой до закрытия.</text><text x="25" y="249.2" font-size="2.5" fill="#000">2. Высоты Н — от чистого пола помещения, мм. Отметка прокладки магистрали Т3 (в стяжке, в стене или по полу) в данных не задана: участки показаны на</text><text x="25" y="252.8" font-size="2.5" fill="#000">уровне пола условно (записи реестра нет).</text><text x="25" y="256.4" font-size="2.5" fill="#000">3. * — высота вывода принята по практике монтажа; сверить по паспорту прибора.</text><text x="25" y="260" font-size="2.5" fill="#000">4. Узел ввода Т3 (кран, фильтр, счётчик, обратный клапан, кран) — на схеме разводки; состав узла ввода — по согласованию. Кран шаровой — на первом</text><text x="25" y="263.6" font-size="2.5" fill="#000">участке от стояка.</text><text x="25" y="267.2" font-size="2.5" fill="#000">5. Циркуляция ГВС в данных не задана — циркуляционного трубопровода на схеме нет (записи реестра нет).</text><text x="25" y="270.8" font-size="2.5" fill="#000" textLength="115.22" lengthAdjust="spacingAndGlyphs">6. Ст Т3-3* на обмере не показаны: положение принято, не замерено (К-6); положение сверить на объекте до разводки.</text><text x="25" y="274.4" font-size="2.5" fill="#000">7. Трубы испытать давлением до закрытия (акт скрытых работ, опрессовка по СП 73.13330.2016).</text><text x="25" y="278" font-size="2.5" fill="#000">8. Диаметры, высоты выводов и места кранов — по паспортам выбранных приборов и расчёту проектной организации.</text><text x="25" y="281.6" font-size="2.5" fill="#000">9. Расчёт систем, диаметры магистралей и подбор оборудования выполняет проектная организация.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="35" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="35" y1="285.5" x2="35" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="37" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="riser:Ст Т3-3|riser:Ст К1-3|riser:Ст В1-3" data-ids="К-1 К-2 К-4 К-6 К-8" data-level="0"><text x="45.5" y="207.8" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="45.5" y="211.2" font-size="2.5" fill="#000">Основа листа: размеры сняты со скана обмерного плана KV design (см): часть подписей не читается, помещения выровнены по читаемым размерам; контрольный обмер не выполнен (К-1); высота</text><text x="45.5" y="214.6" font-size="2.5" fill="#000">потолка 2650 мм принята по отметкам обмера (Н = 2,50…2,66 м, ригель 2,28 м) — уточнить при обмере (К-2); толщины стен 300 / 120 мм приняты, межквартирная стена и колонны — по скану, не</text><text x="45.5" y="218" font-size="2.5" fill="#000">замерены (К-1); разрешённая мощность 15 кВт принята по типовым ТУ; при объединении двух квартир — переоформление ТУ (К-4); подрайон климата не задан — принят не северный (жилые от 2,5</text><text x="45.5" y="221.4" font-size="2.5" fill="#000">м) (К-8).</text><text x="45.5" y="224.8" font-size="2.5" fill="#000">Знак «*» — принято, не замерено и не подтверждено (замерить на объекте): К-6: Ст Т3-3, Ст К1-3, Ст В1-3 — положение снято со скана обмера, отдельно не замерялось; ось внутри габарита</text><text x="45.5" y="228.2" font-size="2.5" fill="#000">поддона См1 — обмер угла по К-6.</text><text x="45.5" y="231.6" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1, К-2, К-4, К-6, К-8).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">04.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-009-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Квартира 103 м²</text><text x="297" y="259.2" font-size="2.5" data-fit="116" fill="#000">Общая площадь 100,72* м² · * размеры со скана, не замерены (реестр — л. 6, 7, К-1)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" data-fit="66" fill="#000">Дизайн-проект интерьера</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">36</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">120</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="282.2" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">Аксонометрическая схема Т3 (горячее</text><text x="330" y="286" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">водоснабжение)</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М 1:100</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="47" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="8" data-positions="41" data-basis="5"><rect x="315.45" y="6.2" width="98.05" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="317.45" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 8 (реестр — л. 6, 7)</text></g></svg>
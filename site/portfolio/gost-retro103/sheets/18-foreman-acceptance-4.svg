<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Чек-лист приёмки по этапам. Лист 4 из 4" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Чек-лист приёмки по этапам. Лист 4 из 4</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">По этапам Р-1…Р-N: что проверить, чем, какой допуск и какой акт подписать до закрытия работы</text><g data-el="acceptance"><g data-el="acc-table"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Приёмка по этапам: контрольные точки, допуски и акты скрытых работ (продолжение)</text><rect x="25" y="33" width="385" height="67.8" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="31" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Этап</text><line x1="37" y1="33" x2="37" y2="100.8" stroke="#000" stroke-width="0.25"/><text x="62" y="37.2" font-size="2.5" text-anchor="middle" fill="#000">Контрольная точка (дальше не</text><text x="62" y="40.6" font-size="2.5" text-anchor="middle" fill="#000">пускают без подписи)</text><line x1="87" y1="33" x2="87" y2="100.8" stroke="#000" stroke-width="0.25"/><text x="118" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Что проверяют</text><line x1="149" y1="33" x2="149" y2="100.8" stroke="#000" stroke-width="0.25"/><text x="169" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Чем</text><line x1="189" y1="33" x2="189" y2="100.8" stroke="#000" stroke-width="0.25"/><text x="222" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Допуск</text><line x1="255" y1="33" x2="255" y2="100.8" stroke="#000" stroke-width="0.25"/><text x="276" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Основание</text><line x1="297" y1="33" x2="297" y2="100.8" stroke="#000" stroke-width="0.25"/><text x="308" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Подпись</text><line x1="319" y1="33" x2="319" y2="100.8" stroke="#000" stroke-width="0.25"/><text x="364.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Акт скрытых работ / документ</text><g data-el="acc-row" data-work="Р-15" data-key="kitchen" data-n="1"><text x="31" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">Р-15</text><text x="38.5" y="46.7" font-size="2.5" fill="#000">Кухня и мебель</text><text x="38.5" y="50.1" font-size="2.5" fill="#000">Кухня и мебель: замер кухни снят по</text><text x="38.5" y="53.5" font-size="2.5" fill="#000">готовым стенам; чистовая электрика и</text><text x="38.5" y="56.9" font-size="2.5" fill="#000">сантехника подведены</text><text x="88.5" y="46.7" font-size="2.5" fill="#000">Привязка выводов и розеток к модулям кухни;</text><text x="88.5" y="50.1" font-size="2.5" fill="#000">вытяжка, вентиляция</text><text x="150.5" y="46.7" font-size="2.5" fill="#000">рулетка, сверка с листом</text><text x="150.5" y="50.1" font-size="2.5" fill="#000">кухни</text><text x="190.5" y="46.7" font-size="2.5" fill="#000">по проекту кухни</text><text x="256.5" y="46.7" font-size="2.5" fill="#000">практика</text><text x="320.5" y="46.7" font-size="2.5" fill="#000">Акт передачи кухни; паспорта техники и гарантийные талоны.</text></g><line x1="25" y1="60" x2="410" y2="60" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-15" data-key="kitchen" data-n="2"><text x="88.5" y="63.7" font-size="2.5" fill="#000">Тяга вентиляции у решёток</text><text x="150.5" y="63.7" font-size="2.5" fill="#000">лист бумаги у решётки</text><text x="190.5" y="63.7" font-size="2.5" fill="#000">бумага притягивается; при сомнениях — замер</text><text x="190.5" y="67.1" font-size="2.5" fill="#000">анемометром</text><text x="256.5" y="63.7" font-size="2.5" fill="#000">практика</text></g><line x1="25" y1="70.2" x2="410" y2="70.2" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-16" data-key="accept" data-n="1"><text x="31" y="73.9" font-size="2.5" text-anchor="middle" fill="#000">Р-16</text><text x="38.5" y="73.9" font-size="2.5" fill="#000">Сдача</text><text x="38.5" y="77.3" font-size="2.5" fill="#000">Финальная приёмка по таблицам СП</text><text x="38.5" y="80.7" font-size="2.5" fill="#000">71: дефектная ведомость и акт</text><text x="88.5" y="73.9" font-size="2.5" fill="#000">Стены, потолки, полы, плитка, двери, окна</text><text x="88.5" y="77.3" font-size="2.5" fill="#000">осмотр по чек-листу этапов выше</text><text x="150.5" y="73.9" font-size="2.5" fill="#000">правило 2 м, уровень, щуп,</text><text x="150.5" y="77.3" font-size="2.5" fill="#000">боковой свет, влагомер</text><text x="190.5" y="73.9" font-size="2.5" fill="#000">по таблицам выше</text><text x="256.5" y="73.9" font-size="2.5" fill="#000">практика</text><text x="320.5" y="73.9" font-size="2.5" fill="#000">Дефектная ведомость и акт приёмки; гарантия: по умолчанию</text><text x="320.5" y="77.3" font-size="2.5" fill="#000">претензии по качеству работ — 2 года, в договоре прописывается</text><text x="320.5" y="80.7" font-size="2.5" fill="#000">отдельно.</text></g><line x1="25" y1="83.8" x2="410" y2="83.8" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-16" data-key="accept" data-n="2"><text x="88.5" y="87.5" font-size="2.5" fill="#000">Полный пакет документов: акты скрытых работ,</text><text x="88.5" y="90.9" font-size="2.5" fill="#000">протокол электролаборатории, акт опрессовки,</text><text x="88.5" y="94.3" font-size="2.5" fill="#000">исполнительные схемы, гарантийные</text><text x="88.5" y="97.7" font-size="2.5" fill="#000">обязательства</text><text x="150.5" y="87.5" font-size="2.5" fill="#000">комплектность</text><text x="190.5" y="87.5" font-size="2.5" fill="#000">пакет собран до подписи акта</text><text x="256.5" y="87.5" font-size="2.5" fill="#000">практика</text></g></g><g data-el="notes"><text x="25" y="113.2" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="118" font-size="2.5" fill="#000">1. Метка основания: «норматив» — цифра подтверждена текстом СП, ГОСТ или ПУЭ; «практика» — отраслевая конвенция или один источник: к спору не годится без сверки первоисточника (СП 71.13330.2017, СП 29.13330, СП 163.1325800.2014, ПУЭ гл. 1.8, СП 73.13330, СП 30.13330).</text><text x="25" y="121.4" font-size="2.5" fill="#000">2. Класс штукатурки (простая / улучшенная / высококачественная) и класс основания под окраску (Q3 или Q4) называются в договоре подряда: допуск выбирается по ним. Q-классы — не норматив, а согласованный сторонами критерий.</text><text x="25" y="124.8" font-size="2.5" fill="#000">3. Акт скрытых работ подписывают до того, как работа закрыта следующим слоем (штукатуркой, плиткой, стяжкой, обшивкой): постфактум он слабее — осматривать нечего. Подписывают заказчик (или технадзор), подрядчик; при перепланировке — автор проекта. Каждую зону снимают до закрытия с рулеткой</text><text x="29" y="128.2" font-size="2.5" fill="#000">в кадре и привязкой к стене.</text><text x="25" y="131.6" font-size="2.5" fill="#000">4. По умолчанию, если срок не прописан в договоре, претензии по качеству работ можно предъявить в течение 2 лет со дня приёмки; в договоре гарантийный срок и сроки на скрытые работы рекомендуется назвать явно.</text></g></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4 К-8" data-level="0"><text x="25.5" y="272.1" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="275.5" font-size="2.5" fill="#000">Основа листа: размеры сняты со скана обмерного плана KV оформление (см): часть подписей не читается, помещения выровнены по читаемым размерам; контрольный обмер не</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">выполнен (К-1); высота потолка 2650 мм принята по отметкам обмера (Н = 2,50…2,66 м, ригель 2,28 м) — уточнить при обмере (К-2); толщины стен 300 / 120 мм приняты,</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">межквартирная стена и колонны — по скану, не замерены (К-1); разрешённая мощность 15 кВт принята по типовым ТУ; при объединении двух квартир — переоформление ТУ (К-4);</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-8).</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1, К-2, К-4; лист 7, запись К-8).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">11.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-009-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Квартира 103 м²</text><text x="297" y="259.2" font-size="2.5" data-fit="116" fill="#000">Общая площадь 100,72* м² · * размеры со скана, не замерены (реестр — л. 6, 7, К-1)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" data-fit="66" fill="#000">Дизайн-проект интерьера</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">18</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">134</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="285" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">Чек-лист приёмки по этапам. Лист 4 из 4</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="47" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="9" data-positions="41" data-basis="5"><rect x="315.45" y="6.2" width="98.05" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="317.45" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 9 (реестр — л. 6, 7)</text></g></svg>
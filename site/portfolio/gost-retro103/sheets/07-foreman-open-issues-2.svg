<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Открытые вопросы, принятые допущения и конфликты. Лист 2 из 2" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты. Лист 2 из 2</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации (стартовое совещание 18.10.2026)</text><g data-el="open-issues" data-plan="fixed" data-plan-declared="2"><g data-el="issues-questions"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Открытые вопросы и принятые допущения (продолжение)</text><rect x="25" y="33" width="385" height="37.2" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="32" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="33" x2="39" y2="70.2" stroke="#000" stroke-width="0.25"/><text x="122" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Формулировка</text><line x1="205" y1="33" x2="205" y2="70.2" stroke="#000" stroke-width="0.25"/><text x="220" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Вид</text><line x1="235" y1="33" x2="235" y2="70.2" stroke="#000" stroke-width="0.25"/><text x="253" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Кто решает</text><line x1="271" y1="33" x2="271" y2="70.2" stroke="#000" stroke-width="0.25"/><text x="309.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Если решения нет</text><line x1="348" y1="33" x2="348" y2="70.2" stroke="#000" stroke-width="0.25"/><text x="379" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Лист, где это проявляется</text><g data-el="issue-row" data-kind="question" data-id="К-7"><text x="32" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">К-7</text><text x="40.5" y="46.7" font-size="2.5" fill="#000">Унитаз подвесной Сн2 (пом. 6 «Ванная»), выпуск К1-2 Ø110: трасса до Ст К1-1 (1,91 м) идёт под дверным проёмом Д-5 — короб</text><text x="40.5" y="50.1" font-size="2.5" fill="#000">над полом там не поставить. Решить: (а) прибор ближе к стояку Ст К1-1 (без прохода под проёмом); (б) выпуск в полу с подъёмом</text><text x="40.5" y="53.5" font-size="2.5" fill="#000">пола помещения на 160 мм; (в) насосная установка (КНС) у прибора — по паспорту, требует согласования. Решение меняет санузел</text><text x="40.5" y="56.9" font-size="2.5" fill="#000">(высоты, раскладку плитки) — за автором с заказчиком.</text><text x="206.5" y="46.7" font-size="2.5" fill="#000">Спорно</text><text x="206.5" y="50.1" font-size="2.5" fill="#000">Ждёт: решения</text><text x="236.5" y="46.7" font-size="2.5" fill="#000">Инженер ВК (вода,</text><text x="236.5" y="50.1" font-size="2.5" fill="#000">канализация)</text><text x="272.5" y="46.7" font-size="2.5" fill="#000">выпуск К1-2 и прибор Сн2 не выполнять до решения;</text><text x="272.5" y="50.1" font-size="2.5" fill="#000">остальное — по листам</text><text x="349.5" y="46.7" font-size="2.5" fill="#000">л. 41 — Схема разводки водопровода и</text><text x="349.5" y="50.1" font-size="2.5" fill="#000">канализации</text><text x="349.5" y="53.5" font-size="2.5" fill="#000">л. 40 — План выводов сантехники</text></g><line x1="25" y1="60" x2="410" y2="60" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-8"><text x="32" y="63.7" font-size="2.5" text-anchor="middle" fill="#000">К-8</text><text x="40.5" y="63.7" font-size="2.5" fill="#000">Климатический подрайон (СП 131.13330) не задан: принят не северный — жилые комнаты и кухня под потолком от 2,5 м (СП 54, п.</text><text x="40.5" y="67.1" font-size="2.5" fill="#000">5.12); в IА, IБ, IГ, IД, IVА — от 2,7 м.</text><text x="206.5" y="63.7" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="67.1" font-size="2.5" fill="#000">Ждёт: документа</text><text x="236.5" y="63.7" font-size="2.5" fill="#000">Архитектор-планировщик</text><text x="272.5" y="63.7" font-size="2.5" fill="#000">отметки потолков жилых — по 2,5 м; при северном</text><text x="272.5" y="67.1" font-size="2.5" fill="#000">подрайоне уровни ниже 2,7 м пересчитать до заказа каркаса</text><text x="349.5" y="63.7" font-size="2.5" fill="#000">л. 52 — План потолков</text></g></g><g data-el="issues-changes"><text x="25" y="82.6" font-size="3.5" font-weight="700" fill="#000">Изменения проекта после выпуска листов (реестр изменений)</text><rect x="25" y="85.2" width="385" height="61" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="95.2" x2="410" y2="95.2" stroke="#000" stroke-width="0.5"/><text x="32" y="91.1" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="85.2" x2="39" y2="146.2" stroke="#000" stroke-width="0.25"/><text x="50" y="91.1" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><line x1="61" y1="85.2" x2="61" y2="146.2" stroke="#000" stroke-width="0.25"/><text x="91" y="91.1" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><line x1="121" y1="85.2" x2="121" y2="146.2" stroke="#000" stroke-width="0.25"/><text x="171" y="91.1" font-size="2.5" text-anchor="middle" fill="#000">Было</text><line x1="221" y1="85.2" x2="221" y2="146.2" stroke="#000" stroke-width="0.25"/><text x="283.5" y="91.1" font-size="2.5" text-anchor="middle" fill="#000">Стало</text><line x1="346" y1="85.2" x2="346" y2="146.2" stroke="#000" stroke-width="0.25"/><text x="378" y="91.1" font-size="2.5" text-anchor="middle" fill="#000">Кто решил, подпись</text><g data-el="issue-row" data-kind="change" data-id="ИЗ-1"><text x="32" y="98.9" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-1</text><text x="40.5" y="98.9" font-size="2.5" fill="#000">30.10.2026</text><text x="62.5" y="98.9" font-size="2.5" fill="#000">л. 34 — Однолинейная схема щита</text><text x="62.5" y="102.3" font-size="2.5" fill="#000">л. 29 — План розеток и электровыводов</text><text x="62.5" y="105.7" font-size="2.5" fill="#000">л. 58 — Раскладка плитки. Ванная. Развёртки</text><text x="62.5" y="109.1" font-size="2.5" fill="#000">стен</text><text x="62.5" y="112.5" font-size="2.5" fill="#000">л. 22 — План дверей</text><text x="62.5" y="115.9" font-size="2.5" fill="#000">л. 66 — Спецификация отделочных</text><text x="62.5" y="119.3" font-size="2.5" fill="#000">материалов</text><text x="62.5" y="122.7" font-size="2.5" fill="#000">л. 40 — План выводов сантехники</text><text x="122.5" y="98.9" font-size="2.5" fill="#000">Фены Р8, Р33 и полотенцесушители В6, В7 сидели на гр. 13 «посудомоечная</text><text x="122.5" y="102.3" font-size="2.5" fill="#000">машина», стиральная машина Р50 — на гр. 12 «духовой шкаф»; групп 7 и 8 в</text><text x="122.5" y="105.7" font-size="2.5" fill="#000">щите не было. Два вывода печатались «ЭВ4» (духовой шкаф «ЭВ4» на кухне</text><text x="122.5" y="109.1" font-size="2.5" fill="#000">и вентилятор «В4» ванной). Окно 2 спальни мастер (смещение 3500, 1300)</text><text x="122.5" y="112.5" font-size="2.5" fill="#000">выходило за стену Б (3830). Пол ванных и плинтус МДФ — без артикула.</text><text x="122.5" y="115.9" font-size="2.5" fill="#000">Стояки Ст К1-3/В1-3/Т3-3 без признака допущения.</text><text x="222.5" y="98.9" font-size="2.5" fill="#000">Группы 7 (санузлы: фены, полотенцесушители, УЗО 10 мА) и 8 (стиральная машина постирочной)</text><text x="222.5" y="102.3" font-size="2.5" fill="#000">добавлены, точки переназначены. Выводы кухни — В1 (варочная), В2 (духовой шкаф), печать</text><text x="222.5" y="105.7" font-size="2.5" fill="#000">ЭВ1/ЭВ2 — марки на листах уникальны. Окно 2 — стена Б части 1, смещение 100, знак «*» (К-1).</text><text x="222.5" y="109.1" font-size="2.5" fill="#000">Пол ванных — Marvel Travertine Sand Cross 60×60 AFUL, плинтус — Ultrawood Base 5340 83×15.</text><text x="222.5" y="112.5" font-size="2.5" fill="#000">Стояки ванной мастер — assumed, К-6; остаётся до обмера.</text><text x="347.5" y="98.9" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="102.3" font-size="2.5" fill="#000">исполнителя; на утверждение А. С. Кырлана</text></g><line x1="25" y1="125.8" x2="410" y2="125.8" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-2"><text x="32" y="129.5" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-2</text><text x="40.5" y="129.5" font-size="2.5" fill="#000">10.11.2026</text><text x="62.5" y="129.5" font-size="2.5" fill="#000">л. 22 — План дверей</text><text x="62.5" y="132.9" font-size="2.5" fill="#000">л. 25 — План расстановки мебели</text><text x="62.5" y="136.3" font-size="2.5" fill="#000">л. 29 — План розеток и электровыводов</text><text x="122.5" y="129.5" font-size="2.5" fill="#000">Д-9 (ванная мастер, стена В, 700 мм) открывалась в ванную и задевала</text><text x="122.5" y="132.9" font-size="2.5" fill="#000">душевой поддон См1; розетка Р33 (фен, стена В, смещение 489 мм, высота</text><text x="122.5" y="136.3" font-size="2.5" fill="#000">1000) — в зоне 2 душа: 488 мм от границы зоны 1 при норме не менее 600.</text><text x="222.5" y="129.5" font-size="2.5" fill="#000">Д-9 открывается из ванной в спальню (петли у начала проёма); комод М6 в спальне сдвинут на 120</text><text x="222.5" y="132.9" font-size="2.5" fill="#000">мм (смещение 2320, было 2200): зазор от дуги полотна до комода больше 20 мм. Р33 — на стене В</text><text x="222.5" y="136.3" font-size="2.5" fill="#000">со смещением 180 мм (было 489), высота 1000 мм и назначение прежние: дальше от душа (зона 2</text><text x="222.5" y="139.7" font-size="2.5" fill="#000">— граница зоны 1 не ближе 600 мм), в центре плитки 600 мм по горизонтали, у умывальника См3.</text><text x="222.5" y="143.1" font-size="2.5" fill="#000">Душ См1 (сохраняется, К-6) и его положение не тронуты.</text><text x="347.5" y="129.5" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="132.9" font-size="2.5" fill="#000">исполнителя; на утверждение А. С. Кырлана</text></g></g><g data-el="notes"><text x="25" y="158.6" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="163.4" font-size="2.5" fill="#000">1. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text><text x="25" y="166.8" font-size="2.5" fill="#000">2. Графа «Если решения нет» показывает состояние решения на листах; влияние на сроки и стоимость по пунктам не оценивалось.</text><text x="25" y="170.2" font-size="2.5" fill="#000">3. Пункт, по которому принято решение, при следующем выпуске комплекта из таблиц исключается.</text></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">11.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-009-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Квартира 103 м²</text><text x="297" y="259.2" font-size="2.5" data-fit="116" fill="#000">Общая площадь 100,72* м² · * размеры со скана, не замерены (реестр — л. 6, 7, К-1)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" data-fit="66" fill="#000">Дизайн-проект интерьера</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">7</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">134</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="283.1" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">Открытые вопросы, принятые допущения и</text><text x="330" y="286.9" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">конфликты. Лист 2 из 2</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="47" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="9" data-positions="41" data-basis="5"><rect x="315.45" y="6.2" width="98.05" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="317.45" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 9 (реестр — л. 6, 7)</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="График закупок и работ. Лист 3 из 3" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">График закупок и работ. Лист 3 из 3</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Что заказывать и когда не раньше чего: относительный порядок без дат; срок поставки — из данных или «не задан» с записью реестра</text><g data-el="proc-schedule" data-plan="fixed" data-plan-declared="3"><g data-el="proc-work"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Работы: порядок и что не даёт начать (продолжение)</text><rect x="25" y="33" width="385" height="112.2" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="31" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="37" y1="33" x2="37" y2="145.2" stroke="#000" stroke-width="0.25"/><text x="83" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Работа (стадия технологической последовательности)</text><line x1="129" y1="33" x2="129" y2="145.2" stroke="#000" stroke-width="0.25"/><text x="149" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">После</text><line x1="169" y1="33" x2="169" y2="145.2" stroke="#000" stroke-width="0.25"/><text x="233" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Что должно быть к началу: условия и закупки</text><line x1="297" y1="33" x2="297" y2="145.2" stroke="#000" stroke-width="0.25"/><text x="353.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Не начинать, пока открыто в реестре</text><g data-el="work-row" data-id="Р-7" data-key="wp" data-after="Р-6"><text x="31" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">Р-7</text><text x="38.5" y="46.7" font-size="2.5" fill="#000">Гидроизоляция санузлов и тест проливом (стадия 8)</text><text x="130.5" y="46.7" font-size="2.5" fill="#000">Р-6</text><text x="170.5" y="46.7" font-size="2.5" fill="#000">до начала: стяжка набрала прочность и сухая по инструкции гидроизоляции; выводы стоят на</text><text x="170.5" y="50.1" font-size="2.5" fill="#000">проектных отметках</text><text x="298.5" y="46.7" font-size="2.5" fill="#000"></text></g><line x1="25" y1="53.2" x2="410" y2="53.2" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-8" data-key="gkl" data-after="Р-3 Р-4"><text x="31" y="56.9" font-size="2.5" text-anchor="middle" fill="#000">Р-8</text><text x="38.5" y="56.9" font-size="2.5" fill="#000">ГКЛ: короба инсталляции и стояков, ниши, потолки (стадия 9)</text><text x="130.5" y="56.9" font-size="2.5" fill="#000">Р-3, Р-4</text><text x="170.5" y="56.9" font-size="2.5" fill="#000">до начала: черновые сети в зоне коробов приняты; закладные под тяжёлое и карнизы стоят;</text><text x="170.5" y="60.3" font-size="2.5" fill="#000">светильники выбраны (вырезы)</text><text x="298.5" y="56.9" font-size="2.5" fill="#000"></text></g><line x1="25" y1="63.4" x2="410" y2="63.4" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-9" data-key="tile" data-after="Р-6 Р-7 Р-8"><text x="31" y="67.1" font-size="2.5" text-anchor="middle" fill="#000">Р-9</text><text x="38.5" y="67.1" font-size="2.5" fill="#000">Плитка и керамогранит: стены, затем пол; фартук (стадия 10)</text><text x="130.5" y="67.1" font-size="2.5" fill="#000">Р-6, Р-7, Р-8</text><text x="170.5" y="67.1" font-size="2.5" fill="#000">до начала: гидроизоляция принята; плитка выбрана, калибр партии измерен, раскладка пересчитана и</text><text x="170.5" y="70.5" font-size="2.5" fill="#000">подписана</text><text x="170.5" y="73.9" font-size="2.5" fill="#000">Закупки к началу: З-6 (плитка)</text><text x="298.5" y="67.1" font-size="2.5" fill="#000"></text></g><line x1="25" y1="77" x2="410" y2="77" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-10" data-key="putty" data-after="Р-5 Р-8 Р-9"><text x="31" y="80.7" font-size="2.5" text-anchor="middle" fill="#000">Р-10</text><text x="38.5" y="80.7" font-size="2.5" fill="#000">Шпаклёвка стен и потолков под окраску (стадия 11)</text><text x="130.5" y="80.7" font-size="2.5" fill="#000">Р-5, Р-8, Р-9</text><text x="170.5" y="80.7" font-size="2.5" fill="#000">до начала: плитка готова (грязные работы закончены); штукатурка и ГКЛ сухие</text><text x="298.5" y="80.7" font-size="2.5" fill="#000"></text></g><line x1="25" y1="85" x2="410" y2="85" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-11" data-key="paint" data-after="Р-10"><text x="31" y="88.7" font-size="2.5" text-anchor="middle" fill="#000">Р-11</text><text x="38.5" y="88.7" font-size="2.5" fill="#000">Окраска стен, потолков, откосов (стадия 13)</text><text x="130.5" y="88.7" font-size="2.5" fill="#000">Р-10</text><text x="170.5" y="88.7" font-size="2.5" fill="#000">до начала: шпаклёвка отшлифована и огрунтована; выкрасы утверждены, колеровка одной партией</text><text x="298.5" y="88.7" font-size="2.5" fill="#000"></text></g><line x1="25" y1="93" x2="410" y2="93" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-12" data-key="floor" data-after="Р-9 Р-11"><text x="31" y="96.7" font-size="2.5" text-anchor="middle" fill="#000">Р-12</text><text x="38.5" y="96.7" font-size="2.5" fill="#000">Чистовые полы: инженерная доска (стадия 14)</text><text x="130.5" y="96.7" font-size="2.5" fill="#000">Р-9, Р-11</text><text x="170.5" y="96.7" font-size="2.5" fill="#000">до начала: влажность основания в норме, мокрые работы закончены; доска выбрана и привезена</text><text x="170.5" y="100.1" font-size="2.5" fill="#000">Закупки к началу: З-7 (доска и плинтус)</text><text x="298.5" y="96.7" font-size="2.5" fill="#000"></text></g><line x1="25" y1="103.2" x2="410" y2="103.2" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-13" data-key="doors" data-after="Р-11 Р-12"><text x="31" y="106.9" font-size="2.5" text-anchor="middle" fill="#000">Р-13</text><text x="38.5" y="106.9" font-size="2.5" fill="#000">Полотна межкомнатных дверей, плинтусы, пороги (стадия 15)</text><text x="130.5" y="106.9" font-size="2.5" fill="#000">Р-11, Р-12</text><text x="170.5" y="106.9" font-size="2.5" fill="#000">до начала: чистовой пол уложен; полотна скрытых дверей — после чистовой отделки стен</text><text x="298.5" y="106.9" font-size="2.5" fill="#000"></text></g><line x1="25" y1="111.2" x2="410" y2="111.2" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-14" data-key="finel" data-after="Р-11 Р-13"><text x="31" y="114.9" font-size="2.5" text-anchor="middle" fill="#000">Р-14</text><text x="38.5" y="114.9" font-size="2.5" fill="#000">Чистовая электрика и сантехника: механизмы, светильники, смесители,</text><text x="38.5" y="118.3" font-size="2.5" fill="#000">приборы (стадия 16)</text><text x="130.5" y="114.9" font-size="2.5" fill="#000">Р-11, Р-13</text><text x="170.5" y="114.9" font-size="2.5" fill="#000">до начала: отделка готова; механизмы, светильники и приборы выбраны и привезены</text><text x="298.5" y="114.9" font-size="2.5" fill="#000"></text></g><line x1="25" y1="121.4" x2="410" y2="121.4" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-15" data-key="kitchen" data-after="Р-13 Р-14"><text x="31" y="125.1" font-size="2.5" text-anchor="middle" fill="#000">Р-15</text><text x="38.5" y="125.1" font-size="2.5" fill="#000">Кухня, встроенная и корпусная мебель, бытовая техника (стадия 17)</text><text x="130.5" y="125.1" font-size="2.5" fill="#000">Р-13, Р-14</text><text x="170.5" y="125.1" font-size="2.5" fill="#000">до начала: чистовая сантехника и электрика подведены к местам мебели; замер кухни снят по</text><text x="170.5" y="128.5" font-size="2.5" fill="#000">готовым стенам (после штукатурки или плитки, до чистового пола)</text><text x="170.5" y="131.9" font-size="2.5" fill="#000">Закупки к началу: З-2 (кухонный гарнитур), З-3 (техника кухни), З-8 (мебель по замеру)</text><text x="298.5" y="125.1" font-size="2.5" fill="#000">К-1: Размеры сняты со скана обмерного плана KV оформление (в см): часть подписей не</text><text x="298.5" y="128.5" font-size="2.5" fill="#000">читается, помещения выровнены по читаемым размерам.</text></g><line x1="25" y1="135" x2="410" y2="135" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-16" data-key="accept" data-after="Р-14 Р-15"><text x="31" y="138.7" font-size="2.5" text-anchor="middle" fill="#000">Р-16</text><text x="38.5" y="138.7" font-size="2.5" fill="#000">Сдача: осмотр по чек-листу, дефектная ведомость, устранение</text><text x="38.5" y="142.1" font-size="2.5" fill="#000">замечаний (стадия 18)</text><text x="130.5" y="138.7" font-size="2.5" fill="#000">Р-14, Р-15</text><text x="170.5" y="138.7" font-size="2.5" fill="#000">до начала: всё смонтировано; акты скрытых работ подписаны</text><text x="298.5" y="138.7" font-size="2.5" fill="#000"></text></g></g><g data-el="notes"><text x="25" y="157.6" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="162.4" font-size="2.5" fill="#000">1. Порядок работ — стадии технологической последовательности из 16 позиций, присутствующих в этом проекте (по строкам ведомости объёмов); остальные стадии таблицы knowledge/remont-tehnologiya.md в проекте не встречаются. Длительности работ не печатаются: их нет ни в данных, ни в нормах для</text><text x="29" y="165.8" font-size="2.5" fill="#000">этого объекта.</text><text x="25" y="169.2" font-size="2.5" fill="#000">2. Типовые сроки — ориентир практики, не срок поставщика: скрытые двери — короб около 10 дн., полотно под покраску до 3 нед., шпон 4–5 нед., в среднем около 30 дн. (knowledge/workers/foreman.md, п. 2.4 (profil-doors)); кухня и корпусная мебель — 4–8 недель от замера (knowledge/remont-tehnologiya.md,</text><text x="29" y="172.6" font-size="2.5" fill="#000">разд. 2; knowledge/workers/foreman.md, п. 2.4). Заказ по ориентиру не назначается: срок получают у поставщика (вопрос реестра), после чего заказ планируют «не позднее чем за срок до начала работы».</text><text x="25" y="176" font-size="2.5" fill="#000">3. Условия заказа берутся из реестра открытых вопросов и задания на контрольный обмер: позиция заказывается, когда закрыты замер (графа 1) и решение (графа 2). Закрывать их может только факт или решение автора с подписью; снять строку с листа можно только закрыв запись реестра.</text><text x="25" y="179.4" font-size="2.5" fill="#000">4. Заказ по размеру до контрольного обмера не делают: двери, кухня и встроенная мебель зависят от обмера (К-11, К-13); скрытые двери, кроме того, зависят от решения по нише санузла 2 (проём Д-5 в перегородке П-1).</text><text x="25" y="182.8" font-size="2.5" fill="#000">5. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text></g></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4 К-8" data-level="0"><text x="25.5" y="272.1" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="275.5" font-size="2.5" fill="#000">Основа листа: размеры сняты со скана обмерного плана KV оформление (см): часть подписей не читается, помещения выровнены по читаемым размерам; контрольный обмер не</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">выполнен (К-1); высота потолка 2650 мм принята по отметкам обмера (Н = 2,50…2,66 м, ригель 2,28 м) — уточнить при обмере (К-2); толщины стен 300 / 120 мм приняты,</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">межквартирная стена и колонны — по скану, не замерены (К-1); разрешённая мощность 15 кВт принята по типовым ТУ; при объединении двух квартир — переоформление ТУ (К-4);</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-8).</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1, К-2, К-4; лист 7, запись К-8).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">14.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-009-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Квартира 103 м²</text><text x="297" y="259.2" font-size="2.5" data-fit="116" fill="#000">Общая площадь 100,72* м² · * размеры со скана, не замерены (реестр — л. 6, 7, К-1)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" data-fit="66" fill="#000">Дизайн-проект интерьера</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">13</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">132</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="285" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">График закупок и работ. Лист 3 из 3</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="47" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="7" data-positions="41" data-basis="5"><rect x="315.45" y="6.2" width="98.05" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="317.45" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 7 (реестр — л. 6, 7)</text></g></svg>
.5" y="37.3" font-size="2.5" text-anchor="end" data-fit="16" fill="#000">190,1</text><line x1="25" y1="45" x2="255" y2="45" stroke="#000" stroke-width="0.18"/><text x="29.5" y="43.3" font-size="2.5" text-anchor="middle" data-fit="6" fill="#000">2</text><text x="35.5" y="43.3" font-size="2.5" text-anchor="start" data-fit="31" fill="#000">Кладовая</text><text x="69.5" y="43.3" font-size="2.5" text-anchor="start" data-fit="165" fill="#000">общий — L6</text><text x="253.5" y="43.3" font-size="2.5" text-anchor="end" data-fit="16" fill="#000">10</text><line x1="25" y1="51" x2="255" y2="51" stroke="#000" stroke-width="0.18"/><text x="29.5" y="49.3" font-size="2.5" text-anchor="middle" data-fit="6" fill="#000">3</text><text x="35.5" y="49.3" font-size="2.5" text-anchor="start" data-fit="31" fill="#000">Гостиная-столовая</text><text x="69.5" y="49.3" font-size="2.5" text-anchor="start" data-fit="165" fill="#000">общий — L1; рабочий — L2; акцентный — L3</text><text x="253.5" y="49.3" font-size="2.5" text-anchor="end" data-fit="16" fill="#000">162,8</text><line x1="25" y1="57" x2="255" y2="57" stroke="#000" stroke-width="0.18"/><text x="29.5" y="55.3" font-size="2.5" text-anchor="middle" data-fit="6" fill="#000">4</text><text x="35.5" y="55.3" font-size="2.5" text-anchor="start" data-fit="31" fill="#000">Прихожая-холл</text><text x="69.5" y="55.3" font-size="2.5" text-anchor="start" data-fit="165" fill="#000">общий — L10; ночной — L11</text><text x="253.5" y="55.3" font-size="2.5" text-anchor="end" data-fit="16" fill="#000">36,6</text><line x1="25" y1="63" x2="255" y2="63" stroke="#000" stroke-width="0.18"/><text x="29.5" y="61.3" font-size="2.5" text-anchor="middle" data-fit="6" fill="#000">5</text><text x="35.5" y="61.3" font-size="2.5" text-anchor="start" data-fit="31" fill="#000">Кухня</text><text x="69.5" y="61.3" font-size="2.5" text-anchor="start" data-fit="165" fill="#000">общий — L4; рабочий — L5</text><text x="253.5" y="61.3" font-size="2.5" text-anchor="end" data-fit="16" fill="#000">100</text><line x1="25" y1="69" x2="255" y2="69" stroke="#000" stroke-width="0.18"/><text x="29.5" y="67.3" font-size="2.5" text-anchor="middle" data-fit="6" fill="#000">6</text><text x="35.5" y="67.3" font-size="2.5" text-anchor="start" data-fit="31" fill="#000">Ванная</text><text x="69.5" y="67.3" font-size="2.5" text-anchor="start" data-fit="165" fill="#000">общий — L12; рабочий — L13</text><text x="253.5" y="67.3" font-size="2.5" text-anchor="end" data-fit="16" fill="#000">26</text><line x1="25" y1="75" x2="255" y2="75" stroke="#000" stroke-width="0.18"/><text x="29.5" y="73.3" font-size="2.5" text-anchor="middle" data-fit="6" fill="#000">7</text><text x="35.5" y="73.3" font-size="2.5" text-anchor="start" data-fit="31" fill="#000">Постирочная</text><text x="69.5" y="73.3" font-size="2.5" text-anchor="start" data-fit="165" fill="#000">общий — L14</text><text x="253.5" y="73.3" font-size="2.5" text-anchor="end" data-fit="16" fill="#000">10</text><line x1="25" y1="81" x2="255" y2="81" stroke="#000" stroke-width="0.18"/><text x="29.5" y="79.3" font-size="2.5" text-anchor="middle" data-fit="6" fill="#000">8</text><text x="35.5" y="79.3" font-size="2.5" text-anchor="start" data-fit="31" fill="#000">Спальня 2</text><text x="69.5" y="79.3" font-size="2.5" text-anchor="start" data-fit="165" fill="#000">общий — L15; рабочий — L19; акцентный — L16</text><text x="253.5" y="79.3" font-size="2.5" text-anchor="end" data-fit="16" fill="#000">196,1</text><line x1="25" y1="87" x2="255" y2="87" stroke="#000" stroke-width="0.18"/><text x="29.5" y="85.3" font-size="2.5" text-anchor="middle" data-fit="6" fill="#000">9</text><text x="35.5" y="85.3" font-size="2.5" text-anchor="start" data-fit="31" fill="#000">Коридор</text><text x="69.5" y="85.3" font-size="2.5" text-anchor="start" data-fit="165" fill="#000">общий — L10</text><text x="253.5" y="85.3" font-size="2.5" text-anchor="end" data-fit="16" fill="#000">14</text><line x1="25" y1="93" x2="255" y2="93" stroke="#000" stroke-width="0.18"/><text x="29.5" y="91.3" font-size="2.5" text-anchor="middle" data-fit="6" fill="#000">10</text><text x="35.5" y="91.3" font-size="2.5" text-anchor="start" data-fit="31" fill="#000">Спальня мастер</text><text x="69.5" y="91.3" font-size="2.5" text-anchor="start" data-fit="165" fill="#000">общий — L20; рабочий — L22; акцентный — L21</text><text x="253.5" y="91.3" font-size="2.5" text-anchor="end" data-fit="16" fill="#000">256,8</text><text x="29.5" y="97.3" font-size="2.5" text-anchor="middle" data-fit="6" fill="#000">11</text><text x="35.5" y="97.3" font-size="2.5" text-anchor="start" data-fit="31" fill="#000">Ванная мастер</text><text x="69.5" y="97.3" font-size="2.5" text-anchor="start" data-fit="165" fill="#000">общий — L17; рабочий — L18</text><text x="253.5" y="97.3" font-size="2.5" text-anchor="end" data-fit="16" fill="#000">21</text></g><g data-el="layers-key"><text x="263" y="23" font-size="3.5" font-weight="700" fill="#000">Слои света</text><text x="263" y="28.5" font-size="2.5" data-fit="147" fill="#000">общий — равномерный свет помещения, по норме освещённости</text><text x="263" y="32.7" font-size="2.5" data-fit="147" fill="#000">рабочий — местный свет задачи: столешница, зеркало, чтение у кровати</text><text x="263" y="36.9" font-size="2.5" data-fit="147" fill="#000">акцентный — подсветка потолка, стен и ниш; не входит в поток общего света</text><text x="263" y="41.1" font-size="2.5" data-fit="147" fill="#000">ночной — путь спальня → санузел: не выше 2700 K, малая яркость, датчик движения</text></g><g data-el="notes"><text x="25" y="241" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="246" font-size="2.5" data-fit="200" fill="#000">1. Продолжение листа 50: позиции, марки и группы — те же, что на основном листе.</text><text x="25" y="249.4" font-size="2.5" data-fit="200" fill="#000">2. Σ Р — установленная мощность освещения помещения, Вт; группы L — по плану выключателей.</text></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4 К-8" data-level="0"><text x="25.5" y="272.1" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="275.5" font-size="2.5" fill="#000">Основа листа: размеры сняты со скана обмерного плана KV оформление (см): часть подписей не читается, помещения выровнены по читаемым размерам; контрольный обмер не</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">выполнен (К-1); высота потолка 2650 мм принята по отметкам обмера (Н = 2,50…2,66 м, ригель 2,28 м) — уточнить при обмере (К-2); толщины стен 300 / 120 мм приняты,</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">межквартирная стена и колонны — по скану, не замерены (К-1); разрешённая мощность 15 кВт принята по типовым ТУ; при объединении двух квартир — переоформление ТУ (К-4);</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-8).</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1, К-2, К-4; лист 7, запись К-8).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><
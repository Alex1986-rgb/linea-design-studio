h="0.5"/><text x="37.51" y="201.8" font-size="2.5" text-anchor="middle" data-fit="24.02" fill="#000">Код</text><line x1="50.02" y1="196.5" x2="50.02" y2="216.5" stroke="#000" stroke-width="0.25"/><text x="103.32" y="201.8" font-size="2.5" text-anchor="middle" data-fit="105.6" fill="#000">Прибор</text><line x1="156.61" y1="196.5" x2="156.61" y2="216.5" stroke="#000" stroke-width="0.25"/><text x="165.25" y="201.8" font-size="2.5" text-anchor="middle" data-fit="16.26" fill="#000">Ø</text><line x1="173.88" y1="196.5" x2="173.88" y2="216.5" stroke="#000" stroke-width="0.25"/><text x="185.89" y="201.8" font-size="2.5" text-anchor="middle" data-fit="23.02" fill="#000">Н, мм</text><line x1="197.89" y1="196.5" x2="197.89" y2="216.5" stroke="#000" stroke-width="0.25"/><text x="254.95" y="201.8" font-size="2.5" text-anchor="middle" data-fit="113.11" fill="#000">Привязка, мм</text><line x1="25" y1="210.5" x2="312" y2="210.5" stroke="#000" stroke-width="0.18"/><text x="26.5" y="208.8" font-size="2.5" text-anchor="start" data-fit="22.02" fill="#000">В1-4</text><text x="51.52" y="208.8" font-size="2.5" text-anchor="start" data-fit="103.6" fill="#000">Пм1 стиральная машина</text><text x="158.11" y="208.8" font-size="2.5" text-anchor="start" data-fit="14.26" fill="#000">½″</text><text x="175.38" y="208.8" font-size="2.5" text-anchor="start" data-fit="21.02" fill="#000">600*</text><text x="199.39" y="208.8" font-size="2.5" text-anchor="start" data-fit="111.11" fill="#000">ст. А: 125 от лев. угла</text><text x="26.5" y="214.8" font-size="2.5" text-anchor="start" data-fit="22.02" fill="#000">К1-4</text><text x="51.52" y="214.8" font-size="2.5" text-anchor="start" data-fit="103.6" fill="#000">Пм1 стиральная машина</text><text x="158.11" y="214.8" font-size="2.5" text-anchor="start" data-fit="14.26" fill="#000">Ø50</text><text x="175.38" y="214.8" font-size="2.5" text-anchor="start" data-fit="21.02" fill="#000">600*</text><text x="199.39" y="214.8" font-size="2.5" text-anchor="start" data-fit="111.11" fill="#000">ст. А: 325 от лев. угла</text></g><g data-el="legend"><text x="320" y="194.5" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><circle cx="324" cy="200.5" r="1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/><text x="331" y="201.4" font-size="2.5" fill="#000">вывод В1 (код — в ведомости привязок)</text><circle cx="324" cy="205.5" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/><text x="331" y="206.4" font-size="2.5" fill="#000">вывод Т3 (код — в ведомости привязок)</text><circle cx="324" cy="210.5" r="1" fill="#fff" stroke="#6b4f2a" stroke-width="0.35"/><text x="331" y="211.4" font-size="2.5" fill="#000">вывод К1 (код — в ведомости привязок)</text><rect x="320.5" y="213.5" width="7" height="4" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="331" y="216.4" font-size="2.5" fill="#000">сантехприбор по расстановке (габарит модели)</text><rect x="320.5" y="218.5" width="7" height="4" fill="#fff" stroke="#000" stroke-width="0.25" stroke-dasharray="2 0.8"/><text x="331" y="221.4" font-size="2.5" fill="#000">дверной проём; окно — сплошной контур</text></g><g data-el="notes"><text x="25" y="240" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="245" font-size="2.5" fill="#000">1. Габариты и высоты приборов, межосевые смесителей и места кранов — по паспортам выбранных приборов, сверяются до разметки стен.</text><text x="25" y="248.6" font-size="2.5" fill="#000">2. Высоты Н — от чистого пола помещения, мм; отметка чистого пола и потолка — у левого края вида (от ±0,000 объекта). Привязки — от левого чистового</text><text x="25" y="252.2" font-size="2.5" fill="#000">угла вида (облицовка стен вычтена), как на развёртках стен.</text><text x="25" y="255.8" font-size="2.5" fill="#000">3. * — высота принята по практике монтажа: в данных прибора её нет; до разметки стен сверить по паспорту выбранного прибора (смеситель,</text><text x="25" y="259.4" font-size="2.5" fill="#000">инсталляция, сифон).</text><text x="25" y="263" font-size="2.5" fill="#000">4. Стояки в помещении: Ст К1-4 (постирочная) Ø50, Ст В1-4 Ø32, Ст Т3-4 Ø32 — положение на плане выводов; выводы подключаются к ним по схеме разводки.</text><text x="25" y="266.6" font-size="2.5" fill="#000">5. Ревизионные люки к арматуре и ревизиям в данных не заданы: место и размер не определены (записи реестра нет).</text><text x="25" y="270.2" font-size="2.5" fill="#000">6. Часть подписей выводов не уместилась у знака: коды и высоты — в ведомости привязок.</text><text x="25" y="273.8" font-size="2.5" fill="#000">7. Расчёт систем водоснабжения и канализации и подбор оборудования выполняет проектная организация; лист задаёт места и высоты выводов.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="75" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="75" y1="285.5" x2="75" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="77" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4 К-8" data-level="0"><text x="198.5" y="170.6" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="198.5" y="174" font-size="2.5" fill="#000">Основа листа: размеры сняты со скана обмерного плана KV оформление (см): часть подписей не читается, помещения выровнены по читаемым размерам; контрольный обмер не выполнен (К-1);</text><text x="198.5" y="177.4" font-size="2.5" fill="#000">высота потолка 2650 мм принята по отметкам обмера (Н = 2,50…2,66 м, ригель 2,28 м) — уточнить при обмере (К-2); толщины стен 300 / 120 мм приняты, межквартирная стена и колонны — по скану,</text><text x="198.5" y="180.8" font-size="2.5" fill="#000">не замерены (К-1); разрешённая мощность 15 кВт принята по типовым ТУ; при объединении двух квартир — переоформление ТУ (К-4); подрайон климата не задан — принят не северный (жилые от</text><text x="198.5" y="184.2" font-size="2.5" fill="#000">2,5 м) (К-8).</text><text x="198.5" y="187.6" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1, К-2, К-4; лист 7, запись К-8).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Задание на контрольный обмер и обследование. Лист 2 из 3" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Задание на контрольный обмер и обследование. Лист 2 из 3</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Что замерить, вскрыть и получить до заказа материалов и изделий</text><g data-el="survey-task" data-plan="fixed" data-plan-declared="3"><g data-el="survey-field"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Этап 1. До демонтажа (продолжение)</text><rect x="25" y="33" width="385" height="78" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="31" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="37" y1="33" x2="37" y2="111" stroke="#000" stroke-width="0.25"/><text x="62" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Где</text><line x1="87" y1="33" x2="87" y2="111" stroke="#000" stroke-width="0.25"/><text x="97" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Способ</text><line x1="107" y1="33" x2="107" y2="111" stroke="#000" stroke-width="0.25"/><text x="148" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Что сделать</text><line x1="189" y1="33" x2="189" y2="111" stroke="#000" stroke-width="0.25"/><text x="208" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Кто выполняет</text><line x1="227" y1="33" x2="227" y2="111" stroke="#000" stroke-width="0.25"/><text x="240" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Точность</text><line x1="253" y1="33" x2="253" y2="111" stroke="#000" stroke-width="0.25"/><text x="288" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Что пересчитается в альбоме</text><line x1="323" y1="33" x2="323" y2="111" stroke="#000" stroke-width="0.25"/><text x="344" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Чем подтверждается</text><line x1="365" y1="33" x2="365" y2="111" stroke="#000" stroke-width="0.25"/><text x="387.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Закрывает вопросы реестра</text><g data-el="survey-row" data-id="О-6" data-key="proem-r10" data-closes="К-1" data-method="measure" data-covers="window:r10:1"><text x="31" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">О-6</text><text x="38.5" y="46.7" font-size="2.5" fill="#000">Спальня мастер (пом. 10): окно пом.</text><text x="38.5" y="50.1" font-size="2.5" fill="#000">10, стена Б</text><text x="88.5" y="46.7" font-size="2.5" fill="#000">Обмер</text><text x="108.5" y="46.7" font-size="2.5" fill="#000">Окно пом. 10, стена Б: положение (привязки к ближайшим</text><text x="108.5" y="50.1" font-size="2.5" fill="#000">углам), ширина, высота, высота подоконника, глубина откоса.</text><text x="108.5" y="53.5" font-size="2.5" fill="#000">Принято в проекте: Окно 1300 при смещение 3500 на стене Б</text><text x="108.5" y="56.9" font-size="2.5" fill="#000">основной части (длина 3830) выходило за стену на 970 мм.</text><text x="108.5" y="60.3" font-size="2.5" fill="#000">Отнесено к стене Б части 1 (y 6300…7800): смещение 100</text><text x="108.5" y="63.7" font-size="2.5" fill="#000">положение со скана, не замерено..</text><text x="190.5" y="46.7" font-size="2.5" fill="#000">Архитектор</text><text x="228.5" y="46.7" font-size="2.5" fill="#000">±5 мм</text><text x="254.5" y="46.7" font-size="2.5" fill="#000">Проёмы на обмерном плане и в ведомости проёмов;</text><text x="254.5" y="50.1" font-size="2.5" fill="#000">откосы и оконные работы в ВОР; привязки мебели и</text><text x="254.5" y="53.5" font-size="2.5" fill="#000">выводов к проёмам.</text><text x="254.5" y="56.9" font-size="2.5" fill="#000">Листы:</text><text x="254.5" y="60.3" font-size="2.5" fill="#000">л. 20 — Обмерный план</text><text x="254.5" y="63.7" font-size="2.5" fill="#000">л. 23 — Ведомость заполнения проёмов</text><text x="324.5" y="46.7" font-size="2.5" fill="#000">акт контрольного обмера; фото</text><text x="324.5" y="50.1" font-size="2.5" fill="#000">с рулеткой и привязкой к стене</text><text x="324.5" y="53.5" font-size="2.5" fill="#000">или углу</text><text x="366.5" y="46.7" font-size="2.5" fill="#000">К-1</text><text x="366.5" y="50.1" font-size="2.5" fill="#000">Результат принимает: Архитектор</text></g><line x1="25" y1="66.8" x2="410" y2="66.8" stroke="#000" stroke-width="0.25"/><g data-el="survey-row" data-id="О-7" data-key="stoyaki-vannoj-master" data-closes="К-6" data-method="measure" data-covers="riser:Ст К1-3|riser:Ст В1-3|riser:Ст Т3-3|fact:gvs|fact:meters"><text x="31" y="70.5" font-size="2.5" text-anchor="middle" fill="#000">О-7</text><text x="38.5" y="70.5" font-size="2.5" fill="#000" textLength="35.62" lengthAdjust="spacingAndGlyphs">Ванная мастер (пом. 11): Ст К1-3*, Ст</text><text x="38.5" y="73.9" font-size="2.5" fill="#000" textLength="34" lengthAdjust="spacingAndGlyphs">В1-3, Ст Т3-3*; наличие стояка ГВС,</text><text x="38.5" y="77.3" font-size="2.5" fill="#000">арматуры и счётчиков — по всей</text><text x="38.5" y="80.7" font-size="2.5" fill="#000">квартире</text><text x="88.5" y="70.5" font-size="2.5" fill="#000">Обмер</text><text x="108.5" y="70.5" font-size="2.5" fill="#000" textLength="61.31" lengthAdjust="spacingAndGlyphs">Положение стояков Ст К1-3*, Ст В1-3*, Ст Т3-3*: привязка осей от</text><text x="108.5" y="73.9" font-size="2.5" fill="#000">граней стен, диаметры, размеры короба и люков. Стояк горячей</text><text x="108.5" y="77.3" font-size="2.5" fill="#000">воды Т3 в данных не задан, на листах ВК принят рядом с</text><text x="108.5" y="80.7" font-size="2.5" fill="#000">стояком холодной воды: выяснить, есть ли он в доме, и где.</text><text x="108.5" y="84.1" font-size="2.5" fill="#000">Отключающая арматура и счётчики воды на вводах: положение,</text><text x="108.5" y="87.5" font-size="2.5" fill="#000">тип, пломбы управляющей компании. Сверить до разметки</text><text x="108.5" y="90.9" font-size="2.5" fill="#000">выводов.</text><text x="190.5" y="70.5" font-size="2.5" fill="#000">Архитектор</text><text x="228.5" y="70.5" font-size="2.5" fill="#000">±5 мм</text><text x="254.5" y="70.5" font-size="2.5" fill="#000">Привязки выводов воды и канализации на планах</text><text x="254.5" y="73.9" font-size="2.5" fill="#000">выводов и разводки; расстояние розеток до стояка;</text><text x="254.5" y="77.3" font-size="2.5" fill="#000">места люков 300 × 400 мм; трассы Т3 и</text><text x="254.5" y="80.7" font-size="2.5" fill="#000">полотенцесушители (водяной или электрический);</text><text x="254.5" y="84.1" font-size="2.5" fill="#000">узлы ввода в спецификации ВК (краны, фильтры,</text><text x="254.5" y="87.5" font-size="2.5" fill="#000">счётчики).</text><text x="254.5" y="90.9" font-size="2.5" fill="#000">короб и люк стояков, поддон См1, выводы душа,</text><text x="254.5" y="94.3" font-size="2.5" fill="#000">раскладка плитки ванной мастер</text><text x="254.5" y="97.7" font-size="2.5" fill="#000">Листы:</text><text x="254.5" y="101.1" font-size="2.5" fill="#000">л. 40 — План выводов сантехники</text><text x="254.5" y="104.5" font-size="2.5" fill="#000">л. 41 — Схема разводки водопровода и канализации</text><text x="254.5" y="107.9" font-size="2.5" fill="#000">л. 20 — Обмерный план</text><text x="324.5" y="70.5" font-size="2.5" fill="#000">акт контрольного обмера; фото</text><text x="324.5" y="73.9" font-size="2.5" fill="#000">с рулеткой и привязкой к стене</text><text x="324.5" y="77.3" font-size="2.5" fill="#000">или углу</text><text x="366.5" y="70.5" font-size="2.5" fill="#000">К-6</text><text x="366.5" y="73.9" font-size="2.5" fill="#000">Результат принимает: Инженер</text><text x="366.5" y="77.3" font-size="2.5" fill="#000">ВК (вода, канализация)</text></g></g></g><g data-el="assumed-notes" data-flags="riser:Ст К1-3|riser:Ст В1-3|riser:Ст Т3-3" data-ids="К-1 К-2 К-4 К-6 К-8" data-level="0"><text x="25.5" y="265.3" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="268.7" font-size="2.5" fill="#000">Основа листа: размеры сняты со скана обмерного плана KV оформление (см): часть подписей не читается, помещения выровнены по читаемым размерам; контрольный обмер не</text><text x="25.5" y="272.1" font-size="2.5" fill="#000">выполнен (К-1); высота потолка 2650 мм принята по отметкам обмера (Н = 2,50…2,66 м, ригель 2,28 м) — уточнить при обмере (К-2); толщины стен 300 / 120 мм приняты,</text><text x="25.5" y="275.5" font-size="2.5" fill="#000">межквартирная стена и колонны — по скану, не замерены (К-1); разрешённая мощность 15 кВт принята по типовым ТУ; при объединении двух квартир — переоформление ТУ (К-4);</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-8).</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">Знак «*» — принято, не замерено и не подтверждено (замерить на объекте): К-6: Ст К1-3, Ст В1-3, Ст Т3-3 — положение снято со скана обмера, отдельно не замерялось; ось внутри</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">габарита поддона См1 — обмер угла по К-6.</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1, К-2, К-4, К-6; лист 7, запись К-8).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">10.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-009-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Квартира 103 м²</text><text x="297" y="259.2" font-size="2.5" data-fit="116" fill="#000">Общая площадь 100,72* м² · * размеры со скана, не замерены (реестр — л. 6, 7, К-1)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" data-fit="66" fill="#000">Дизайн-проект интерьера</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">9</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">134</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="283.1" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">Задание на контрольный обмер и обследование.</text><text x="330" y="286.9" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">Лист 2 из 3</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="47" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="9" data-positions="41" data-basis="5"><rect x="315.45" y="6.2" width="98.05" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="317.45" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 9 (реестр — л. 6, 7)</text></g></svg>
="2.5" text-anchor="middle" data-fit="19" fill="#000">Пом.</text><line x1="25" y1="49.8" x2="108" y2="49.8" stroke="#000" stroke-width="0.18"/><text x="26.5" y="41.3" font-size="2.5" text-anchor="start" data-fit="14" fill="#000"></text><text x="43.5" y="41.3" font-size="2.5" text-anchor="start" data-fit="34" fill="#000">Светильник встраиваемый</text><text x="43.5" y="44.7" font-size="2.5" text-anchor="start" data-fit="34" fill="#000">(марки — план освещения)</text><text x="80.5" y="41.3" font-size="2.5" text-anchor="start" data-fit="6" fill="#000">46</text><text x="89.5" y="41.3" font-size="2.5" text-anchor="start" data-fit="17" fill="#000">1, 3, 4, 5,</text><text x="89.5" y="44.7" font-size="2.5" text-anchor="start" data-fit="17" fill="#000">6, 8, 9, 10,</text><text x="89.5" y="48.1" font-size="2.5" text-anchor="start" data-fit="17" fill="#000">11</text><line x1="25" y1="59.2" x2="108" y2="59.2" stroke="#000" stroke-width="0.18"/><text x="26.5" y="54.1" font-size="2.5" text-anchor="start" data-fit="14" fill="#000"></text><text x="43.5" y="54.1" font-size="2.5" text-anchor="start" data-fit="34" fill="#000">Светильник накладной</text><text x="43.5" y="57.5" font-size="2.5" text-anchor="start" data-fit="34" fill="#000">(марки — план освещения)</text><text x="80.5" y="54.1" font-size="2.5" text-anchor="start" data-fit="6" fill="#000">2</text><text x="89.5" y="54.1" font-size="2.5" text-anchor="start" data-fit="17" fill="#000">2, 7</text><line x1="25" y1="68.6" x2="108" y2="68.6" stroke="#000" stroke-width="0.18"/><text x="26.5" y="63.5" font-size="2.5" text-anchor="start" data-fit="14" fill="#000"></text><text x="43.5" y="63.5" font-size="2.5" text-anchor="start" data-fit="34" fill="#000">Светильник подвесной</text><text x="43.5" y="66.9" font-size="2.5" text-anchor="start" data-fit="34" fill="#000">(марки — план освещения)</text><text x="80.5" y="63.5" font-size="2.5" text-anchor="start" data-fit="6" fill="#000">1</text><text x="89.5" y="63.5" font-size="2.5" text-anchor="start" data-fit="17" fill="#000">3</text><line x1="25" y1="78" x2="108" y2="78" stroke="#000" stroke-width="0.18"/><text x="26.5" y="72.9" font-size="2.5" text-anchor="start" data-fit="14" fill="#000">ИП2, ИП1,</text><text x="26.5" y="76.3" font-size="2.5" text-anchor="start" data-fit="14" fill="#000">ИП7, ИП8</text><text x="43.5" y="72.9" font-size="2.5" text-anchor="start" data-fit="34" fill="#000">Извещатель дымовой</text><text x="80.5" y="72.9" font-size="2.5" text-anchor="start" data-fit="6" fill="#000">4</text><text x="89.5" y="72.9" font-size="2.5" text-anchor="start" data-fit="17" fill="#000">1, 3, 8, 10</text><line x1="25" y1="87.4" x2="108" y2="87.4" stroke="#000" stroke-width="0.18"/><text x="26.5" y="82.3" font-size="2.5" text-anchor="start" data-fit="14" fill="#000">ИП3, ИП4,</text><text x="26.5" y="85.7" font-size="2.5" text-anchor="start" data-fit="14" fill="#000">ИП6</text><text x="43.5" y="82.3" font-size="2.5" text-anchor="start" data-fit="34" fill="#000">Извещатель тепловой</text><text x="80.5" y="82.3" font-size="2.5" text-anchor="start" data-fit="6" fill="#000">3</text><text x="89.5" y="82.3" font-size="2.5" text-anchor="start" data-fit="17" fill="#000">4, 5, 9</text><line x1="25" y1="93.4" x2="108" y2="93.4" stroke="#000" stroke-width="0.18"/><text x="26.5" y="91.7" font-size="2.5" text-anchor="start" data-fit="14" fill="#000">AP1**</text><text x="43.5" y="91.7" font-size="2.5" text-anchor="start" data-fit="34" fill="#000">Точка доступа Wi-Fi, PoE</text><text x="80.5" y="91.7" font-size="2.5" text-anchor="start" data-fit="6" fill="#000">1</text><text x="89.5" y="91.7" font-size="2.5" text-anchor="start" data-fit="17" fill="#000">4</text><text x="26.5" y="97.7" font-size="2.5" text-anchor="start" data-fit="14" fill="#000"></text><text x="43.5" y="97.7" font-size="2.5" text-anchor="start" data-fit="34" fill="#000">Люк ревизии 300×300</text><text x="80.5" y="97.7" font-size="2.5" text-anchor="start" data-fit="6" fill="#000">3</text><text x="89.5" y="97.7" font-size="2.5" text-anchor="start" data-fit="17" fill="#000">1, 8, 10</text></g><g data-el="notes"><text x="25" y="241" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="246" font-size="2.5" fill="#000">1. ГКЛ 12,5 мм по каркасу П113; узлы коробов и ниш под шторы: узел 1 — лист 53; условные обозначения разрезов — на листе 53.</text><text x="25" y="249.4" font-size="2.5" fill="#000">2. Ведомость вырезов и закладных в потолке — к плану потолков (лист 52): вырезы и закладные — до обшивки, марки светильников — по плану освещения.</text></g><g data-el="ref-back" data-target="52"/><g data-el="assumed-notes" data-flags="point:AP1" data-ids="К-1 К-2 К-4 К-8" data-level="0"><text x="25.5" y="268.7" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="272.1" font-size="2.5" fill="#000">Основа листа: размеры сняты со скана обмерного плана KV оформление (см): часть подписей не читается, помещения выровнены по читаемым размерам; контрольный обмер не</text><text x="25.5" y="275.5" font-size="2.5" fill="#000">выполнен (К-1); высота потолка 2650 мм принята по отметкам обмера (Н = 2,50…2,66 м, ригель 2,28 м) — уточнить при обмере (К-2); толщины стен 300 / 120 мм приняты,</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">межквартирная стена и колонны — по скану, не замерены (К-1); разрешённая мощность 15 кВт принята по типовым ТУ; при объединении двух квартир — переоформление ТУ (К-4);</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-8).</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">Знак «**» — предложение проектировщика, заказчиком не утверждено (согласовать с заказчиком): AP1 — точка доступа Wi-Fi: число и места.</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1, К-2, К-4; лист 7, запись К-8).</text></g><g data-el="stamp"><rect x="230" y
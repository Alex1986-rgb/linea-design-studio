d="M 133.51 106.02 L 134.71 107.02 L 135.91 106.02 L 137.11 107.02" fill="none" stroke="#000" stroke-width="0.25"/><path d="M 133.51 77.02 L 134.71 78.02 L 135.91 77.02 L 137.11 78.02" fill="none" stroke="#000" stroke-width="0.25"/><circle cx="135.31" cy="104.02" r="1.1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/></g><g data-el="riser" data-index="В1"><path d="M 155.83 80 L 155.83 51" fill="none" stroke="#1f5fbf" stroke-width="0.7"/><path d="M 154.03 79.5 L 155.23 80.5 L 156.43 79.5 L 157.63 80.5" fill="none" stroke="#000" stroke-width="0.25"/><path d="M 154.03 50.5 L 155.23 51.5 L 156.43 50.5 L 157.63 51.5" fill="none" stroke="#000" stroke-width="0.25"/><circle cx="155.83" cy="77.5" r="1.1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/></g></g><g data-el="pl-labels"><text x="74.3" y="119.13" font-size="2.5" fill="#555">6 Ванная</text><text x="113.12" y="105.15" font-size="2.5" fill="#555">11 Ванная мастер</text><text x="41.84" y="115.93" font-size="2.5" fill="#555">5 Кухня</text><text x="145.42" y="86.21" font-size="2.5" fill="#555">7 Постирочная</text><text x="83.53" y="74.85" font-size="2.5" fill="#1f5fbf">Ст В1-1 Ø32</text><text x="83.53" y="77.85" font-size="2.5" fill="#1f5fbf">+2,650</text><text x="92.78" y="102.95" font-size="2.5" fill="#000">−0,015</text><text x="69.68" y="74.85" font-size="2.5" fill="#1f5fbf">Ст В1-2 Ø32</text><text x="69.68" y="77.85" font-size="2.5" fill="#1f5fbf">+2,650</text><text x="73.45" y="102.95" font-size="2.5" fill="#000">±0,000</text><text x="128.97" y="71.92" font-size="2.5" fill="#1f5fbf">Ст В1-3* Ø32</text><text x="128.97" y="74.92" font-size="2.5" fill="#1f5fbf">+2,650</text><text x="138.61" y="109.22" font-size="2.5" fill="#000">−0,015</text><text x="149.88" y="45.4" font-size="2.5" fill="#1f5fbf">Ст В1-4 Ø32</text><text x="149.88" y="48.4" font-size="2.5" fill="#1f5fbf">+2,650</text><text x="159.13" y="73.5" font-size="2.5" fill="#000">±0,000</text><text x="151.77" y="92.56" font-size="2.5" fill="#000">В1-7 См3</text><text x="151.77" y="95.56" font-size="2.5" fill="#000">Н=600*</text><text x="103.11" y="100.62" font-size="2.5" fill="#000">В1-2 Сн2</text><text x="103.11" y="103.62" font-size="2.5" fill="#000">Н=250*</text><text x="137.88" y="91.36" font-size="2.5" fill="#000">В1-6 См2</text><text x="137.88" y="94.36" font-size="2.5" fill="#000">Н=250*</text><text x="139.47" y="65.37" font-size="2.5" fill="#000">В1-4 Пм1</text><text x="139.47" y="68.37" font-size="2.5" fill="#000">Н=600*</text><text x="72.49" y="95.72" font-size="2.5" fill="#000">В1-8 Кх1</text><text x="72.49" y="98.72" font-size="2.5" fill="#000">Н=600*</text><text x="124.14" y="91.65" font-size="2.5" fill="#000">В1-5 См1</text><text x="124.14" y="94.65" font-size="2.5" fill="#000">Н=1200*</text><line x1="140.81" y1="104.12" x2="128.81" y2="116.12" stroke="#000" stroke-width="0.18"/><text x="122.18" y="118.32" font-size="2.5" fill="#1f5fbf">Ø20</text><text x="122.18" y="121.32" font-size="2.5" fill="#1f5fbf">L=2,59</text></g></g><g data-el="legend-box"><g data-el="legend"><text x="310" y="25" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><line x1="310.5" y1="31" x2="317.5" y2="31" stroke="#1f5fbf" stroke-width="0.5"/><text x="321" y="31.9" font-size="2.5" fill="#000">В1 — водопровод хозяйственно-питьевой (ХВС), PP-R Ø20</text><circle cx="314" cy="36" r="1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/><text x="321" y="36.9" font-size="2.5" fill="#000">вывод В1 (код — в ведомости привязок)</text><circle cx="314" cy="41" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="321" y="41.9" font-size="2.5" fill="#000">стояк «Ст К1-N / Ст В1-N» (ГОСТ 21.601), Ø мм</text><circle cx="314" cy="46" r="1.1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/><text x="321" y="46.9" font-size="2.5" fill="#000">стояк в плане (на отметке пола); вертикаль — стояк по высоте,</text><text x="321" y="50.2" font-size="2.5" fill="#000">разрыв — перекрытие</text><circle cx="314" cy="54.3" r="0.6" fill="#000"/><text x="321" y="55.2" font-size="2.5" fill="#000">тройник (ответвление к прибору)</text><path d="M 312 58 L 316 60.6 L 316 58 L 312 60.6 Z" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="321" y="60.2" font-size="2.5" fill="#000">кран шаровой</text><circle cx="314" cy="64.3" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35" stroke-dasharray="0.8 0.6"/><text x="321" y="65.2" font-size="2.5" fill="#000">* стояк Т3 не на обмере — принят в шахте рядом со Ст В1, сверить</text></g></g><g data-el="notes"><text x="25" y="240" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="245" font-size="2.5" fill="#000">1. Схема В1 построена по тем же трассам, что план разводки: положение в плане сохранено, глубина — в масштабе ×0,5. Трассы принципиальные; фактическое</text><text x="25" y="248.6" font-size="2.5" fill="#000">положение фиксируется исполнительной схемой до закрытия.</text><text x="25" y="252.2" font-size="2.5" fill="#000">2. Высоты Н — от чистого пола помещения, мм. Отметка прокладки магистрали В1 (в стяжке, в стене или по полу) в данных не задана: участки показаны на</text><text x="25" y="255.8" font-size="2.5" fill="#000">уровне пола условно (записи реестра нет).</text><text x="25" y="259.4" font-size="2.5" fill="#000">3. * — высота вывода принята по практике монтажа; сверить по паспорту прибора.</text><text x="25" y="263" font-size="2.5" fill="#000">4. Узел ввода В1 (кран, фильтр, счётчик, обратный клапан, кран) — на схеме разводки; состав узла ввода — по согласованию. Кран шаровой — на первом</text><text x="25" y="266.6" font-size="2.5" fill="#000">участке от стояка.</text><text x="25" y="270.2" font-size="2.5" fill="#000" textLength="115.33" lengthAdjust="spacingAndGlyphs">5. Ст В1-3* на обмере не показаны: положение принято, не замерено (К-6); положение сверить на объекте до разводки.</text><text x="25" y="273.8" font-size="2.5" fill="#000">6. Трубы испытать давлением до закрытия (акт скрытых работ, опрессовка по СП 73.13330.2016).</text><text x="25" y="277.4" font-size="2.5" fill="#000">7. Диаметры, высоты выводов и места кранов — по паспортам выбранных приборов и расчёту проектной организации.</text><text x="25" y="281" font-size="2.5" fill="#000">8. Расчёт систем, диаметры магистралей и подбор оборудования выполняет проектная организация.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="35" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="35" y1="285.5" x2="35" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="37" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="riser:Ст В1-3|riser:Ст К1-3|riser:Ст Т3-3" data-ids="К-1 К-2 К-4 К-6 К-8" data-level="0"><text x="45.5" y="210.3" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="45.5" y="213.7" font-size="2.5" fill="#000">Основа листа: размеры сняты со скана обмерного плана KV design (см): часть подписей не читается, помещения выровнены по читаемым размерам; контрольный обмер не выполнен (К-1); высота</text><text x="45.5" y="217.1" font-size="2.5" fill="#000">потолка 2650 мм принята по отметкам обмера (Н = 2,50…2,66 м, ригель 2,28 м) — уточнить при обмере (К-2); толщины стен 300 / 120 мм приняты, межквартирная стена и колонны — по скану, не</text><text x="45.5" y="220.5" font-size="2.5" fill="#000">замерены (К-1); разрешённая мощность 15 кВт принята по типовым ТУ; при объединении двух квартир — переоформление ТУ (К-4); подрайон климата не задан — принят не северный (жилые от 2,5</text><text x="45.5" y="223.9" font-size="2.5" fill="#000">м) (К-8).</text><text x="45.5" y="227.3" font-size="2.5" fill="#000">Знак «*» — принято, не замерено и не подтверждено (замерить на объекте): К-6: Ст В1-3, Ст К1-3, Ст Т3-3 — положение снято со скана обмера, отдельно не замерялось; ось внутри габарита</text><text x="45.5" y="230.7" font-size="2.5" fill="#000">поддона См1 — обмер угла по К-6.</text><text x="45.5" y="234.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1, К-2, К-4, К-6, К-8).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor=
t><line x1="326" y1="46" x2="326" y2="72" stroke="#000" stroke-width="0.25"/><text x="368" y="51.3" font-size="2.5" text-anchor="middle" fill="#000">Учесть</text><line x1="238" y1="60" x2="410" y2="60" stroke="#000" stroke-width="0.18"/><text x="239.5" y="58.3" font-size="2.5" text-anchor="start" fill="#000">фартук</text><text x="261.5" y="58.3" font-size="2.5" text-anchor="start" fill="#000">керамогранит</text><text x="311.5" y="58.3" font-size="2.5" text-anchor="start" fill="#000">10</text><text x="327.5" y="58.3" font-size="2.5" text-anchor="start" fill="#000">от чернового основания до корпуса навесных и столешницы</text><line x1="238" y1="66" x2="410" y2="66" stroke="#000" stroke-width="0.18"/><text x="239.5" y="64.3" font-size="2.5" text-anchor="start" fill="#000">стены</text><text x="261.5" y="64.3" font-size="2.5" text-anchor="start" fill="#000">окраска</text><text x="311.5" y="64.3" font-size="2.5" text-anchor="start" fill="#000">5</text><text x="327.5" y="64.3" font-size="2.5" text-anchor="start" fill="#000">под штукатурку и шпаклёвку за пеналом</text><text x="239.5" y="70.3" font-size="2.5" text-anchor="start" fill="#000">пол</text><text x="261.5" y="70.3" font-size="2.5" text-anchor="start" fill="#000">инженерная доска</text><text x="311.5" y="70.3" font-size="2.5" text-anchor="start" fill="#000"></text><text x="327.5" y="70.3" font-size="2.5" text-anchor="start" fill="#000">цоколь — после укладки пола, опоры ±20 мм</text></g><g data-el="legend"><text x="238" y="80" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><rect x="238" y="85.6" width="10.5" height="4.6" fill="none" stroke="#000" stroke-width="0.25" stroke-dasharray="2.2 1"/><text x="252" y="88.4" font-size="2.5" fill="#000">контур модуля</text><path d="M 243.25 91.5 L 243.25 97.3" fill="none" stroke="#000" stroke-width="0.18" stroke-dasharray="4 1 0.8 1"/><text x="252" y="94.9" font-size="2.5" fill="#000">ось модуля (от неё — привязка вывода)</text><path d="M 241.45 99.1 L 245.05 102.7" fill="none" stroke="#000" stroke-width="0.35"/><path d="M 241.45 102.7 L 245.05 99.1" fill="none" stroke="#000" stroke-width="0.35"/><text x="252" y="101.4" font-size="2.5" fill="#000">анкер / уголок крепления к стене</text></g><g data-el="legend"><text x="324" y="80" font-size="3.5" font-weight="700" fill="#000"></text><circle cx="329.25" cy="88.6" r="1.5" fill="#fff" stroke="#000" stroke-width="0.35"/><path d="M 327.75 88.6 L 330.75 88.6" fill="none" stroke="#000" stroke-width="0.25"/><text x="338" y="88.4" font-size="2.5" fill="#000">розетка</text><circle cx="329.25" cy="94.4" r="1.3" fill="#fff" stroke="#000" stroke-width="0.35"/><circle cx="329.25" cy="94.4" r="0.45" fill="#000"/><text x="338" y="94.9" font-size="2.5" fill="#000">вывод кабеля к технике</text><circle cx="329.25" cy="100.9" r="1.1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/><text x="331.2" y="101.8" font-size="2.5" fill="#1f5fbf">В1</text><text x="338" y="101.4" font-size="2.5" fill="#000">вывод воды В1 / Т3, канализации К1</text></g><g data-el="notes"><text x="25" y="240" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="245" font-size="2.5" fill="#000">1. Выводы — по проекту электрики и ВК; привязка по горизонтали — от оси модуля (плюс — вправо по виду), по высоте — от чистого пола до оси</text><text x="25" y="248.6" font-size="2.5" fill="#000">вывода.</text><text x="25" y="252.2" font-size="2.5" fill="#000">2. Пенал — уголки к стене 2 шт. сверху; нижние модули — стяжками между собой и уголком к стене; ряд выставить по уровню опорами цоколя.</text><text x="25" y="255.8" font-size="2.5" fill="#000">3. Розетки над столешницей — не ниже 150 мм над ней и не за корпусом техники; розетка за ПММ, духовым шкафом и холодильником — только в</text><text x="25" y="259.4" font-size="2.5" fill="#000">соседнем модуле или в зоне цоколя с доступом.</text><text x="25" y="263" font-size="2.5" fill="#000">4. Столешница — вырезы по шаблонам выбранных моделей мойки и варочной панели; торцы у стены — герметик, пристеночный плинтус.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="65" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="65" y1="285.5" x2="65" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="67" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" f
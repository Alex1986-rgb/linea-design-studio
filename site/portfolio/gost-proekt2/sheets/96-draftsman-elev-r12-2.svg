000; высоты Н — от чистого пола помещения до оси изделия, у декора — до центра.</text><text x="25" y="249.8" font-size="2.5" fill="#000">2. Красные цепочки — привязки электроточек и выводов: по горизонтали от угла чистовых стен, по вертикали от чистого пола, до оси изделия; звенья короче 3 мм</text><text x="28" y="253.2" font-size="2.5" fill="#000">на листе вынесены во второй ярус (ближняя к стене цепочка).</text><text x="25" y="256.6" font-size="2.5" fill="#000">3. Схема мебели, приборов и декора не является технической документацией для производства мебели; габариты — по паспортам изделий.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="50" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="50" y1="285.5" x2="50" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="52" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x
оры — фасад по расстановке (условно)</text><g><rect x="292" y="80.1" width="8" height="4" fill="#cfcfcf" stroke="#000" stroke-width="0.7"/></g><text x="303" y="83" font-size="2.5" fill="#000">стены и перекрытия в сечении</text><g><rect x="292" y="85.89999999999999" width="8" height="4" fill="#dbd5ca" fill-opacity="0.55" stroke="#000" stroke-width="0.25"/></g><text x="303" y="88.8" font-size="2.5" fill="#000">окраска: тон — цвет по коду производителя (условно)</text><g><text x="296" y="94.6" font-size="2.5" text-anchor="middle" fill="#000">О1</text><circle cx="296" cy="93.69999999999999" r="3.5" fill="none" stroke="#000" stroke-width="0.25"/></g><text x="303" y="94.6" font-size="2.5" fill="#000">марка отделки по реестру отделки альбома</text><g><g data-wall="C"><text x="296" y="101.2" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">А</text><path d="M 296 105.2 L 294.5 103.05 L 297.5 103.05 Z" fill="#000"/><circle cx="296" cy="100.3" r="2.5" fill="none" stroke="#000" stroke-width="0.35"/></g></g><text x="303" y="102.4" font-size="2.5" fill="#000">марка развёртки: буква стены, стрелка — взгляд</text></g><g data-el="finish-table"><text x="292" y="118.3" font-size="3.5" font-weight="700" fill="#000">Ведомость отделки (на листе)</text><rect x="292" y="120.8" width="118" height="33" fill="none" stroke="#000" stroke-width="0.5"/><line x1="292" y1="130.8" x2="410" y2="130.8" stroke="#000" stroke-width="0.5"/><text x="297.5" y="126.7" font-size="2.5" text-anchor="middle" fill="#000">Марка</text><line x1="303" y1="120.8" x2="303" y2="153.8" stroke="#000" stroke-width="0.25"/><text x="311" y="125" font-size="2.5" text-anchor="middle" fill="#000">Поверх</text><text x="311" y="128.4" font-size="2.5" text-anchor="middle" fill="#000">ность</text><line x1="319" y1="120.8" x2="319" y2="153.8" stroke="#000" stroke-width="0.25"/><text x="343" y="126.7" font-size="2.5" text-anchor="middle" fill="#000">Материал, изделие</text><line x1="367" y1="120.8" x2="367" y2="153.
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-sheet="spec" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Спецификация отделочных материалов</text><text x="25" y="17.8" font-size="2.5" fill="#333">Форма 1 по ГОСТ 21.110-2013 · количества — из геометрии проекта, с запасом · часть 2 из 2</text><g data-el="spec"><rect x="20" y="24" width="395" height="70" fill="none" stroke="#000" stroke-width="0.5"/><line x1="20" y1="34" x2="415" y2="34" stroke="#000" stroke-width="0.5"/><text x="26" y="29.9" font-size="2.5" text-anchor="middle" fill="#000">Поз.</text><line x1="32" y1="24" x2="32" y2="94" stroke="#000" stroke-width="0.25"/><text x="96" y="29.9" font-size="2.5" text-anchor="middle" fill="#000">Наименование и техническая характеристика</text><line x1="160" y1="24" x2="160" y2="94" stroke="#000" stroke-width="0.25"/><text x="188" y="29.9" font-size="2.5" text-anchor="middle" fill="#000">Тип, марка, обозначение документа</text><line x1="216" y1="24" x2="216" y2="94" stroke="#000" stroke-width="0.25"/><text x="225" y="29.9" font-size="2.5" text-anchor="middle" fill="#000">Код продукции</text><line x1="234" y1="24" x2="234" y2="94" stroke="#000" stroke-width="0.25"/><text x="252" y="29.9" font-size="2.5" text-anchor="middle" fill="#000">Поставщик</text><line x1="270" y1="24" x2="270" y2="94" stroke="#000" stroke-width="0.25"/><text x="276.5" y="29.9" font-size="2.5" text-anchor="middle" fill="#000">Ед. изм.</text><line x1="283" y1="24" x2="283" y2="94" stroke="#000" stroke-width="0.25"/><text x="291.5" y="29.9" font-size="2.5" text-anchor="middle" fill="#000">Кол.</text><line x1="300" y1="24" x2="300" y2="94" stroke="#000" stroke-width="0.25"/><text x="307.5" y="28.3" font-size="2.5" text-anchor="middle" fill="#000">Масса 1</text><text x="307.5" y="31.5" font-size="2.5" text-anchor="middle" fill="#000">ед., кг</text><line x1="315" y1="24" x2="315" y2="94" stroke="#000" stroke-width="0.25"/><text x="365" y="29.9" font-size="2.5" text-anchor="middle" fill="#000">Примечание</text><text x="96" y="37.9" font-size="2.5" text-anchor="middle" font-weight="700" text-decoration="underline" fill="#000">Погонажные изделия</text><line x1="20" y1="39.5" x2="415" y2="39.5" stroke="#000" stroke-width="0.18"/><g data-el="spec-row" data-kind="skirting" data-row="21" data-unit="м" data-q="101"><text x="26" y="43.4" font-size="2.5" text-anchor="middle" fill="#000">21</text><text x="33.5" y="43.4" font-size="2.5" text-anchor="start" fill="#000">Плинтус МДФ под окраску 80×16 мм, крепление к стене, окраска в цвет Tikkurila F497</text><text x="161.5" y="43.4" font-size="2.5" text-anchor="start" fill="#000">аналог по характеристикам</text><text x="225" y="43.4" font-size="2.5" text-anchor="middle" fill="#000"></text><text x="235.5" y="43.4" font-size="2.5" text-anchor="start" fill="#000"></text><text x="276.5" y="43.4" font-size="2.5" text-anchor="middle" fill="#000">м</text><text x="298.5" y="43.4" font-size="2.5" text-anchor="end" fill="#000">101</text><text x="307.5" y="43.4" font-size="2.5" text-anchor="middle" fill="#000"></text><text x="316.5" y="43.4" font-size="2.5" text-anchor="start" fill="#000">пом. 1, 3, 4, 5, 6, 7, 8, 9, 11; L = 91,0 м (периметр без дверных проёмов) + 10 % на</text><text x="316.5" y="46.6" font-size="2.5" text-anchor="start" fill="#000">подрезку; в штуках — по длине планки</text></g><line x1="20" y1="48.2" x2="415" y2="48.2" stroke="#000" stroke-width="0.18"/><g data-el="spec-row" data-kind="skirting" data-row="22" data-unit="м" data-q="15"><text x="26" y="52.1" font-size="2.5" text-anchor="middle" fill="#000">22</text><text x="33.5" y="52.1" font-size="2.5" text-anchor="start" fill="#000">Плинтус из керамогранита пола, подрезка 80 мм, верхняя кромка с запилом 45°, h = 80 мм, крепление к стене</text><text x="161.5" y="52.1" font-size="2.5" text-anchor="start" fill="#000">аналог по характеристикам</text><text x="225" y="52.1" font-size="2.5" text-anchor="middle" fill="#000"></text><text x="235.5" y="52.1" font-size="2.5" text-anchor="start" fill="#000"></text><text x="276.5" y="52.1" font-size="2.5" text-anchor="middle" fill="#000">м</text><text x="298.5" y="52.1" font-size="2.5" text-anchor="end" fill="#000">15</text><text x="307.5" y="52.1" font-size="2.5" text-anchor="middle" fill="#000"></text><text x="316.5" y="52.1" font-size="2.5" text-anchor="start" fill="#000">пом. 12, 13; L = 13,6 м (периметр без дверных проёмов) + 10 % на подрезку; в штуках</text><text x="316.5" y="55.3" font-size="2.5" text-anchor="start" fill="#000">— по длине планки</text></g><line x1="20" y1="56.9" x2="415" y2="56.9" stroke="#000" stroke-width="0.18"/><text x="96" y="60.8" font-size="2.5" text-anchor="middle" font-weight="700" text-decoration="underline" fill="#000">Смеси и материалы для облицовки</text><line x1="20" y1="62.4" x2="415" y2="62.4" stroke="#000" stroke-width="0.18"/><g data-el="spec-row" data-kind="grout" data-row="23" data-unit="кг" data-q="5.6"><text x="26" y="66.3" font-size="2.5" text-anchor="middle" fill="#000">23</text><text x="33.5" y="66.3" font-size="2.5" text-anchor="start" fill="#000">Затирка для швов плитки, класс CG2WA по EN 13888</text><text x="161.5" y="66.3" font-size="2.5" text-anchor="start" fill="#000">аналог: Mapei Ultracolor 133</text><text x="225" y="66.3" font-size="2.5" text-anchor="middle" fill="#000"></text><text x="235.5" y="66.3" font-size="2.5" text-anchor="start" fill="#000">аналог:</text><text x="276.5" y="66.3" font-size="2.5" text-anchor="middle" fill="#000">кг</text><text x="298.5" y="66.3" font-size="2.5" text-anchor="end" fill="#000">5,6</text><text x="307.5" y="66.3" font-size="2.5" text-anchor="middle" fill="#000"></text><text x="316.5" y="66.3" font-size="2.5" text-anchor="start" fill="#000">по раскладке (a+b)/(a·b) × шов × t × 1,6 + 10 %; в т. ч. 0,1 кг — позиции раскладки</text><text x="316.5" y="69.5" font-size="2.5" text-anchor="start" fill="#000">без марки</text></g><line x1="20" y1="71.1" x2="415" y2="71.1" stroke="#000" stroke-width="0.18"/><g data-el="spec-row" data-kind="adhesive" data-row="24" data-unit="кг" data-q="431"><text x="26" y="75" font-size="2.5" text-anchor="middle" fill="#000">24</text><text x="33.5" y="75" font-size="2.5" text-anchor="start" fill="#000">Клей плиточный C2 TE S1 по EN 12004, слой 5 мм</text><text x="161.5" y="75" font-size="2.5" text-anchor="start" fill="#000">аналог: Litokol K80 Eco</text><text x="225" y="75" font-size="2.5" text-anchor="middle" fill="#000"></text><text x="235.5" y="75" font-size="2.5" text-anchor="start" fill="#000">аналог:</text><text x="276.5" y="75" font-size="2.5" text-anchor="middle" fill="#000">кг</text><text x="298.5" y="75" font-size="2.5" text-anchor="end" fill="#000">431</text><text x="307.5" y="75" font-size="2.5" text-anchor="middle" fill="#000"></text><text x="316.5" y="75" font-size="2.5" text-anchor="start" fill="#000">18 меш. по 25 кг; 1,5 кг/м² на 1 мм слоя + 10 %; в т. ч. 10 кг — позиции раскладки без</text><text x="316.5" y="78.2" font-size="2.5" text-anchor="start" fill="#000">марки</text></g><line x1="20" y1="79.8" x2="415" y2="79.8" stroke="#000" stroke-width="0.18"/><g data-el="spec-row" data-kind="waterproofing" data-row="25" data-unit="м²" data-q="16.1"><text x="26" y="83.7" font-size="2.5" text-anchor="middle" fill="#000">25</text><text x="33.5" y="83.7" font-size="2.5" text-anchor="start" fill="#000">Гидроизоляция обмазочная мокрых зон: пол, стены по периметру, зоны замачивания; 2 слоя с армирующей лентой в</text><text x="33.5" y="86.9" font-size="2.5" text-anchor="start" fill="#000">углах</text><text x="161.5" y="83.7" font-size="2.5" text-anchor="start" fill="#000">аналог по характеристикам</text><text x="225" y="83.7" font-size="2.5" text-anchor="middle" fill="#000"></text><text x="235.5" y="83.7" font-size="2.5" text-anchor="start" fill="#000"></text><text x="276.5" y="83.7" font-size="2.5" text-anchor="middle" fill="#000">м²</text><text x="298.5" y="83.7" font-size="2.5" text-anchor="end" fill="#000">16,1</text><text x="307.5" y="83.7" font-size="2.5" text-anchor="middle" fill="#000"></text><text x="316.5" y="83.7" font-size="2.5" text-anchor="start" fill="#000">площадь по листу раскладки плитки + 10 %; расход смеси — по ТУ</text></g><line x1="20" y1="88.5" x2="415" y2="88.5" stroke="#000" stroke-width="0.18"/><g data-el="spec-row" data-kind="damper" data-row="26" data-unit="м" data-q="28.9"><text x="26" y="92.4" font-size="2.5" text-anchor="middle" fill="#000">26</text><text x="33.5" y="92.4" font-size="2.5" text-anchor="start" fill="#000">Лента демпферная по периметру пола из плитки</text><text x="161.5" y="92.4" font-size="2.5" text-anchor="start" fill="#000">аналог по характеристикам</text><text x="225" y="92.4" font-size="2.5" text-anchor="middle" fill="#000"></text><text x="235.5" y="92.4" font-size="2.5" text-anchor="start" fill="#000"></text><text x="276.5" y="92.4" font-size="2.5" text-anchor="middle" fill="#000">м</text><text x="298.5" y="92.4" font-size="2.5" text-anchor="end" fill="#000">28,9</text><text x="307.5" y="92.4" font-size="2.5" text-anchor="middle" fill="#000"></text><text x="316.5" y="92.4" font-size="2.5" text-anchor="start" fill="#000">периметр без дверных проёмов + 10 %</text></g></g><g data-el="notes"><text x="25" y="102" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="107" font-size="2.5" fill="#000">1. Количества — из геометрии проекта: площади поверхностей по чистым граням стен до отделки (те же, что в ведомости отделки и колерной карте), плитка, клей и затирка — по</text><text x="28" y="110.4" font-size="2.5" fill="#000">раскладке плиточника; в графе «Кол.» — к заказу, с запасом.</text><text x="25" y="113.8" font-size="2.5" fill="#000">2. Краска: расход 0,12 л/м² на слой в 2 слоя, если по ТУ не задан иной; запас 10 % и 0,5 л на подкраску каждого кода. Один код — одна партия, колеровка машинная в</text><text x="28" y="117.2" font-size="2.5" fill="#000">колеровочном центре бренда; в заказ — только после утверждения выкраса (колерная карта). Фасовка — по каталогу бренда на дату выпуска; к заказу — не меньше расчётного объёма.</text><text x="25" y="120.6" font-size="2.5" fill="#000">3. «Аналог по характеристикам» — допускается изделие другого производителя с характеристиками не ниже указанных, по согласованию с автором проекта.</text><text x="25" y="124" font-size="2.5" fill="#000">4. Графы «Код продукции» и «Масса 1 ед.» не заполнены: коды по классификатору продукции не присвоены, масса единицы до 25 кг (ГОСТ 21.110-2013).</text><text x="25" y="127.4" font-size="2.5" fill="#000">5. Грунтовка и клей для доски указаны площадью обработки; объём — по ТУ выбранного продукта.</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="8.6" lengthAdjust="spacingAndGlyphs" fill="#000">23.09.26</text><text x="231" y="270.8" font-size="2.5" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" fill="#000">ГД-2026-004-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" fill="#000">Четырёхкомнатная квартира</text><text x="297" y="259.2" font-size="2.5" fill="#000">Общая площадь 87,88 м²</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="268.7" font-size="2.5" fill="#000">Дизайн-проект интерьера четырёхкомнатной</text><text x="297" y="272.5" font-size="2.5" fill="#000">квартиры</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">42</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">106</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="285" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">Спецификация отделочных материалов</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">Кырлан Александр Сергеевич</text></g></svg>
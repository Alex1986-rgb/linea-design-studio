<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Задание на контрольный обмер и обследование. Лист 5 из 5</text><text x="25" y="17.8" font-size="2.5" fill="#333">Что замерить, вскрыть и получить до заказа материалов и изделий</text><g data-el="survey-task" data-plan="fixed" data-plan-declared="5"><g data-el="survey-offsite"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Документы и данные закупки (не на объекте) (продолжение)</text><rect x="25" y="33" width="385" height="33.8" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="31" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="37" y1="33" x2="37" y2="66.8" stroke="#000" stroke-width="0.25"/><text x="62" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">У кого, откуда</text><line x1="87" y1="33" x2="87" y2="66.8" stroke="#000" stroke-width="0.25"/><text x="97" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Способ</text><line x1="107" y1="33" x2="107" y2="66.8" stroke="#000" stroke-width="0.25"/><text x="149" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Что получить</text><line x1="191" y1="33" x2="191" y2="66.8" stroke="#000" stroke-width="0.25"/><text x="219" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">К какому сроку</text><line x1="247" y1="33" x2="247" y2="66.8" stroke="#000" stroke-width="0.25"/><text x="285" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Что пересчитается в альбоме</text><line x1="323" y1="33" x2="323" y2="66.8" stroke="#000" stroke-width="0.25"/><text x="344" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Чем подтверждается</text><line x1="365" y1="33" x2="365" y2="66.8" stroke="#000" stroke-width="0.25"/><text x="387.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Закрывает вопросы реестра</text><g data-el="survey-row" data-id="О-22" data-key="built-in-appliance-passports" data-closes="К-27" data-method="procure" data-covers=""><text x="31" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">О-22</text><text x="38.5" y="46.7" font-size="2.5" fill="#000">Поставщик или изготовитель техники;</text><text x="38.5" y="50.1" font-size="2.5" fill="#000">паспорт и монтажная схема</text><text x="38.5" y="53.5" font-size="2.5" fill="#000">выбранной модели</text><text x="88.5" y="46.7" font-size="2.5" fill="#000">Закупка</text><text x="108.5" y="46.7" font-size="2.5" fill="#000">Модели и монтажные схемы встраиваемой техники: холодильник</text><text x="108.5" y="50.1" font-size="2.5" fill="#000">(М20), духовой шкаф (М22), посудомоечная машина (М27)</text><text x="108.5" y="53.5" font-size="2.5" fill="#000">габариты ниши, вентзазоры, высота цоколя и решётки,</text><text x="108.5" y="56.9" font-size="2.5" fill="#000">подключение.</text><text x="192.5" y="46.7" font-size="2.5" fill="#000">До заказа модулей кухни</text><text x="248.5" y="46.7" font-size="2.5" fill="#000">Размеры ниш модулей М20, М22, М27; вентиляция в</text><text x="248.5" y="50.1" font-size="2.5" fill="#000">цоколе и за корпусом; точки подключения техники на листе</text><text x="248.5" y="53.5" font-size="2.5" fill="#000">кухни.</text><text x="248.5" y="56.9" font-size="2.5" fill="#000">Листы:</text><text x="248.5" y="60.3" font-size="2.5" fill="#000">л. 78 — Кухня (пом. 6). Развёртка гарнитура</text><text x="248.5" y="63.7" font-size="2.5" fill="#000">л. 79 — Кухня (пом. 6). Монтажная схема</text><text x="324.5" y="46.7" font-size="2.5" fill="#000">паспорт изделия или партии</text><text x="366.5" y="46.7" font-size="2.5" fill="#000">К-27</text><text x="366.5" y="50.1" font-size="2.5" fill="#000">Результат принимает: Мебельщик</text></g></g><g data-el="notes"><text x="25" y="79.2" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="84" font-size="2.5" fill="#000">1. Подтверждение: акт контрольного обмера (дата, кто присутствовал, прибор, перечень промеров с результатами, подписи присутствующих); к акту — фото вскрытий и узлов и техническое заключение организации, выполнившей обследование.</text><text x="25" y="87.4" font-size="2.5" fill="#000">2. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text><text x="25" y="90.8" font-size="2.5" fill="#000">3. Пункт исключается из задания при следующем выпуске, когда акт подписан, значение внесено в проект и листы перевыпущены; знак «*» у величины снимается только замером.</text></g></g><g data-el="assumed-notes" data-flags="" data-ids="ИЗ-8 К-3 К-20 К-21 К-24 К-25" data-level="0"><text x="25.5" y="275.5" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">Основа листа: размеры сняты с размерных цепочек растрового скана плана заказчика, на объекте не замерены; ступени наружного контура приведены к граням помещений модели</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">(ИЗ-8, К-20, К-21); высота потолка 2700 мм принята, источника нет (К-24); тип дома и перекрытие (монолит, плита 220 мм) приняты, источника нет (К-3); толщины стен приняты (250 и</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">120 мм), источника нет (К-21); мощность 15 кВт принята, технических условий нет (К-25).</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, запись К-3; лист 7, записи К-20, К-21, К-24, К-25; лист 10, запись ИЗ-8).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" str
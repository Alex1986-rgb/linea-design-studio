ill="#000">100</text></g><g data-el="schedule"><text x="238" y="26" font-size="3.5" font-weight="700" fill="#000">Привязка выводов к осям модулей</text><rect x="238" y="28" width="172" height="8" fill="none" stroke="#000" stroke-width="0.5"/><line x1="238" y1="36" x2="410" y2="36" stroke="#000" stroke-width="0.5"/><text x="244.5" y="33.3" font-size="2.5" text-anchor="middle" fill="#000">Код</text><line x1="251" y1="28" x2="251" y2="36" stroke="#000" stroke-width="0.25"/><text x="277" y="33.3" font-size="2.5" text-anchor="middle" fill="#000">Назначение</text><line x1="303" y1="28" x2="303" y2="36" stroke="#000" stroke-width="0.25"/><text x="310.5" y="33.3" font-size="2.5" text-anchor="middle" fill="#000">Модуль</text><line x1="318" y1="28" x2="318" y2="36" stroke="#000" stroke-width="0.25"/><text x="327" y="33.3" font-size="2.5" text-anchor="middle" fill="#000">От оси, мм</text><line x1="336" y1="28" x2="336" y2="36" stroke="#000" stroke-width="0.25"/><text x="342.5" y="33.3" font-size="2.5" text-anchor="middle" fill="#000">Н, мм</text><line x1="349" y1="28" x2="349" y2="36" stroke="#000" stroke-width="0.25"/><text x="379.5" y="33.3" font-size="2.5" text-anchor="middle" fill="#000">Размещение</text></g><g data-el="finish-gaps"><text x="238" y="44" font-size="3.5" font-weight="700" fill="#000">Зазоры под отделку</text><rect x="238" y="46" width="172" height="26" fill="none" stroke="#000" stroke-width="0.5"/><line x1="238" y1="54" x2="410" y2="54" stroke="#000" stroke-width="0.5"/><text x="249" y="51.3" font-size="2.5" text-anchor="middle" fill="#000">Поверхность</text><line x1="260" y1="46" x2="260" y2="72" stroke="#000" stroke-width="0.25"/><text x="285" y="51.3" font-size="2.5" text-anchor="middle" fill="#000">Отделка</text><line x1="310" y1="46" x2="310" y2="72" stroke="#000" stroke-width="0.25"/><text x="318" y="51.3" font-size="2.5" text-anchor="middle" fill="#000">Зазор, мм</text><line x1="326" y1="46" x2="326" y2="72" stroke="#000" stroke-width="0.25"/><text x="368" y="51.3" font-size="2.5" text-anchor="middle" fill="#000">Учесть</text><line x1="238" y1="60" x2="410" y2="60" stroke="#000" stroke-width="0.18"/><text x="239.5" y="58.3" font-size="2.5" text-anchor="start" fill="#000">фартук</text><text x="261.5" y="58.3" font-size="2.5" text-anchor="start" fill="#000">керамогранит</text><text x="311.5" y="58.3" font-size="2.5" text-anchor="start" fill="#000">10</text><text x="327.5" y="58.3" font-size="2.5" text-anchor="start" fill="#000">от чернового основания до корпуса навесных и столешницы</text><line x1="238" y1="66" x2="410" y2="66" stroke="#000" stroke-width="0.18"/><text x="239.5" y="64.3" font-size="2.5" text-anchor="start" fill="#000">стены</text><text x="261.5" y="64.3" font-size="2.5" text-anchor="start" fill="#000">окраска</text><text x="311.5" y="64.3" font-size="2.5" text-anchor="start" fill="#000">5</text><text x="327.5" y="64.3" font-size="2.5" text-anchor="start" fill="#000">под штукатурку и шпаклёвку за пеналом</text><text x="239.5" y="70.3" font-size="2.5" text-anchor="start" fill="#000">пол</text><text x="261.5" y="70.3" font-size="2.5" text-anchor="start" fill="#000">инженерная доска</text><text x="311.5" y="70.3" font-size="2.5" text-anchor="start" fill="#000"></text><text x="327.5" y="70.3" font-size="2.5" text-anchor="start" fill="#000">цоколь — после укладки пола, опоры ±20 мм</text></g><g data-el="legend"><text x="238" y="80" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><rect x="238" y="85.6" width="10.5" height="4.6" fill="none" stroke="#000" stroke-width="0.25" stroke-dasharray="2.2 1"/><text x="252" y="88.4" font-size="2.5" fill="#000">навесной модуль (невидимый контур)</text><path d="M 243.25 91.5 L 243.25 97.3" fill="none" stroke="#000" stroke-width="0.18" stroke-dasharray="4 1 0.8 1"/><text x="252" y="94.9" font-size="2.5" fill="#000">ось модуля (от неё — привязка вывода)</text><path d="M 241.45 99.1 L 245.05 102.7" fill="none" stroke="#000" stroke-width="0.35"/><path d="M 241.45 102.7 L 245.05 99.1" fill="none" stroke="#000" stroke-width="0.35"/><text x="252" y="101.4" font-size="2.5" fill="#000">анкер / уголок крепления к стене</text></g><g data-el="legend"><text x="326" y="80" font-size="3.5" font-weight="700" fill="#000"></text><circle cx="331.25" cy="88.6" r="1.5" fill="#fff" stroke="#000" stroke-width="0.35"/><path d="M 329.75 88.6 L 332.75 88.6" fill="none" stroke="#000" stroke-width="0.25"/><text x="340" y="88.4" font-size="2.5" fill="#000">розетка на стене</text><circle cx="331.25" cy="94.4" r="1.3" fill="#fff" stroke="#000" stroke-width="0.35"/><circle cx="331.25" cy="94.4" r="0.45" fill="#000"/><text x="340" y="94.9" font-size="2.5" fill="#000">вывод кабеля к технике</text><circle cx="331.25" cy="100.9" r="1.1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/><text x="333.2" y="101.8" font-size="2.5" fill="#1f5fbf">В1</text><text x="340" y="101.4" font-size="2.5" fill="#000">вывод воды В1 / Т3, канализации К1</text></g><g data-el="notes"><text x="25" y="190" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="195" font-size="2.5" fill="#000">1. Выводы — по проекту электрики и ВК; привязка по горизонтали — от оси модуля (плюс — вправо по виду), по высоте — от чистого пола до оси вывода.</text><text x="25" y="198.6" font-size="2.5" fill="#000">2. Пенал — уголки к стене 2 шт. сверху; нижние модули — стяжками между собой и уголком к стене; ряд выставить по уровню опорами цоколя.</text><text x="25" y="202.2" font-size="2.5" fill="#000">3. Розетки над столешницей — не ниже 150 мм над ней и не за корпусом техники; розетка за ПММ, духовым шкафом и холодильником — только в соседнем модуле или в зоне цоколя с</text><text x="25" y="205.8" font-size="2.5" fill="#000">доступом.</text><text x="25" y="209.4" font-size="2.5" fill="#000">4. Столешница — вырезы по шаблонам выбранных моделей мойки и варочной панели; торцы у стены — герметик, пристеночный плинтус.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="75" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="75" y1="285.5" x2="75" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="77" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="" data-ids="ИЗ-8 К-3 К-14 К-20 К-21 К-24 К-25" data-level="0"><text x="25.5" y="265.1" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="268.5" font-size="2.5" fill="#000">Основа листа: размеры сняты с размерных цепочек растрового скана плана заказчика, на объекте не замерены; ступени наружного контура приведены к граням помещений модели</text><text x="25.5" y="271.9" font-size="2.5" fill="#000">(ИЗ-8, К-20, К-21); высота потолка 2700 мм принята, источника нет (К-24); тип дома и перекрытие (монолит, плита 220 мм) приняты, источника нет (К-3); толщины стен приняты (250 и</text><text x="25.5" y="275.3" font-size="2.5" fill="#000">120 мм), источника нет (К-21); мощность 15 кВт принята, технических условий нет (К-25).</text><text x="25.5" y="278.7" font-size="2.5" fill="#000">Открытые вопросы и конфликты по листу: К-14.</text><text x="25.5" y="282.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, запись К-3; лист 7, записи К-14, К-20, К-21, К-24, К-25; лист 10, запись ИЗ-8).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Развёртки мокрых зон: выводы ВК. Кухня" data-sheet="plumbing" data-scale="1:20"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Развёртки мокрых зон: выводы ВК. Кухня</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">пом. 6 · выводы В1, Т3, К1 на стенах · высоты от чистого пола, привязки от чистовых углов, мм</text><g data-el="outlet-table"><text x="25" y="27" font-size="3.5" font-weight="700" fill="#000">Ведомость привязок выводов (от чистого пола и угла)</text><rect x="25" y="29" width="287" height="14" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="37" x2="312" y2="37" stroke="#000" stroke-width="0.5"/><text x="37.51" y="34.3" font-size="2.5" text-anchor="middle" data-fit="24.02" fill="#000">Код</text><line x1="50.02" y1="29" x2="50.02" y2="43" stroke="#000" stroke-width="0.25"/><text x="103.32" y="34.3" font-size="2.5" text-anchor="middle" data-fit="105.6" fill="#000">Прибор</text><line x1="156.61" y1="29" x2="156.61" y2="43" stroke="#000" stroke-width="0.25"/><text x="165.25" y="34.3" font-size="2.5" text-anchor="middle" data-fit="16.26" fill="#000">Ø</text><line x1="173.88" y1="29" x2="173.88" y2="43" stroke="#000" stroke-width="0.25"/><text x="185.89" y="34.3" font-size="2.5" text-anchor="middle" data-fit="23.02" fill="#000">Н, мм</text><line x1="197.89" y1="29" x2="197.89" y2="43" stroke="#000" stroke-width="0.25"/><text x="254.95" y="34.3" font-size="2.5" text-anchor="middle" data-fit="113.11" fill="#000">Привязка, мм</text><text x="26.5" y="41.3" font-size="2.5" text-anchor="start" data-fit="22.02" fill="#000"></text><text x="51.52" y="41.3" font-size="2.5" text-anchor="start" data-fit="103.6" fill="#000">выводов на стене нет</text><text x="158.11" y="41.3" font-size="2.5" text-anchor="start" data-fit="14.26" fill="#000"></text><text x="175.38" y="41.3" font-size="2.5" text-anchor="start" data-fit="21.02" fill="#000"></text><text x="199.39" y="41.3" font-size="2.5" text-anchor="start" data-fit="111.11" fill="#000"></text></g><g data-el="legend"><text x="320" y="27" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><circle cx="324" cy="33" r="1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/><text x="331" y="33.9" font-size="2.5" fill="#000">вывод В1 (код — в ведомости привязок)</text><circle cx="324" cy="38" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/><text x="331" y="38.9" font-size="2.5" fill="#000">вывод Т3 (код — в ведомости привязок)</text><circle cx="324" cy="43" r="1" fill="#fff" stroke="#6b4f2a" stroke-width="0.35"/><text x="331" y="43.9" font-size="2.5" fill="#000">вывод К1 (код — в ведомости привязок)</text><rect x="320.5" y="46" width="7" height="4" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="331" y="48.9" font-size="2.5" fill="#000">сантехприбор по расстановке (габарит модели)</text><rect x="320.5" y="51" width="7" height="4" fill="#fff" stroke="#000" stroke-width="0.25" stroke-dasharray="2 0.8"/><text x="331" y="53.9" font-size="2.5" fill="#000">дверной проём; окно — сплошной контур</text></g><text x="29" y="33" font-size="3.5" font-weight="700" fill="#000">Стен с приборами нет.</text><text x="29" y="39" font-size="3.5" fill="#000">Развёртка не построена: выводы В1, Т3, К1 не назначены, привязки не даются; расстановка приборов в данных не задана (записи реестра нет).</text><g data-el="notes"><text x="25" y="240" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="245" font-size="2.5" fill="#000">1. Габариты и высоты приборов, межосевые смесителей и места кранов — по паспортам выбранных приборов, сверяются до разметки стен.</text><text x="25" y="248.6" font-size="2.5" fill="#000">2. Высоты Н — от чистого пола помещения, мм; отметка чистого пола и потолка — у левого края вида (от ±0,000 объекта). Привязки — от левого чистового</text><text x="25" y="252.2" font-size="2.5" fill="#000">угла вида (облицовка стен вычтена), как на развёртках стен.</text><text x="25" y="255.8" font-size="2.5" fill="#000">3. Приборы П6, П7: стена не определена, на развёртке не показаны (записи реестра нет).</text><text x="25" y="259.4" font-size="2.5" fill="#000">4. Выводы в полу (К1-1, К1-2): трап, лоток, выпуск отдельностоящей ванны, подвод к стойке напольного смесителя — на развёртке их нет; место и пирог</text><text x="25" y="263" font-size="2.5" fill="#000">пола — лист «Схема разводки» (профиль К1, узел 1).</text><text x="25" y="266.6" font-size="2.5" fill="#000">5. Ревизионные люки к арматуре и ревизиям в данных не заданы: место и размер не определены (записи реестра нет).</text><text x="25" y="270.2" font-size="2.5" fill="#000">6. Мойка, ПММ и фильтр — выводы в шкафу мойки; диаметры и положение сифона и кранов сверить по паспортам приборов и чертежам модуля.</text><text x="25" y="273.8" font-size="2.5" fill="#000">7. Расчёт систем водоснабжения и канализации и подбор оборудования выполняет проектная организация; лист задаёт места и высоты выводов.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="75" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="75" y1="285.5" x2="75" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="77" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="" data-ids="ИЗ-8 К-3 К-20 К-21 К-24 К-25" data-level="0"><text x="45.5" y="220.5" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="45.5" y="223.9" font-size="2.5" fill="#000">Основа листа: размеры сняты с размерных цепочек растрового скана плана заказчика, на объекте не замерены; ступени наружного контура приведены к граням помещений модели (ИЗ-8, К-20, К-21);</text><text x="45.5" y="227.3" font-size="2.5" fill="#000">высота потолка 2700 мм принята, источника нет (К-24); тип дома и перекрытие (монолит, плита 220 мм) приняты, источника нет (К-3); толщины стен приняты (250 и 120 мм), источника нет (К-21);</text><text x="45.5" y="230.7" font-size="2.5" fill="#000">мощность 15 кВт принята, технических условий нет (К-25).</text><text x="45.5" y="234.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 7, запись К-3; лист 8, записи К-20, К-21, К-24, К-25; лист 11, запись ИЗ-8).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">04.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="251" y="275.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="275.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">04.11.26</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-004-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Четырёхкомнатная квартира</text><text x="297" y="259.2" font-size="2.5" textLength="96.71" lengthAdjust="spacingAndGlyphs" data-fit="116" fill="#000">Общая площадь 102,67* м² · * размеры со скана, не замерены (реестр — л. 7–12, ИЗ-8, К-20, К-21)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="268.7" font-size="2.5" data-fit="66" fill="#000">Дизайн-проект интерьера четырёхкомнатной</text><text x="297" y="272.5" font-size="2.5" data-fit="66" fill="#000">квартиры</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">48</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">147</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="282.2" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">Развёртки мокрых зон: выводы ВК. Кухня</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М 1:20</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="47" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="35" data-positions="82" data-basis="5"><rect x="313.01" y="6.2" width="100.49" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="315.01" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 35 (реестр — л. 7–12)</text></g></svg>
86.37" font-size="2.5" text-anchor="start" data-fit="46.16" fill="#000">20</text><text x="262.08" y="186.37" font-size="2.5" text-anchor="start" data-fit="40.42" fill="#000">3,31</text><line x1="25" y1="194.07" x2="304" y2="194.07" stroke="#000" stroke-width="0.18"/><text x="26.5" y="192.37" font-size="2.5" text-anchor="start" data-fit="29.95" fill="#000">Т3-2</text><text x="59.45" y="192.37" font-size="2.5" text-anchor="start" data-fit="112.79" fill="#000">П3 умывальник</text><text x="175.24" y="192.37" font-size="2.5" text-anchor="start" data-fit="34.68" fill="#000">550</text><text x="212.92" y="192.37" font-size="2.5" text-anchor="start" data-fit="46.16" fill="#000">20</text><text x="262.08" y="192.37" font-size="2.5" text-anchor="start" data-fit="40.42" fill="#000">2,29</text><text x="26.5" y="198.37" font-size="2.5" text-anchor="start" data-fit="29.95" fill="#000">Т3-4</text><text x="59.45" y="198.37" font-size="2.5" text-anchor="start" data-fit="112.79" fill="#000">П9 умывальник</text><text x="175.24" y="198.37" font-size="2.5" text-anchor="start" data-fit="34.68" fill="#000">550</text><text x="212.92" y="198.37" font-size="2.5" text-anchor="start" data-fit="46.16" fill="#000">20</text><text x="262.08" y="198.37" font-size="2.5" text-anchor="start" data-fit="40.42" fill="#000">1,08</text></g><g data-el="legend"><text x="312" y="166.07" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><line x1="312.5" y1="172.07" x2="319.5" y2="172.07" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><text x="323" y="172.97" font-size="2.5" fill="#000">Т3 — горячее водоснабжение, подача (ГВС), PP-R Ø20</text><circle cx="316" cy="177.07" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/><text x="323" y="177.97" font-size="2.5" fill="#000">вывод Т3 (код — в ведомости привязок)</text><circle cx="316" cy="182.0732106143464" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="323" y="182.97" font-size="2.5" fill="#000">стояк «Ст К1-N / Ст В1-N» (ГОСТ 21.601), Ø мм</text><circle cx="316" cy="187.0732106143464" r="1.1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/><text x="323" y="187.97" font-size="2.5" fill="#000">стояк в плане (на отметке пола); вертикаль — стояк по высоте,</text><text x="323" y="191.27" font-size="2.5" fill="#000">разрыв — перекрытие</text><circle cx="316" cy="195.37" r="0.6" fill="#000"/><text x="323" y="196.27" font-size="2.5" fill="#000">тройник (ответвление к прибору)</text><path d="M 314 199.07 L 318 201.67 L 318 199.07 L 314 201.67 Z" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="323" y="201.27" font-size="2.5" fill="#000">кран шаровой</text><circle cx="316" cy="205.37321061434642" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35" stroke-dasharray="0.8 0.6"/><text x="323" y="206.27" font-size="2.5" fill="#000">* стояк Т3 не на обмере — принят в шахте рядом со Ст В1,</text><text x="323" y="209.57" font-size="2.5" fill="#000">сверить</text></g><g data-el="notes"><text x="25" y="240" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="245" font-size="2.5" fill="#000">1. Схема Т3 построена по тем же трассам, что план разводки: положение в плане сохранено, глубина — в масштабе ×0,5. Трассы принципиальные; фактическое</text><text x="25" y="248.6" font-size="2.5" fill="#000">положение фиксируется исполнительной схемой до закрытия.</text><text x="25" y="252.2" font-size="2.5" fill="#000">2. Высоты Н — от чистого пола помещения, мм. Отметка прокладки магистрали Т3 (в стяжке, в стене или по полу) в данных не задана: участки показаны на</text><text x="25" y="255.8" font-size="2.5" fill="#000">уровне пола условно (записи реестра нет).</text><text x="25" y="259.4" font-size="2.5" fill="#000">3. Узел ввода Т3 (кран, фильтр, счётчик, обратный клапан, кран) — на схеме разводки; состав узла ввода — по согласованию. Кран шаровой — на первом</text><text x="25" y="263" font-size="2.5" fill="#000">участке от стояка.</text><text x="25" y="266.6" font-size="2.5" fill="#000">4. Циркуляция ГВС в данных не задана — циркуляционного трубопровода на схеме нет (записи реестра нет).</text><text x="25" y="270.2" font-size="2.5" fill="#000" textLength="124.3" lengthAdjust="spacingAndGlyphs">5. Ст Т3-2 на обмере не показаны: приняты рядом с Ст В1-2* (в МКД стоят группой); положение сверить на объекте до разводки.</text><text x="25" y="273.8" font-size="2.5" fill="#000">6. Трубы испытать давлением до закрытия (акт скрытых работ, опрессовка по СП 73.13330.2016).</text><text x="25" y="277.4" font-size="2.5" fill="#000">7. Диаметры, высоты выводов и места кранов — по паспортам выбранных приборов и расчёту проектной организации.</text><text x="25" y="281" font-size="2.5" fill="#000">8. Расчёт систем, диаметры магистралей и подбор оборудования выполняет проектная организация.</text></g><g data-el="assume-compact"></g><g data-el="scale-bar"><line x1="25" y1="287" x2="45" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="45" y1="285.5" x2="45" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="47" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="riser:Ст В1-2|riser:Ст К1-2" data-ids="ИЗ-8 К-1 К-3 К-15 К-20 К-21 К-24 К-25" data-level="3"><text x="140.5" y="285.7" font-size="2.5" fill="#000">Допущения и предложения на листе. Знак «*» принято (замерить): Ст К1-2. См.</text><text x="140.5" y="289.1" font-size="2.5" fill="#000">лист открытых вопросов (листы 7–13).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line
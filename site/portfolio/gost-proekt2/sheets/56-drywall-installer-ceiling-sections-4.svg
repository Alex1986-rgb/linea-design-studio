">7</text></g><g data-el="leader"><circle cx="73" cy="50.38" r="0.45" fill="#000"/><line x1="73" y1="50.38" x2="73.98" y2="45.47" stroke="#000" stroke-width="0.25"/><line x1="73.98" y1="45.47" x2="78.34" y2="45.47" stroke="#000" stroke-width="0.25"/><text x="76.16" y="44.67" font-size="3.5" text-anchor="middle" fill="#000">8</text></g></g><g data-el="node-spec"><text x="98" y="33.5" font-size="2.5" fill="#000">1 — плита перекрытия</text><text x="98" y="37.5" font-size="2.5" fill="#000">2 — анкер-клин к плите — по одному на подвес</text><text x="98" y="41.5" font-size="2.5" fill="#000">3 — подвес прямой, шаг 1000 мм</text><text x="98" y="45.5" font-size="2.5" fill="#000">4 — ПН 28×27 по периметру — дюбель-гвоздь через ≤ 500 мм, не менее 3</text><text x="101" y="48.9" font-size="2.5" fill="#000">на профиль</text><text x="98" y="52.9" font-size="2.5" fill="#000">5 — ПП 60×27 несущий (вид) через 500 мм, в ПН</text><text x="98" y="56.9" font-size="2.5" fill="#000">6 — ПП 60×27 основной (сечение) через 1200 мм; соединители</text><text x="101" y="60.3" font-size="2.5" fill="#000">одноуровневые, шурупы LN 3,5×9</text><text x="98" y="64.3" font-size="2.5" fill="#000">7 — лента разделительная по стене, шов зашпаклёван</text><text x="98" y="68.3" font-size="2.5" fill="#000">8 — ГКЛВ 12,5 по П113; шурупы TN 3,5×25 через 170 мм</text></g></g></g></g><g data-el="notes"><text x="25" y="241" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="246" font-size="2.5" fill="#000">1. Сечения потолков М 1:10 по помещениям с нишами LED и нишами под шторы: отметки и размеры этого помещения от ±0,000 чистого пола (м, мм). Положение — по плану потолков (лист 52): короб и</text><text x="28" y="249.4" font-size="2.5" fill="#000">ниша LED — по линиям ленты, ниша под шторы — у стены с окном; типовые узлы по группам помещений — на листе 53.</text><text x="25" y="252.8" font-size="2.5" fill="#000">2. Крепёж: подвес прямой к плите на анкер-клине — по одному на подвес (Knauf П113); ПН к стенам — дюбель-гвоздь через ≤ 500 мм, не менее 3 на профиль (серия 1.045.9-2.08); лист 12,5 — шурупы TN</text><text x="28" y="256.2" font-size="2.5" fill="#000">3,5×25 через 170 мм (СП 163, табл. 15); профили между собой — соединители одноуровневые, шурупы LN 3,5×9.</text><text x="25" y="259.6" font-size="2.5" fill="#000">3. Изделия карнизов, профилей LED и галтелей — по артикулу из данных.</text></g><g data-el="ref-back" data-target="52"/><g data-el="scale-bar"><line x1="25" y1="287" x2="125" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="125" y1="285.5" x2="125" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="127" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="" data-ids="ИЗ-8 К-3 К-20 К-21 К-24 К-25" data-level="0"><text x="25.5" y="268.5" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="271.9" font-size="2.5" fill="#000">Основа листа: размеры сняты с размерных цепочек растрового скана плана заказчика, на объекте не замерены; ступени наружного контура приведены к граням помещений модели</text><text x="25.5" y="275.3" font-size="2.5" fill="#000">(ИЗ-8, К-20, К-21); высота потолка 2700 мм принята, источника нет (К-24); тип дома и перекрытие (монолит, плита 220 мм) приняты, источника нет (К-3); толщины стен приняты (250 и</text><text x="25.5" y="278.7" font-size="2.5" fill="#000">120 мм), источника нет (К-21); мощность 15 кВт принята, технических условий нет (К-25).</text><text x="25.5" y="282.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 7, запись К-3; лист 8, записи К-20, К-21, К-24, К-25; лист 11, запись ИЗ-8).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" 
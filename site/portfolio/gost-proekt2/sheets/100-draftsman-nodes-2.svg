oke-width="0.25"/><line x1="44.1" y1="91.7" x2="45.9" y2="89.9" stroke="#000" stroke-width="0.5"/><line x1="45.7" y1="91.7" x2="47.5" y2="89.9" stroke="#000" stroke-width="0.5"/><text x="48.5" y="89.9" font-size="2.5" text-anchor="middle" fill="#000">8</text><line x1="46.6" y1="85.8" x2="46.6" y2="92.3" stroke="#000" stroke-width="0.18"/><circle cx="46.6" cy="73.4" r="0.45" fill="#000"/><line x1="46.6" y1="73.4" x2="91" y2="41" stroke="#000" stroke-width="0.18"/><line x1="91" y1="41" x2="203.6" y2="41" stroke="#000" stroke-width="0.18"/><text x="92" y="40.2" font-size="2.5" fill="#000">плинтус МДФ 80×16 под окраску в цвет стены; клей монтажный — к стене, не к полу</text><circle cx="44" cy="51" r="0.45" fill="#000"/><line x1="44" y1="51" x2="91" y2="46.8" stroke="#000" stroke-width="0.18"/><line x1="91" y1="46.8" x2="171.4" y2="46.8" stroke="#000" stroke-width="0.18"/><text x="92" y="46" font-size="2.5" fill="#000">штукатурка, шпаклёвка Q3, окраска — по ведомости отделки</text><circle cx="45.8" cy="84.4" r="0.45" fill="#000"/><line x1="45.8" y1="84.4" x2="91" y2="52.6" stroke="#000" stroke-width="0.18"/><line x1="91" y1="52.6" x2="165.8" y2="52.6" stroke="#000" stroke-width="0.18"/><text x="92" y="51.8" font-size="2.5" fill="#000">зазор покрытия у стены 8–10 мм закрывается плинтусом</text><circle cx="65" cy="84.4" r="0.45" fill="#000"/><line x1="65" y1="84.4" x2="91" y2="58.4" stroke="#000" stroke-width="0.18"/><line x1="91" y1="58.4" x2="132.2" y2="58.4" stroke="#000" stroke-width="0.18"/><text x="92" y="57.6" font-size="2.5" fill="#000">инженерная доска дуб на клею</text></g></g><g data-el="legend"><text x="25" y="224.5" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><g><rect x="25" y="228" width="8" height="3.6" fill="url(#h-concrete)" stroke="#000" stroke-width="0.25"/></g><text x="35" y="230.8" font-size="2.5" fill="#000">железобетон (плита, стены)</text><g><rect x="91" y="228" width="8" height="3.6" fill="url(#h-screed)" stroke="#000" 
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-sheet="spec" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Спецификация материалов (окончание)</text><text x="25" y="17.8" font-size="2.5" fill="#333">Отделочные материалы: чистое количество, запас, упаковка, к заказу · ГОСТ 21.110-2013</text><g data-el="spec"><text x="25" y="24.8" font-size="3.5" font-weight="700" fill="#000">Спецификация материалов (ГОСТ 21.110-2013, форма 1) (продолжение)</text><rect x="25" y="59.8" width="385" height="6" fill="#f0f0f0" stroke="none"/><rect x="25" y="27" width="385" height="57.6" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="41" x2="410" y2="41" stroke="#000" stroke-width="0.5"/><line x1="233" y1="32" x2="295" y2="32" stroke="#000" stroke-width="0.25"/><text x="264" y="30.6" font-size="2.5" text-anchor="middle" fill="#000">Количество</text><text x="29" y="34.9" font-size="2.5" text-anchor="middle" fill="#000">Поз.</text><line x1="33" y1="27" x2="33" y2="41" stroke="#000" stroke-width="0.25"/><text x="81" y="34.9" font-size="2.5" text-anchor="middle" fill="#000">Наименование и техническая характеристика</text><line x1="129" y1="27" x2="129" y2="41" stroke="#000" stroke-width="0.25"/><text x="162" y="34.9" font-size="2.5" text-anchor="middle" fill="#000">Тип, марка, артикул</text><line x1="195" y1="27" x2="195" y2="41" stroke="#000" stroke-width="0.25"/><text x="201.5" y="33.4" font-size="2.5" text-anchor="middle" fill="#000">Код</text><text x="201.5" y="36.4" font-size="2.5" text-anchor="middle" fill="#000">продукции</text><line x1="208" y1="27" x2="208" y2="41" stroke="#000" stroke-width="0.25"/><text x="216" y="34.9" font-size="2.5" text-anchor="middle" fill="#000">Поставщик</text><line x1="224" y1="27" x2="224" y2="41" stroke="#000" stroke-width="0.25"/><text x="228.5" y="33.4" font-size="2.5" text-anchor="middle" fill="#000">Ед.</text><text x="228.5" y="36.4" font-size="2.5" text-anchor="middle" fill="#000">изм.</text><line x1="233" y1="27" x2="233" y2="41" stroke="#000" stroke-width="0.25"/><text x="240.5" y="37.4" font-size="2.5" text-anchor="middle" fill="#000">чистое</text><line x1="248" y1="32" x2="248" y2="41" stroke="#000" stroke-width="0.25"/><text x="253" y="35.9" font-size="2.5" text-anchor="middle" fill="#000">запас,</text><text x="253" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">%</text><line x1="258" y1="32" x2="258" y2="41" stroke="#000" stroke-width="0.25"/><text x="268" y="37.4" font-size="2.5" text-anchor="middle" fill="#000">упаковка</text><line x1="278" y1="32" x2="278" y2="41" stroke="#000" stroke-width="0.25"/><text x="286.5" y="37.4" font-size="2.5" text-anchor="middle" fill="#000">к заказу</text><line x1="295" y1="27" x2="295" y2="41" stroke="#000" stroke-width="0.25"/><text x="300.5" y="33.4" font-size="2.5" text-anchor="middle" fill="#000">Масса</text><text x="300.5" y="36.4" font-size="2.5" text-anchor="middle" fill="#000">ед., кг</text><line x1="306" y1="27" x2="306" y2="41" stroke="#000" stroke-width="0.25"/><text x="358" y="34.9" font-size="2.5" text-anchor="middle" fill="#000">Примечание</text><line x1="33" y1="41" x2="33" y2="50.4" stroke="#000" stroke-width="0.25"/><line x1="129" y1="41" x2="129" y2="50.4" stroke="#000" stroke-width="0.25"/><line x1="195" y1="41" x2="195" y2="50.4" stroke="#000" stroke-width="0.25"/><line x1="208" y1="41" x2="208" y2="50.4" stroke="#000" stroke-width="0.25"/><line x1="224" y1="41" x2="224" y2="50.4" stroke="#000" stroke-width="0.25"/><line x1="233" y1="41" x2="233" y2="50.4" stroke="#000" stroke-width="0.25"/><line x1="248" y1="41" x2="248" y2="50.4" stroke="#000" stroke-width="0.25"/><line x1="258" y1="41" x2="258" y2="50.4" stroke="#000" stroke-width="0.25"/><line x1="278" y1="41" x2="278" y2="50.4" stroke="#000" stroke-width="0.25"/><line x1="295" y1="41" x2="295" y2="50.4" stroke="#000" stroke-width="0.25"/><line x1="306" y1="41" x2="306" y2="50.4" stroke="#000" stroke-width="0.25"/><g data-el="spec-row" data-row="22" data-q="1.09" data-net="1.09" data-res="0.15" data-ordbase="1.25"><text x="29" y="45.1" font-size="2.5" text-anchor="middle" fill="#000">22</text><text x="34.4" y="45.1" font-size="2.5" text-anchor="start" fill="#000">Керамогранит на плинтус: полосы h=80 мм из плитки пола, кромка с</text><text x="34.4" y="48.5" font-size="2.5" text-anchor="start" fill="#000">запилом 45°</text><text x="130.4" y="45.1" font-size="2.5" text-anchor="start" fill="#000">аналог: плинтус из керамогранита пола,</text><text x="130.4" y="48.5" font-size="2.5" text-anchor="start" fill="#000">подрезка 80 мм, верхняя кромка с запилом 45°</text><text x="201.5" y="45.1" font-size="2.5" text-anchor="middle" fill="#000"></text><text x="216" y="45.1" font-size="2.5" text-anchor="middle" fill="#000"></text><text x="228.5" y="45.1" font-size="2.5" text-anchor="middle" fill="#000">м²</text><text x="246.6" y="45.1" font-size="2.5" text-anchor="end" fill="#000">1,09</text><text x="256.6" y="45.1" font-size="2.5" text-anchor="end" fill="#000">15</text><text x="259.4" y="45.1" font-size="2.5" text-anchor="start" fill="#000">из партии</text><text x="259.4" y="48.5" font-size="2.5" text-anchor="start" fill="#000">пола</text><text x="293.6" y="45.1" font-size="2.5" text-anchor="end" fill="#000">1,25 м²</text><text x="304.6" y="45.1" font-size="2.5" text-anchor="end" fill="#000"></text><text x="307.4" y="45.1" font-size="2.5" text-anchor="start" fill="#000">13,57 м.п. × 0,08 м; пом. 12, 13; заказывать целыми плитками одной партии</text><text x="307.4" y="48.5" font-size="2.5" text-anchor="start" fill="#000">с полом, число плиток — по раскладке плиточника; л. 34, 36–38</text></g><line x1="25" y1="50.4" x2="410" y2="50.4" stroke="#000" stroke-width="0.18"/><line x1="33" y1="50.4" x2="33" y2="59.8" stroke="#000" stroke-width="0.25"/><line x1="129" y1="50.4" x2="129" y2="59.8" stroke="#000" stroke-width="0.25"/><line x1="195" y1="50.4" x2="195" y2="59.8" stroke="#000" stroke-width="0.25"/><line x1="208" y1="50.4" x2="208" y2="59.8" stroke="#000" stroke-width="0.25"/><line x1="224" y1="50.4" x2="224" y2="59.8" stroke="#000" stroke-width="0.25"/><line x1="233" y1="50.4" x2="233" y2="59.8" stroke="#000" stroke-width="0.25"/><line x1="248" y1="50.4" x2="248" y2="59.8" stroke="#000" stroke-width="0.25"/><line x1="258" y1="50.4" x2="258" y2="59.8" stroke="#000" stroke-width="0.25"/><line x1="278" y1="50.4" x2="278" y2="59.8" stroke="#000" stroke-width="0.25"/><line x1="295" y1="50.4" x2="295" y2="59.8" stroke="#000" stroke-width="0.25"/><line x1="306" y1="50.4" x2="306" y2="59.8" stroke="#000" stroke-width="0.25"/><g data-el="spec-row" data-row="23" data-q="94.15" data-net="94.15" data-res="0" data-ordbase=""><text x="29" y="54.5" font-size="2.5" text-anchor="middle" fill="#000">23</text><text x="34.4" y="54.5" font-size="2.5" text-anchor="start" fill="#000">Потолок подвесной ГКЛ/ГКЛВ по каркасу Knauf П113: листы, профили,</text><text x="34.4" y="57.9" font-size="2.5" text-anchor="start" fill="#000">подвесы, лента, шпаклёвка швов</text><text x="130.4" y="54.5" font-size="2.5" text-anchor="start" fill="#000">Knauf П113</text><text x="201.5" y="54.5" font-size="2.5" text-anchor="middle" fill="#000"></text><text x="216" y="54.5" font-size="2.5" text-anchor="middle" fill="#000"></text><text x="228.5" y="54.5" font-size="2.5" text-anchor="middle" fill="#000">м²</text><text x="246.6" y="54.5" font-size="2.5" text-anchor="end" fill="#000">94,15</text><text x="256.6" y="54.5" font-size="2.5" text-anchor="end" fill="#000"></text><text x="259.4" y="54.5" font-size="2.5" text-anchor="start" fill="#000">комплект</text><text x="293.6" y="54.5" font-size="2.5" text-anchor="end" fill="#000">по л.</text><text x="293.6" y="57.9" font-size="2.5" text-anchor="end" fill="#000">потолков</text><text x="304.6" y="54.5" font-size="2.5" text-anchor="end" fill="#000"></text><text x="307.4" y="54.5" font-size="2.5" text-anchor="start" fill="#000">состав и расход — по спецификации гипсокартонщика; л. 28, 29</text></g><line x1="25" y1="59.8" x2="410" y2="59.8" stroke="#000" stroke-width="0.25"/><text x="26.4" y="63.9" font-size="2.5" font-weight="700" fill="#000">Инженерные изделия</text><line x1="25" y1="65.8" x2="410" y2="65.8" stroke="#000" stroke-width="0.25"/><line x1="33" y1="65.8" x2="33" y2="75.2" stroke="#000" stroke-width="0.25"/><line x1="129" y1="65.8" x2="129" y2="75.2" stroke="#000" stroke-width="0.25"/><line x1="195" y1="65.8" x2="195" y2="75.2" stroke="#000" stroke-width="0.25"/><line x1="208" y1="65.8" x2="208" y2="75.2" stroke="#000" stroke-width="0.25"/><line x1="224" y1="65.8" x2="224" y2="75.2" stroke="#000" stroke-width="0.25"/><line x1="233" y1="65.8" x2="233" y2="75.2" stroke="#000" stroke-width="0.25"/><line x1="248" y1="65.8" x2="248" y2="75.2" stroke="#000" stroke-width="0.25"/><line x1="258" y1="65.8" x2="258" y2="75.2" stroke="#000" stroke-width="0.25"/><line x1="278" y1="65.8" x2="278" y2="75.2" stroke="#000" stroke-width="0.25"/><line x1="295" y1="65.8" x2="295" y2="75.2" stroke="#000" stroke-width="0.25"/><line x1="306" y1="65.8" x2="306" y2="75.2" stroke="#000" stroke-width="0.25"/><g data-el="spec-row" data-row="24" data-q="1.67" data-net="1.67" data-res="0" data-ordbase=""><text x="29" y="69.9" font-size="2.5" text-anchor="middle" fill="#000">24</text><text x="34.4" y="69.9" font-size="2.5" text-anchor="start" fill="#000">Мат нагревательный электрический для тёплого пола под плитку, с</text><text x="34.4" y="73.3" font-size="2.5" text-anchor="start" fill="#000">холодным концом и муфтой</text><text x="130.4" y="69.9" font-size="2.5" text-anchor="start" fill="#000">по выбору подрядчика (мощность — по контурам)</text><text x="201.5" y="69.9" font-size="2.5" text-anchor="middle" fill="#000"></text><text x="216" y="69.9" font-size="2.5" text-anchor="middle" fill="#000"></text><text x="228.5" y="69.9" font-size="2.5" text-anchor="middle" fill="#000">м²</text><text x="246.6" y="69.9" font-size="2.5" text-anchor="end" fill="#000">1,67</text><text x="256.6" y="69.9" font-size="2.5" text-anchor="end" fill="#000"></text><text x="259.4" y="69.9" font-size="2.5" text-anchor="start" fill="#000">мат по</text><text x="259.4" y="73.3" font-size="2.5" text-anchor="start" fill="#000">контуру</text><text x="293.6" y="69.9" font-size="2.5" text-anchor="end" fill="#000">по</text><text x="293.6" y="73.3" font-size="2.5" text-anchor="end" fill="#000">контурам</text><text x="304.6" y="69.9" font-size="2.5" text-anchor="end" fill="#000"></text><text x="307.4" y="69.9" font-size="2.5" text-anchor="start" fill="#000">пом. 2: 1,37 м², 205 Вт; пом. 10: 0,30 м², 50 Вт; типоразмер мата</text><text x="307.4" y="73.3" font-size="2.5" text-anchor="start" fill="#000">подбирается под контур — нагревательную жилу резать нельзя; л. 15, 34</text></g><line x1="25" y1="75.2" x2="410" y2="75.2" stroke="#000" stroke-width="0.18"/><line x1="33" y1="75.2" x2="33" y2="84.6" stroke="#000" stroke-width="0.25"/><line x1="129" y1="75.2" x2="129" y2="84.6" stroke="#000" stroke-width="0.25"/><line x1="195" y1="75.2" x2="195" y2="84.6" stroke="#000" stroke-width="0.25"/><line x1="208" y1="75.2" x2="208" y2="84.6" stroke="#000" stroke-width="0.25"/><line x1="224" y1="75.2" x2="224" y2="84.6" stroke="#000" stroke-width="0.25"/><line x1="233" y1="75.2" x2="233" y2="84.6" stroke="#000" stroke-width="0.25"/><line x1="248" y1="75.2" x2="248" y2="84.6" stroke="#000" stroke-width="0.25"/><line x1="258" y1="75.2" x2="258" y2="84.6" stroke="#000" stroke-width="0.25"/><line x1="278" y1="75.2" x2="278" y2="84.6" stroke="#000" stroke-width="0.25"/><line x1="295" y1="75.2" x2="295" y2="84.6" stroke="#000" stroke-width="0.25"/><line x1="306" y1="75.2" x2="306" y2="84.6" stroke="#000" stroke-width="0.25"/><g data-el="spec-row" data-row="25" data-q="2" data-net="2" data-res="0" data-ordbase="2"><text x="29" y="79.3" font-size="2.5" text-anchor="middle" fill="#000">25</text><text x="34.4" y="79.3" font-size="2.5" text-anchor="start" fill="#000">Терморегулятор тёплого пола с выносным датчиком пола, монтаж в</text><text x="34.4" y="82.7" font-size="2.5" text-anchor="start" fill="#000">подрозетник</text><text x="130.4" y="79.3" font-size="2.5" text-anchor="start" fill="#000">по выбору подрядчика</text><text x="201.5" y="79.3" font-size="2.5" text-anchor="middle" fill="#000"></text><text x="216" y="79.3" font-size="2.5" text-anchor="middle" fill="#000"></text><text x="228.5" y="79.3" font-size="2.5" text-anchor="middle" fill="#000">шт</text><text x="246.6" y="79.3" font-size="2.5" text-anchor="end" fill="#000">2</text><text x="256.6" y="79.3" font-size="2.5" text-anchor="end" fill="#000"></text><text x="259.4" y="79.3" font-size="2.5" text-anchor="start" fill="#000">шт</text><text x="293.6" y="79.3" font-size="2.5" text-anchor="end" fill="#000">2 шт</text><text x="304.6" y="79.3" font-size="2.5" text-anchor="end" fill="#000"></text><text x="307.4" y="79.3" font-size="2.5" text-anchor="start" fill="#000">датчик — в гофротрубе с доступом для замены; по одному на контур; л. 15</text></g></g><g data-el="notes"><text x="25" y="91.6" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="96.6" font-size="2.5" fill="#000">1. Чистое количество — из ведомости объёмов работ и раскладки плитки; запас — отдельной графой (доска — по ведомости отделки, плитка, краска и</text><text x="28" y="100.1" font-size="2.5" fill="#000">плинтус — 10 %); «к заказу» — с запасом и кратно упаковке.</text><text x="25" y="103.6" font-size="2.5" fill="#000">2. Плитка — штуками по раскладке, запас на каждую поверхность. Калибр (рабочий размер) и тон — одной партией на помещение, калибр указать при</text><text x="28" y="107.1" font-size="2.5" fill="#000">заказе и сверить с раскладкой до укладки.</text><text x="25" y="110.6" font-size="2.5" fill="#000">3. Краска — 0,12 л/м² на слой (середина вилки 0,10–0,15 л/м²) по фактической площади окраски из ведомости отделки; колеровка одной партией.</text><text x="25" y="114.1" font-size="2.5" fill="#000">4. «По ТУ» — расход задаёт производитель выбранного продукта; количество к заказу — после выбора марки.</text><text x="25" y="117.6" font-size="2.5" fill="#000">5. Поз. 1, 4, 6, 21, 22 заданы характеристиками («аналог:»): марку, артикул и поставщика согласовать с заказчиком до закупки, без артикула не</text><text x="28" y="121.1" font-size="2.5" fill="#000">заказывать.</text><text x="25" y="124.6" font-size="2.5" fill="#000">6. Каркас и обшивка потолков — по спецификации плана потолков; сантехника, светильники и мебель — по своим спецификациям.</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-
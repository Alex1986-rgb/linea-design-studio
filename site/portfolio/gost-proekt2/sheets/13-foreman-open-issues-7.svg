<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Открытые вопросы, принятые допущения и конфликты. Лист 7 из 7" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты. Лист 7 из 7</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации (стартовое совещание 04.10.2026)</text><g data-el="open-issues" data-plan="fixed" data-plan-declared="7"><g data-el="issues-changes"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Изменения проекта после выпуска листов (реестр изменений) (продолжение)</text><rect x="25" y="33" width="385" height="101.8" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="32" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="33" x2="39" y2="134.8" stroke="#000" stroke-width="0.25"/><text x="50" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><line x1="61" y1="33" x2="61" y2="134.8" stroke="#000" stroke-width="0.25"/><text x="91" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><line x1="121" y1="33" x2="121" y2="134.8" stroke="#000" stroke-width="0.25"/><text x="171" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Было</text><line x1="221" y1="33" x2="221" y2="134.8" stroke="#000" stroke-width="0.25"/><text x="283.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Стало</text><line x1="346" y1="33" x2="346" y2="134.8" stroke="#000" stroke-width="0.25"/><text x="378" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Кто решил, подпись</text><g data-el="issue-row" data-kind="change" data-id="ИЗ-20"><text x="32" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-20</text><text x="40.5" y="46.7" font-size="2.5" fill="#000">30.10.2026</text><text x="62.5" y="46.7" font-size="2.5" fill="#000">л. 30 — План дверей и ведомость заполнения</text><text x="62.5" y="50.1" font-size="2.5" fill="#000">проёмов</text><text x="62.5" y="53.5" font-size="2.5" fill="#000">л. 131 — Развёртки стен А, Б.</text><text x="62.5" y="56.9" font-size="2.5" fill="#000">Прихожая-коридор (пом. 7)</text><text x="62.5" y="60.3" font-size="2.5" fill="#000">л. 32 — План расстановки мебели</text><text x="122.5" y="46.7" font-size="2.5" fill="#000">Проём коридор → прихожая-коридор (стена В коридора, смещение 500)</text><text x="122.5" y="50.1" font-size="2.5" fill="#000">выходил за общую стену: на развёртке стены А прихожей видны 770 из 900</text><text x="122.5" y="53.5" font-size="2.5" fill="#000">мм. Шкаф-купе М29 (1700) заканчивался в 60 мм от проёма двери детской 2.</text><text x="222.5" y="46.7" font-size="2.5" fill="#000">Проём — смещение 300 (целиком в общей стене, знак «*»: положение со скана, К-21). М29 — 1600</text><text x="222.5" y="50.1" font-size="2.5" fill="#000">мм, зазор до проёма 160 мм под наличник. Вход в гостиную — вопрос К-31 с заданием на</text><text x="222.5" y="53.5" font-size="2.5" fill="#000">обследование.</text><text x="347.5" y="46.7" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 12.11.2026.</text><text x="347.5" y="50.1" font-size="2.5" fill="#000">Предложил: исполнитель.</text></g><line x1="25" y1="63.4" x2="410" y2="63.4" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-21"><text x="32" y="67.1" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-21</text><text x="40.5" y="67.1" font-size="2.5" fill="#000">10.11.2026</text><text x="62.5" y="67.1" font-size="2.5" fill="#000">л. 32 — План расстановки мебели</text><text x="122.5" y="67.1" font-size="2.5" fill="#000">Стеллаж М38 («Детская 2») без знака предложения, при этом открыта запись</text><text x="122.5" y="70.5" font-size="2.5" fill="#000">К-31, называющая его: на стене Б возможен проём в гостиную, расстановка</text><text x="122.5" y="73.9" font-size="2.5" fill="#000">детской 2 при этом пересматривается.</text><text x="222.5" y="67.1" font-size="2.5" fill="#000">Стеллажу М38 возвращён знак предложения (ссылки ИЗ-1 и К-31); положение (стена Б, смещение</text><text x="222.5" y="70.5" font-size="2.5" fill="#000">120) и размер 1200 × 2100 не менялись. Запись К-31 не закрывалась: закрывает её автор после</text><text x="222.5" y="73.9" font-size="2.5" fill="#000">обследования входа в гостиную. Подпись автора в ИЗ-1 не тронута.</text><text x="347.5" y="67.1" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 12.11.2026.</text><text x="347.5" y="70.5" font-size="2.5" fill="#000">Предложил: исполнитель.</text></g><line x1="25" y1="77" x2="410" y2="77" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-22"><text x="32" y="80.7" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-22</text><text x="40.5" y="80.7" font-size="2.5" fill="#000">12.11.2026</text><text x="62.5" y="80.7" font-size="2.5" fill="#000">л. 78 — План текстиля и декора</text><text x="62.5" y="84.1" font-size="2.5" fill="#000">л. 80 — Ведомость текстиля</text><text x="62.5" y="87.5" font-size="2.5" fill="#000">л. 82 — Ведомость декора</text><text x="62.5" y="90.9" font-size="2.5" fill="#000">л. 32 — План расстановки мебели</text><text x="122.5" y="80.7" font-size="2.5" fill="#000">Разбор двух критиков по кадрам: «стерильный шоурум, жизни нет»; кухня</text><text x="122.5" y="84.1" font-size="2.5" fill="#000">остров без единого предмета и без стульев; ванна П1 в кадре без смесителя. У</text><text x="122.5" y="87.5" font-size="2.5" fill="#000">мебели зала М1, М5, М6 записана латунь, а металл квартиры — чёрный.</text><text x="122.5" y="90.9" font-size="2.5" fill="#000">«Шкаф распашной, 3 секции» М16 (1800) на листе изделия чертится с 4</text><text x="122.5" y="94.3" font-size="2.5" fill="#000">фасадами, «Шкаф-купе, 3 двери» М29 (1600) — с 2 дверями: чертёж и кадр</text><text x="122.5" y="97.7" font-size="2.5" fill="#000">расходились. Санузлы без текстиля и предметов, в коридоре голая стена.</text><text x="222.5" y="80.7" font-size="2.5" fill="#000">Ванна П1 — «акриловая 1700×750, смеситель настенный термостатический». М1, М5, М6</text><text x="222.5" y="84.1" font-size="2.5" fill="#000">металл чёрный. М16 — «4 створки», М29 — «2 двери» (как на листах изделий; «Комод, 4 ящика»</text><text x="222.5" y="87.5" font-size="2.5" fill="#000">М17, «Консоль, 3 ящика» М31, «4 секции» М35 с данными и листами сходятся). Ванная: банные и</text><text x="222.5" y="90.9" font-size="2.5" fill="#000">ручные полотенца на полотенцесушителе П5 (Т24, Т25), коврик 800×450 у бортика ванны (Т26; вне</text><text x="222.5" y="94.3" font-size="2.5" fill="#000">полотна двери), ваза и свеча с диффузором на полке короба инсталляции (ДК22, ДК23). Санузел:</text><text x="222.5" y="97.7" font-size="2.5" fill="#000">ваза с сухоцветом на полке короба (ДК24). Прихожая-коридор: керамика на консоли М31 под</text><text x="222.5" y="101.1" font-size="2.5" fill="#000">зеркалом (ДК25), линогравюра 400×560 на стене В справа от банкетки М30 (ДК26). Коридор: диптих</text><text x="222.5" y="104.5" font-size="2.5" fill="#000">2 × 500×700 на стене В напротив шкафа М19 (ДК27, ДК28; проход 980 мм — только настенный</text><text x="222.5" y="107.9" font-size="2.5" fill="#000">декор). Зал: книги и свеча на журнальном столе (ДК29), керамика на буфете (ДК30), ваза на</text><text x="222.5" y="111.3" font-size="2.5" fill="#000">обеденном столе (ДК31); подушек на диване 4 (Т4: 3 → 2). Детская 1: рабочая лампа на столе М14</text><text x="222.5" y="114.7" font-size="2.5" fill="#000">(ДК32), книги на тумбе М12 (ДК33), керамика на комоде М17 (ДК34). Детская 2: рабочая лампа на</text><text x="222.5" y="118.1" font-size="2.5" fill="#000">столе М36 (ДК35). Кухня: два полубарных стула у тыльной стороны острова М27 (М44, М45; за</text><text x="222.5" y="121.5" font-size="2.5" fill="#000">стульями до стены 865 мм, дверь на балкон и пенал М28 свободны), керамика на острове и на</text><text x="222.5" y="124.9" font-size="2.5" fill="#000">столешнице (ДК36, ДК37). Гостиная (поз. 12) не дополнялась: мебели в модели нет, расстановка</text><text x="222.5" y="128.3" font-size="2.5" fill="#000">ждёт решения заказчика. Цвета — из палитры проекта: Silhouette L481, Claystone V486, Paper F497,</text><text x="222.5" y="131.7" font-size="2.5" fill="#000">серо-петроль S 5010-B10G, Green Smoke. Знак «**» у позиций до подписи автора.</text><text x="347.5" y="80.7" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="84.1" font-size="2.5" fill="#000">исполнителя; предложение проектировщика, на</text><text x="347.5" y="87.5" font-size="2.5" fill="#000">утверждение А. С. Кырлана</text></g></g><g data-el="issues-roles"><text x="25" y="147.2" font-size="3.5" font-weight="700" fill="#000">Разделы, не сданные к выпуску (сводка ролей)</text><rect x="25" y="149.8" width="385" height="20.2" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="159.8" x2="410" y2="159.8" stroke="#000" stroke-width="0.5"/><text x="32" y="155.7" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="149.8" x2="39" y2="170" stroke="#000" stroke-width="0.25"/><text x="84" y="155.7" font-size="2.5" text-anchor="middle" fill="#000">Раздел</text><line x1="129" y1="149.8" x2="129" y2="170" stroke="#000" stroke-width="0.25"/><text x="147" y="155.7" font-size="2.5" text-anchor="middle" fill="#000">Состояние</text><line x1="165" y1="149.8" x2="165" y2="170" stroke="#000" stroke-width="0.25"/><text x="287.5" y="155.7" font-size="2.5" text-anchor="middle" fill="#000">Причина</text><g data-el="issue-row" data-kind="role" data-id="lowcurrent-engineer"><text x="32" y="163.5" font-size="2.5" text-anchor="middle" fill="#000">1</text><text x="40.5" y="163.5" font-size="2.5" fill="#000">Инженер слаботочки и умного дома</text><text x="130.5" y="163.5" font-size="2.5" fill="#000">Не сдан</text><text x="166.5" y="163.5" font-size="2.5" fill="#000">слаботочка входит в состав заказа (ИЗ-16); выпущен лист «План слаботочных сетей» (раздел электрика); отдельная ведомость слаботочки — кабельный журнал, состав слаботочного щита — не</text><text x="166.5" y="166.9" font-size="2.5" fill="#000">выпущена</text></g></g><g data-el="notes"><text x="25" y="182.4" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="187.2" font-size="2.5" fill="#000">1. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text><text x="25" y="190.6" font-size="2.5" fill="#000">2. Графа «Если решения нет» показывает состояние решения на листах; влияние на сроки и стоимость по пунктам не оценивалось.</text><text x="25" y="194" font-size="2.5" fill="#000">3. Пункт, по которому принято решение, при следующем выпуске комплекта из таблиц исключается.</text></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">13.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="251" y="275.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="275.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">13.11.26</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-004-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Четырёхкомнатная квартира</text><text x="297" y="259.2" font-size="2.5" textLength="96.71" lengthAdjust="spacingAndGlyphs" data-fit="116" fill="#000">Общая площадь 102,67* м² · * размеры со скана, не замерены (реестр — л. 7–13, ИЗ-8, К-20, К-21)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="268.7" font-size="2.5" data-fit="66" fill="#000">Дизайн-проект интерьера четырёхкомнатной</text><text x="297" y="272.5" font-size="2.5" data-fit="66" fill="#000">квартиры</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">13</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">161</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="283.1" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">Открытые вопросы, принятые допущения и</text><text x="330" y="286.9" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">конфликты. Лист 7 из 7</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="47" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="30" data-positions="103" data-basis="5"><rect x="313.01" y="6.2" width="100.49" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="315.01" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 30 (реестр — л. 7–13)</text></g></svg>
25"/><text x="39" y="231.9" font-size="2.5" fill="#000">деталь в разрезе</text><g data-el="mark"><circle cx="30.25" cy="237.9" r="3" fill="#fff" stroke="#000" stroke-width="0.25"/><text x="30.25" y="238.8" font-size="2.5" text-anchor="middle" fill="#000">К1</text></g><text x="39" y="238.4" font-size="2.5" fill="#000">марка модуля</text><circle cx="30.25" cy="245.1" r="1.5" fill="#fff" stroke="#000" stroke-width="0.35"/><path d="M 28.75 245.1 L 31.75 245.1" fill="none" stroke="#000" stroke-width="0.25"/><text x="39" y="244.9" font-size="2.5" fill="#000">розетка на стене</text><circle cx="30.25" cy="250.9" r="1.3" fill="#fff" stroke="#000" stroke-width="0.35"/><circle cx="30.25" cy="250.9" r="0.45" fill="#000"/><text x="39" y="251.4" font-size="2.5" fill="#000">вывод кабеля к технике</text><circle cx="30.25" cy="257.4" r="1.1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/><text x="32.2" y="258.3" font-size="2.5" fill="#1f5fbf">В1</text><text x="39" y="257.9" font-size="2.5" fill="#000">вывод воды, канализации</text></g><g data-el="notes"><text x="135" y="192" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="135" y="197" font-size="2.5" fill="#000">1. Размеры — в мм по чистовой отделке, вид из помещения; марки — как на плане расстановки. Перед раскроем — контрольный замер</text><text x="135" y="200.6" font-size="2.5" fill="#000">цеха после фартука и пола.</text><text x="135" y="204.2" font-size="2.5" fill="#000">2. Корпуса — ЛДСП 16 мм, задняя стенка ХДФ 4 мм; фасады — МДФ, эмаль матовая 18 мм, цвет по колерной карте; столешница 38 мм,</text><text x="135" y="207.8" font-size="2.5" fill="#000">свес 20 мм; цоколь 100 мм.</text><text x="135" y="211.4" font-size="2.5" fill="#000">3. Кромка: скрытые торцы 0,4 мм, видимые 2 мм. Номинальные зазоры: между фасадами 3 мм, фасад — столешница 3 мм, фасад — стена</text><text x="135" y="215" font-size="2.5" fill="#000">не менее 3 мм.</text><text x="135" y="218.6" font-size="2.5" fill="#000">4. Ящики полного выдвижения и петли — с доводчиком; присадка по 32-й системе — выполняет цех.</text><text x="135" y="222.2" font-size="2.5" fill="#000">5. Ниши техники — по монтажным схемам выбранных моделей: решётка в цоколе и канал за пеналом холодильника, зазор за духовым</text><text x="135" y="225.8" font-size="2.5" fill="#000">шкафом, фасад ПММ на двери машины.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="75" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="75" y1="285.5" x2="75" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="77" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" 
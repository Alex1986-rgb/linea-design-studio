<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">График закупок и работ. Лист 3 из 3</text><text x="25" y="17.8" font-size="2.5" fill="#333">Что заказывать и когда не раньше чего: относительный порядок без дат; срок поставки — из данных или «уточняется у поставщика»</text><g data-el="proc-schedule" data-plan="fixed" data-plan-declared="3"><g data-el="proc-work"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Работы: порядок и что не даёт начать (продолжение)</text><rect x="25" y="33" width="385" height="107.6" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="31" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="37" y1="33" x2="37" y2="140.6" stroke="#000" stroke-width="0.25"/><text x="83" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Работа (стадия технологической последовательности)</text><line x1="129" y1="33" x2="129" y2="140.6" stroke="#000" stroke-width="0.25"/><text x="149" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">После</text><line x1="169" y1="33" x2="169" y2="140.6" stroke="#000" stroke-width="0.25"/><text x="233" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Что должно быть к началу: условия и закупки</text><line x1="297" y1="33" x2="297" y2="140.6" stroke="#000" stroke-width="0.25"/><text x="353.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Не начинать, пока открыто в реестре</text><g data-el="work-row" data-id="Р-11" data-key="paint" data-after="Р-10"><text x="31" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">Р-11</text><text x="38.5" y="46.7" font-size="2.5" fill="#000">Окраска стен, потолков, откосов (стадия 13)</text><text x="130.5" y="46.7" font-size="2.5" fill="#000">Р-10</text><text x="170.5" y="46.7" font-size="2.5" fill="#000">до начала: шпаклёвка отшлифована и огрунтована; выкрасы утверждены, колеровка одной партией</text><text x="298.5" y="46.7" font-size="2.5" fill="#000"></text></g><line x1="25" y1="51" x2="410" y2="51" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-12" data-key="floor" data-after="Р-9 Р-11"><text x="31" y="54.7" font-size="2.5" text-anchor="middle" fill="#000">Р-12</text><text x="38.5" y="54.7" font-size="2.5" fill="#000">Чистовые полы: инженерная доска (стадия 14)</text><text x="130.5" y="54.7" font-size="2.5" fill="#000">Р-9, Р-11</text><text x="170.5" y="54.7" font-size="2.5" fill="#000">до начала: влажность основания в норме, мокрые работы закончены; доска выбрана и привезена</text><text x="170.5" y="58.1" font-size="2.5" fill="#000">Закупки к началу: З-6 (доска и плинтус)</text><text x="298.5" y="54.7" font-size="2.5" fill="#000">К-26: Артикулы изделий отделки не выбраны.</text></g><line x1="25" y1="61.2" x2="410" y2="61.2" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-13" data-key="doors" data-after="Р-11 Р-12"><text x="31" y="64.9" font-size="2.5" text-anchor="middle" fill="#000">Р-13</text><text x="38.5" y="64.9" font-size="2.5" fill="#000">Полотна межкомнатных дверей, плинтусы, пороги (стадия 15)</text><text x="130.5" y="64.9" font-size="2.5" fill="#000">Р-11, Р-12</text><text x="170.5" y="64.9" font-size="2.5" fill="#000">до начала: чистовой пол уложен; полотна скрытых дверей — после чистовой отделки стен</text><text x="298.5" y="64.9" font-size="2.5" fill="#000"></text></g><line x1="25" y1="69.2" x2="410" y2="69.2" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-14" data-key="finel" data-after="Р-11 Р-13"><text x="31" y="72.9" font-size="2.5" text-anchor="middle" fill="#000">Р-14</text><text x="38.5" y="72.9" font-size="2.5" fill="#000">Чистовая электрика и сантехника: механизмы, светильники, смесители,</text><text x="38.5" y="76.3" font-size="2.5" fill="#000">приборы (стадия 16)</text><text x="130.5" y="72.9" font-size="2.5" fill="#000">Р-11, Р-13</text><text x="170.5" y="72.9" font-size="2.5" fill="#000">до начала: отделка готова; механизмы, светильники и приборы выбраны и привезены</text><text x="298.5" y="72.9" font-size="2.5" fill="#000"></text></g><line x1="25" y1="79.4" x2="410" y2="79.4" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-15" data-key="kitchen" data-after="Р-13 Р-14"><text x="31" y="83.1" font-size="2.5" text-anchor="middle" fill="#000">Р-15</text><text x="38.5" y="83.1" font-size="2.5" fill="#000">Кухня, встроенная и корпусная мебель, бытовая техника (стадия 17)</text><text x="130.5" y="83.1" font-size="2.5" fill="#000">Р-13, Р-14</text><text x="170.5" y="83.1" font-size="2.5" fill="#000">до начала: чистовая сантехника и электрика подведены к местам мебели; замер кухни снят по</text><text x="170.5" y="86.5" font-size="2.5" fill="#000">готовым стенам (после штукатурки или плитки, до чистового пола)</text><text x="170.5" y="89.9" font-size="2.5" fill="#000">Закупки к началу: З-1 (кухонный гарнитур), З-2 (техника кухни), З-7 (мебель по замеру)</text><text x="298.5" y="83.1" font-size="2.5" fill="#000">К-4: Гостиная (поз.</text><text x="298.5" y="86.5" font-size="2.5" fill="#000" textLength="83.71" lengthAdjust="spacingAndGlyphs">К-13: Детская 2: рабочий стол М36* у стены Б получает боковой свет от окна справа от</text><text x="298.5" y="89.9" font-size="2.5" fill="#000">сидящего; для правши лучше свет слева — подтвердить, кто сидит за столом (правша</text><text x="298.5" y="93.3" font-size="2.5" fill="#000">или левша), иначе решить зеркальной расстановкой (нужен перенос двери) либо второй</text><text x="298.5" y="96.7" font-size="2.5" fill="#000">лампой слева.</text><text x="298.5" y="100.1" font-size="2.5" fill="#000">К-18: Вытяжка М25 встроена в навесной модуль на отметке 1550 мм: её низ над</text><text x="298.5" y="103.5" font-size="2.5" fill="#000">электрической варочной панелью 610 мм, а фартук 650 мм при практике 450–600 мм.</text><text x="298.5" y="106.9" font-size="2.5" fill="#000">К-20: Наружные скошенные стены (в натуре под 45°) заменены на планах ступенями:</text><text x="298.5" y="110.3" font-size="2.5" fill="#000">движок описывает только ортогональную геометрию.</text><text x="298.5" y="113.7" font-size="2.5" fill="#000">К-21: Все размеры сняты с размерных цепочек растрового скана заказчика, контрольного</text><text x="298.5" y="117.1" font-size="2.5" fill="#000">обмера нет.</text><text x="298.5" y="120.5" font-size="2.5" fill="#000">К-27: Модели встраиваемой техники кухни не выбраны: холодильник (М20), духовой шкаф</text><text x="298.5" y="123.9" font-size="2.5" fill="#000">(М22) и посудомоечная машина (М27) заданы описанием «аналог по характеристикам»</text><text x="298.5" y="127.3" font-size="2.5" fill="#000">— без производителя, серии и кода.</text></g><line x1="25" y1="130.4" x2="410" y2="130.4" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-16" data-key="accept" data-after="Р-14 Р-15"><text x="31" y="134.1" font-size="2.5" text-anchor="middle" fill="#000">Р-16</text><text x="38.5" y="134.1" font-size="2.5" fill="#000">Сдача: осмотр по чек-листу, дефектная ведомость, устранение</text><text x="38.5" y="137.5" font-size="2.5" fill="#000">замечаний (стадия 18)</text><text x="130.5" y="134.1" font-size="2.5" fill="#000">Р-14, Р-15</text><text x="170.5" y="134.1" font-size="2.5" fill="#000">до начала: всё смонтировано; акты скрытых работ подписаны</text><text x="298.5" y="134.1" font-size="2.5" fill="#000"></text></g></g><g data-el="notes"><text x="25" y="153" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="157.8" font-size="2.5" fill="#000">1. Порядок работ — стадии технологической последовательности из 16 позиций, присутствующих в этом проекте (по строкам ведомости объёмов); остальные стадии таблицы knowledge/remont-tehnologiya.md в проекте не встречаются. Длительности работ не печатаются: их нет ни в данных, ни в нормах для</text><text x="29" y="161.2" font-size="2.5" fill="#000">этого объекта.</text><text x="25" y="164.6" font-size="2.5" fill="#000">2. Типовые сроки — ориентир практики, не срок поставщика: скрытые двери — короб около 10 дн., полотно под покраску до 3 нед., шпон 4–5 нед., в среднем около 30 дн. (knowledge/workers/foreman.md, п. 2.4 (profil-doors)); кухня и корпусная мебель — 4–8 недель от замера (knowledge/remont-tehnologiya.md,</text><text x="29" y="168" font-size="2.5" fill="#000">разд. 2; knowledge/workers/foreman.md, п. 2.4). Заказ по ориентиру не назначается: срок получают у поставщика (вопрос реестра), после чего заказ планируют «не позднее чем за срок до начала работы».</text><text x="25" y="171.4" font-size="2.5" fill="#000">3. Условия заказа берутся из реестра открытых вопросов и задания на контрольный обмер: позиция заказывается, когда закрыты замер (графа 1) и решение (графа 2). Закрывать их может только факт или решение автора с подписью; снять строку с листа можно только закрыв запись реестра.</text><text x="25" y="174.8" font-size="2.5" fill="#000">4. Заказ по размеру до контрольного обмера не делают: двери, кухня и встроенная мебель зависят от обмера (К-11, К-13); скрытые двери, кроме того, зависят от решения по нише санузла 2 (проём Д-5 в перегородке П-1).</text><text x="25" y="178.2" font-size="2.5" fill="#000">5. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text></g></g><g data-el="assumed-notes" data-flags="furniture:М36" data-ids="ИЗ-1 ИЗ-8 К-3 К-13 К-20 К-21 К-24 К-25" data-level="0"><text x="25.5" y="268.7" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="272.1" font-size="2.5" fill="#000">Основа листа: размеры сняты с размерных цепочек растрового скана плана заказчика, на объекте не замерены; ступени наружного контура приведены к граням помещений модели</text><text x="25.5" y="275.5" font-size="2.5" fill="#000">(ИЗ-8, К-20, К-21); высота потолка 2700 мм принята, источника нет (К-24); тип дома и перекрытие (монолит, плита 220 мм) приняты, источника нет (К-3); толщины стен приняты (250 и</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">120 мм), источника нет (К-21); мощность 15 кВт принята, технических условий нет (К-25).</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">Знак «*» — принято, не замерено и не подтверждено (замерить на объекте): ИЗ-1, К-13: М36 — положение и размеры стола утверждены автором (ИЗ-1); боковой свет от окна справа</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">принят допустимым, рабочая рука того, кто сидит за столом, не известна (К-13).</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-3, К-13; лист 7, записи К-20, К-21, К-24, К-25; лист 9, запись ИЗ-1; лист 10, запись ИЗ-8).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" fill="#000">05.10.26</text><text x="231" y="270.8" font-size="2.5" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" fill="#000">ГИП</text><text x="251" y="275.8" font-size="2.5" fill="#000">Кырлан А.С.</text><text x="290" y="275.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" fill="#000">05.10.26</text><text x="231" y="285.8" font-size="2.5" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" fill="#000">ГД-2026-004-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" fill="#000">Четырёхкомнатная квартира</text><text x="297" y="259.2" font-size="2.5" textLength="98.65" lengthAdjust="spacingAndGlyphs" fill="#000">Общая площадь 102,67* м² · * размеры со скана, не замерены (реестр — л. 6–11, ИЗ-8, К-20, К-21)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="268.7" font-size="2.5" fill="#000">Дизайн-проект интерьера четырёхкомнатной</text><text x="297" y="272.5" font-size="2.5" fill="#000">квартиры</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">19</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">121</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="285" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">График закупок и работ. Лист 3 из 3</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="30" data-positions="72" data-basis="5"><rect x="313.01" y="6.2" width="100.49" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="315.01" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 30 (реестр — л. 6–11)</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты. Лист 3 из 6</text><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации (стартовое совещание 04.10.2026)</text><g data-el="open-issues" data-plan="fixed" data-plan-declared="6"><g data-el="issues-questions"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Открытые вопросы и принятые допущения (продолжение)</text><rect x="25" y="33" width="385" height="84.8" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="32" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="33" x2="39" y2="117.8" stroke="#000" stroke-width="0.25"/><text x="122" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Формулировка</text><line x1="205" y1="33" x2="205" y2="117.8" stroke="#000" stroke-width="0.25"/><text x="220" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Вид</text><line x1="235" y1="33" x2="235" y2="117.8" stroke="#000" stroke-width="0.25"/><text x="253" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Кто решает</text><line x1="271" y1="33" x2="271" y2="117.8" stroke="#000" stroke-width="0.25"/><text x="309.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Если решения нет</text><line x1="348" y1="33" x2="348" y2="117.8" stroke="#000" stroke-width="0.25"/><text x="379" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Лист, где это проявляется</text><g data-el="issue-row" data-kind="question" data-id="К-26"><text x="32" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">К-26</text><text x="40.5" y="46.7" font-size="2.5" fill="#000">Артикулы изделий отделки не выбраны. Инженерная доска (пом. 1, 3, 4, 6, 8, 9, 11, 12), керамогранит пола (пом. 2, 5, 7, 10, 13),</text><text x="40.5" y="50.1" font-size="2.5" fill="#000">керамогранит стен санузла и ванной (пом. 2, 10) и фартука кухни (пом. 6), плинтус МДФ (пом. 1, 3–9, 11, 12), плинтус из</text><text x="40.5" y="53.5" font-size="2.5" fill="#000">керамогранита (пом. 13) и краска акцентных стен (пом. 1, 11) заданы характеристиками — «аналог по характеристикам», кода</text><text x="40.5" y="56.9" font-size="2.5" fill="#000">изделия производителя нет. Цвет керамогранита назван тоном по колерной карте (J484, F497, V486), но тон — не артикул изделия.</text><text x="40.5" y="60.3" font-size="2.5" fill="#000">Артикул выбирается при закупке: выбрать изделия, вписать артикулы в ведомость отделки и спецификации, цвет и тон принять по</text><text x="40.5" y="63.7" font-size="2.5" fill="#000">образцу из партии. Количество к заказу и упаковки — расчётные, по номинальным размерам, до выбора изделия.</text><text x="206.5" y="46.7" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="50.1" font-size="2.5" fill="#000">Ждёт: данных</text><text x="206.5" y="53.5" font-size="2.5" fill="#000">закупки, затем</text><text x="206.5" y="56.9" font-size="2.5" fill="#000">решения</text><text x="236.5" y="46.7" font-size="2.5" fill="#000">Отделочник</text><text x="272.5" y="46.7" font-size="2.5" fill="#000">материалы остаются описанными характеристиками; заказ</text><text x="272.5" y="50.1" font-size="2.5" fill="#000">по спецификации и подсчёт упаковок — только после</text><text x="272.5" y="53.5" font-size="2.5" fill="#000">выбора изделий</text><text x="349.5" y="46.7" font-size="2.5" fill="#000">л. 46 — Раскладка плитки. Планы полов</text><text x="349.5" y="50.1" font-size="2.5" fill="#000">л. 47 — Раскладка плитки. Фартук кухни</text><text x="349.5" y="53.5" font-size="2.5" fill="#000">л. 48 — Раскладка плитки. Ванная комната.</text><text x="349.5" y="56.9" font-size="2.5" fill="#000">Развёртки стен</text><text x="349.5" y="60.3" font-size="2.5" fill="#000">л. 49 — Раскладка плитки. Санузел. Развёртки</text><text x="349.5" y="63.7" font-size="2.5" fill="#000">стен</text><text x="349.5" y="67.1" font-size="2.5" fill="#000">л. 50 — План полов</text><text x="349.5" y="70.5" font-size="2.5" fill="#000">л. 52–54 — Ведомость отделки помещений</text><text x="349.5" y="73.9" font-size="2.5" fill="#000">л. 55, 56 — Колерная карта</text><text x="349.5" y="77.3" font-size="2.5" fill="#000">л. 57, 58 — Спецификация отделочных</text><text x="349.5" y="80.7" font-size="2.5" fill="#000">материалов</text><text x="349.5" y="84.1" font-size="2.5" fill="#000">л. 86 — Реестр марок отделки и позиций</text><text x="349.5" y="87.5" font-size="2.5" fill="#000">альбома</text><text x="349.5" y="90.9" font-size="2.5" fill="#000">л. 118, 119 — Спецификация материалов</text><text x="349.5" y="94.3" font-size="2.5" fill="#000">л. 120, 121 — Смета ориентировочная</text></g><line x1="25" y1="97.4" x2="410" y2="97.4" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-27"><text x="32" y="101.1" font-size="2.5" text-anchor="middle" fill="#000">К-27</text><text x="40.5" y="101.1" font-size="2.5" fill="#000">Модели встраиваемой техники кухни не выбраны: холодильник (М20), духовой шкаф (М22) и посудомоечная машина (М27) заданы</text><text x="40.5" y="104.5" font-size="2.5" fill="#000">описанием «аналог по характеристикам» — без производителя, серии и кода. Размеры ниш и вентзазоры взяты по типовой схеме на</text><text x="40.5" y="107.9" font-size="2.5" fill="#000">600 мм, а не по паспорту модели: у разных изготовителей они расходятся, и модуль, сделанный по типовой нише, может не принять</text><text x="40.5" y="111.3" font-size="2.5" fill="#000">выбранную технику. Вытяжка М25 — отдельный вопрос К-18. Нужно: выбрать модели, получить монтажные схемы изготовителей и</text><text x="40.5" y="114.7" font-size="2.5" fill="#000">сверить ниши модулей, вентиляцию и подключение до заказа гарнитура.</text><text x="206.5" y="101.1" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="104.5" font-size="2.5" fill="#000">Ждёт: данных</text><text x="206.5" y="107.9" font-size="2.5" fill="#000">закупки, затем</text><text x="206.5" y="111.3" font-size="2.5" fill="#000">решения</text><text x="236.5" y="101.1" font-size="2.5" fill="#000">Мебельщик</text><text x="272.5" y="101.1" font-size="2.5" fill="#000">ниши остаются по типовой схеме на 600 мм, не</text><text x="272.5" y="104.5" font-size="2.5" fill="#000">подтверждённой паспортом модели; модули кухни не</text><text x="272.5" y="107.9" font-size="2.5" fill="#000">заказывать до выбора техники</text><text x="349.5" y="101.1" font-size="2.5" fill="#000">л. 78 — Кухня (пом. 6). Развёртка гарнитура</text><text x="349.5" y="104.5" font-size="2.5" fill="#000">л. 79 — Кухня (пом. 6). Монтажная схема</text></g></g><g data-el="issues-conflicts"><text x="25" y="130.2" font-size="3.5" font-weight="700" fill="#000">Конфликты между разделами</text><rect x="25" y="132.8" width="385" height="27" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="142.8" x2="410" y2="142.8" stroke="#000" stroke-width="0.5"/><text x="32" y="138.7" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="132.8" x2="39" y2="159.8" stroke="#000" stroke-width="0.25"/><text x="114" y="138.7" font-size="2.5" text-anchor="middle" fill="#000">Формулировка</text><line x1="189" y1="132.8" x2="189" y2="159.8" stroke="#000" stroke-width="0.25"/><text x="209" y="138.7" font-size="2.5" text-anchor="middle" fill="#000">Разделы</text><line x1="229" y1="132.8" x2="229" y2="159.8" stroke="#000" stroke-width="0.25"/><text x="242" y="138.7" font-size="2.5" text-anchor="middle" fill="#000">Статус</text><line x1="255" y1="132.8" x2="255" y2="159.8" stroke="#000" stroke-width="0.25"/><text x="273" y="138.7" font-size="2.5" text-anchor="middle" fill="#000">Кто решает</text><line x1="291" y1="132.8" x2="291" y2="159.8" stroke="#000" stroke-width="0.25"/><text x="320.5" y="138.7" font-size="2.5" text-anchor="middle" fill="#000">Если решения нет</text><line x1="350" y1="132.8" x2="350" y2="159.8" stroke="#000" stroke-width="0.25"/><text x="380" y="138.7" font-size="2.5" text-anchor="middle" fill="#000">Лист, где это проявляется</text><g data-el="issue-row" data-kind="conflict" data-id="Кф-1"><text x="32" y="146.5" font-size="2.5" text-anchor="middle" fill="#000">Кф-1</text><text x="40.5" y="146.5" font-size="2.5" fill="#000">Стояки Ст К1-2, Ст В1-2 с коробом и люком попадают в проём окна Детской 2 (стена В, 8540–10040): положение стояков</text><text x="40.5" y="149.9" font-size="2.5" fill="#000">и окна не замерено; вопрос К-15.</text><text x="190.5" y="146.5" font-size="2.5" fill="#000">ВК; архитектура (окно Детской</text><text x="190.5" y="149.9" font-size="2.5" fill="#000">2)</text><text x="230.5" y="146.5" font-size="2.5" fill="#000">Открыт, круг 1</text><text x="256.5" y="146.5" font-size="2.5" fill="#000">Инженер ВК (вода,</text><text x="256.5" y="149.9" font-size="2.5" fill="#000">канализация)</text><text x="292.5" y="146.5" font-size="2.5" fill="#000">Положение окна — допущение, стояков — по</text><text x="292.5" y="149.9" font-size="2.5" fill="#000">скану без привязки; пока их не замерили,</text><text x="292.5" y="153.3" font-size="2.5" fill="#000">окно, радиатор под ним и короб со стояками</text><text x="292.5" y="156.7" font-size="2.5" fill="#000">на листах не согласованы.</text><text x="351.5" y="146.5" font-size="2.5" fill="#000">л. 40 — План выводов сантехники</text><text x="351.5" y="149.9" font-size="2.5" fill="#000">л. 41 — Схема разводки водопровода и</text><text x="351.5" y="153.3" font-size="2.5" fill="#000">канализации</text></g></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" fill="#000">05.10.26</text><text x="231" y="270.8" font-size="2.5" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" fill="#000">ГИП</text><text x="251" y="275.8" font-size="2.5" fill="#000">Кырлан А.С.</text><text x="290" y="275.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" fill="#000">05.10.26</text><text x="231" y="285.8" font-size="2.5" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" fill="#000">ГД-2026-004-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" fill="#000">Четырёхкомнатная квартира</text><text x="297" y="259.2" font-size="2.5" textLength="98.65" lengthAdjust="spacingAndGlyphs" fill="#000">Общая площадь 102,67* м² · * размеры со скана, не замерены (реестр — л. 6–11, ИЗ-8, К-20, К-21)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="268.7" font-size="2.5" fill="#000">Дизайн-проект интерьера четырёхкомнатной</text><text x="297" y="272.5" font-size="2.5" fill="#000">квартиры</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">8</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">121</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="283.2" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и</text><text x="330" y="287" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">конфликты. Лист 3 из 6</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="30" data-positions="72" data-basis="5"><rect x="313.01" y="6.2" width="100.49" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="315.01" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 30 (реестр — л. 6–11)</text></g></svg>
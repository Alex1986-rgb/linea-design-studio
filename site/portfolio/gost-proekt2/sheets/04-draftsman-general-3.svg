<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-sheet="general" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Общие данные</text><text x="25" y="17.8" font-size="2.5" fill="#333">Комплект ГД-2026-004-АИ · лист 3 общих данных (продолжение)</text><g data-el="ref-docs"><text x="25" y="29.5" font-size="3.5" font-weight="700" fill="#000">Ведомость ссылочных и прилагаемых документов</text><rect x="25" y="32" width="185" height="60.4" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="47" x2="210" y2="47" stroke="#000" stroke-width="0.5"/><text x="55" y="40.4" font-size="2.5" text-anchor="middle" fill="#000">Обозначение</text><line x1="85" y1="32" x2="85" y2="92.4" stroke="#000" stroke-width="0.25"/><text x="132.5" y="40.4" font-size="2.5" text-anchor="middle" fill="#000">Наименование</text><line x1="180" y1="32" x2="180" y2="92.4" stroke="#000" stroke-width="0.25"/><text x="195" y="40.4" font-size="2.5" text-anchor="middle" fill="#000">Примечание</text><g><text x="86.5" y="51.95" font-size="2.5" text-decoration="underline" fill="#000">Ссылочные документы</text></g><line x1="25" y1="55" x2="210" y2="55" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="60.85" font-size="2.5" fill="#000">ГОСТ 21.201-2011</text><text x="86.5" y="59.15" font-size="2.5" fill="#000">СПДС. Условные графические изображения элементов зданий,</text><text x="86.5" y="62.55" font-size="2.5" fill="#000">сооружений и конструкций</text></g><line x1="25" y1="64.8" x2="210" y2="64.8" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="69.75" font-size="2.5" fill="#000">ГОСТ 21.205-2016</text><text x="86.5" y="69.75" font-size="2.5" fill="#000">СПДС. Условные обозначения элементов санитарно-технических систем</text></g><line x1="25" y1="72.8" x2="210" y2="72.8" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="78.65" font-size="2.5" fill="#000">ГОСТ 21.210-2014</text><text x="86.5" y="76.95" font-size="2.5" fill="#000">СПДС. Изображения условные графические электрооборудования и</text><text x="86.5" y="80.35" font-size="2.5" fill="#000">проводок на планах</text></g><line x1="25" y1="82.6" x2="210" y2="82.6" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="88.45" font-size="2.5" fill="#000">ГОСТ 2.306-68</text><text x="86.5" y="86.75" font-size="2.5" fill="#000">ЕСКД. Обозначения графические материалов и правила их нанесения</text><text x="86.5" y="90.15" font-size="2.5" fill="#000">на чертежах</text></g></g><g data-el="project-composition"><text x="25" y="104.9" font-size="3.5" font-weight="700" fill="#000">Состав дизайн-проекта</text><rect x="25" y="107.4" width="185" height="65.6" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="122.4" x2="210" y2="122.4" stroke="#000" stroke-width="0.5"/><text x="44" y="115.8" font-size="2.5" text-anchor="middle" fill="#000">Раздел</text><line x1="63" y1="107.4" x2="63" y2="173" stroke="#000" stroke-width="0.25"/><text x="121.5" y="115.8" font-size="2.5" text-anchor="middle" fill="#000">Состав</text><line x1="180" y1="107.4" x2="180" y2="173" stroke="#000" stroke-width="0.25"/><text x="195" y="115.8" font-size="2.5" text-anchor="middle" fill="#000">Листы</text><g><text x="26.5" y="128.25" font-size="2.5" fill="#000">Обложка</text><text x="64.5" y="126.55" font-size="2.5" fill="#000">Дизайн-проект интерьера четырёхкомнатной квартиры; Четырёхкомнатная квартира;</text><text x="64.5" y="129.95" font-size="2.5" fill="#000">автор проекта — Кырлан Александр Сергеевич</text><text x="195" y="128.25" font-size="2.5" text-anchor="middle" fill="#000">1 с.</text></g><line x1="25" y1="132.2" x2="210" y2="132.2" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="138.05" font-size="2.5" fill="#000">Концепция</text><text x="64.5" y="136.35" font-size="2.5" fill="#000">Стиль Современный (контемпорари): концепция интерьера, палитра и материалы</text><text x="64.5" y="139.75" font-size="2.5" fill="#000">(колерная карта — лист 38)</text><text x="195" y="138.05" font-size="2.5" text-anchor="middle" fill="#000">л. 8</text></g><line x1="25" y1="142" x2="210" y2="142" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="146.95" font-size="2.5" fill="#000">Визуализации</text><text x="64.5" y="146.95" font-size="2.5" fill="#000">не выполнялись</text><text x="195" y="146.95" font-size="2.5" text-anchor="middle" fill="#000"></text></g><line x1="25" y1="150" x2="210" y2="150" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="155.85" font-size="2.5" fill="#000">Рабочие чертежи</text><text x="64.5" y="154.15" font-size="2.5" fill="#000">планы, развёртки, узлы (развёртки и узлы — листы 73–76, 79–82, 85, 87, 89–95,</text><text x="64.5" y="157.55" font-size="2.5" fill="#000">97–99)</text><text x="195" y="155.85" font-size="2.5" text-anchor="middle" fill="#000">л. 1–105</text></g><line x1="25" y1="159.8" x2="210" y2="159.8" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="167.35" font-size="2.5" fill="#000">Спецификации и ведомости</text><text x="64.5" y="167.35" font-size="2.5" fill="#000">оборудование, изделия, отделка, электроточки</text><text x="195" y="163.95" font-size="2.5" text-anchor="middle" fill="#000">л. 7, 10–13, 17,</text><text x="195" y="167.35" font-size="2.5" text-anchor="middle" fill="#000">25, 26, 35–41, 45,</text><text x="195" y="170.75" font-size="2.5" text-anchor="middle" fill="#000">46, 100–104</text></g></g><g data-el="legend"><text x="25" y="186" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><g><line x1="27" y1="192.6" x2="27" y2="195.6" stroke="#000" stroke-width="0.25"/><line x1="35" y1="192.6" x2="35" y2="195.6" stroke="#000" stroke-width="0.25"/><rect x="27" y="193.85" width="8" height="0.5" fill="#000"/></g><text x="39" y="195" font-size="2.5" fill="#000">контрольный отрезок 1000 мм натуры: по нему проверяют печать 1:1</text><g><line x1="32" y1="200.1" x2="26" y2="200.1" stroke="#000" stroke-width="0.25"/><polygon points="30,200.1 31,201.1 32,200.1" fill="#fff" stroke="#000" stroke-width="0.25"/></g><text x="39" y="202" font-size="2.5" fill="#000">отметка уровня, м: ±0,000 — чистый пол жилых помещений</text><g><g data-wall="C"><text x="31" y="208.2" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">А</text><path d="M 31 212.2 L 29.5 210.05 L 32.5 210.05 Z" fill="#000"/><circle cx="31" cy="207.3" r="2.5" fill="none" stroke="#000" stroke-width="0.35"/></g></g><text x="39" y="209" font-size="2.5" fill="#000">марка развёртки: буква стены, стрелка — взгляд</text><g><text x="31" y="219" font-size="2.5" text-anchor="middle" fill="#000">О1</text><circle cx="31" cy="218.1" r="3.5" fill="none" stroke="#000" stroke-width="0.25"/></g><text x="39" y="219" font-size="2.5" fill="#000">марка отделки по реестру отделки альбома</text><g><line x1="30.4" y1="225.7" x2="32.5" y2="224.1" stroke="#000" stroke-width="0.25"/><line x1="32.5" y1="224.1" x2="37" y2="224.1" stroke="#000" stroke-width="0.25"/><circle cx="29" cy="227.1" r="2.2" fill="none" stroke="#000" stroke-width="0.25"/></g><text x="39" y="228" font-size="2.5" fill="#000">выноска узла: над полкой — узел, под полкой — лист</text></g><g data-el="general-notes"><text x="25" y="243" font-size="3.5" font-weight="700" fill="#000">Общие указания</text><text x="25" y="249" font-size="2.5" fill="#000">1. Рабочие чертежи интерьера разработаны на основании задания на проектирование и обмерного плана (лист 5). Объект:</text><text x="28" y="252.5" font-size="2.5" fill="#000">Четырёхкомнатная квартира; автор проекта — Кырлан Александр Сергеевич; общая площадь 87,88 м², жилая 46,48 м², помещений 11.</text><text x="25" y="256" font-size="2.5" fill="#000">2. Рабочие чертежи выполнены в соответствии с заданием на проектирование и нормативными документами, перечисленными в п. 3.</text><text x="25" y="259.5" font-size="2.5" fill="#000">3. Нормативные документы, на которые есть ссылки в листах комплекта: ГОСТ Р 21.101-2026; ГОСТ 21.501-2018; ГОСТ 2.302-68; ГОСТ</text><text x="28" y="263" font-size="2.5" fill="#000">2.303-68; ГОСТ 2.304-81; ГОСТ 2.307-2011; СП 54.13330.2022; СП 71.13330.2017; СП 73.13330.2016; ПУЭ (7-е изд.), гл. 1.8, 7.1;</text><text x="28" y="266.5" font-size="2.5" fill="#000">ГОСТ Р 50571.7.701-2024; СанПиН 1.2.3685-21; ГОСТ 2.702; ГОСТ 2.755; ГОСТ 21.110-2013; ГОСТ 21.601; ГОСТ 23166-2021; ГОСТ</text><text x="28" y="270" font-size="2.5" fill="#000">31565-2012; ГОСТ 31975; ГОСТ 32414-2013; ГОСТ 32415-2013; ГОСТ Р 56387-2018; СП 29.13330.2011; СП 30.13330.2020; СП</text><text x="28" y="273.5" font-size="2.5" fill="#000">51.13330.2011; СП 52.13330.2016. Документы из ведомости ссылочных документов здесь не повторяются.</text><text x="25" y="277" font-size="2.5" fill="#000">4. За отметку ±0,000 принят уровень чистого пола жилых помещений квартиры (относительная отметка; абсолютная — по проекту дома).</text><text x="28" y="280.5" font-size="2.5" fill="#000">Отметка чистого пола мокрых помещений — −0,015. Размеры — в миллиметрах, отметки — в метрах, площади — в м²; высоты установки Н</text><text x="28" y="284" font-size="2.5" fill="#000">от чистого пола своего помещения до оси изделия.</text><text x="25" y="287.5" font-size="2.5" fill="#000">5. Несущие конструкции, общедомовые стояки, вентиляционные каналы и сети не изменять; работы, затрагивающие их, — только по</text></g><g data-el="general-notes"><text x="223" y="30" font-size="2.5" fill="#000">отдельному проекту, согласованному в установленном порядке.</text><text x="220" y="33.5" font-size="2.5" fill="#000">6. Трассы инженерных сетей на листах — принципиальные. Расчёты электрических нагрузок и токов КЗ, гидравлики, воздухообмена,</text><text x="223" y="37" font-size="2.5" fill="#000">освещённости и нагрузок на перекрытие выполняются в проектах ЭОМ, ВК, ОВ и КР организацией с допуском СРО; фактические трассы до</text><text x="223" y="40.5" font-size="2.5" fill="#000">закрытия отделкой фиксируются исполнительными схемами.</text><text x="220" y="44" font-size="2.5" fill="#000">7. Стиль интерьера — Современный (контемпорари). Палитра проекта: основной 60 % — Tikkurila F497 «Paper», Tikkurila J484</text><text x="223" y="47.5" font-size="2.5" fill="#000">«Castle»; дополнительный 30 % — Tikkurila V486 «Claystone»; акцент 10 % — Tikkurila L481 «Silhouette». Коды цвета — по веерам</text><text x="223" y="51" font-size="2.5" fill="#000">производителей; цвет утверждается по выкрасу на объекте при освещении проекта.</text><text x="220" y="54.5" font-size="2.5" fill="#000">8. Площади поверхностей — по чистым граням стен до отделки: стены = периметр × высоту от чистого пола помещения до низа потолка</text><text x="223" y="58" font-size="2.5" fill="#000">минус проёмы (облицовка плиткой — до верха облицовки); плинтус = периметр минус дверные проёмы; пол и потолок — по площади</text><text x="223" y="61.5" font-size="2.5" fill="#000">помещения. Количество плиток — по раскладке. Способ один для всех листов комплекта (ведомость отделки, колерная карта, раскладка</text><text x="223" y="65" font-size="2.5" fill="#000">плитки, развёртки).</text><text x="220" y="68.5" font-size="2.5" fill="#000">9. Марки: стены помещения на всех листах — А (верхняя по плану), Б (правая), В (нижняя), Г (левая); марка отделки О — одна на</text><text x="223" y="72" font-size="2.5" fill="#000">весь альбом; реестр марок отделки (с позициями колерной карты К/М той же отделки) и марки позиций по видам — на листе 72.</text><text x="220" y="75.5" font-size="2.5" fill="#000">10. Развёртки стен выполнены по всем помещениям для стен с электроточками, мебелью, декором и отделкой: санузлы и кухонный фронт</text><text x="223" y="79" font-size="2.5" fill="#000">— в М 1:25, остальные стены — в М 1:40; расположение развёрток и узлов — на листе 73, узлы — на листе 98.</text><text x="220" y="82.5" font-size="2.5" fill="#000">11. Перечень скрытых работ, на которые составляются акты освидетельствования (форма по приказу Минстроя России № 344/пр):</text><text x="223" y="86" font-size="2.5" fill="#000">гидроизоляция пола и стен мокрых помещений (с тестом проливом); стяжка пола (толщина, прочность, влажность основания);</text><text x="223" y="89.5" font-size="2.5" fill="#000">звукоизоляционные слои и демпферная лента; тёплый пол до заливки (сопротивление, схема укладки); скрытая электропроводка в</text><text x="223" y="93" font-size="2.5" fill="#000">штробах и за облицовкой (исполнительная схема трасс); трубопроводы водоснабжения и канализации до закрытия (опрессовка, уклоны);</text><text x="223" y="96.5" font-size="2.5" fill="#000">закладные и усиления под подвесные приборы, мебель и тяжёлый декор, рамы инсталляций; каркасы ГКЛ потолков, коробов и перегородок</text><text x="223" y="100" font-size="2.5" fill="#000">до обшивки.</text><text x="220" y="103.5" font-size="2.5" fill="#000">12. Критерии приёмки: допуски отделочных покрытий — по СП 71.13330.2017; испытания систем водоснабжения и канализации — по СП</text><text x="223" y="107" font-size="2.5" fill="#000">73.13330.2016 до закрытия трасс; приёмо-сдаточные испытания электроустановки — по ПУЭ, гл. 1.8, с протоколом электролаборатории.</text><text x="220" y="110.5" font-size="2.5" fill="#000">13. Осознанные отступления от ГОСТ Р 21.101-2026, принятые в комплекте: номер листа и число листов («Листов») указаны на каждом</text><g data-deviation="sheets-count-every-sheet"/><g data-deviation="scale-in-stamp"/><g data-deviation="elevation-1:40"/><g data-deviation="dim-font-2.5"/><g data-deviation="room-circle-8"/><text x="223" y="114" font-size="2.5" fill="#000">листе; на масштабных листах в основной надписи указан фактический масштаб и дан контрольный отрезок 1000 мм; развёртки стен</text><text x="223" y="117.5" font-size="2.5" fill="#000">выполнены в М 1:25 и 1:40 (ГОСТ 21.507-81 — 1:50…1:500) ради читаемости привязок; размерные числа и марки элементов (Д-1, ОК-1,</text><text x="223" y="121" font-size="2.5" fill="#000">О6) — кеглем 2,5 мм, номера помещений — в кружке Ø 8 мм (канон — 3,5 мм и Ø 12 мм): так насыщенные листы А3 читаются без</text><text x="223" y="124.5" font-size="2.5" fill="#000">наложений надписей.</text><text x="220" y="128" font-size="2.5" fill="#000">14. Графы «Пров.», «Н. контр.», «Утв.» основной надписи заполняются при согласовании комплекта с заказчиком; до согласования</text><text x="223" y="131.5" font-size="2.5" fill="#000">комплект подписывает автор проекта (графа «Разраб.»).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="27
.8" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="62.65" font-size="2.5" fill="#000">Концепция</text><text x="259.5" y="60.95" font-size="2.5" fill="#000">Стиль Современный (контемпорари): концепция интерьера, палитра и материалы</text><text x="259.5" y="64.35" font-size="2.5" fill="#000">(колерная карта — лист 48)</text><text x="390" y="62.65" font-size="2.5" text-anchor="middle" fill="#000">л. 17</text></g><line x1="220" y1="66.6" x2="405" y2="66.6" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="75.85" font-size="2.5" fill="#000">Визуализации</text><text x="259.5" y="70.75" font-size="2.5" fill="#000">11 изобр.: Вид сверху (3D): планировка с мебелью, текстилем и декором; Потолок;</text><text x="259.5" y="74.15" font-size="2.5" fill="#000">Потолок: Ванная комната; Потолок: Прихожая-коридор; Потолок: Детская 1; Потолок:</text><text x="259.5" y="77.55" font-size="2.5" fill="#000">Детская 2; Потолок: Кухня; Потолок: Зал; Потолок; Потолок: Гардеробная 2;</text><text x="259.5" y="80.95" font-size="2.5" fill="#000">Потолок: Санузел</text><text x="390" y="75.85" font-size="2.5" text-anchor="middle" fill="#000">В1–В11</text></g><line x1="220" y1="83.2" x2="405" y2="83.2" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="89.05" font-size="2.5" fill="#000">Рабочие чертежи</text><text x="259.5" y="87.35" font-size="2.5" fill="#000">планы, развёртки, узлы (развёртки и узлы — листы 80–82, 87–90, 93, 95, 97–105,</text><text x="259.5" y="90.75" font-size="2.5" fill="#000">107)</text><text x="390" y="89.05" font-size="2.5" text-anchor="middle" fill="#000">л. 1–113</text></g><line x1="220" y1="93" x2="405" y2="93" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="100.55" font-size="2.5" fill="#000">Спецификации и ведомости</text><text x="259.5" y="100.55" font-size="2.5" fill="#000">оборудование, изделия, отделка, электроточки</text><text x="390" y="97.15" font-size="2.5" text-anchor="middle" fill="#000">л. 16, 19–22, 26,</text><text x="390" y="100.55" font-size="2.5" text-anchor="middle" fill="#000">27, 35, 36, 45–51,</text><text x="390" y="103.95" font-size="2.5" text-anchor="middle" fill="#000">55, 56, 108–112</text></g></g><g data-deviation="sheets-count-every-sheet"/><g data-deviation="scale-in-stamp"/><g data-deviation="elevation-1:40"/><g data-deviation="dim-font-2.5"/><g data-deviation="room-circle-8"/><g data-el="general-ref"><text x="25" y="290.2" font-size="2.5" textLength="183.55" lengthAdjust="spacingAndGlyphs" fill="#000">Общие указания — лист 5: ±0,000 — чистый пол; несущие конструкции и сети дома — по отдельному проекту; скрытые работы — по актам. Открытые вопросы и допущения — листы 6–10.</text><g data-el="open-issues-ref" data-target="6"/></g><g data-el="assumed-notes" data-flags="" data-ids="ИЗ-8 К-3 К-20 К-21 К-24 К-25" data-level="0"><text x="212.5" y="216.6" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="212.5" y="220" font-size="2.5" fill="#000">Основа листа: размеры сняты с размерных цепочек растрового скана плана заказчика, на объекте не замерены; ступени наружного контура</text><text x="212.5" y="223.4" font-size="2.5" fill="#000">приведены к граням помещений модели (ИЗ-8, К-20, К-21); высота потолка 2700 мм принята, источника нет (К-24); тип дома и перекрытие (монолит,</text><text x="212.5" y="226.8" font-size="2.5" fill="#000">плита 220 мм) приняты, источника нет (К-3); толщины стен приняты (250 и 120 мм), источника нет (К-21); мощность 15 кВт принята, технических</text><text x="212.5" y="230.2" font-size="2.5" fill="#000">условий нет (К-25).</text><text x="212.5" y="233.6" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, запись К-3; лист 7, записи К-20, К-21, К-24, К-25; лист 9, запись ИЗ-8).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295"
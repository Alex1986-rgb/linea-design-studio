<line x1="25" y1="123" x2="117" y2="123" stroke="#000" stroke-width="0.18"/><text x="26.5" y="121.3" font-size="2.5" text-anchor="start" fill="#000" textLength="3.65" lengthAdjust="spacingAndGlyphs">S17**</text><text x="37.5" y="121.3" font-size="2.5" text-anchor="start" fill="#000">9</text><text x="45.5" y="121.3" font-size="2.5" text-anchor="start" fill="#000">900</text><text x="55.5" y="121.3" font-size="2.5" text-anchor="start" fill="#000">1</text><text x="64.5" y="121.3" font-size="2.5" text-anchor="start" fill="#000">обычный</text><text x="84.5" y="121.3" font-size="2.5" text-anchor="start" fill="#000" textLength="9.47" lengthAdjust="spacingAndGlyphs">L21: Св63**</text><text x="26.5" y="127.3" font-size="2.5" text-anchor="start" fill="#000" textLength="3.65" lengthAdjust="spacingAndGlyphs">S18**</text><text x="37.5" y="127.3" font-size="2.5" text-anchor="start" fill="#000">9</text><text x="45.5" y="127.3" font-size="2.5" text-anchor="start" fill="#000">900</text><text x="55.5" y="127.3" font-size="2.5" text-anchor="start" fill="#000">1</text><text x="64.5" y="127.3" font-size="2.5" text-anchor="start" fill="#000">обычный</text><text x="84.5" y="127.3" font-size="2.5" text-anchor="start" fill="#000" textLength="9.47" lengthAdjust="spacingAndGlyphs">L22: Св67**</text></g><g data-el="notes"><text x="25" y="241" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="246" font-size="2.5" fill="#000">1. Продолжение ведомостей: лист 2 из 2 этого наименования; таблицы, прерванные на предыдущем листе, продолжены с заголовком «(продолжение)».</text><text x="25" y="249.4" font-size="2.5" fill="#000">2. За отметку 0,000 принят уровень чистого пола. Высоты Н — от чистого пола до оси изделия; привязки — от чистовой грани стены до оси механизма (у рамки на</text><text x="28" y="252.8" font-size="2.5" fill="#000">несколько постов — до оси рамки).</text><text x="25" y="256.2" font-size="2.5" fill="#000">3. Розеточные и мокрые линии — через УЗО или дифавтомат с током утечки не более 30 мА (ПУЭ 7.1.79); в санузле выполнить ДСУП (ПУЭ 7.1.87–7.1.88).</text><text x="25" y="259.6" font-size="2.5" fill="#000">4. Кабель — медный, исполнение нг(А)-LS (ГОСТ 31565-2012); скрытая прокладка только горизонтально и вертикально, фактические трассы зафиксировать исполнительной</text><text x="28" y="263" font-size="2.5" fill="#000">схемой до закрытия отделкой.</text><text x="25" y="266.4" font-size="2.5" fill="#000">5. Расчёт нагрузок, токов КЗ, селективности и сечений — по проекту ЭОМ организации с допуском СРО; лист задаёт состав, расположение и группы.</text></g><g data-el="assumed-notes" data-flags="point:S17|point:Св63|point:S18|point:Св67|point:Св64|point:S16|point:Св65|point:Св66" data-ids="ИЗ-2 ИЗ-3 ИЗ-5 ИЗ-7 ИЗ-8 ИЗ-10 К-3 К-20 К-21 К-23 К-24 К-25" data-level="0"><text x="22.5" y="206.9" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="22.5" y="210.3" font-size="2.5" fill="#000">Основа листа: размеры сняты с размерных цепочек растрового скана плана заказчика, на объекте не замерены; ступени наружного контура приведены к граням помещений модели (ИЗ-8, К-20, К-21);</text><text x="22.5" y="213.7" font-size="2.5" fill="#000">высота потолка 2700 мм принята, источника нет (К-24); тип дома и перекрытие (монолит, плита 220 мм) приняты, источника нет (К-3); толщины стен приняты (250 и 120 мм), источника нет (К-21);</text><text x="22.5" y="217.1" font-size="2.5" fill="#000">мощность 15 кВт принята, технических условий нет (К-25).</text><text x="22.5" y="220.5" font-size="2.5" fill="#000">Знак «**» — предложение проектировщика, заказчиком не утверждено (согласовать с заказчиком): ИЗ-2: S17, Св63, S18, Св67; ИЗ-3: Св64; ИЗ-7: S16 — вторая клавиша (подсветка картины ДК20)</text><text x="22.5" y="223.9" font-size="2.5" fill="#000">добавлена как предложение; Св65, Св66.</text><text x="22.5" y="227.3" font-size="2.5" fill="#000">Открытые вопросы и конфликты по листу: К-23.</text><text x="22.5" 
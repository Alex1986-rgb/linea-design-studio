y1="33" x2="323" y2="60" stroke="#000" stroke-width="0.25"/><text x="344" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Чем подтверждается</text><line x1="365" y1="33" x2="365" y2="60" stroke="#000" stroke-width="0.25"/><text x="387.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Закрывает вопросы реестра</text><g data-el="survey-row" data-id="О-11" data-key="vstroennaya-mebel-chistovoj-obmer" data-closes="К-10" data-method="measure"><text x="31" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">О-11</text><text x="38.5" y="46.7" font-size="2.5" fill="#000">Кухня, Ванная комната, Санузел,</text><text x="38.5" y="50.1" font-size="2.5" fill="#000">Гардеробная 1 и 2</text><text x="88.5" y="46.7" font-size="2.5" fill="#000">Обмер</text><text x="108.5" y="46.7" font-size="2.5" fill="#000">Габариты кухни и помещений со встроенной мебелью по</text><text x="108.5" y="50.1" font-size="2.5" fill="#000">готовым стенам: размеры после штукатурки и выравнивания.</text><text x="190.5" y="46.7" font-size="2.5" fill="#000">Архитектор</text><text x="228.5" y="46.7" font-size="2.5" fill="#000">±5 мм</text><text x="254.5" y="46.7" font-size="2.5" fill="#000">Размеры встроенной мебели и кухни; монтажные</text><text x="254.5" y="50.1" font-size="2.5" fill="#000">схемы гарнитура и шкафов.</text><text x="254.5" y="53.5" font-size="2.5" fill="#000">Листы:</text><text x="254.5" y="56.9" font-size="2.5" fill="#000">л. 14 — Обмерный план</text><text x="324.5" y="46.7" font-size="2.5" fill="#000">акт контрольного обмера</text><text x="366.5" y="46.7" font-size="2.5" fill="#000">К-10</text><text x="366.5" y="50.1" font-size="2.5" fill="#000">Результат принимает: Архитектор</text></g></g><g data-el="survey-offsite"><text x="25" y="72.4" font-size="3.5" font-weight="700" fill="#000">Документы и данные закупки (не на объекте)</text><rect x="25" y="75" width="385" height="71.2" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="85" x2="410" y2="85" stroke="#000" stroke-width="0.5"/><text x="31" y="80.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="37" y1="75" x2="37" y2="146.2" stroke="#000" stroke-width="0.25"/><text x="62" y="80.9" font-size="2.5" text-anchor="middle" fill="#000">У кого, откуда</text><line x1="87" y1="75" x2="87" y2="146.2" stroke="#000" stroke-width="0.25"/><text x="97" y="80.9" font-size="2.5" text-anchor="middle" fill="#000">Способ</text><line x1="107" y1="75" x2="107" y2="146.2" stroke="#000" stroke-width="0.25"/><text x="149" y="80.9" font-size="2.5" text-anchor="middle" fill="#000">Что получить</text><line x1="191" y1="75" x2="191" y2="146.2" stroke="#000" stroke-width="0.25"/><text x="219" y="80.9" font-size="2.5" text-anchor="middle" fill="#000">К какому сроку</text><line x1="247" y1="75" x2="247" y2="146.2" stroke="#000" stroke-width="0.25"/><text x="285" y="80.9" font-size="2.5" text-anchor="middle" fill="#000">Что пересчитается в альбоме</text><line x1="323" y1="75" x2="323" y2="146.2" stroke="#000" stroke-width="0.25"/><text x="344" y="80.9" font-size="2.5" text-anchor="middle" fill="#000">Чем подтверждается</text><line x1="365" y1="75" x2="365" y2="146.2" stroke="#000" stroke-width="0.25"/><text x="387.5" y="80.9" font-size="2.5" text-anchor="middle" fill="#000">Закрывает вопросы реестра</text><g data-el="survey-row" data-id="О-12" data-key="dom-dokumenty" data-closes="К-3" data-method="document"><text x="31" y="88.7" font-size="2.5" text-anchor="middle" fill="#000">О-12</text><text x="38.5" y="88.7" font-size="2.5" fill="#000">Заказчик (документы на квартиру и</text><text x="38.5" y="92.1" font-size="2.5" fill="#000">дом)</text><text x="88.5" y="88.7" font-size="2.5" fill="#000">Документ</text><text x="108.5" y="88.7" font-size="2.5" fill="#000">План БТИ и проект дома: тип и серия дома, материал и толщина</text><text x="108.5" y="92.1" font-size="2.5" fill="#000">перекрытия (принято: монолитная плита 220 мм), какие стены</text><text x="108.5" y="95.5" font-size="2.5" fill="#000">несущие.</text><text x="192.5" y="88.7" font-size="2.5" fill="#000">До любого демонтажа и штробления в</text><text x="192.5" y="92.1" font-size="2.5" fill="#000">стенах</text><text x="248.5" y="88.7" font-size="2.5" fill="#000">Тип дома и конструкция перекрытия в данных объекта;</text><text x="248.5" y="92.1" font-size="2.5" fill="#000">разметка несущих и ненесущих стен на обмерном плане и</text><text x="248.5" y="95.5" font-size="2.5" fill="#000">плане демонтажа; допустимость демонтажа, проёмов и</text><text x="248.5" y="98.9" font-size="2.5" fill="#000">штроб (пока все стены считаются несущими).</text><text x="248.5" y="102.3" font-size="2.5" fill="#000">Листы:</text><text x="248.5" y="105.7" font-size="2.5" fill="#000">л. 15 — План демонтажа и монтажа перегородок</text><text x="324.5" y="88.7" font-size="2.5" fill="#000">копия документа</text><text x="366.5" y="88.7" font-size="2.5" fill="#000">К-3</text><text x="366.5" y="92.1" font-size="2.5" fill="#000">Результат принимает: Архитектор</text></g><line x1="25" y1="108.8" x2="410" y2="108.8" stroke="#000" stroke-width="0.25"/><g data-el="survey-row" data-id="О-13" data-key="vytyazhka-pasport" data-closes="К-18" data-method="procure"><text x="31" y="112.5" font-size="2.5" text-anchor="middle" fill="#000">О-13</text><text x="38.5" y="112.5" font-size="2.5" fill="#000">Поставщик или изготовитель вытяжки;</text><text x="38.5" y="115.9" font-size="2.5" fill="#000">модель пока не выбрана</text><text x="88.5" y="112.5" font-size="2.5" fill="#000">Закупка</text><text x="108.5" y="112.5" font-size="2.5" fill="#000">Паспорт выбранной модели вытяжки: допустимая высота низа</text><text x="108.5" y="115.9" font-size="2.5" fill="#000">над электрической варочной панелью.</text><text x="192.5" y="112.5" font-size="2.5" fill="#000">До заказа модулей М24–М26</text><text x="248.5" y="112.5" font-size="2.5" fill="#000">Отметка модуля М25 и соседних М24, М26; расстояние от</text><text x="248.5" y="115.9" font-size="2.5" fill="#000">варочной панели до вытяжки (сейчас 610 мм при фартуке</text><text x="248.5" y="119.3" font-size="2.5" fill="#000">650 мм).</text><text x="248.5" y="122.7" font-size="2.5" fill="#000">Листы:</text><text x="248.5" y="126.1" font-size="2.5" fill="#000">л. 71, 73 — Кухня. Развёртка гарнитура</text><text x="324.5" y="112.5" font-size="2.5" fill="#000">паспорт изделия или партии</text><text x="366.5" y="112.5" font-size="2.5" fill="#000">К-18</text><text x="366.5" y="115.9" font-size="2.5" fill="#000">Результат принимает: Мебельщик</text></g><line x1="25" y1="129.2" x2="410" y2="129.2" stroke="#000" stroke-width="0.25"/><g data-el="survey-row" data-id="О-14" data-key="tu-moshchnost" data-closes="К-25" data-method="document"><text x="31" y="132.9" font-size="2.5" text-anchor="middle" fill="#000">О-14</text><text x="38.5" y="132.9" font-size="2.5" fill="#000">Заказчик; организация, выдавшая</text><text x="38.5" y="136.3" font-size="2.5" fill="#000">технические условия</text><text x="88.5" y="132.9" font-size="2.5" fill="#000">Документ</text><text x="108.5" y="132.9" font-size="2.5" fill="#000">Технические условия на присоединение: разрешённая мощность</text><text x="108.5" y="136.3" font-size="2.5" fill="#000">(принято 15 кВт, расчётная 11,2 кВт); источника в материалах</text><text x="108.5" y="139.7" font-size="2.5" fill="#000">объекта нет.</text><text x="192.5" y="132.9" font-size="2.5" fill="#000">До утверждения однолинейной схемы щита</text><text x="248.5" y="132.9" font-size="2.5" fill="#000">Однолинейная схема щита: вводной аппарат и группы;</text><text x="248.5" y="136.3" font-size="2.5" fill="#000">сверка расчётной мощности 11,2 кВт с разрешённой.</text><text x="248.5" y="139.7" font-size="2.5" fill="#000">Листы:</text><text x="248.5" y="143.1" font-size="2.5" fill="#000">л. 28 — Однолинейная схема щита</text><text x="324.5" y="132.9" font-size="2.5" fill="#000">копия документа</text><text x="366.5" y="132.9" font-size="2.5" fill="#000">К-25</text><text x="366.5" y="136.3" font-size="2.5" fill="#000">Результат принимает:</text><text x="366.5" y="139.7" font-size="2.5" fill="#000">Инженер-электрик</text></g></g><g data-el="notes"><text x="25" y="158.6" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="163.4" font-size="2.5" fill="#000">1. Подтверждение: акт контрольного обмера (дата, кто присутствовал, прибор, перечень промеров с результатами, подписи присутствующих); к акту — фото вскрытий и узлов и техническое заключение организации, выполнившей обследование.</text><text x="25" y="166.8" font-size="2.5" fill="#000">2. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text><text x="25" y="170.2" font-size="2.5" fill="#000">3. Пункт исключается из задания при следующем выпуске, когда акт подписан, значение внесено в проект и листы перевыпущены; знак «*» у величины снимается только замером.</text></g></g><g data-el="assumed-notes" data-flags="" data-ids="ИЗ-8 К-3 К-20 К-21 К-24 К-25" data-level="0"><text x="25.5" y="275.5" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">Основа листа: размеры сняты с размерных цепочек растрового скана плана заказчика, на объекте не замерены; ступени наружного контура приведены к граням помещений модели</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">(ИЗ-8, К-20, К-21); высота потолка 2700 мм принята, источника нет (К-24); тип дома и перекрытие (монолит, плита 220 мм) приняты, источника нет (К-3); толщины стен приняты (250 и</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">120 мм), источника нет (К-21); мощность 15 кВт принята, технических условий нет (К-25).</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, запись К-3; лист 7, записи К-20, К-21, К-24, К-25; лист 9, запись ИЗ-8).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><text 
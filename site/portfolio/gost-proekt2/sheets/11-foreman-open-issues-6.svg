<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты. Лист 6 из 6</text><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации (стартовое совещание 04.10.2026)</text><g data-el="open-issues" data-plan="fixed" data-plan-declared="6"><g data-el="issues-changes"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Изменения проекта после выпуска листов (реестр изменений) (продолжение)</text><rect x="25" y="33" width="385" height="71.2" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="32" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="33" x2="39" y2="104.2" stroke="#000" stroke-width="0.25"/><text x="50" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><line x1="61" y1="33" x2="61" y2="104.2" stroke="#000" stroke-width="0.25"/><text x="91" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><line x1="121" y1="33" x2="121" y2="104.2" stroke="#000" stroke-width="0.25"/><text x="171" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Было</text><line x1="221" y1="33" x2="221" y2="104.2" stroke="#000" stroke-width="0.25"/><text x="283.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Стало</text><line x1="346" y1="33" x2="346" y2="104.2" stroke="#000" stroke-width="0.25"/><text x="378" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Кто решил, подпись</text><g data-el="issue-row" data-kind="change" data-id="ИЗ-17"><text x="32" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-17</text><text x="40.5" y="46.7" font-size="2.5" fill="#000">05.10.2026</text><text x="62.5" y="46.7" font-size="2.5" fill="#000">л. 2 — Общие данные</text><text x="122.5" y="46.7" font-size="2.5" fill="#000">Матрицы ответственности (делает / поставляет / принимает / хранит) нет; кто</text><text x="122.5" y="50.1" font-size="2.5" fill="#000">покупает и кто монтирует — не определено (вопрос К-12).</text><text x="222.5" y="46.7" font-size="2.5" fill="#000">Принята типовая схема частного ремонта: материалы и оборудование покупает заказчик по</text><text x="222.5" y="50.1" font-size="2.5" fill="#000">спецификациям проекта; монтаж ведёт подрядная бригада; приёмку скрытых работ ведёт автор</text><text x="222.5" y="53.5" font-size="2.5" fill="#000">проекта. Распределение закреплено по радиаторам, подоконникам, дверям, розеткам и</text><text x="222.5" y="56.9" font-size="2.5" fill="#000">выключателям, сантехническим приборам, светильникам и отделочным материалам. Схема</text><text x="222.5" y="60.3" font-size="2.5" fill="#000">уточняется договором подряда; состав подрядчиков и поставщиков остаётся вопросом К-12.</text><text x="347.5" y="46.7" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., автор проекта,</text><text x="347.5" y="50.1" font-size="2.5" fill="#000">05.10.2026. решение автора проекта, оформлено</text><text x="347.5" y="53.5" font-size="2.5" fill="#000">исполнителем по его поручению</text></g><line x1="25" y1="63.4" x2="410" y2="63.4" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-18"><text x="32" y="67.1" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-18</text><text x="40.5" y="67.1" font-size="2.5" fill="#000">05.10.2026</text><text x="62.5" y="67.1" font-size="2.5" fill="#000">л. 2 — Общие данные</text><text x="122.5" y="67.1" font-size="2.5" fill="#000">Графы «Пров.» и «Н. контр.» основной надписи пусты (вопрос К-8); как с</text><text x="122.5" y="70.5" font-size="2.5" fill="#000">ними поступать — не записано.</text><text x="222.5" y="67.1" font-size="2.5" fill="#000">Графы «Пров.» и «Н. контр.» остаются пустыми: независимой проверки и нормоконтроля проекта</text><text x="222.5" y="70.5" font-size="2.5" fill="#000">не было, автор проекта сам себе их не подписывает. Комплект выпускается предварительным: пока</text><text x="222.5" y="73.9" font-size="2.5" fill="#000">нет подписи проверяющего и нормоконтролёра, отличных от разработчика, он не считается</text><text x="222.5" y="77.3" font-size="2.5" fill="#000">окончательным.</text><text x="347.5" y="67.1" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., автор проекта,</text><text x="347.5" y="70.5" font-size="2.5" fill="#000">05.10.2026. решение автора проекта, оформлено</text><text x="347.5" y="73.9" font-size="2.5" fill="#000">исполнителем по его поручению</text></g><line x1="25" y1="80.4" x2="410" y2="80.4" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-19"><text x="32" y="84.1" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-19</text><text x="40.5" y="84.1" font-size="2.5" fill="#000">05.10.2026</text><text x="62.5" y="84.1" font-size="2.5" fill="#000">л. 29 — План розеток и электровыводов</text><text x="62.5" y="87.5" font-size="2.5" fill="#000">л. 32, 33 — Ведомость электроточек и изделий</text><text x="122.5" y="84.1" font-size="2.5" fill="#000">Розетки ванной Р7 (стиральная машина) и Р8 (фен): по ПУЭ допустимы в зоне</text><text x="122.5" y="87.5" font-size="2.5" fill="#000">3 через УЗО 30 мА, по британской норме BS 7671 (п. 701.512.3) — дальше 2,5</text><text x="122.5" y="90.9" font-size="2.5" fill="#000">м от границы зоны 1; какая норма принята — вопрос К-6.</text><text x="222.5" y="84.1" font-size="2.5" fill="#000">Принята норма ПУЭ (п. 7.1.48): розетки в зоне 3 помещения с ванной допустимы при защите УЗО</text><text x="222.5" y="87.5" font-size="2.5" fill="#000">30 мА. Положение розеток не менялось. Основание: розетки вне зон 0–2 (до границы зоны 1: Р7</text><text x="222.5" y="90.9" font-size="2.5" fill="#000">1630 мм, Р8 — 1441 мм), исполнение IP44, группы 14 и 15 защищены УЗО 30 мА типа A. Это</text><text x="222.5" y="94.3" font-size="2.5" fill="#000">сознательное отступление от зарубежной нормы BS 7671: в России она не действует, по ней в</text><text x="222.5" y="97.7" font-size="2.5" fill="#000">таком месте допустима только бритвенная розетка с разделительным трансформатором.</text><text x="222.5" y="101.1" font-size="2.5" fill="#000">Расстояние Р7 до угла (72 мм при норме от 150 мм) этим решением не затронуто — вопрос К-6.</text><text x="347.5" y="84.1" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., автор проекта,</text><text x="347.5" y="87.5" font-size="2.5" fill="#000">05.10.2026. решение автора проекта, оформлено</text><text x="347.5" y="90.9" font-size="2.5" fill="#000">исполнителем по его поручению</text></g></g><g data-el="issues-roles"><text x="25" y="116.6" font-size="3.5" font-weight="700" fill="#000">Разделы, не сданные к выпуску (сводка ролей)</text><rect x="25" y="119.2" width="385" height="20.2" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="129.2" x2="410" y2="129.2" stroke="#000" stroke-width="0.5"/><text x="32" y="125.1" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="119.2" x2="39" y2="139.4" stroke="#000" stroke-width="0.25"/><text x="84" y="125.1" font-size="2.5" text-anchor="middle" fill="#000">Раздел</text><line x1="129" y1="119.2" x2="129" y2="139.4" stroke="#000" stroke-width="0.25"/><text x="147" y="125.1" font-size="2.5" text-anchor="middle" fill="#000">Состояние</text><line x1="165" y1="119.2" x2="165" y2="139.4" stroke="#000" stroke-width="0.25"/><text x="287.5" y="125.1" font-size="2.5" text-anchor="middle" fill="#000">Причина</text><g data-el="issue-row" data-kind="role" data-id="lowcurrent-engineer"><text x="32" y="132.9" font-size="2.5" text-anchor="middle" fill="#000">1</text><text x="40.5" y="132.9" font-size="2.5" fill="#000">Инженер слаботочки и умного дома</text><text x="130.5" y="132.9" font-size="2.5" fill="#000">Не сдан</text><text x="166.5" y="132.9" font-size="2.5" fill="#000">слаботочка входит в состав заказа (ИЗ-16); выпущен лист «План слаботочных сетей» (раздел электрика); отдельная ведомость слаботочки — кабельный журнал, состав слаботочного щита — не</text><text x="166.5" y="136.3" font-size="2.5" fill="#000">выпущена</text></g></g><g data-el="notes"><text x="25" y="151.8" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="156.6" font-size="2.5" fill="#000">1. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text><text x="25" y="160" font-size="2.5" fill="#000">2. Графа «Если решения нет» показывает состояние решения на листах; влияние на сроки и стоимость по пунктам не оценивалось.</text><text x="25" y="163.4" font-size="2.5" fill="#000">3. Пункт, по которому принято решение, при следующем выпуске комплекта из таблиц исключается.</text></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" fill="#000">05.10.26</text><text x="231" y="270.8" font-size="2.5" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" fill="#000">ГИП</text><text x="251" y="275.8" font-size="2.5" fill="#000">Кырлан А.С.</text><text x="290" y="275.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" fill="#000">05.10.26</text><text x="231" y="285.8" font-size="2.5" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" fill="#000">ГД-2026-004-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" fill="#000">Четырёхкомнатная квартира</text><text x="297" y="259.2" font-size="2.5" textLength="98.65" lengthAdjust="spacingAndGlyphs" fill="#000">Общая площадь 102,67* м² · * размеры со скана, не замерены (реестр — л. 6–11, ИЗ-8, К-20, К-21)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="268.7" font-size="2.5" fill="#000">Дизайн-проект интерьера четырёхкомнатной</text><text x="297" y="272.5" font-size="2.5" fill="#000">квартиры</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">11</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">121</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="283.2" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и</text><text x="330" y="287" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">конфликты. Лист 6 из 6</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="30" data-positions="72" data-basis="5"><rect x="313.01" y="6.2" width="100.49" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="315.01" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 30 (реестр — л. 6–11)</text></g></svg>
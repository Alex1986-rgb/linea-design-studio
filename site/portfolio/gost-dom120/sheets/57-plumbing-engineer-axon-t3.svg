l="none" stroke="#c0392b" stroke-width="0.7" stroke-dasharray="1.6 1"/><path d="M 160.67 156.92 L 161.87 157.92 L 163.07 156.92 L 164.27 157.92" fill="none" stroke="#000" stroke-width="0.25"/><path d="M 160.67 93.92 L 161.87 94.92 L 163.07 93.92 L 164.27 94.92" fill="none" stroke="#000" stroke-width="0.25"/><circle cx="162.47" cy="152.42" r="1.1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/></g><g data-el="riser" data-index="Т3"><path d="M 205.89 114 L 205.89 51" fill="none" stroke="#c0392b" stroke-width="0.7" stroke-dasharray="1.6 1"/><path d="M 204.09 113.5 L 205.29 114.5 L 206.49 113.5 L 207.69 114.5" fill="none" stroke="#000" stroke-width="0.25"/><path d="M 204.09 50.5 L 205.29 51.5 L 206.49 50.5 L 207.69 51.5" fill="none" stroke="#000" stroke-width="0.25"/><circle cx="205.89" cy="109" r="1.1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/></g></g><g data-el="pl-labels"><text x="79.46" y="163.13" font-size="2.5" fill="#555">13 Санузел второго этажа</text><text x="32.73" y="141.49" font-size="2.5" fill="#555">1 Гостиная-кухня</text><text x="156.19" y="88.82" font-size="2.5" fill="#c0392b">Ст Т3-1* Ø32</text><text x="156.19" y="91.82" font-size="2.5" fill="#c0392b">+2,900</text><text x="199.6" y="45.4" font-size="2.5" fill="#c0392b">Ст Т3-2* Ø32</text><text x="199.6" y="48.4" font-size="2.5" fill="#c0392b">+2,900</text><text x="107.6" y="135.45" font-size="2.5" fill="#000" textLength="8.9" lengthAdjust="spacingAndGlyphs">Т3-2 См1**</text><text x="107.6" y="138.45" font-size="2.5" fill="#000">Н=800*</text><text x="146.05" y="128.84" font-size="2.5" fill="#000">Т3-1 Сг2</text><text x="146.05" y="131.84" font-size="2.5" fill="#000">Н=600*</text><text x="172.83" y="93.06" font-size="2.5" fill="#000">Т3-6 Кх2</text><text x="172.83" y="96.06" font-size="2.5" fill="#000">Н=600*</text><text x="130.72" y="134.5" font-size="2.5" fill="#000" textLength="8.9" lengthAdjust="spacingAndGlyphs">Т3-3 См4**</text><text x="130.72" y="137.5" font-size="2.5" fill="#000">Н=600*</text><text x="148.02" y="135.94" font-size="2.5" fill="#c0392b">Ø20</text><text x="148.02" y="138.94" font-size="2.5" fill="#c0392b">L=2,44</text><text x="185.77" y="100.16" font-size="2.5" fill="#c0392b">Ø20</text><text x="185.77" y="103.16" font-size="2.5" fill="#c0392b">L=2,37</text></g></g><g data-el="legend-box"><g data-el="legend"><text x="310" y="25" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><line x1="310.5" y1="31" x2="317.5" y2="31" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><text x="321" y="31.9" font-size="2.5" fill="#000">Т3 — горячее водоснабжение, подача (ГВС), PP-R Ø20</text><circle cx="314" cy="36" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/><text x="321" y="36.9" font-size="2.5" fill="#000">вывод Т3 (код — в ведомости привязок)</text><circle cx="314" cy="41" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="321" y="41.9" font-size="2.5" fill="#000">стояк «Ст К1-N / Ст В1-N» (ГОСТ 21.601), Ø мм</text><circle cx="314" cy="46" r="1.1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/><text x="321" y="46.9" font-size="2.5" fill="#000">стояк в плане (на отметке пола); вертикаль — стояк по высоте,</text><text x="321" y="50.2" font-size="2.5" fill="#000">разрыв — перекрытие</text><circle cx="314" cy="54.3" r="0.6" fill="#000"/><text x="321" y="55.2" font-size="2.5" fill="#000">тройник (ответвление к прибору)</text><path d="M 312 58 L 316 60.6 L 316 58 L 312 60.6 Z" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="321" y="60.2" font-size="2.5" fill="#000">кран шаровой</text><circle cx="314" cy="64.3" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35" stroke-dasharray="0.8 0.6"/><text x="321" y="65.2" font-size="2.5" fill="#000">* стояк Т3 не на обмере — принят в шахте рядом со Ст В1, сверить</text></g></g><g data-el="notes"><text x="25" y="234" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="239" font-size="2.5" fill="#000">1. Схема Т3 построена по тем же трассам, что план разводки: положение в плане сохранено, глубина — в масштабе ×0,5. Трассы принципиальные; фактическое</text><text x="25" y="242.6" font-size="2.5" fill="#000">положение фиксируется исполнительной схемой до закрытия.</text><text x="25" y="246.2" font-size="2.5" fill="#000">2. Высоты Н — от чистого пола помещения, мм. Отметка прокладки магистрали Т3 (в стяжке, в стене или по полу) в данных не задана: участки показаны на</text><text x="25" y="249.8" font-size="2.5" fill="#000">уровне пола условно (записи реестра нет).</text><text x="25" y="253.4" font-size="2.5" fill="#000">3. * — высота вывода принята по практике монтажа; сверить по паспорту прибора.</text><text x="25" y="257" font-size="2.5" fill="#000">4. Узел ввода Т3 (кран, фильтр, счётчик, обратный клапан, кран) — на схеме разводки; состав узла ввода — по согласованию. Кран шаровой — на первом</text><text x="25" y="260.6" font-size="2.5" fill="#000">участке от стояка.</text><text x="25" y="264.2" font-size="2.5" fill="#000">5. Циркуляция ГВС в данных не задана — циркуляционного трубопровода на схеме нет (записи реестра нет).</text><text x="25" y="267.8" font-size="2.5" fill="#000" textLength="152.5" lengthAdjust="spacingAndGlyphs">6. Ст Т3-1*, Ст Т3-2* на обмере не показаны: положение принято (исполнитель по плану заказчика), проект ВК дома не передан, не замерено (К-5); положение</text><text x="25" y="271.4" font-size="2.5" fill="#000">сверить на объекте до разводки.</text><text x="25" y="275" font-size="2.5" fill="#000">7. Трубы испытать давлением до закрытия (акт скрытых работ, опрессовка по СП 73.13330.2016).</text><text x="25" y="278.6" font-size="2.5" fill="#000">8. Диаметры, высоты выводов и места кранов — по паспортам выбранных приборов и расчёту проектной организации.</text><text x="25" y="282.2" font-size="2.5" fill="#000">9. Расчёт систем, диаметры магистралей и подбор оборудования выполняет проектная организация.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="45" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="45" y1="285.5" x2="45" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="47" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="fixture:См1|fixture:См4|riser:Ст Т3-1|riser:Ст Т3-2|riser:Ст К1-1|riser:Ст В1-1|riser:Ст К1-2 (кухня)|riser:Ст В1-2" data-ids="ИЗ-1 К-1 К-2 К-4 К-5 К-7 К-9" data-level="0"><text x="45.5" y="201.4" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="45.5" y="204.8" font-size="2.5" fill="#000">Основа листа: взаимное расположение помещений, контур дома 9600 × 8000 и раскладка этажей подобраны проектировщиком под габариты помещений брифа; обмер и проект АР — задание (К-1);</text><text x="45.5" y="208.2" font-size="2.5" fill="#000">высота потолка 2900 мм — по брифу, не замерена; перекрытие 330 мм и отметка 2-го этажа +3,230 приняты; проект КР — задание (К-2); наружные стены 400 мм, перегородки 120 мм приняты (в</text><text x="45.5" y="211.6" font-size="2.5" fill="#000">брифе толщин нет) (К-1); разрешённая мощность 15 кВт принята по типовым ТУ для частного дома (К-4); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-7).</text><text x="45.5" y="215" font-size="2.5" fill="#000">Знак «*» — принято, не замерено и не подтверждено (замерить на объекте): К-5: Ст Т3-1, Ст Т3-2, Ст К1-1, Ст В1-1, Ст К1-2 (кухня), Ст В1-2 — положение стояка принято проектировщиком (проект</text><text x="45.5" y="218.4" font-size="2.5" fill="#000">ВК дома не передан), не замерено.</text><text x="45.5" y="221.8" font-size="2.5" fill="#000">Знак «**» — предложение проектировщика, заказчиком не утверждено (согласовать с заказчиком): ИЗ-1: См1 — Было у стены В offset 150 — заходила в полосу 600 мм перед проёмом Д-8 и в зону</text><text x="45.5" y="225.2" font-size="2.5" fill="#000">750 перед машиной См3; К-9: См4 — Было offset 500…1100 — пересекалась со стиральной машиной См3.</text><text x="45.5" y="228.6" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 7, записи К-1, К-2, К-4, К-5; лист 8, записи К-7, К-9; лист 9, запись ИЗ-1).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">04.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-012-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Дом 120 м²</text><text x="297" y="259.2" font-size="2.5" data-fit="116" fill="#000">Общая площадь 147,36* м² · * размеры приняты, не замерены (реестр — л. 7–9, К-1)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" data-fit="66" fill="#000">Дизайн-проект интерьера</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">57</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">175</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="282.2" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">Аксонометрическая схема Т3 (горячее</text><text x="330" y="286" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">водоснабжение)</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М 1:50</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="47" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="11" data-positions="85" data-basis="5"><rect x="314.27" y="6.2" width="99.23" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="316.27" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 11 (реестр — л. 7–9)</text></g></svg>
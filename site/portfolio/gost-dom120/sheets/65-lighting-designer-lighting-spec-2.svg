e x1="25" y1="93" x2="255" y2="93" stroke="#000" stroke-width="0.18"/><text x="29.5" y="91.3" font-size="2.5" text-anchor="middle" data-fit="6" fill="#000">10</text><text x="35.5" y="91.3" font-size="2.5" text-anchor="start" data-fit="31" fill="#000">Холл второго этажа</text><text x="69.5" y="91.3" font-size="2.5" text-anchor="start" data-fit="165" fill="#000">общий — L10</text><text x="253.5" y="91.3" font-size="2.5" text-anchor="end" data-fit="16" fill="#000">14</text><line x1="25" y1="99" x2="255" y2="99" stroke="#000" stroke-width="0.18"/><text x="29.5" y="97.3" font-size="2.5" text-anchor="middle" data-fit="6" fill="#000">11</text><text x="35.5" y="97.3" font-size="2.5" text-anchor="start" data-fit="31" fill="#000">Коридор второго этажа</text><text x="69.5" y="97.3" font-size="2.5" text-anchor="start" data-fit="165" fill="#000">общий — L84</text><text x="253.5" y="97.3" font-size="2.5" text-anchor="end" data-fit="16" fill="#000">14</text><line x1="25" y1="105" x2="255" y2="105" stroke="#000" stroke-width="0.18"/><text x="29.5" y="103.3" font-size="2.5" text-anchor="middle" data-fit="6" fill="#000">12</text><text x="35.5" y="103.3" font-size="2.5" text-anchor="start" data-fit="31" fill="#000">Детская вторая</text><text x="69.5" y="103.3" font-size="2.5" text-anchor="start" data-fit="165" fill="#000">общий — L7; рабочий — L9; акцентный — L8</text><text x="253.5" y="103.3" font-size="2.5" text-anchor="end" data-fit="16" fill="#000">168,6</text><text x="29.5" y="109.3" font-size="2.5" text-anchor="middle" data-fit="6" fill="#000">13</text><text x="35.5" y="109.3" font-size="2.5" text-anchor="start" data-fit="31" fill="#000">Санузел второго этажа</text><text x="69.5" y="109.3" font-size="2.5" text-anchor="start" data-fit="165" fill="#000">общий — L4; рабочий — L5</text><text x="253.5" y="109.3" font-size="2.5" text-anchor="end" data-fit="16" fill="#000">26</text></g><g data-el="layers-key"><text x="263" y="23" font-size="3.5" font-weight="700" fill="#000">Слои света</text><text x="263" y="28.5" font-size="2.5" data-fit="147" fill="#000">общий — равномерный свет помещения, по норме освещённости</text><text x="263" y="32.7" font-size="2.5" data-fit="147" fill="#000">рабочий — местный свет задачи: столешница, зеркало, чтение у кровати</text><text x="263" y="36.9" font-size="2.5" data-fit="147" fill="#000">акцентный — подсветка потолка, стен и ниш; не входит в поток общего света</text><text x="263" y="41.1" font-size="2.5" data-fit="147" fill="#000">ночной — путь спальня → санузел: не выше 2700 K, малая яркость, датчик движения</text></g><g data-el="notes"><text x="25" y="241" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="246" font-size="2.5" data-fit="200" fill="#000">1. Продолжение листа 64: позиции, марки и группы — те же, что на основном листе.</text><text x="25" y="249.4" font-size="2.5" data-fit="200" fill="#000">2. Σ Р — установленная мощность освещения помещения, Вт; группы L — по плану выключателей.</text></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4 К-7" data-level="0"><text x="25.5" y="272.1" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="275.5" font-size="2.5" fill="#000">Основа листа: взаимное расположение помещений, контур дома 9600 × 8000 и раскладка этажей подобраны проектировщиком под габариты помещений брифа; обмер и проект АР —</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">задание (К-1); высота потолка 2900 мм — по брифу, не замерена; перекрытие 330 мм и отметка 2-го этажа +3,230 приняты; проект КР — задание (К-2); наружные стены 400 мм,</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">перегородки 120 мм приняты (в брифе толщин нет) (К-1); разрешённая мощность 15 кВт принята по типовым ТУ для частного дома (К-4); подрайон климата не задан — принят не</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">северный (жилые от 2,5 м) (К-7).</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 7, записи К-1, К-2, К-4; лист 8, запись К-7).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.
колерная карта — лист 71)</text><text x="195" y="194.85" font-size="2.5" text-anchor="middle" fill="#000">л. 23</text></g><line x1="25" y1="198.8" x2="210" y2="198.8" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="218.25" font-size="2.5" fill="#000">Визуализации</text><text x="64.5" y="202.95" font-size="2.5" fill="#000">22 изобр.: Вид сверху (3D): планировка с мебелью, текстилем и декором; Вид сверху</text><text x="64.5" y="206.35" font-size="2.5" fill="#000">(3D): планировка с мебелью, текстилем и декором; Визуализация «room-bath-wide»;</text><text x="64.5" y="209.75" font-size="2.5" fill="#000">Визуализация «room-bedroom-wC»; Визуализация «room-bedroom-wD»; Визуализация</text><text x="64.5" y="213.15" font-size="2.5" fill="#000">«room-corridor1-wB»; Визуализация «room-corridor2-wide»; Визуализация</text><text x="64.5" y="216.55" font-size="2.5" fill="#000">«room-corridor3-wide»; Визуализация «room-hall-wA»; Визуализация «room-hall-wB»;</text><text x="64.5" y="219.95" font-size="2.5" fill="#000">Визуализация «room-kids1-wA»; Визуализация «room-kids1-wC»; Визуализация</text><text x="64.5" y="223.35" font-size="2.5" fill="#000">«room-kids2-wA»; Визуализация «room-kids2-wD»; Визуализация «room-living-wA»;</text><text x="64.5" y="226.75" font-size="2.5" fill="#000">Визуализация «room-living-wB»; Визуализация «room-living-wC»; Визуализация</text><text x="64.5" y="230.15" font-size="2.5" fill="#000">«room-storage-wide»; Визуализация «room-study-wA»; Визуализация «room-study-wC»;</text><text x="64.5" y="233.55" font-size="2.5" fill="#000">Визуализация «room-wardrobe-wide»; Визуализация «room-wc-wide»</text><text x="195" y="218.25" font-size="2.5" text-anchor="middle" fill="#000">В1–В22</text></g><line x1="25" y1="235.8" x2="210" y2="235.8" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="241.65" font-size="2.5" fill="#000">Рабочие чертежи</text><text x="64.5" y="239.95" font-size="2.5" fill="#000">планы, развёртки, узлы (развёртки и узлы — листы 103, 108, 110–120, 122, 123,</text><text x="64.5" y="243.35" font-size="2.5" fill="#000">125–127, 132)</text><text x="195" y="241.65" font-size="2.5" text-anchor="middle" fill="#000">л. 1–139</text></g><line x1="25" y1="245.6" x2="210" y2="245.6" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="254.85" font-size="2.5" fill="#000">Спецификации и ведомости</text><text x="64.5" y="254.85" font-size="2.5" fill="#000">оборудование, изделия, отделка, электроточки</text><text x="195" y="249.75" font-size="2.5" text-anchor="middle" fill="#000">л. 20, 21, 27–30,</text><text x="195" y="253.15" font-size="2.5" text-anchor="middle" fill="#000">37, 38, 53, 54,</text><text x="195" y="256.55" font-size="2.5" text-anchor="middle" fill="#000">69–75, 80–82,</text><text x="195" y="259.95" font-size="2.5" text-anchor="middle" fill="#000">133–137</text></g></g><g data-deviation="sheets-count-every-sheet"/><g data-deviation="scale-in-stamp"/><g data-deviation="elevation-1:40"/><g data-deviation="dim-font-2.5"/><g data-deviation="room-circle-8"/><g data-el="general-ref"><text x="25" y="290.2" font-size="2.5" textLength="177.51" lengthAdjust="spacingAndGlyphs" fill="#000">Общие указания — лист 6: ±0,000 — чистый пол 1-го этажа; несущие конструкции и сети — по отдельному проекту; скрытые работы — по актам. Вопросы и допущения — листы 7, 8.</text><g data-el="open-issues-ref" data-target="7"/></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4 К-7" data-level="0"><text x="25.5" y="267.6" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="271" font-size="2.5" fill="#000">Основа листа: взаимное расположение помещений, контур дома 9600 × 8000 и раскладка этажей подобраны проектировщиком под габариты помещений брифа; обмер и проект АР —</text><text x="25.5" y="274.4" font-size="2.5" fill="#000">задание (К-1); высота потолка 2900 мм — по брифу, не замерена; перекрытие 330 мм и отметка 2-го этажа +3,230 приняты; проект КР — задание (К-2); наружные стены 400 мм,</text><text x="25.5" y="277.8" font-size="2.5" fill="#000">перегородки 120 мм приняты (в брифе толщин нет) (К-1); разрешённая мощность 15 кВт принята по типовым ТУ для частного дома (К-4); подрайон климата не задан — принят не</text><text x="25.5" y="281.2" font-size="2.5" fill="#000">северный (жилые от 2,5 м) (К-7).</text><text x="25.5" y="284.6" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 7, записи К-1, К-2, К-4, К-7).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" fill="#000">21.10.26</text><text x="231" y="270.8" font-size="2.5" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" fill="#000">ГД-2026-012-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" fill="#000">Дом 120 м²</text><text x="297" y="259.2" font-size="2.5" fill="#000">Общая площадь 147,36* м² · * размеры приняты, не замерены (реестр — л. 7, 8, К-1)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" fill="#000">Дизайн-проект интерьера</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="mi
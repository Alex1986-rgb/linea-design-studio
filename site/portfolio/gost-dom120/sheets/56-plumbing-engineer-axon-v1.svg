="0.35"/></g><g data-el="pl-outlet" data-index="В1"><circle cx="177.93" cy="95.88" r="1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="В1"><circle cx="171.37" cy="143.24" r="1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="В1"><circle cx="161.11" cy="153.5" r="1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/></g></g><g data-el="risers"><g data-el="riser" data-index="В1"><path d="M 161.55 159.25 L 161.55 96.25" fill="none" stroke="#1f5fbf" stroke-width="0.7" stroke-dasharray="1.6 1"/><path d="M 159.75 158.75 L 160.95 159.75 L 162.15 158.75 L 163.35 159.75" fill="none" stroke="#000" stroke-width="0.25"/><path d="M 159.75 95.75 L 160.95 96.75 L 162.15 95.75 L 163.35 96.75" fill="none" stroke="#000" stroke-width="0.25"/><circle cx="161.55" cy="154.25" r="1.1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/></g><g data-el="riser" data-index="В1"><path d="M 206.81 114 L 206.81 51" fill="none" stroke="#1f5fbf" stroke-width="0.7" stroke-dasharray="1.6 1"/><path d="M 205.01 113.5 L 206.21 114.5 L 207.41 113.5 L 208.61 114.5" fill="none" stroke="#000" stroke-width="0.25"/><path d="M 205.01 50.5 L 206.21 51.5 L 207.41 50.5 L 208.61 51.5" fill="none" stroke="#000" stroke-width="0.25"/><circle cx="206.81" cy="109" r="1.1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/></g></g><g data-el="pl-labels"><text x="79.46" y="164.05" font-size="2.5" fill="#555">13 Санузел второго этажа</text><text x="32.73" y="142.41" font-size="2.5" fill="#555">1 Гостиная-кухня</text><text x="155.21" y="90.65" font-size="2.5" fill="#1f5fbf">Ст В1-1* Ø32</text><text x="155.21" y="93.65" font-size="2.5" fill="#1f5fbf">+2,900</text><text x="200.46" y="45.4" font-size="2.5" fill="#1f5fbf">Ст В1-2* Ø32</text><text x="200.46" y="48.4" font-size="2.5" fill="#1f5fbf">+2,900</text><text x="210.11" y="105" font-size="2.5" fill="#000">±0,000</text><text x="108.61" y="135.31" font-size="2.5" fill="#000" textLength="9" lengthAdjust="spacingAndGlyphs">В1-3 См1**</text><text x="108.61" y="138.31" font-size="2.5" fill="#000">Н=800*</text><text x="148.05" y="129.76" font-size="2.5" fill="#000">В1-2 Сг2</text><text x="148.05" y="132.76" font-size="2.5" fill="#000">Н=600*</text><text x="174.83" y="89.28" font-size="2.5" fill="#000">В1-7 Кх2</text><text x="174.83" y="92.28" font-size="2.5" fill="#000">Н=600*</text><text x="132.6" y="135.42" font-size="2.5" fill="#000" textLength="9" lengthAdjust="spacingAndGlyphs">В1-6 См4**</text><text x="132.6" y="138.42" font-size="2.5" fill="#000">Н=600*</text><text x="179.83" y="99.68" font-size="2.5" fill="#000">В1-8 Кх3</text><text x="179.83" y="102.68" font-size="2.5" fill="#000">Н=550*</text><text x="167.2" y="136.24" font-size="2.5" fill="#000">В1-1 Сг1</text><text x="167.2" y="139.24" font-size="2.5" fill="#000">Н=250*</text><text x="149.88" y="136.51" font-size="2.5" fill="#1f5fbf">Ø20</text><text x="149.88" y="139.51" font-size="2.5" fill="#1f5fbf">L=3,13</text><text x="192.68" y="102.13" font-size="2.5" fill="#1f5fbf">Ø20</text><text x="192.68" y="105.13" font-size="2.5" fill="#1f5fbf">L=2,24</text><text x="143.25" y="166.4" font-size="2.5" fill="#1f5fbf">Ø20</text><text x="143.25" y="169.4" font-size="2.5" fill="#1f5fbf">L=2,12</text></g></g><g data-el="legend-box"><g data-el="legend"><text x="310" y="25" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><line x1="310.5" y1="31" x2="317.5" y2="31" stroke="#1f5fbf" stroke-width="0.5"/><text x="321" y="31.9" font-size="2.5" fill="#000">В1 — водопровод хозяйственно-питьевой (ХВС), PP-R Ø20</text><circle cx="314" cy="36" r="1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/><text x="321" y="36.9" font-size="2.5" fill="#000">вывод В1 (код — в ведомости привязок)</text><circle cx="314" cy="41" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="321" y="41.9" font-size="2.5" fill="#000">стояк «Ст К1-N / Ст В1-N» (ГОСТ 21.601), Ø мм</text><circle cx="314" cy="46" r="1.1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/><text x="321" y="46.9" font-size="2.5" fill="#000">стояк в плане (на отметке пола); вертикаль — стояк по высоте,</text><text x="321" y="50.2" font-size="2.5" fill="#000">разрыв — перекрытие</text><circle cx="314" cy="54.3" r="0.6" fill="#000"/><text x="321" y="55.2" font-size="2.5" fill="#000">тройник (ответвление к прибору)</text><path d="M 312 58 L 316 60.6 L 316 58 L 312 60.6 Z" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="321" y="60.2" font-size="2.5" fill="#000">кран шаровой</text><circle cx="314" cy="64.3" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35" stroke-dasharray="0.8 0.6"/><text x="321" y="65.2" font-size="2.5" fill="#000">* стояк Т3 не на обмере — принят в шахте рядом со Ст В1, сверить</text></g></g><g data-el="notes"><text x="25" y="237" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="242" font-size="2.5" fill="#000">1. Схема В1 построена по тем же трассам, что план разводки: положение в плане сохранено, глубина — в масштабе ×0,5. Трассы принципиальные; фактическое</text><text x="25" y="245.6" font-size="2.5" fill="#000">положение фиксируется исполнительной схемой до закрытия.</text><text x="25" y="249.2" font-size="2.5" fill="#000">2. Высоты Н — от чистого пола помещения, мм. Отметка прокладки магистрали В1 (в стяжке, в стене или по полу) в данных не задана: участки показаны на</text><text x="25" y="252.8" font-size="2.5" fill="#000">уровне пола условно (записи реестра нет).</text><text x="25" y="256.4" font-size="2.5" fill="#000">3. * — высота вывода принята по практике монтажа; сверить по паспорту прибора.</text><text x="25" y="260" font-size="2.5" fill="#000">4. Узел ввода В1 (кран, фильтр, счётчик, обратный клапан, кран) — на схеме разводки; состав узла ввода — по согласованию. Кран шаровой — на первом</text><text x="25" y="263.6" font-size="2.5" fill="#000">участке от стояка.</text><text x="25" y="267.2" font-size="2.5" fill="#000" textLength="152.73" lengthAdjust="spacingAndGlyphs">5. Ст В1-1*, Ст В1-2* на обмере не показаны: положение принято (исполнитель по плану заказчика), проект ВК дома не передан, не замерено (К-5); положение</text><text x="25" y="270.8" font-size="2.5" fill="#000">сверить на объекте до разводки.</text><text x="25" y="274.4" font-size="2.5" fill="#000">6. Трубы испытать давлением до закрытия (акт скрытых работ, опрессовка по СП 73.13330.2016).</text><text x="25" y="278" font-size="2.5" fill="#000">7. Диаметры, высоты выводов и места кранов — по паспортам выбранных приборов и расчёту проектной организации.</text><text x="25" y="281.6" font-size="2.5" fill="#000">8. Расчёт систем, диаметры магистралей и подбор оборудования выполняет проектная организация.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="45" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="45" y1="285.5" x2="45" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="47" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="fixture:См1|fixture:См4|riser:Ст В1-1|riser:Ст В1-2|riser:Ст К1-1|riser:Ст Т3-1|riser:Ст К1-2 (кухня)|riser:Ст Т3-2" data-ids="ИЗ-1 К-1 К-2 К-4 К-5 К-7 К-9" data-level="0"><text x="45.5" y="204.4" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="45.5" y="207.8" font-size="2.5" fill="#000">Основа листа: взаимное расположение помещений, контур дома 9600 × 8000 и раскладка этажей подобраны проектировщиком под габариты помещений брифа; обмер и проект АР — задание (К-1);</text><text x="45.5" y="211.2" font-size="2.5" fill="#000">высота потолка 2900 мм — по брифу, не замерена; перекрытие 330 мм и отметка 2-го этажа +3,230 приняты; проект КР — задание (К-2); наружные стены 400 мм, перегородки 120 мм приняты (в</text><text x="45.5" y="214.6" font-size="2.5" fill="#000">брифе толщин нет) (К-1); разрешённая мощность 15 кВт принята по типовым ТУ для частного дома (К-4); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-7).</text><text x="45.5" y="218" font-size="2.5" fill="#000">Знак «*» — принято, не замерено и не подтверждено (замерить на объекте): К-5: Ст В1-1, Ст В1-2, Ст К1-1, Ст Т3-1, Ст К1-2 (кухня), Ст Т3-2 — положение стояка принято проектировщиком (проект</text><text x="45.5" y="221.4" font-size="2.5" fill="#000">ВК дома не передан), не замерено.</text><text x="45.5" y="224.8" font-size="2.5" fill="#000">Знак «**» — предложение проектировщика, заказчиком не утверждено (согласовать с заказчиком): ИЗ-1: См1 — Было у стены В offset 150 — заходила в полосу 600 мм перед проёмом Д-8 и в зону</text><text x="45.5" y="228.2" font-size="2.5" fill="#000">750 перед машиной См3; К-9: См4 — Было offset 500…1100 — пересекалась со стиральной машиной См3.</text><text x="45.5" y="231.6" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 7, записи К-1, К-2, К-4, К-5; лист 8, записи К-7, К-9; лист 9, запись ИЗ-1).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><l
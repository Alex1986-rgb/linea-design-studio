<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты. Лист 1 из 2</text><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации (стартовое совещание 19.10.2026)</text><g data-el="open-issues" data-plan="fixed" data-plan-declared="2"><text x="25" y="27.2" font-size="2.5" fill="#000">Комплект предварительный по пунктам этих таблиц. Пока по пункту нет ответа или решения, показанное на указанном листе — допущение проектировщика, а не утверждённое решение.</text><text x="25" y="30.6" font-size="2.5" fill="#000">Сводка: открытых вопросов — 7 (из них ждут факта объекта — 3: контрольного обмера, обследования или документа).</text><text x="25" y="34" font-size="2.5" fill="#000">Пункты, ответ на которые лежит на объекте, а не за столом проектировщика (графа «Вид», строка «Ждёт»), собраны на листе «Задание на контрольный обмер и обследование» (листы 8–11): что и где замерить, с какой точностью и чем подтвердить. Пункты, ждущие решения человека, на объекте не</text><text x="25" y="37.4" font-size="2.5" fill="#000">закрываются.</text><g data-el="issues-questions"><text x="25" y="49" font-size="3.5" font-weight="700" fill="#000">Открытые вопросы и принятые допущения</text><rect x="25" y="51.6" width="385" height="156.2" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="61.6" x2="410" y2="61.6" stroke="#000" stroke-width="0.5"/><text x="32" y="57.5" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="51.6" x2="39" y2="207.8" stroke="#000" stroke-width="0.25"/><text x="122" y="57.5" font-size="2.5" text-anchor="middle" fill="#000">Формулировка</text><line x1="205" y1="51.6" x2="205" y2="207.8" stroke="#000" stroke-width="0.25"/><text x="220" y="57.5" font-size="2.5" text-anchor="middle" fill="#000">Вид</text><line x1="235" y1="51.6" x2="235" y2="207.8" stroke="#000" stroke-width="0.25"/><text x="253" y="57.5" font-size="2.5" text-anchor="middle" fill="#000">Кто решает</text><line x1="271" y1="51.6" x2="271" y2="207.8" stroke="#000" stroke-width="0.25"/><text x="309.5" y="57.5" font-size="2.5" text-anchor="middle" fill="#000">Если решения нет</text><line x1="348" y1="51.6" x2="348" y2="207.8" stroke="#000" stroke-width="0.25"/><text x="379" y="57.5" font-size="2.5" text-anchor="middle" fill="#000">Лист, где это проявляется</text><g data-el="issue-row" data-kind="question" data-id="К-1"><text x="32" y="65.3" font-size="2.5" text-anchor="middle" fill="#000">К-1</text><text x="40.5" y="65.3" font-size="2.5" fill="#000">Бриф задаёт 11 помещений с габаритами и этажами, но не их взаимное расположение, контур дома и толщины стен: раскладка</text><text x="40.5" y="68.7" font-size="2.5" fill="#000">этажей, контур 9600 × 8000 и перегородки подобраны проектировщиком под габариты брифа. До заказа мебели, дверей и</text><text x="40.5" y="72.1" font-size="2.5" fill="#000">материалов нужен обмер или проект дома (АР).</text><text x="206.5" y="65.3" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="68.7" font-size="2.5" fill="#000">Ждёт: обмера</text><text x="236.5" y="65.3" font-size="2.5" fill="#000">Архитектор-планировщик</text><text x="272.5" y="65.3" font-size="2.5" fill="#000">размеры на листах — предложение проектировщика по</text><text x="272.5" y="68.7" font-size="2.5" fill="#000">брифу, уточняются по месту; мебель на заказ и материалы</text><text x="272.5" y="72.1" font-size="2.5" fill="#000">по ним не заказывать</text><text x="349.5" y="65.3" font-size="2.5" fill="#000">л. 15, 16 — Обмерный план</text><text x="349.5" y="68.7" font-size="2.5" fill="#000">л. 15–20, 22–25, 30–35, 40–51, 54, 55, 63–65, 68,</text><text x="349.5" y="72.1" font-size="2.5" fill="#000">69, 74, 75, 80, 81, 120–122, 125–128 — 1-й этаж</text><text x="349.5" y="75.5" font-size="2.5" fill="#000">л. 24, 25 — План расстановки мебели</text><text x="349.5" y="78.9" font-size="2.5" fill="#000">л. 15–20, 22–25, 30–35, 40–51, 54, 55, 63–65, 68,</text><text x="349.5" y="82.3" font-size="2.5" fill="#000">69, 74, 75, 80, 81, 120–122, 125–128 — 1-й этаж</text></g><line x1="25" y1="85.4" x2="410" y2="85.4" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-2"><text x="32" y="89.1" font-size="2.5" text-anchor="middle" fill="#000">К-2</text><text x="40.5" y="89.1" font-size="2.5" fill="#000">Высота потолка 2900 мм — по брифу (не замерена); конструкция и толщина перекрытия не заданы — принято 330 мм с полом,</text><text x="40.5" y="92.5" font-size="2.5" fill="#000">отметка чистого пола 2-го этажа +3,230. Нужен проект КР дома.</text><text x="206.5" y="89.1" font-size="2.5" fill="#000">Отсутствует</text><text x="236.5" y="89.1" font-size="2.5" fill="#000">Архитектор-планировщик</text><text x="272.5" y="89.1" font-size="2.5" fill="#000">высоты на развёртках, отметка 2-го этажа и лестница — от</text><text x="272.5" y="92.5" font-size="2.5" fill="#000">принятых 2900 / +3,230, уточнить по проекту КР</text><text x="349.5" y="89.1" font-size="2.5" fill="#000">л. 15, 16 — Обмерный план</text><text x="349.5" y="92.5" font-size="2.5" fill="#000">л. 15–20, 22–25, 30–35, 40–51, 54, 55, 63–65, 68,</text><text x="349.5" y="95.9" font-size="2.5" fill="#000">69, 74, 75, 80, 81, 120–122, 125–128 — 1-й этаж</text><text x="349.5" y="99.3" font-size="2.5" fill="#000">л. 54, 55 — План потолков</text><text x="349.5" y="102.7" font-size="2.5" fill="#000">л. 15–20, 22–25, 30–35, 40–51, 54, 55, 63–65, 68,</text><text x="349.5" y="106.1" font-size="2.5" fill="#000">69, 74, 75, 80, 81, 120–122, 125–128 — 1-й этаж</text></g><line x1="25" y1="109.2" x2="410" y2="109.2" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-3"><text x="32" y="112.9" font-size="2.5" text-anchor="middle" fill="#000">К-3</text><text x="40.5" y="112.9" font-size="2.5" fill="#000">Лестница по брифу — из холла 1-го этажа; место, тип (одномаршевая прямая, 17 подъёмов 190 × 250, марш 1000), конструкция и</text><text x="40.5" y="116.3" font-size="2.5" fill="#000">ограждение — предложение проектировщика. Расчёт несущей конструкции марша и проёма в перекрытии — проект КР.</text><text x="206.5" y="112.9" font-size="2.5" fill="#000">Отсутствует</text><text x="236.5" y="112.9" font-size="2.5" fill="#000">Архитектор-планировщик</text><text x="272.5" y="112.9" font-size="2.5" fill="#000">лестница на планах — предложение, к изготовлению не</text><text x="272.5" y="116.3" font-size="2.5" fill="#000">выдаётся до проекта КР</text><text x="349.5" y="112.9" font-size="2.5" fill="#000">л. 15, 16 — Обмерный план</text><text x="349.5" y="116.3" font-size="2.5" fill="#000">л. 15–20, 22–25, 30–35, 40–51, 54, 55, 63–65, 68,</text><text x="349.5" y="119.7" font-size="2.5" fill="#000">69, 74, 75, 80, 81, 120–122, 125–128 — 1-й этаж</text></g><line x1="25" y1="122.8" x2="410" y2="122.8" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-4"><text x="32" y="126.5" font-size="2.5" text-anchor="middle" fill="#000">К-4</text><text x="40.5" y="126.5" font-size="2.5" fill="#000">Разрешённая мощность дома по ТУ неизвестна, принята 15 кВт.</text><text x="206.5" y="126.5" font-size="2.5" fill="#000">Отсутствует</text><text x="236.5" y="126.5" font-size="2.5" fill="#000">Инженер-электрик</text><text x="272.5" y="126.5" font-size="2.5" fill="#000">щит и группы рассчитаны на 15 кВт; при других ТУ</text><text x="272.5" y="129.9" font-size="2.5" fill="#000">пересчёт</text><text x="349.5" y="126.5" font-size="2.5" fill="#000">л. 38 — Однолинейная схема щита</text><text x="349.5" y="129.9" font-size="2.5" fill="#000">л. 30, 31 — План розеток и электровыводов</text><text x="349.5" y="133.3" font-size="2.5" fill="#000">л. 15–20, 22–25, 30–35, 40–51, 54, 55, 63–65, 68,</text><text x="349.5" y="136.7" font-size="2.5" fill="#000">69, 74, 75, 80, 81, 120–122, 125–128 — 1-й этаж</text></g><line x1="25" y1="139.8" x2="410" y2="139.8" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-5"><text x="32" y="143.5" font-size="2.5" text-anchor="middle" fill="#000">К-5</text><text x="40.5" y="143.5" font-size="2.5" fill="#000">Тип дома, материал и конструкция стен и перекрытия, несущие стены, положение стояков, выпусков канализации и вентканалов в</text><text x="40.5" y="146.9" font-size="2.5" fill="#000">брифе не заданы; проект дома (АР, КР, ВК, ОВ) не передан. Стояки и вентканалы на планах показаны по предложению</text><text x="40.5" y="150.3" font-size="2.5" fill="#000">проектировщика.</text><text x="206.5" y="143.5" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="146.9" font-size="2.5" fill="#000">Ждёт: документа</text><text x="236.5" y="143.5" font-size="2.5" fill="#000">Архитектор-планировщик</text><text x="272.5" y="143.5" font-size="2.5" fill="#000">все существующие стены считаются несущими: проёмы и</text><text x="272.5" y="146.9" font-size="2.5" fill="#000">перегородки — предложение, к строительству не выдаются;</text><text x="272.5" y="150.3" font-size="2.5" fill="#000">стояки — предложение</text><text x="349.5" y="143.5" font-size="2.5" fill="#000">л. 15, 16 — Обмерный план</text><text x="349.5" y="146.9" font-size="2.5" fill="#000">л. 15–20, 22–25, 30–35, 40–51, 54, 55, 63–65, 68,</text><text x="349.5" y="150.3" font-size="2.5" fill="#000">69, 74, 75, 80, 81, 120–122, 125–128 — 1-й этаж</text><text x="349.5" y="153.7" font-size="2.5" fill="#000">л. 50, 51 — Схема разводки водопровода и</text><text x="349.5" y="157.1" font-size="2.5" fill="#000">канализации</text><text x="349.5" y="160.5" font-size="2.5" fill="#000">л. 15–20, 22–25, 30–35, 40–51, 54, 55, 63–65, 68,</text><text x="349.5" y="163.9" font-size="2.5" fill="#000">69, 74, 75, 80, 81, 120–122, 125–128 — 1-й этаж</text></g><line x1="25" y1="167" x2="410" y2="167" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-6"><text x="32" y="170.7" font-size="2.5" text-anchor="middle" fill="#000">К-6</text><text x="40.5" y="170.7" font-size="2.5" fill="#000">Источник отопления и горячей воды (котёл: газ / электро, его место, котельная) брифом не задан; в составе помещений брифа</text><text x="40.5" y="174.1" font-size="2.5" fill="#000">котельной нет. Отопительные приборы на листах — водяные радиаторы под окнами при любом источнике тепла.</text><text x="206.5" y="170.7" font-size="2.5" fill="#000">Решение</text><text x="236.5" y="170.7" font-size="2.5" fill="#000">Инженер ОВ</text><text x="272.5" y="170.7" font-size="2.5" fill="#000">радиаторы и трассы — предложение; котёл, котельная и</text><text x="272.5" y="174.1" font-size="2.5" fill="#000">ввод газа — после ответа заказчика</text><text x="349.5" y="170.7" font-size="2.5" fill="#000">л. 46, 47 — План отопления</text><text x="349.5" y="174.1" font-size="2.5" fill="#000">л. 15–20, 22–25, 30–35, 40–51, 54, 55, 63–65, 68,</text><text x="349.5" y="177.5" font-size="2.5" fill="#000">69, 74, 75, 80, 81, 120–122, 125–128 — 1-й этаж</text><text x="349.5" y="180.9" font-size="2.5" fill="#000">л. 50, 51 — Схема разводки водопровода и</text><text x="349.5" y="184.3" font-size="2.5" fill="#000">канализации</text><text x="349.5" y="187.7" font-size="2.5" fill="#000">л. 15–20, 22–25, 30–35, 40–51, 54, 55, 63–65, 68,</text><text x="349.5" y="191.1" font-size="2.5" fill="#000">69, 74, 75, 80, 81, 120–122, 125–128 — 1-й этаж</text></g><line x1="25" y1="194.2" x2="410" y2="194.2" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-7"><text x="32" y="197.9" font-size="2.5" text-anchor="middle" fill="#000">К-7</text><text x="40.5" y="197.9" font-size="2.5" fill="#000">Климатический подрайон (СП 131.13330) не задан: принят не северный — жилые комнаты и кухня под потолком от 2,5 м (СП 54, п.</text><text x="40.5" y="201.3" font-size="2.5" fill="#000">5.12); в IА, IБ, IГ, IД, IVА — от 2,7 м.</text><text x="206.5" y="197.9" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="201.3" font-size="2.5" fill="#000">Ждёт: документа</text><text x="236.5" y="197.9" font-size="2.5" fill="#000">Архитектор-планировщик</text><text x="272.5" y="197.9" font-size="2.5" fill="#000">отметки потолков жилых — по 2,5 м; при северном</text><text x="272.5" y="201.3" font-size="2.5" fill="#000">подрайоне уровни ниже 2,7 м пересчитать до заказа каркаса</text><text x="349.5" y="197.9" font-size="2.5" fill="#000">л. 54, 55 — План потолков</text><text x="349.5" y="201.3" font-size="2.5" fill="#000">л. 15–20, 22–25, 30–35, 40–51, 54, 55, 63–65, 68,</text><text x="349.5" y="204.7" font-size="2.5" fill="#000">69, 74, 75, 80, 81, 120–122, 125–128 — 1-й этаж</text></g></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237
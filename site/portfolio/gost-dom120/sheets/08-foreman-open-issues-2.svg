<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Открытые вопросы, принятые допущения и конфликты. Лист 2 из 3" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты. Лист 2 из 3</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации (стартовое совещание 19.10.2026)</text><g data-el="open-issues" data-plan="fixed" data-plan-declared="3"><g data-el="issues-questions"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Открытые вопросы и принятые допущения (продолжение)</text><rect x="25" y="33" width="385" height="81.4" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="32" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="33" x2="39" y2="114.4" stroke="#000" stroke-width="0.25"/><text x="122" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Формулировка</text><line x1="205" y1="33" x2="205" y2="114.4" stroke="#000" stroke-width="0.25"/><text x="220" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Вид</text><line x1="235" y1="33" x2="235" y2="114.4" stroke="#000" stroke-width="0.25"/><text x="253" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Кто решает</text><line x1="271" y1="33" x2="271" y2="114.4" stroke="#000" stroke-width="0.25"/><text x="309.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Если решения нет</text><line x1="348" y1="33" x2="348" y2="114.4" stroke="#000" stroke-width="0.25"/><text x="379" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Лист, где это проявляется</text><g data-el="issue-row" data-kind="question" data-id="К-7"><text x="32" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">К-7</text><text x="40.5" y="46.7" font-size="2.5" fill="#000">Климатический подрайон (СП 131.13330) не задан: принят не северный — жилые комнаты и кухня под потолком от 2,5 м (СП 54, п.</text><text x="40.5" y="50.1" font-size="2.5" fill="#000">5.12); в IА, IБ, IГ, IД, IVА — от 2,7 м.</text><text x="206.5" y="46.7" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="50.1" font-size="2.5" fill="#000">Ждёт: документа</text><text x="236.5" y="46.7" font-size="2.5" fill="#000">Архитектор-планировщик</text><text x="272.5" y="46.7" font-size="2.5" fill="#000">отметки потолков жилых — по 2,5 м; при северном</text><text x="272.5" y="50.1" font-size="2.5" fill="#000">подрайоне уровни ниже 2,7 м пересчитать до заказа каркаса</text><text x="349.5" y="46.7" font-size="2.5" fill="#000">л. 66, 67 — План потолков</text><text x="349.5" y="50.1" font-size="2.5" fill="#000">л. 17–22, 25–28, 34–39, 44–55, 61, 62, 66, 67,</text><text x="349.5" y="53.5" font-size="2.5" fill="#000">77–79, 83, 84, 89, 90, 96, 97, 116, 117, 155–159,</text><text x="349.5" y="56.9" font-size="2.5" fill="#000">164–167 — 1-й этаж</text></g><line x1="25" y1="60" x2="410" y2="60" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-8"><text x="32" y="63.7" font-size="2.5" text-anchor="middle" fill="#000">К-8</text><text x="40.5" y="63.7" font-size="2.5" fill="#000">Кухня (пом. 1): мойка Кх2 и модули Кх1, Кх3 стоят под окном 1500 × 1500 стены А с низом проёма +0,900 — подоконник в уровне</text><text x="40.5" y="67.1" font-size="2.5" fill="#000">столешницы (+0,900). Смеситель мойки упирается в створку, открывающуюся внутрь, примыкание столешницы к откосу и</text><text x="40.5" y="70.5" font-size="2.5" fill="#000">подоконнику не решено. Нужно решение заказчика: створка над мойкой глухая или поворотно-откидная (откидывание над</text><text x="40.5" y="73.9" font-size="2.5" fill="#000">смесителем), либо поднять низ окна (подоконник выше столешницы на высоту смесителя), либо столешница заходит в проём вместо</text><text x="40.5" y="77.3" font-size="2.5" fill="#000">подоконника.</text><text x="206.5" y="63.7" font-size="2.5" fill="#000">Решение</text><text x="206.5" y="67.1" font-size="2.5" fill="#000">Ждёт: решения</text><text x="236.5" y="63.7" font-size="2.5" fill="#000">Дизайнер интерьера</text><text x="272.5" y="63.7" font-size="2.5" fill="#000">столешница у окна не раскраивается, мойка Кх2 и</text><text x="272.5" y="67.1" font-size="2.5" fill="#000">смеситель не заказываются; монтажная схема кухни</text><text x="272.5" y="70.5" font-size="2.5" fill="#000">показывает проём и конфликт</text><text x="349.5" y="63.7" font-size="2.5" fill="#000">л. 108 — Кухня (пом. 1). Монтажная схема</text></g><line x1="25" y1="80.4" x2="410" y2="80.4" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-9"><text x="32" y="84.1" font-size="2.5" text-anchor="middle" fill="#000">К-9</text><text x="40.5" y="84.1" font-size="2.5" fill="#000">Умывальник См4 (пом. 13 «Санузел второго этажа»), выпуск К1-4 Ø50: трасса до Ст К1-1 (2,54 м) идёт под дверным проёмом Д-8</text><text x="40.5" y="87.5" font-size="2.5" fill="#000">— короб над полом там не поставить. Решить: (а) прибор ближе к стояку Ст К1-1 (без прохода под проёмом); (б) выпуск в полу с</text><text x="40.5" y="90.9" font-size="2.5" fill="#000">подъёмом пола помещения на 130 мм; (в) насосная установка (КНС) у прибора — по паспорту, требует согласования. Решение</text><text x="40.5" y="94.3" font-size="2.5" fill="#000">меняет санузел (высоты, раскладку плитки) — за автором с заказчиком.</text><text x="206.5" y="84.1" font-size="2.5" fill="#000">Спорно</text><text x="206.5" y="87.5" font-size="2.5" fill="#000">Ждёт: решения</text><text x="236.5" y="84.1" font-size="2.5" fill="#000">Инженер ВК (вода,</text><text x="236.5" y="87.5" font-size="2.5" fill="#000">канализация)</text><text x="272.5" y="84.1" font-size="2.5" fill="#000">выпуск К1-4 и прибор См4 не выполнять до решения;</text><text x="272.5" y="87.5" font-size="2.5" fill="#000">остальное — по листам</text><text x="349.5" y="84.1" font-size="2.5" fill="#000">л. 54, 55 — Схема разводки водопровода и</text><text x="349.5" y="87.5" font-size="2.5" fill="#000">канализации</text><text x="349.5" y="90.9" font-size="2.5" fill="#000">л. 17–22, 25–28, 34–39, 44–55, 61, 62, 66, 67,</text><text x="349.5" y="94.3" font-size="2.5" fill="#000">77–79, 83, 84, 89, 90, 96, 97, 116, 117, 155–159,</text><text x="349.5" y="97.7" font-size="2.5" fill="#000">164–167 — 1-й этаж</text><text x="349.5" y="101.1" font-size="2.5" fill="#000">л. 52, 53 — План выводов сантехники</text><text x="349.5" y="104.5" font-size="2.5" fill="#000">л. 17–22, 25–28, 34–39, 44–55, 61, 62, 66, 67,</text><text x="349.5" y="107.9" font-size="2.5" fill="#000">77–79, 83, 84, 89, 90, 96, 97, 116, 117, 155–159,</text><text x="349.5" y="111.3" font-size="2.5" fill="#000">164–167 — 1-й этаж</text></g></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">04.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-012-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Дом 120 м²</text><text x="297" y="259.2" font-size="2.5" data-fit="116" fill="#000">Общая площадь 147,36* м² · * размеры приняты, не замерены (реестр — л. 7–9, К-1)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" data-fit="66" fill="#000">Дизайн-проект интерьера</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">8</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">175</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="283.1" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">Открытые вопросы, принятые допущения и</text><text x="330" y="286.9" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">конфликты. Лист 2 из 3</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="47" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="11" data-positions="85" data-basis="5"><rect x="314.27" y="6.2" width="99.23" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="316.27" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 11 (реестр — л. 7–9)</text></g></svg>
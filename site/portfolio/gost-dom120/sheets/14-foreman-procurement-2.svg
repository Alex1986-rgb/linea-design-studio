<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">График закупок и работ. Лист 2 из 3</text><text x="25" y="17.8" font-size="2.5" fill="#333">Что заказывать и когда не раньше чего: относительный порядок без дат; срок поставки — из данных или «уточняется у поставщика»</text><g data-el="proc-schedule" data-plan="fixed" data-plan-declared="3"><g data-el="proc-buy"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Закупки: что заказывается, от чего зависит заказ и какую работу блокирует (продолжение)</text><rect x="25" y="33" width="385" height="125.6" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="31" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="37" y1="33" x2="37" y2="158.6" stroke="#000" stroke-width="0.25"/><text x="70" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Позиция и где</text><line x1="103" y1="33" x2="103" y2="158.6" stroke="#000" stroke-width="0.25"/><text x="131" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">1. Замер до заказа</text><line x1="159" y1="33" x2="159" y2="158.6" stroke="#000" stroke-width="0.25"/><text x="187" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">2. Решение, выбор изделия, паспорт</text><line x1="215" y1="33" x2="215" y2="158.6" stroke="#000" stroke-width="0.25"/><text x="241" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">3. Условие заказа</text><line x1="267" y1="33" x2="267" y2="158.6" stroke="#000" stroke-width="0.25"/><text x="287" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">4. Срок поставки</text><line x1="307" y1="33" x2="307" y2="158.6" stroke="#000" stroke-width="0.25"/><text x="335" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">5. Блокирует работу</text><line x1="363" y1="33" x2="363" y2="158.6" stroke="#000" stroke-width="0.25"/><text x="386.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Закрывает вопросы реестра</text><g data-el="proc-row" data-id="З-6" data-kind="tile" data-lead="" data-lead-src="none" data-need="Р-9" data-closes=""><text x="31" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">З-6</text><text x="38.5" y="46.7" font-size="2.5" fill="#000">Керамогранит и плитка: 4 поз. по артикулу и</text><text x="38.5" y="50.1" font-size="2.5" fill="#000">формату, 61,69 м² по раскладке</text><text x="38.5" y="53.5" font-size="2.5" fill="#000">пом. 1, 4, 5, 13</text><text x="104.5" y="46.7" font-size="2.5" fill="#000">О-20: обмер: Гостиная-кухня (пом. 1), Холл</text><text x="104.5" y="50.1" font-size="2.5" fill="#000">с лестницей (пом. 2), Кабинет (пом. 3),</text><text x="104.5" y="53.5" font-size="2.5" fill="#000">Санузел гостевой (пом. 4), Прихожая (пом.</text><text x="104.5" y="56.9" font-size="2.5" fill="#000">5), Спальня родителей (пом. 6), Детская</text><text x="104.5" y="60.3" font-size="2.5" fill="#000">(пом. 7), Гардеробная (пом. 8), Кладовая</text><text x="104.5" y="63.7" font-size="2.5" fill="#000">(пом. 9), Холл второго этажа (пом. 10),</text><text x="104.5" y="67.1" font-size="2.5" fill="#000">Коридор второго этажа (пом. 11), Детская</text><text x="104.5" y="70.5" font-size="2.5" fill="#000">вторая (пом. 12), Санузел второго этажа</text><text x="104.5" y="73.9" font-size="2.5" fill="#000">(пом. 13)</text><text x="104.5" y="77.3" font-size="2.5" fill="#000">О-21: обмер: Гостиная-кухня (пом. 1), Холл</text><text x="104.5" y="80.7" font-size="2.5" fill="#000">с лестницей (пом. 2), Кабинет (пом. 3),</text><text x="104.5" y="84.1" font-size="2.5" fill="#000">Санузел гостевой (пом. 4), Прихожая (пом.</text><text x="104.5" y="87.5" font-size="2.5" fill="#000">5), Спальня родителей (пом. 6), Детская</text><text x="104.5" y="90.9" font-size="2.5" fill="#000">(пом. 7), Гардеробная (пом. 8), Кладовая</text><text x="104.5" y="94.3" font-size="2.5" fill="#000">(пом. 9), Холл второго этажа (пом. 10),</text><text x="104.5" y="97.7" font-size="2.5" fill="#000">Коридор второго этажа (пом. 11), Детская</text><text x="104.5" y="101.1" font-size="2.5" fill="#000">вторая (пом. 12), Санузел второго этажа</text><text x="104.5" y="104.5" font-size="2.5" fill="#000">(пом. 13)</text><text x="160.5" y="46.7" font-size="2.5" fill="#000"></text><text x="216.5" y="46.7" font-size="2.5" fill="#000">После 1 и 2 и после получения срока у</text><text x="216.5" y="50.1" font-size="2.5" fill="#000">поставщика (вопроса о сроках нет);</text><text x="216.5" y="53.5" font-size="2.5" fill="#000">дата заказа — когда срок известен, не</text><text x="216.5" y="56.9" font-size="2.5" fill="#000">позднее чем за срок до начала Р-9.</text><text x="268.5" y="46.7" font-size="2.5" fill="#000">срок уточняется у поставщика</text><text x="308.5" y="46.7" font-size="2.5" fill="#000">Р-9 «плитка»: калибр партии измеряют до</text><text x="308.5" y="50.1" font-size="2.5" fill="#000">раскладки, раскладку пересчитывают до</text><text x="308.5" y="53.5" font-size="2.5" fill="#000">заказа</text><text x="364.5" y="46.7" font-size="2.5" fill="#000"></text></g><line x1="25" y1="107.6" x2="410" y2="107.6" stroke="#000" stroke-width="0.25"/><g data-el="proc-row" data-id="З-7" data-kind="board" data-lead="" data-lead-src="none" data-need="Р-12" data-closes=""><text x="31" y="111.3" font-size="2.5" text-anchor="middle" fill="#000">З-7</text><text x="38.5" y="111.3" font-size="2.5" fill="#000">Покрытие пола (доска) и плинтус: пом. 1, 2, 3, 6, 7,</text><text x="38.5" y="114.7" font-size="2.5" fill="#000">8, 9, 10, 11, 12</text><text x="38.5" y="118.1" font-size="2.5" fill="#000">пом. 1, 2, 3, 6, 7, 8, 9, 10, 11, 12</text><text x="104.5" y="111.3" font-size="2.5" fill="#000">О-20: обмер: Гостиная-кухня (пом. 1), Холл</text><text x="104.5" y="114.7" font-size="2.5" fill="#000">с лестницей (пом. 2), Кабинет (пом. 3),</text><text x="104.5" y="118.1" font-size="2.5" fill="#000">Санузел гостевой (пом. 4), Прихожая (пом.</text><text x="104.5" y="121.5" font-size="2.5" fill="#000">5), Спальня родителей (пом. 6), Детская</text><text x="104.5" y="124.9" font-size="2.5" fill="#000">(пом. 7), Гардеробная (пом. 8), Кладовая</text><text x="104.5" y="128.3" font-size="2.5" fill="#000">(пом. 9), Холл второго этажа (пом. 10),</text><text x="104.5" y="131.7" font-size="2.5" fill="#000">Коридор второго этажа (пом. 11), Детская</text><text x="104.5" y="135.1" font-size="2.5" fill="#000">вторая (пом. 12), Санузел второго этажа</text><text x="104.5" y="138.5" font-size="2.5" fill="#000">(пом. 13)</text><text x="160.5" y="111.3" font-size="2.5" fill="#000"></text><text x="216.5" y="111.3" font-size="2.5" fill="#000">После 1 и 2 и после получения срока у</text><text x="216.5" y="114.7" font-size="2.5" fill="#000">поставщика (вопроса о сроках нет);</text><text x="216.5" y="118.1" font-size="2.5" fill="#000">дата заказа — когда срок известен, не</text><text x="216.5" y="121.5" font-size="2.5" fill="#000">позднее чем за срок до начала Р-12.</text><text x="268.5" y="111.3" font-size="2.5" fill="#000">срок уточняется у поставщика</text><text x="308.5" y="111.3" font-size="2.5" fill="#000">Р-12 «чистовые полы»: артикул и партия</text><text x="308.5" y="114.7" font-size="2.5" fill="#000">— до заказа; доску привозят к чистовым</text><text x="308.5" y="118.1" font-size="2.5" fill="#000">полам</text><text x="364.5" y="111.3" font-size="2.5" fill="#000"></text></g><line x1="25" y1="141.6" x2="410" y2="141.6" stroke="#000" stroke-width="0.25"/><g data-el="proc-row" data-id="З-8" data-kind="furniture" data-lead="" data-lead-src="none" data-need="Р-15" data-closes="К-1"><text x="31" y="145.3" font-size="2.5" text-anchor="middle" fill="#000">З-8</text><text x="38.5" y="145.3" font-size="2.5" fill="#000">Встроенная мебель по замеру цеха: Пр1, М4, Д3,</text><text x="38.5" y="148.7" font-size="2.5" fill="#000">Д8</text><text x="38.5" y="152.1" font-size="2.5" fill="#000">пом. 5, 6, 7, 12</text><text x="104.5" y="145.3" font-size="2.5" fill="#000">О-3: обмер: все помещения (К-1); до заказа</text><text x="104.5" y="148.7" font-size="2.5" fill="#000">мебели и дверей</text><text x="160.5" y="145.3" font-size="2.5" fill="#000"></text><text x="216.5" y="145.3" font-size="2.5" fill="#000">После 1 и 2 и после получения срока у</text><text x="216.5" y="148.7" font-size="2.5" fill="#000">поставщика (вопроса о сроках нет);</text><text x="216.5" y="152.1" font-size="2.5" fill="#000">дата заказа — когда срок известен, не</text><text x="216.5" y="155.5" font-size="2.5" fill="#000">позднее чем за срок до начала Р-15.</text><text x="268.5" y="145.3" font-size="2.5" fill="#000">срок уточняется у поставщика</text><text x="268.5" y="148.7" font-size="2.5" fill="#000">Ориентир практики (не срок</text><text x="268.5" y="152.1" font-size="2.5" fill="#000">поставщика): 4–8 нед. от</text><text x="268.5" y="155.5" font-size="2.5" fill="#000">замера</text><text x="308.5" y="145.3" font-size="2.5" fill="#000">Р-15 «кухня и мебель»: цех замеряет по</text><text x="308.5" y="148.7" font-size="2.5" fill="#000">готовым стенам; производство 4–8 недель</text><text x="308.5" y="152.1" font-size="2.5" fill="#000">идёт параллельно с отделкой</text><text x="364.5" y="145.3" font-size="2.5" fill="#000">К-1</text></g></g><g data-el="proc-work"><text x="25" y="171" font-size="3.5" font-weight="700" fill="#000">Работы: порядок и что не даёт начать</text><rect x="25" y="173.6" width="385" height="44" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="183.6" x2="410" y2="183.6" stroke="#000" stroke-width="0.5"/><text x="31" y="179.5" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="37" y1="173.6" x2="37" y2="217.6" stroke="#000" stroke-width="0.25"/><text x="83" y="179.5" font-size="2.5" text-anchor="middle" fill="#000">Работа (стадия технологической последовательности)</text><line x1="129" y1="173.6" x2="129" y2="217.6" stroke="#000" stroke-width="0.25"/><text x="149" y="179.5" font-size="2.5" text-anchor="middle" fill="#000">После</text><line x1="169" y1="173.6" x2="169" y2="217.6" stroke="#000" stroke-width="0.25"/><text x="233" y="179.5" font-size="2.5" text-anchor="middle" fill="#000">Что должно быть к началу: условия и закупки</text><line x1="297" y1="173.6" x2="297" y2="217.6" stroke="#000" stroke-width="0.25"/><text x="353.5" y="179.5" font-size="2.5" text-anchor="middle" fill="#000">Не начинать, пока открыто в реестре</text><g data-el="work-row" data-id="Р-1" data-key="dem" data-after=""><text x="31" y="187.3" font-size="2.5" text-anchor="middle" fill="#000">Р-1</text><text x="38.5" y="187.3" font-size="2.5" fill="#000">Демонтаж покрытий, отделки стен и потолков, дверных блоков и</text><text x="38.5" y="190.7" font-size="2.5" fill="#000">приборов; конструкции, стены и перегородки не трогать до технического</text><text x="38.5" y="194.1" font-size="2.5" fill="#000">заключения (стадия 1)</text><text x="130.5" y="187.3" font-size="2.5" fill="#000"></text><text x="170.5" y="187.3" font-size="2.5" fill="#000">до начала: запрошены документы на дом и БТИ; контрольный обмер до демонтажа (что видно)</text><text x="170.5" y="190.7" font-size="2.5" fill="#000">сделан</text><text x="298.5" y="187.3" font-size="2.5" fill="#000"></text></g><line x1="25" y1="197.2" x2="410" y2="197.2" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-2" data-key="obmer" data-after="Р-1"><text x="31" y="200.9" font-size="2.5" text-anchor="middle" fill="#000">Р-2</text><text x="38.5" y="200.9" font-size="2.5" fill="#000">Контрольный обмер на голых стенах и обследование (задание — лист</text><text x="38.5" y="204.3" font-size="2.5" fill="#000">«Задание на контрольный обмер») (стадия 2)</text><text x="130.5" y="200.9" font-size="2.5" fill="#000">Р-1</text><text x="170.5" y="200.9" font-size="2.5" fill="#000">после снятия отделки: видны стояки, каналы, щиток, толщины стен; до заказа всего, что делают по</text><text x="170.5" y="204.3" font-size="2.5" fill="#000">размеру</text><text x="298.5" y="200.9" font-size="2.5" fill="#000"></text></g><line x1="25" y1="207.4" x2="410" y2="207.4" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-3" data-key="el" data-after="Р-2"><text x="31" y="211.1" font-size="2.5" text-anchor="middle" fill="#000">Р-3</text><text x="38.5" y="211.1" font-size="2.5" fill="#000">Черновая электрика: штробы, короба, гофра, подрозетники, щит (стадия</text><text x="38.5" y="214.5" font-size="2.5" fill="#000">4)</text><text x="130.5" y="211.1" font-size="2.5" fill="#000">Р-2</text><text x="170.5" y="211.1" font-size="2.5" fill="#000">до начала: план электрики с высотами утверждён; штробы в стенах — только после технического</text><text x="170.5" y="214.5" font-size="2.5" fill="#000">заключения; мебель расставлена</text><text x="298.5" y="211.1" font-size="2.5" fill="#000">К-4: Разрешённая мощность дома по ТУ неизвестна, принята 15 кВт.</text></g></g></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4 К-7" data-level="0"><text x="25.5" y="272.1" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="275.5" font-size="2.5" fill="#000">Основа листа: взаимное расположение помещений, контур дома 9600 × 8000 и раскладка этажей подобраны проектировщиком под габариты помещений брифа; обмер и проект АР —</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">задание (К-1); высота потолка 2900 мм — по брифу, не замерена; перекрытие 330 мм и отметка 2-го этажа +3,230 приняты; проект КР — задание (К-2); наружные стены 400 мм,</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">перегородки 120 мм приняты (в брифе толщин нет) (К-1); разрешённая мощность 15 кВт принята по типовым ТУ для частного дома (К-4); подрайон климата не задан — принят не</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">северный (жилые от 2,5 м) (К-7).</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 7, записи К-1, К-2, К-4, К-7).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Изм.</text><text x="245" y="260.8" font-siz
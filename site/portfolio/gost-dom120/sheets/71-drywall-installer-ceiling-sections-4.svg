" font-size="2.5" text-anchor="middle" data-fit="19" fill="#000">Пом.</text><line x1="25" y1="46.4" x2="108" y2="46.4" stroke="#000" stroke-width="0.18"/><text x="26.5" y="41.3" font-size="2.5" text-anchor="start" data-fit="14" fill="#000"></text><text x="43.5" y="41.3" font-size="2.5" text-anchor="start" data-fit="34" fill="#000">Светильник встраиваемый</text><text x="43.5" y="44.7" font-size="2.5" text-anchor="start" data-fit="34" fill="#000">(марки — план освещения)</text><text x="80.5" y="41.3" font-size="2.5" text-anchor="start" data-fit="6" fill="#000">30</text><text x="89.5" y="41.3" font-size="2.5" text-anchor="start" data-fit="17" fill="#000">1, 2, 3, 4, 5</text><line x1="25" y1="55.8" x2="108" y2="55.8" stroke="#000" stroke-width="0.18"/><text x="26.5" y="50.7" font-size="2.5" text-anchor="start" data-fit="14" fill="#000"></text><text x="43.5" y="50.7" font-size="2.5" text-anchor="start" data-fit="34" fill="#000">Светильник подвесной</text><text x="43.5" y="54.1" font-size="2.5" text-anchor="start" data-fit="34" fill="#000">(марки — план освещения)</text><text x="80.5" y="50.7" font-size="2.5" text-anchor="start" data-fit="6" fill="#000">4</text><text x="89.5" y="50.7" font-size="2.5" text-anchor="start" data-fit="17" fill="#000">1, 2</text><line x1="25" y1="65.2" x2="108" y2="65.2" stroke="#000" stroke-width="0.18"/><text x="26.5" y="60.1" font-size="2.5" text-anchor="start" data-fit="14" fill="#000" textLength="11.55" lengthAdjust="spacingAndGlyphs">ИП4, ИП6**,</text><text x="26.5" y="63.5" font-size="2.5" text-anchor="start" data-fit="14" fill="#000">ИП2, ИП3**</text><text x="43.5" y="60.1" font-size="2.5" text-anchor="start" data-fit="34" fill="#000">Извещатель дымовой</text><text x="80.5" y="60.1" font-size="2.5" text-anchor="start" data-fit="6" fill="#000">4</text><text x="89.5" y="60.1" font-size="2.5" text-anchor="start" data-fit="17" fill="#000">1, 2, 3, 5</text><line x1="25" y1="71.2" x2="108" y2="71.2" stroke="#000" stroke-width="0.18"/><text x="26.5" y="69.5" font-size="2.5" text-anchor="start" data-fit="14" fill="#000">ИП5</text><text x="43.5" y="69.5" font-size="2.5" text-anchor="start" data-fit="34" fill="#000">Извещатель тепловой</text><text x="80.5" y="69.5" font-size="2.5" text-anchor="start" data-fit="6" fill="#000">1</text><text x="89.5" y="69.5" font-size="2.5" text-anchor="start" data-fit="17" fill="#000">1</text><line x1="25" y1="77.2" x2="108" y2="77.2" stroke="#000" stroke-width="0.18"/><text x="26.5" y="75.5" font-size="2.5" text-anchor="start" data-fit="14" fill="#000" textLength="12.14" lengthAdjust="spacingAndGlyphs">AP2**, AP1**</text><text x="43.5" y="75.5" font-size="2.5" text-anchor="start" data-fit="34" fill="#000">Точка доступа Wi-Fi, PoE</text><text x="80.5" y="75.5" font-size="2.5" text-anchor="start" data-fit="6" fill="#000">2</text><text x="89.5" y="75.5" font-size="2.5" text-anchor="start" data-fit="17" fill="#000">1, 5</text><text x="26.5" y="81.5" font-size="2.5" text-anchor="start" data-fit="14" fill="#000"></text><text x="43.5" y="81.5" font-size="2.5" text-anchor="start" data-fit="34" fill="#000">Люк ревизии 300×300</text><text x="80.5" y="81.5" font-size="2.5" text-anchor="start" data-fit="6" fill="#000">2</text><text x="89.5" y="81.5" font-size="2.5" text-anchor="start" data-fit="17" fill="#000">1, 3</text></g><g data-el="notes"><text x="25" y="241" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="246" font-size="2.5" fill="#000">1. ГКЛ 12,5 мм по каркасу П113; узлы коробов и ниш под шторы: узел 1 — лист 68; узел 2 — лист 68; узел 4 — лист 70; условные обозначения разрезов — на листе 68.</text><text x="25" y="249.4" font-size="2.5" fill="#000">2. Ведомость вырезов и закладных в потолке (1-й этаж) — к плану потолков: вырезы и закладные — до обшивки, марки светильников — по плану освещения.</text></g><g data-el="ref-back" data-target="66"/><g data-el="ref-back" data-target="67"/><g data-el="assumed-notes" data-flags="point:ИП6|point:ИП3|point:AP2|point:AP1" data-ids="К-1 К-2 К-4 К-7" data-level="0"><text x="25.5" y="265.3" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="268.7" font-size="2.5" fill="#000">Основа листа: взаимное расположение помещений, контур дома 9600 × 8000 и раскладка этажей подобраны проектировщиком под габариты помещений брифа; обмер и проект АР —</text><text x="25.5" y="272.1" font-size="2.5" fill="#000">задание (К-1); высота потолка 2900 мм — по брифу, не замерена; перекрытие 330 мм и отметка 2-го этажа +3,230 приняты; проект КР — задание (К-2); наружные стены 400 мм,</text><text x="25.5" y="275.5" font-size="2.5" fill="#000">перегородки 120 мм приняты (в брифе толщин нет) (К-1); разрешённая мощность 15 кВт принята по типовым ТУ для частного дома (К-4); подрайон климата не задан — принят не</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">северный (жилые от 2,5 м) (К-7).</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">Знак «**» — предложение проектировщика, заказчиком не утверждено (согласовать с заказчиком): ИП6, ИП3 — дымовой автономный вместо теплового образца: жилой дом —</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">автономные дымовые в путях эвакуации (СП 486, пункт сверить по действующей редакции); AP2, AP1 — точка доступа Wi-Fi: число и места.</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 7, записи К-1, К-2, К-4; лист 8, запись К-7).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">04.11.26</text><text x="231" y="270.8" font-size="2.5
 y1="185.2" x2="360.3" y2="192.7" stroke="#000" stroke-width="0.25"/><line x1="270.3" y1="191.2" x2="360.3" y2="191.2" stroke="#000" stroke-width="0.25"/><line x1="269.24" y1="192.26" x2="271.36" y2="190.14" stroke="#000" stroke-width="0.5"/><line x1="359.24" y1="192.26" x2="361.36" y2="190.14" stroke="#000" stroke-width="0.5"/><text x="315.3" y="190.3" font-size="2.5" text-anchor="middle" fill="#000">1800</text></g><g data-a="r1C0u5905" data-b="r1C0u6310" data-dir="h"><line x1="360.3" y1="185.2" x2="360.3" y2="192.7" stroke="#000" stroke-width="0.25"/><line x1="380.55" y1="185.2" x2="380.55" y2="192.7" stroke="#000" stroke-width="0.25"/><line x1="360.3" y1="191.2" x2="380.55" y2="191.2" stroke="#000" stroke-width="0.25"/><line x1="359.24" y1="192.26" x2="361.36" y2="190.14" stroke="#000" stroke-width="0.5"/><line x1="379.49" y1="192.26" x2="381.61" y2="190.14" stroke="#000" stroke-width="0.5"/><text x="370.42" y="190.3" font-size="2.5" text-anchor="middle" fill="#000">405</text></g><g data-a="r1C0u0" data-b="r1C0u6310" data-dir="h" data-control="1" data-total="1"><line x1="65.05" y1="185.2" x2="65.05" y2="200.7" stroke="#000" stroke-width="0.25"/><line x1="380.55" y1="185.2" x2="380.55" y2="200.7" stroke="#000" stroke-width="0.25"/><line x1="65.05" y1="199.2" x2="380.55" y2="199.2" stroke="#000" stroke-width="0.25"/><line x1="63.99" y1="200.26" x2="66.11" y2="198.14" stroke="#000" stroke-width="0.5"/><line x1="379.49" y1="200.26" x2="381.61" y2="198.14" stroke="#000" stroke-width="0.5"/><text x="222.8" y="198.3" font-size="2.5" text-anchor="middle" fill="#000">6310</text></g></g></g><g data-el="legend"><text x="25" y="213.7" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><text x="25" y="218" font-size="2.5" fill="#000">обозначения этого вида, схема развёрток помещения и ведомость</text><text x="25" y="221.4" font-size="2.5" fill="#000">отделки — на листе 125</text></g><g data-el="ref" data-target="125"/><g data-el="ref-back" data-target="116"/><g data-el="ref" data-target="124"/><g data-el="notes"><text x="25" y="238" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="243" font-size="2.5" fill="#000">1. Развёртки — вид на стену изнутри помещения, по часовой стрелке; расположение — на схеме листа 125 и на листе 116; размеры — в мм по чистовым поверхностям;</text><text x="28" y="246.4" font-size="2.5" fill="#000">отметки — в м от ±0,000 (чистый пол 1-го этажа); высоты Н — от чистого пола помещения до оси изделия, у декора — до центра.</text><text x="25" y="249.8" font-size="2.5" fill="#000">2. Стена В показана двумя видами: здесь — архитектурная развёртка (мебель, отделка, проёмы, высоты), электроточки и выводы ВК с привязками и таблицей — на</text><text x="28" y="253.2" font-size="2.5" fill="#000">листе 124 («Привязки»).</text><text x="25" y="256.6" font-size="2.5" fill="#000">3. Схема мебели, приборов и декора не является технической документацией для производства мебели; габариты — по паспортам изделий.</text><text x="25" y="260" font-size="2.5" fill="#000">4. Потолок — у каждой стены свой, по плану потолков (ПТ1); ступени — зоной, кромка короба перед нишей — тонкой линией; в поле потолка: ПТ2 +2,750, ПТ3 +2,800.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="75" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="75" y1="285.5" x2="75" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="77" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="window:r1:0|window:r1:1|door:r1:0" data-ids="К-1 К-2 К-4 К-7" data-level="1"><text x="25.5" y="266.1" font-size="2.5" fill="#000">Допущения и предложения на листе. Основа листа: взаимное расположение помещений, контур дома 9600 × 8000 и раскладка этажей подобраны проектировщиком под габариты</text><text x="25.5" y="269.5" font-size="2.5" fill="#000">помещений брифа; обмер и проект АР — задание (К-1); высота потолка 2900 мм — по брифу, не замерена; перекрытие 330 мм и отметка 2-го этажа +3,230 приняты; проект КР —</text><text x="25.5" y="272.9" font-size="2.5" fill="#000">задание (К-2); наружные стены 400 мм, перегородки 120 мм приняты (в брифе толщин нет) (К-1); разрешённая мощность 15 кВт принята по типовым ТУ для частного дома (К-4);</text><text x="25.5" y="276.3" font-size="2.5" fill="#000">подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-7). Знак «*» — принято, не замерено и не подтверждено (замерить на объекте): К-1: окно пом. 1 (стена А) —</text><text x="25.5" y="279.7" font-size="2.5" fill="#000">окно: место, ширина, высота и подоконник приняты по брифу, стена — по раскладке проектировщика (К-1), не замерены; дверь пом. 1 (стена Б) — проём: место и ширина приняты</text><text x="25.5" y="283.1" font-size="2.5" fill="#000">проектировщиком по брифу (раскладка этажей — К-1), не замерены. См. лист открытых вопросов (лист 7, записи К-1, К-2, К-4; лист 8, запись К-7).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" 
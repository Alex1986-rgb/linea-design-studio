line x1="163.2" y1="33" x2="168.4" y2="33" stroke="#000" stroke-width="0.35"/><line x1="165.8" y1="31" x2="165.8" y2="29.6" stroke="#000" stroke-width="0.35"/></g><text x="172.8" y="32.9" font-size="2.5" fill="#000">розетка с заземляющим контактом; у знака — марка, ×N</text><text x="172.8" y="36.3" font-size="2.5" fill="#000">постов в рамке, гр. — группа щита, Н — высота оси, мм</text><g><circle cx="164.8" cy="41.4" r="0.8" fill="#000"/><line x1="164.8" y1="41.4" x2="167.4" y2="38.8" stroke="#000" stroke-width="0.35"/><line x1="166.4" y1="39.8" x2="167.3" y2="40.7" stroke="#000" stroke-width="0.35"/></g><text x="172.8" y="41.3" font-size="2.5" fill="#000">выключатель одноклавишный</text><g><circle cx="164.8" cy="47.2" r="0.8" fill="#000"/><line x1="164.8" y1="47.2" x2="167.4" y2="44.6" stroke="#000" stroke-width="0.35"/><line x1="166.4" y1="45.6" x2="167.3" y2="46.5" stroke="#000" stroke-width="0.35"/><line x1="167.3" y1="44.7" x2="168.2" y2="45.6" stroke="#000" stroke-width="0.35"/></g><text x="172.8" y="47.1" font-size="2.5" fill="#000">выключатель двухклавишный (флажков — по числу клавиш)</text><g><circle cx="164.8" cy="53" r="0.8" fill="#000"/><line x1="164.8" y1="53" x2="167.4" y2="50.4" stroke="#000" stroke-width="0.35"/><line x1="166.4" y1="51.4" x2="167.3" y2="52.3" stroke="#000" stroke-width="0.35"/><line x1="164.8" y1="53" x2="162.2" y2="55.6" stroke="#000" stroke-width="0.35"/><line x1="163.2" y1="54.6" x2="162.3" y2="53.7" stroke="#000" stroke-width="0.35"/></g><text x="172.8" y="52.9" font-size="2.5" fill="#000">выключатель с проходной или перекрёстной клавишей</text><text x="172.8" y="56.3" font-size="2.5" fill="#000">(обратный флажок); тип клавиши — в подписи</text><g><path d="M 162.4 62.9 L 165.8 57.5 L 169.2 62.9 Z" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="165.8" y="62.4" font-size="2.5" text-anchor="middle" fill="#000">ДФ</text></g><text x="172.8" y="61.3" font-size="2.5" fill="#000">трубка или монитор домофона</text><g><line x1="160.74" y1="67.26" x2="162.86" y2="65.14" stroke="#c0392b" stroke-width="0.5"/><rect x="161.8" y="66.04999999999998" width="8" height="0.3" fill="#c0392b"/></g><text x="172.8" y="67.1" font-size="2.5" fill="#000">привязки точек и выводов от угла и от пола, мм</text><g><rect x="161.8" y="69.49999999999999" width="8" height="5" fill="#fff" stroke="#000" stroke-width="0.35" opacity="0.6"/></g><text x="172.8" y="72.9" font-size="2.5" fill="#000">мебель и приборы — фасад по расстановке (условно)</text><g><line x1="163.8" y1="80.3" x2="165.8" y2="75.3" stroke="#000" stroke-width="0.25" stroke-dasharray="1.5 1"/><rect x="163.8" y="75.29999999999998" width="4" height="5.2" fill="none" stroke="#000" stroke-width="0.35"/></g><text x="172.8" y="78.7" font-size="2.5" fill="#000">дверной проём; марка двери — в кружке</text><g><line x1="163.3" y1="82.2" x2="163.3" y2="85" stroke="#000" stroke-width="0.18"/><line x1="165.3" y1="82.2" x2="165.3" y2="85" stroke="#000" stroke-width="0.18"/><line x1="167.3" y1="82.2" x2="167.3" y2="85" stroke="#000" stroke-width="0.18"/><rect x="162.3" y="81.84999999999998" width="7" height="3.5" fill="none" stroke="#000" stroke-width="0.35"/></g><text x="172.8" y="84.5" font-size="2.5" fill="#000">радиатор отопления; марка — по плану отопления</text><g><rect x="161.8" y="87.39999999999998" width="8" height="4" fill="#cfcfcf" stroke="#000" stroke-width="0.7"/></g><text x="172.8" y="90.3" font-size="2.5" fill="#000">стены и перекрытия в сечении</text><g><rect x="161.8" y="93.19999999999997" width="8" height="4" fill="#dbd5ca" fill-opacity="0.55" stroke="#000" stroke-width="0.25"/></g><text x="172.8" y="96.1" font-size="2.5" fill="#000">окраска: тон — цвет по коду производителя (условно)</text><g><text x="165.8" y="101.9" font-size="2.5" text-anchor="middle" fill="#000">О1</text><circle cx="165.8" cy="100.99999999999997" r="3.5" fill="none" stroke="#000" stroke-width="0.25"/></g><text x="172.8" y="101.9" font-size="2.5" fill="#000">марка отделки по реестру
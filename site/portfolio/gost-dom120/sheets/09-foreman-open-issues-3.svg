<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Открытые вопросы, принятые допущения и конфликты. Лист 3 из 3" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты. Лист 3 из 3</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации (стартовое совещание 19.10.2026)</text><g data-el="open-issues" data-plan="fixed" data-plan-declared="3"><g data-el="issues-changes"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Изменения проекта после выпуска листов (реестр изменений)</text><rect x="25" y="33" width="385" height="149.4" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="32" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="33" x2="39" y2="182.4" stroke="#000" stroke-width="0.25"/><text x="50" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><line x1="61" y1="33" x2="61" y2="182.4" stroke="#000" stroke-width="0.25"/><text x="91" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><line x1="121" y1="33" x2="121" y2="182.4" stroke="#000" stroke-width="0.25"/><text x="171" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Было</text><line x1="221" y1="33" x2="221" y2="182.4" stroke="#000" stroke-width="0.25"/><text x="283.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Стало</text><line x1="346" y1="33" x2="346" y2="182.4" stroke="#000" stroke-width="0.25"/><text x="378" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Кто решил, подпись</text><g data-el="issue-row" data-kind="change" data-id="ИЗ-1"><text x="32" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-1</text><text x="40.5" y="46.7" font-size="2.5" fill="#000">30.10.2026</text><text x="62.5" y="46.7" font-size="2.5" fill="#000">л. 52, 53 — План выводов сантехники</text><text x="62.5" y="50.1" font-size="2.5" fill="#000">л. 17–22, 25–28, 34–39, 44–55, 61, 62, 66, 67,</text><text x="62.5" y="53.5" font-size="2.5" fill="#000">77–79, 83, 84, 89, 90, 96, 97, 116, 117, 155–159,</text><text x="62.5" y="56.9" font-size="2.5" fill="#000">164–167 — 1-й этаж</text><text x="62.5" y="60.3" font-size="2.5" fill="#000">л. 54, 55 — Схема разводки водопровода и</text><text x="62.5" y="63.7" font-size="2.5" fill="#000">канализации</text><text x="62.5" y="67.1" font-size="2.5" fill="#000">л. 17–22, 25–28, 34–39, 44–55, 61, 62, 66, 67,</text><text x="62.5" y="70.5" font-size="2.5" fill="#000">77–79, 83, 84, 89, 90, 96, 97, 116, 117, 155–159,</text><text x="62.5" y="73.9" font-size="2.5" fill="#000">164–167 — 1-й этаж</text><text x="62.5" y="77.3" font-size="2.5" fill="#000">л. 27, 28 — План расстановки мебели</text><text x="62.5" y="80.7" font-size="2.5" fill="#000">л. 17–22, 25–28, 34–39, 44–55, 61, 62, 66, 67,</text><text x="62.5" y="84.1" font-size="2.5" fill="#000">77–79, 83, 84, 89, 90, 96, 97, 116, 117, 155–159,</text><text x="62.5" y="87.5" font-size="2.5" fill="#000">164–167 — 1-й этаж</text><text x="62.5" y="90.9" font-size="2.5" fill="#000">л. 21, 22 — План дверей</text><text x="62.5" y="94.3" font-size="2.5" fill="#000">л. 17–22, 25–28, 34–39, 44–55, 61, 62, 66, 67,</text><text x="62.5" y="97.7" font-size="2.5" fill="#000">77–79, 83, 84, 89, 90, 96, 97, 116, 117, 155–159,</text><text x="62.5" y="101.1" font-size="2.5" fill="#000">164–167 — 1-й этаж</text><text x="62.5" y="104.5" font-size="2.5" fill="#000">л. 34, 35 — План розеток и электровыводов</text><text x="62.5" y="107.9" font-size="2.5" fill="#000">л. 17–22, 25–28, 34–39, 44–55, 61, 62, 66, 67,</text><text x="62.5" y="111.3" font-size="2.5" fill="#000">77–79, 83, 84, 89, 90, 96, 97, 116, 117, 155–159,</text><text x="62.5" y="114.7" font-size="2.5" fill="#000">164–167 — 1-й этаж</text><text x="62.5" y="118.1" font-size="2.5" fill="#000">л. 77 — Раскладка плитки. Санузел второго</text><text x="62.5" y="121.5" font-size="2.5" fill="#000">этажа. Развёртки стен</text><text x="122.5" y="46.7" font-size="2.5" fill="#000">Санузел второго этажа (пом. 13, 2600×2200): раковина См4 (стена А 500…1100)</text><text x="122.5" y="50.1" font-size="2.5" fill="#000">и стиральная машина См3 (стена Г 300…900) пересекались в углу, перед</text><text x="122.5" y="53.5" font-size="2.5" fill="#000">люком машины стояла раковина; ванна См1 (стена В 150…1850) заходила в</text><text x="122.5" y="56.9" font-size="2.5" fill="#000">проход перед Д-8 на 500 из 800 мм; унитаз См2 (стена Б 900…1300) накрывал</text><text x="122.5" y="60.3" font-size="2.5" fill="#000">стояки Ст К1-1 / В1-1; полотенцесушитель См5 в 2,3 м от стояка ГВС; при</text><text x="122.5" y="63.7" font-size="2.5" fill="#000">открытом полотне Д-8 в помещение не пройти.</text><text x="222.5" y="46.7" font-size="2.5" fill="#000">Ванна См1 — вдоль стены Г (offset 500, x 3800…4550, y 6300…8000); умывальник См4 — стена А</text><text x="222.5" y="50.1" font-size="2.5" fill="#000">offset 800…1400; стиральная машина См3 — стена В offset 1200…1800 (перед люком 1150 мм);</text><text x="222.5" y="53.5" font-size="2.5" fill="#000">унитаз См2 — стена Б offset 1150…1550 (250 мм до стояков — короб с люком); полотенцесушитель</text><text x="222.5" y="56.9" font-size="2.5" fill="#000">См5 — стена Б 1600…2100; Д-8 — петли у правого откоса. Точки ЭОМ санузла перенесены за</text><text x="222.5" y="60.3" font-size="2.5" fill="#000">приборами (Р7 — стена В, Р8 — offset 1500, Св15 — 1100, КУП1 и В6 — стена Б). Трасса выпуска</text><text x="222.5" y="63.7" font-size="2.5" fill="#000">умывальника под проёмом Д-8 остаётся — К-9. Знак «**» у приборов до подписи автора.</text><text x="347.5" y="46.7" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="50.1" font-size="2.5" fill="#000">исполнителя; предложение проектировщика, на</text><text x="347.5" y="53.5" font-size="2.5" fill="#000">утверждение А. С. Кырлана</text></g><line x1="25" y1="124.6" x2="410" y2="124.6" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-2"><text x="32" y="128.3" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-2</text><text x="40.5" y="128.3" font-size="2.5" fill="#000">30.10.2026</text><text x="62.5" y="128.3" font-size="2.5" fill="#000">л. 27, 28 — План расстановки мебели</text><text x="62.5" y="131.7" font-size="2.5" fill="#000">л. 17–22, 25–28, 34–39, 44–55, 61, 62, 66, 67,</text><text x="62.5" y="135.1" font-size="2.5" fill="#000">77–79, 83, 84, 89, 90, 96, 97, 116, 117, 155–159,</text><text x="62.5" y="138.5" font-size="2.5" fill="#000">164–167 — 1-й этаж</text><text x="62.5" y="141.9" font-size="2.5" fill="#000">л. 127 — Развёртка стены А. Холл с</text><text x="62.5" y="145.3" font-size="2.5" fill="#000">лестницей (пом. 2)</text><text x="62.5" y="148.7" font-size="2.5" fill="#000">л. 132 — Развёртка стены В. Кабинет (пом. 3)</text><text x="62.5" y="152.1" font-size="2.5" fill="#000">л. 150 — Развёртка стены В. Детская (пом. 7)</text><text x="62.5" y="155.5" font-size="2.5" fill="#000">л. 155 — Развёртка стены А. Холл второго</text><text x="62.5" y="158.9" font-size="2.5" fill="#000">этажа (пом. 10)</text><text x="62.5" y="162.3" font-size="2.5" fill="#000">л. 162 — Развёртка стены В. Детская вторая</text><text x="62.5" y="165.7" font-size="2.5" fill="#000">(пом. 12)</text><text x="62.5" y="169.1" font-size="2.5" fill="#000">л. 34, 35 — План розеток и электровыводов</text><text x="62.5" y="172.5" font-size="2.5" fill="#000">л. 17–22, 25–28, 34–39, 44–55, 61, 62, 66, 67,</text><text x="62.5" y="175.9" font-size="2.5" fill="#000">77–79, 83, 84, 89, 90, 96, 97, 116, 117, 155–159,</text><text x="62.5" y="179.3" font-size="2.5" fill="#000">164–167 — 1-й этаж</text><text x="122.5" y="128.3" font-size="2.5" fill="#000">Мебель закрывала радиаторы: банкетка Хл1 (холл) на Рд3, стол Кб1 (кабинет)</text><text x="122.5" y="131.7" font-size="2.5" fill="#000">на Рд4, стол Дт2 (детская) на Рд6, стеллаж Хл2 (холл 2-го этажа) перед Рд7,</text><text x="122.5" y="135.1" font-size="2.5" fill="#000">стол Дт7 (детская вторая) на Рд8; на пяти развёртках — служебная фраза</text><text x="122.5" y="138.5" font-size="2.5" fill="#000">«прибор в корпусе не решён». Розетка Р16 прихожей за радиатором Рд2.</text><text x="122.5" y="141.9" font-size="2.5" fill="#000">Назначения Р9/Р10 «у кровати» и Р11 «у комода» в кабинете, Р42/Р47 «у</text><text x="122.5" y="145.3" font-size="2.5" fill="#000">комода» в детских — по образцу, не по мебели. Группы щита 15–17 без точек</text><text x="122.5" y="148.7" font-size="2.5" fill="#000">на планах.</text><text x="222.5" y="128.3" font-size="2.5" fill="#000">Хл1 и Хл2 — у стены Г холлов (offset 1200); столы Кб1, Дт2, Дт7 — 300 мм от лицевой плоскости</text><text x="222.5" y="131.7" font-size="2.5" fill="#000">радиатора (x,y), стулья за ними; радиаторы открыты. Р16 — стена В offset 2300; Р34 — offset 2600.</text><text x="222.5" y="135.1" font-size="2.5" fill="#000">Назначения точек переписаны по расстановке. Р7 (стиральная машина) — группа 15, Р8, Р33, В6</text><text x="222.5" y="138.5" font-size="2.5" fill="#000">(фены, полотенцесушитель) — группа 16, Р17 (ЩС) — группа 17. Знак «**» у переставленной</text><text x="222.5" y="141.9" font-size="2.5" fill="#000">мебели до подписи автора.</text><text x="347.5" y="128.3" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="131.7" font-size="2.5" fill="#000">исполнителя; предложение проектировщика, на</text><text x="347.5" y="135.1" font-size="2.5" fill="#000">утверждение А. С. Кырлана</text></g></g><g data-el="notes"><text x="25" y="194.8" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="199.6" font-size="2.5" fill="#000">1. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text><text x="25" y="203" font-size="2.5" fill="#000">2. Графа «Если решения нет» показывает состояние решения на листах; влияние на сроки и стоимость по пунктам не оценивалось.</text><text x="25" y="206.4" font-size="2.5" fill="#000">3. Пункт, по которому принято решение, при следующем выпуске комплекта из таблиц исключается.</text></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">График закупок и работ. Лист 3 из 3</text><text x="25" y="17.8" font-size="2.5" fill="#333">Что заказывать и когда не раньше чего: относительный порядок без дат; срок поставки — из данных или «уточняется у поставщика»</text><g data-el="proc-schedule" data-plan="fixed" data-plan-declared="3"><g data-el="proc-work"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Работы: порядок и что не даёт начать (продолжение)</text><rect x="25" y="33" width="385" height="147.4" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="31" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="37" y1="33" x2="37" y2="180.4" stroke="#000" stroke-width="0.25"/><text x="83" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Работа (стадия технологической последовательности)</text><line x1="129" y1="33" x2="129" y2="180.4" stroke="#000" stroke-width="0.25"/><text x="149" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">После</text><line x1="169" y1="33" x2="169" y2="180.4" stroke="#000" stroke-width="0.25"/><text x="233" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Что должно быть к началу: условия и закупки</text><line x1="297" y1="33" x2="297" y2="180.4" stroke="#000" stroke-width="0.25"/><text x="353.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Не начинать, пока открыто в реестре</text><g data-el="work-row" data-id="Р-4" data-key="vk" data-after="Р-2"><text x="31" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">Р-4</text><text x="38.5" y="46.7" font-size="2.5" fill="#000">Черновая сантехника и вентиляция: разводка, выводы, инсталляции,</text><text x="38.5" y="50.1" font-size="2.5" fill="#000">короба стояков (стадия 5)</text><text x="130.5" y="46.7" font-size="2.5" fill="#000">Р-2</text><text x="170.5" y="46.7" font-size="2.5" fill="#000">до начала: положение стояков замерено; модели инсталляций и машины выбраны (габариты рамы,</text><text x="170.5" y="50.1" font-size="2.5" fill="#000">подводка); инсталляцию ставят до обшивки ГКЛВ и до гидроизоляции</text><text x="170.5" y="53.5" font-size="2.5" fill="#000">Закупки к началу: З-4 (стиральная машина), З-5 (сантехника)</text><text x="298.5" y="46.7" font-size="2.5" fill="#000">К-5: Тип дома, материал и конструкция стен и перекрытия, несущие стены, положение</text><text x="298.5" y="50.1" font-size="2.5" fill="#000">стояков, выпусков канализации и вентканалов в брифе не заданы; проект дома (АР, КР,</text><text x="298.5" y="53.5" font-size="2.5" fill="#000">ВК, ОВ) не передан.</text></g><line x1="25" y1="56.6" x2="410" y2="56.6" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-5" data-key="plaster" data-after="Р-2 Р-3 Р-4"><text x="31" y="60.3" font-size="2.5" text-anchor="middle" fill="#000">Р-5</text><text x="38.5" y="60.3" font-size="2.5" fill="#000">Коробки скрытых дверей, затем штукатурка стен и откосов (стадия 6)</text><text x="130.5" y="60.3" font-size="2.5" fill="#000">Р-2, Р-3, Р-4</text><text x="170.5" y="60.3" font-size="2.5" fill="#000">до начала: электрика и сантехника смонтированы, штробы заделаны; коробки скрытых дверей</text><text x="170.5" y="63.7" font-size="2.5" fill="#000">установлены до штукатурки (поэтому заказ дверей — раньше работы)</text><text x="170.5" y="67.1" font-size="2.5" fill="#000">Закупки к началу: З-1 (двери скрытого монтажа)</text><text x="298.5" y="60.3" font-size="2.5" fill="#000">К-1: Бриф задаёт 11 помещений с габаритами и этажами, но не их взаимное</text><text x="298.5" y="63.7" font-size="2.5" fill="#000">расположение, контур дома и толщины стен: раскладка этажей, контур 9600 × 8000 и</text><text x="298.5" y="67.1" font-size="2.5" fill="#000">перегородки подобраны проектировщиком под габариты брифа.</text></g><line x1="25" y1="70.2" x2="410" y2="70.2" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-6" data-key="screed" data-after="Р-5"><text x="31" y="73.9" font-size="2.5" text-anchor="middle" fill="#000">Р-6</text><text x="38.5" y="73.9" font-size="2.5" fill="#000">Стяжка пола и тёплый пол (стадия 7)</text><text x="130.5" y="73.9" font-size="2.5" fill="#000">Р-5</text><text x="170.5" y="73.9" font-size="2.5" fill="#000">до начала: штукатурка сделана; трубы под стяжкой приняты; нивелировка плиты выполнена</text><text x="298.5" y="73.9" font-size="2.5" fill="#000"></text></g><line x1="25" y1="78.2" x2="410" y2="78.2" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-7" data-key="wp" data-after="Р-6"><text x="31" y="81.9" font-size="2.5" text-anchor="middle" fill="#000">Р-7</text><text x="38.5" y="81.9" font-size="2.5" fill="#000">Гидроизоляция санузлов и тест проливом (стадия 8)</text><text x="130.5" y="81.9" font-size="2.5" fill="#000">Р-6</text><text x="170.5" y="81.9" font-size="2.5" fill="#000">до начала: стяжка набрала прочность и сухая по инструкции гидроизоляции; выводы стоят на</text><text x="170.5" y="85.3" font-size="2.5" fill="#000">проектных отметках</text><text x="298.5" y="81.9" font-size="2.5" fill="#000"></text></g><line x1="25" y1="88.4" x2="410" y2="88.4" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-8" data-key="gkl" data-after="Р-3 Р-4"><text x="31" y="92.1" font-size="2.5" text-anchor="middle" fill="#000">Р-8</text><text x="38.5" y="92.1" font-size="2.5" fill="#000">ГКЛ: короба инсталляции и стояков, ниши, потолки (стадия 9)</text><text x="130.5" y="92.1" font-size="2.5" fill="#000">Р-3, Р-4</text><text x="170.5" y="92.1" font-size="2.5" fill="#000">до начала: черновые сети в зоне коробов приняты; закладные под тяжёлое и карнизы стоят;</text><text x="170.5" y="95.5" font-size="2.5" fill="#000">светильники выбраны (вырезы)</text><text x="298.5" y="92.1" font-size="2.5" fill="#000"></text></g><line x1="25" y1="98.6" x2="410" y2="98.6" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-9" data-key="tile" data-after="Р-6 Р-7 Р-8"><text x="31" y="102.3" font-size="2.5" text-anchor="middle" fill="#000">Р-9</text><text x="38.5" y="102.3" font-size="2.5" fill="#000">Плитка и керамогранит: стены, затем пол; фартук (стадия 10)</text><text x="130.5" y="102.3" font-size="2.5" fill="#000">Р-6, Р-7, Р-8</text><text x="170.5" y="102.3" font-size="2.5" fill="#000">до начала: гидроизоляция принята; плитка выбрана, калибр партии измерен, раскладка пересчитана и</text><text x="170.5" y="105.7" font-size="2.5" fill="#000">подписана</text><text x="170.5" y="109.1" font-size="2.5" fill="#000">Закупки к началу: З-6 (плитка)</text><text x="298.5" y="102.3" font-size="2.5" fill="#000"></text></g><line x1="25" y1="112.2" x2="410" y2="112.2" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-10" data-key="putty" data-after="Р-5 Р-8 Р-9"><text x="31" y="115.9" font-size="2.5" text-anchor="middle" fill="#000">Р-10</text><text x="38.5" y="115.9" font-size="2.5" fill="#000">Шпаклёвка стен и потолков под окраску (стадия 11)</text><text x="130.5" y="115.9" font-size="2.5" fill="#000">Р-5, Р-8, Р-9</text><text x="170.5" y="115.9" font-size="2.5" fill="#000">до начала: плитка готова (грязные работы закончены); штукатурка и ГКЛ сухие</text><text x="298.5" y="115.9" font-size="2.5" fill="#000"></text></g><line x1="25" y1="120.2" x2="410" y2="120.2" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-11" data-key="paint" data-after="Р-10"><text x="31" y="123.9" font-size="2.5" text-anchor="middle" fill="#000">Р-11</text><text x="38.5" y="123.9" font-size="2.5" fill="#000">Окраска стен, потолков, откосов (стадия 13)</text><text x="130.5" y="123.9" font-size="2.5" fill="#000">Р-10</text><text x="170.5" y="123.9" font-size="2.5" fill="#000">до начала: шпаклёвка отшлифована и огрунтована; выкрасы утверждены, колеровка одной партией</text><text x="298.5" y="123.9" font-size="2.5" fill="#000"></text></g><line x1="25" y1="128.2" x2="410" y2="128.2" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-12" data-key="floor" data-after="Р-9 Р-11"><text x="31" y="131.9" font-size="2.5" text-anchor="middle" fill="#000">Р-12</text><text x="38.5" y="131.9" font-size="2.5" fill="#000">Чистовые полы: инженерная доска (стадия 14)</text><text x="130.5" y="131.9" font-size="2.5" fill="#000">Р-9, Р-11</text><text x="170.5" y="131.9" font-size="2.5" fill="#000">до начала: влажность основания в норме, мокрые работы закончены; доска выбрана и привезена</text><text x="170.5" y="135.3" font-size="2.5" fill="#000">Закупки к началу: З-7 (доска и плинтус)</text><text x="298.5" y="131.9" font-size="2.5" fill="#000"></text></g><line x1="25" y1="138.4" x2="410" y2="138.4" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-13" data-key="doors" data-after="Р-11 Р-12"><text x="31" y="142.1" font-size="2.5" text-anchor="middle" fill="#000">Р-13</text><text x="38.5" y="142.1" font-size="2.5" fill="#000">Полотна межкомнатных дверей, плинтусы, пороги (стадия 15)</text><text x="130.5" y="142.1" font-size="2.5" fill="#000">Р-11, Р-12</text><text x="170.5" y="142.1" font-size="2.5" fill="#000">до начала: чистовой пол уложен; полотна скрытых дверей — после чистовой отделки стен</text><text x="298.5" y="142.1" font-size="2.5" fill="#000"></text></g><line x1="25" y1="146.4" x2="410" y2="146.4" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-14" data-key="finel" data-after="Р-11 Р-13"><text x="31" y="150.1" font-size="2.5" text-anchor="middle" fill="#000">Р-14</text><text x="38.5" y="150.1" font-size="2.5" fill="#000">Чистовая электрика и сантехника: механизмы, светильники, смесители,</text><text x="38.5" y="153.5" font-size="2.5" fill="#000">приборы (стадия 16)</text><text x="130.5" y="150.1" font-size="2.5" fill="#000">Р-11, Р-13</text><text x="170.5" y="150.1" font-size="2.5" fill="#000">до начала: отделка готова; механизмы, светильники и приборы выбраны и привезены</text><text x="298.5" y="150.1" font-size="2.5" fill="#000"></text></g><line x1="25" y1="156.6" x2="410" y2="156.6" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-15" data-key="kitchen" data-after="Р-13 Р-14"><text x="31" y="160.3" font-size="2.5" text-anchor="middle" fill="#000">Р-15</text><text x="38.5" y="160.3" font-size="2.5" fill="#000">Кухня, встроенная и корпусная мебель, бытовая техника (стадия 17)</text><text x="130.5" y="160.3" font-size="2.5" fill="#000">Р-13, Р-14</text><text x="170.5" y="160.3" font-size="2.5" fill="#000">до начала: чистовая сантехника и электрика подведены к местам мебели; замер кухни снят по</text><text x="170.5" y="163.7" font-size="2.5" fill="#000">готовым стенам (после штукатурки или плитки, до чистового пола)</text><text x="170.5" y="167.1" font-size="2.5" fill="#000">Закупки к началу: З-2 (кухонный гарнитур), З-3 (техника кухни), З-8 (мебель по замеру)</text><text x="298.5" y="160.3" font-size="2.5" fill="#000">К-1: Бриф задаёт 11 помещений с габаритами и этажами, но не их взаимное</text><text x="298.5" y="163.7" font-size="2.5" fill="#000">расположение, контур дома и толщины стен: раскладка этажей, контур 9600 × 8000 и</text><text x="298.5" y="167.1" font-size="2.5" fill="#000">перегородки подобраны проектировщиком под габариты брифа.</text></g><line x1="25" y1="170.2" x2="410" y2="170.2" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-16" data-key="accept" data-after="Р-14 Р-15"><text x="31" y="173.9" font-size="2.5" text-anchor="middle" fill="#000">Р-16</text><text x="38.5" y="173.9" font-size="2.5" fill="#000">Сдача: осмотр по чек-листу, дефектная ведомость, устранение</text><text x="38.5" y="177.3" font-size="2.5" fill="#000">замечаний (стадия 18)</text><text x="130.5" y="173.9" font-size="2.5" fill="#000">Р-14, Р-15</text><text x="170.5" y="173.9" font-size="2.5" fill="#000">до начала: всё смонтировано; акты скрытых работ подписаны</text><text x="298.5" y="173.9" font-size="2.5" fill="#000"></text></g></g><g data-el="notes"><text x="25" y="192.8" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="197.6" font-size="2.5" fill="#000">1. Порядок работ — стадии технологической последовательности из 16 позиций, присутствующих в этом проекте (по строкам ведомости объёмов); остальные стадии таблицы knowledge/remont-tehnologiya.md в проекте не встречаются. Длительности работ не печатаются: их нет ни в данных, ни в нормах для</text><text x="29" y="201" font-size="2.5" fill="#000">этого объекта.</text><text x="25" y="204.4" font-size="2.5" fill="#000">2. Типовые сроки — ориентир практики, не срок поставщика: скрытые двери — короб около 10 дн., полотно под покраску до 3 нед., шпон 4–5 нед., в среднем около 30 дн. (knowledge/workers/foreman.md, п. 2.4 (profil-doors)); кухня и корпусная мебель — 4–8 недель от замера (knowledge/remont-tehnologiya.md,</text><text x="29" y="207.8" font-size="2.5" fill="#000">разд. 2; knowledge/workers/foreman.md, п. 2.4). Заказ по ориентиру не назначается: срок получают у поставщика (вопрос реестра), после чего заказ планируют «не позднее чем за срок до начала работы».</text><text x="25" y="211.2" font-size="2.5" fill="#000">3. Условия заказа берутся из реестра открытых вопросов и задания на контрольный обмер: позиция заказывается, когда закрыты замер (графа 1) и решение (графа 2). Закрывать их может только факт или решение автора с подписью; снять строку с листа можно только закрыв запись реестра.</text><text x="25" y="214.6" font-size="2.5" fill="#000">4. Заказ по размеру до контрольного обмера не делают: двери, кухня и встроенная мебель зависят от обмера (К-11, К-13); скрытые двери, кроме того, зависят от решения по нише санузла 2 (проём Д-5 в перегородке П-1).</text><text x="25" y="218" font-size="2.5" fill="#000">5. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text></g></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-4" data-level="0"><text x="25.5" y="275.5" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">Основа листа: взаимное расположение помещений, контур дома 9600 × 8000 и раскладка этажей подобраны проектировщиком под габариты помещений брифа; обмер и проект АР —</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">задание (К-1); высота потолка 2900 мм — по брифу, не замерена; перекрытие 330 мм и отметка 2-го этажа +3,230 приняты; проект КР — задание (К-2); наружные стены 400 мм,</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">перегородки 120 мм приняты (в брифе толщин нет) (К-1); разрешённая мощность 15 кВт принята по типовым ТУ для частного дома (К-4).</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1, К-2, К-4).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="2
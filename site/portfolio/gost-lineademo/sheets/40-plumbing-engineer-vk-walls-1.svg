/text><line x1="197.89" y1="194" x2="197.89" y2="226" stroke="#000" stroke-width="0.25"/><text x="254.95" y="199.3" font-size="2.5" text-anchor="middle" data-fit="113.11" fill="#000">Привязка, мм</text><line x1="25" y1="208" x2="312" y2="208" stroke="#000" stroke-width="0.18"/><text x="26.5" y="206.3" font-size="2.5" text-anchor="start" data-fit="22.02" fill="#000">В1-1</text><text x="51.52" y="206.3" font-size="2.5" text-anchor="start" data-fit="103.6" fill="#000">П1 мойка кухонная</text><text x="158.11" y="206.3" font-size="2.5" text-anchor="start" data-fit="14.26" fill="#000">½″</text><text x="175.38" y="206.3" font-size="2.5" text-anchor="start" data-fit="21.02" fill="#000">600*</text><text x="199.39" y="206.3" font-size="2.5" text-anchor="start" data-fit="111.11" fill="#000">ст. Г: 1235 от лев. угла</text><line x1="25" y1="214" x2="312" y2="214" stroke="#000" stroke-width="0.18"/><text x="26.5" y="212.3" font-size="2.5" text-anchor="start" data-fit="22.02" fill="#000">Т3-1</text><text x="51.52" y="212.3" font-size="2.5" text-anchor="start" data-fit="103.6" fill="#000">П1 мойка кухонная</text><text x="158.11" y="212.3" font-size="2.5" text-anchor="start" data-fit="14.26" fill="#000">½″</text><text x="175.38" y="212.3" font-size="2.5" text-anchor="start" data-fit="21.02" fill="#000">600*</text><text x="199.39" y="212.3" font-size="2.5" text-anchor="start" data-fit="111.11" fill="#000">ст. Г: 1135 от лев. угла</text><line x1="25" y1="220" x2="312" y2="220" stroke="#000" stroke-width="0.18"/><text x="26.5" y="218.3" font-size="2.5" text-anchor="start" data-fit="22.02" fill="#000">К1-1</text><text x="51.52" y="218.3" font-size="2.5" text-anchor="start" data-fit="103.6" fill="#000">П1 мойка кухонная</text><text x="158.11" y="218.3" font-size="2.5" text-anchor="start" data-fit="14.26" fill="#000">Ø50</text><text x="175.38" y="218.3" font-size="2.5" text-anchor="start" data-fit="21.02" fill="#000">400*</text><text x="199.39" y="218.3" font-size="2.5" text-anchor="start" data-fit="111.11" fill="#000">ст. Г: 1185 от лев. угла</text><text x="26.5" y="224.3" font-size="2.5" text-anchor="start" data-fit="22.02" fill="#000">В1-2</text><text x="51.52" y="224.3" font-size="2.5" text-anchor="start" data-fit="103.6" fill="#000">П2 посудомоечная машина</text><text x="158.11" y="224.3" font-size="2.5" text-anchor="start" data-fit="14.26" fill="#000">½″</text><text x="175.38" y="224.3" font-size="2.5" text-anchor="start" data-fit="21.02" fill="#000">550*</text><text x="199.39" y="224.3" font-size="2.5" text-anchor="start" data-fit="111.11" fill="#000">ст. Г: 885 от лев. угла</text></g><g data-el="legend"><text x="320" y="192" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><circle cx="324" cy="198" r="1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/><text x="331" y="198.9" font-size="2.5" fill="#000">вывод В1 (код — в ведомости привязок)</text><circle cx="324" cy="203" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/><text x="331" y="203.9" font-size="2.5" fill="#000">вывод Т3 (код — в ведомости привязок)</text><circle cx="324" cy="208" r="1" fill="#fff" stroke="#6b4f2a" stroke-width="0.35"/><text x="331" y="208.9" font-size="2.5" fill="#000">вывод К1 (код — в ведомости привязок)</text><rect x="320.5" y="211" width="7" height="4" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="331" y="213.9" font-size="2.5" fill="#000">сантехприбор по расстановке (габарит модели)</text><rect x="320.5" y="216" width="7" height="4" fill="#fff" stroke="#000" stroke-width="0.25" stroke-dasharray="2 0.8"/><text x="331" y="218.9" font-size="2.5" fill="#000">дверной проём; окно — сплошной контур</text></g><g data-el="notes"><text x="25" y="240" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="245" font-size="2.5" fill="#000">1. Габариты и высоты приборов, межосевые смесителей и места кранов — по паспортам выбранных приборов, сверяются до разметки стен.</text><text x="25" y="248.6" font-size="2.5" fill="#000">2. Высоты Н — от чистого пола помещения, мм; отметка чистого пола и потолка — у левого края вида (от ±0,000 объекта). Привязки — от левого чистового</text><text x="25" y="252.2" font-size="2.5" fill="#000">угла вида (облицовка стен вычтена), как на развёртках стен.</text><text x="25" y="255.8" font-size="2.5" fill="#000">3. * — высота принята по практике монтажа: в данных прибора её нет; до разметки стен сверить по паспорту выбранного прибора (смеситель,</text><text x="25" y="259.4" font-size="2.5" fill="#000">инсталляция, сифон).</text><text x="25" y="263" font-size="2.5" fill="#000">4. Ревизионные люки к арматуре и ревизиям в данных не заданы: место и размер не определены (записи реестра нет).</text><text x="25" y="266.6" font-size="2.5" fill="#000">5. Мойка, ПММ и фильтр — выводы в шкафу мойки; диаметры и положение сифона и кранов сверить по паспортам приборов и чертежам модуля.</text><text x="25" y="270.2" font-size="2.5" fill="#000">6. Часть подписей выводов не уместилась у знака: коды и высоты — в ведомости привязок.</text><text x="25" y="273.8" font-size="2.5" fill="#000">7. Расчёт систем водоснабжения и канализации и подбор оборудования выполняет проектная организация; лист задаёт места и высоты выводов.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="75" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="75" y1="285.5" x2="75" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="77" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-3 К-7 К-8 К-9 К-10" data-level="0"><text x="251.5" y="165.2" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="251.5" y="168.6" font-size="2.5" fill="#000">Основа листа: размеры помещений и положение проёмов введены заказчиком в брифе, на объекте не замерены (К-1); высота потолка 2700 мм —</text><text x="251.5" y="172" font-size="2.5" fill="#000">по брифу заказчика, не замерена (К-2); толщины стен приняты по брифу: наружные 200 мм, внутренние 150 мм — не обмерены (К-1); тип дома</text><text x="251.5" y="175.4" font-size="2.5" fill="#000">монолитный, перекрытие 200 мм — по брифу заказчика, документов нет (К-3); планировка (стены, проёмы, объединение кухни и гостиной,</text><text x="251.5" y="178.8" font-size="2.5" fill="#000">расширение санузла) — по брифу без обмера и плана БТИ (К-7); разрешённая мощность 10 кВт принята, ТУ не переданы (К-8); вентканалы</text><text x="251.5" y="182.2" font-size="2.5" fill="#000">приняты, в брифе не заданы (К-9); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-10).</text><text x="251.5" y="185.6" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1–К-3, К-7–К-10).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="27
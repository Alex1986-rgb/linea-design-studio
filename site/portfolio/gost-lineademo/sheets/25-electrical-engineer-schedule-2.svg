 fill="#000">S13</text><text x="37.5" y="55.3" font-size="2.5" text-anchor="start" fill="#000">5</text><text x="45.5" y="55.3" font-size="2.5" text-anchor="start" fill="#000">900</text><text x="55.5" y="55.3" font-size="2.5" text-anchor="start" fill="#000">1</text><text x="64.5" y="55.3" font-size="2.5" text-anchor="start" fill="#000">обычный</text><text x="84.5" y="55.3" font-size="2.5" text-anchor="start" fill="#000">L4: Св12–Св14</text><line x1="25" y1="63" x2="117" y2="63" stroke="#000" stroke-width="0.18"/><text x="26.5" y="61.3" font-size="2.5" text-anchor="start" fill="#000"></text><text x="37.5" y="61.3" font-size="2.5" text-anchor="start" fill="#000"></text><text x="45.5" y="61.3" font-size="2.5" text-anchor="start" fill="#000"></text><text x="55.5" y="61.3" font-size="2.5" text-anchor="start" fill="#000">2</text><text x="64.5" y="61.3" font-size="2.5" text-anchor="start" fill="#000">обычный</text><text x="84.5" y="61.3" font-size="2.5" text-anchor="start" fill="#000">L5: Св15</text><text x="26.5" y="67.3" font-size="2.5" text-anchor="start" fill="#000">S15</text><text x="37.5" y="67.3" font-size="2.5" text-anchor="start" fill="#000">5</text><text x="45.5" y="67.3" font-size="2.5" text-anchor="start" fill="#000">900</text><text x="55.5" y="67.3" font-size="2.5" text-anchor="start" fill="#000">1</text><text x="64.5" y="67.3" font-size="2.5" text-anchor="start" fill="#000">проходной</text><text x="84.5" y="67.3" font-size="2.5" text-anchor="start" fill="#000">L10: Св26–Св29</text></g><g data-el="notes"><text x="25" y="241" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="246" font-size="2.5" fill="#000">1. Продолжение ведомостей: лист 2 из 2 этого наименования; таблицы, прерванные на предыдущем листе, продолжены с заголовком «(продолжение)».</text><text x="25" y="249.4" font-size="2.5" fill="#000">2. За отметку 0,000 принят уровень чистого пола. Высоты Н — от чистого пола до оси изделия; привязки — от чистовой грани стены до оси механизма (у рамки на</text><text x="28" y="252.8" font-size="2.5" fill="#000">несколько постов — до оси рамки).</text><text x="25" y="256.2" font-size="2.5" fill="#000">3. Розеточные и мокрые линии — через УЗО или дифавтомат с током утечки не более 30 мА (ПУЭ 7.1.79); в санузле выполнить ДСУП (ПУЭ 7.1.87–7.1.88).</text><text x="25" y="259.6" font-size="2.5" fill="#000">4. Кабель — медный, исполнение нг(А)-LS (ГОСТ 31565-2012); скрытая прокладка только горизонтально и вертикально, фактические трассы зафиксировать исполнительной</text><text x="28" y="263" font-size="2.5" fill="#000">схемой до закрытия отделкой.</text><text x="25" y="266.4" font-size="2.5" fill="#000">5. Расчёт нагрузок, токов КЗ, селективности и сечений — по проекту ЭОМ организации с допуском СРО; лист задаёт состав, расположение и группы.</text></g><g data-el="assumed-notes" data-flags="point:S11|point:S12|point:Св42|point:Св43|point:Св44|point:Св49" data-ids="К-1 К-2 К-3 К-7 К-8 К-9" data-level="0"><text x="22.5" y="210.3" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="22.5" y="213.7" font-size="2.5" fill="#000">Основа листа: размеры помещений и положение проёмов введены заказчиком в брифе, на объекте не замерены (К-1); высота потолка 2700 мм — по брифу заказчика, не замерена (К-2); толщины</text><text x="22.5" y="217.1" font-size="2.5" fill="#000">стен приняты по брифу: наружные 200 мм, внутренние 150 мм — не обмерены (К-1); тип дома монолитный, перекрытие 200 мм — по брифу заказчика, документов нет (К-3); планировка (стены,</text><text x="22.5" y="220.5" font-size="2.5" fill="#000">проёмы, объединение кухни и гостиной, расширение санузла) — по брифу без обмера и плана БТИ (К-7); разрешённая мощность 10 кВт принята, ТУ не переданы (К-8); вентканалы приняты, в</text><text x="22.5" y="223.9" font-size="2.5" fill="#000">брифе не заданы (К-9).</text><text x="22.5" y="227.3" font-size="2.5" fill="#000">Знак «**» — предложение проектировщика, заказчиком не утверждено (согласовать с заказчиком): записи в реестре нет: S11, S12 — светорегулятор добавлен разработчиком проекта; Св42, Св43,</text><text x="22.5" y="230.7" font-size="2.5" fill="#000">Св44, Св49 — диммируемость добавлена разработчиком проекта под светорегуляторы S11 и S12.</text><text x="22.5" y="234.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 5, записи К-1–К-3, К-7–К-9).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" fo
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Открытые вопросы, принятые допущения и конфликты. Лист 2 из 3" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты. Лист 2 из 3</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации (стартовое совещание 19.10.2026)</text><g data-el="open-issues" data-plan="fixed" data-plan-declared="3"><g data-el="issues-questions"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Открытые вопросы и принятые допущения (продолжение)</text><rect x="25" y="33" width="385" height="122.2" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="32" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="33" x2="39" y2="155.2" stroke="#000" stroke-width="0.25"/><text x="122" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Формулировка</text><line x1="205" y1="33" x2="205" y2="155.2" stroke="#000" stroke-width="0.25"/><text x="220" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Вид</text><line x1="235" y1="33" x2="235" y2="155.2" stroke="#000" stroke-width="0.25"/><text x="253" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Кто решает</text><line x1="271" y1="33" x2="271" y2="155.2" stroke="#000" stroke-width="0.25"/><text x="309.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Если решения нет</text><line x1="348" y1="33" x2="348" y2="155.2" stroke="#000" stroke-width="0.25"/><text x="379" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Лист, где это проявляется</text><g data-el="issue-row" data-kind="question" data-id="К-6"><text x="32" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">К-6</text><text x="40.5" y="46.7" font-size="2.5" fill="#000">Цвета названы заказчиком в брифе словами (тёплый белый, натуральное дерево, серо-зелёный). Исполнитель перевёл их в коды</text><text x="40.5" y="50.1" font-size="2.5" fill="#000">по веерам стиля джапанди: стены NCS S 0804-Y30R, потолки Tikkurila F485 Damask, второй план Tikkurila X447 Sea Smoke и V484</text><text x="40.5" y="53.5" font-size="2.5" fill="#000">Driftwood, акценты Farrow &amp; Ball No. 298 Bancha и NCS S 5010-G70Y (по комнатам). Выкрасы на объекте не делались. Утвердить</text><text x="40.5" y="56.9" font-size="2.5" fill="#000">коды по выкрасам. Матовость: в брифе в «не нравится» — «Глянец, холодный белый», поэтому стены матовые (в кухне-гостиной и</text><text x="40.5" y="60.3" font-size="2.5" fill="#000">прихожей — матовая моющаяся краска вместо полуматовой, класс мойки — по ведомости отделки); подтвердить вместе с кодами.</text><text x="206.5" y="46.7" font-size="2.5" fill="#000">Спорно</text><text x="206.5" y="50.1" font-size="2.5" fill="#000">Ждёт: решения</text><text x="236.5" y="46.7" font-size="2.5" fill="#000">Колорист-комплектатор</text><text x="272.5" y="46.7" font-size="2.5" fill="#000">коды — предложение исполнителя; краску не закупать до</text><text x="272.5" y="50.1" font-size="2.5" fill="#000">выкрасов</text><text x="349.5" y="46.7" font-size="2.5" fill="#000">л. 63 — Колерная карта</text></g><line x1="25" y1="63.4" x2="410" y2="63.4" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-7"><text x="32" y="67.1" font-size="2.5" text-anchor="middle" fill="#000">К-7</text><text x="40.5" y="67.1" font-size="2.5" fill="#000">Планировка принята по брифу заказчика: положение существующих стен и проёмов, объединение кухни с гостиной (демонтаж С-1),</text><text x="40.5" y="70.5" font-size="2.5" fill="#000">расширение санузла (демонтаж С-2, перегородка П-1) введены в мастер брифа без обмерного плана и плана БТИ. Расстановка</text><text x="40.5" y="73.9" font-size="2.5" fill="#000">мебели и кухни, рабочее место в спальне, антресоль в прихожей — предложение исполнителя по этой планировке. Нужны план БТИ</text><text x="40.5" y="77.3" font-size="2.5" fill="#000">и контрольный обмер; до них планировочное решение — предварительное.</text><text x="206.5" y="67.1" font-size="2.5" fill="#000">Непонятно</text><text x="206.5" y="70.5" font-size="2.5" fill="#000">Ждёт: документа</text><text x="236.5" y="67.1" font-size="2.5" fill="#000">Архитектор-планировщик</text><text x="272.5" y="67.1" font-size="2.5" fill="#000">расстановка остаётся предложением; мебель на заказ</text><text x="272.5" y="70.5" font-size="2.5" fill="#000">(кухня, шкафы) не заказывать</text><text x="349.5" y="67.1" font-size="2.5" fill="#000">л. 22 — Обмерный план</text><text x="349.5" y="70.5" font-size="2.5" fill="#000">л. 23 — План демонтажа и монтажа</text><text x="349.5" y="73.9" font-size="2.5" fill="#000">перегородок</text><text x="349.5" y="77.3" font-size="2.5" fill="#000">л. 28 — План расстановки мебели</text></g><line x1="25" y1="80.4" x2="410" y2="80.4" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-8"><text x="32" y="84.1" font-size="2.5" text-anchor="middle" fill="#000">К-8</text><text x="40.5" y="84.1" font-size="2.5" fill="#000">Разрешённая мощность квартиры по ТУ в брифе не указана; принята 10 кВт (квартира с электроплитой, монолитный дом). Передать</text><text x="40.5" y="87.5" font-size="2.5" fill="#000">ТУ или справку УК.</text><text x="206.5" y="84.1" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="87.5" font-size="2.5" fill="#000">Ждёт: документа</text><text x="236.5" y="84.1" font-size="2.5" fill="#000">Инженер-электрик</text><text x="272.5" y="84.1" font-size="2.5" fill="#000">щит и группы рассчитаны на 10 кВт; при меньших ТУ</text><text x="272.5" y="87.5" font-size="2.5" fill="#000">пересчёт групп варочной панели и духового шкафа</text><text x="349.5" y="84.1" font-size="2.5" fill="#000">л. 38 — Однолинейная схема щита</text></g><line x1="25" y1="90.6" x2="410" y2="90.6" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-9"><text x="32" y="94.3" font-size="2.5" text-anchor="middle" fill="#000">К-9</text><text x="40.5" y="94.3" font-size="2.5" fill="#000">Вентканалы в брифе не показаны: принято два канала — ВК-1 в санузле у стояков (стена А) и ВК-2 у стены В бывшей кухни. От них</text><text x="40.5" y="97.7" font-size="2.5" fill="#000">зависят вытяжка санузла, вытяжка над плитой (до обмера — рециркуляция) и короба потолка. Замерить положение и сечение на</text><text x="40.5" y="101.1" font-size="2.5" fill="#000">объекте.</text><text x="206.5" y="94.3" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="97.7" font-size="2.5" fill="#000">Ждёт: обмера</text><text x="236.5" y="94.3" font-size="2.5" fill="#000">Инженер ОВ</text><text x="272.5" y="94.3" font-size="2.5" fill="#000">вытяжка кухни — рециркуляционная; вентилятор санузла</text><text x="272.5" y="97.7" font-size="2.5" fill="#000">по месту ВК-1 после обмера</text><text x="349.5" y="94.3" font-size="2.5" fill="#000">л. 42 — План вентиляции</text><text x="349.5" y="97.7" font-size="2.5" fill="#000">л. 44 — План выводов сантехники</text></g><line x1="25" y1="104.2" x2="410" y2="104.2" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-10"><text x="32" y="107.9" font-size="2.5" text-anchor="middle" fill="#000">К-10</text><text x="40.5" y="107.9" font-size="2.5" fill="#000">Климатический подрайон (СП 131.13330) не задан: принят не северный — жилые комнаты и кухня под потолком от 2,5 м (СП 54, п.</text><text x="40.5" y="111.3" font-size="2.5" fill="#000">5.12); в IА, IБ, IГ, IД, IVА — от 2,7 м.</text><text x="206.5" y="107.9" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="111.3" font-size="2.5" fill="#000">Ждёт: документа</text><text x="236.5" y="107.9" font-size="2.5" fill="#000">Архитектор-планировщик</text><text x="272.5" y="107.9" font-size="2.5" fill="#000">отметки потолков жилых — по 2,5 м; при северном</text><text x="272.5" y="111.3" font-size="2.5" fill="#000">подрайоне уровни ниже 2,7 м пересчитать до заказа каркаса</text><text x="349.5" y="107.9" font-size="2.5" fill="#000">л. 54 — План потолков</text></g><line x1="25" y1="114.4" x2="410" y2="114.4" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-11"><text x="32" y="118.1" font-size="2.5" text-anchor="middle" fill="#000">К-11</text><text x="40.5" y="118.1" font-size="2.5" fill="#000">Мойка кухонная П1 (пом. 1 «Гостиная-кухня»), выпуск К1-1 Ø50: до стояка Ст К1-1 15,58 м через пом. 5 «Прихожая», перепад 390</text><text x="40.5" y="121.5" font-size="2.5" fill="#000">мм — короб 470×110 над полом через чужие помещения (их проёмы, мебель, проход) не построить. Решить: (а) насосная установка</text><text x="40.5" y="124.9" font-size="2.5" fill="#000">(КНС) под мойкой/прибором с напорной трубой Ø32 к стояку (по паспорту, обслуживаемый люк); (б) подиум кухонной зоны на 470 мм</text><text x="40.5" y="128.3" font-size="2.5" fill="#000">с трубой под ним; (в) перенос прибора ближе к стояку Ст К1-1. Решение меняет кухню (модули, цоколь, точки ЭОМ) — за автором с</text><text x="40.5" y="131.7" font-size="2.5" fill="#000">заказчиком.</text><text x="206.5" y="118.1" font-size="2.5" fill="#000">Спорно</text><text x="206.5" y="121.5" font-size="2.5" fill="#000">Ждёт: решения</text><text x="236.5" y="118.1" font-size="2.5" fill="#000">Инженер ВК (вода,</text><text x="236.5" y="121.5" font-size="2.5" fill="#000">канализация)</text><text x="272.5" y="118.1" font-size="2.5" fill="#000">выпуск К1-1 и кухню в части мойки не выполнять до</text><text x="272.5" y="121.5" font-size="2.5" fill="#000">решения; остальное — по листам</text><text x="349.5" y="118.1" font-size="2.5" fill="#000">л. 45 — Схема разводки водопровода и</text><text x="349.5" y="121.5" font-size="2.5" fill="#000">канализации</text><text x="349.5" y="124.9" font-size="2.5" fill="#000">л. 44 — План выводов сантехники</text></g><line x1="25" y1="134.8" x2="410" y2="134.8" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-12"><text x="32" y="138.5" font-size="2.5" text-anchor="middle" fill="#000">К-12</text><text x="40.5" y="138.5" font-size="2.5" fill="#000">Помещение «Спальня»: выключатель основного света L1 (S1) не у входа — у двери Д-3 со стороны ручки свободного места нет</text><text x="40.5" y="141.9" font-size="2.5" fill="#000">(проём в 100 мм от угла, мебель у двери, чужие точки или выключатель общий с соседним помещением; расстановка мебель и</text><text x="40.5" y="145.3" font-size="2.5" fill="#000">двери не двигает). Варианты: (а) петли на другую сторону — ручка уходит от угла, выключатель встаёт у ручки; (б) шкаф или тумбу у</text><text x="40.5" y="148.7" font-size="2.5" fill="#000">двери сдвинуть на 300 мм — место освобождается; (в) беспроводной выключатель на клее у ручки (реле в подрозетнике ближней</text><text x="40.5" y="152.1" font-size="2.5" fill="#000">стены) — по согласованию с заказчиком; (г) оставить как есть (S1): рука дальше 350 мм от ручки.</text><text x="206.5" y="138.5" font-size="2.5" fill="#000">Спорно</text><text x="206.5" y="141.9" font-size="2.5" fill="#000">Ждёт: решения</text><text x="236.5" y="138.5" font-size="2.5" fill="#000">Инженер-электрик</text><text x="272.5" y="138.5" font-size="2.5" fill="#000">выключатель L1 остаётся на месте (S1); закладные под</text><text x="272.5" y="141.9" font-size="2.5" fill="#000">выключатель у двери не делать до решения</text><text x="349.5" y="138.5" font-size="2.5" fill="#000">л. 35 — План выключателей и схема включения</text></g></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">16.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-011-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Квартира 56 м²</text><text x="297" y="259.2" font-size="2.5" data-fit="116" fill="#000">ЖК «Северный парк», Москва</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" data-fit="66" fill="#000">Дизайн-проект интерьера</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">7</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">120</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="283.1" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">Открытые вопросы, принятые допущения и</text><text x="330" y="286.9" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">конфликты. Лист 2 из 3</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="47" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="13" data-positions="75" data-basis="8"><rect x="314.27" y="6.2" width="99.23" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="316.27" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 13 (реестр — л. 6–8)</text></g></svg>
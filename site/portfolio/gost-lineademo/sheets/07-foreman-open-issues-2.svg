<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Открытые вопросы, принятые допущения и конфликты. Лист 2 из 2" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты. Лист 2 из 2</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации (стартовое совещание 19.10.2026)</text><g data-el="open-issues" data-plan="fixed" data-plan-declared="2"><g data-el="issues-changes"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Изменения проекта после выпуска листов (реестр изменений)</text><rect x="25" y="33" width="385" height="33.8" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="32" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="33" x2="39" y2="66.8" stroke="#000" stroke-width="0.25"/><text x="50" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><line x1="61" y1="33" x2="61" y2="66.8" stroke="#000" stroke-width="0.25"/><text x="91" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><line x1="121" y1="33" x2="121" y2="66.8" stroke="#000" stroke-width="0.25"/><text x="171" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Было</text><line x1="221" y1="33" x2="221" y2="66.8" stroke="#000" stroke-width="0.25"/><text x="283.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Стало</text><line x1="346" y1="33" x2="346" y2="66.8" stroke="#000" stroke-width="0.25"/><text x="378" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Кто решил, подпись</text><g data-el="issue-row" data-kind="change" data-id="ИЗ-1"><text x="32" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-1</text><text x="40.5" y="46.7" font-size="2.5" fill="#000">30.10.2026</text><text x="62.5" y="46.7" font-size="2.5" fill="#000">л. 21 — План расстановки мебели</text><text x="62.5" y="50.1" font-size="2.5" fill="#000">л. 19 — План дверей и ведомость заполнения</text><text x="62.5" y="53.5" font-size="2.5" fill="#000">проёмов</text><text x="62.5" y="56.9" font-size="2.5" fill="#000">л. 46 — План потолков</text><text x="62.5" y="60.3" font-size="2.5" fill="#000">л. 26 — План освещения</text><text x="62.5" y="63.7" font-size="2.5" fill="#000">л. 88 — Развёртка стены В. Детская (пом. 3)</text><text x="122.5" y="46.7" font-size="2.5" fill="#000">Гостиная-кухня: вход Д-2 (стена В, 3700…4600) упирался в спинку дивана Гс2,</text><text x="122.5" y="50.1" font-size="2.5" fill="#000">слева проход между консолью Гс5 (1600…3400) и креслом Гс4 — 575 мм,</text><text x="122.5" y="53.5" font-size="2.5" fill="#000">справа 175 мм до стены Б. Остров потолка У2 не центрирован на стол Кх11</text><text x="122.5" y="56.9" font-size="2.5" fill="#000">(зазор 100 / 450), подвесы — по столу. Детская: стол Дт3 вплотную к стене В</text><text x="122.5" y="60.3" font-size="2.5" fill="#000">над радиатором РО-3, примечание «прибор в корпусе не решён».</text><text x="222.5" y="46.7" font-size="2.5" fill="#000">Д-2 — петли у правого откоса (swing end), консоль Гс5 — offset 700…2500, кресло Гс4 — y</text><text x="222.5" y="50.1" font-size="2.5" fill="#000">2100…2850: проход от двери к кухне 975 / 825 мм. Остров У2 — inset A340/B1910/C2210/D1340</text><text x="222.5" y="53.5" font-size="2.5" fill="#000">(центр по столу), точка ленты Св41 — x 3300. Стол Дт3 — у стены Б торцом к окну (x 2775…3375, y</text><text x="222.5" y="56.9" font-size="2.5" fill="#000">5550…6750), стул Дт4 — x 2200, y 5900; радиатор РО-3 открыт. Знак «**» у Гс5, Гс4, Дт3 до</text><text x="222.5" y="60.3" font-size="2.5" fill="#000">подписи автора.</text><text x="347.5" y="46.7" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="50.1" font-size="2.5" fill="#000">исполнителя; предложение проектировщика, на</text><text x="347.5" y="53.5" font-size="2.5" fill="#000">утверждение А. С. Кырлана</text></g></g><g data-el="notes"><text x="25" y="79.2" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="84" font-size="2.5" fill="#000">1. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text><text x="25" y="87.4" font-size="2.5" fill="#000">2. Графа «Если решения нет» показывает состояние решения на листах; влияние на сроки и стоимость по пунктам не оценивалось.</text><text x="25" y="90.8" font-size="2.5" fill="#000">3. Пункт, по которому принято решение, при следующем выпуске комплекта из таблиц исключается.</text></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/
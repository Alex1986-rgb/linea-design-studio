<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Открытые вопросы, принятые допущения и конфликты. Лист 2 из 2" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты. Лист 2 из 2</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации (стартовое совещание 19.10.2026)</text><g data-el="open-issues" data-plan="fixed" data-plan-declared="2"><g data-el="issues-questions"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Открытые вопросы и принятые допущения (продолжение)</text><rect x="25" y="33" width="385" height="30.4" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="32" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="33" x2="39" y2="63.4" stroke="#000" stroke-width="0.25"/><text x="122" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Формулировка</text><line x1="205" y1="33" x2="205" y2="63.4" stroke="#000" stroke-width="0.25"/><text x="220" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Вид</text><line x1="235" y1="33" x2="235" y2="63.4" stroke="#000" stroke-width="0.25"/><text x="253" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Кто решает</text><line x1="271" y1="33" x2="271" y2="63.4" stroke="#000" stroke-width="0.25"/><text x="309.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Если решения нет</text><line x1="348" y1="33" x2="348" y2="63.4" stroke="#000" stroke-width="0.25"/><text x="379" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Лист, где это проявляется</text><g data-el="issue-row" data-kind="question" data-id="К-12"><text x="32" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">К-12</text><text x="40.5" y="46.7" font-size="2.5" fill="#000">Помещение «Спальня»: выключатель основного света L1 (S1) не у входа — у двери Д-3 со стороны ручки свободного места нет</text><text x="40.5" y="50.1" font-size="2.5" fill="#000">(проём в 100 мм от угла, мебель у двери, чужие точки или выключатель общий с соседним помещением; расстановка мебель и</text><text x="40.5" y="53.5" font-size="2.5" fill="#000">двери не двигает). Варианты: (а) петли на другую сторону — ручка уходит от угла, выключатель встаёт у ручки; (б) шкаф или тумбу у</text><text x="40.5" y="56.9" font-size="2.5" fill="#000">двери сдвинуть на 300 мм — место освобождается; (в) беспроводной выключатель на клее у ручки (реле в подрозетнике ближней</text><text x="40.5" y="60.3" font-size="2.5" fill="#000">стены) — по согласованию с заказчиком; (г) оставить как есть (S1): рука дальше 350 мм от ручки.</text><text x="206.5" y="46.7" font-size="2.5" fill="#000">Спорно</text><text x="206.5" y="50.1" font-size="2.5" fill="#000">Ждёт: решения</text><text x="236.5" y="46.7" font-size="2.5" fill="#000">Инженер-электрик</text><text x="272.5" y="46.7" font-size="2.5" fill="#000">выключатель L1 остаётся на месте (S1); закладные под</text><text x="272.5" y="50.1" font-size="2.5" fill="#000">выключатель у двери не делать до решения</text><text x="349.5" y="46.7" font-size="2.5" fill="#000">л. 33 — План выключателей и схема включения</text></g></g><g data-el="issues-changes"><text x="25" y="75.8" font-size="3.5" font-weight="700" fill="#000">Изменения проекта после выпуска листов (реестр изменений)</text><rect x="25" y="78.4" width="385" height="57.6" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="88.4" x2="410" y2="88.4" stroke="#000" stroke-width="0.5"/><text x="32" y="84.3" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="78.4" x2="39" y2="136" stroke="#000" stroke-width="0.25"/><text x="50" y="84.3" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><line x1="61" y1="78.4" x2="61" y2="136" stroke="#000" stroke-width="0.25"/><text x="91" y="84.3" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><line x1="121" y1="78.4" x2="121" y2="136" stroke="#000" stroke-width="0.25"/><text x="171" y="84.3" font-size="2.5" text-anchor="middle" fill="#000">Было</text><line x1="221" y1="78.4" x2="221" y2="136" stroke="#000" stroke-width="0.25"/><text x="283.5" y="84.3" font-size="2.5" text-anchor="middle" fill="#000">Стало</text><line x1="346" y1="78.4" x2="346" y2="136" stroke="#000" stroke-width="0.25"/><text x="378" y="84.3" font-size="2.5" text-anchor="middle" fill="#000">Кто решил, подпись</text><g data-el="issue-row" data-kind="change" data-id="ИЗ-1"><text x="32" y="92.1" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-1</text><text x="40.5" y="92.1" font-size="2.5" fill="#000">30.10.2026</text><text x="62.5" y="92.1" font-size="2.5" fill="#000">л. 27 — План расстановки мебели</text><text x="62.5" y="95.5" font-size="2.5" fill="#000">л. 25 — План дверей и ведомость заполнения</text><text x="62.5" y="98.9" font-size="2.5" fill="#000">проёмов</text><text x="62.5" y="102.3" font-size="2.5" fill="#000">л. 52 — План потолков</text><text x="62.5" y="105.7" font-size="2.5" fill="#000">л. 32 — План освещения</text><text x="62.5" y="109.1" font-size="2.5" fill="#000">л. 86 — Развёртка стены В. Гостиная-кухня</text><text x="62.5" y="112.5" font-size="2.5" fill="#000">(пом. 1)</text><text x="122.5" y="92.1" font-size="2.5" fill="#000">Гостиная-кухня: вход Д-2 (стена В, 3700…4600) упирался в спинку дивана Гс2,</text><text x="122.5" y="95.5" font-size="2.5" fill="#000">слева проход между консолью Гс5 (1600…3400) и креслом Гс4 — 575 мм,</text><text x="122.5" y="98.9" font-size="2.5" fill="#000">справа 175 мм до стены Б. Остров потолка У2 не центрирован на стол Кх11</text><text x="122.5" y="102.3" font-size="2.5" fill="#000">(зазор 100 / 450), подвесы — по столу. Детская: стол Дт3 вплотную к стене В</text><text x="122.5" y="105.7" font-size="2.5" fill="#000">над радиатором РО-3, примечание «прибор в корпусе не решён».</text><text x="222.5" y="92.1" font-size="2.5" fill="#000">Д-2 — петли у правого откоса (swing end), консоль Гс5 — смещение 700…2500, кресло Гс4 — y</text><text x="222.5" y="95.5" font-size="2.5" fill="#000">2100…2850: проход от двери к кухне 975 / 825 мм. Остров У2 — вставка A340/B1910/C2210/D1340</text><text x="222.5" y="98.9" font-size="2.5" fill="#000">(центр по столу), точка ленты Св41 — x 3300. Стол Дт3 — у стены Б торцом к окну (x 2775…3375, y</text><text x="222.5" y="102.3" font-size="2.5" fill="#000">5550…6750), стул Дт4 — x 2200, y 5900; радиатор РО-3 открыт. Знак «**» у Гс5, Гс4, Дт3 до</text><text x="222.5" y="105.7" font-size="2.5" fill="#000">подписи автора.</text><text x="347.5" y="92.1" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="95.5" font-size="2.5" fill="#000">исполнителя; предложение проектировщика, на</text><text x="347.5" y="98.9" font-size="2.5" fill="#000">утверждение А. С. Кырлана</text></g><line x1="25" y1="115.6" x2="410" y2="115.6" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-2"><text x="32" y="119.3" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-2</text><text x="40.5" y="119.3" font-size="2.5" fill="#000">10.11.2026</text><text x="62.5" y="119.3" font-size="2.5" fill="#000">л. 27 — План расстановки мебели</text><text x="62.5" y="122.7" font-size="2.5" fill="#000">л. 64 — План текстиля и декора</text><text x="122.5" y="119.3" font-size="2.5" fill="#000">Стол Дт3 (детская, пом. 3) стоял вплотную к дверному проёму Д-4 в стене Б:</text><text x="122.5" y="122.7" font-size="2.5" fill="#000">край стола y 5550 мм = край проёма.</text><text x="222.5" y="119.3" font-size="2.5" fill="#000">Стол Дт3 сдвинут вдоль стены Б на 250 мм от двери: y 5800…6400 мм (было 5550…6150), x</text><text x="222.5" y="122.7" font-size="2.5" fill="#000">2000…3200 прежний; зазор от проёма Д-4 250 мм. Стул Дт4 сдвинут вместе со столом: y</text><text x="222.5" y="126.1" font-size="2.5" fill="#000">6150…6650 (было 5900…6400), x 2200 прежний; до стены С остаётся 100 мм. Розетки Р11, LAN2 у</text><text x="222.5" y="129.5" font-size="2.5" fill="#000">стола на стене С (смещения 2400 и 2500) не тронуты. Стол Дт3 остаётся предложением</text><text x="222.5" y="132.9" font-size="2.5" fill="#000">проектировщика.</text><text x="347.5" y="119.3" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="122.7" font-size="2.5" fill="#000">исполнителя; на утверждение А. С. Кырлана</text></g></g><g data-el="notes"><text x="25" y="148.4" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="153.2" font-size="2.5" fill="#000">1. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text><text x="25" y="156.6" font-size="2.5" fill="#000">2. Графа «Если решения нет» показывает состояние решения на листах; влияние на сроки и стоимость по пунктам не оценивалось.</text><text x="25" y="160" font-size="2.5" fill="#000">3. Пункт, по которому принято решение, при следующем выпуске комплекта из таблиц исключается.</text></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">10.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-011-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Квартира 56 м²</text><text x="297" y="259.2" font-size="2.5" data-fit="116" fill="#000">ЖК «Северный парк», Москва</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" data-fit="66" fill="#000">Дизайн-проект интерьера</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">7</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">119</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="283.1" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">Открытые вопросы, принятые допущения и</text><text x="330" y="286.9" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">конфликты. Лист 2 из 2</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="47" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="14" data-positions="61" data-basis="8"><rect x="314.2" y="6.2" width="99.3" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="316.2" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 14 (реестр — л. 6, 7)</text></g></svg>
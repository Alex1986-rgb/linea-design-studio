<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Открытые вопросы, принятые допущения и конфликты. Лист 2 из 2" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты. Лист 2 из 2</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации (стартовое совещание 19.10.2026)</text><g data-el="open-issues" data-plan="fixed" data-plan-declared="2"><g data-el="issues-questions"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Открытые вопросы и принятые допущения (продолжение)</text><rect x="25" y="33" width="385" height="50.8" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="32" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="33" x2="39" y2="83.8" stroke="#000" stroke-width="0.25"/><text x="122" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Формулировка</text><line x1="205" y1="33" x2="205" y2="83.8" stroke="#000" stroke-width="0.25"/><text x="220" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Вид</text><line x1="235" y1="33" x2="235" y2="83.8" stroke="#000" stroke-width="0.25"/><text x="253" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Кто решает</text><line x1="271" y1="33" x2="271" y2="83.8" stroke="#000" stroke-width="0.25"/><text x="309.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Если решения нет</text><line x1="348" y1="33" x2="348" y2="83.8" stroke="#000" stroke-width="0.25"/><text x="379" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Лист, где это проявляется</text><g data-el="issue-row" data-kind="question" data-id="К-11"><text x="32" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">К-11</text><text x="40.5" y="46.7" font-size="2.5" fill="#000">Мойка кухонная П1 (пом. 1 «Гостиная-кухня»), выпуск К1-1 Ø50: до стояка Ст К1-1 15,58 м через пом. 5 «Прихожая», перепад 390</text><text x="40.5" y="50.1" font-size="2.5" fill="#000">мм — короб 470×110 над полом через чужие помещения (их проёмы, мебель, проход) не построить. Решить: (а) насосная установка</text><text x="40.5" y="53.5" font-size="2.5" fill="#000">(КНС) под мойкой/прибором с напорной трубой Ø32 к стояку (по паспорту, обслуживаемый люк); (б) подиум кухонной зоны на 470 мм</text><text x="40.5" y="56.9" font-size="2.5" fill="#000">с трубой под ним; (в) перенос прибора ближе к стояку Ст К1-1. Решение меняет кухню (модули, цоколь, точки ЭОМ) — за автором с</text><text x="40.5" y="60.3" font-size="2.5" fill="#000">заказчиком.</text><text x="206.5" y="46.7" font-size="2.5" fill="#000">Спорно</text><text x="206.5" y="50.1" font-size="2.5" fill="#000">Ждёт: решения</text><text x="236.5" y="46.7" font-size="2.5" fill="#000">Инженер ВК (вода,</text><text x="236.5" y="50.1" font-size="2.5" fill="#000">канализация)</text><text x="272.5" y="46.7" font-size="2.5" fill="#000">выпуск К1-1 и кухню в части мойки не выполнять до</text><text x="272.5" y="50.1" font-size="2.5" fill="#000">решения; остальное — по листам</text><text x="349.5" y="46.7" font-size="2.5" fill="#000">л. 44 — Схема разводки водопровода и</text><text x="349.5" y="50.1" font-size="2.5" fill="#000">канализации</text><text x="349.5" y="53.5" font-size="2.5" fill="#000">л. 43 — План выводов сантехники</text></g><line x1="25" y1="63.4" x2="410" y2="63.4" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-12"><text x="32" y="67.1" font-size="2.5" text-anchor="middle" fill="#000">К-12</text><text x="40.5" y="67.1" font-size="2.5" fill="#000">Помещение «Спальня»: выключатель основного света L1 (S1) не у входа — у двери Д-3 со стороны ручки свободного места нет</text><text x="40.5" y="70.5" font-size="2.5" fill="#000">(проём в 100 мм от угла, мебель у двери, чужие точки или выключатель общий с соседним помещением; расстановка мебель и</text><text x="40.5" y="73.9" font-size="2.5" fill="#000">двери не двигает). Варианты: (а) петли на другую сторону — ручка уходит от угла, выключатель встаёт у ручки; (б) шкаф или тумбу у</text><text x="40.5" y="77.3" font-size="2.5" fill="#000">двери сдвинуть на 300 мм — место освобождается; (в) беспроводной выключатель на клее у ручки (реле в подрозетнике ближней</text><text x="40.5" y="80.7" font-size="2.5" fill="#000">стены) — по согласованию с заказчиком; (г) оставить как есть (S1): рука дальше 350 мм от ручки.</text><text x="206.5" y="67.1" font-size="2.5" fill="#000">Спорно</text><text x="206.5" y="70.5" font-size="2.5" fill="#000">Ждёт: решения</text><text x="236.5" y="67.1" font-size="2.5" fill="#000">Инженер-электрик</text><text x="272.5" y="67.1" font-size="2.5" fill="#000">выключатель L1 остаётся на месте (S1); закладные под</text><text x="272.5" y="70.5" font-size="2.5" fill="#000">выключатель у двери не делать до решения</text><text x="349.5" y="67.1" font-size="2.5" fill="#000">л. 34 — План выключателей и схема включения</text></g></g><g data-el="issues-changes"><text x="25" y="96.2" font-size="3.5" font-weight="700" fill="#000">Изменения проекта после выпуска листов (реестр изменений)</text><rect x="25" y="98.8" width="385" height="98.4" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="108.8" x2="410" y2="108.8" stroke="#000" stroke-width="0.5"/><text x="32" y="104.7" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="98.8" x2="39" y2="197.2" stroke="#000" stroke-width="0.25"/><text x="50" y="104.7" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><line x1="61" y1="98.8" x2="61" y2="197.2" stroke="#000" stroke-width="0.25"/><text x="91" y="104.7" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><line x1="121" y1="98.8" x2="121" y2="197.2" stroke="#000" stroke-width="0.25"/><text x="171" y="104.7" font-size="2.5" text-anchor="middle" fill="#000">Было</text><line x1="221" y1="98.8" x2="221" y2="197.2" stroke="#000" stroke-width="0.25"/><text x="283.5" y="104.7" font-size="2.5" text-anchor="middle" fill="#000">Стало</text><line x1="346" y1="98.8" x2="346" y2="197.2" stroke="#000" stroke-width="0.25"/><text x="378" y="104.7" font-size="2.5" text-anchor="middle" fill="#000">Кто решил, подпись</text><g data-el="issue-row" data-kind="change" data-id="ИЗ-1"><text x="32" y="112.5" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-1</text><text x="40.5" y="112.5" font-size="2.5" fill="#000">30.10.2026</text><text x="62.5" y="112.5" font-size="2.5" fill="#000">л. 27 — План расстановки мебели</text><text x="62.5" y="115.9" font-size="2.5" fill="#000">л. 25 — План дверей и ведомость заполнения</text><text x="62.5" y="119.3" font-size="2.5" fill="#000">проёмов</text><text x="62.5" y="122.7" font-size="2.5" fill="#000">л. 53 — План потолков</text><text x="62.5" y="126.1" font-size="2.5" fill="#000">л. 33 — План освещения</text><text x="62.5" y="129.5" font-size="2.5" fill="#000">л. 87 — Развёртка стены В. Гостиная-кухня</text><text x="62.5" y="132.9" font-size="2.5" fill="#000">(пом. 1)</text><text x="122.5" y="112.5" font-size="2.5" fill="#000">Гостиная-кухня: вход Д-2 (стена В, 3700…4600) упирался в спинку дивана Гс2,</text><text x="122.5" y="115.9" font-size="2.5" fill="#000">слева проход между консолью Гс5 (1600…3400) и креслом Гс4 — 575 мм,</text><text x="122.5" y="119.3" font-size="2.5" fill="#000">справа 175 мм до стены Б. Остров потолка У2 не центрирован на стол Кх11</text><text x="122.5" y="122.7" font-size="2.5" fill="#000">(зазор 100 / 450), подвесы — по столу. Детская: стол Дт3 вплотную к стене В</text><text x="122.5" y="126.1" font-size="2.5" fill="#000">над радиатором РО-3, примечание «прибор в корпусе не решён».</text><text x="222.5" y="112.5" font-size="2.5" fill="#000">Д-2 — петли у правого откоса, консоль Гс5 — смещение 700…2500, кресло Гс4 — y 2100…2850:</text><text x="222.5" y="115.9" font-size="2.5" fill="#000">проход от двери к кухне 975 / 825 мм. Остров У2 — вставка A340/B1910/C2210/D1340 (центр по</text><text x="222.5" y="119.3" font-size="2.5" fill="#000">столу), точка ленты Св41 — x 3300. Стол Дт3 — у стены Б торцом к окну (x 2775…3375, y</text><text x="222.5" y="122.7" font-size="2.5" fill="#000">5550…6750), стул Дт4 — x 2200, y 5900; радиатор РО-3 открыт. Знак «**» у Гс5, Гс4, Дт3 до</text><text x="222.5" y="126.1" font-size="2.5" fill="#000">подписи автора.</text><text x="347.5" y="112.5" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 12.11.2026.</text><text x="347.5" y="115.9" font-size="2.5" fill="#000">Предложил: исполнитель.</text></g><line x1="25" y1="136" x2="410" y2="136" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-2"><text x="32" y="139.7" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-2</text><text x="40.5" y="139.7" font-size="2.5" fill="#000">10.11.2026</text><text x="62.5" y="139.7" font-size="2.5" fill="#000">л. 27 — План расстановки мебели</text><text x="62.5" y="143.1" font-size="2.5" fill="#000">л. 65 — План текстиля и декора</text><text x="122.5" y="139.7" font-size="2.5" fill="#000">Стол Дт3 (детская, пом. 3) стоял вплотную к дверному проёму Д-4 в стене Б:</text><text x="122.5" y="143.1" font-size="2.5" fill="#000">край стола y 5550 мм = край проёма.</text><text x="222.5" y="139.7" font-size="2.5" fill="#000">Стол Дт3 сдвинут вдоль стены Б на 250 мм от двери: y 5800…6400 мм (было 5550…6150), x</text><text x="222.5" y="143.1" font-size="2.5" fill="#000">2000…3200 прежний; зазор от проёма Д-4 250 мм. Стул Дт4 сдвинут вместе со столом: y</text><text x="222.5" y="146.5" font-size="2.5" fill="#000">6150…6650 (было 5900…6400), x 2200 прежний; до стены С остаётся 100 мм. Розетки Р11, LAN2 у</text><text x="222.5" y="149.9" font-size="2.5" fill="#000">стола на стене С (смещения 2400 и 2500) не тронуты. Стол Дт3 остаётся предложением</text><text x="222.5" y="153.3" font-size="2.5" fill="#000">проектировщика.</text><text x="347.5" y="139.7" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 12.11.2026.</text><text x="347.5" y="143.1" font-size="2.5" fill="#000">Предложил: исполнитель.</text></g><line x1="25" y1="156.4" x2="410" y2="156.4" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-3"><text x="32" y="160.1" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-3</text><text x="40.5" y="160.1" font-size="2.5" fill="#000">12.11.2026</text><text x="62.5" y="160.1" font-size="2.5" fill="#000">л. 65 — План текстиля и декора</text><text x="62.5" y="163.5" font-size="2.5" fill="#000">л. 67 — Ведомость текстиля</text><text x="62.5" y="166.9" font-size="2.5" fill="#000">л. 68 — Ведомость декора. Схемы развески</text><text x="122.5" y="160.1" font-size="2.5" fill="#000">Разбор двух критиков по кадрам: «стерильный шоурум, жизни нет»; ванна Сн1</text><text x="122.5" y="163.5" font-size="2.5" fill="#000">в кадре без смесителя — в наименовании прибора смеситель не назван.</text><text x="122.5" y="166.9" font-size="2.5" fill="#000">Санузел без текстиля и предметов; на столах, консоли и тумбах нет ни одной</text><text x="122.5" y="170.3" font-size="2.5" fill="#000">вещи; в прихожей — только зеркало над скамьёй; на диване и кроватях по 5</text><text x="122.5" y="173.7" font-size="2.5" fill="#000">декоративных подушек.</text><text x="222.5" y="160.1" font-size="2.5" fill="#000">Ванна Сн1 — «акриловая 1700×750, смеситель настенный». Санузел: банные и ручные полотенца</text><text x="222.5" y="163.5" font-size="2.5" fill="#000">на полотенцесушителе Сн5 (Т20, Т21), коврик 800×450 у бортика ванны (Т22; вне полотна двери</text><text x="222.5" y="166.9" font-size="2.5" fill="#000">Д-5), ваза с сухой веткой на полке короба инсталляции (ДК9). Прихожая: графика «энсо» 400×560 в</text><text x="222.5" y="170.3" font-size="2.5" fill="#000">простенке стены Г (ДК10); дорожка и консоль не заданы — свободный пол в зонах открывания пяти</text><text x="222.5" y="173.7" font-size="2.5" fill="#000">дверей, стены заняты щитами, домофоном и выключателями. Гостиная-кухня: книги и свеча на</text><text x="222.5" y="177.1" font-size="2.5" fill="#000">журнальном столике (ДК11), керамика и настольная лампа на консоли Гс5 (ДК12, ДК13), керамика</text><text x="222.5" y="180.5" font-size="2.5" fill="#000">на столешнице кухни (ДК14). Спальня: книги на тумбе Сп2 (ДК15), шеффлера в углу у окна (ДК16),</text><text x="222.5" y="183.9" font-size="2.5" fill="#000">рабочая лампа на столе Сп5 (ДК17). Детская: рабочая лампа на столе Дт3 (ДК18). Декоративных</text><text x="222.5" y="187.3" font-size="2.5" fill="#000">подушек — по 4 на диван и кровати (Т17, Т4, Т10: 3 → 2). Цвета — из палитры джапанди проекта:</text><text x="222.5" y="190.7" font-size="2.5" fill="#000">олива Bancha и S 5010-G70Y, песочный S 2005-Y30R, тёплый белый Damask. Знак «**» у позиций</text><text x="222.5" y="194.1" font-size="2.5" fill="#000">до подписи автора.</text><text x="347.5" y="160.1" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="163.5" font-size="2.5" fill="#000">исполнителя; предложение проектировщика, на</text><text x="347.5" y="166.9" font-size="2.5" fill="#000">утверждение А. С. Кырлана</text></g></g><g data-el="notes"><text x="25" y="209.6" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="214.4" font-size="2.5" fill="#000">1. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text><text x="25" y="217.8" font-size="2.5" fill="#000">2. Графа «Если решения нет» показывает состояние решения на листах; влияние на сроки и стоимость по пунктам не оценивалось.</text><text x="25" y="221.2" font-size="2.5" fill="#000">3. Пункт, по которому принято решение, при следующем выпуске комплекта из таблиц исключается.</text></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor
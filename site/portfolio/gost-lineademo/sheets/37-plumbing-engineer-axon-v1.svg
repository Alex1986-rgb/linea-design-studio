d="M 198.09 104.08 L 198.94 103.23" fill="none" stroke="#1f5fbf" stroke-width="0.5"/><path d="M 198.94 103.23 L 198.94 84.23" fill="none" stroke="#1f5fbf" stroke-width="0.5"/><path d="M 214.09 104.08 L 214.94 103.23" fill="none" stroke="#1f5fbf" stroke-width="0.5"/><path d="M 214.94 103.23 L 214.94 98.23" fill="none" stroke="#1f5fbf" stroke-width="0.5"/></g><g data-el="pl-marks"><circle cx="59.76" cy="95.81" r="0.6" fill="#1f5fbf"/><circle cx="220.77" cy="105" r="0.6" fill="#1f5fbf"/><circle cx="220.77" cy="105" r="0.6" fill="#1f5fbf"/><circle cx="198.09" cy="104.08" r="0.6" fill="#1f5fbf"/><circle cx="214.09" cy="104.08" r="0.6" fill="#1f5fbf"/><path d="M 214.37 103.7 L 218.37 106.3 L 218.37 103.7 L 214.37 106.3 Z" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/><g data-el="pl-outlet" data-index="В1"><circle cx="59.84" cy="81.33" r="1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="В1"><circle cx="57.36" cy="84.81" r="1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="В1"><circle cx="185.05" cy="105.62" r="1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="В1"><circle cx="195.94" cy="91.23" r="1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="В1"><circle cx="198.94" cy="84.23" r="1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="В1"><circle cx="214.94" cy="98.23" r="1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/></g></g><g data-el="risers"><g data-el="riser" data-index="В1"><path d="M 221.37 110 L 221.37 51" fill="none" stroke="#1f5fbf" stroke-width="0.7" stroke-dasharray="1.6 1"/><path d="M 219.57 109.5 L 220.77 110.5 L 221.97 109.5 L 223.17 110.5" fill="none" stroke="#000" stroke-width="0.25"/><path d="M 219.57 50.5 L 220.77 51.5 L 221.97 50.5 L 223.17 51.5" fill="none" stroke="#000" stroke-width="0.25"/><circle cx="221.37" cy="105" r="1.1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/></g></g><g data-el="pl-labels"><text x="32.73" y="102.77" font-size="2.5" fill="#555">1 Гостиная-кухня</text><text x="157.83" y="122.22" font-size="2.5" fill="#555">4 Санузел</text><text x="215.03" y="45.4" font-size="2.5" fill="#1f5fbf">Ст В1-1* Ø32</text><text x="215.03" y="48.4" font-size="2.5" fill="#1f5fbf">+2,700</text><text x="224.67" y="101" font-size="2.5" fill="#000">−0,015</text><text x="185.32" y="90.33" font-size="2.5" fill="#000">В1-6 Сн4</text><text x="185.32" y="93.33" font-size="2.5" fill="#000">Н=600*</text><text x="200.84" y="83.33" font-size="2.5" fill="#000">В1-5 Сн3</text><text x="200.84" y="86.33" font-size="2.5" fill="#000">Н=950*</text><text x="204.32" y="97.33" font-size="2.5" fill="#000">В1-4 Сн2</text><text x="204.32" y="100.33" font-size="2.5" fill="#000">Н=250*</text><text x="100.11" y="95.72" font-size="2.5" fill="#1f5fbf">Ø20</text><text x="100.11" y="98.72" font-size="2.5" fill="#1f5fbf">L=10,31</text></g></g><g data-el="legend-box"><g data-el="legend"><text x="310" y="25" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><line x1="310.5" y1="31" x2="317.5" y2="31" stroke="#1f5fbf" stroke-width="0.5"/><text x="321" y="31.9" font-size="2.5" fill="#000">В1 — водопровод хозяйственно-питьевой (ХВС), PP-R Ø20</text><circle cx="314" cy="36" r="1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/><text x="321" y="36.9" font-size="2.5" fill="#000">вывод В1 (код — в ведомости привязок)</text><circle cx="314" cy="41" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="321" y="41.9" font-size="2.5" fill="#000">стояк «Ст К1-N / Ст В1-N» (ГОСТ 21.601), Ø мм</text><circle cx="314" cy="46" r="1.1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/><text x="321" y="46.9" font-size="2.5" fill="#000">стояк в плане (на отметке пола); вертикаль — стояк по высоте,</text><text x="321" y="50.2" font-size="2.5" fill="#000">разрыв — перекрытие</text><circle cx="314" cy="54.3" r="0.6" fill="#000"/><text x="321" y="55.2" font-size="2.5" fill="#000">тройник (ответвление к прибору)</text><path d="M 312 58 L 316 60.6 L 316 58 L 312 60.6 Z" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="321" y="60.2" font-size="2.5" fill="#000">кран шаровой</text><circle cx="314" cy="64.3" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35" stroke-dasharray="0.8 0.6"/><text x="321" y="65.2" font-size="2.5" fill="#000">* стояк Т3 не на обмере — принят в шахте рядом со Ст В1, сверить</text></g></g><g data-el="notes"><text x="25" y="240" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="245" font-size="2.5" fill="#000">1. Схема В1 построена по тем же трассам, что план разводки: положение в плане сохранено, глубина — в масштабе ×0,5. Трассы принципиальные; фактическое</text><text x="25" y="248.6" font-size="2.5" fill="#000">положение фиксируется исполнительной схемой до закрытия.</text><text x="25" y="252.2" font-size="2.5" fill="#000">2. Высоты Н — от чистого пола помещения, мм. Отметка прокладки магистрали В1 (в стяжке, в стене или по полу) в данных не задана: участки показаны на</text><text x="25" y="255.8" font-size="2.5" fill="#000">уровне пола условно (записи реестра нет).</text><text x="25" y="259.4" font-size="2.5" fill="#000">3. * — высота вывода принята по практике монтажа; сверить по паспорту прибора.</text><text x="25" y="263" font-size="2.5" fill="#000">4. Узел ввода В1 (кран, фильтр, счётчик, обратный клапан, кран) — на схеме разводки; состав узла ввода — по согласованию. Кран шаровой — на первом</text><text x="25" y="266.6" font-size="2.5" fill="#000">участке от стояка.</text><text x="25" y="270.2" font-size="2.5" fill="#000" textLength="136.32" lengthAdjust="spacingAndGlyphs">5. Ст В1-1* на обмере не показаны: положение принято (по брифу заказчика), не замерено (К-4); положение сверить на объекте до разводки.</text><text x="25" y="273.8" font-size="2.5" fill="#000">6. Трубы испытать давлением до закрытия (акт скрытых работ, опрессовка по СП 73.13330.2016).</text><text x="25" y="277.4" font-size="2.5" fill="#000">7. Диаметры, высоты выводов и места кранов — по паспортам выбранных приборов и расчёту проектной организации.</text><text x="25" y="281" font-size="2.5" fill="#000">8. Расчёт систем, диаметры магистралей и подбор оборудования выполняет проектная организация.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="45" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="45" y1="285.5" x2="45" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="47" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="riser:Ст В1-1|riser:Ст К1-1" data-ids="К-1 К-2 К-3 К-4 К-7 К-8 К-9 К-10" data-level="0"><text x="45.5" y="210.3" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="45.5" y="213.7" font-size="2.5" fill="#000">Основа листа: размеры помещений и положение проёмов введены заказчиком в брифе, на объекте не замерены (К-1); высота потолка 2700 мм — по брифу заказчика, не замерена (К-2); толщины</text><text x="45.5" y="217.1" font-size="2.5" fill="#000">стен приняты по брифу: наружные 200 мм, внутренние 150 мм — не обмерены (К-1); тип дома монолитный, перекрытие 200 мм — по брифу заказчика, документов нет (К-3); планировка (стены,</text><text x="45.5" y="220.5" font-size="2.5" fill="#000">проёмы, объединение кухни и гостиной, расширение санузла) — по брифу без обмера и плана БТИ (К-7); разрешённая мощность 10 кВт принята, ТУ не переданы (К-8); вентканалы приняты, в</text><text x="45.5" y="223.9" font-size="2.5" fill="#000">брифе не заданы (К-9); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-10).</text><text x="45.5" y="227.3" font-size="2.5" fill="#000">Знак «*» — принято, не замерено и не подтверждено (замерить на объекте): К-4: Ст В1-1 — положение стояка холодной воды — по брифу заказчика, не замерено; Ст К1-1 — положение стояка</text><text x="45.5" y="230.7" font-size="2.5" fill="#000">канализации — по брифу заказчика, не замерено.</text><text x="45.5" y="234.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1–К-4, К-7–К-10).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">04.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-011-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Квартира 56 м²</text><text x="297" y="259.2" font-size="2.5" data-fit="116" fill="#000">ЖК «Северный парк», Москва</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" data-fit="66" fill="#000">Дизайн-проект интерьера</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">37</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">106</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="282.2" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">Аксонометрическая схема В1 (холодное</text><text x="330" y="286" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">водоснабжение)</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М 1:50</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="47" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="12" data-positions="59" data-basis="8"><rect x="314.2" y="6.2" width="99.3" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="316.2" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 12 (реестр — л. 6, 7)</text></g></svg>
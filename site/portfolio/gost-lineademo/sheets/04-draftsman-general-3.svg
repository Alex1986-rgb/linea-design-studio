xt x="86.5" y="243.15" font-size="2.5" fill="#000">Визуализация. Интерьер: Гостиная-кухня (пом. 1), стена А</text></g><line x1="25" y1="246.2" x2="210" y2="246.2" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="251.15" font-size="2.5" fill="#000">ГД-2026-011-АИ.В19</text><text x="86.5" y="251.15" font-size="2.5" fill="#000">Визуализация. Интерьер: Гостиная-кухня (пом. 1), стена Б</text></g><line x1="25" y1="254.2" x2="210" y2="254.2" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="259.15" font-size="2.5" fill="#000">ГД-2026-011-АИ.В20</text><text x="86.5" y="259.15" font-size="2.5" fill="#000">Визуализация. Интерьер: Гостиная-кухня (пом. 1), стена В</text></g><line x1="25" y1="262.2" x2="210" y2="262.2" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="267.15" font-size="2.5" fill="#000">ГД-2026-011-АИ.В21</text><text x="86.5" y="267.15" font-size="2.5" fill="#000">Визуализация. Интерьер: Гостиная-кухня (пом. 1), стена Г</text></g></g><g data-el="project-composition"><text x="220" y="29.5" font-size="3.5" font-weight="700" fill="#000">Состав дизайн-проекта</text><rect x="220" y="32" width="185" height="79.2" fill="none" stroke="#000" stroke-width="0.5"/><line x1="220" y1="47" x2="405" y2="47" stroke="#000" stroke-width="0.5"/><text x="239" y="40.4" font-size="2.5" text-anchor="middle" fill="#000">Раздел</text><line x1="258" y1="32" x2="258" y2="111.2" stroke="#000" stroke-width="0.25"/><text x="316.5" y="40.4" font-size="2.5" text-anchor="middle" fill="#000">Состав</text><line x1="375" y1="32" x2="375" y2="111.2" stroke="#000" stroke-width="0.25"/><text x="390" y="40.4" font-size="2.5" text-anchor="middle" fill="#000">Листы</text><g><text x="221.5" y="52.85" font-size="2.5" fill="#000">Обложка</text><text x="259.5" y="51.15" font-size="2.5" fill="#000">Дизайн-проект интерьера; Квартира 56 м²; автор проекта — Кырлан Александр</text><text x="259.5" y="54.55" font-size="2.5" fill="#000">Сергеевич</text><text x="390" y="52.85" font-size="2.5" text-anchor="middle" fill="#000">1 с.</text></g><line x1="220" y1="56.8" x2="405" y2="56.8" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="62.65" font-size="2.5" fill="#000">Концепция</text><text x="259.5" y="60.95" font-size="2.5" fill="#000">Стиль Джапанди: концепция интерьера, палитра и материалы (колерная карта — лист</text><text x="259.5" y="64.35" font-size="2.5" fill="#000">55)</text><text x="390" y="62.65" font-size="2.5" text-anchor="middle" fill="#000">л. 20</text></g><line x1="220" y1="66.6" x2="405" y2="66.6" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="79.25" font-size="2.5" fill="#000">Визуализации</text><text x="259.5" y="70.75" font-size="2.5" fill="#000">21 изобр.: Вид сверху (3D): планировка с мебелью, текстилем и декором; Санузел,</text><text x="259.5" y="74.15" font-size="2.5" fill="#000">стена А; Санузел, стена Б; Санузел, стена В; Санузел, стена Г; Спальня, стена А;</text><text x="259.5" y="77.55" font-size="2.5" fill="#000">Спальня, стена Б; Спальня, стена В; Спальня, стена Г; Прихожая, стена А;</text><text x="259.5" y="80.95" font-size="2.5" fill="#000">Прихожая, стена Б; Прихожая, стена В; Прихожая, стена Г; Детская, стена А;</text><text x="259.5" y="84.35" font-size="2.5" fill="#000">Детская, стена Б; Детская, стена В; Детская, стена Г; Гостиная-кухня, стена А;</text><text x="259.5" y="87.75" font-size="2.5" fill="#000">Гостиная-кухня, стена Б; Гостиная-кухня, стена В; Гостиная-кухня, стена Г</text><text x="390" y="79.25" font-size="2.5" text-anchor="middle" fill="#000">В1–В21</text></g><line x1="220" y1="90" x2="405" y2="90" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="94.95" font-size="2.5" fill="#000">Рабочие чертежи</text><text x="259.5" y="94.95" font-size="2.5" fill="#000">планы, развёртки, узлы (развёртки и узлы — листы 40–42, 73, 90, 92, 97, 98)</text><text x="390" y="94.95" font-size="2.5" text-anchor="middle" fill="#000">л. 1–106</text></g><line x1="220" y1="98" x2="405" y2="98" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="105.55" font-size="2.5" fill="#000">Спецификации и ведомости</text><text x="259.5" y="105.55" font-size="2.5" fill="#000">оборудование, изделия, отделка, электроточки</text><text x="390" y="102.15" font-size="2.5" text-anchor="middle" fill="#000">л. 19, 22–24, 28,</text><text x="390" y="105.55" font-size="2.5" text-anchor="middle" fill="#000">29, 43, 54–56, 60,</text><text x="390" y="108.95" font-size="2.5" text-anchor="middle" fill="#000">61, 99–104</text></g></g><g data-deviation="sheets-count-every-sheet"/><g data-deviation="scale-in-stamp"/><g data-deviation="elevation-1:40"/><g data-deviation="dim-font-2.5"/><g data-deviation="room-circle-8"/><g data-el="general-ref"><text x="25" y="290.2" font-size="2.5" textLength="182.47" lengthAdjust="spacingAndGlyphs" data-fit="203" fill="#000">Общие указания — лист 5: ±0,000 — чистый пол; несущие конструкции и сети дома — по отдельному проекту; скрытые работы — по актам. Открытые вопросы и допущения — листы 6, 7.</text><g data-el="open-issues-ref" data-target="6"/></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-3 К-7 К-8 К-9 К-10" data-level="0"><text x="212.5" y="213.7" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="212.5" y="217.1" font-size="2.5" fill="#000">Основа листа: размеры помещений и положение проёмов введены заказчиком в брифе, на объекте не замерены (К-1); высота потолка 2700 мм —</text><text x="212.5" y="220.5" font-size="2.5" fill="#000">по брифу заказчика, не замерена (К-2); толщины стен приняты по брифу: наружные 200 мм, внутренние 150 мм — не обмерены (К-1); тип дома</text><text x="212.5" y="223.9" font-size="2.5" fill="#000">монолитный, перекрытие 200 мм — по брифу заказчика, документов нет (К-3); планировка (стены, проёмы, объединение кухни и гостиной,</text><text x="212.5" y="227.3" font-size="2.5" fill="#000">расширение санузла) — по брифу без обмера и плана БТИ (К-7); разрешённая мощность 10 кВт принята, ТУ не переданы (К-8); вентканалы</text><text x="212.5" y="230.7" font-size="2.5" fill="#000">приняты, в брифе не заданы (К-9); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-10).</text><text x="212.5" y="234.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1–К-3, К-7–К-10).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text 
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Общие данные" data-sheet="general" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Общие данные</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Комплект ГД-2026-011-АИ · лист 3 общих данных (продолжение)</text><g data-el="ref-docs"><text x="25" y="29.5" font-size="3.5" font-weight="700" fill="#000">Ведомость ссылочных и прилагаемых документов</text><rect x="25" y="32" width="185" height="238.2" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="47" x2="210" y2="47" stroke="#000" stroke-width="0.5"/><text x="55" y="40.4" font-size="2.5" text-anchor="middle" fill="#000">Обозначение</text><line x1="85" y1="32" x2="85" y2="270.2" stroke="#000" stroke-width="0.25"/><text x="132.5" y="40.4" font-size="2.5" text-anchor="middle" fill="#000">Наименование</text><line x1="180" y1="32" x2="180" y2="270.2" stroke="#000" stroke-width="0.25"/><text x="195" y="40.4" font-size="2.5" text-anchor="middle" fill="#000">Примечание</text><g><text x="86.5" y="51.95" font-size="2.5" text-decoration="underline" fill="#000">Ссылочные документы</text></g><line x1="25" y1="55" x2="210" y2="55" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="60.85" font-size="2.5" fill="#000">ГОСТ 21.201-2011</text><text x="86.5" y="59.15" font-size="2.5" fill="#000">СПДС. Условные графические изображения элементов зданий,</text><text x="86.5" y="62.55" font-size="2.5" fill="#000">сооружений и конструкций</text></g><line x1="25" y1="64.8" x2="210" y2="64.8" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="69.75" font-size="2.5" fill="#000">ГОСТ 21.205-2016</text><text x="86.5" y="69.75" font-size="2.5" fill="#000">СПДС. Условные обозначения элементов санитарно-технических систем</text></g><line x1="25" y1="72.8" x2="210" y2="72.8" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="78.65" font-size="2.5" fill="#000">ГОСТ 21.210-2014</text><text x="86.5" y="76.95" font-size="2.5" fill="#000">СПДС. Изображения условные графические электрооборудования и</text><text x="86.5" y="80.35" font-size="2.5" fill="#000">проводок на планах</text></g><line x1="25" y1="82.6" x2="210" y2="82.6" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="88.45" font-size="2.5" fill="#000">ГОСТ 2.306-68</text><text x="86.5" y="86.75" font-size="2.5" fill="#000">ЕСКД. Обозначения графические материалов и правила их нанесения</text><text x="86.5" y="90.15" font-size="2.5" fill="#000">на чертежах</text></g><line x1="25" y1="92.4" x2="210" y2="92.4" stroke="#000" stroke-width="0.25"/><g><text x="86.5" y="97.35" font-size="2.5" text-decoration="underline" fill="#000">Прилагаемые документы</text></g><line x1="25" y1="100.4" x2="210" y2="100.4" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="106.25" font-size="2.5" fill="#000">ГД-2026-011-АИ.В1</text><text x="86.5" y="104.55" font-size="2.5" fill="#000">Визуализация. Вид сверху (3D): планировка с мебелью, текстилем и</text><text x="86.5" y="107.95" font-size="2.5" fill="#000">декором</text><text x="181.5" y="106.25" font-size="2.5" fill="#000">альбом визуализаций</text></g><line x1="25" y1="110.2" x2="210" y2="110.2" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="115.15" font-size="2.5" fill="#000">ГД-2026-011-АИ.В2</text><text x="86.5" y="115.15" font-size="2.5" fill="#000">Визуализация. Интерьер: Санузел (пом. 4), стена А</text></g><line x1="25" y1="118.2" x2="210" y2="118.2" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="123.15" font-size="2.5" fill="#000">ГД-2026-011-АИ.В3</text><text x="86.5" y="123.15" font-size="2.5" fill="#000">Визуализация. Интерьер: Санузел (пом. 4), стена Б</text></g><line x1="25" y1="126.2" x2
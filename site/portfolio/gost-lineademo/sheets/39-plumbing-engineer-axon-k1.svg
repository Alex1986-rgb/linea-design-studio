stroke="#6b4f2a" stroke-width="0.25" data-sym="revision"/></g><circle cx="219.52" cy="103.56" r="0.6" fill="#6b4f2a"/><g data-el="revision"><circle cx="223.32" cy="103.47" r="1.1" fill="#fff" stroke="#6b4f2a" stroke-width="0.25"/><path d="M 222.52 102.67 L 224.12 104.27 M 224.12 102.67 L 222.52 104.27" fill="none" stroke="#6b4f2a" stroke-width="0.25" data-sym="revision"/></g><g data-el="revision"><circle cx="205.78" cy="119.76" r="1.1" fill="#fff" stroke="#6b4f2a" stroke-width="0.25"/><path d="M 204.98 118.96 L 206.58 120.56 M 206.58 118.96 L 204.98 120.56" fill="none" stroke="#6b4f2a" stroke-width="0.25" data-sym="revision"/></g><g data-el="revision"><circle cx="199.98" cy="119.62" r="1.1" fill="#fff" stroke="#6b4f2a" stroke-width="0.25"/><path d="M 199.18 118.82 L 200.78 120.42 M 200.78 118.82 L 199.18 120.42" fill="none" stroke="#6b4f2a" stroke-width="0.25" data-sym="revision"/></g><circle cx="211.52" cy="103.36" r="0.6" fill="#6b4f2a"/><g data-el="revision"><circle cx="197.52" cy="103.01" r="1.1" fill="#fff" stroke="#6b4f2a" stroke-width="0.25"/><path d="M 196.72 102.21 L 198.32 103.81 M 198.32 102.21 L 196.72 103.81" fill="none" stroke="#6b4f2a" stroke-width="0.25" data-sym="revision"/></g><circle cx="199.52" cy="103.06" r="0.6" fill="#6b4f2a"/><path d="M 217.11 103.53 L 214.3 104.28 L 214.33 102.68 Z" fill="#6b4f2a"/><path d="M 132.46 69.23 L 129.64 69.96 L 129.68 68.36 Z" fill="#6b4f2a"/><path d="M 215.72 110.53 L 214.21 113.02 L 213.12 111.85 Z" fill="#6b4f2a"/><path d="M 206.11 103.23 L 203.3 103.96 L 203.34 102.36 Z" fill="#6b4f2a"/><g data-el="pl-outlet" data-index="К1"><circle cx="211.94" cy="98.13" r="1" fill="#fff" stroke="#6b4f2a" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="К1"><circle cx="59.49" cy="84.69" r="1" fill="#fff" stroke="#6b4f2a" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="К1"><circle cx="199.55" cy="119.92" r="1" fill="#fff" stroke="#6b4f2a" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="К1"><circle cx="197.94" cy="84.53" r="1" fill="#fff" stroke="#6b4f2a" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="К1"><circle cx="199.94" cy="90.53" r="1" fill="#fff" stroke="#6b4f2a" stroke-width="0.35"/></g></g><g data-el="risers"><g data-el="riser" data-index="К1"><path d="M 218.17 110 L 218.17 51" fill="none" stroke="#6b4f2a" stroke-width="0.7" stroke-dasharray="1.6 1"/><path d="M 216.37 109.5 L 217.57 110.5 L 218.77 109.5 L 219.97 110.5" fill="none" stroke="#000" stroke-width="0.25"/><path d="M 216.37 50.5 L 217.57 51.5 L 218.77 50.5 L 219.97 51.5" fill="none" stroke="#000" stroke-width="0.25"/><circle cx="218.17" cy="104.3" r="1.1" fill="#fff" stroke="#6b4f2a" stroke-width="0.35"/></g></g><g data-el="pl-labels"><text x="157.83" y="121.52" font-size="2.5" fill="#555">4 Санузел</text><text x="32.73" y="101.77" font-size="2.5" fill="#555">1 Гостиная-кухня</text><text x="211.34" y="45.4" font-size="2.5" fill="#6b4f2a">Ст К1-1* Ø110</text><text x="211.34" y="48.4" font-size="2.5" fill="#6b4f2a">+2,700</text><text x="221.47" y="100.3" font-size="2.5" fill="#000">−0,015</text><text x="201.5" y="97.23" font-size="2.5" fill="#000">К1-3 Сн2</text><text x="201.5" y="100.23" font-size="2.5" fill="#000">Н=220*</text><text x="195.28" y="123.72" font-size="2.5" fill="#000">К1-2 Сн1</text><text x="195.28" y="126.72" font-size="2.5" fill="#000">Н=50*</text><text x="199.84" y="83.63" font-size="2.5" fill="#000">К1-4 Сн3</text><text x="199.84" y="86.63" font-size="2.5" fill="#000">Н=900*</text><text x="188.1" y="89.63" font-size="2.5" fill="#000">К1-5 Сн4</text><text x="188.1" y="92.63" font-size="2.5" fill="#000">Н=600*</text><text x="126.64" y="62.19" font-size="2.5" fill="#6b4f2a">Ø50 i=25</text><text x="126.64" y="65.19" font-size="2.5" fill="#6b4f2a">L=15,58</text><text x="192.77" y="108.39" font-size="2.5" fill="#6b4f2a">Ø50 i=25</text><text x="192.77" y="111.39" font-size="2.5" fill="#6b4f2a">L=0,76</text></g></g><g data-el="legend-box"><g data-el="legend"><text x="310" y="25" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><line x1="310.5" y1="31" x2="317.5" y2="31" stroke="#6b4f2a" stroke-width="0.5" stroke-dasharray="6 1.2"/><text x="321" y="31.9" font-size="2.5" fill="#000">К1 — канализация бытовая</text><circle cx="314" cy="36" r="1" fill="#fff" stroke="#6b4f2a" stroke-width="0.35"/><text x="321" y="36.9" font-size="2.5" fill="#000">вывод К1 (код — в ведомости привязок)</text><circle cx="314" cy="41" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="321" y="41.9" font-size="2.5" fill="#000">стояк «Ст К1-N / Ст В1-N» (ГОСТ 21.601), Ø мм</text><circle cx="314" cy="46" r="1.1" fill="#fff" stroke="#6b4f2a" stroke-width="0.35"/><text x="321" y="46.9" font-size="2.5" fill="#000">стояк в плане (на отметке пола); вертикаль — стояк по высоте,</text><text x="321" y="50.2" font-size="2.5" fill="#000">разрыв — перекрытие</text><line x1="310.5" y1="54.3" x2="316" y2="54.3" stroke="#000" stroke-width="0.25"/><path d="M 317.5 54.3 L 315.7 53.599999999999994 L 315.7 55 Z" fill="#000"/><text x="321" y="55.2" font-size="2.5" fill="#000">направление уклона К1 / пола: Ø, мм на 1 м</text><circle cx="314" cy="59.3" r="1.1" fill="#fff" stroke="#000" stroke-width="0.25"/><path d="M 313.2 58.5 L 314.8 60.1 M 314.8 58.5 L 313.2 60.1" fill="none" stroke="#000" stroke-width="0.25" data-sym="revision"/><text x="321" y="60.2" font-size="2.5" fill="#000">ревизия (прочистка) К1 — доступ сохранить</text><circle cx="314" cy="64.3" r="0.6" fill="#000"/><text x="321" y="65.2" font-size="2.5" fill="#000">тройник (ответвление к прибору)</text><circle cx="314" cy="69.3" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35" stroke-dasharray="0.8 0.6"/><text x="321" y="70.2" font-size="2.5" fill="#000">* стояк Т3 не на обмере — принят в шахте рядом со Ст В1, сверить</text></g></g><g data-el="notes"><text x="25" y="240" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="245" font-size="2.5" fill="#000">1. Схема К1 построена по тем же трассам, что план разводки: положение в плане сохранено, глубина — в масштабе ×0,5. Трассы принципиальные; фактическое</text><text x="25" y="248.6" font-size="2.5" fill="#000">положение фиксируется исполнительной схемой до закрытия.</text><text x="25" y="252.2" font-size="2.5" fill="#000">2. Отметки — от плиты перекрытия: низ трубы у врезки в стояк — отметка из данных выпуска, к прибору труба поднимается на уклон i, мм/м (уклон не менее</text><text x="25" y="255.8" font-size="2.5" fill="#000">1/d и не более 150 мм/м, СП 30.13330.2020, п. 19.1); чистый пол — выше плиты на стяжку (высота пирога пола). Высота выпуска прибора Н — от чистого</text><text x="25" y="259.4" font-size="2.5" fill="#000">пола.</text><text x="25" y="263" font-size="2.5" fill="#000">3. * — высота вывода принята по практике монтажа; сверить по паспорту прибора.</text><text x="25" y="266.6" font-size="2.5" fill="#000">4. Ревизия — на повороте и в начале участка; стояк К1 в коробе с люком — звукоизоляция стояка в коробе; поворот — двумя отводами 45°.</text><text x="25" y="270.2" font-size="2.5" fill="#000" textLength="136.15" lengthAdjust="spacingAndGlyphs">5. Ст К1-1* на обмере не показаны: положение принято (по брифу заказчика), не замерено (К-4); положение сверить на объекте до разводки.</text><text x="25" y="273.8" font-size="2.5" fill="#000">6. Трубы испытать давлением до закрытия (акт скрытых работ, опрессовка по СП 73.13330.2016).</text><text x="25" y="277.4" font-size="2.5" fill="#000">7. Диаметры, высоты выводов и места кранов — по паспортам выбранных приборов и расчёту проектной организации.</text><text x="25" y="281" font-size="2.5" fill="#000">8. Расчёт систем, диаметры магистралей и подбор оборудования выполняет проектная организация.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="45" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="45" y1="285.5" x2="45" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="47" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="riser:Ст К1-1|riser:Ст В1-1" data-ids="К-1 К-2 К-3 К-4 К-7 К-8 К-9 К-10" data-level="0"><text x="45.5" y="210.3" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="45.5" y="213.7" font-size="2.5" fill="#000">Основа листа: размеры помещений и положение проёмов введены заказчиком в брифе, на объекте не замерены (К-1); высота потолка 2700 мм — по брифу заказчика, не замерена (К-2); толщины</text><text x="45.5" y="217.1" font-size="2.5" fill="#000">стен приняты по брифу: наружные 200 мм, внутренние 150 мм — не обмерены (К-1); тип дома монолитный, перекрытие 200 мм — по брифу заказчика, документов нет (К-3); планировка (стены,</text><text x="45.5" y="220.5" font-size="2.5" fill="#000">проёмы, объединение кухни и гостиной, расширение санузла) — по брифу без обмера и плана БТИ (К-7); разрешённая мощность 10 кВт принята, ТУ не переданы (К-8); вентканалы приняты, в</text><text x="45.5" y="223.9" font-size="2.5" fill="#000">брифе не заданы (К-9); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-10).</text><text x="45.5" y="227.3" font-size="2.5" fill="#000">Знак «*» — принято, не замерено и не подтверждено (замерить на объекте): К-4: Ст К1-1 — положение стояка канализации — по брифу заказчика, не замерено; Ст В1-1 — положение стояка</text><text x="45.5" y="230.7" font-size="2.5" fill="#000">холодной воды — по брифу заказчика, не замерено.</text><text x="45.5" y="234.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1–К-4, К-7–К-10).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="25
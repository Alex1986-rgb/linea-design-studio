<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Аксонометрическая схема К1 (канализация)" data-sheet="plumbing" data-scale="1:50"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Аксонометрическая схема К1 (канализация)</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">аксонометрия · диаметры, уклоны, отметки, стояки и приборы · трассы принципиальные</text><g data-el="view" data-scale="1:50"><text x="25" y="22" font-size="3.5" font-weight="700" fill="#000">Схема К1 (М 1:50; по вертикали и горизонтали один масштаб, глубина — ×0,5 под 45°)</text><g data-el="rooms-ctx"><path d="M 187.94 102.53 L 224.94 102.53 L 206.55 120.92 L 169.55 120.92 Z" fill="none" stroke="#9a9a9a" stroke-width="0.18"/><path d="M 79.28 72.89 L 183.28 72.89 L 155 101.17 L 51 101.17 Z" fill="none" stroke="#9a9a9a" stroke-width="0.18"/></g><g data-el="pipes"><path d="M 218.17 105 L 219.52 103.58 L 211.52 103.42 L 211.94 102.97" fill="none" stroke="#6b4f2a" stroke-width="0.5" stroke-dasharray="6 1.2"/><path d="M 211.94 102.97 L 211.94 98.13" fill="none" stroke="#6b4f2a" stroke-width="0.5" stroke-dasharray="6 1.2"/><path d="M 218.17 105 L 150.97 103.32 L 181.66 70.46 L 80.06 67.92 L 60.69 85.93 L 59.49 85.9" fill="none" stroke="#6b4f2a" stroke-width="0.5" stroke-dasharray="6 1.2"/><path d="M 59.49 85.9 L 59.49 84.69" fill="none" stroke="#6b4f2a" stroke-width="0.5" stroke-dasharray="6 1.2"/><path d="M 219.52 103.56 L 223.32 103.47 L 205.78 119.76 L 199.98 119.62 L 199.55 120.01" fill="none" stroke="#6b4f2a" stroke-width="0.5" stroke-dasharray="6 1.2"/><path d="M 199.55 120.01 L 199.55 119.92" fill="none" stroke="#6b4f2a" stroke-width="0.5" stroke-dasharray="6 1.2"/><path d="M 211.52 103.36 L 197
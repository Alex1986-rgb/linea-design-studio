<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Открытые вопросы, принятые допущения и конфликты. Лист 3 из 3" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты. Лист 3 из 3</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации (стартовое совещание 19.10.2026)</text><g data-el="open-issues" data-plan="fixed" data-plan-declared="3"><g data-el="issues-changes"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Изменения проекта после выпуска листов (реестр изменений)</text><rect x="25" y="33" width="385" height="139.2" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="32" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="33" x2="39" y2="172.2" stroke="#000" stroke-width="0.25"/><text x="50" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><line x1="61" y1="33" x2="61" y2="172.2" stroke="#000" stroke-width="0.25"/><text x="91" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><line x1="121" y1="33" x2="121" y2="172.2" stroke="#000" stroke-width="0.25"/><text x="171" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Было</text><line x1="221" y1="33" x2="221" y2="172.2" stroke="#000" stroke-width="0.25"/><text x="283.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Стало</text><line x1="346" y1="33" x2="346" y2="172.2" stroke="#000" stroke-width="0.25"/><text x="378" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Кто решил, подпись</text><g data-el="issue-row" data-kind="change" data-id="ИЗ-1"><text x="32" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-1</text><text x="40.5" y="46.7" font-size="2.5" fill="#000">30.10.2026</text><text x="62.5" y="46.7" font-size="2.5" fill="#000">л. 28 — План расстановки мебели</text><text x="62.5" y="50.1" font-size="2.5" fill="#000">л. 26 — План дверей и ведомость заполнения</text><text x="62.5" y="53.5" font-size="2.5" fill="#000">проёмов</text><text x="62.5" y="56.9" font-size="2.5" fill="#000">л. 54 — План потолков</text><text x="62.5" y="60.3" font-size="2.5" fill="#000">л. 34 — План освещения</text><text x="62.5" y="63.7" font-size="2.5" fill="#000">л. 88 — Развёртка стены В. Гостиная-кухня</text><text x="62.5" y="67.1" font-size="2.5" fill="#000">(пом. 1)</text><text x="122.5" y="46.7" font-size="2.5" fill="#000">Гостиная-кухня: вход Д-2 (стена В, 3700…4600) упирался в спинку дивана Гс2,</text><text x="122.5" y="50.1" font-size="2.5" fill="#000">слева проход между консолью Гс5 (1600…3400) и креслом Гс4 — 575 мм,</text><text x="122.5" y="53.5" font-size="2.5" fill="#000">справа 175 мм до стены Б. Остров потолка У2 не центрирован на стол Кх11</text><text x="122.5" y="56.9" font-size="2.5" fill="#000">(зазор 100 / 450), подвесы — по столу. Детская: стол Дт3 вплотную к стене В</text><text x="122.5" y="60.3" font-size="2.5" fill="#000">над радиатором РО-3, примечание «прибор в корпусе не решён».</text><text x="222.5" y="46.7" font-size="2.5" fill="#000">Д-2 — петли у правого откоса, консоль Гс5 — смещение 700…2500, кресло Гс4 — y 2100…2850:</text><text x="222.5" y="50.1" font-size="2.5" fill="#000">проход от двери к кухне 975 / 825 мм. Остров У2 — вставка A340/B1910/C2210/D1340 (центр по</text><text x="222.5" y="53.5" font-size="2.5" fill="#000">столу), точка ленты Св41 — x 3300. Стол Дт3 — у стены Б торцом к окну (x 2775…3375, y</text><text x="222.5" y="56.9" font-size="2.5" fill="#000">5550…6750), стул Дт4 — x 2200, y 5900; радиатор РО-3 открыт. Знак «**» у Гс5, Гс4, Дт3 до</text><text x="222.5" y="60.3" font-size="2.5" fill="#000">подписи автора.</text><text x="347.5" y="46.7" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 12.11.2026.</text><text x="347.5" y="50.1" font-size="2.5" fill="#000">Предложил: исполнитель.</text></g><line x1="25" y1="70.2" x2="410" y2="70.2" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-2"><text x="32" y="73.9" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-2</text><text x="40.5" y="73.9" font-size="2.5" fill="#000">10.11.2026</text><text x="62.5" y="73.9" font-size="2.5" fill="#000">л. 28 — План расстановки мебели</text><text x="62.5" y="77.3" font-size="2.5" fill="#000">л. 66 — План текстиля и декора</text><text x="122.5" y="73.9" font-size="2.5" fill="#000">Стол Дт3 (детская, пом. 3) стоял вплотную к дверному проёму Д-4 в стене Б:</text><text x="122.5" y="77.3" font-size="2.5" fill="#000">край стола y 5550 мм = край проёма.</text><text x="222.5" y="73.9" font-size="2.5" fill="#000">Стол Дт3 сдвинут вдоль стены Б на 250 мм от двери: y 5800…6400 мм (было 5550…6150), x</text><text x="222.5" y="77.3" font-size="2.5" fill="#000">2000…3200 прежний; зазор от проёма Д-4 250 мм. Стул Дт4 сдвинут вместе со столом: y</text><text x="222.5" y="80.7" font-size="2.5" fill="#000">6150…6650 (было 5900…6400), x 2200 прежний; до стены С остаётся 100 мм. Розетки Р11, LAN2 у</text><text x="222.5" y="84.1" font-size="2.5" fill="#000">стола на стене С (смещения 2400 и 2500) не тронуты. Стол Дт3 остаётся предложением</text><text x="222.5" y="87.5" font-size="2.5" fill="#000">проектировщика.</text><text x="347.5" y="73.9" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 12.11.2026.</text><text x="347.5" y="77.3" font-size="2.5" fill="#000">Предложил: исполнитель.</text></g><line x1="25" y1="90.6" x2="410" y2="90.6" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-3"><text x="32" y="94.3" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-3</text><text x="40.5" y="94.3" font-size="2.5" fill="#000">12.11.2026</text><text x="62.5" y="94.3" font-size="2.5" fill="#000">л. 66 — План текстиля и декора</text><text x="62.5" y="97.7" font-size="2.5" fill="#000">л. 68 — Ведомость текстиля</text><text x="62.5" y="101.1" font-size="2.5" fill="#000">л. 69 — Ведомость декора. Схемы развески</text><text x="122.5" y="94.3" font-size="2.5" fill="#000">Разбор двух критиков по кадрам: «стерильный шоурум, жизни нет»; ванна Сн1</text><text x="122.5" y="97.7" font-size="2.5" fill="#000">в кадре без смесителя — в наименовании прибора смеситель не назван.</text><text x="122.5" y="101.1" font-size="2.5" fill="#000">Санузел без текстиля и предметов; на столах, консоли и тумбах нет ни одной</text><text x="122.5" y="104.5" font-size="2.5" fill="#000">вещи; в прихожей — только зеркало над скамьёй; на диване и кроватях по 5</text><text x="122.5" y="107.9" font-size="2.5" fill="#000">декоративных подушек.</text><text x="222.5" y="94.3" font-size="2.5" fill="#000">Ванна Сн1 — «акриловая 1700×750, смеситель настенный». Санузел: банные и ручные полотенца</text><text x="222.5" y="97.7" font-size="2.5" fill="#000">на полотенцесушителе Сн5 (Т20, Т21), коврик 800×450 у бортика ванны (Т22; вне полотна двери</text><text x="222.5" y="101.1" font-size="2.5" fill="#000">Д-5), ваза с сухой веткой на полке короба инсталляции (ДК9). Прихожая: графика «энсо» 400×560 в</text><text x="222.5" y="104.5" font-size="2.5" fill="#000">простенке стены Г (ДК10); дорожка и консоль не заданы — свободный пол в зонах открывания пяти</text><text x="222.5" y="107.9" font-size="2.5" fill="#000">дверей, стены заняты щитами, домофоном и выключателями. Гостиная-кухня: книги и свеча на</text><text x="222.5" y="111.3" font-size="2.5" fill="#000">журнальном столике (ДК11), керамика и настольная лампа на консоли Гс5 (ДК12, ДК13), керамика</text><text x="222.5" y="114.7" font-size="2.5" fill="#000">на столешнице кухни (ДК14). Спальня: книги на тумбе Сп2 (ДК15), шеффлера в углу у окна (ДК16),</text><text x="222.5" y="118.1" font-size="2.5" fill="#000">рабочая лампа на столе Сп5 (ДК17). Детская: рабочая лампа на столе Дт3 (ДК18). Декоративных</text><text x="222.5" y="121.5" font-size="2.5" fill="#000">подушек — по 4 на диван и кровати (Т17, Т4, Т10: 3 → 2). Цвета — из палитры джапанди проекта:</text><text x="222.5" y="124.9" font-size="2.5" fill="#000">олива Bancha и S 5010-G70Y, песочный S 2005-Y30R, тёплый белый Damask. Знак «**» у позиций</text><text x="222.5" y="128.3" font-size="2.5" fill="#000">до подписи автора.</text><text x="347.5" y="94.3" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="97.7" font-size="2.5" fill="#000">исполнителя; предложение проектировщика, на</text><text x="347.5" y="101.1" font-size="2.5" fill="#000">утверждение А. С. Кырлана</text></g><line x1="25" y1="131.4" x2="410" y2="131.4" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-4"><text x="32" y="135.1" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-4</text><text x="40.5" y="135.1" font-size="2.5" fill="#000">16.11.2026</text><text x="62.5" y="135.1" font-size="2.5" fill="#000">л. 66 — План текстиля и декора</text><text x="62.5" y="138.5" font-size="2.5" fill="#000">л. 69 — Ведомость декора. Схемы развески</text><text x="62.5" y="141.9" font-size="2.5" fill="#000">л. 34 — План освещения</text><text x="122.5" y="135.1" font-size="2.5" fill="#000">Приёмка кадров 15.11.2026: бра у изголовья — без описания плафона и</text><text x="122.5" y="138.5" font-size="2.5" fill="#000">кронштейна; растение в кашпо у кровати перегружало кадр: вместе с книгами,</text><text x="122.5" y="141.9" font-size="2.5" fill="#000">картиной, бра, подушками и пледом выходило шесть-семь предметов.</text><text x="222.5" y="135.1" font-size="2.5" fill="#000">Спальня: бра Св10, Св11 — плафон-колпак из рисовой бумаги, кронштейн из чёрного матового</text><text x="222.5" y="138.5" font-size="2.5" fill="#000">металла (приёмы концепции: бумажные плафоны и чёрная тонкая линия). Растение ДК16 в кашпо</text><text x="222.5" y="141.9" font-size="2.5" fill="#000">заменено керамической чашей-скульптурой на тумбе Сп3. Серо-зелёная акцентная стена остаётся</text><text x="222.5" y="145.3" font-size="2.5" fill="#000">на стене А у окна. Размеры, мебель, розетки и отметки не менялись.</text><text x="347.5" y="135.1" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 16.11.2026.</text><text x="347.5" y="138.5" font-size="2.5" fill="#000">Предложил: исполнитель; предложение</text><text x="347.5" y="141.9" font-size="2.5" fill="#000">проектировщика, утверждено А. С. Кырланом</text><text x="347.5" y="145.3" font-size="2.5" fill="#000">16.11.2026 («все на твое усмотрение и доделай</text><text x="347.5" y="148.7" font-size="2.5" fill="#000">все проекты»).</text></g><line x1="25" y1="151.8" x2="410" y2="151.8" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-5"><text x="32" y="155.5" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-5</text><text x="40.5" y="155.5" font-size="2.5" fill="#000">16.11.2026</text><text x="62.5" y="155.5" font-size="2.5" fill="#000">л. 62 — Ведомость отделки помещений</text><text x="62.5" y="158.9" font-size="2.5" fill="#000">л. 63 — Колерная карта</text><text x="62.5" y="162.3" font-size="2.5" fill="#000">л. 66 — План текстиля и декора</text><text x="122.5" y="155.5" font-size="2.5" fill="#000">Второй круг приёмки кадров: серо-зелёная акцентная стена спальни</text><text x="122.5" y="158.9" font-size="2.5" fill="#000">находилась у окна (стена А) и по всей длине закрыта портьерами — «одна</text><text x="122.5" y="162.3" font-size="2.5" fill="#000">серо-зелёная стена в комнате» с кровати не читалась.</text><text x="222.5" y="155.5" font-size="2.5" fill="#000">Спальня: серо-зелёная акцентная стена (S 5010-G70Y, приглушённая олива) перенесена со стены</text><text x="222.5" y="158.9" font-size="2.5" fill="#000">А (у окна) на стену Г за изголовьем — к реечной панели ДС1, фотографии ДК1 и бра; стена у окна</text><text x="222.5" y="162.3" font-size="2.5" fill="#000">— «рисовая бумага», как остальные. Площадь, цвет и состав краски не менялись. Размеры,</text><text x="222.5" y="165.7" font-size="2.5" fill="#000">мебель, розетки и отметки не менялись.</text><text x="347.5" y="155.5" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 16.11.2026.</text><text x="347.5" y="158.9" font-size="2.5" fill="#000">Предложил: исполнитель; предложение</text><text x="347.5" y="162.3" font-size="2.5" fill="#000">проектировщика, утверждено А. С. Кырланом</text><text x="347.5" y="165.7" font-size="2.5" fill="#000">16.11.2026 («все на твое усмотрение и доделай</text><text x="347.5" y="169.1" font-size="2.5" fill="#000">все проекты»).</text></g></g><g data-el="notes"><text x="25" y="184.6" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="189.4" font-size="2.5" fill="#000">1. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text><text x="25" y="192.8" font-size="2.5" fill="#000">2. Графа «Если решения нет» показывает состояние решения на листах; влияние на сроки и стоимость по пунктам не оценивалось.</text><text x="25" y="196.2" font-size="2.5" fill="#000">3. Пункт, по которому принято решение, при следующем выпуске комплекта из таблиц исключается.</text></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">16.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-siz
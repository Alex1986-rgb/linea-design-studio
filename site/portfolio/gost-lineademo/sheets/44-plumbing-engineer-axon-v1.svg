26.5" y="165.92" font-size="2.5" text-anchor="start" data-fit="29.95" fill="#000">В1-6</text><text x="59.45" y="165.92" font-size="2.5" text-anchor="start" data-fit="112.79" fill="#000">Сн4 стиральная машина</text><text x="175.24" y="165.92" font-size="2.5" text-anchor="start" data-fit="34.68" fill="#000">600*</text><text x="212.92" y="165.92" font-size="2.5" text-anchor="start" data-fit="46.16" fill="#000">20</text><text x="262.08" y="165.92" font-size="2.5" text-anchor="start" data-fit="40.42" fill="#000">1,58</text><line x1="25" y1="173.62" x2="304" y2="173.62" stroke="#000" stroke-width="0.18"/><text x="26.5" y="171.92" font-size="2.5" text-anchor="start" data-fit="29.95" fill="#000">В1-5</text><text x="59.45" y="171.92" font-size="2.5" text-anchor="start" data-fit="112.79" fill="#000">Сн3 умывальник</text><text x="175.24" y="171.92" font-size="2.5" text-anchor="start" data-fit="34.68" fill="#000">950*</text><text x="212.92" y="171.92" font-size="2.5" text-anchor="start" data-fit="46.16" fill="#000">20</text><text x="262.08" y="171.92" font-size="2.5" text-anchor="start" data-fit="40.42" fill="#000">0,12</text><text x="26.5" y="177.92" font-size="2.5" text-anchor="start" data-fit="29.95" fill="#000">В1-4</text><text x="59.45" y="177.92" font-size="2.5" text-anchor="start" data-fit="112.79" fill="#000">Сн2 унитаз подвесной</text><text x="175.24" y="177.92" font-size="2.5" text-anchor="start" data-fit="34.68" fill="#000">250*</text><text x="212.92" y="177.92" font-size="2.5" text-anchor="start" data-fit="46.16" fill="#000">20</text><text x="262.08" y="177.92" font-size="2.5" text-anchor="start" data-fit="40.42" fill="#000">0,12</text></g><g data-el="legend"><text x="312" y="133.62" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><line x1="312.5" y1="139.62" x2="319.5" y2="139.62" stroke="#1f5fbf" stroke-width="0.5"/><text x="323" y="140.52" font-size="2.5" fill="#000">В1 — водопровод хозяйственно-питьевой (ХВС), PP-R Ø20</text><circle cx="316" cy="144.62" r="1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/><text x="323" y="145.52" font-size="2.5" fill="#000">вывод В1 (код — в ведомости привязок)</text><circle cx="316" cy="149.61700935788386" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="323" y="150.52" font-size="2.5" fill="#000">стояк «Ст К1-N / Ст В1-N» (ГОСТ 21.601), Ø мм</text><circle cx="316" cy="154.61700935788386" r="1.1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/><text x="323" y="155.52" font-size="2.5" fill="#000">стояк в плане (на отметке пола); вертикаль — стояк по высоте,</text><text x="323" y="158.82" font-size="2.5" fill="#000">разрыв — перекрытие</text><circle cx="316" cy="162.92" r="0.6" fill="#000"/><text x="323" y="163.82" font-size="2.5" fill="#000">тройник (ответвление к прибору)</text><path d="M 314 166.62 L 318 169.22 L 318 166.62 L 314 169.22 Z" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="323" y="168.82" font-size="2.5" fill="#000">кран шаровой</text><circle cx="316" cy="172.91700935788387" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35" stroke-dasharray="0.8 0.6"/><text x="323" y="173.82" font-size="2.5" fill="#000">* стояк Т3 не на обмере — принят в шахте рядом со Ст В1,</text><text x="323" y="177.12" font-size="2.5" fill="#000">сверить</text></g><g data-el="notes"><text x="25" y="240" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="245" font-size="2.5" fill="#000">1. Схема В1 построена по тем же трассам, что план разводки: положение в плане сохранено, глубина — в масштабе ×0,5. Трассы принципиальные; фактическое</text><text x="25" y="248.6" font-size="2.5" fill="#000">положение фиксируется исполнительной схемой до закрытия.</text><text x="25" y="252.2" font-size="2.5" fill="#000">2. Высоты Н — от чистого пола помещения, мм. Отметка прокладки магистрали В1 (в стяжке, в стене или по полу) в данных не задана: участки показаны на</text><text x="25" y="255.8" font-size="2.5" fill="#000">уровне пола условно (записи реестра нет).</text><text x="25" y="259.4" font-size="2.5" fill="#000">3. * — высота вывода принята по практике монтажа; сверить по паспорту прибора.</text><text x="25" y="263" font-size="2.5" fill="#000">4. Узел ввода В1 (кран, фильтр, счётчик, обратный клапан, кран) — на схеме разводки; состав узла ввода — по согласованию. Кран шаровой — на первом</text><text x="25" y="266.6" font-size="2.5" fill="#000">участке от стояка.</text><text x="25" y="270.2" font-size="2.5" fill="#000" textLength="136.32" lengthAdjust="spacingAndGlyphs">5. Ст В1-1* на обмере не показаны: положение принято (по брифу заказчика), не замерено (К-4); положение сверить на объекте до разводки.</text><text x="25" y="273.8" font-size="2.5" fill="#000">6. Трубы испытать давлением до закрытия (акт скрытых работ, опрессовка по СП 73.13330.2016).</text><text x="25" y="277.4" font-size="2.5" fill="#000">7. Диаметры, высоты выводов и места кранов — по паспортам выбранных приборов и расчёту проектной организации.</text><text x="25" y="281" font-size="2.5" fill="#000">8. Расчёт систем, диаметры магистралей и подбор оборудования выполняет проектная организация.</text></g><g data-el="assume-compact"></g><g data-el="scale-bar"><line x1="25" y1="287" x2="45" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="45" y1="285.5" x2="45" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="47" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="riser:Ст В1-1|riser:Ст К1-1" data-ids="К-1 К-2 К-3 К-4 К-7 К-8 К-9 К-10" data-level="3"><text x="140.5" y="285.7" font-size="2.5" fill="#000">Допущения и предложения на листе. Знак «*» принято (замерить): Ст К1-1. См.</text><text x="140.5" y="289.1" font-size="2.5" fill="#000">лист открытых вопросов (листы 6, 7).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7
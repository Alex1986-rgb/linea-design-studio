ll="#000">Ведомость выводов Т3</text><rect x="25" y="136.04" width="279" height="26" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="144.04" x2="304" y2="144.04" stroke="#000" stroke-width="0.5"/><text x="41.47" y="141.34" font-size="2.5" text-anchor="middle" data-fit="31.95" fill="#000">Код</text><line x1="57.95" y1="136.04" x2="57.95" y2="162.04" stroke="#000" stroke-width="0.25"/><text x="115.84" y="141.34" font-size="2.5" text-anchor="middle" data-fit="114.79" fill="#000">Прибор</text><line x1="173.74" y1="136.04" x2="173.74" y2="162.04" stroke="#000" stroke-width="0.25"/><text x="192.58" y="141.34" font-size="2.5" text-anchor="middle" data-fit="36.68" fill="#000">Н, мм</text><line x1="211.42" y1="136.04" x2="211.42" y2="162.04" stroke="#000" stroke-width="0.25"/><text x="236" y="141.34" font-size="2.5" text-anchor="middle" data-fit="48.16" fill="#000">Ø, мм</text><line x1="260.58" y1="136.04" x2="260.58" y2="162.04" stroke="#000" stroke-width="0.25"/><text x="282.29" y="141.34" font-size="2.5" text-anchor="middle" data-fit="42.42" fill="#000">Трасса, м</text><line x1="25" y1="150.04" x2="304" y2="150.04" stroke="#000" stroke-width="0.18"/><text x="26.5" y="148.34" font-size="2.5" text-anchor="start" data-fit="29.95" fill="#000">Т3-1</text><text x="59.45" y="148.34" font-size="2.5" text-anchor="start" data-fit="112.79" fill="#000">П1 мойка кухонная</text><text x="175.24" y="148.34" font-size="2.5" text-anchor="start" data-fit="34.68" fill="#000">600*</text><text x="212.92" y="148.34" font-size="2.5" text-anchor="start" data-fit="46.16" fill="#000">20</text><text x="262.08" y="148.34" font-size="2.5" text-anchor="start" data-fit="40.42" fill="#000">10,11</text><line x1="25" y1="156.04" x2="304" y2="156.04" stroke="#000" stroke-width="0.18"/><text x="26.5" y="154.34" font-size="2.5" text-anchor="start" data-fit="29.95" fill="#000">Т3-2</text><text x="59.45" y="154.34" font-size="2.5" text-anchor="start" data-fit="112.79" fill="#000">Сн1 ванна</text><text x="175.24" y="154.34" font-size="2.5" text-anchor="start" data-fit="34.68" fill="#000">800*</text><text x="212.92" y="154.34" font-size="2.5" text-anchor="start" data-fit="46.16" fill="#000">20</text><text x="262.08" y="154.34" font-size="2.5" text-anchor="start" data-fit="40.42" fill="#000">3,17</text><text x="26.5" y="160.34" font-size="2.5" text-anchor="start" data-fit="29.95" fill="#000">Т3-3</text><text x="59.45" y="160.34" font-size="2.5" text-anchor="start" data-fit="112.79" fill="#000">Сн3 умывальник</text><text x="175.24" y="160.34" font-size="2.5" text-anchor="start" data-fit="34.68" fill="#000">950*</text><text x="212.92" y="160.34" font-size="2.5" text-anchor="start" data-fit="46.16" fill="#000">20</text><text x="262.08" y="160.34" font-size="2.5" text-anchor="start" data-fit="40.42" fill="#000">1,42</text></g><g data-el="legend"><text x="312" y="134.04" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><line x1="312.5" y1="140.04" x2="319.5" y2="140.04" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><text x="323" y="140.94" font-size="2.5" fill="#000">Т3 — горячее водоснабжение, подача (ГВС), PP-R Ø20</text><circle cx="316" cy="145.04" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/><text x="323" y="145.94" font-size="2.5" fill="#000">вывод Т3 (код — в ведомости привязок)</text><circle cx="316" cy="150.0412734265958" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="323" y="150.94" font-size="2.5" fill="#000">стояк «Ст К1-N / Ст В1-N» (ГОСТ 21.601), Ø мм</text><circle cx="316" cy="155.0412734265958" r="1.1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/><text x="323" y="155.94" font-size="2.5" fill="#000">стояк в плане (на отметке пола); вертикаль — стояк по высоте,</text><text x="323" y="159.24" font-size="2.5" fill="#000">разрыв — перекрытие</text><circle cx="316" cy="163.34" r="0.6" fill="#000"/><text x="323" y="164.24" font-size="2.5" fill="#000">тройник (ответвление к прибору)</text><path d="M 314 167.04 L 318 169.64 L 318 167.04 L 314 169.64 Z" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="323" y="169.24" font-size="2.5" fill="#000">кран шаровой</text><circle cx="316" cy="173.34127342659582" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35" stroke-dasharray="0.8 0.6"/><text x="323" y="174.24" font-size="2.5" fill="#000">* стояк Т3 не на обмере — принят в шахте рядом со Ст В1,</text><text x="323" y="177.54" font-size="2.5" fill="#000">сверить</text></g><g data-el="notes"><text x="25" y="237" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="242" font-size="2.5" fill="#000">1. Схема Т3 построена по тем же трассам, что план разводки: положение в плане сохранено, глубина — в масштабе ×0,5. Трассы принципиальные; фактическое</text><text x="25" y="245.6" font-size="2.5" fill="#000">положение фиксируется исполнительной схемой до закрытия.</text><text x="25" y="249.2" font-size="2.5" fill="#000">2. Высоты Н — от чистого пола помещения, мм. Отметка прокладки магистрали Т3 (в стяжке, в стене или по полу) в данных не задана: участки показаны на</text><text x="25" y="252.8" font-size="2.5" fill="#000">уровне пола условно (записи реестра нет).</text><text x="25" y="256.4" font-size="2.5" fill="#000">3. * — высота вывода принята по практике монтажа; сверить по паспорту прибора.</text><text x="25" y="260" font-size="2.5" fill="#000">4. Узел ввода Т3 (кран, фильтр, счётчик, обратный клапан, кран) — на схеме разводки; состав узла ввода — по согласованию. Кран шаровой — на первом</text><text x="25" y="263.6" font-size="2.5" fill="#000">участке от стояка.</text><text x="25" y="267.2" font-size="2.5" fill="#000">5. Циркуляция ГВС в данных не задана — циркуляционного трубопровода на схеме нет (записи реестра нет).</text><text x="25" y="270.8" font-size="2.5" fill="#000" textLength="124.3" lengthAdjust="spacingAndGlyphs">6. Ст Т3-1 на обмере не показаны: приняты рядом с Ст В1-1* (в МКД стоят группой); положение сверить на объекте до разводки.</text><text x="25" y="274.4" font-size="2.5" fill="#000">7. Трубы испытать давлением до закрытия (акт скрытых работ, опрессовка по СП 73.13330.2016).</text><text x="25" y="278" font-size="2.5" fill="#000">8. Диаметры, высоты выводов и места кранов — по паспортам выбранных приборов и расчёту проектной организации.</text><text x="25" y="281.6" font-size="2.5" fill="#000">9. Расчёт систем, диаметры магистралей и подбор оборудования выполняет проектная организация.</text></g><g data-el="assume-compact"></g><g data-el="scale-bar"><line x1="25" y1="287" x2="45" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="45" y1="285.5" x2="45" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="47" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="riser:Ст В1-1|riser:Ст К1-1" data-ids="К-1 К-2 К-3 К-4 К-7 К-8 К-9 К-10" data-level="3"><text x="140.5" y="285.7" font-size="2.5" fill="#000">Допущения и предложения на листе. Знак «*» принято (замерить): Ст К1-1. См.</text><text x="140.5" y="289.1" font-size="2.5" fill="#000">лист открытых вопросов (листы 6, 7).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" str
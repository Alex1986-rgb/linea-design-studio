<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Аксонометрическая схема Т3 (горячее водоснабжение)" data-sheet="plumbing" data-scale="1:50"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Аксонометрическая схема Т3 (горячее водоснабжение)</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">аксонометрия · диаметры, уклоны, отметки, стояки и приборы · трассы принципиальные</text><g data-el="view" data-scale="1:50"><text x="25" y="22" font-size="3.5" font-weight="700" fill="#000">Схема Т3 (М 1:50; по вертикали и горизонтали один масштаб, глубина — ×0,5 под 45°)</text><g data-el="rooms-ctx"><path d="M 79.28 74.31 L 183.28 74.31 L 155 102.6 L 51 102.6 Z" fill="none" stroke="#9a9a9a" stroke-width="0.18"/><path d="M 187.94 103.66 L 224.94 103.66 L 206.55 122.04 L 169.55 122.04 Z" fill="none" stroke="#9a9a9a" stroke-width="0.18"/></g><g data-el="pipes"><path d="M 221 105 L 149.2 105 L 152.8 101.39 L 55.6 101.39 L 62.53 94.46 L 59.13 94.46" fill="none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><path d="M 59.13 94.46 L 59.13 82.46" fill="none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><path d="M 220.2 105 L 204.36 120.84 L 189.26 120.84 L 188.05 122.04" fill="none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><path d="M 188.05 122.04 L 188.05 106.04" fill="none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><path d="M 220.2 105 L 220.34 104.86 L 195.74 104.86 L 196.94 103.66" fill="none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><path d="M 196.94 103.66 L 196.94 84.66" fill="none" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/></g><g data-el="pl-marks"><circle cx="220.2" cy="105" r="0.6" fill="#c0392b"/><circle cx="220.2" cy="105" r="0.6" fill="#c0392b"/><path d="M 214 103.7 L 218 106.3 L 218 103.7 L 214 106.3 Z" fill="#fff" stroke="#c0392b" stroke-width="0.35"/><g data-el="pl-outlet" data-index="Т3"><circle cx="59.13" cy="82.46" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="Т3"><circle cx="188.05" cy="106.04" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="Т3"><circle cx="196.94" cy="84.66" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/></g></g><g data-el="risers"><g data-el="riser" data-index="Т3"><path d="M 221 110 L 221 51" fill="none" stroke="#c0392b" stroke-width="0.7" stroke-dasharray="1.6 1"/><path d="M 219.2 109.5 L 220.4 110.5 L 221.6 109.5 L 222.8 110.5" fill="none" stroke="#000" stroke-width="0.25"/><path d="M 219.2 50.5 L 220.4 51.5 L 221.6 50.5 L 222.8 51.5" fill="none" stroke="#000" stroke-width="0.25"/><circle cx="221" cy="105" r="1.1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/></g></g><g data-el="pl-labels"><text x="32.73" y="103.2" font-size="2.5" fill="#555">1 Гостиная-кухня</text><text x="157.83" y="122.64" font-size="2.5" fill="#555">4 Санузел</text><text x="214.71" y="45.4" font-size="2.5" fill="#c0392b">Ст Т3-1* Ø32</text><text x="214.71" y="48.4" font-size="2.5" fill="#c0392b">+2,700</text><text x="224.3" y="101" font-size="2.5" fill="#000">−0,015</text><text x="189.95" y="109.84" font-size="2.5" fill="#000">Т3-2 Сн1</text><text x="189.95" y="112.84" font-size="2.5" fill="#000">Н=800*</text><text x="198.84" y="83.76" font-size="2.5" fill="#000">Т3-3 Сн3</text><text x="198.84" y="86.76" font-size="2.5" fill="#000">Н=950*</text><text x="100.47" y="95.79" font-size="2.5" fill="#c0392b">Ø20</text><text x="100.47" y="98.79" font-size="2.5" fill="#c0392b">L=10,11</text><text x="204.87" y="97.86" font-size="2.5" fill="#c0392b">Ø20</text><text x="204.87" y="100.86" font-size="2.5" fill="#c0392b">L=1,42</text></g></g><g data-el="legend-box"><g data-el="legend"><text x="310" y="25" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><line x1="310.5" y1="31" x2="317.5" y2="31" stroke="#c0392b" stroke-width="0.5" stroke-dasharray="4 1"/><text x="321" y="31.9" font-size="2.5" fill="#000">Т3 — горячее водоснабжение, подача (ГВС), PP-R Ø20</text><circle cx="314" cy="36" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/><text x="321" y="36.9" font-size="2.5" fill="#000">вывод Т3 (код — в ведомости привязок)</text><circle cx="314" cy="41" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="321" y="41.9" font-size="2.5" fill="#000">стояк «Ст К1-N / Ст В1-N» (ГОСТ 21.601), Ø мм</text><circle cx="314" cy="46" r="1.1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/><text x="321" y="46.9" font-size="2.5" fill="#000">стояк в плане (на отметке пола); вертикаль — стояк по высоте,</text><text x="321" y="50.2" font-size="2.5" fill="#000">разрыв — перекрытие</text><circle cx="314" cy="54.3" r="0.6" fill="#000"/><text x="321" y="55.2" font-size="2.5" fill="#000">тройник (ответвление к прибору)</text><path d="M 312 58 L 316 60.6 L 316 58 L 312 60.6 Z" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="321" y="60.2" font-size="2.5" fill="#000">кран шаровой</text><circle cx="314" cy="64.3" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35" stroke-dasharray="0.8 0.6"/><text x="321" y="65.2" font-size="2.5" fill="#000">* стояк Т3 не на обмере — принят в шахте рядом со Ст В1, сверить</text></g></g><g data-el="notes"><text x="25" y="237" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="242" font-size="2.5" fill="#000">1. Схема Т3 построена по тем же трассам, что план разводки: положение в плане сохранено, глубина — в масштабе ×0,5. Трассы принципиальные; фактическое</text><text x="25" y="245.6" font-size="2.5" fill="#000">положение фиксируется исполнительной схемой до закрытия.</text><text x="25" y="249.2" font-size="2.5" fill="#000">2. Высоты Н — от чистого пола помещения, мм. Отметка прокладки магистрали Т3 (в стяжке, в стене или по полу) в данных не задана: участки показаны на</text><text x="25" y="252.8" font-size="2.5" fill="#000">уровне пола условно (записи реестра нет).</text><text x="25" y="256.4" font-size="2.5" fill="#000">3. * — высота вывода принята по практике монтажа; сверить по паспорту прибора.</text><text x="25" y="260" font-size="2.5" fill="#000">4. Узел ввода Т3 (кран, фильтр, счётчик, обратный клапан, кран) — на схеме разводки; состав узла ввода — по согласованию. Кран шаровой — на первом</text><text x="25" y="263.6" font-size="2.5" fill="#000">участке от стояка.</text><text x="25" y="267.2" font-size="2.5" fill="#000">5. Циркуляция ГВС в данных не задана — циркуляционного трубопровода на схеме нет (записи реестра нет).</text><text x="25" y="270.8" font-size="2.5" fill="#000" textLength="124.3" lengthAdjust="spacingAndGlyphs">6. Ст Т3-1 на обмере не показаны: приняты рядом с Ст В1-1* (в МКД стоят группой); положение сверить на объекте до разводки.</text><text x="25" y="274.4" font-size="2.5" fill="#000">7. Трубы испытать давлением до закрытия (акт скрытых работ, опрессовка по СП 73.13330.2016).</text><text x="25" y="278" font-size="2.5" fill="#000">8. Диаметры, высоты выводов и места кранов — по паспортам выбранных приборов и расчёту проектной организации.</text><text x="25" y="281.6" font-size="2.5" fill="#000">9. Расчёт систем, диаметры магистралей и подбор оборудования выполняет проектная организация.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="45" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="45" y1="285.5" x2="45" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="47" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="riser:Ст В1-1|riser:Ст К1-1" data-ids="К-1 К-2 К-3 К-4 К-7 К-8 К-9 К-10" data-level="0"><text x="45.5" y="207.8" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="45.5" y="211.2" font-size="2.5" fill="#000">Основа листа: размеры помещений и положение проёмов введены заказчиком в брифе, на объекте не замерены (К-1); высота потолка 2700 мм — по брифу заказчика, не замерена (К-2); толщины</text><text x="45.5" y="214.6" font-size="2.5" fill="#000">стен приняты по брифу: наружные 200 мм, внутренние 150 мм — не обмерены (К-1); тип дома монолитный, перекрытие 200 мм — по брифу заказчика, документов нет (К-3); планировка (стены,</text><text x="45.5" y="218" font-size="2.5" fill="#000">проёмы, объединение кухни и гостиной, расширение санузла) — по брифу без обмера и плана БТИ (К-7); разрешённая мощность 10 кВт принята, ТУ не переданы (К-8); вентканалы приняты, в</text><text x="45.5" y="221.4" font-size="2.5" fill="#000">брифе не заданы (К-9); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-10).</text><text x="45.5" y="224.8" font-size="2.5" fill="#000">Знак «*» — принято, не замерено и не подтверждено (замерить на объекте): К-4: Ст В1-1 — положение стояка холодной воды — по брифу заказчика, не замерено; Ст К1-1 — положение стояка</text><text x="45.5" y="228.2" font-size="2.5" fill="#000">канализации — по брифу заказчика, не замерено.</text><text x="45.5" y="231.6" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1–К-4, К-7–К-10).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">04.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-011-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Квартира 56 м²</text><text x="297" y="259.2" font-size="2.5" data-fit="116" fill="#000">ЖК «Северный парк», Москва</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" data-fit="66" fill="#000">Дизайн-проект интерьера</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">38</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">106</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="282.2" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">Аксонометрическая схема Т3 (горячее</text><text x="330" y="286" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">водоснабжение)</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М 1:50</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="47" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="12" data-positions="59" data-basis="8"><rect x="314.2" y="6.2" width="99.3" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="316.2" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 12 (реестр — л. 6, 7)</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Задание на контрольный обмер и обследование. Лист 4 из 4</text><text x="25" y="17.8" font-size="2.5" fill="#333">Что замерить, вскрыть и получить до заказа материалов и изделий</text><g data-el="survey-task" data-plan="fixed" data-plan-declared="4"><g data-el="survey-offsite"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Документы и данные закупки (не на объекте)</text><rect x="25" y="33" width="385" height="88.2" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="31" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="37" y1="33" x2="37" y2="121.2" stroke="#000" stroke-width="0.25"/><text x="62" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">У кого, откуда</text><line x1="87" y1="33" x2="87" y2="121.2" stroke="#000" stroke-width="0.25"/><text x="97" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Способ</text><line x1="107" y1="33" x2="107" y2="121.2" stroke="#000" stroke-width="0.25"/><text x="149" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Что получить</text><line x1="191" y1="33" x2="191" y2="121.2" stroke="#000" stroke-width="0.25"/><text x="219" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">К какому сроку</text><line x1="247" y1="33" x2="247" y2="121.2" stroke="#000" stroke-width="0.25"/><text x="285" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Что пересчитается в альбоме</text><line x1="323" y1="33" x2="323" y2="121.2" stroke="#000" stroke-width="0.25"/><text x="344" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Чем подтверждается</text><line x1="365" y1="33" x2="365" y2="121.2" stroke="#000" stroke-width="0.25"/><text x="387.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Закрывает вопросы реестра</text><g data-el="survey-row" data-id="О-17" data-key="proekt-doma" data-closes="К-3" data-method="document" data-covers="basis:structure"><text x="31" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">О-17</text><text x="38.5" y="46.7" font-size="2.5" fill="#000">Заказчик; управляющая компания или</text><text x="38.5" y="50.1" font-size="2.5" fill="#000">застройщик</text><text x="88.5" y="46.7" font-size="2.5" fill="#000">Документ</text><text x="108.5" y="46.7" font-size="2.5" fill="#000">Проект дома (разделы АР и КР) или план БТИ с указанием</text><text x="108.5" y="50.1" font-size="2.5" fill="#000">несущих конструкций; тип дома и конструкция перекрытия.</text><text x="192.5" y="46.7" font-size="2.5" fill="#000">До начала демонтажных работ</text><text x="248.5" y="46.7" font-size="2.5" fill="#000">Несущие стены на обмерном плане и плане демонтажа;</text><text x="248.5" y="50.1" font-size="2.5" fill="#000">допустимость демонтажа и новых проёмов; нагрузки от</text><text x="248.5" y="53.5" font-size="2.5" fill="#000">перегородок.</text><text x="248.5" y="56.9" font-size="2.5" fill="#000">Листы:</text><text x="248.5" y="60.3" font-size="2.5" fill="#000">л. 13 — Обмерный план</text><text x="248.5" y="63.7" font-size="2.5" fill="#000">л. 14 — План демонтажа и монтажа перегородок</text><text x="324.5" y="46.7" font-size="2.5" fill="#000">копия документа</text><text x="366.5" y="46.7" font-size="2.5" fill="#000">К-3</text><text x="366.5" y="50.1" font-size="2.5" fill="#000">Результат принимает: Архитектор</text></g><line x1="25" y1="66.8" x2="410" y2="66.8" stroke="#000" stroke-width="0.25"/><g data-el="survey-row" data-id="О-18" data-key="plan-bti" data-closes="К-7" data-method="document" data-covers=""><text x="31" y="70.5" font-size="2.5" text-anchor="middle" fill="#000">О-18</text><text x="38.5" y="70.5" font-size="2.5" fill="#000">вся квартира</text><text x="88.5" y="70.5" font-size="2.5" fill="#000">Документ</text><text x="108.5" y="70.5" font-size="2.5" fill="#000">Поэтажный план БТИ с экспликацией.</text><text x="192.5" y="70.5" font-size="2.5" fill="#000">до демонтажа</text><text x="248.5" y="70.5" font-size="2.5" fill="#000">обмерный план, план демонтажа и монтажа, расстановка</text><text x="248.5" y="73.9" font-size="2.5" fill="#000">мебели</text><text x="248.5" y="77.3" font-size="2.5" fill="#000">Листы:</text><text x="248.5" y="80.7" font-size="2.5" fill="#000">л. 13 — Обмерный план</text><text x="248.5" y="84.1" font-size="2.5" fill="#000">л. 14 — План демонтажа и монтажа перегородок</text><text x="248.5" y="87.5" font-size="2.5" fill="#000">л. 17 — План расстановки мебели</text><text x="324.5" y="70.5" font-size="2.5" fill="#000">копия документа</text><text x="366.5" y="70.5" font-size="2.5" fill="#000">К-7</text><text x="366.5" y="73.9" font-size="2.5" fill="#000">Результат принимает: Архитектор</text></g><line x1="25" y1="90.6" x2="410" y2="90.6" stroke="#000" stroke-width="0.25"/><g data-el="survey-row" data-id="О-19" data-key="tu-power" data-closes="К-8" data-method="document" data-covers="basis:power"><text x="31" y="94.3" font-size="2.5" text-anchor="middle" fill="#000">О-19</text><text x="38.5" y="94.3" font-size="2.5" fill="#000">заказчик, УК</text><text x="88.5" y="94.3" font-size="2.5" fill="#000">Документ</text><text x="108.5" y="94.3" font-size="2.5" fill="#000">ТУ на электроснабжение или справка УК о разрешённой</text><text x="108.5" y="97.7" font-size="2.5" fill="#000">мощности и вводном автомате.</text><text x="192.5" y="94.3" font-size="2.5" fill="#000">до сборки щита</text><text x="248.5" y="94.3" font-size="2.5" fill="#000">вводной автомат, группы варочной панели и духового</text><text x="248.5" y="97.7" font-size="2.5" fill="#000">шкафа</text><text x="248.5" y="101.1" font-size="2.5" fill="#000">Листы:</text><text x="248.5" y="104.5" font-size="2.5" fill="#000">л. 26 — Однолинейная схема щита</text><text x="324.5" y="94.3" font-size="2.5" fill="#000">копия документа</text><text x="366.5" y="94.3" font-size="2.5" fill="#000">К-8</text><text x="366.5" y="97.7" font-size="2.5" fill="#000">Результат принимает:</text><text x="366.5" y="101.1" font-size="2.5" fill="#000">Инженер-электрик</text></g><line x1="25" y1="107.6" x2="410" y2="107.6" stroke="#000" stroke-width="0.25"/><g data-el="survey-row" data-id="О-20" data-key="climate-zone" data-closes="К-10" data-method="document" data-covers=""><text x="31" y="111.3" font-size="2.5" text-anchor="middle" fill="#000">О-20</text><text x="38.5" y="111.3" font-size="2.5" fill="#000">адрес объекта, СП 131.13330</text><text x="88.5" y="111.3" font-size="2.5" fill="#000">Документ</text><text x="108.5" y="111.3" font-size="2.5" fill="#000">Климатический подрайон по СП 131.13330 (по адресу объекта)</text><text x="192.5" y="111.3" font-size="2.5" fill="#000">до заказа каркаса потолков</text><text x="248.5" y="111.3" font-size="2.5" fill="#000">план потолков, разрезы, ведомость объёмов</text><text x="248.5" y="114.7" font-size="2.5" fill="#000">Листы:</text><text x="248.5" y="118.1" font-size="2.5" fill="#000">л. 36 — План потолков</text><text x="324.5" y="111.3" font-size="2.5" fill="#000">копия документа</text><text x="366.5" y="111.3" font-size="2.5" fill="#000">К-10</text><text x="366.5" y="114.7" font-size="2.5" fill="#000">Результат принимает: Архитектор</text></g></g><g data-el="notes"><text x="25" y="133.6" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="138.4" font-size="2.5" fill="#000">1. Подтверждение: акт контрольного обмера (дата, кто присутствовал, прибор, перечень промеров с результатами, подписи присутствующих); к акту — фото вскрытий и узлов и техническое заключение организации, выполнившей обследование.</text><text x="25" y="141.8" font-size="2.5" fill="#000">2. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text><text x="25" y="145.2" font-size="2.5" fill="#000">3. Пункт исключается из задания при следующем выпуске, когда акт подписан, значение внесено в проект и листы перевыпущены; знак «*» у величины снимается только замером.</text></g></g><g data-el="assumed-notes" data-flags="" data-ids="К-1 К-2 К-3 К-7 К-8 К-9 К-10" data-level="0"><text x="25.5" y="272.1" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="275.5" font-size="2.5" fill="#000">Основа листа: размеры помещений и положение проёмов введены заказчиком в брифе, на объекте не замерены (К-1); высота потолка 2700 мм — по брифу заказчика, не замерена</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">(К-2); толщины стен приняты по брифу: наружные 200 мм, внутренние 150 мм — не обмерены (К-1); тип дома монолитный, перекрытие 200 мм — по брифу заказчика, документов нет</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">(К-3); планировка (стены, проёмы, объединение кухни и гостиной, расширение санузла) — по брифу без обмера и плана БТИ (К-7); разрешённая мощность 10 кВт принята, ТУ не</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">переданы (К-8); вентканалы приняты, в брифе не заданы (К-9); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-10).</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 5, записи К-1–К-3, К-7–К-10).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2
 stroke-width="0.18"/><path d="M 261.13 65 L 264.13 65 M 262.63 63.5 L 262.63 66.5" stroke="#000" stroke-width="0.25"/><line x1="264.13" y1="65" x2="268.23" y2="65" stroke="#000" stroke-width="0.18"/><text x="268.82" y="65.9" font-size="2.5" fill="#000">ц 1500</text></g><g data-el="dims"><line x1="256" y1="103.5" x2="256" y2="111.5" stroke="#000" stroke-width="0.25"/><line x1="254.94" y1="110.56" x2="257.06" y2="108.44" stroke="#000" stroke-width="0.5"/><line x1="257.63" y1="103.5" x2="257.63" y2="111.5" stroke="#000" stroke-width="0.25"/><line x1="256.56" y1="110.56" x2="258.69" y2="108.44" stroke="#000" stroke-width="0.5"/><line x1="267.63" y1="103.5" x2="267.63" y2="111.5" stroke="#000" stroke-width="0.25"/><line x1="266.56" y1="110.56" x2="268.69" y2="108.44" stroke="#000" stroke-width="0.5"/><line x1="256" y1="109.5" x2="267.63" y2="109.5" stroke="#000" stroke-width="0.25"/><text x="254.5" y="108.5" font-size="2.5" text-anchor="end" fill="#000">65</text><text x="262.63" y="108.5" font-size="2.5" text-anchor="middle" fill="#000">400</text><line x1="286.13" y1="102.5" x2="294.13" y2="102.5" stroke="#000" stroke-width="0.25"/><line x1="286.13" y1="72" x2="294.13" y2="72" stroke="#000" stroke-width="0.25"/><line x1="292.13" y1="102.5" x2="292.13" y2="72" stroke="#000" stroke-width="0.25"/><line x1="291.06" y1="103.56" x2="293.19" y2="101.44" stroke="#000" stroke-width="0.5"/><line x1="291.06" y1="73.06" x2="293.19" y2="70.94" stroke="#000" stroke-width="0.5"/><text x="291.13" y="87.25" font-size="2.5" text-anchor="middle" transform="rotate(-90 291.13 87.25)" fill="#000">1220</text><line x1="286.13" y1="72" x2="294.13" y2="72" stroke="#000" stroke-width="0.25"/><line x1="286.13" y1="58" x2="294.13" y2="58" stroke="#000" stroke-width="0.25"/><line x1="292.13" y1="72" x2="292.13" y2="58" stroke="#000" stroke-width="0.25"/><line x1="291.06" y1="73.06" x2="293.19" y2="70.94" stroke="#000" stroke-width="0.5"/><line x1="291.06" y1="59.06" x2="293.19" y2="56.94" stroke="#000" stroke-width="0.5"/><text x="291.13" y="65" font-size="2.5" text-anchor="middle" transform="rotate(-90 291.13 65)" fill="#000">560</text></g></g><g data-el="notes"><text x="25" y="262.4" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="267.4" font-size="2.5" fill="#000">1. Высоты — от чистого пола помещения до низа изделия, «ц» — до центра; привязки — от чистовой грани угла стены, мм.</text><text x="25" y="271" font-size="2.5" fill="#000">2. Над мебелью низ изделия — на 150–250 мм выше спинки или изголовья; без мебели центр — на 1450–1600 мм от пола.</text><text x="25" y="274.6" font-size="2.5" fill="#000">3. Изделия до 5 кг — на два подвеса по основанию; тяжелее — на анкеры с нагрузкой не меньше двойной массы; на ГКЛ — только по закладной или анкеру для</text><text x="25" y="278.2" font-size="2.5" fill="#000">пустотелых оснований.</text><text x="25" y="281.8" font-size="2.5" fill="#000">4. Зеркала в рост — с креплением от опрокидывания; в санузлах — влагостойкие, на клей для зеркал и нейтральный силикон.</text><text x="25" y="285.4" font-size="2.5" fill="#000">5. Места изделий — план текстиля и декора (лист 65). Ведомость декора: размер, масса, крепёж и основание — лист 68.</text></g><g data-el="legend"><rect x="298" y="22" width="8" height="4" fill="#E9DDCB" stroke="#5E4630" stroke-width="0.35"/><text x="308" y="24.9" font-size="2.5" fill="#000">картина</text><rect x="332" y="22" width="8" height="4" fill="#D3E1E7" stroke="#4F6D7A" stroke-width="0.35"/><text x="342" y="24.9" font-size="2.5" fill="#000">зеркало</text><rect x="366" y="22" width="8" height="4" fill="#fff" stroke="#6b6b6b" stroke-width="0.25"/><text x="376" y="24.9" font-size="2.5" fill="#000">мебель под изделием</text></g><g data-el="assumed-notes" data-flags="furniture:Гс5|decor:ДК10" data-ids="ИЗ-1 ИЗ-3 К-1 К-2 К-3 К-7 К-8 К-9 К-10" data-level="0"><text x="22.5" y="210.3" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="22.5" y="213.7" font-size="2.5" fill="#000">Основа листа: размеры помещений и положение проёмов введены заказчиком в брифе, на объекте не замерены (К-1); высота потолка 2700 мм — по брифу заказчика, не замерена (К-2); толщины</text><text x="22.5" y="217.1" font-size="2.5" fill="#000">стен приняты по брифу: наружные 200 мм, внутренние 150 мм — не обмерены (К-1); тип дома монолитный, перекрытие 200 мм — по брифу заказчика, документов нет (К-3); планировка (стены,</text><text x="22.5" y="220.5" font-size="2.5" fill="#000">проёмы, объединение кухни и гостиной, расширение санузла) — по брифу без обмера и плана БТИ (К-7); разрешённая мощность 10 кВт принята, ТУ не переданы (К-8); вентканалы приняты, в</text><text x="22.5" y="223.9" font-size="2.5" fill="#000">брифе не заданы (К-9); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-10).</text><text x="22.5" y="227.3" font-size="2.5" fill="#000">Знак «**» — предложение проектировщика, заказчиком не утверждено (согласовать с заказчиком): ИЗ-1, ИЗ-3: Гс5 — Было смещение 1600…3400 у двери Д-2 (3700…4600): между консолью и</text><text x="22.5" y="230.7" font-size="2.5" fill="#000">креслом/диваном оставался проход 575–625 мм, из двери к кухне не пройти; ИЗ-3: ДК10.</text><text x="22.5" y="234.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1–К-3, К-7–К-10; лист 7, записи ИЗ-1, ИЗ-3).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295
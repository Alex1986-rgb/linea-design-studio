chor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">68</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">119</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="285" font-size="3.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">Схемы развески (продолжение)</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="47" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="14" data-positions="61" data-basis="8"><rect x="314.2" y="6.2" width="99.3" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="316.2" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 14 (реестр — л. 6, 7)</text></g></svg>
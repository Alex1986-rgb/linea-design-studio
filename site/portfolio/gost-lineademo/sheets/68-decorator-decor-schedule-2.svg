width="0.25"/><line x1="196" y1="70.2" x2="204" y2="70.2" stroke="#000" stroke-width="0.25"/><line x1="202" y1="89.2" x2="202" y2="70.2" stroke="#000" stroke-width="0.25"/><line x1="200.94" y1="90.26" x2="203.06" y2="88.14" stroke="#000" stroke-width="0.5"/><line x1="200.94" y1="71.26" x2="203.06" y2="69.14" stroke="#000" stroke-width="0.5"/><text x="201" y="79.7" font-size="2.5" text-anchor="middle" transform="rotate(-90 201 79.7)" fill="#000">950</text><line x1="196" y1="70.2" x2="204" y2="70.2" stroke="#000" stroke-width="0.25"/><line x1="196" y1="56.2" x2="204" y2="56.2" stroke="#000" stroke-width="0.25"/><line x1="202" y1="70.2" x2="202" y2="56.2" stroke="#000" stroke-width="0.25"/><line x1="200.94" y1="71.26" x2="203.06" y2="69.14" stroke="#000" stroke-width="0.5"/><line x1="200.94" y1="57.26" x2="203.06" y2="55.14" stroke="#000" stroke-width="0.5"/><text x="201" y="63.2" font-size="2.5" text-anchor="middle" transform="rotate(-90 201 63.2)" fill="#000">700</text></g></g><g data-el="notes"><text x="25" y="262.4" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="267.4" font-size="2.5" fill="#000">1. Высоты — от чистого пола помещения до низа изделия, «ц» — до центра; привязки — от чистовой грани угла стены, мм.</text><text x="25" y="271" font-size="2.5" fill="#000">2. Над мебелью низ изделия — на 150–250 мм выше спинки или изголовья; без мебели центр — на 1450–1600 мм от пола.</text><text x="25" y="274.6" font-size="2.5" fill="#000">3. Изделия до 5 кг — на два подвеса по основанию; тяжелее — на анкеры с нагрузкой не меньше двойной массы; на ГКЛ — только по закладной или анкеру для</text><text x="25" y="278.2" font-size="2.5" fill="#000">пустотелых оснований.</text><text x="25" y="281.8" font-size="2.5" fill="#000">4. Зеркала в рост — с креплением от опрокидывания; в санузлах — влагостойкие, на клей для зеркал и нейтральный силикон.</text><text x="25" y="285.4" font-size="2.5" fill="#000">5. Места изделий — план текстиля и декора (лист 64). Ведомость декора: размер, масса, крепёж и основание — лист 67.</text></g><g data-el="legend"><rect x="298" y="22" width="8" height="4" fill="#E9DDCB" stroke="#5E4630" stroke-width="0.35"/><text x="308" y="24.9" font-size="2.5" fill="#000">картина</text><rect x="332" y="22" width="8" height="4" fill="#D3E1E7" stroke="#4F6D7A" stroke-width="0.35"/><text x="342" y="24.9" font-size="2.5" fill="#000">зеркало</text><rect x="366" y="22" width="8" height="4" fill="#fff" stroke="#6b6b6b" stroke-width="0.25"/><text x="376" y="24.9" font-size="2.5" fill="#000">мебель под изделием</text></g><g data-el="assumed-notes" data-flags="furniture:Гс5" data-ids="ИЗ-1 К-1 К-2 К-3 К-7 К-8 К-9 К-10" data-level="0"><text x="22.5" y="210.3" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="22.5" y="213.7" font-size="2.5" fill="#000">Основа листа: размеры помещений и положение проёмов введены заказчиком в брифе, на объекте не замерены (К-1); высота потолка 2700 мм — по брифу заказчика, не замерена (К-2); толщины</text><text x="22.5" y="217.1" font-size="2.5" fill="#000">стен приняты по брифу: наружные 200 мм, внутренние 150 мм — не обмерены (К-1); тип дома монолитный, перекрытие 200 мм — по брифу заказчика, документов нет (К-3); планировка (стены,</text><text x="22.5" y="220.5" font-size="2.5" fill="#000">проёмы, объединение кухни и гостиной, расширение санузла) — по брифу без обмера и плана БТИ (К-7); разрешённая мощность 10 кВт принята, ТУ не переданы (К-8); вентканалы приняты, в</text><text x="22.5" y="223.9" font-size="2.5" fill="#000">брифе не заданы (К-9); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-10).</text><text x="22.5" y="227.3" font-size="2.5" fill="#000">Знак «**» — предложение проектировщика, заказчиком не утверждено (согласовать с заказчиком): ИЗ-1: Гс5 — Было смещение 1600…3400 у двери Д-2 (3700…4600): между консолью и</text><text x="22.5" y="230.7" font-size="2.5" fill="#000">креслом/диваном оставался проход 575–625 мм, из двери к кухне не пройти.</text><text x="22.5" y="234.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-1–К-3, К-7–К-10; лист 7, запись ИЗ-1).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" t
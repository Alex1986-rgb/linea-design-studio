<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Открытые вопросы, принятые допущения и конфликты. Лист 2 из 2" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты. Лист 2 из 2</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации</text><g data-el="open-issues" data-plan="fixed" data-plan-declared="2"><g data-el="issues-changes"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Изменения проекта после выпуска листов (реестр изменений)</text><rect x="25" y="33" width="385" height="135.8" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="32" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="33" x2="39" y2="168.8" stroke="#000" stroke-width="0.25"/><text x="50" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><line x1="61" y1="33" x2="61" y2="168.8" stroke="#000" stroke-width="0.25"/><text x="91" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><line x1="121" y1="33" x2="121" y2="168.8" stroke="#000" stroke-width="0.25"/><text x="171" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Было</text><line x1="221" y1="33" x2="221" y2="168.8" stroke="#000" stroke-width="0.25"/><text x="283.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Стало</text><line x1="346" y1="33" x2="346" y2="168.8" stroke="#000" stroke-width="0.25"/><text x="378" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Кто решил, подпись</text><g data-el="issue-row" data-kind="change" data-id="ИЗ-1"><text x="32" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-1</text><text x="40.5" y="46.7" font-size="2.5" fill="#000">30.10.2026</text><text x="62.5" y="46.7" font-size="2.5" fill="#000">л. 28 — План розеток и электровыводов</text><text x="62.5" y="50.1" font-size="2.5" fill="#000">л. 30 — План выключателей и схема</text><text x="62.5" y="53.5" font-size="2.5" fill="#000">включения</text><text x="62.5" y="56.9" font-size="2.5" fill="#000">л. 29 — План освещения</text><text x="62.5" y="60.3" font-size="2.5" fill="#000">л. 74 — Ведомости изделий, техники и</text><text x="62.5" y="63.7" font-size="2.5" fill="#000">фурнитуры</text><text x="122.5" y="46.7" font-size="2.5" fill="#000">Кухня-гостиная: ТВ1, LAN1 и розетка «ТВ, приставка» стояли на стене В</text><text x="122.5" y="50.1" font-size="2.5" fill="#000">(привязка 3300…3450, кухонная стена), а ТВ-тумба М20 — на стене Г</text><text x="122.5" y="53.5" font-size="2.5" fill="#000">(1500…3300): за телевизором точек не было. Выключатель S1 — на стене Г в</text><text x="122.5" y="56.9" font-size="2.5" fill="#000">зоне экрана, у двери Д-2 выключателя не было. Светильник гардеробной Св16</text><text x="122.5" y="60.3" font-size="2.5" fill="#000">— на линии L6 подсветки кухонной столешницы, выключателя в гардеробной</text><text x="122.5" y="63.7" font-size="2.5" fill="#000">нет. Ванная и санузел — одна линия L4 с одним выключателем S4. Вытяжка в</text><text x="122.5" y="67.1" font-size="2.5" fill="#000">М10 без вывода питания; розетка холодильника без привязки к модулю М4.</text><text x="222.5" y="46.7" font-size="2.5" fill="#000">ТВ1 (2400), LAN1 (2550) и розетка приставки (2400, H=300) — на стене Г по оси тумбы М20. S1</text><text x="222.5" y="50.1" font-size="2.5" fill="#000">стена В, привязка 4950 (150 мм от проёма Д-2 со стороны ручки), S5 у дивана — проходной. Св16</text><text x="222.5" y="53.5" font-size="2.5" fill="#000">— линия L7, выключатель S8 на стене Г гардеробной у Д-3 (привязка 1500). Санузел — линия L9,</text><text x="222.5" y="56.9" font-size="2.5" fill="#000">выключатель S9 в прихожей у Д-4 санузла (стена Г, привязка 1450); S4 — только ванная (L4,</text><text x="222.5" y="60.3" font-size="2.5" fill="#000">вентилятор ВР2). Розетка вытяжки — стена В привязка 2500, H=2200, группа 2 (для М10); розетка</text><text x="222.5" y="63.7" font-size="2.5" fill="#000">холодильника — для М4.</text><text x="347.5" y="46.7" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 12.11.2026.</text><text x="347.5" y="50.1" font-size="2.5" fill="#000">Предложил: исполнитель.</text></g><line x1="25" y1="70.2" x2="410" y2="70.2" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-2"><text x="32" y="73.9" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-2</text><text x="40.5" y="73.9" font-size="2.5" fill="#000">30.10.2026</text><text x="62.5" y="73.9" font-size="2.5" fill="#000">л. 24 — План расстановки мебели</text><text x="62.5" y="77.3" font-size="2.5" fill="#000">л. 25 — Спецификация мебели и</text><text x="62.5" y="80.7" font-size="2.5" fill="#000">оборудования</text><text x="122.5" y="73.9" font-size="2.5" fill="#000">Диван М1 на стене Б привязка 1300…3500: торец в 500 мм от стены В, дверь</text><text x="122.5" y="77.3" font-size="2.5" fill="#000">Д-2 (3900…4800) открывалась в торец дивана. Кресло М22 x 4250, y 450.</text><text x="222.5" y="73.9" font-size="2.5" fill="#000">Диван М1 привязка 1000…3200 — перед проёмом 800 мм; кресло М22 x 3500…4300, y 450 у окна 2.</text><text x="222.5" y="77.3" font-size="2.5" fill="#000">Выключатель S5 и розетка у дивана — привязка 900. Знак «**» у М1, М22 до подписи автора.</text><text x="347.5" y="73.9" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 12.11.2026.</text><text x="347.5" y="77.3" font-size="2.5" fill="#000">Предложил: исполнитель.</text></g><line x1="25" y1="83.8" x2="410" y2="83.8" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-3"><text x="32" y="87.5" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-3</text><text x="40.5" y="87.5" font-size="2.5" fill="#000">30.10.2026</text><text x="62.5" y="87.5" font-size="2.5" fill="#000">л. 36 — План вентиляции</text><text x="122.5" y="87.5" font-size="2.5" fill="#000">Внутренний блок КВ-1 на стене А привязка 3300…4200 — внутри оконного</text><text x="122.5" y="90.9" font-size="2.5" fill="#000">проёма 3200…4800; наружный КН-1 привязка 3350 — на окне.</text><text x="222.5" y="87.5" font-size="2.5" fill="#000">КВ-1 — стена Г, привязка 300…1200 (простенок у окна 1), КН-1 — стена А, простенок между окнами</text><text x="222.5" y="90.9" font-size="2.5" fill="#000">2400…3200. Трасса ≈ 3 м (петля принята по минимуму, паспорта модели нет). Знак «**» у КВ-1 до</text><text x="222.5" y="94.3" font-size="2.5" fill="#000">подписи автора.</text><text x="347.5" y="87.5" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 12.11.2026.</text><text x="347.5" y="90.9" font-size="2.5" fill="#000">Предложил: исполнитель.</text></g><line x1="25" y1="97.4" x2="410" y2="97.4" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-4"><text x="32" y="101.1" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-4</text><text x="40.5" y="101.1" font-size="2.5" fill="#000">12.11.2026</text><text x="62.5" y="101.1" font-size="2.5" fill="#000">л. 61 — План текстиля и декора</text><text x="62.5" y="104.5" font-size="2.5" fill="#000">л. 63 — Ведомость текстиля</text><text x="62.5" y="107.9" font-size="2.5" fill="#000">л. 64 — Ведомость декора. Схемы развески</text><text x="62.5" y="111.3" font-size="2.5" fill="#000">л. 62 — Шторы и карнизы</text><text x="122.5" y="101.1" font-size="2.5" fill="#000">Декор и текстиль в данных проекта не были заданы: ни штор, ни ковров, ни</text><text x="122.5" y="104.5" font-size="2.5" fill="#000">подушек и пледов, ни картин, зеркал и растений (в палитре — пометка</text><text x="122.5" y="107.9" font-size="2.5" fill="#000">«текстиль в данных ещё не задан»). Кадры визуализаций и листы декоратора</text><text x="122.5" y="111.3" font-size="2.5" fill="#000">строятся только по данным — помещения выходили пустыми; зеркал в</text><text x="122.5" y="114.7" font-size="2.5" fill="#000">прихожей и над умывальником ванной не было.</text><text x="222.5" y="101.1" font-size="2.5" fill="#000">Декор и текстиль заданы позициями плана. Кухня-гостиная: шторы льняные в пол на оба окна (Т1,</text><text x="222.5" y="104.5" font-size="2.5" fill="#000">Т2; шина на потолке, вынос 250 — зазор до радиаторов 110 мм), ковёр шерстяной 1400×2500 в</text><text x="222.5" y="107.9" font-size="2.5" fill="#000">зоне дивана (Т3), подушки 3 + 2 и плед на диван М1 (Т4–Т6), пара постеров в дубовых рамах</text><text x="222.5" y="111.3" font-size="2.5" fill="#000">600×800 над диваном (ДК1, ДК2; низ 1050), фикус в напольном кашпо в углу у окна 1 (ДК3), ваза на</text><text x="222.5" y="114.7" font-size="2.5" fill="#000">обеденном столе М3 (ДК4). Спальня: римская штора с блэкаутом (Т7; в пол не идёт — слева</text><text x="222.5" y="118.1" font-size="2.5" fill="#000">внутренний блок КВ-2, под окном радиатор), ковёр 2000×3000 под кроватью (Т8), подушки 2 + 1 и</text><text x="222.5" y="121.5" font-size="2.5" fill="#000">плед на кровать С1 (Т9–Т11), картина 1100×700 над изголовьем, зеркало в рост 600×1600 на стене</text><text x="222.5" y="124.9" font-size="2.5" fill="#000">В (ДК6), замиокулькас в углу (ДК7). Ванная: зеркало 450×650 над умывальником П3 (ДК8). Санузел:</text><text x="222.5" y="128.3" font-size="2.5" fill="#000">постер 300×400 на стене В (ДК9). Прихожая: зеркало в рост 600×1700 на стене А слева от двери</text><text x="222.5" y="131.7" font-size="2.5" fill="#000">Д-2 (ДК10), постер 400×560 в простенке между дверями Д-2 и Д-3 (ДК11). Цвета — из палитры</text><text x="222.5" y="135.1" font-size="2.5" fill="#000">стиля: молочный, каменный, акценты — пыльный синий NCS S 4010-R90B и шалфей NCS S</text><text x="222.5" y="138.5" font-size="2.5" fill="#000">3010-G10Y. Дорожка в прихожей не задана: весь пол — в зонах открывания пяти дверей. Знак «**»</text><text x="222.5" y="141.9" font-size="2.5" fill="#000">у позиций до подписи автора.</text><text x="347.5" y="101.1" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="104.5" font-size="2.5" fill="#000">исполнителя; предложение проектировщика, на</text><text x="347.5" y="107.9" font-size="2.5" fill="#000">утверждение А. С. Кырлана</text></g><line x1="25" y1="145" x2="410" y2="145" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-5"><text x="32" y="148.7" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-5</text><text x="40.5" y="148.7" font-size="2.5" fill="#000">12.11.2026</text><text x="62.5" y="148.7" font-size="2.5" fill="#000">л. 61 — План текстиля и декора</text><text x="62.5" y="152.1" font-size="2.5" fill="#000">л. 63 — Ведомость текстиля</text><text x="62.5" y="155.5" font-size="2.5" fill="#000">л. 64 — Ведомость декора. Схемы развески</text><text x="122.5" y="148.7" font-size="2.5" fill="#000">Разбор двух критиков по кадрам: мокрые зоны — «стерильный шоурум»: в</text><text x="122.5" y="152.1" font-size="2.5" fill="#000">ванной на полотенцесушителе П5 нет полотенец, у ванны нет коврика, в</text><text x="122.5" y="155.5" font-size="2.5" fill="#000">санузле на полке короба инсталляции пусто (ИЗ-4 задал там только зеркало и</text><text x="122.5" y="158.9" font-size="2.5" fill="#000">постер).</text><text x="222.5" y="148.7" font-size="2.5" fill="#000">Ванная: банные полотенца пыльного синего и ручные молочные на полотенцесушителе П5 (Т12,</text><text x="222.5" y="152.1" font-size="2.5" fill="#000">Т13), коврик 800×450 у бортика ванны (Т14; вне полотна двери Д-4). Санузел: ваза с сухой веткой и</text><text x="222.5" y="155.5" font-size="2.5" fill="#000">свеча с диффузором на полке короба инсталляции П20 (ДК12, ДК13). Смеситель ванны П1 в</text><text x="222.5" y="158.9" font-size="2.5" fill="#000">данных задан («смеситель настенный») — правка не нужна. Прихожая не дополнялась: стены</text><text x="222.5" y="162.3" font-size="2.5" fill="#000">заняты дверями, щитами и домофоном, пол — в зонах открывания пяти дверей (см. ИЗ-4). Знак</text><text x="222.5" y="165.7" font-size="2.5" fill="#000">«**» у позиций до подписи автора.</text><text x="347.5" y="148.7" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="152.1" font-size="2.5" fill="#000">исполнителя; предложение проектировщика, на</text><text x="347.5" y="155.5" font-size="2.5" fill="#000">утверждение А. С. Кырлана</text></g></g><g data-el="notes"><text x="25" y="181.2" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="186" font-size="2.5" fill="#000">1. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text><text x="25" y="189.4" font-size="2.5" fill="#000">2. Графа «Если решения нет» показывает состояние решения на листах; влияние на сроки и стоимость по пунктам не оценивалось.</text><text x="25" y="192.8" font-size="2.5" fill="#000">3. Пункт, по которому принято решение, при следующем выпуске комплекта из таблиц исключается.</text></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">14.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size=
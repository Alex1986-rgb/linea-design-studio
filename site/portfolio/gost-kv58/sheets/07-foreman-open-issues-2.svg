<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Открытые вопросы, принятые допущения и конфликты. Лист 2 из 2" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты. Лист 2 из 2</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации</text><g data-el="open-issues" data-plan="fixed" data-plan-declared="2"><g data-el="issues-questions"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Открытые вопросы и принятые допущения (продолжение)</text><rect x="25" y="33" width="385" height="50.8" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="32" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="33" x2="39" y2="83.8" stroke="#000" stroke-width="0.25"/><text x="122" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Формулировка</text><line x1="205" y1="33" x2="205" y2="83.8" stroke="#000" stroke-width="0.25"/><text x="220" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Вид</text><line x1="235" y1="33" x2="235" y2="83.8" stroke="#000" stroke-width="0.25"/><text x="253" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Кто решает</text><line x1="271" y1="33" x2="271" y2="83.8" stroke="#000" stroke-width="0.25"/><text x="309.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Если решения нет</text><line x1="348" y1="33" x2="348" y2="83.8" stroke="#000" stroke-width="0.25"/><text x="379" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Лист, где это проявляется</text><g data-el="issue-row" data-kind="question" data-id="К-5"><text x="32" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">К-5</text><text x="40.5" y="46.7" font-size="2.5" fill="#000">Основа альбома — план заказчика без контрольного обмера: размеры помещений сняты с плана, высота потолка 2700 мм и</text><text x="40.5" y="50.1" font-size="2.5" fill="#000">толщины стен (наружные 250 мм, перегородки 120 мм) приняты — на плане они не указаны. От них зависят вертикальные размеры</text><text x="40.5" y="53.5" font-size="2.5" fill="#000">(развёртки, шкафы, плитка, потолки), объёмы работ и сборка шкафов-купе. Выполнить контрольный обмер.</text><text x="206.5" y="46.7" font-size="2.5" fill="#000">Непонятно</text><text x="206.5" y="50.1" font-size="2.5" fill="#000">Ждёт: обмера</text><text x="236.5" y="46.7" font-size="2.5" fill="#000">Архитектор-планировщик</text><text x="272.5" y="46.7" font-size="2.5" fill="#000">размеры, высота потолка и толщины стен — принятые;</text><text x="272.5" y="50.1" font-size="2.5" fill="#000">мебель на заказ, двери и каркас потолков не заказывать до</text><text x="272.5" y="53.5" font-size="2.5" fill="#000">обмера</text><text x="349.5" y="46.7" font-size="2.5" fill="#000">л. 20 — Обмерный план</text></g><line x1="25" y1="56.6" x2="410" y2="56.6" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-6"><text x="32" y="60.3" font-size="2.5" text-anchor="middle" fill="#000">К-6</text><text x="40.5" y="60.3" font-size="2.5" fill="#000">Разрешённая мощность 15 кВт принята по типовой квартире, технических условий в материалах объекта нет. Сверить с</text><text x="40.5" y="63.7" font-size="2.5" fill="#000">техническими условиями.</text><text x="206.5" y="60.3" font-size="2.5" fill="#000">Непонятно</text><text x="206.5" y="63.7" font-size="2.5" fill="#000">Ждёт: документа</text><text x="236.5" y="60.3" font-size="2.5" fill="#000">Инженер-электрик</text><text x="272.5" y="60.3" font-size="2.5" fill="#000">вводной аппарат и группы щита — по 15 кВт; при меньшей</text><text x="272.5" y="63.7" font-size="2.5" fill="#000">мощности схему щита пересчитать до монтажа</text><text x="349.5" y="60.3" font-size="2.5" fill="#000">л. 31 — Однолинейная схема щита</text></g><line x1="25" y1="66.8" x2="410" y2="66.8" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-7"><text x="32" y="70.5" font-size="2.5" text-anchor="middle" fill="#000">К-7</text><text x="40.5" y="70.5" font-size="2.5" fill="#000">Места стиральной машины в квартире не было. В ванной 2,2 × 1,5 м и санузле места 600 × 600 с подходом нет. Предложение</text><text x="40.5" y="73.9" font-size="2.5" fill="#000">исполнителя: узкая машина 600 × 450 под столешницей кухни вместо модуля с ящиками М11 справа от варочной, ряд удлиняется на</text><text x="40.5" y="77.3" font-size="2.5" fill="#000">220 мм; отдельная группа щита с УЗО 30 мА. Решить: принять, или машина в ванной вместо ванны (душ), или отказ от машины</text><text x="40.5" y="80.7" font-size="2.5" fill="#000">(прачечная) решением автора</text><text x="206.5" y="70.5" font-size="2.5" fill="#000">Предложение</text><text x="206.5" y="73.9" font-size="2.5" fill="#000">Ждёт: документа,</text><text x="206.5" y="77.3" font-size="2.5" fill="#000">затем решения</text><text x="236.5" y="70.5" font-size="2.5" fill="#000">Инженер ВК (вода,</text><text x="236.5" y="73.9" font-size="2.5" fill="#000">канализация)</text><text x="272.5" y="70.5" font-size="2.5" fill="#000">стиральная машина П6 в кухне под столешницей (ниша</text><text x="272.5" y="73.9" font-size="2.5" fill="#000">вместо М11, 2800…3420) — как на листах</text><text x="349.5" y="70.5" font-size="2.5" fill="#000">л. 37 — План выводов сантехники</text><text x="349.5" y="73.9" font-size="2.5" fill="#000">л. 24 — План расстановки мебели</text><text x="349.5" y="77.3" font-size="2.5" fill="#000">л. 31 — Однолинейная схема щита</text></g></g><g data-el="issues-changes"><text x="25" y="96.2" font-size="3.5" font-weight="700" fill="#000">Изменения проекта после выпуска листов (реестр изменений)</text><rect x="25" y="98.8" width="385" height="64.4" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="108.8" x2="410" y2="108.8" stroke="#000" stroke-width="0.5"/><text x="32" y="104.7" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="98.8" x2="39" y2="163.2" stroke="#000" stroke-width="0.25"/><text x="50" y="104.7" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><line x1="61" y1="98.8" x2="61" y2="163.2" stroke="#000" stroke-width="0.25"/><text x="91" y="104.7" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><line x1="121" y1="98.8" x2="121" y2="163.2" stroke="#000" stroke-width="0.25"/><text x="171" y="104.7" font-size="2.5" text-anchor="middle" fill="#000">Было</text><line x1="221" y1="98.8" x2="221" y2="163.2" stroke="#000" stroke-width="0.25"/><text x="283.5" y="104.7" font-size="2.5" text-anchor="middle" fill="#000">Стало</text><line x1="346" y1="98.8" x2="346" y2="163.2" stroke="#000" stroke-width="0.25"/><text x="378" y="104.7" font-size="2.5" text-anchor="middle" fill="#000">Кто решил, подпись</text><g data-el="issue-row" data-kind="change" data-id="ИЗ-1"><text x="32" y="112.5" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-1</text><text x="40.5" y="112.5" font-size="2.5" fill="#000">30.10.2026</text><text x="62.5" y="112.5" font-size="2.5" fill="#000">л. 27 — План розеток и электровыводов</text><text x="62.5" y="115.9" font-size="2.5" fill="#000">л. 29 — План выключателей и схема</text><text x="62.5" y="119.3" font-size="2.5" fill="#000">включения</text><text x="62.5" y="122.7" font-size="2.5" fill="#000">л. 28 — План освещения</text><text x="62.5" y="126.1" font-size="2.5" fill="#000">л. 68 — Ведомости изделий, техники и</text><text x="62.5" y="129.5" font-size="2.5" fill="#000">фурнитуры</text><text x="122.5" y="112.5" font-size="2.5" fill="#000">Кухня-гостиная: ТВ1, LAN1 и розетка «ТВ, приставка» стояли на стене В</text><text x="122.5" y="115.9" font-size="2.5" fill="#000">(привязка 3300…3450, кухонная стена), а ТВ-тумба М20 — на стене Г</text><text x="122.5" y="119.3" font-size="2.5" fill="#000">(1500…3300): за телевизором точек не было. Выключатель S1 — на стене Г в</text><text x="122.5" y="122.7" font-size="2.5" fill="#000">зоне экрана, у двери Д-2 выключателя не было. Светильник гардеробной Св16</text><text x="122.5" y="126.1" font-size="2.5" fill="#000">— на линии L6 подсветки кухонной столешницы, выключателя в гардеробной</text><text x="122.5" y="129.5" font-size="2.5" fill="#000">нет. Ванная и санузел — одна линия L4 с одним выключателем S4. Вытяжка в</text><text x="122.5" y="132.9" font-size="2.5" fill="#000">М10 без вывода питания; розетка холодильника без привязки к модулю М4.</text><text x="222.5" y="112.5" font-size="2.5" fill="#000">ТВ1 (2400), LAN1 (2550) и розетка приставки (2400, H=300) — на стене Г по оси тумбы М20. S1</text><text x="222.5" y="115.9" font-size="2.5" fill="#000">стена В, привязка 4950 (150 мм от проёма Д-2 со стороны ручки), S5 у дивана — проходной. Св16</text><text x="222.5" y="119.3" font-size="2.5" fill="#000">— линия L7, выключатель S8 на стене Г гардеробной у Д-3 (привязка 1500). Санузел — линия L9,</text><text x="222.5" y="122.7" font-size="2.5" fill="#000">выключатель S9 в прихожей у Д-4 санузла (стена Г, привязка 1450); S4 — только ванная (L4,</text><text x="222.5" y="126.1" font-size="2.5" fill="#000">вентилятор ВР2). Розетка вытяжки — стена В привязка 2500, H=2200, группа 2 (для М10); розетка</text><text x="222.5" y="129.5" font-size="2.5" fill="#000">холодильника — для М4.</text><text x="347.5" y="112.5" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="115.9" font-size="2.5" fill="#000">исполнителя; на утверждение А. С. Кырлана</text></g><line x1="25" y1="136" x2="410" y2="136" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-2"><text x="32" y="139.7" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-2</text><text x="40.5" y="139.7" font-size="2.5" fill="#000">30.10.2026</text><text x="62.5" y="139.7" font-size="2.5" fill="#000">л. 24 — План расстановки мебели</text><text x="62.5" y="143.1" font-size="2.5" fill="#000">л. 25 — Спецификация мебели и</text><text x="62.5" y="146.5" font-size="2.5" fill="#000">оборудования</text><text x="122.5" y="139.7" font-size="2.5" fill="#000">Диван М1 на стене Б привязка 1300…3500: торец в 500 мм от стены В, дверь</text><text x="122.5" y="143.1" font-size="2.5" fill="#000">Д-2 (3900…4800) открывалась в торец дивана. Кресло М22 x 4250, y 450.</text><text x="222.5" y="139.7" font-size="2.5" fill="#000">Диван М1 привязка 1000…3200 — перед проёмом 800 мм; кресло М22 x 3500…4300, y 450 у окна 2.</text><text x="222.5" y="143.1" font-size="2.5" fill="#000">Выключатель S5 и розетка у дивана — привязка 900. Знак «**» у М1, М22 до подписи автора.</text><text x="347.5" y="139.7" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="143.1" font-size="2.5" fill="#000">исполнителя; предложение проектировщика, на</text><text x="347.5" y="146.5" font-size="2.5" fill="#000">утверждение А. С. Кырлана</text></g><line x1="25" y1="149.6" x2="410" y2="149.6" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-3"><text x="32" y="153.3" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-3</text><text x="40.5" y="153.3" font-size="2.5" fill="#000">30.10.2026</text><text x="62.5" y="153.3" font-size="2.5" fill="#000">л. 35 — План вентиляции</text><text x="122.5" y="153.3" font-size="2.5" fill="#000">Внутренний блок КВ-1 на стене А привязка 3300…4200 — внутри оконного</text><text x="122.5" y="156.7" font-size="2.5" fill="#000">проёма 3200…4800; наружный КН-1 привязка 3350 — на окне.</text><text x="222.5" y="153.3" font-size="2.5" fill="#000">КВ-1 — стена Г, привязка 300…1200 (простенок у окна 1), КН-1 — стена А, простенок между окнами</text><text x="222.5" y="156.7" font-size="2.5" fill="#000">2400…3200. Трасса ≈ 3 м (петля принята по минимуму, паспорта модели нет). Знак «**» у КВ-1 до</text><text x="222.5" y="160.1" font-size="2.5" fill="#000">подписи автора.</text><text x="347.5" y="153.3" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="156.7" font-size="2.5" fill="#000">исполнителя; предложение проектировщика, на</text><text x="347.5" y="160.1" font-size="2.5" fill="#000">утверждение А. С. Кырлана</text></g></g><g data-el="notes"><text x="25" y="175.6" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="180.4" font-size="2.5" fill="#000">1. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text><text x="25" y="183.8" font-size="2.5" fill="#000">2. Графа «Если решения нет» показывает состояние решения на листах; влияние на сроки и стоимость по пунктам не оценивалось.</text><text x="25" y="187.2" font-size="2.5" fill="#000">3. Пункт, по которому принято решение, при следующем выпуске комплекта из таблиц исключается.</text></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">10.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fi
xt x="28.5" y="91.3" font-size="2.5" text-anchor="start" data-fit="67" fill="#000">Коэффициент одновременности</text><text x="98.5" y="91.3" font-size="2.5" text-anchor="start" data-fit="97" fill="#000">0,7</text><line x1="27" y1="99" x2="197" y2="99" stroke="#000" stroke-width="0.18"/><text x="28.5" y="97.3" font-size="2.5" text-anchor="start" data-fit="67" fill="#000">Расчётная мощность квартиры Pрасч</text><text x="98.5" y="97.3" font-size="2.5" text-anchor="start" data-fit="97" fill="#000">1,1 кВт</text><line x1="27" y1="105" x2="197" y2="105" stroke="#000" stroke-width="0.18"/><text x="28.5" y="103.3" font-size="2.5" text-anchor="start" data-fit="67" fill="#000">Расчётный ток Iрасч (230 В, cosφ 0,95)</text><text x="98.5" y="103.3" font-size="2.5" text-anchor="start" data-fit="97" fill="#000">5 А</text><line x1="27" y1="111" x2="197" y2="111" stroke="#000" stroke-width="0.18"/><text x="28.5" y="109.3" font-size="2.5" text-anchor="start" data-fit="67" fill="#000">Разрешённая мощность</text><text x="98.5" y="109.3" font-size="2.5" text-anchor="start" data-fit="97" fill="#000">15 кВт</text><line x1="27" y1="117" x2="197" y2="117" stroke="#000" stroke-width="0.18"/><text x="28.5" y="115.3" font-size="2.5" text-anchor="start" data-fit="67" fill="#000">Запас до разрешённой</text><text x="98.5" y="115.3" font-size="2.5" text-anchor="start" data-fit="97" fill="#000">92,8 %</text><text x="28.5" y="121.3" font-size="2.5" text-anchor="start" data-fit="67" fill="#000">Вводной аппарат</text><text x="98.5" y="121.3" font-size="2.5" text-anchor="start" data-fit="97" fill="#000">C63, 2P</text></g><g data-el="notes"><text x="210" y="67" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="210" y="72" font-size="2.5" fill="#000">1. Pуст — установленная мощность группы по данным щита (приборы — по паспорту, розетки общего назначения — оценка 0,1 кВт на гнездо). Кс — коэффициенты</text><text x="213" y="75.4" font-size="2.5" fill="#000">спроса: освещение 0,6; розетки 0,4; варочная и духовой 0,6; кондиционеры 0,8; тёплый пол 1,0; прочие 0,7; одновременность 0,7.</text><text x="210" y="78.8" font-size="2.5" fill="#000">2. Коэффициенты — ориентир исполнителя, не табличные значения нормы; расчёт нагрузки подтверждает инженер ЭОМ (СП 256.1325800.2016). Под разрешённую</text><text x="213" y="82.2" font-size="2.5" fill="#000">мощность они не подгоняются.</text><text x="210" y="85.6" font-size="2.5" fill="#000">3. Вывод: запас 93 % (расчётная 1,1 кВт при разрешённой 15 кВт).</text><text x="210" y="89" font-size="2.5" fill="#000">4. Розеточные и мокрые линии — через УЗО или дифавтомат с током утечки не более 30 мА (ПУЭ 7.1.79); в санузле выполнить ДСУП (ПУЭ 7.1.87–7.1.88).</text></g><g data-el="assumed-notes" data-flags="" data-ids="К-4 К-5 К-6" data-level="0"><text x="25.5" y="275.5" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">Основа листа: размеры сняты с плана заказчика, контрольный обмер не выполнен (К-5); высота потолка 2700 мм принята: на плане заказчика не указана (К-5); подрайон климата не</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">задан — принят не северный (жилые от 2,5 м) (К-4); толщины стен приняты: наружные 250 мм, перегородки 120 мм — не обмерены (К-5); разрешённая мощность 15 кВт принята по</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">типовой квартире, технических условий нет (К-6).</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, запись К-4; лист 7, записи К-5, К-6).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="25
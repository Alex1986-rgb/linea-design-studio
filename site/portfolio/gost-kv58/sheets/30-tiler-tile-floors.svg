 text-anchor="start" fill="#000">1,5 кг</text><line x1="193" y1="45" x2="337" y2="45" stroke="#000" stroke-width="0.18"/><text x="194.5" y="43.3" font-size="2.5" text-anchor="start" fill="#000">Клей</text><text x="218.5" y="43.3" font-size="2.5" text-anchor="start" fill="#000">C2 S1</text><text x="282.5" y="43.3" font-size="2.5" text-anchor="start" fill="#000">1,5 кг/м²·мм, слой 5</text><text x="312.5" y="43.3" font-size="2.5" text-anchor="start" fill="#000">37 кг (2 меш.)</text><line x1="193" y1="51" x2="337" y2="51" stroke="#000" stroke-width="0.18"/><text x="194.5" y="49.3" font-size="2.5" text-anchor="start" fill="#000">Клей</text><text x="218.5" y="49.3" font-size="2.5" text-anchor="start" fill="#000">C2</text><text x="282.5" y="49.3" font-size="2.5" text-anchor="start" fill="#000">1,5 кг/м²·мм, слой 5</text><text x="312.5" y="49.3" font-size="2.5" text-anchor="start" fill="#000">78 кг (4 меш.)</text><text x="194.5" y="55.3" font-size="2.5" text-anchor="start" fill="#000">Демпф. лента</text><text x="218.5" y="55.3" font-size="2.5" text-anchor="start" fill="#000">по периметру пола из плитки</text><text x="282.5" y="55.3" font-size="2.5" text-anchor="start" fill="#000"></text><text x="312.5" y="55.3" font-size="2.5" text-anchor="start" fill="#000">21,2 м</text></g><g data-el="notes"><text x="25" y="65.5" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="70.5" font-size="2.5" fill="#000">1. Плитка пола мокрых помещений не задана — планы полов санузлов не выполнены; на листе — ведомость плитки остальных помещений.</text><text x="25" y="74.1" font-size="2.5" fill="#000">2. Толщины облицовки стен не заданы: раскладка от черновых размеров, до укладки пересчитать от чистовых.</text><text x="25" y="77.7" font-size="2.5" fill="#000">3. Раскладка пола «Ванная» и пола «Санузел» и пола «Прихожая» — на листе «Раскладка плитки. Ванная. Санузел. Прихожая».</text><text x="25" y="81.3" font-size="2.5" fill="#000">4. Калибр партии не задан — до укладки замерить (рабочий размер W, ГОСТ 13996-2019) и пересчитать подрезки.</text><text x="25" y="84.9" font-size="2.5" fill="#000">5. Количество: целые по раскладке + по одной на подрезку, запас 10 %; один артикул — одна партия и тон. Исключены поддон, короб, проёмы и места за коробом; S — по чистым граням, как в ведомости отделки.</text><text x="25" y="88.5" font-size="2.5" fill="#000">6. Клей C2 S1; C2 (ГОСТ Р 56387-2018), затирка класс не задан; расход — по ТУ выбранной марки.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="75" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="75" y1="285.5" x2="75" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="77" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-widt
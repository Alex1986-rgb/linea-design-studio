<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Чек-лист приёмки по этапам. Лист 2 из 4" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Чек-лист приёмки по этапам. Лист 2 из 4</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">По этапам Р-1…Р-N: что проверить, чем, какой допуск и какой акт подписать до закрытия работы</text><g data-el="acceptance"><g data-el="acc-table"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Приёмка по этапам: контрольные точки, допуски и акты скрытых работ (продолжение)</text><rect x="25" y="33" width="385" height="157.4" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="31" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Этап</text><line x1="37" y1="33" x2="37" y2="190.4" stroke="#000" stroke-width="0.25"/><text x="62" y="37.2" font-size="2.5" text-anchor="middle" fill="#000">Контрольная точка (дальше не</text><text x="62" y="40.6" font-size="2.5" text-anchor="middle" fill="#000">пускают без подписи)</text><line x1="87" y1="33" x2="87" y2="190.4" stroke="#000" stroke-width="0.25"/><text x="118" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Что проверяют</text><line x1="149" y1="33" x2="149" y2="190.4" stroke="#000" stroke-width="0.25"/><text x="169" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Чем</text><line x1="189" y1="33" x2="189" y2="190.4" stroke="#000" stroke-width="0.25"/><text x="222" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Допуск</text><line x1="255" y1="33" x2="255" y2="190.4" stroke="#000" stroke-width="0.25"/><text x="276" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Основание</text><line x1="297" y1="33" x2="297" y2="190.4" stroke="#000" stroke-width="0.25"/><text x="308" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Подпись</text><line x1="319" y1="33" x2="319" y2="190.4" stroke="#000" stroke-width="0.25"/><text x="364.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Акт скрытых работ / документ</text><g data-el="acc-row" data-work="Р-5" data-key="plaster" data-n="3"><text x="88.5" y="46.7" font-size="2.5" fill="#000">Неровности (плоскостность)</text><text x="150.5" y="46.7" font-size="2.5" fill="#000">правило 2 м и щуп</text><text x="190.5" y="46.7" font-size="2.5" fill="#000">до 5 / 3 / 2 мм на 1 м; не более 3 / 2 / 2</text><text x="190.5" y="50.1" font-size="2.5" fill="#000">неровностей на 4 м²</text><text x="256.5" y="46.7" font-size="2.5" fill="#000">практика (СП 71.13330.2017)</text></g><line x1="25" y1="53.2" x2="410" y2="53.2" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-5" data-key="plaster" data-n="4"><text x="88.5" y="56.9" font-size="2.5" fill="#000">Влажность основания перед шпаклёвкой и</text><text x="88.5" y="60.3" font-size="2.5" fill="#000">отделкой</text><text x="150.5" y="56.9" font-size="2.5" fill="#000">влагомер</text><text x="190.5" y="56.9" font-size="2.5" fill="#000">верхние 20–30 мм — не более 5 % по массе</text><text x="256.5" y="56.9" font-size="2.5" fill="#000">норматив (СП 71, табл. 7.2)</text></g><line x1="25" y1="63.4" x2="410" y2="63.4" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-6" data-key="screed" data-n="1"><text x="31" y="67.1" font-size="2.5" text-anchor="middle" fill="#000">Р-6</text><text x="38.5" y="67.1" font-size="2.5" fill="#000">Стяжка</text><text x="38.5" y="70.5" font-size="2.5" fill="#000">Стяжка: подготовка, после заливки</text><text x="38.5" y="73.9" font-size="2.5" fill="#000">ровность, затем замер CM перед</text><text x="38.5" y="77.3" font-size="2.5" fill="#000">чистовым полом</text><text x="88.5" y="67.1" font-size="2.5" fill="#000">Ровность: просвет под рейкой 2 м</text><text x="150.5" y="67.1" font-size="2.5" fill="#000">рейка 2 м, клиновой щуп</text><text x="190.5" y="67.1" font-size="2.5" fill="#000">под паркет, ламинат — 2 мм; под гидроизоляцию</text><text x="190.5" y="70.5" font-size="2.5" fill="#000">до 4 мм; прочие покрытия — до 6 мм (цифры</text><text x="190.5" y="73.9" font-size="2.5" fill="#000">расходятся между источниками — сверить перед</text><text x="190.5" y="77.3" font-size="2.5" fill="#000">актом)</text><text x="256.5" y="67.1" font-size="2.5" fill="#000">практика (СП 29.13330)</text><text x="320.5" y="67.1" font-size="2.5" fill="#000">Акт скрытых работ на стяжку (толщина, армирование) до чистового</text><text x="320.5" y="70.5" font-size="2.5" fill="#000">пола; протокол ровности и протокол CM-влажности; звукоизоляция и</text><text x="320.5" y="73.9" font-size="2.5" fill="#000">демпферная лента под стяжкой — фото и паспорт; контуры тёплого</text><text x="320.5" y="77.3" font-size="2.5" fill="#000">пола до заливки — схема укладки и замер сопротивления.</text></g><line x1="25" y1="80.4" x2="410" y2="80.4" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-6" data-key="screed" data-n="2"><text x="88.5" y="84.1" font-size="2.5" fill="#000">Отклонение от горизонтали по помещению</text><text x="150.5" y="84.1" font-size="2.5" fill="#000">уровень, нивелир</text><text x="190.5" y="84.1" font-size="2.5" fill="#000">не более 0,2 % длины помещения</text><text x="256.5" y="84.1" font-size="2.5" fill="#000">практика (СП 29.13330)</text></g><line x1="25" y1="88.4" x2="410" y2="88.4" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-6" data-key="screed" data-n="3"><text x="88.5" y="92.1" font-size="2.5" fill="#000">Число точек измерения</text><text x="150.5" y="92.1" font-size="2.5" fill="#000">рейка</text><text x="190.5" y="92.1" font-size="2.5" fill="#000">не менее 3 на 30 м² или 1 на небольшое</text><text x="190.5" y="95.5" font-size="2.5" fill="#000">помещение</text><text x="256.5" y="92.1" font-size="2.5" fill="#000">практика</text></g><line x1="25" y1="98.6" x2="410" y2="98.6" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-6" data-key="screed" data-n="4"><text x="88.5" y="102.3" font-size="2.5" fill="#000">Отслоения и пустоты</text><text x="150.5" y="102.3" font-size="2.5" fill="#000">простукивание молотком или</text><text x="150.5" y="105.7" font-size="2.5" fill="#000">киянкой</text><text x="190.5" y="102.3" font-size="2.5" fill="#000">глухой звук — зона вскрывается и переделывается</text><text x="256.5" y="102.3" font-size="2.5" fill="#000">практика</text></g><line x1="25" y1="108.8" x2="410" y2="108.8" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-6" data-key="screed" data-n="5"><text x="88.5" y="112.5" font-size="2.5" fill="#000">Влажность перед укладкой доски: цементная</text><text x="88.5" y="115.9" font-size="2.5" fill="#000">стяжка</text><text x="150.5" y="112.5" font-size="2.5" fill="#000">влагомер; CM-замер</text><text x="190.5" y="112.5" font-size="2.5" fill="#000">ЦПС не более 2,0 % CM (с тёплым полом не более</text><text x="190.5" y="115.9" font-size="2.5" fill="#000">1,8 %); влагомер для плитки — не более 5 %</text><text x="256.5" y="112.5" font-size="2.5" fill="#000">практика (СП 71; рекомендации</text><text x="256.5" y="115.9" font-size="2.5" fill="#000">производителей)</text></g><line x1="25" y1="119" x2="410" y2="119" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-7" data-key="wp" data-n="1"><text x="31" y="122.7" font-size="2.5" text-anchor="middle" fill="#000">Р-7</text><text x="38.5" y="122.7" font-size="2.5" fill="#000">Гидроизоляция</text><text x="38.5" y="126.1" font-size="2.5" fill="#000">Гидроизоляция: пролив 24 ч</text><text x="38.5" y="129.5" font-size="2.5" fill="#000">подпись до плитки</text><text x="88.5" y="122.7" font-size="2.5" fill="#000">Заведение на стены не ниже 200 мм от чистого</text><text x="88.5" y="126.1" font-size="2.5" fill="#000">пола; за ванной — 300 мм выше борта; в душе</text><text x="88.5" y="129.5" font-size="2.5" fill="#000">без поддона — на высоту лейки</text><text x="150.5" y="122.7" font-size="2.5" fill="#000">рулетка</text><text x="190.5" y="122.7" font-size="2.5" fill="#000">не менее 200 мм</text><text x="256.5" y="122.7" font-size="2.5" fill="#000">норматив (СП 71.13330.2017, п.</text><text x="256.5" y="126.1" font-size="2.5" fill="#000">8.6.5); остальное — практика</text><text x="320.5" y="122.7" font-size="2.5" fill="#000">Акт теста проливом, фото узлов и высоты заведения на стены — до</text><text x="320.5" y="126.1" font-size="2.5" fill="#000">плитки.</text></g><line x1="25" y1="132.6" x2="410" y2="132.6" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-7" data-key="wp" data-n="2"><text x="88.5" y="136.3" font-size="2.5" fill="#000">Тест проливом: слой воды 10–30 мм, контроль</text><text x="88.5" y="139.7" font-size="2.5" fill="#000">уровня и потолка соседа снизу</text><text x="150.5" y="136.3" font-size="2.5" fill="#000">линейка, визуально</text><text x="190.5" y="136.3" font-size="2.5" fill="#000">24 ч (минимум 12 ч); падения уровня и протечки</text><text x="190.5" y="139.7" font-size="2.5" fill="#000">нет</text><text x="256.5" y="136.3" font-size="2.5" fill="#000">практика</text></g><line x1="25" y1="142.8" x2="410" y2="142.8" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-7" data-key="wp" data-n="3"><text x="88.5" y="146.5" font-size="2.5" fill="#000">Два слоя обмазки с межслойной сушкой, лента</text><text x="88.5" y="149.9" font-size="2.5" fill="#000">в углах и манжеты на выводах</text><text x="150.5" y="146.5" font-size="2.5" fill="#000">визуально</text><text x="190.5" y="146.5" font-size="2.5" fill="#000">по инструкции производителя</text><text x="256.5" y="146.5" font-size="2.5" fill="#000">практика</text></g><line x1="25" y1="153" x2="410" y2="153" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-8" data-key="gkl" data-n="1"><text x="31" y="156.7" font-size="2.5" text-anchor="middle" fill="#000">Р-8</text><text x="38.5" y="156.7" font-size="2.5" fill="#000">ГКЛ</text><text x="38.5" y="160.1" font-size="2.5" fill="#000">Короба, ниши и потолки: черновые</text><text x="38.5" y="163.5" font-size="2.5" fill="#000">сети в зоне коробов приняты до</text><text x="38.5" y="166.9" font-size="2.5" fill="#000">обшивки</text><text x="88.5" y="156.7" font-size="2.5" fill="#000">Шаг саморезов, отступ от кромки, заделка</text><text x="88.5" y="160.1" font-size="2.5" fill="#000">стыков (как у перегородок)</text><text x="150.5" y="156.7" font-size="2.5" fill="#000">рулетка, визуально</text><text x="190.5" y="156.7" font-size="2.5" fill="#000">потолок 150 мм; кромка 5–10 мм; стык — лента и 2</text><text x="190.5" y="160.1" font-size="2.5" fill="#000">слоя шпаклёвки</text><text x="256.5" y="156.7" font-size="2.5" fill="#000">практика (СП 163.1325800.2014)</text><text x="320.5" y="156.7" font-size="2.5" fill="#000">Акт скрытых работ: каркас ГКЛ, закладные, звукоизоляция — фото до</text><text x="320.5" y="160.1" font-size="2.5" fill="#000">обшивки; воздуховоды в коробах и за потолком — фото и схема.</text></g><line x1="25" y1="170" x2="410" y2="170" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-8" data-key="gkl" data-n="2"><text x="88.5" y="173.7" font-size="2.5" fill="#000">Закладные под тяжёлое, карнизы, подвесные</text><text x="88.5" y="177.1" font-size="2.5" fill="#000">светильники на месте до обшивки</text><text x="150.5" y="173.7" font-size="2.5" fill="#000">фото с привязками</text><text x="190.5" y="173.7" font-size="2.5" fill="#000">по плану потолков и узлам</text><text x="256.5" y="173.7" font-size="2.5" fill="#000">практика</text></g><line x1="25" y1="180.2" x2="410" y2="180.2" stroke="#000" stroke-width="0.25"/><g data-el="acc-row" data-work="Р-8" data-key="gkl" data-n="3"><text x="88.5" y="183.9" font-size="2.5" fill="#000">Ревизионные люки: доступ к арматуре и</text><text x="88.5" y="187.3" font-size="2.5" fill="#000">ревизиям сохранён</text><text x="150.5" y="183.9" font-size="2.5" fill="#000">осмотр</text><text x="190.5" y="183.9" font-size="2.5" fill="#000">по листу ВК</text><text x="256.5" y="183.9" font-size="2.5" fill="#000">практика</text></g></g></g><g data-el="assumed-notes" data-flags="" data-ids="К-4 К-5 К-6" data-level="0"><text x="25.5" y="275.5" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">Основа листа: размеры сняты с плана заказчика, контрольный обмер не выполнен (К-5); высота потолка 2700 мм принята: на плане заказчика не указана (К-5); подрайон климата не</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">задан — принят не северный (жилые от 2,5 м) (К-4); толщины стен приняты: наружные 250 мм, перегородки 120 мм — не обмерены (К-5); разрешённая мощность 15 кВт принята по</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">типовой квартире, технических условий нет (К-6).</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-4–К-6).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" s
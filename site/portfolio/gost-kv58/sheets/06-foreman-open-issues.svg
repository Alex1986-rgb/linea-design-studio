<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Открытые вопросы, принятые допущения и конфликты. Лист 1 из 2" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты. Лист 1 из 2</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации</text><g data-el="open-issues" data-plan="fixed" data-plan-declared="2"><text x="25" y="27.2" font-size="2.5" fill="#000">Комплект предварительный по пунктам этих таблиц. Пока по пункту нет ответа или решения, показанное на указанном листе — допущение проектировщика, а не утверждённое решение.</text><text x="25" y="30.6" font-size="2.5" fill="#000">Сводка: открытых вопросов — 7 (из них ждут факта объекта — 6: контрольного обмера, обследования или документа); изменений в реестре — 3, из них без подписи — 3.</text><text x="25" y="34" font-size="2.5" fill="#000">Пункты, ответ на которые лежит на объекте, а не за столом проектировщика (графа «Вид», строка «Ждёт»), собраны на листе «Задание на контрольный обмер и обследование» (листы 8–10): что и где замерить, с какой точностью и чем подтвердить. Пункты, ждущие решения человека, на объекте не</text><text x="25" y="37.4" font-size="2.5" fill="#000">закрываются.</text><g data-el="issues-questions"><text x="25" y="49" font-size="3.5" font-weight="700" fill="#000">Открытые вопросы и принятые допущения</text><rect x="25" y="51.6" width="385" height="78" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="61.6" x2="410" y2="61.6" stroke="#000" stroke-width="0.5"/><text x="32" y="57.5" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="51.6" x2="39" y2="129.6" stroke="#000" stroke-width="0.25"/><text x="122" y="57.5" font-size="2.5" text-anchor="middle" fill="#000">Формулировка</text><line x1="205" y1="51.6" x2="205" y2="129.6" stroke="#000" stroke-width="0.25"/><text x="220" y="57.5" font-size="2.5" text-anchor="middle" fill="#000">Вид</text><line x1="235" y1="51.6" x2="235" y2="129.6" stroke="#000" stroke-width="0.25"/><text x="253" y="57.5" font-size="2.5" text-anchor="middle" fill="#000">Кто решает</text><line x1="271" y1="51.6" x2="271" y2="129.6" stroke="#000" stroke-width="0.25"/><text x="309.5" y="57.5" font-size="2.5" text-anchor="middle" fill="#000">Если решения нет</text><line x1="348" y1="51.6" x2="348" y2="129.6" stroke="#000" stroke-width="0.25"/><text x="379" y="57.5" font-size="2.5" text-anchor="middle" fill="#000">Лист, где это проявляется</text><g data-el="issue-row" data-kind="question" data-id="К-1"><text x="32" y="65.3" font-size="2.5" text-anchor="middle" fill="#000">К-1</text><text x="40.5" y="65.3" font-size="2.5" fill="#000">Вентканалы на плане заказчика не показаны: ВК-1 принят у перегородки ванной и санузла (со стороны прихожей), ВК-2 — у кухни. От</text><text x="40.5" y="68.7" font-size="2.5" fill="#000">них зависят решётки ВР1–ВР3 и короба. Замерить положение и сечение каналов, проверить тягу.</text><text x="206.5" y="65.3" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="68.7" font-size="2.5" fill="#000">Ждёт: обмера</text><text x="236.5" y="65.3" font-size="2.5" fill="#000">Инженер ОВ</text><text x="272.5" y="65.3" font-size="2.5" fill="#000">решётки ванной и санузла — у ВК-1, кухни — у ВК-2; места</text><text x="272.5" y="68.7" font-size="2.5" fill="#000">— до обмера, лист перевыпустить по факту</text><text x="349.5" y="65.3" font-size="2.5" fill="#000">л. 35 — План вентиляции</text></g><line x1="25" y1="71.8" x2="410" y2="71.8" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-2"><text x="32" y="75.5" font-size="2.5" text-anchor="middle" fill="#000">К-2</text><text x="40.5" y="75.5" font-size="2.5" fill="#000">Ванная (пом. 3), 2140 × 1380 мм в чистоте, проём Д-4 у стены Б. Расстановка проектировщика: ванна 1500 × 700 у стены А от стены</text><text x="40.5" y="78.9" font-size="2.5" fill="#000">Г (была 1600 и заходила в проход перед Д-4 — свободно 240 из 700 мм), умывальник П3 у стены В справа от ванны — перед ним</text><text x="40.5" y="82.3" font-size="2.5" fill="#000">свободно 750 мм (был напротив ванны в 230 мм), полотенцесушитель П5 на стене В между коробом стояков и умывальником. Унитаз</text><text x="40.5" y="85.7" font-size="2.5" fill="#000">П2 из образца раскладки снят: он стоял на стояке Ст К1-1 (короба и люка не поставить), унитаз квартиры — П20 в санузле,</text><text x="40.5" y="89.1" font-size="2.5" fill="#000">инсталляция и короб — там. Остаётся: перед ванной 680 мм до стены В при ориентире 750 мм — это глубина помещения; у</text><text x="40.5" y="92.5" font-size="2.5" fill="#000">умывальника до стены Б 90 мм при ориентире 200 мм. Решить: (а) принять расстановку; (б) душ с поддоном 900 × 900 у стены Г</text><text x="40.5" y="95.9" font-size="2.5" fill="#000">вместо ванны — перед приборами ≥ 750 мм, кадры ванной перерисовать; (в) другой вариант автора.</text><text x="206.5" y="75.5" font-size="2.5" fill="#000">Спорно</text><text x="206.5" y="78.9" font-size="2.5" fill="#000">Ждёт: решения</text><text x="236.5" y="75.5" font-size="2.5" fill="#000">Инженер ВК (вода,</text><text x="236.5" y="78.9" font-size="2.5" fill="#000">канализация)</text><text x="272.5" y="75.5" font-size="2.5" fill="#000">ванна 1500 × 700 и умывальник у стены В по листам;</text><text x="272.5" y="78.9" font-size="2.5" fill="#000">модели ванны и умывальника не заказывать до решения</text><text x="349.5" y="75.5" font-size="2.5" fill="#000">л. 37 — План выводов сантехники</text><text x="349.5" y="78.9" font-size="2.5" fill="#000">л. 24 — План расстановки мебели</text></g><line x1="25" y1="99" x2="410" y2="99" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-3"><text x="32" y="102.7" font-size="2.5" text-anchor="middle" fill="#000">К-3</text><text x="40.5" y="102.7" font-size="2.5" fill="#000">Скрытые двери Д-2, Д-3, Д-4 стоят в существующих проёмах прихожей, размеров в свету нет: короб скрытой двери шире и выше</text><text x="40.5" y="106.1" font-size="2.5" fill="#000">полотна на 100–120 / 50–80 мм, полотно по проёму 2100 под ряд 2000 не встаёт (по каталогам нужно 2050–2080). У Д-3 (спальня) и</text><text x="40.5" y="109.5" font-size="2.5" fill="#000">Д-4 (санузел) откос от угла 40 мм — под короб нужно не меньше 50. Замерить проёмы в чистоте и откосы; решить: проёмы</text><text x="40.5" y="112.9" font-size="2.5" fill="#000">подрезать/расширить на 10+ мм от угла (если стена не несущая) или взять модель с узким коробом; высоту проёма — по выбранной</text><text x="40.5" y="116.3" font-size="2.5" fill="#000">модели.</text><text x="206.5" y="102.7" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="106.1" font-size="2.5" fill="#000">Ждёт: обмера, затем</text><text x="206.5" y="109.5" font-size="2.5" fill="#000">решения</text><text x="236.5" y="102.7" font-size="2.5" fill="#000">Архитектор-планировщик</text><text x="272.5" y="102.7" font-size="2.5" fill="#000">блоки скрытых дверей не заказывать до замера; полотна на</text><text x="272.5" y="106.1" font-size="2.5" fill="#000">листах — расчётные («расч.»), проёмы не переносятся</text><text x="349.5" y="102.7" font-size="2.5" fill="#000">л. 22 — План дверей и ведомость заполнения</text><text x="349.5" y="106.1" font-size="2.5" fill="#000">проёмов</text></g><line x1="25" y1="119.4" x2="410" y2="119.4" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="question" data-id="К-4"><text x="32" y="123.1" font-size="2.5" text-anchor="middle" fill="#000">К-4</text><text x="40.5" y="123.1" font-size="2.5" fill="#000">Климатический подрайон (СП 131.13330) не задан: принят не северный — жилые комнаты и кухня под потолком от 2,5 м (СП 54, п.</text><text x="40.5" y="126.5" font-size="2.5" fill="#000">5.12); в IА, IБ, IГ, IД, IVА — от 2,7 м.</text><text x="206.5" y="123.1" font-size="2.5" fill="#000">Отсутствует</text><text x="206.5" y="126.5" font-size="2.5" fill="#000">Ждёт: документа</text><text x="236.5" y="123.1" font-size="2.5" fill="#000">Архитектор-планировщик</text><text x="272.5" y="123.1" font-size="2.5" fill="#000">отметки потолков жилых — по 2,5 м; при северном</text><text x="272.5" y="126.5" font-size="2.5" fill="#000">подрайоне уровни ниже 2,7 м пересчитать до заказа каркаса</text><text x="349.5" y="123.1" font-size="2.5" fill="#000">л. 47 — План потолков</text></g></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">10.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-006-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Квартира 58 м²</text><text x="297" y="259.2" font-size="2.5" data-fit="116" fill="#000">Общая площадь 55,23* м² · * размеры приняты, не замерены (реестр — л. 6, 7, К-5)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" data-fit="66" fill="#000">Дизайн-проект интерьера</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">6</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">102</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="283.1" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">Открытые вопросы, принятые допущения и</text><text x="330" y="286.9" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">конфликты. Лист 1 из 2</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="47" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="10" data-positions="20" data-basis="5"><rect x="314.2" y="6.2" width="99.3" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="316.2" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 10 (реестр — л. 6, 7)</text></g></svg>
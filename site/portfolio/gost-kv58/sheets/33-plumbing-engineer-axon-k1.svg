1"><circle cx="71.95" cy="92.87" r="1" fill="#fff" stroke="#6b4f2a" stroke-width="0.35"/></g><g data-el="pl-outlet" data-index="К1"><circle cx="128.59" cy="81.62" r="1" fill="#fff" stroke="#6b4f2a" stroke-width="0.35"/></g></g><g data-el="risers"><g data-el="riser" data-index="К1"><path d="M 62.21 110 L 62.21 51" fill="none" stroke="#6b4f2a" stroke-width="0.7"/><path d="M 60.41 109.5 L 61.61 110.5 L 62.81 109.5 L 64.01 110.5" fill="none" stroke="#000" stroke-width="0.25"/><path d="M 60.41 50.5 L 61.61 51.5 L 62.81 50.5 L 64.01 51.5" fill="none" stroke="#000" stroke-width="0.25"/><circle cx="62.21" cy="103.2" r="1.1" fill="#fff" stroke="#6b4f2a" stroke-width="0.35"/></g></g><g data-el="pl-labels"><text x="39.27" y="111.01" font-size="2.5" fill="#555">4 Санузел</text><text x="45.69" y="99.62" font-size="2.5" fill="#555">3 Ванная</text><text x="55.78" y="45.4" font-size="2.5" fill="#6b4f2a">Ст К1-1 Ø110</text><text x="55.78" y="48.4" font-size="2.5" fill="#6b4f2a">+2,700</text><text x="65.51" y="108.4" font-size="2.5" fill="#000">−0,015</text><line x1="54.04" y1="102.77" x2="38.04" y2="102.77" stroke="#000" stroke-width="0.18"/><text x="29.19" y="101.87" font-size="2.5" fill="#000">К1-5 П20</text><text x="29.19" y="104.87" font-size="2.5" fill="#000">Н=230</text><text x="98.29" y="84.72" font-size="2.5" fill="#000">К1-1 П4</text><text x="98.29" y="87.72" font-size="2.5" fill="#000">Н=400</text><text x="84.98" y="97.42" font-size="2.5" fill="#000" textLength="7.65" lengthAdjust="spacingAndGlyphs">К1-4 П3**</text><text x="84.98" y="100.42" font-size="2.5" fill="#000">Н=500</text><text x="75.25" y="98.07" font-size="2.5" fill="#000" textLength="7.65" lengthAdjust="spacingAndGlyphs">К1-3 П1**</text><text x="75.25" y="101.07" font-size="2.5" fill="#000">Н=50</text><text x="130.49" y="80.72" font-size="2.5" fill="#000" textLength="7.65" lengthAdjust="spacingAndGlyphs">К1-2 П6**</text><text x="130.49" y="83.72" font-size="2.5" fill="#000">Н=600</text><text x="108.7" y="85.74" font-size="2.5" fill="#6b4f2a">Ø40 i=35</text><text x="108.7" y="88.74" font-size="2.5" fill="#6b4f2a">L=1,67</text></g></g><g data-el="legend-box"><g data-el="legend"><text x="310" y="25" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><line x1="310.5" y1="31" x2="317.5" y2="31" stroke="#6b4f2a" stroke-width="0.5" stroke-dasharray="6 1.2"/><text x="321" y="31.9" font-size="2.5" fill="#000">К1 — канализация бытовая</text><circle cx="314" cy="36" r="1" fill="#fff" stroke="#6b4f2a" stroke-width="0.35"/><text x="321" y="36.9" font-size="2.5" fill="#000">вывод К1 (код — в ведомости привязок)</text><circle cx="314" cy="41" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="321" y="41.9" font-size="2.5" fill="#000">стояк «Ст К1-N / Ст В1-N» (ГОСТ 21.601), Ø мм</text><circle cx="314" cy="46" r="1.1" fill="#fff" stroke="#6b4f2a" stroke-width="0.35"/><text x="321" y="46.9" font-size="2.5" fill="#000">стояк в плане (на отметке пола); вертикаль — стояк по высоте,</text><text x="321" y="50.2" font-size="2.5" fill="#000">разрыв — перекрытие</text><line x1="310.5" y1="54.3" x2="316" y2="54.3" stroke="#000" stroke-width="0.25"/><path d="M 317.5 54.3 L 315.7 53.599999999999994 L 315.7 55 Z" fill="#000"/><text x="321" y="55.2" font-size="2.5" fill="#000">направление уклона К1 / пола: Ø, мм на 1 м</text><circle cx="314" cy="59.3" r="1.1" fill="#fff" stroke="#000" stroke-width="0.25"/><path d="M 313.2 58.5 L 314.8 60.1 M 314.8 58.5 L 313.2 60.1" fill="none" stroke="#000" stroke-width="0.25" data-sym="revision"/><text x="321" y="60.2" font-size="2.5" fill="#000">ревизия (прочистка) К1 — доступ сохранить</text><circle cx="314" cy="64.3" r="0.6" fill="#000"/><text x="321" y="65.2" font-size="2.5" fill="#000">тройник (ответвление к прибору)</text></g></g><g data-el="notes"><text x="25" y="240" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="245" font-size="2.5" fill="#000">1. Схема К1 построена по тем же трассам, что план разводки: положение в плане сохранено, глубина — в масштабе ×0,5. Трассы принципиальные; фактическое</text><text x="25" y="248.6" font-size="2.5" fill="#000">положение фиксируется исполнительной схемой до закрытия.</text><text x="25" y="252.2" font-size="2.5" fill="#000">2. Отметки — от плиты перекрытия: низ трубы у врезки в стояк — отметка из данных выпуска, к прибору труба поднимается на уклон i, мм/м (уклон не менее</text><text x="25" y="255.8" font-size="2.5" fill="#000">1/d и не более 150 мм/м, СП 30.13330.2020, п. 19.1); чистый пол — выше плиты на стяжку (высота пирога пола). Высота выпуска прибора Н — от чистого</text><text x="25" y="259.4" font-size="2.5" fill="#000">пола.</text><text x="25" y="263" font-size="2.5" fill="#000">3. Ревизия — на повороте и в начале участка; стояк К1 в коробе с люком — звукоизоляция стояка в коробе; поворот — двумя отводами 45°.</text><text x="25" y="266.6" font-size="2.5" fill="#000">4. Трубы испытать давлением до закрытия (акт скрытых работ, опрессовка по СП 73.13330.2016).</text><text x="25" y="270.2" font-size="2.5" fill="#000">5. Диаметры, высоты выводов и места кранов — по паспортам выбранных приборов и расчёту проектной организации.</text><text x="25" y="273.8" font-size="2.5" fill="#000">6. Расчёт систем, диаметры магистралей и подбор оборудования выполняет проектная организация.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="45" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="45" y1="285.5" x2="45" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="47" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="fixture:П6|fixture:П1|fixture:П3" data-ids="К-2 К-4 К-5 К-6 К-7" data-level="0"><text x="45.5" y="210.3" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="45.5" y="213.7" font-size="2.5" fill="#000">Основа листа: размеры сняты с плана заказчика, контрольный обмер не выполнен (К-5); высота потолка 2700 мм принята: на плане заказчика не указана (К-5); подрайон климата не задан — принят</text><text x="45.5" y="217.1" font-size="2.5" fill="#000">не северный (жилые от 2,5 м) (К-4); толщины стен приняты: наружные 250 мм, перегородки 120 мм — не обмерены (К-5); разрешённая мощность 15 кВт принята по типовой квартире, технических</text><text x="45.5" y="220.5" font-size="2.5" fill="#000">условий нет (К-6).</text><text x="45.5" y="223.9" font-size="2.5" fill="#000">Знак «**» — предложение проектировщика, заказчиком не утверждено (согласовать с заказчиком): К-2: П1 — ванна 1500 вместо 1600 — не заходит в проход перед проёмом Д-4; перед ванной 680</text><text x="45.5" y="227.3" font-size="2.5" fill="#000">мм — глубина помещения; П3 — умывальник у стены В справа от ванны — перед ним свободно 750 мм, до стены Б 90 мм; К-7: П6 — стиральная машина на кухне: в ванной и санузле места нет;</text><text x="45.5" y="230.7" font-size="2.5" fill="#000">подвод ХВС с шаровым краном, слив — встраиваемый сифон с обратным клапаном (водяной затвор), отдельная группа 6 щита с УЗО 30 мА.</text><text x="45.5" y="234.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-2, К-4–К-7).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-widt
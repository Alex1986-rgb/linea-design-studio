<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="График закупок и работ. Лист 2 из 3" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">График закупок и работ. Лист 2 из 3</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Что заказывать и когда не раньше чего: относительный порядок без дат; срок поставки — из данных или «не задан» с записью реестра</text><g data-el="proc-schedule" data-plan="fixed" data-plan-declared="3"><g data-el="proc-work"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Работы: порядок и что не даёт начать</text><rect x="25" y="33" width="385" height="99.6" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="31" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="37" y1="33" x2="37" y2="132.6" stroke="#000" stroke-width="0.25"/><text x="83" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Работа (стадия технологической последовательности)</text><line x1="129" y1="33" x2="129" y2="132.6" stroke="#000" stroke-width="0.25"/><text x="149" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">После</text><line x1="169" y1="33" x2="169" y2="132.6" stroke="#000" stroke-width="0.25"/><text x="233" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Что должно быть к началу: условия и закупки</text><line x1="297" y1="33" x2="297" y2="132.6" stroke="#000" stroke-width="0.25"/><text x="353.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Не начинать, пока открыто в реестре</text><g data-el="work-row" data-id="Р-1" data-key="dem" data-after=""><text x="31" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">Р-1</text><text x="38.5" y="46.7" font-size="2.5" fill="#000">Демонтаж покрытий, отделки стен и потолков, дверных блоков и</text><text x="38.5" y="50.1" font-size="2.5" fill="#000">приборов; конструкции, стены и перегородки не трогать до технического</text><text x="38.5" y="53.5" font-size="2.5" fill="#000">заключения (стадия 1)</text><text x="130.5" y="46.7" font-size="2.5" fill="#000"></text><text x="170.5" y="46.7" font-size="2.5" fill="#000">до начала: запрошены документы на дом и БТИ; контрольный обмер до демонтажа (что видно)</text><text x="170.5" y="50.1" font-size="2.5" fill="#000">сделан</text><text x="298.5" y="46.7" font-size="2.5" fill="#000"></text></g><line x1="25" y1="56.6" x2="410" y2="56.6" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-2" data-key="obmer" data-after="Р-1"><text x="31" y="60.3" font-size="2.5" text-anchor="middle" fill="#000">Р-2</text><text x="38.5" y="60.3" font-size="2.5" fill="#000">Контрольный обмер на голых стенах и обследование (задание — лист</text><text x="38.5" y="63.7" font-size="2.5" fill="#000">«Задание на контрольный обмер») (стадия 2)</text><text x="130.5" y="60.3" font-size="2.5" fill="#000">Р-1</text><text x="170.5" y="60.3" font-size="2.5" fill="#000">после снятия отделки: видны стояки, каналы, щиток, толщины стен; до заказа всего, что делают по</text><text x="170.5" y="63.7" font-size="2.5" fill="#000">размеру</text><text x="298.5" y="60.3" font-size="2.5" fill="#000"></text></g><line x1="25" y1="66.8" x2="410" y2="66.8" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-3" data-key="el" data-after="Р-2"><text x="31" y="70.5" font-size="2.5" text-anchor="middle" fill="#000">Р-3</text><text x="38.5" y="70.5" font-size="2.5" fill="#000">Черновая электрика: штробы, короба, гофра, подрозетники, щит (стадия</text><text x="38.5" y="73.9" font-size="2.5" fill="#000">4)</text><text x="130.5" y="70.5" font-size="2.5" fill="#000">Р-2</text><text x="170.5" y="70.5" font-size="2.5" fill="#000">до начала: план электрики с высотами утверждён; штробы в стенах — только после технического</text><text x="170.5" y="73.9" font-size="2.5" fill="#000">заключения; мебель расставлена</text><text x="298.5" y="70.5" font-size="2.5" fill="#000">К-6: Разрешённая мощность 15 кВт принята по типовой квартире, технических условий в</text><text x="298.5" y="73.9" font-size="2.5" fill="#000">материалах объекта нет.</text></g><line x1="25" y1="77" x2="410" y2="77" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-4" data-key="vk" data-after="Р-2"><text x="31" y="80.7" font-size="2.5" text-anchor="middle" fill="#000">Р-4</text><text x="38.5" y="80.7" font-size="2.5" fill="#000">Черновая сантехника и вентиляция: разводка, выводы, инсталляции,</text><text x="38.5" y="84.1" font-size="2.5" fill="#000">короба стояков (стадия 5)</text><text x="130.5" y="80.7" font-size="2.5" fill="#000">Р-2</text><text x="170.5" y="80.7" font-size="2.5" fill="#000">до начала: положение стояков замерено; модели инсталляций и машины выбраны (габариты рамы,</text><text x="170.5" y="84.1" font-size="2.5" fill="#000">подводка); инсталляцию ставят до обшивки ГКЛВ и до гидроизоляции</text><text x="170.5" y="87.5" font-size="2.5" fill="#000">Закупки к началу: З-4 (стиральная машина), З-5 (сантехника)</text><text x="298.5" y="80.7" font-size="2.5" fill="#000">К-7: Места стиральной машины в квартире не было.</text></g><line x1="25" y1="90.6" x2="410" y2="90.6" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-5" data-key="plaster" data-after="Р-2 Р-3 Р-4"><text x="31" y="94.3" font-size="2.5" text-anchor="middle" fill="#000">Р-5</text><text x="38.5" y="94.3" font-size="2.5" fill="#000">Коробки скрытых дверей, затем штукатурка стен и откосов (стадия 6)</text><text x="130.5" y="94.3" font-size="2.5" fill="#000">Р-2, Р-3, Р-4</text><text x="170.5" y="94.3" font-size="2.5" fill="#000">до начала: электрика и сантехника смонтированы, штробы заделаны; коробки скрытых дверей</text><text x="170.5" y="97.7" font-size="2.5" fill="#000">установлены до штукатурки (поэтому заказ дверей — раньше работы)</text><text x="170.5" y="101.1" font-size="2.5" fill="#000">Закупки к началу: З-1 (двери скрытого монтажа)</text><text x="298.5" y="94.3" font-size="2.5" fill="#000">К-5: Основа альбома — план заказчика без контрольного обмера: размеры помещений</text><text x="298.5" y="97.7" font-size="2.5" fill="#000">сняты с плана, высота потолка 2700 мм и толщины стен (наружные 250 мм, перегородки</text><text x="298.5" y="101.1" font-size="2.5" fill="#000">120 мм) приняты — на плане они не указаны.</text></g><line x1="25" y1="104.2" x2="410" y2="104.2" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-6" data-key="screed" data-after="Р-5"><text x="31" y="107.9" font-size="2.5" text-anchor="middle" fill="#000">Р-6</text><text x="38.5" y="107.9" font-size="2.5" fill="#000">Стяжка пола и тёплый пол (стадия 7)</text><text x="130.5" y="107.9" font-size="2.5" fill="#000">Р-5</text><text x="170.5" y="107.9" font-size="2.5" fill="#000">до начала: штукатурка сделана; трубы под стяжкой приняты; нивелировка плиты выполнена</text><text x="298.5" y="107.9" font-size="2.5" fill="#000"></text></g><line x1="25" y1="112.2" x2="410" y2="112.2" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-7" data-key="wp" data-after="Р-6"><text x="31" y="115.9" font-size="2.5" text-anchor="middle" fill="#000">Р-7</text><text x="38.5" y="115.9" font-size="2.5" fill="#000">Гидроизоляция санузлов и тест проливом (стадия 8)</text><text x="130.5" y="115.9" font-size="2.5" fill="#000">Р-6</text><text x="170.5" y="115.9" font-size="2.5" fill="#000">до начала: стяжка набрала прочность и сухая по инструкции гидроизоляции; выводы стоят на</text><text x="170.5" y="119.3" font-size="2.5" fill="#000">проектных отметках</text><text x="298.5" y="115.9" font-size="2.5" fill="#000"></text></g><line x1="25" y1="122.4" x2="410" y2="122.4" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-8" data-key="gkl" data-after="Р-3 Р-4"><text x="31" y="126.1" font-size="2.5" text-anchor="middle" fill="#000">Р-8</text><text x="38.5" y="126.1" font-size="2.5" fill="#000">ГКЛ: короба инсталляции и стояков, ниши, потолки (стадия 9)</text><text x="130.5" y="126.1" font-size="2.5" fill="#000">Р-3, Р-4</text><text x="170.5" y="126.1" font-size="2.5" fill="#000">до начала: черновые сети в зоне коробов приняты; закладные под тяжёлое и карнизы стоят;</text><text x="170.5" y="129.5" font-size="2.5" fill="#000">светильники выбраны (вырезы)</text><text x="298.5" y="126.1" font-size="2.5" fill="#000"></text></g></g></g><g data-el="assumed-notes" data-flags="" data-ids="К-4 К-5 К-6" data-level="0"><text x="25.5" y="275.5" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="278.9" font-size="2.5" fill="#000">Основа листа: размеры сняты с плана заказчика, контрольный обмер не выполнен (К-5); высота потолка 2700 мм принята: на плане заказчика не указана (К-5); подрайон климата не</text><text x="25.5" y="282.3" font-size="2.5" fill="#000">задан — принят не северный (жилые от 2,5 м) (К-4); толщины стен приняты: наружные 250 мм, перегородки 120 мм — не обмерены (К-5); разрешённая мощность 15 кВт принята по</text><text x="25.5" y="285.7" font-size="2.5" fill="#000">типовой квартире, технических условий нет (К-6).</text><text x="25.5" y="289.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, запись К-4; лист 7, записи К-5, К-6).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">11.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.8" font-size="2.5" data-fit="18" fill="#000">Утв.</text><text x="355" y="244.3" font-size="5" text-anchor="middle" font-weight="700" data-fit="116" fill="#000">ГД-2026-006-АИ</text><line x1="295" y1="247" x2="415" y2="247" stroke="#000" stroke-width="0.7"/><text x="297" y="253.6" font-size="3.5" data-fit="116" fill="#000">Квартира 58 м²</text><text x="297" y="259.2" font-size="2.5" data-fit="116" fill="#000">Общая площадь 55,23* м² · * размеры приняты, не замерены (реестр — л. 6, 7, К-5)</text><line x1="295" y1="262" x2="415" y2="262" stroke="#000" stroke-width="0.7"/><text x="297" y="270.6" font-size="2.5" data-fit="66" fill="#000">Дизайн-проект интерьера</text><line x1="365" y1="262" x2="365" y2="292" stroke="#000" stroke-width="0.7"/><line x1="365" y1="267" x2="415" y2="267" stroke="#000" stroke-width="0.25"/><line x1="380" y1="262" x2="380" y2="277" stroke="#000" stroke-width="0.5"/><line x1="395" y1="262" x2="395" y2="277" stroke="#000" stroke-width="0.5"/><text x="372.5" y="265.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Стадия</text><text x="387.5" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="405" y="265.8" font-size="2.5" text-anchor="middle" fill="#000">Листов</text><text x="372.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">РП</text><text x="387.5" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">12</text><text x="405" y="273.8" font-size="3.5" text-anchor="middle" fill="#000">102</text><line x1="295" y1="277" x2="415" y2="277" stroke="#000" stroke-width="0.7"/><text x="330" y="285" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="66" fill="#000">График закупок и работ. Лист 2 из 3</text><text x="330" y="290.2" font-size="2.5" text-anchor="middle" fill="#000">М б/м</text><text x="390" y="285.8" font-size="2.5" text-anchor="middle" font-weight="700" data-fit="47" fill="#000">Кырлан Александр Сергеевич</text></g><g data-el="release-mark" data-release="preliminary" data-open="10" data-positions="20" data-basis="5"><rect x="314.2" y="6.2" width="99.3" height="4.8" fill="#fff" stroke="#000" stroke-width="0.5"/><text x="316.2" y="9.6" font-size="2.5" font-weight="700" fill="#000">ПРЕДВАРИТЕЛЬНО · не для производства работ · открыто пунктов: 10 (реестр — л. 6, 7)</text></g></svg>
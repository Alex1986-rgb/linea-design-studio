<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-title="Открытые вопросы, принятые допущения и конфликты. Лист 3 из 3" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><g data-el="sheet-title"><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">Открытые вопросы, принятые допущения и конфликты. Лист 3 из 3</text></g><text x="25" y="17.8" font-size="2.5" fill="#333">Сводка по реестрам координации</text><g data-el="open-issues" data-plan="fixed" data-plan-declared="3"><g data-el="issues-changes"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Изменения проекта после выпуска листов (реестр изменений) (продолжение)</text><rect x="25" y="33" width="385" height="122.2" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="32" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="39" y1="33" x2="39" y2="155.2" stroke="#000" stroke-width="0.25"/><text x="50" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><line x1="61" y1="33" x2="61" y2="155.2" stroke="#000" stroke-width="0.25"/><text x="91" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><line x1="121" y1="33" x2="121" y2="155.2" stroke="#000" stroke-width="0.25"/><text x="171" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Было</text><line x1="221" y1="33" x2="221" y2="155.2" stroke="#000" stroke-width="0.25"/><text x="283.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Стало</text><line x1="346" y1="33" x2="346" y2="155.2" stroke="#000" stroke-width="0.25"/><text x="378" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Кто решил, подпись</text><g data-el="issue-row" data-kind="change" data-id="ИЗ-5"><text x="32" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-5</text><text x="40.5" y="46.7" font-size="2.5" fill="#000">12.11.2026</text><text x="62.5" y="46.7" font-size="2.5" fill="#000">л. 62 — План текстиля и декора</text><text x="62.5" y="50.1" font-size="2.5" fill="#000">л. 64 — Ведомость текстиля</text><text x="62.5" y="53.5" font-size="2.5" fill="#000">л. 65 — Ведомость декора. Схемы развески</text><text x="122.5" y="46.7" font-size="2.5" fill="#000">Разбор двух критиков по кадрам: мокрые зоны — «стерильный шоурум»: в</text><text x="122.5" y="50.1" font-size="2.5" fill="#000">ванной на полотенцесушителе П5 нет полотенец, у ванны нет коврика, в</text><text x="122.5" y="53.5" font-size="2.5" fill="#000">санузле на полке короба инсталляции пусто (ИЗ-4 задал там только зеркало и</text><text x="122.5" y="56.9" font-size="2.5" fill="#000">постер).</text><text x="222.5" y="46.7" font-size="2.5" fill="#000">Ванная: банные полотенца пыльного синего и ручные молочные на полотенцесушителе П5 (Т12,</text><text x="222.5" y="50.1" font-size="2.5" fill="#000">Т13), коврик 800×450 у бортика ванны (Т14; вне полотна двери Д-4). Санузел: ваза с сухой веткой и</text><text x="222.5" y="53.5" font-size="2.5" fill="#000">свеча с диффузором на полке короба инсталляции П20 (ДК12, ДК13). Смеситель ванны П1 в</text><text x="222.5" y="56.9" font-size="2.5" fill="#000">данных задан («смеситель настенный») — правка не нужна. Прихожая не дополнялась: стены</text><text x="222.5" y="60.3" font-size="2.5" fill="#000">заняты дверями, щитами и домофоном, пол — в зонах открывания пяти дверей (см. ИЗ-4). Знак</text><text x="222.5" y="63.7" font-size="2.5" fill="#000">«**» у позиций до подписи автора.</text><text x="347.5" y="46.7" font-size="2.5" fill="#000">Не утверждено: подписи нет. решение</text><text x="347.5" y="50.1" font-size="2.5" fill="#000">исполнителя; предложение проектировщика, на</text><text x="347.5" y="53.5" font-size="2.5" fill="#000">утверждение А. С. Кырлана</text></g><line x1="25" y1="66.8" x2="410" y2="66.8" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-6"><text x="32" y="70.5" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-6</text><text x="40.5" y="70.5" font-size="2.5" fill="#000">16.11.2026</text><text x="62.5" y="70.5" font-size="2.5" fill="#000">л. 62 — План текстиля и декора</text><text x="62.5" y="73.9" font-size="2.5" fill="#000">л. 64 — Ведомость текстиля</text><text x="62.5" y="77.3" font-size="2.5" fill="#000">л. 65 — Ведомость декора. Схемы развески</text><text x="62.5" y="80.7" font-size="2.5" fill="#000">л. 76 — Ведомости изделий, техники и</text><text x="62.5" y="84.1" font-size="2.5" fill="#000">фурнитуры</text><text x="122.5" y="70.5" font-size="2.5" fill="#000">Приёмка кадров 15.11.2026: у кровати в спальне не было стены-события, а</text><text x="122.5" y="73.9" font-size="2.5" fill="#000">картина над ней читалась как акварель, а не как чёрно-белая фотография; на</text><text x="122.5" y="77.3" font-size="2.5" fill="#000">кадрах кровать то с мягким, то с дубовым изголовьем, в углу — растение в</text><text x="122.5" y="80.7" font-size="2.5" fill="#000">кашпо, лишнее для трёх-пяти предметов в кадре. В санузле не было ни дуба,</text><text x="122.5" y="84.1" font-size="2.5" fill="#000">ни пыльно-синего: из трёх идей концепции читалась одна, а постер с маяком</text><text x="122.5" y="87.5" font-size="2.5" fill="#000">— готовая иллюстрация.</text><text x="222.5" y="70.5" font-size="2.5" fill="#000">Спальня: за изголовьем — рейки из шпона дуба натурального 30×20 мм с шагом 60 мм (ДС1), поле</text><text x="222.5" y="73.9" font-size="2.5" fill="#000">1700 мм между тумбами С2 и С3, от пола до 2450 мм; кровать С1 — на основании из дуба, спинка</text><text x="222.5" y="77.3" font-size="2.5" fill="#000">— мягкая панель из льна перед рейками; ДК5 над кроватью — чёрно-белая фотография ряда</text><text x="222.5" y="80.7" font-size="2.5" fill="#000">берёзовых стволов в тумане, дубовая рама 1100 × 700; замиокулькас ДК7 снят; на тумбе С2</text><text x="222.5" y="84.1" font-size="2.5" fill="#000">керамическая чаша-скульптура (ДК15). Санузел: ДК9 — графика тушью (три тонкие линии) в</text><text x="222.5" y="87.5" font-size="2.5" fill="#000">дубовой раме 300 × 400 вместо постера с маяком; новое зеркало в рост ДК14 в дубовой раме 450 ×</text><text x="222.5" y="90.9" font-size="2.5" fill="#000">1600 на стене С; коврик у унитаза 600 × 400 мм из хлопка, пыльный синий (Т15); ваза на полке</text><text x="222.5" y="94.3" font-size="2.5" fill="#000">короба (ДК12) — пыльный синий вместо шалфея. Размеры комнат, мебель, приборы, розетки и</text><text x="222.5" y="97.7" font-size="2.5" fill="#000">отметки не менялись.</text><text x="347.5" y="70.5" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 16.11.2026.</text><text x="347.5" y="73.9" font-size="2.5" fill="#000">Предложил: исполнитель; предложение</text><text x="347.5" y="77.3" font-size="2.5" fill="#000">проектировщика, утверждено А. С. Кырланом</text><text x="347.5" y="80.7" font-size="2.5" fill="#000">16.11.2026 («все на твое усмотрение и доделай</text><text x="347.5" y="84.1" font-size="2.5" fill="#000">все проекты»).</text></g><line x1="25" y1="100.8" x2="410" y2="100.8" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-7"><text x="32" y="104.5" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-7</text><text x="40.5" y="104.5" font-size="2.5" fill="#000">16.11.2026</text><text x="62.5" y="104.5" font-size="2.5" fill="#000">л. 62 — План текстиля и декора</text><text x="62.5" y="107.9" font-size="2.5" fill="#000">л. 64 — Ведомость текстиля</text><text x="62.5" y="111.3" font-size="2.5" fill="#000">л. 65 — Ведомость декора. Схемы развески</text><text x="122.5" y="104.5" font-size="2.5" fill="#000">Второй круг приёмки кадров: в санузле площадью около 1,5 м² коврик у</text><text x="122.5" y="107.9" font-size="2.5" fill="#000">унитаза занимал единственный свободный участок пола и мешал проходу;</text><text x="122.5" y="111.3" font-size="2.5" fill="#000">графика ДК9 по ИЗ-6 висела центром на 1250 мм, ниже нормы 1450–1600 мм; в</text><text x="122.5" y="114.7" font-size="2.5" fill="#000">концепции проекта для санузла было записано «дуба и синего текстиля в</text><text x="122.5" y="118.1" font-size="2.5" fill="#000">помещении нет», а решение ИЗ-6 вводило дуб и синий.</text><text x="222.5" y="104.5" font-size="2.5" fill="#000">Санузел: коврик Т15 убран — пол свободен. Графика ДК9 снова центром на 1450 мм. Идея санузла</text><text x="222.5" y="107.9" font-size="2.5" fill="#000">в концепции приведена к решению: дуб — тонкие рамы графики и зеркала в рост, пыльный синий</text><text x="222.5" y="111.3" font-size="2.5" fill="#000">— один акцент (ваза-бутыль на полке короба инсталляции), без текстиля; светлая плитка, белая</text><text x="222.5" y="114.7" font-size="2.5" fill="#000">сантехника и хром без изменений. Размеры, приборы, розетки и отметки не менялись.</text><text x="347.5" y="104.5" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 16.11.2026.</text><text x="347.5" y="107.9" font-size="2.5" fill="#000">Предложил: исполнитель; предложение</text><text x="347.5" y="111.3" font-size="2.5" fill="#000">проектировщика, утверждено А. С. Кырланом</text><text x="347.5" y="114.7" font-size="2.5" fill="#000">16.11.2026 («все на твое усмотрение и доделай</text><text x="347.5" y="118.1" font-size="2.5" fill="#000">все проекты»).</text></g><line x1="25" y1="121.2" x2="410" y2="121.2" stroke="#000" stroke-width="0.25"/><g data-el="issue-row" data-kind="change" data-id="ИЗ-8"><text x="32" y="124.9" font-size="2.5" text-anchor="middle" fill="#000">ИЗ-8</text><text x="40.5" y="124.9" font-size="2.5" fill="#000">16.11.2026</text><text x="62.5" y="124.9" font-size="2.5" fill="#000">л. 57 — Ведомость отделки помещений</text><text x="62.5" y="128.3" font-size="2.5" fill="#000">л. 62 — План текстиля и декора</text><text x="62.5" y="131.7" font-size="2.5" fill="#000">л. 64 — Ведомость текстиля</text><text x="62.5" y="135.1" font-size="2.5" fill="#000">л. 76 — Ведомости изделий, техники и</text><text x="62.5" y="138.5" font-size="2.5" fill="#000">фурнитуры</text><text x="122.5" y="124.9" font-size="2.5" fill="#000">Третий круг приёмки кадров: на кровати две подушки одного акцентного цвета</text><text x="122.5" y="128.3" font-size="2.5" fill="#000">(шалфей) и одна синяя — два акцента вместо правила «две в тон и одна</text><text x="122.5" y="131.7" font-size="2.5" fill="#000">акцентная»; идея «без ручек и наличников» в спальне не читалась — шкафа</text><text x="122.5" y="135.1" font-size="2.5" fill="#000">не было, скрытая дверь вне кадра; в санузле дуб и синий читались слабо</text><text x="122.5" y="138.5" font-size="2.5" fill="#000">бежевая плитка, серая ваза и две вещи на полке.</text><text x="222.5" y="124.9" font-size="2.5" fill="#000">Спальня: две декоративные подушки Т9 — лён цвета Skimming Stone, в тон белья и спинки; третья,</text><text x="222.5" y="128.3" font-size="2.5" fill="#000">валик Т10, — пыльно-синяя; отдельных спальных подушек на кровати нет. У стены С</text><text x="222.5" y="131.7" font-size="2.5" fill="#000">шкаф-пенал С4 900×340, высота 2300, два фасада без ручек (нажми-открой), шпон дуба</text><text x="222.5" y="135.1" font-size="2.5" fill="#000">натурального; расстояние до кровати 700 мм; крепление к стене от опрокидывания; розетка у стены</text><text x="222.5" y="138.5" font-size="2.5" fill="#000">С (комод, зарядка) и розетка LAN2 перенесены с отметок 2400 и 2800 мм на 3250 и 3400 мм (на</text><text x="222.5" y="141.9" font-size="2.5" fill="#000">уровне 300 мм, вне габарита пенала). Санузел: стена за инсталляцией (стена Г) облицована</text><text x="222.5" y="145.3" font-size="2.5" fill="#000">крупноформатным керамогранитом 1200×2400 пыльно-синего цвета S 4010-R90B (вместо плитки</text><text x="222.5" y="148.7" font-size="2.5" fill="#000">600 × 1200 под камень); на полке короба остаётся одна ваза (светлый камень), свеча и диффузор</text><text x="222.5" y="152.1" font-size="2.5" fill="#000">сняты. Размеры помещений, приборы, розетки и отметки не менялись.</text><text x="347.5" y="124.9" font-size="2.5" fill="#000">Утверждено: Кырлан А.С., 16.11.2026.</text><text x="347.5" y="128.3" font-size="2.5" fill="#000">Предложил: исполнитель; предложение</text><text x="347.5" y="131.7" font-size="2.5" fill="#000">проектировщика, утверждено А. С. Кырланом</text><text x="347.5" y="135.1" font-size="2.5" fill="#000">16.11.2026 («все на твое усмотрение и доделай</text><text x="347.5" y="138.5" font-size="2.5" fill="#000">все проекты»).</text></g></g><g data-el="notes"><text x="25" y="167.6" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="172.4" font-size="2.5" fill="#000">1. Номера листов — по ведомости рабочих чертежей комплекта (лист «Общие данные»).</text><text x="25" y="175.8" font-size="2.5" fill="#000">2. Графа «Если решения нет» показывает состояние решения на листах; влияние на сроки и стоимость по пунктам не оценивалось.</text><text x="25" y="179.2" font-size="2.5" fill="#000">3. Пункт, по которому принято решение, при следующем выпуске комплекта из таблиц исключается.</text></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" data-fit="14" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" data-fit="9" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" data-fit="18" fill="#000">Разраб.</text><text x="251" y="265.8" font-size="2.5" data-fit="18" fill="#000">Кырлан А.С.</text><text x="290" y="265.8" font-size="2.5" text-anchor="middle" textLength="7.98" lengthAdjust="spacingAndGlyphs" data-fit="8.6" fill="#000">16.11.26</text><text x="231" y="270.8" font-size="2.5" data-fit="18" fill="#000">Пров.</text><text x="231" y="275.8" font-size="2.5" data-fit="18" fill="#000">ГИП</text><text x="231" y="285.8" font-size="2.5" data-fit="18" fill="#000">Н. контр.</text><text x="231" y="290.
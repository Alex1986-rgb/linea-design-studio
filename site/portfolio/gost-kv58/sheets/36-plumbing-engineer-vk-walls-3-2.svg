a-fit="111.11" fill="#000"></text></g><g data-el="legend"><text x="320" y="192.75" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><circle cx="324" cy="198.75" r="1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/><text x="331" y="199.65" font-size="2.5" fill="#000">вывод В1 (код — в ведомости привязок)</text><circle cx="324" cy="203.75" r="1" fill="#fff" stroke="#c0392b" stroke-width="0.35"/><text x="331" y="204.65" font-size="2.5" fill="#000">вывод Т3 (код — в ведомости привязок)</text><circle cx="324" cy="208.75" r="1" fill="#fff" stroke="#6b4f2a" stroke-width="0.35"/><text x="331" y="209.65" font-size="2.5" fill="#000">вывод К1 (код — в ведомости привязок)</text><rect x="320.5" y="211.75" width="7" height="4" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="331" y="214.65" font-size="2.5" fill="#000">сантехприбор по расстановке (габарит модели)</text><rect x="320.5" y="216.75" width="7" height="4" fill="#fff" stroke="#000" stroke-width="0.25" stroke-dasharray="2 0.8"/><text x="331" y="219.65" font-size="2.5" fill="#000">дверной проём; окно — сплошной контур</text></g><g data-el="notes"><text x="25" y="240" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="245" font-size="2.5" fill="#000">1. Габариты и высоты приборов, межосевые смесителей и места кранов — по паспортам выбранных приборов, сверяются до разметки стен.</text><text x="25" y="248.6" font-size="2.5" fill="#000">2. Высоты Н — от чистого пола помещения, мм; отметка чистого пола и потолка — у левого края вида (от ±0,000 объекта). Привязки — от левого чистового</text><text x="25" y="252.2" font-size="2.5" fill="#000">угла вида (облицовка стен вычтена), как на развёртках стен.</text><text x="25" y="255.8" font-size="2.5" fill="#000">3. Стояки в помещении: Ст К1-1 Ø110, Ст В1-1 Ø32, Ст Т3-1 Ø32 — положение на плане выводов; выводы подключаются к ним по схеме разводки.</text><text x="25" y="259.4" font-size="2.5" fill="#000">4. Ревизионные люки к арматуре и ревизиям в данных не заданы: место и размер не определены (записи реестра нет).</text><text x="25" y="263" font-size="2.5" fill="#000">5. Помещение «Ванная» — 2 листа: стены 1) А, Б, В; 2) Г.</text><text x="25" y="266.6" font-size="2.5" fill="#000">6. Расчёт систем водоснабжения и канализации и подбор оборудования выполняет проектная организация; лист задаёт места и высоты выводов.</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="75" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="75" y1="285.5" x2="75" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="77" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="fixture:П1" data-ids="К-2 К-4 К-5 К-6" data-level="0"><text x="45.5" y="213.7" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="45.5" y="217.1" font-size="2.5" fill="#000">Основа листа: размеры сняты с плана заказчика, контрольный обмер не выполнен (К-5); высота потолка 2700 мм принята: на плане заказчика не указана (К-5); подрайон климата не задан — принят</text><text x="45.5" y="220.5" font-size="2.5" fill="#000">не северный (жилые от 2,5 м) (К-4); толщины стен приняты: наружные 250 мм, перегородки 120 мм — не обмерены (К-5); разрешённая мощность 15 кВт принята по типовой квартире, технических</text><text x="45.5" y="223.9" font-size="2.5" fill="#000">условий нет (К-6).</text><text x="45.5" y="227.3" font-size="2.5" fill="#000">Знак «**» — предложение проектировщика, заказчиком не утверждено (согласовать с заказчиком): К-2: П1 — ванна 1500 вместо 1600 — не заходит в проход перед проёмом Д-4; перед ванной 680</text><text x="45.5" y="230.7" font-size="2.5" fill="#000">мм — глубина помещения.</text><text x="45.5" y="234.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-2, К-4–К-6).</text></g><g data-el="stamp"><rect x="230" y="237" 
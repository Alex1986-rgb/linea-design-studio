0.18"/><text x="26.5" y="156.51" font-size="2.5" text-anchor="start" data-fit="29.95" fill="#000">В1-4</text><text x="59.45" y="156.51" font-size="2.5" text-anchor="start" data-fit="112.79" fill="#000">П3** умывальник</text><text x="175.24" y="156.51" font-size="2.5" text-anchor="start" data-fit="34.68" fill="#000">550</text><text x="212.92" y="156.51" font-size="2.5" text-anchor="start" data-fit="46.16" fill="#000">20</text><text x="262.08" y="156.51" font-size="2.5" text-anchor="start" data-fit="40.42" fill="#000">1,53</text><text x="26.5" y="162.51" font-size="2.5" text-anchor="start" data-fit="29.95" fill="#000">В1-5</text><text x="59.45" y="162.51" font-size="2.5" text-anchor="start" data-fit="112.79" fill="#000">П20 унитаз подвесной</text><text x="175.24" y="162.51" font-size="2.5" text-anchor="start" data-fit="34.68" fill="#000">150</text><text x="212.92" y="162.51" font-size="2.5" text-anchor="start" data-fit="46.16" fill="#000">20</text><text x="262.08" y="162.51" font-size="2.5" text-anchor="start" data-fit="40.42" fill="#000">0,80</text></g><g data-el="legend"><text x="312" y="124.21" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><line x1="312.5" y1="130.21" x2="319.5" y2="130.21" stroke="#1f5fbf" stroke-width="0.5"/><text x="323" y="131.11" font-size="2.5" fill="#000">В1 — водопровод хозяйственно-питьевой (ХВС), PP-R Ø20</text><circle cx="316" cy="135.21" r="1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/><text x="323" y="136.11" font-size="2.5" fill="#000">вывод В1 (код — в ведомости привязок)</text><circle cx="316" cy="140.2124891681028" r="1.8" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="323" y="141.11" font-size="2.5" fill="#000">стояк «Ст К1-N / Ст В1-N» (ГОСТ 21.601), Ø мм</text><circle cx="316" cy="145.2124891681028" r="1.1" fill="#fff" stroke="#1f5fbf" stroke-width="0.35"/><text x="323" y="146.11" font-size="2.5" fill="#000">стояк в плане (на отметке пола); вертикаль — стояк по высоте,</text><text x="323" y="149.41" font-size="2.5" fill="#000">разрыв — перекрытие</text><circle cx="316" cy="153.51" r="0.6" fill="#000"/><text x="323" y="154.41" font-size="2.5" fill="#000">тройник (ответвление к прибору)</text><path d="M 314 157.21 L 318 159.81 L 318 157.21 L 314 159.81 Z" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="323" y="159.41" font-size="2.5" fill="#000">кран шаровой</text></g><g data-el="notes"><text x="25" y="240" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="245" font-size="2.5" fill="#000">1. Схема В1 построена по тем же трассам, что план разводки: положение в плане сохранено, глубина — в масштабе ×0,5. Трассы принципиальные; фактическое</text><text x="25" y="248.6" font-size="2.5" fill="#000">положение фиксируется исполнительной схемой до закрытия.</text><text x="25" y="252.2" font-size="2.5" fill="#000">2. Высоты Н — от чистого пола помещения, мм. Отметка прокладки магистрали В1 (в стяжке, в стене или по полу) в данных не задана: участки показаны на</text><text x="25" y="255.8" font-size="2.5" fill="#000">уровне пола условно (записи реестра нет).</text><text x="25" y="259.4" font-size="2.5" fill="#000">3. Узел ввода В1 (кран, фильтр, счётчик, обратный клапан, кран) — на схеме разводки; состав узла ввода — по согласованию. Кран шаровой — на первом</text><text x="25" y="263" font-size="2.5" fill="#000">участке от стояка.</text><text x="25" y="266.6" font-size="2.5" fill="#000">4. Трубы испытать давлением до закрытия (акт скрытых работ, опрессовка по СП 73.13330.2016).</text><text x="25" y="270.2" font-size="2.5" fill="#000">5. Диаметры, высоты выводов и места кранов — по паспортам выбранных приборов и расчёту проектной организации.</text><text x="25" y="273.8" font-size="2.5" fill="#000">6. Расчёт систем, диаметры магистралей и подбор оборудования выполняет проектная организация.</text></g><g data-el="assume-compact"></g><g data-el="scale-bar"><line x1="25" y1="287" x2="45" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="45" y1="285.5" x2="45" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="47" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="assumed-notes" data-flags="fixture:П6|fixture:П1|fixture:П3" data-ids="К-2 К-4 К-5 К-6 К-7" data-level="3"><text x="25.5" y="282.1" font-size="2.5" fill="#000">Допущения и предложения на листе. Знак «**» предложено (согласовать). См. лист открытых вопросов (листы 6, 7).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000"
="51.15" font-size="2.5" fill="#000">Дизайн-проект интерьера; Квартира 58 м²; автор проекта — Кырлан Александр</text><text x="259.5" y="54.55" font-size="2.5" fill="#000">Сергеевич</text><text x="390" y="52.85" font-size="2.5" text-anchor="middle" fill="#000">1 с.</text></g><line x1="220" y1="56.8" x2="405" y2="56.8" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="62.65" font-size="2.5" fill="#000">Концепция</text><text x="259.5" y="60.95" font-size="2.5" fill="#000">Стиль Скандинавский: концепция интерьера, палитра и материалы (колерная карта</text><text x="259.5" y="64.35" font-size="2.5" fill="#000">лист 57)</text><text x="390" y="62.65" font-size="2.5" text-anchor="middle" fill="#000">л. 23</text></g><line x1="220" y1="66.6" x2="405" y2="66.6" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="74.15" font-size="2.5" fill="#000">Визуализации</text><text x="259.5" y="70.75" font-size="2.5" fill="#000">10 изобр.: Ванная, стена Б; Ванная, стена В; Спальня, стена А; Спальня, стена Б;</text><text x="259.5" y="74.15" font-size="2.5" fill="#000">Прихожая, общий вид; Кухня-гостиная, стена Б; Кухня-гостиная, стена В;</text><text x="259.5" y="77.55" font-size="2.5" fill="#000">Кухня-гостиная, стена Г; Гардеробная, общий вид; Санузел, общий вид</text><text x="390" y="74.15" font-size="2.5" text-anchor="middle" fill="#000">В1–В10</text></g><line x1="220" y1="79.8" x2="405" y2="79.8" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="84.75" font-size="2.5" fill="#000">Рабочие чертежи</text><text x="259.5" y="84.75" font-size="2.5" fill="#000">планы, развёртки, узлы (развёртки и узлы — листы 43–45, 77, 85–88, 90, 93, 94)</text><text x="390" y="84.75" font-size="2.5" text-anchor="middle" fill="#000">л. 1–108</text></g><line x1="220" y1="87.8" x2="405" y2="87.8" stroke="#000" stroke-width="0.25"/><g><text x="221.5" y="95.35" font-size="2.5" fill="#000">Спецификации и ведомости</text><text x="259.5" y="95.35" font-size="2.5" fill="#000">оборудование, изделия, отделка, электроточки</text><text x="390" y="91.95" font-size="2.5" text-anchor="middle" fill="#000">л. 22, 25–27, 31,</text><text x="390" y="95.35" font-size="2.5" text-anchor="middle" fill="#000">46, 56–59, 63, 64,</text><text x="390" y="98.75" font-size="2.5" text-anchor="middle" fill="#000">95–99</text></g></g><g data-deviation="sheets-count-every-sheet"/><g data-deviation="scale-in-stamp"/><g data-deviation="elevation-1:40"/><g data-deviation="dim-font-2.5"/><g data-deviation="room-circle-8"/><g data-el="general-ref"><text x="25" y="290.2" font-size="2.5" textLength="182.47" lengthAdjust="spacingAndGlyphs" data-fit="203" fill="#000">Общие указания — лист 5: ±0,000 — чистый пол; несущие конструкции и сети дома — по отдельному проекту; скрытые работы — по актам. Открытые вопросы и допущения — листы 6, 7.</text><g data-el="open-issues-ref" data-target="6"/></g><g data-el="assumed-notes" data-flags="" data-ids="К-4 К-5 К-6" data-level="0"><text x="25.5" y="271" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="25.5" y="274.4" font-size="2.5" fill="#000">Основа листа: размеры сняты с плана заказчика, контрольный обмер не выполнен (К-5); высота потолка 2700 мм принята: на плане заказчика не указана (К-5); подрайон климата не</text><text x="25.5" y="277.8" font-size="2.5" fill="#000">задан — принят не северный (жилые от 2,5 м) (К-4); толщины стен приняты: наружные 250 мм, перегородки 120 мм — не обмерены (К-5); разрешённая мощность 15 кВт принята по</text><text x="25.5" y="281.2" font-size="2.5" fill="#000">типовой квартире, технических условий нет (К-6).</text><text x="25.5" y="284.6" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-4–К-6).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-wi
text><text x="86.5" y="185.35" font-size="2.5" fill="#000">Визуализация. Интерьер: Санузел (пом. 4), общий вид</text></g></g><g data-el="project-composition"><text x="25" y="200.9" font-size="3.5" font-weight="700" fill="#000">Состав дизайн-проекта</text><rect x="25" y="203.4" width="185" height="65.6" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="218.4" x2="210" y2="218.4" stroke="#000" stroke-width="0.5"/><text x="44" y="211.8" font-size="2.5" text-anchor="middle" fill="#000">Раздел</text><line x1="63" y1="203.4" x2="63" y2="269" stroke="#000" stroke-width="0.25"/><text x="121.5" y="211.8" font-size="2.5" text-anchor="middle" fill="#000">Состав</text><line x1="180" y1="203.4" x2="180" y2="269" stroke="#000" stroke-width="0.25"/><text x="195" y="211.8" font-size="2.5" text-anchor="middle" fill="#000">Листы</text><g><text x="26.5" y="224.25" font-size="2.5" fill="#000">Обложка</text><text x="64.5" y="222.55" font-size="2.5" fill="#000">Дизайн-проект интерьера; Квартира 58 м²; автор проекта — Кырлан Александр</text><text x="64.5" y="225.95" font-size="2.5" fill="#000">Сергеевич</text><text x="195" y="224.25" font-size="2.5" text-anchor="middle" fill="#000">1 с.</text></g><line x1="25" y1="228.2" x2="210" y2="228.2" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="234.05" font-size="2.5" fill="#000">Концепция</text><text x="64.5" y="232.35" font-size="2.5" fill="#000">Стиль Скандинавский: концепция интерьера, палитра и материалы (колерная карта</text><text x="64.5" y="235.75" font-size="2.5" fill="#000">лист 56)</text><text x="195" y="234.05" font-size="2.5" text-anchor="middle" fill="#000">л. 23</text></g><line x1="25" y1="238" x2="210" y2="238" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="245.55" font-size="2.5" fill="#000">Визуализации</text><text x="64.5" y="242.15" font-size="2.5" fill="#000">11 изобр.: Ванная, стена Б; Ванная, стена В; Спальня, стена А; Спальня, стена Б;</text><text x="64.5" y="245.55" font-size="2.5" fill="#000">Прихожая, стена А; Прихожая, стена В; Кухня-гостиная, стена Б; Кухня-гостиная,</text><text x="64.5" y="248.95" font-size="2.5" fill="#000">стена В; Кухня-гостиная, стена Г; Гардеробная, общий вид; Санузел, общий вид</text><text x="195" y="245.55" font-size="2.5" text-anchor="middle" fill="#000">В1–В11</text></g><line x1="25" y1="251.2" x2="210" y2="251.2" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="256.15" font-size="2.5" fill="#000">Рабочие чертежи</text><text x="64.5" y="256.15" font-size="2.5" fill="#000">планы, развёртки, узлы (развёртки и узлы — листы 42–44, 71, 79–83, 87, 88)</text><text x="195" y="256.15" font-size="2.5" text-anchor="middle" fill="#000">л. 1–102</text></g><line x1="25" y1="259.2" x2="210" y2="259.2" stroke="#000" stroke-width="0.25"/><g><text x="26.5" y="265.05" font-size="2.5" fill="#000">Спецификации и ведомости</text><text x="64.5" y="265.05" font-size="2.5" fill="#000">оборудование, изделия, отделка, электроточки</text><text x="195" y="263.35" font-size="2.5" text-anchor="middle" fill="#000">л. 22, 25, 26, 30,</text><text x="195" y="266.75" font-size="2.5" text-anchor="middle" fill="#000">45, 55–58, 89–93</text></g></g><g data-deviation="sheets-count-every-sheet"/><g data-deviation="scale-in-stamp"/><g data-deviation="elevation-1:40"/><g data-deviation="dim-font-2.5"/><g data-deviation="room-circle-8"/><g data-el="general-ref"><text x="25" y="290.2" font-size="2.5" textLength="182.47" lengthAdjust="spacingAndGlyphs" data-fit="203" fill="#000">Общие указания — лист 5: ±0,000 — чистый пол; несущие конструкции и сети дома — по отдельному проекту; скрытые работы — по актам. Открытые вопросы и допущения — листы 6, 7.</text><g data-el="open-issues-ref" data-target="6"/></g><g data-el="assumed-notes" data-flags="" data-ids="К-4 К-5 К-6" data-level="0"><text x="212.5" y="220.5" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="212.5" y="223.9" font-size="2.5" fill="#000">Основа листа: размеры сняты с плана заказчика, контрольный обмер не выполнен (К-5); высота потолка 2700 мм принята: на плане заказчика не</text><text x="212.5" y="227.3" font-size="2.5" fill="#000">указана (К-5); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-4); толщины стен приняты: наружные 250 мм, перегородки 120</text><text x="212.5" y="230.7" font-size="2.5" fill="#000">мм — не обмерены (К-5); разрешённая мощность 15 кВт принята по типовой квартире, технических условий нет (К-6).</text><text x="212.5" y="234.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, запись К-4; лист 7, записи К-5, К-6).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2
00</text></g><g data-el="room-mark"><circle cx="101.5" cy="100.5" r="4" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="101.5" y="101.7" font-size="3.5" text-anchor="middle" font-weight="700" fill="#000">1</text><text x="101.5" y="109.5" font-size="3.5" text-anchor="middle" text-decoration="underline" fill="#000">21,04</text></g><g data-el="room-mark"><circle cx="192.7" cy="100.5" r="4" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="192.7" y="101.7" font-size="3.5" text-anchor="middle" font-weight="700" fill="#000">2</text><text x="192.7" y="109.5" font-size="3.5" text-anchor="middle" text-decoration="underline" fill="#000">13,95</text></g><g data-el="room-mark"><circle cx="68.5" cy="156.2" r="4" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="68.5" y="157.4" font-size="3.5" text-anchor="middle" font-weight="700" fill="#000">3</text><text x="68.5" y="165.2" font-size="3.5" text-anchor="middle" text-decoration="underline" fill="#000">2,95</text></g><g data-el="room-mark"><circle cx="68.5" cy="178.7" r="4" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="68.5" y="179.9" font-size="3.5" text-anchor="middle" font-weight="700" fill="#000">4</text><text x="68.5" y="187.7" font-size="3.5" text-anchor="middle" text-decoration="underline" fill="#000">1,80</text></g><g data-el="room-mark"><circle cx="133.2" cy="166.7" r="4" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="133.2" y="167.9" font-size="3.5" text-anchor="middle" font-weight="700" fill="#000">5</text><text x="133.2" y="175.7" font-size="3.5" text-anchor="middle" text-decoration="underline" fill="#000">9,55</text></g><g data-el="room-mark"><circle cx="202.2" cy="166.7" r="4" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="202.2" y="167.9" font-size="3.5" text-anchor="middle" font-weight="700" fill="#000">6</text><text x="202.2" y="175.7" font-size="3.5" text-anchor="middle" text-decoration="underline" fill="#000">5,94</text></g><g data-el="assumed-slot" data-view="47.5 61.5 50"></g><g data-el="legend"><text x="258" y="27" font-size="3.5" font-weight="700" fill="#000">Условные обозначения</text><rect x="258" y="31" width="8" height="4" fill="#6b6b6b" stroke="#000" stroke-width="0.7"/><text x="269" y="34.3" font-size="2.5" fill="#000">существующие стены — сохраняются;</text><text x="269" y="40.8" font-size="2.5" fill="#000">несущие не определены — считать несущими</text><rect x="258" y="44" width="8" height="4" fill="url(#h-demolish)" stroke="#c00000" stroke-width="0.5" stroke-dasharray="2 1"/><text x="269" y="47.3" font-size="2.5" fill="#000">демонтируемые конструкции — на плане нет</text><rect x="258" y="50.5" width="8" height="4" fill="#c9d8f5" stroke="#1f4fbf" stroke-width="0.5"/><text x="269" y="53.8" font-size="2.5" fill="#000">возводимые перегородки — на плане нет</text><line x1="259" y1="56.5" x2="259" y2="61.5" stroke="#000" stroke-width="0.25"/><line x1="265" y1="56.5" x2="265" y2="61.5" stroke="#000" stroke-width="0.25"/><text x="269" y="60.3" font-size="2.5" fill="#000">проём существующий, без заполнения (откосы)</text><circle cx="262" cy="65.5" r="2.6" fill="#fff" stroke="#000" stroke-width="0.35"/><text x="262" y="66.4" font-size="2.5" text-anchor="middle" fill="#000">1</text><text x="269" y="66.8" font-size="2.5" fill="#000">номер помещения, площадь м²</text></g><g data-el="notes"><text x="28" y="213" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="28" y="218" font-size="2.5" fill="#000">1. Перепланировка не выполняется: несущие и ненесущие стены, перегородки и плиты перекрытия не</text><text x="28" y="221.6" font-size="2.5" fill="#000">демонтируются, новые стены не возводятся; существующие стены и перегородки сохраняются.</text><text x="28" y="225.2" font-size="2.5" fill="#000">2. Дверные блоки — по плану дверей (лист 12); существующие проёмы не расширяются.</text><text x="28" y="228.8" font-size="2.5" fill="#000">3. Демонтаж существующих покрытий пола, стен и потолка, дверных блоков и сантехприборов (если есть)</text><text x="28" y="232.4" font-size="2.5" fill="#000">— до основания; объёмы демонтажа — для справки, по факту на объекте.</text><text x="28" y="236" font-size="2.5" fill="#000">4. За отметку ±0,000 принят чистый пол, не существующий (блок отметок). Размеры — в мм по чистовой</text><text x="28" y="239.6" font-size="2.5" fill="#000">поверхности стен до отделки.</text><text x="28" y="243.2" font-size="2.5" fill="#000">5. Размеры проверить на месте до начала работ: расхождение с обмером — не более 2 % (иначе — к</text><text x="28" y="246.8" font-size="2.5" fill="#000">архитектору).</text><text x="28" y="250.4" font-size="2.5" fill="#000">6. Несущие стены не определены: до технического заключения все стены считать несущими — проёмы, ниши</text><text x="28" y="254" font-size="2.5" fill="#000">и штробы в них не выполнять.</text></g><g data-el="levels"><text x="281" y="80" font-size="3.5" font-weight="700" fill="#000">Отметки по высоте</text><defs><pattern id="lv-slab" patternUnits="userSpaceOnUse" width="2" height="2"><line x1="0" y1="2" x2="2" y2="0" stroke="#000" stroke-width="0.18"/></pattern><pattern id="lv-scr" patternUnits="userSpaceOnUse" width="2.2" height="2.2"><circle cx="0.6" cy="0.6" r="0.16" fill="#000"/><circle cx="1.7" cy="1.5" r="0.16" fill="#000"/></pattern></defs><rect x="259.5" y="101" width="16.5" height="5" fill="url(#lv-slab)" stroke="#000" stroke-width="0.35"/><rect x="268" y="94" width="8" height="7" fill="url(#lv-scr)" stroke="#000" stroke-width="0.25"/><rect x="268" y="91" width="8" height="3" fill="#d9d9d9" stroke="#000" stroke-width="0.25"/><rect x="259.5" y="94.5" width="7" height="6.5" fill="none" stroke="#000" stroke-width="0.25" stroke-dasharray="1.2 0.8"/><text x="263" y="93.5" font-size="2.5" text-anchor="middle" fill="#000">сущ.</text><text x="272" y="108.6" font-size="2.5" text-anchor="middle" fill="#000">проект</text><line x1="276" y1="91" x2="278.5" y2="91" stroke="#000" stroke-width="0.25"/><path d="M 278.5 91 l 1.2 -1.7 h -2.4 z" fill="#000"/><line x1="276" y1="94.4" x2="278.5" y2="94.4" stroke="#000" stroke-width="0.25"/><path d="M 278.5 94.4 l 1.2 -1.7 h -2.4 z" fill="#000"/><line x1="276" y1="101" x2="278.5" y2="101" stroke="#000" stroke-width="0.25"/><path d="M 278.5 101 l 1.2 -1.7 h -2.4 z" fill="#000"/><text x="281" y="85.2" font-size="2.5" font-weight="700" fill="#000">±0,000</text><text x="293.5" y="85.2" font-size="2.5" fill="#000">чистый пол пом. 1, 2, 5, 6; отсчёт высот</text><text x="281" y="88.4" font-size="2.5" font-weight="700" fill="#000">−0,015</text><text x="293.5" y="88.4" font-size="2.5" fill="#000">чистый пол пом. 3, 4, ниже на 15 мм</text><text x="281" y="91.6" font-size="2.5" font-weight="700" fill="#000">−0,064*</text><text x="293.5" y="91.6" font-size="2.5" fill="#000">верх плиты — расчёт, не замер (задание на обмер)</text><text x="281" y="94.8" font-size="2.5" font-weight="700" fill="#000">сущ. пол</text><text x="293.5" y="94.8" font-size="2.5" fill="#000">снимается до плиты; не замерен (задание на обмер)</text></g><g data-el="scale-bar"><line x1="25" y1="287" x2="45" y2="287" stroke="#000" stroke-width="0.5"/><line x1="25" y1="285.5" x2="25" y2="288.5" stroke="#000" stroke-width="0.25"/><line x1="45" y1="285.5" x2="45" y2="288.5" stroke="#000" stroke-width="0.25"/><text x="47" y="288" font-size="2.5" fill="#000">1000 мм · печать 1:1</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272"
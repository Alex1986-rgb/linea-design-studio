><line x1="338.8" y1="91.6" x2="346.8" y2="91.6" stroke="#000" stroke-width="0.25"/><line x1="344.8" y1="140.4" x2="344.8" y2="91.6" stroke="#000" stroke-width="0.25"/><line x1="343.74" y1="141.46" x2="345.86" y2="139.34" stroke="#000" stroke-width="0.5"/><line x1="343.74" y1="92.66" x2="345.86" y2="90.54" stroke="#000" stroke-width="0.5"/><text x="343.8" y="116" font-size="2.5" text-anchor="middle" transform="rotate(-90 343.8 116)" fill="#000">1220</text><line x1="338.8" y1="91.6" x2="346.8" y2="91.6" stroke="#000" stroke-width="0.25"/><line x1="338.8" y1="69.2" x2="346.8" y2="69.2" stroke="#000" stroke-width="0.25"/><line x1="344.8" y1="91.6" x2="344.8" y2="69.2" stroke="#000" stroke-width="0.25"/><line x1="343.74" y1="92.66" x2="345.86" y2="90.54" stroke="#000" stroke-width="0.5"/><line x1="343.74" y1="70.26" x2="345.86" y2="68.14" stroke="#000" stroke-width="0.5"/><text x="343.8" y="80.4" font-size="2.5" text-anchor="middle" transform="rotate(-90 343.8 80.4)" fill="#000">560</text></g></g><g data-el="notes"><text x="25" y="262.4" font-size="3.5" font-weight="700" fill="#000">Примечания</text><text x="25" y="267.4" font-size="2.5" fill="#000">1. Высоты — от чистого пола помещения до низа изделия, «ц» — до центра; привязки — от чистовой грани угла стены, мм.</text><text x="25" y="271" font-size="2.5" fill="#000">2. Над мебелью низ изделия — на 150–250 мм выше спинки или изголовья; без мебели центр — на 1450–1600 мм от пола.</text><text x="25" y="274.6" font-size="2.5" fill="#000">3. Изделия до 5 кг — на два подвеса по основанию; тяжелее — на анкеры с нагрузкой не меньше двойной массы; на ГКЛ — только по закладной или анкеру для</text><text x="25" y="278.2" font-size="2.5" fill="#000">пустотелых оснований.</text><text x="25" y="281.8" font-size="2.5" fill="#000">4. Зеркала в рост — с креплением от опрокидывания; в санузлах — влагостойкие, на клей для зеркал и нейтральный силикон.</text><text x="25" y="285.4" font-size="2.5" fill="#000">5. Места изделий — план текстиля и декора (лист 61). Ведомость декора: размер, масса, крепёж и основание — лист 64.</text></g><g data-el="legend"><rect x="298" y="22" width="8" height="4" fill="#E9DDCB" stroke="#5E4630" stroke-width="0.35"/><text x="308" y="24.9" font-size="2.5" fill="#000">картина</text><rect x="332" y="22" width="8" height="4" fill="#D3E1E7" stroke="#4F6D7A" stroke-width="0.35"/><text x="342" y="24.9" font-size="2.5" fill="#000">зеркало</text><rect x="366" y="22" width="8" height="4" fill="#fff" stroke="#6b6b6b" stroke-width="0.25"/><text x="376" y="24.9" font-size="2.5" fill="#000">мебель под изделием</text></g><g data-el="assumed-notes" data-flags="decor:ДК9|decor:ДК10|decor:ДК11" data-ids="ИЗ-4 К-4 К-5 К-6" data-level="0"><text x="45.5" y="240.1" font-size="2.5" font-weight="700" fill="#000">Допущения и предложения на листе</text><text x="45.5" y="243.5" font-size="2.5" fill="#000">Основа листа: размеры сняты с плана заказчика, контрольный обмер не выполнен (К-5); высота потолка 2700 мм принята: на плане заказчика не</text><text x="45.5" y="246.9" font-size="2.5" fill="#000">указана (К-5); подрайон климата не задан — принят не северный (жилые от 2,5 м) (К-4); толщины стен приняты: наружные 250 мм, перегородки 120</text><text x="45.5" y="250.3" font-size="2.5" fill="#000">мм — не обмерены (К-5); разрешённая мощность 15 кВт принята по типовой квартире, технических условий нет (К-6).</text><text x="45.5" y="253.7" font-size="2.5" fill="#000">Знак «**» — предложение проектировщика, заказчиком не утверждено (согласовать с заказчиком): ИЗ-4: ДК9, ДК10, ДК11.</text><text x="45.5" y="257.1" font-size="2.5" fill="#000">См. лист открытых вопросов (лист 6, записи К-4–К-6; лист 7, запись ИЗ-4).</text></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="2
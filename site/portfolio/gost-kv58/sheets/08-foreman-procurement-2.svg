<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" font-family="'GOST type A','ISOCPEUR','Arial Narrow',Arial,sans-serif" data-sheet="schedule" data-scale="б/м"><rect width="420" height="297" fill="#fff"/><rect x="20" y="5" width="395" height="287" fill="none" stroke="#000" stroke-width="0.7"/><text x="25" y="13.2" font-size="7" font-weight="700" fill="#000">График закупок и работ. Лист 2 из 3</text><text x="25" y="17.8" font-size="2.5" fill="#333">Что заказывать и когда не раньше чего: относительный порядок без дат; срок поставки — из данных или «уточняется у поставщика»</text><g data-el="proc-schedule" data-plan="fixed" data-plan-declared="3"><g data-el="proc-work"><text x="25" y="30.4" font-size="3.5" font-weight="700" fill="#000">Работы: порядок и что не даёт начать</text><rect x="25" y="33" width="385" height="181.4" fill="none" stroke="#000" stroke-width="0.5"/><line x1="25" y1="43" x2="410" y2="43" stroke="#000" stroke-width="0.5"/><text x="31" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">№</text><line x1="37" y1="33" x2="37" y2="214.4" stroke="#000" stroke-width="0.25"/><text x="83" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Работа (стадия технологической последовательности)</text><line x1="129" y1="33" x2="129" y2="214.4" stroke="#000" stroke-width="0.25"/><text x="149" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">После</text><line x1="169" y1="33" x2="169" y2="214.4" stroke="#000" stroke-width="0.25"/><text x="233" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Что должно быть к началу: условия и закупки</text><line x1="297" y1="33" x2="297" y2="214.4" stroke="#000" stroke-width="0.25"/><text x="353.5" y="38.9" font-size="2.5" text-anchor="middle" fill="#000">Не начинать, пока открыто в реестре</text><g data-el="work-row" data-id="Р-1" data-key="dem" data-after=""><text x="31" y="46.7" font-size="2.5" text-anchor="middle" fill="#000">Р-1</text><text x="38.5" y="46.7" font-size="2.5" fill="#000">Демонтаж покрытий, отделки стен и потолков, дверных блоков и</text><text x="38.5" y="50.1" font-size="2.5" fill="#000">приборов; конструкции, стены и перегородки не трогать до технического</text><text x="38.5" y="53.5" font-size="2.5" fill="#000">заключения (стадия 1)</text><text x="130.5" y="46.7" font-size="2.5" fill="#000"></text><text x="170.5" y="46.7" font-size="2.5" fill="#000">до начала: запрошены документы на дом и БТИ; контрольный обмер до демонтажа (что видно)</text><text x="170.5" y="50.1" font-size="2.5" fill="#000">сделан</text><text x="298.5" y="46.7" font-size="2.5" fill="#000"></text></g><line x1="25" y1="56.6" x2="410" y2="56.6" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-2" data-key="obmer" data-after="Р-1"><text x="31" y="60.3" font-size="2.5" text-anchor="middle" fill="#000">Р-2</text><text x="38.5" y="60.3" font-size="2.5" fill="#000">Контрольный обмер на голых стенах и обследование (задание — лист</text><text x="38.5" y="63.7" font-size="2.5" fill="#000">«Задание на контрольный обмер») (стадия 2)</text><text x="130.5" y="60.3" font-size="2.5" fill="#000">Р-1</text><text x="170.5" y="60.3" font-size="2.5" fill="#000">после снятия отделки: видны стояки, каналы, щиток, толщины стен; до заказа всего, что делают по</text><text x="170.5" y="63.7" font-size="2.5" fill="#000">размеру</text><text x="298.5" y="60.3" font-size="2.5" fill="#000"></text></g><line x1="25" y1="66.8" x2="410" y2="66.8" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-3" data-key="el" data-after="Р-2"><text x="31" y="70.5" font-size="2.5" text-anchor="middle" fill="#000">Р-3</text><text x="38.5" y="70.5" font-size="2.5" fill="#000">Черновая электрика: штробы, короба, гофра, подрозетники, щит (стадия</text><text x="38.5" y="73.9" font-size="2.5" fill="#000">4)</text><text x="130.5" y="70.5" font-size="2.5" fill="#000">Р-2</text><text x="170.5" y="70.5" font-size="2.5" fill="#000">до начала: план электрики с высотами утверждён; штробы в стенах — только после технического</text><text x="170.5" y="73.9" font-size="2.5" fill="#000">заключения; мебель расставлена</text><text x="298.5" y="70.5" font-size="2.5" fill="#000"></text></g><line x1="25" y1="77" x2="410" y2="77" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-4" data-key="vk" data-after="Р-2"><text x="31" y="80.7" font-size="2.5" text-anchor="middle" fill="#000">Р-4</text><text x="38.5" y="80.7" font-size="2.5" fill="#000">Черновая сантехника и вентиляция: разводка, выводы, инсталляции,</text><text x="38.5" y="84.1" font-size="2.5" fill="#000">короба стояков (стадия 5)</text><text x="130.5" y="80.7" font-size="2.5" fill="#000">Р-2</text><text x="170.5" y="80.7" font-size="2.5" fill="#000">до начала: положение стояков замерено; модели инсталляций и машины выбраны (габариты рамы,</text><text x="170.5" y="84.1" font-size="2.5" fill="#000">подводка); инсталляцию ставят до обшивки ГКЛВ и до гидроизоляции</text><text x="170.5" y="87.5" font-size="2.5" fill="#000">Закупки к началу: З-4 (сантехника)</text><text x="298.5" y="80.7" font-size="2.5" fill="#000"></text></g><line x1="25" y1="90.6" x2="410" y2="90.6" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-5" data-key="plaster" data-after="Р-2 Р-3 Р-4"><text x="31" y="94.3" font-size="2.5" text-anchor="middle" fill="#000">Р-5</text><text x="38.5" y="94.3" font-size="2.5" fill="#000">Коробки скрытых дверей, затем штукатурка стен и откосов (стадия 6)</text><text x="130.5" y="94.3" font-size="2.5" fill="#000">Р-2, Р-3, Р-4</text><text x="170.5" y="94.3" font-size="2.5" fill="#000">до начала: электрика и сантехника смонтированы, штробы заделаны; коробки скрытых дверей</text><text x="170.5" y="97.7" font-size="2.5" fill="#000">установлены до штукатурки (поэтому заказ дверей — раньше работы)</text><text x="170.5" y="101.1" font-size="2.5" fill="#000">Закупки к началу: З-1 (двери скрытого монтажа)</text><text x="298.5" y="94.3" font-size="2.5" fill="#000"></text></g><line x1="25" y1="104.2" x2="410" y2="104.2" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-6" data-key="screed" data-after="Р-5"><text x="31" y="107.9" font-size="2.5" text-anchor="middle" fill="#000">Р-6</text><text x="38.5" y="107.9" font-size="2.5" fill="#000">Стяжка пола и тёплый пол (стадия 7)</text><text x="130.5" y="107.9" font-size="2.5" fill="#000">Р-5</text><text x="170.5" y="107.9" font-size="2.5" fill="#000">до начала: штукатурка сделана; трубы под стяжкой приняты; нивелировка плиты выполнена</text><text x="298.5" y="107.9" font-size="2.5" fill="#000"></text></g><line x1="25" y1="112.2" x2="410" y2="112.2" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-7" data-key="wp" data-after="Р-6"><text x="31" y="115.9" font-size="2.5" text-anchor="middle" fill="#000">Р-7</text><text x="38.5" y="115.9" font-size="2.5" fill="#000">Гидроизоляция санузлов и тест проливом (стадия 8)</text><text x="130.5" y="115.9" font-size="2.5" fill="#000">Р-6</text><text x="170.5" y="115.9" font-size="2.5" fill="#000">до начала: стяжка набрала прочность и сухая по инструкции гидроизоляции; выводы стоят на</text><text x="170.5" y="119.3" font-size="2.5" fill="#000">проектных отметках</text><text x="298.5" y="115.9" font-size="2.5" fill="#000"></text></g><line x1="25" y1="122.4" x2="410" y2="122.4" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-8" data-key="gkl" data-after="Р-3 Р-4"><text x="31" y="126.1" font-size="2.5" text-anchor="middle" fill="#000">Р-8</text><text x="38.5" y="126.1" font-size="2.5" fill="#000">ГКЛ: короба инсталляции и стояков, ниши, потолки (стадия 9)</text><text x="130.5" y="126.1" font-size="2.5" fill="#000">Р-3, Р-4</text><text x="170.5" y="126.1" font-size="2.5" fill="#000">до начала: черновые сети в зоне коробов приняты; закладные под тяжёлое и карнизы стоят;</text><text x="170.5" y="129.5" font-size="2.5" fill="#000">светильники выбраны (вырезы)</text><text x="298.5" y="126.1" font-size="2.5" fill="#000"></text></g><line x1="25" y1="132.6" x2="410" y2="132.6" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-9" data-key="tile" data-after="Р-6 Р-7 Р-8"><text x="31" y="136.3" font-size="2.5" text-anchor="middle" fill="#000">Р-9</text><text x="38.5" y="136.3" font-size="2.5" fill="#000">Плитка и керамогранит: стены, затем пол; фартук (стадия 10)</text><text x="130.5" y="136.3" font-size="2.5" fill="#000">Р-6, Р-7, Р-8</text><text x="170.5" y="136.3" font-size="2.5" fill="#000">до начала: гидроизоляция принята; плитка выбрана, калибр партии измерен, раскладка пересчитана и</text><text x="170.5" y="139.7" font-size="2.5" fill="#000">подписана</text><text x="170.5" y="143.1" font-size="2.5" fill="#000">Закупки к началу: З-5 (плитка)</text><text x="298.5" y="136.3" font-size="2.5" fill="#000"></text></g><line x1="25" y1="146.2" x2="410" y2="146.2" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-10" data-key="putty" data-after="Р-5 Р-8 Р-9"><text x="31" y="149.9" font-size="2.5" text-anchor="middle" fill="#000">Р-10</text><text x="38.5" y="149.9" font-size="2.5" fill="#000">Шпаклёвка стен и потолков под окраску (стадия 11)</text><text x="130.5" y="149.9" font-size="2.5" fill="#000">Р-5, Р-8, Р-9</text><text x="170.5" y="149.9" font-size="2.5" fill="#000">до начала: плитка готова (грязные работы закончены); штукатурка и ГКЛ сухие</text><text x="298.5" y="149.9" font-size="2.5" fill="#000"></text></g><line x1="25" y1="154.2" x2="410" y2="154.2" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-11" data-key="paint" data-after="Р-10"><text x="31" y="157.9" font-size="2.5" text-anchor="middle" fill="#000">Р-11</text><text x="38.5" y="157.9" font-size="2.5" fill="#000">Окраска стен, потолков, откосов (стадия 13)</text><text x="130.5" y="157.9" font-size="2.5" fill="#000">Р-10</text><text x="170.5" y="157.9" font-size="2.5" fill="#000">до начала: шпаклёвка отшлифована и огрунтована; выкрасы утверждены, колеровка одной партией</text><text x="298.5" y="157.9" font-size="2.5" fill="#000"></text></g><line x1="25" y1="162.2" x2="410" y2="162.2" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-12" data-key="floor" data-after="Р-9 Р-11"><text x="31" y="165.9" font-size="2.5" text-anchor="middle" fill="#000">Р-12</text><text x="38.5" y="165.9" font-size="2.5" fill="#000">Чистовые полы: инженерная доска (стадия 14)</text><text x="130.5" y="165.9" font-size="2.5" fill="#000">Р-9, Р-11</text><text x="170.5" y="165.9" font-size="2.5" fill="#000">до начала: влажность основания в норме, мокрые работы закончены; доска выбрана и привезена</text><text x="170.5" y="169.3" font-size="2.5" fill="#000">Закупки к началу: З-6 (доска и плинтус)</text><text x="298.5" y="165.9" font-size="2.5" fill="#000"></text></g><line x1="25" y1="172.4" x2="410" y2="172.4" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-13" data-key="doors" data-after="Р-11 Р-12"><text x="31" y="176.1" font-size="2.5" text-anchor="middle" fill="#000">Р-13</text><text x="38.5" y="176.1" font-size="2.5" fill="#000">Полотна межкомнатных дверей, плинтусы, пороги (стадия 15)</text><text x="130.5" y="176.1" font-size="2.5" fill="#000">Р-11, Р-12</text><text x="170.5" y="176.1" font-size="2.5" fill="#000">до начала: чистовой пол уложен; полотна скрытых дверей — после чистовой отделки стен</text><text x="298.5" y="176.1" font-size="2.5" fill="#000"></text></g><line x1="25" y1="180.4" x2="410" y2="180.4" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-14" data-key="finel" data-after="Р-11 Р-13"><text x="31" y="184.1" font-size="2.5" text-anchor="middle" fill="#000">Р-14</text><text x="38.5" y="184.1" font-size="2.5" fill="#000">Чистовая электрика и сантехника: механизмы, светильники, смесители,</text><text x="38.5" y="187.5" font-size="2.5" fill="#000">приборы (стадия 16)</text><text x="130.5" y="184.1" font-size="2.5" fill="#000">Р-11, Р-13</text><text x="170.5" y="184.1" font-size="2.5" fill="#000">до начала: отделка готова; механизмы, светильники и приборы выбраны и привезены</text><text x="298.5" y="184.1" font-size="2.5" fill="#000"></text></g><line x1="25" y1="190.6" x2="410" y2="190.6" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-15" data-key="kitchen" data-after="Р-13 Р-14"><text x="31" y="194.3" font-size="2.5" text-anchor="middle" fill="#000">Р-15</text><text x="38.5" y="194.3" font-size="2.5" fill="#000">Кухня, встроенная и корпусная мебель, бытовая техника (стадия 17)</text><text x="130.5" y="194.3" font-size="2.5" fill="#000">Р-13, Р-14</text><text x="170.5" y="194.3" font-size="2.5" fill="#000">до начала: чистовая сантехника и электрика подведены к местам мебели; замер кухни снят по</text><text x="170.5" y="197.7" font-size="2.5" fill="#000">готовым стенам (после штукатурки или плитки, до чистового пола)</text><text x="170.5" y="201.1" font-size="2.5" fill="#000">Закупки к началу: З-2 (кухонный гарнитур), З-3 (техника кухни), З-7 (мебель по замеру)</text><text x="298.5" y="194.3" font-size="2.5" fill="#000"></text></g><line x1="25" y1="204.2" x2="410" y2="204.2" stroke="#000" stroke-width="0.25"/><g data-el="work-row" data-id="Р-16" data-key="accept" data-after="Р-14 Р-15"><text x="31" y="207.9" font-size="2.5" text-anchor="middle" fill="#000">Р-16</text><text x="38.5" y="207.9" font-size="2.5" fill="#000">Сдача: осмотр по чек-листу, дефектная ведомость, устранение</text><text x="38.5" y="211.3" font-size="2.5" fill="#000">замечаний (стадия 18)</text><text x="130.5" y="207.9" font-size="2.5" fill="#000">Р-14, Р-15</text><text x="170.5" y="207.9" font-size="2.5" fill="#000">до начала: всё смонтировано; акты скрытых работ подписаны</text><text x="298.5" y="207.9" font-size="2.5" fill="#000"></text></g></g></g><g data-el="stamp"><rect x="230" y="237" width="185" height="55" fill="none" stroke="#000" stroke-width="0.7"/><line x1="230" y1="242" x2="295" y2="242" stroke="#000" stroke-width="0.25"/><line x1="230" y1="247" x2="295" y2="247" stroke="#000" stroke-width="0.25"/><line x1="230" y1="252" x2="295" y2="252" stroke="#000" stroke-width="0.25"/><line x1="230" y1="257" x2="295" y2="257" stroke="#000" stroke-width="0.5"/><line x1="230" y1="262" x2="295" y2="262" stroke="#000" stroke-width="0.5"/><line x1="230" y1="267" x2="295" y2="267" stroke="#000" stroke-width="0.25"/><line x1="230" y1="272" x2="295" y2="272" stroke="#000" stroke-width="0.25"/><line x1="230" y1="277" x2="295" y2="277" stroke="#000" stroke-width="0.25"/><line x1="230" y1="282" x2="295" y2="282" stroke="#000" stroke-width="0.25"/><line x1="230" y1="287" x2="295" y2="287" stroke="#000" stroke-width="0.25"/><line x1="240" y1="237" x2="240" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="237" x2="250" y2="262" stroke="#000" stroke-width="0.5"/><line x1="260" y1="237" x2="260" y2="262" stroke="#000" stroke-width="0.5"/><line x1="270" y1="237" x2="270" y2="262" stroke="#000" stroke-width="0.5"/><line x1="285" y1="237" x2="285" y2="262" stroke="#000" stroke-width="0.5"/><line x1="250" y1="262" x2="250" y2="292" stroke="#000" stroke-width="0.5"/><line x1="270" y1="262" x2="270" y2="292" stroke="#000" stroke-width="0.5"/><line x1="285" y1="262" x2="285" y2="292" stroke="#000" stroke-width="0.5"/><line x1="295" y1="237" x2="295" y2="292" stroke="#000" stroke-width="0.7"/><text x="235" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Изм.</text><text x="245" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Кол.уч</text><text x="255" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Лист</text><text x="265" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">№ док.</text><text x="277.5" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Подп.</text><text x="290" y="260.8" font-size="2.5" text-anchor="middle" fill="#000">Дата</text><text x="231" y="265.8" font-size="2.5" fill="#000">Разраб.</text><text x="251" y="265.8" font-size
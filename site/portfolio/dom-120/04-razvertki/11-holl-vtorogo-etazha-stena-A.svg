" x2="446" y2="489.260604521209"/><line x1="431" y1="492.260604521209" x2="435" y2="486.260604521209"/><line x1="442" y1="492.260604521209" x2="446" y2="486.260604521209"/></g><text x="456" y="496.260604521209" font-size="8.00" fill="#57514A">размерная цепочка, засечки 45° (ГОСТ</text><text x="456" y="507.2978337385246" font-size="8.00" fill="#57514A">2.307)</text></g><text x="90" y="50" font-size="14.22" font-weight="700" fill="#2E2A26">Развертка · Холл второго этажа · стена A</text><text x="90" y="66" font-size="9.78" fill="#7A756D">Вид изнутри помещения · отметки от чистого пола · М 1:40</text><g data-el="notes"></g><text x="90" y="488" font-size="8.45" font-weight="700" fill="#2E2A26">Примечания:</text><text x="90" y="502" font-size="8.00" fill="#57514A">1. Схема мебели на чертеже не является технической документацией</text><text x="90" y="513.0372292173156" font-size="8.00" fill="#57514A">    для производства мебели: чертежи разрабатывает изготовитель</text><text x="90" y="524.0744584346312" font-size="8.00" fill="#57514A">    после контрольного замера на объекте.</text><text x="90" y="535.1116876519467" font-size="8.00" fill="#57514A">2. Отметки даны от уровня чистого пола 0,000; привязки розеток и</text><text x="90" y="546.1489168692623" font-size="8.00" fill="#57514A">    выключателей выдержать строго.</text><text x="90" y="557.1861460865779" font-size="8.00" fill="#57514A">3. Границы типов отделки — по маркам ведомости отделки на этом</text><text x="90" y="568.2233753038935" font-size="8.00" fill="#57514A">    листе.</text></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

14.22" font-weight="700" fill="#2E2A26">Развертка · Гардеробная · стена C</text><text x="90" y="66" font-size="9.78" fill="#7A756D">Вид изнутри помещения · отметки от чистого пола · М 1:40</text><g data-el="notes"></g><text x="90" y="488" font-size="8.45" font-weight="700" fill="#2E2A26">Примечания:</text><text x="90" y="502" font-size="8.00" fill="#57514A">1. Схема мебели на чертеже не является технической</text><text x="90" y="513.0372292173156" font-size="8.00" fill="#57514A">    документацией для производства мебели: чертежи</text><text x="90" y="524.0744584346312" font-size="8.00" fill="#57514A">    разрабатывает изготовитель после контрольного</text><text x="90" y="535.1116876519467" font-size="8.00" fill="#57514A">    замера на объекте.</text><text x="90" y="546.1489168692623" font-size="8.00" fill="#57514A">2. Отметки даны от уровня чистого пола 0,000;</text><text x="90" y="557.1861460865779" font-size="8.00" fill="#57514A">    привязки розеток и выключателей выдержать</text><text x="90" y="568.2233753038935" font-size="8.00" fill="#57514A">    строго.</text><text x="90" y="579.2606045212091" font-size="8.00" fill="#57514A">3. Границы типов отделки — по маркам ведомости</text><text x="90" y="590.2978337385246" font-size="8.00" fill="#57514A">    отделки на этом листе.</text></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

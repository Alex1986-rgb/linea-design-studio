<text x="72" y="206" font-size="9.33" fill="#2A2A2A" transform="rotate(-90 72 206)" text-anchor="middle">2900</text></g><text x="306" y="106" font-size="10.67" font-weight="700" fill="#2E2A26">Ведомость отделки · стена D</text><line x1="306" y1="112" x2="570" y2="112" stroke="#D8D2C6" stroke-width="0.71"/><text x="306" y="124" font-size="8.00" font-weight="600" fill="#7A756D">Стены:</text><text x="356" y="124" font-size="8.45" fill="#1C1C1C">Кер./гр. 600×300, затирка в</text><text x="356" y="136" font-size="8.45" fill="#1C1C1C">тон</text><text x="306" y="147" font-size="8.00" font-weight="600" fill="#7A756D">Потолок:</text><text x="356" y="147" font-size="8.45" fill="#1C1C1C">ГКЛВ, краска влагостойкая</text><text x="306" y="170" font-size="8.00" font-weight="600" fill="#7A756D">Плинтус:</text><text x="356" y="170" font-size="8.45" fill="#1C1C1C">ПВХ сантехнический</text><text x="306" y="193" font-size="8.00" font-weight="600" fill="#7A756D">LED:</text><text x="356" y="193" font-size="8.45" fill="#1C1C1C">Maytoni</text><text x="306" y="224" font-size="9.78" font-weight="700" fill="#2E2A26">Элементы стены</text><line x1="306" y1="229" x2="570" y2="229" stroke="#D8D2C6" stroke-width="0.71"/><line x1="307" y1="245" x2="317" y2="245" stroke="#C29A5B" stroke-width="1.96" stroke-dasharray="4 3"/><text x="322" y="249" font-size="8.45" fill="#57514A">LED карниз</text><text x="568" y="249" font-size="8.45" font-weight="600" fill="#1C1C1C" text-anchor="end">1.9 м.п.</text><line x1="306" y1="257" x2="570" y2="257" stroke="#EDEBE4" stroke-width="0.58"/><text x="322" y="270" font-size="8.45" fill="#57514A">Плинтус</text><text x="568" y="270" font-size="8.45" font-weight="600" fill="#1C1C1C" text-anchor="end">1.8 м.п.</text><rect x="306" y="298" width="264" height="62" fill="#FBF9F4" stroke="#C8C0B4" stroke-width="0.71"/><text x="314" y="313" font-size="8.45" font-weight="700" fill="#2E2A26">Раскладка плитки 600×300</text><text x="314" y="326" font-size="8.00" fill="#57514A">целых 27 шт. · подрезка 3 шт. · 5.7 м² (+10%)</text><text x="314" y="338" font-size="8.00" fill="#57514A">верхний ряд 200 мм · подрезка по длине 0 мм</text><text x="314" y="351" font-size="8.00" fill="#8A6A3B">от левого угла, подрезка в дальний угол</text><text x="306" y="370" font-size="8.00" fill="#8A8478">Арт.: Maytoni · трек Busbar 48V + LED Arlight Warm3000</text><text x="90" y="50" font-size="14.22" font-weight="700" fill="#2E2A26">Развертка · Санузел гостевой · стена D</text><text x="90" y="66" font-size="9.78" fill="#7A756D">Вид изнутри помещения · отметки от чистого пола · М 1:50</text><g data-el="notes"></g><text x="90" y="488" font-size="8.45" font-weight="700" fill="#2E2A26">Примечания:</text><text x="90" y="502" font-size="8.00" fill="#57514A">1. Схема мебели на чертеже не является</text><text x="90" y="514" font-size="8.00" fill="#57514A">    технической документацией для производства</text><text x="90" y="526" font-size="8.00" fill="#57514A">    мебели: чертежи разрабатывает изготовитель</text><text x="90" y="538" font-size="8.00" fill="#57514A">    после контрольного замера на объекте.</text><text x="90" y="550" font-size="8.00" fill="#57514A">2. Отметки даны от уровня чистого пола 0,000;</text><text x="90" y="562" font-size="8.00" fill="#57514A">    привязки розеток и выключателей выдержать</text><text x="90" y="574" font-size="8.00" fill="#57514A">    строго.</text><text x="90" y="586" font-size="8.00" fill="#57514A">3. Раскладку плитки начинать от указанного</text><text x="90" y="598" font-size="8.00" fill="#57514A">    ряда; подрезку уводить в зону, скрытую</text><text x="90" y="610" font-size="8.00" fill="#57514A">    сантехникой.</text></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

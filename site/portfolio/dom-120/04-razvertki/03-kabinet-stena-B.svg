2A26">Условные обозначения</text><g stroke="#21A366" stroke-width="1.07" fill="none"><circle cx="420" cy="339" r="4.5"/><circle cx="420" cy="339" r="1.4" fill="#21A366"/></g><text x="440" y="345" font-size="8.00" fill="#57514A">электроточка: подпись Н=… — отметка оси</text><text x="440" y="356.0372292173156" font-size="8.00" fill="#57514A">от чистого пола</text><line x1="414" y1="369.07445843463114" x2="430" y2="369.07445843463114" stroke="#C29A5B" stroke-width="1.96" stroke-dasharray="6 3"/><text x="440" y="375.07445843463114" font-size="8.00" fill="#57514A">LED-подсветка: карниз, ниша, подшкафная</text><text x="440" y="386.11168765194674" font-size="8.00" fill="#57514A">линия</text><rect x="414" y="393.1489168692623" width="16" height="11" fill="none" stroke="#57514A" stroke-width="1.07"/><text x="440" y="405.1489168692623" font-size="8.00" fill="#57514A">ниша ГКЛ: габарит и отметка низа</text><rect x="414" y="412.1861460865779" width="16" height="11" fill="none" stroke="#2E9E4F" stroke-width="0.89"/><text x="440" y="424.1861460865779" font-size="8.00" fill="#57514A">мебель и оборудование: габарит и</text><text x="440" y="435.2233753038935" font-size="8.00" fill="#57514A">отметка</text><g stroke="#2A2A2A" stroke-width="0.71" fill="none"><line x1="414" y1="447.260604521209" x2="430" y2="447.260604521209"/><line x1="415" y1="450.260604521209" x2="419" y2="444.260604521209"/><line x1="426" y1="450.260604521209" x2="430" y2="444.260604521209"/></g><text x="440" y="454.260604521209" font-size="8.00" fill="#57514A">размерная цепочка, засечки 45° (ГОСТ</text><text x="440" y="465.2978337385246" font-size="8.00" fill="#57514A">2.307)</text></g><text x="90" y="50" font-size="14.22" font-weight="700" fill="#2E2A26">Развертка · Кабинет · стена B</text><text x="90" y="66" font-size="9.78" fill="#7A756D">Вид изнутри помещения · отметки от чистого пола · М 1:40</text><g data-el="notes"></g><text x="90" y="488" font-size="8.45" font-weight="700" fill="#2E2A26">Примечания:</text><text x="90" y="502" font-size="8.00" fill="#57514A">1. Схема мебели на чертеже не является технической документацией</text><text x="90" y="513.0372292173156" font-size="8.00" fill="#57514A">    для производства мебели: чертежи разрабатывает изготовитель</text><text x="90" y="524.0744584346312" font-size="8.00" fill="#57514A">    после контрольного замера на объекте.</text><text x="90" y="535.1116876519467" font-size="8.00" fill="#57514A">2. Отметки даны от уровня чистого пола 0,000; привязки розеток и</text><text x="90" y="546.1489168692623" font-size="8.00" fill="#57514A">    выключателей выдержать строго.</text><text x="90" y="557.1861460865779" font-size="8.00" fill="#57514A">3. Границы типов отделки — по маркам ведомости отделки на этом</text><text x="90" y="568.2233753038935" font-size="8.00" fill="#57514A">    листе.</text></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

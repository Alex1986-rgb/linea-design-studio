nchor="end">3.4 м.п.</text><line x1="418" y1="278" x2="682" y2="278" stroke="#EDEBE4" stroke-width="0.68"/><text x="434" y="291" font-size="9.50" fill="#57514A">Плинтус</text><text x="680" y="291" font-size="9.50" font-weight="600" fill="#1C1C1C" text-anchor="end">3.2 м.п.</text><text x="418" y="311" font-size="9.45" fill="#8A8478">Арт.: Maytoni · трек Busbar 48V + LED Arlight Warm3000</text><g data-el="legend"><rect x="418" y="329" width="264" height="97.59307304328894" fill="none" stroke="#8A8478" stroke-width="0.80"/><text x="428" y="347" font-size="10.50" font-weight="700" fill="#2E2A26">Условные обозначения</text><g stroke="#21A366" stroke-width="1.20" fill="none"><circle cx="436" cy="360" r="4.5"/><circle cx="436" cy="360" r="1.4" fill="#21A366"/></g><text x="456" y="366" font-size="9.45" fill="#57514A">электроточка: подпись Н=… — отметка оси от чистого пола</text><line x1="430" y1="373.5186146086578" x2="446" y2="373.5186146086578" stroke="#C29A5B" stroke-width="2.20" stroke-dasharray="6 3"/><text x="456" y="379.5186146086578" font-size="9.45" fill="#57514A">LED-подсветка: карниз, ниша, подшкафная линия</text><rect x="430" y="381.0372292173156" width="16" height="11" fill="none" stroke="#57514A" stroke-width="1.20"/><text x="456" y="393.0372292173156" font-size="9.45" fill="#57514A">ниша ГКЛ: габарит и отметка низа</text><rect x="430" y="394.5558438259734" width="16" height="11" fill="none" stroke="#2E9E4F" stroke-width="1.00"/><text x="456" y="406.5558438259734" font-size="9.45" fill="#57514A">мебель и оборудование: габарит и отметка</text><g stroke="#2A2A2A" stroke-width="0.80" fill="none"><line x1="430" y1="413.0744584346312" x2="446" y2="413.0744584346312"/><line x1="431" y1="416.0744584346312" x2="435" y2="410.0744584346312"/><line x1="442" y1="416.0744584346312" x2="446" y2="410.0744584346312"/></g><text x="456" y="420.0744584346312" font-size="9.45" fill="#57514A">размерная цепочка, засечки 45° (ГОСТ 2.307)</text></g></g></g><g data-el="footer"><g data-el="notes"></g><text x="88" y="890" font-size="9.50" font-weight="700" fill="#2E2A26">Примечания:</text><text x="88" y="904" font-size="9.45" fill="#57514A">1. Схема мебели на чертеже не является технической документацией для производства</text><text x="88" y="917.0360714285714" font-size="9.45" fill="#57514A">    мебели: чертежи разрабатывает изготовитель после контрольного замера на объекте.</text><text x="88" y="930.0721428571428" font-size="9.45" fill="#57514A">2. Отметки даны от уровня чистого пола 0,000; привязки розеток и выключателей</text><text x="88" y="943.1082142857143" font-size="9.45" fill="#57514A">    выдержать строго.</text><text x="88" y="956.1442857142857" font-size="9.45" fill="#57514A">3. Границы типов отделки — по маркам ведомости отделки на этом листе.</text></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

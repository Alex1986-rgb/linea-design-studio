"690" y="460" font-size="8.00" fill="#2E2A26" text-anchor="end">8,7</text><text x="748" y="460" font-size="8.00" fill="#57514A" text-anchor="end">1</text><line x1="90" y1="464" x2="754" y2="464" stroke="#EDEBE4" stroke-width="0.58"/><line x1="90" y1="473" x2="754" y2="473" stroke="#8A8478" stroke-width="0.71"/><text x="128" y="485" font-size="8.00" font-weight="700" fill="#2E2A26">Итого кабеля</text><text x="690" y="485" font-size="8.00" font-weight="700" fill="#2E2A26" text-anchor="end">115,8</text><text x="128" y="501" font-size="8.00" fill="#57514A">по сечениям: 3×1,5 — 33,5 м · 3×2,5 — 68,7 м · 3×6 — 13,6 м</text><g data-el="notes"></g><text x="90" y="531" font-size="8.45" font-weight="700" fill="#2E2A26">Примечания:</text><text x="90" y="545" font-size="8.00" fill="#57514A">1. Длина кабеля — манхэттен от щита до дальней точки группы плюс высота помещения и 15% на спуски и запас; уточняется по</text><text x="90" y="557" font-size="8.00" fill="#57514A">    факту прокладки.</text><text x="90" y="569" font-size="8.00" fill="#57514A">2. Мокрые зоны, стиральная и посудомоечная машины — через дифференциальные автоматы 30 мА; групповые линии освещения и</text><text x="90" y="581" font-size="8.00" fill="#57514A">    розеток разделены.</text><text x="90" y="593" font-size="8.00" fill="#57514A">3. Щит устанавливается в прихожей, ниша 400×600, h=1600; перед щитом свободная зона 700 мм.</text><text x="90" y="605" font-size="8.00" fill="#57514A">4. Кабель прокладывать в гофре: за подвесным потолком и в подготовке пола в зоне 150 мм от стен; штробление несущих</text><text x="90" y="617" font-size="8.00" fill="#57514A">    конструкций запрещено.</text></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

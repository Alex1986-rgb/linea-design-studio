="8.7" fill="#57514A">м²</text><rect x="918" y="152" width="16" height="11" fill="none" stroke="#7FA3B5" stroke-width="2"/><text x="944" y="163" font-size="8.7" fill="#57514A">От-2 · керамогранит под камень · ≈29 м²</text><text x="944" y="174" font-size="8.7" fill="#57514A">(+10%)</text><line x1="918" y1="187" x2="934" y2="187" stroke="#8A5A2B" stroke-width="4"/><text x="944" y="193" font-size="8.7" fill="#57514A">От-3 · акцентная стена: глубокий</text><text x="944" y="204" font-size="8.7" fill="#57514A">серо-зелёный (акцентные стены) · ≈25 м²</text><text x="70" y="970" font-size="10" font-weight="700" fill="#2E2A26">Примечания:</text><text x="70" y="984" font-size="9" fill="#57514A">1. Площади рассчитаны за вычетом проёмов; уточняются по развёрткам (раздел 04).</text><text x="70" y="998" font-size="9" fill="#57514A">2. Отделка каждой стены с материалом и артикулом — на развёртках и в спецификации (раздел 07).</text><text x="70" y="1012" font-size="9" fill="#57514A">3. Стыки разных отделок — во внутренних углах, без нащельников.</text><text x="70" y="44" font-size="17" font-weight="700" fill="#2E2A26">План отделки стен · 2 этаж</text><text x="70" y="62" font-size="11" fill="#7A756D">Коды отделки по помещениям · площади за вычетом проёмов</text></g><g stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

нтехники</text><rect x="725" y="342.5636949175606" width="16" height="12" rx="2" fill="none" stroke="#0072C8" stroke-width="1.08"/><text x="733" y="351.5636949175606" font-size="15.00" font-weight="700" text-anchor="middle" fill="#0072C8">В1</text><text x="746" y="351.5636949175606" font-size="15.00" fill="#2E2A26">ХВ/ГВ h=600, ГВ слева · выпуск Ø50 h=450</text><rect x="725" y="363.2591567822557" width="16" height="12" rx="2" fill="none" stroke="#0072C8" stroke-width="1.08"/><text x="733" y="372.2591567822557" font-size="15.00" font-weight="700" text-anchor="middle" fill="#0072C8">В2</text><text x="746" y="372.2591567822557" font-size="15.00" fill="#2E2A26">смеситель ХВ/ГВ h=820 · выпуск Ø50 h=80</text><rect x="725" y="383.95461864695073" width="16" height="12" rx="2" fill="none" stroke="#0072C8" stroke-width="1.08"/><text x="733" y="392.95461864695073" font-size="15.00" font-weight="700" text-anchor="middle" fill="#0072C8">В3</text><text x="746" y="392.95461864695073" font-size="15.00" fill="#2E2A26">выпуск Ø110 h=180 · ХВ h=250 (гибкая подводка)</text><g data-el="notes"></g><text x="70" y="1036" font-size="15.00" font-weight="700" fill="#2E2A26">Примечания:</text><text x="70" y="1050" font-size="15.00" fill="#57514A">1. Привязки от оси прибора; уточнить после укладки плитки ±5 мм.</text><text x="70" y="1064" font-size="15.00" fill="#57514A">2. Сантехника монтируется после завершения чистовой отделки.</text><text x="70" y="1078" font-size="15.00" fill="#57514A">3. Уклон безрасчётных отводных трубопроводов — 1/d (СП 30.13330.2020, 19.1): Ø110 — 10 мм/пог.м, Ø50 — 20, Ø40 — 25; наибольший уклон не более 0,15.</text><text x="70" y="1092" font-size="15.00" fill="#57514A">4. Ввод ГВС и ХВС — от существующих стояков согласно проекту ВК.</text><text x="70" y="22" font-size="22.95" font-weight="700" fill="#2E2A26">Сантехника с привязками · 1 этаж</text><text x="70" y="40" font-size="15.00" fill="#7A756D">Расположение сантехнических приборов · привязки от стен в мм</text></
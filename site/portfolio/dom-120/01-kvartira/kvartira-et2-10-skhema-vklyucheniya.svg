руппа 2 — скрытая LED-подсветка</text><line x1="1300" y1="160.07214285714286" x2="1316" y2="160.07214285714286" stroke="#27835B" stroke-width="1.20" stroke-dasharray="2 3"/><text x="1326" y="166.07214285714286" font-size="9.45" fill="#57514A">группа 3 — подвес / трек</text></g></g><g data-el="footer"><g data-el="notes"><text x="88" y="896" font-size="10.00" font-weight="700" fill="#2E2A26">Примечания:</text><text x="88" y="909" font-size="9.45" fill="#57514A">1. Схема принципиальная: показывает состав групп, а не трассы кабеля.</text><text x="88" y="922" font-size="9.45" fill="#57514A">2. В спальне вторая точка группы 1 — проходной выключатель у изголовья.</text><text x="88" y="935" font-size="9.45" fill="#57514A">3. Подсветка зеркала и фартука — со своими локальными выключателями.</text><text x="88" y="948" font-size="9.45" fill="#57514A">4. Рекомендуется мастер-выключатель всего света у входной двери.</text></g></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

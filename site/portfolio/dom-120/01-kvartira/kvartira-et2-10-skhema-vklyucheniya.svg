/><text x="944" y="111" font-size="15.00" fill="#57514A">группа 1 — точечный</text><text x="944" y="131.69546186469506" font-size="15.00" fill="#57514A">свет (диммер)</text><line x1="918" y1="154.39092372939015" x2="934" y2="154.39092372939015" stroke="#2980B9" stroke-width="1.62" stroke-dasharray="4 3"/><text x="944" y="160.39092372939015" font-size="15.00" fill="#57514A">группа 2 — скрытая</text><text x="944" y="181.08638559408521" font-size="15.00" fill="#57514A">LED-подсветка</text><line x1="918" y1="203.7818474587803" x2="934" y2="203.7818474587803" stroke="#27835B" stroke-width="1.62" stroke-dasharray="2 3"/><text x="944" y="209.7818474587803" font-size="15.00" fill="#57514A">группа 3 — подвес /</text><text x="944" y="230.47730932347537" font-size="15.00" fill="#57514A">трек</text></g><g data-el="notes"></g><text x="70" y="940" font-size="15.00" font-weight="700" fill="#2E2A26">Примечания:</text><text x="70" y="954" font-size="15.00" fill="#57514A">1. Схема принципиальная: показывает состав групп, а не трассы кабеля.</text><text x="70" y="968" font-size="15.00" fill="#57514A">2. В спальне вторая точка группы 1 — проходной выключатель у изголовья.</text><text x="70" y="982" font-size="15.00" fill="#57514A">3. Подсветка зеркала и фартука — со своими локальными выключателями.</text><text x="70" y="996" font-size="15.00" fill="#57514A">4. Рекомендуется мастер-выключатель всего света у входной двери.</text><text x="70" y="22" font-size="22.95" font-weight="700" fill="#2E2A26">Схема включения освещения · 2 этаж</text><text x="70" y="40" font-size="15.00" fill="#7A756D">Группы: какой выключатель включает какие светильники</text></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

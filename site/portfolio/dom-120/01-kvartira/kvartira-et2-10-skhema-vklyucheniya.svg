y="2 3"/><text x="944" y="151" font-size="15.00" fill="#57514A">группа 3 — подвес / трек</text><text x="70" y="906" font-size="15.00" font-weight="700" fill="#2E2A26">Примечания:</text><text x="70" y="920" font-size="15.00" fill="#57514A">1. Схема принципиальная: показывает состав групп, а не трассы кабеля.</text><text x="70" y="934" font-size="15.00" fill="#57514A">2. В спальне вторая точка группы 1 — проходной выключатель у изголовья.</text><text x="70" y="948" font-size="15.00" fill="#57514A">3. Подсветка зеркала и фартука — со своими локальными выключателями.</text><text x="70" y="962" font-size="15.00" fill="#57514A">4. Рекомендуется мастер-выключатель всего света у входной двери.</text><text x="70" y="22" font-size="22.95" font-weight="700" fill="#2E2A26">Схема включения освещения · 2 этаж</text><text x="70" y="40" font-size="15.00" fill="#7A756D">Группы: какой выключатель включает какие светильники</text></g><g stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

.00" text-anchor="end" fill="#57514A">13.5 м.п.</text><text x="912" y="378.6500805116458" font-size="15.00" fill="#2E2A26">Детская вторая</text><text x="1166" y="378.6500805116458" font-size="15.00" text-anchor="end" fill="#57514A">11.9 м.п.</text><text x="912" y="402.34554237634086" font-size="15.00" fill="#2E2A26">Санузел второго этажа</text><text x="1166" y="402.34554237634086" font-size="15.00" text-anchor="end" fill="#57514A">без плинтуса</text><text x="912" y="426.0410042410359" font-size="15.00" fill="#2E2A26">Гардеробная</text><text x="1166" y="426.0410042410359" font-size="15.00" text-anchor="end" fill="#57514A">7.1 м.п.</text><text x="912" y="449.736466105731" font-size="15.00" fill="#2E2A26">Холл второго этажа</text><text x="1166" y="449.736466105731" font-size="15.00" text-anchor="end" fill="#57514A">11.1 м.п.</text><text x="912" y="473.43192797042605" font-size="15.00" font-weight="700" fill="#2E2A26">Итого (+5% подрезка)</text><text x="1166" y="473.43192797042605" font-size="15.00" font-weight="700" text-anchor="end" fill="#2E2A26">62.5 м.п.</text></g><g data-el="notes"></g><text x="70" y="940" font-size="15.00" font-weight="700" fill="#2E2A26">Примечания:</text><text x="70" y="954" font-size="15.00" fill="#57514A">1. Плинтус крепится к стене, не к покрытию — покрытие должно свободно двигаться (узел Д, сборный лист узлов).</text><text x="70" y="968" font-size="15.00" fill="#57514A">2. Метраж за вычетом дверных проёмов и фронта кухни; запас на подрезку 5% учтён в итоге.</text><text x="70" y="982" font-size="15.00" fill="#57514A">3. Стыки покрытий выполняются на осях дверных полотен без порожка, скрытым профилем (узел Г).</text><text x="70" y="22" font-size="22.95" font-weight="700" fill="#2E2A26">План плинтусов и порожков · 2 этаж</text><text x="70" y="40" font-size="15.00" fill="#7A756D">Трассы плинтуса · стыки покрытий на осях дверных полотен</text></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" h
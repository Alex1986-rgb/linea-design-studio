86469506" font-size="15.00" fill="#57514A">100 мм</text><line x1="918" y1="154.39092372939015" x2="934" y2="154.39092372939015" stroke="#B0483A" stroke-width="4.05" stroke-dasharray="3 2"/><text x="944" y="160.39092372939015" font-size="15.00" fill="#57514A">стык покрытий /</text><text x="944" y="181.08638559408521" font-size="15.00" fill="#57514A">порожек на оси</text><text x="944" y="201.7818474587803" font-size="15.00" fill="#57514A">полотна (узел Г)</text><rect x="918" y="219.47730932347537" width="16" height="11" fill="none" stroke="#C9C9C9" stroke-width="1.08"/><text x="944" y="230.47730932347537" font-size="15.00" fill="#57514A">мокрая зона — плинтус</text><text x="944" y="251.17277118817043" font-size="15.00" fill="#57514A">не устраивается (узел</text><text x="944" y="271.8682330528655" font-size="15.00" fill="#57514A">Д)</text></g><g data-el="spec"><text x="914" y="327.2591567822557" font-size="15.00" font-weight="700" fill="#2E2A26">Ведомость плинтуса</text><rect x="906" y="305.5636949175606" width="268" height="198.56369491756058" fill="none" stroke="#8A8478" stroke-width="1.08"/><text x="912" y="351.95461864695073" font-size="15.00" fill="#2E2A26">Спальня родителей</text><text x="1166" y="351.95461864695073" font-size="15.00" text-anchor="end" fill="#57514A">16.0 м.п.</text><text x="912" y="375.6500805116458" font-size="15.00" fill="#2E2A26">Детская</text><text x="1166" y="375.6500805116458" font-size="15.00" text-anchor="end" fill="#57514A">13.6 м.п.</text><text x="912" y="399.34554237634086" font-size="15.00" fill="#2E2A26">Детская вторая</text><text x="1166" y="399.34554237634086" font-size="15.00" text-anchor="end" fill="#57514A">12.0 м.п.</text><text x="912" y="423.041004241036" font-size="15.00" fill="#2E2A26">Санузел второго эта…</text><text x="1166" y="423.041004241036" font-size="15.00" text-anchor="end" fill="#57514A">без плинтуса</text><text x="912" y="446.73646610573104" font-size="15.00" fill="#2E2A26">Гардеробная</text><text x="1166" y="446.73646610573104" font-size="15.00" text-anchor="end" fill="#57514A">7.4 м.п.</text><text x="912" y="470.4319279704261" font-size="15.00" fill="#2E2A26">Холл второго этажа</text><text x="1166" y="470.4319279704261" font-size="15.00" text-anchor="end" fill="#57514A">11.1 м.п.</text><text x="912" y="494.1273898351212" font-size="15.00" font-weight="700" fill="#2E2A26">Итого (+5% подрезка)</text><text x="1166" y="494.1273898351212" font-size="15.00" font-weight="700" text-anchor="end" fill="#2E2A26">63.1 м.п.</text></g><g data-el="notes"></g><text x="70" y="940" font-size="15.00" font-weight="700" fill="#2E2A26">Примечания:</text><text x="70" y="962.6954618646951" font-size="15.00" fill="#57514A">1. Плинтус крепится к стене, не к покрытию — покрытие должно свободно двигаться (узел Д, сборный лист узлов).</text><text x="70" y="985.3909237293901" font-size="15.00" fill="#57514A">2. Метраж за вычетом дверных проёмов и фронта кухни; запас на подрезку 5% учтён в итоге.</text><text x="70" y="1008.0863855940852" font-size="15.00" fill="#57514A">3. Стыки покрытий выполняются на осях дверных полотен без порожка, скрытым профилем (узел Г).</text><text x="70" y="22" font-size="22.95" font-weight="700" fill="#2E2A26">План плинтусов и порожков · 2 этаж</text><text x="70" y="40" font-size="15.00" fill="#7A756D">Трассы плинтуса · стыки покрытий на осях дверных полотен</text></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

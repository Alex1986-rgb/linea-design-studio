xt><line x1="1300" y1="118" x2="1316" y2="118" stroke="#8A5A2B" stroke-width="2.40"/><text x="1326" y="124" font-size="9.45" fill="#57514A">плинтус плинтус МДФ 100 мм</text><line x1="1300" y1="139.03607142857143" x2="1316" y2="139.03607142857143" stroke="#B0483A" stroke-width="3.00" stroke-dasharray="3 2"/><text x="1326" y="145.03607142857143" font-size="9.45" fill="#57514A">стык покрытий / порожек на оси полотна</text><text x="1326" y="158.07214285714286" font-size="9.45" fill="#57514A">(узел Г)</text><rect x="1300" y="168.10821428571427" width="16" height="11" fill="none" stroke="#C9C9C9" stroke-width="0.80"/><text x="1326" y="179.10821428571427" font-size="9.45" fill="#57514A">мокрая зона — плинтус не устраивается</text><text x="1326" y="192.1442857142857" font-size="9.45" fill="#57514A">(узел Д)</text></g><g data-el="spec"><text x="1296" y="232.22135714285713" font-size="9.45" font-weight="700" fill="#2E2A26">Ведомость плинтуса</text><rect x="1288" y="218.18035714285713" width="268" height="137.29349999999997" fill="none" stroke="#8A8478" stroke-width="0.80"/><text x="1294" y="249.25742857142856" font-size="9.45" fill="#2E2A26">Спальня родителей</text><text x="1548" y="249.25742857142856" font-size="9.45" text-anchor="end" fill="#57514A">16.0 м.п.</text><text x="1294" y="265.2935" font-size="9.45" fill="#2E2A26">Детская</text><text x="1548" y="265.2935" font-size="9.45" text-anchor="end" fill="#57514A">13.6 м.п.</text><text x="1294" y="281.3295714285714" font-size="9.45" fill="#2E2A26">Детская вторая</text><text x="1548" y="281.3295714285714" font-size="9.45" text-anchor="end" fill="#57514A">12.0 м.п.</text><text x="1294" y="297.3656428571428" font-size="9.45" fill="#2E2A26">Санузел второго этажа</text><text x="1548" y="297.3656428571428" font-size="9.45" text-anchor="end" fill="#57514A">без плинтуса</text><text x="1294" y="313.40171428571426" font-size="9.45" fill="#2E2A26">Гардеробная</text><text x="1548" y="313.40171428571426" font-size="9.45" text-anchor="en
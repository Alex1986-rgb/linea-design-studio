e" fill="#57514A">5</text><text x="108" y="541.9970064859472" font-size="10.00" text-anchor="middle" fill="#57514A" text-decoration="underline">9</text></g><g data-el="heading"><text x="88" y="53" font-size="17.00" font-weight="700" fill="#2E2A26">План плинтусов и порожков · 1 этаж</text><text x="88" y="71" font-size="11.00" fill="#7A756D">Трассы плинтуса · стыки покрытий на осях дверных полотен</text></g><g data-el="panel"><g data-el="legend"><rect x="1288" y="87" width="268" height="119.18035714285713" fill="none" stroke="#8A8478" stroke-width="0.80"/><text x="1298" y="105" font-size="10.50" font-weight="700" fill="#2E2A26">Условные обозначения</text><line x1="1300" y1="118" x2="1316" y2="118" stroke="#8A5A2B" stroke-width="2.40"/><text x="1326" y="124" font-size="9.45" fill="#57514A">плинтус плинтус МДФ 100 мм</text><line x1="1300" y1="139.03607142857143" x2="1316" y2="139.03607142857143" stroke="#B0483A" stroke-width="3.00" stroke-dasharray="3 2"/><text x="1326" y="145.03607142857143" font-size="9.45" fill="#57514A">стык покрытий / порожек на оси полотна</text><text x="1326" y="158.07214285714286" font-size="9.45" fill="#57514A">(узел Г)</text><rect x="1300" y="168.10821428571427" width="16" height="11" fill="none" stroke="#C9C9C9" stroke-width="0.80"/><text x="1326" y="179.10821428571427" font-size="9.45" fill="#57514A">мокрая зона — плинтус не устраивается</text><text x="1326" y="192.1442857142857" font-size="9.45" fill="#57514A">(узел Д)</text></g><g data-el="spec"><text x="1296" y="232.22135714285713" font-size="9.45" font-weight="700" fill="#2E2A26">Ведомость плинтуса</text><rect x="1288" y="218.18035714285713" width="268" height="121.25742857142855" fill="none" stroke="#8A8478" stroke-width="0.80"/><text x="1294" y="249.25742857142856" font-size="9.45" fill="#2E2A26">Прихожая</text><text x="1548" y="249.25742857142856" font-size="9.45" text-anchor="end" fill="#57514A">10.2 м.п.</text><text x="1294" y="265.2935" font-size="9.45" fill="#2E2A26">Гостиная-кухня</text><text x="1548" y="265.2935" font-size="9.45" text-anchor="end" fill="#57514A">15.7 м.п.</text><text x="1294" y="281.3295714285714" font-size="9.45" fill="#2E2A26">Кабинет</text><text x="1548" y="281.3295714285714" font-size="9.45" text-anchor="end" fill="#57514A">12.0 м.п.</text><text x="1294" y="297.3656428571428" font-size="9.45" fill="#2E2A26">Санузел гостевой</text><text x="1548" y="297.3656428571428" font-size="9.45" text-anchor="end" fill="#57514A">без плинтуса</text><text x="1294" y="313.40171428571426" font-size="9.45" fill="#2E2A26">Холл с лестницей</text><text x="1548" y="313.40171428571426" font-size="9.45" text-anchor="end" fill="#57514A">11.1 м.п.</text><text x="1294" y="329.43778571428567" font-size="9.45" font-weight="700" fill="#2E2A26">Итого (+5% подрезка)</text><text x="1548" y="329.43778571428567" font-size="9.45" font-weight="700" text-anchor="end" fill="#2E2A26">51.5 м.п.</text></g></g><g data-el="footer"><g data-el="notes"><text x="88" y="909" font-size="10.00" font-weight="700" fill="#2E2A26">Примечания:</text><text x="88" y="922" font-size="9.45" fill="#57514A">1. Плинтус крепится к стене, не к покрытию — покрытие должно свободно двигаться (узел Д, сборный лист узлов).</text><text x="88" y="935" font-size="9.45" fill="#57514A">2. Метраж за вычетом дверных проёмов и фронта кухни; запас на подрезку 5% учтён в итоге.</text><text x="88" y="948" font-size="9.45" fill="#57514A">3. Стыки покрытий выполняются на осях дверных полотен без порожка, скрытым профилем (узел Г).</text></g></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

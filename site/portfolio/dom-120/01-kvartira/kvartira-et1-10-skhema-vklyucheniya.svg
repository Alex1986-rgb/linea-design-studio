ht="700" fill="#2E2A26">Схема включения освещения · 1 этаж</text><text x="70" y="40" font-size="20.00" fill="#7A756D">Группы: какой выключатель включает какие светильники</text></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

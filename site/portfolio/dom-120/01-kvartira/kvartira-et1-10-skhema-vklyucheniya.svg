14A">1. Схема принципиальная: показывает состав групп, а не трассы кабеля.</text><text x="88" y="922" font-size="9.45" fill="#57514A">2. В спальне вторая точка группы 1 — проходной выключатель у изголовья.</text><text x="88" y="935" font-size="9.45" fill="#57514A">3. Подсветка зеркала и фартука — со своими локальными выключателями.</text><text x="88" y="948" font-size="9.45" fill="#57514A">4. Рекомендуется мастер-выключатель всего света у входной двери.</text></g></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

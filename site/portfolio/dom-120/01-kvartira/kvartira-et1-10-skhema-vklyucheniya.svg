-size="20.00" fill="#57514A">группа 2 — скрытая LED-подсветка</text><line x1="730" y1="145" x2="746" y2="145" stroke="#27835B" stroke-width="1.62" stroke-dasharray="2 3"/><text x="756" y="151" font-size="20.00" fill="#57514A">группа 3 — подвес / трек</text></g><g data-el="notes"></g><text x="70" y="1036" font-size="20.00" font-weight="700" fill="#2E2A26">Примечания:</text><text x="70" y="1050" font-size="20.00" fill="#57514A">1. Схема принципиальная: показывает состав групп, а не трассы кабеля.</text><text x="70" y="1064" font-size="20.00" fill="#57514A">2. В спальне вторая точка группы 1 — проходной выключатель у изголовья.</text><text x="70" y="1078" font-size="20.00" fill="#57514A">3. Подсветка зеркала и фартука — со своими локальными выключателями.</text><text x="70" y="1092" font-size="20.00" fill="#57514A">4. Рекомендуется мастер-выключатель всего света у входной двери.</text><text x="70" y="22" font-size="22.95" font-weight="700" fill="#2E2A26">Схема включения освещения · 1 этаж</text><text x="70" y="40" font-size="20.00" fill="#7A756D">Группы: какой выключатель включает какие светильники</text></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

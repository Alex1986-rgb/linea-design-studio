ont-size="20.00" fill="#57514A">(ГОСТ 21.201)</text><g stroke="#2A2A2A" stroke-width="1.44" fill="none"><line x1="730" y1="378" x2="747" y2="378"/><line x1="731" y1="381" x2="735" y2="375"/><line x1="743" y1="381" x2="747" y2="375"/></g><text x="756" y="385" font-size="20.00" fill="#57514A">размерная цепочка, засечки 45° (ГОСТ</text><text x="756" y="396" font-size="20.00" fill="#57514A">2.307)</text></g><g data-el="notes"></g><text x="70" y="1002" font-size="20.00" font-weight="700" fill="#2E2A26">Примечания:</text><text x="70" y="1016" font-size="20.00" fill="#57514A">1. Все размеры даны в мм по внутренним поверхностям стен, без учёта отделочного слоя.</text><text x="70" y="1030" font-size="20.00" fill="#57514A">2. Размеры проверять по месту; допуск обмера ±5 мм в зонах встроенной мебели и санузлов.</text><text x="70" y="1044" font-size="20.00" fill="#57514A">3. За отметку 0,000 принят уровень чистового пола.</text><text x="70" y="22" font-size="22.95" font-weight="700" fill="#2E2A26">Обмерный план квартиры · 1 этаж</text><text x="70" y="40" font-size="20.00" fill="#7A756D">КП «Сосновый бор», Московская обл. · 120 м² · все размеры в мм</text></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

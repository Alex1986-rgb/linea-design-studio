t-anchor="middle" fill="#57514A" text-decoration="underline">9</text></g><g data-el="heading"><text x="88" y="53" font-size="17.00" font-weight="700" fill="#2E2A26">План тёплых полов · 2 этаж</text><text x="88" y="71" font-size="11.00" fill="#7A756D">Электрический мат под плитку/кварцвинил · зоны, терморегуляторы</text></g><g data-el="panel"><g data-el="legend"><rect x="1288" y="87" width="268" height="85.10821428571427" fill="none" stroke="#8A8478" stroke-width="0.80"/><text x="1298" y="105" font-size="10.50" font-weight="700" fill="#2E2A26">Условные обозначения</text><rect x="1300" y="112" width="16" height="12" fill="#D9634D1F" stroke="#D9634D" stroke-width="1.00"/><line x1="1302" y1="116" x2="1314" y2="116" stroke="#D9634D88" stroke-width="1.00"/><line x1="1302" y1="120" x2="1314" y2="120" stroke="#D9634D88" stroke-width="1.00"/><text x="1326" y="124" font-size="9.45" fill="#57514A">зона тёплого пола — всего 13.1 м²</text><rect x="1303" y="132.03607142857143" width="11" height="11" fill="#FFF" stroke="#B0483A" stroke-width="1.10"/><text x="1308.5" y="140.03607142857143" font-size="9.45" font-weight="700" text-anchor="middle" fill="#B0483A">t°</text><text x="1326" y="145.03607142857143" font-size="9.45" fill="#57514A">терморегулятор, h=900, у входа в</text><text x="1326" y="158.07214285714286" font-size="9.45" fill="#57514A">помещение</text></g></g><g data-el="footer"><g data-el="notes"><text x="88" y="909" font-size="10.00" font-weight="700" fill="#2E2A26">Примечания:</text><text x="88" y="922" font-size="9.45" fill="#57514A">1. Отступ мата от стен и стационарной мебели — 100 мм; под мебелью без зазора не укладывать.</text><text x="88" y="935" font-size="9.45" fill="#57514A">2. Датчик температуры — в гофре 16 мм, вывод в центр зоны.</text><text x="88" y="948" font-size="9.45" fill="#57514A">3. Питание зон тёплого пола — отдельными линиями через УЗО 30 мА.</text></g></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="
="10" font-weight="700" fill="#2E2A26">Примечания:</text><text x="70" y="1080" font-size="9" fill="#57514A">1. Розетки — h=300 от чистого пола по умолчанию; отклонения (фартук 1100, ТВ 1300, тумбы 600) — на планах раздела 09.</text><text x="70" y="1094" font-size="9" fill="#57514A">2. Выключатели — h=900, со стороны ручки двери, ≥100 мм от проёма.</text><text x="70" y="1108" font-size="9" fill="#57514A">3. Санузел: линии через УЗО 30 мА, механизмы IP44.</text><text x="70" y="1122" font-size="9" fill="#57514A">4. Разводку выполнять по инженерному проекту; привязки уточнить по месту после монтажа перегородок.</text><text x="70" y="44" font-size="17" font-weight="700" fill="#2E2A26">План электрики · 1 этаж</text><text x="70" y="62" font-size="11" fill="#7A756D">Розетки и выключатели · привязки и высоты — на планах помещений (раздел 09)</text></g><g stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

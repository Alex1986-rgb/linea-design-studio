 цвет стен, магнитные замки AGB (см. спецификацию, раздел 07).</text><text x="70" y="1064" font-size="20.00" fill="#57514A">2. Размеры проёмов уточнить по месту после монтажа конструкций и стяжки.</text><text x="70" y="1078" font-size="20.00" fill="#57514A">3. Входная дверь — существующая, замена не предусмотрена.</text><text x="70" y="22" font-size="22.95" font-weight="700" fill="#2E2A26">Экспликация помещений и план дверей · 1 этаж</text><text x="70" y="40" font-size="20.00" fill="#7A756D">Марки дверей Дn · спецификация проёмов и полотен</text></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

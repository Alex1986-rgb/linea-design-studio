олков · каркас ПП 60×27, ГКЛ 12,5 в 2 слоя</text></g><g data-el="panel"><g data-el="spec"></g><g data-el="legend"><rect x="1288" y="87" width="268" height="166.2885714285714" fill="none" stroke="#8A8478" stroke-width="0.80"/><text x="1298" y="105" font-size="10.50" font-weight="700" fill="#2E2A26">Ведомость ГКЛ-конструкций</text><circle cx="1308" cy="118" r="7" fill="#FFF" stroke="#3B5C77" stroke-width="0.90"/><text x="1308" y="121" font-size="9.45" font-weight="700" fill="#3B5C77" text-anchor="middle">М1</text><text x="1326" y="124" font-size="9.45" fill="#57514A">фальш-стена, вылет 165 мм · Ниша</text><text x="1326" y="137.03607142857143" font-size="9.45" fill="#57514A">банкетки с подсветкой (Прихожая)</text><circle cx="1308" cy="152.07214285714286" r="7" fill="#FFF" stroke="#3B5C77" stroke-width="0.90"/><text x="1308" y="155.07214285714286" font-size="9.45" font-weight="700" fill="#3B5C77" text-anchor="middle">М2</text><text x="1326" y="158.07214285714286" font-size="9.45" fill="#57514A">фальш-стена, вылет 165 мм · ТВ-ниша ГКЛ</text><text x="1326" y="171.1082142857143" font-size="9.45" fill="#57514A">(Гостиная-кухня)</text><circle cx="1308" cy="186.14428571428573" r="7" fill="#FFF" stroke="#3B5C77" stroke-width="0.90"/><text x="1308" y="189.14428571428573" font-size="9.45" font-weight="700" fill="#3B5C77" text-anchor="middle">М3</text><text x="1326" y="192.14428571428573" font-size="9.45" fill="#57514A">фальш-стена, вылет 165 мм · Ниша-полка</text><text x="1326" y="205.18035714285716" font-size="9.45" fill="#57514A">над ванной (Санузел гостевой)</text><circle cx="1308" cy="220.2164285714286" r="7" fill="#FFF" stroke="#3B5C77" stroke-width="0.90"/><text x="1308" y="223.2164285714286" font-size="9.45" font-weight="700" fill="#3B5C77" text-anchor="middle">М4</text><text x="1326" y="226.2164285714286" font-size="9.45" fill="#57514A">фальш-стена, вылет 165 мм · Ниша</text><text x="1326" y="239.25250000000003" font-size="9.45" fill="#57514A">банкетки с подсветкой (Холл с лестницей)</text></g></g><g data-el="footer"><g data-el="notes"><text x="88" y="909" font-size="10.00" font-weight="700" fill="#2E2A26">Примечания:</text><text x="88" y="922" font-size="9.45" fill="#57514A">1. Внутри всех конструкций — закладные из фанеры 18 мм под навесное оборудование.</text><text x="88" y="935" font-size="9.45" fill="#57514A">2. Границы потолочных коробов — на плане потолков и листах раздела 05.</text><text x="88" y="948" font-size="9.45" fill="#57514A">3. В санузле — влагостойкий ГКЛВ · звукоизоляция минватой 50 мм в полостях.</text></g></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

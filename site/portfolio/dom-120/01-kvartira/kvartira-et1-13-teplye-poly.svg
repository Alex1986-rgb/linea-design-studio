ext><rect x="1303" y="132.03607142857143" width="11" height="11" fill="#FFF" stroke="#B0483A" stroke-width="1.10"/><text x="1308.5" y="140.03607142857143" font-size="9.45" font-weight="700" text-anchor="middle" fill="#B0483A">t°</text><text x="1326" y="145.03607142857143" font-size="9.45" fill="#57514A">терморегулятор, h=900, у входа в</text><text x="1326" y="158.07214285714286" font-size="9.45" fill="#57514A">помещение</text></g></g><g data-el="footer"><g data-el="notes"><text x="88" y="909" font-size="10.00" font-weight="700" fill="#2E2A26">Примечания:</text><text x="88" y="922" font-size="9.45" fill="#57514A">1. Отступ мата от стен и стационарной мебели — 100 мм; под мебелью без зазора не укладывать.</text><text x="88" y="935" font-size="9.45" fill="#57514A">2. Датчик температуры — в гофре 16 мм, вывод в центр зоны.</text><text x="88" y="948" font-size="9.45" fill="#57514A">3. Питание зон тёплого пола — отдельными линиями через УЗО 30 мА.</text></g></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

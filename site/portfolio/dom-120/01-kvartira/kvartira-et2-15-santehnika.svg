260.17277118817043" stroke="#0072C8" stroke-width="1.22" stroke-dasharray="6 3"/><text x="944" y="267.17277118817043" font-size="15.00" fill="#57514A">трасса ГВС/ХВС от</text><text x="944" y="287.8682330528655" font-size="15.00" fill="#57514A">стояка</text></g><rect x="906" y="240" width="268" height="45" fill="none" stroke="#8A8478" stroke-width="1.08"/><text x="916" y="257" font-size="15.00" font-weight="700" fill="#2E2A26">Ведомость привязок сантехники</text><rect x="913" y="261" width="16" height="12" rx="2" fill="none" stroke="#0072C8" stroke-width="1.08"/><text x="921" y="270" font-size="15.00" font-weight="700" text-anchor="middle" fill="#0072C8">В1</text><text x="934" y="270" font-size="15.00" fill="#2E2A26">смеситель ХВ/ГВ h=820 · выпуск Ø50 h=80</text><g data-el="notes"></g><text x="70" y="940" font-size="15.00" font-weight="700" fill="#2E2A26">Примечания:</text><text x="70" y="954" font-size="15.00" fill="#57514A">1. Привязки от оси прибора; уточнить после укладки плитки ±5 мм.</text><text x="70" y="968" font-size="15.00" fill="#57514A">2. Сантехника монтируется после завершения чистовой отделки.</text><text x="70" y="982" font-size="15.00" fill="#57514A">3. Уклон безрасчётных отводных трубопроводов — 1/d (СП 30.13330.2020, 19.1): Ø110 — 10 мм/пог.м, Ø50 — 20, Ø40 — 25; наибольший уклон не более 0,15.</text><text x="70" y="996" font-size="15.00" fill="#57514A">4. Ввод ГВС и ХВС — от существующих стояков согласно проекту ВК.</text><text x="70" y="22" font-size="22.95" font-weight="700" fill="#2E2A26">Сантехника с привязками · 2 этаж</text><text x="70" y="40" font-size="15.00" fill="#7A756D">Расположение сантехнических приборов · привязки от стен в мм</text></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

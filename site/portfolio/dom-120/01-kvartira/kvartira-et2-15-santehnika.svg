142857143" r="1.5" fill="#0072C8"/><text x="1326" y="145.03607142857143" font-size="9.45" fill="#57514A">раковина 600×450</text><rect x="1300" y="154.07214285714286" width="16" height="10" fill="#E0F0FF" stroke="#0072C8" stroke-width="0.90" rx="2"/><circle cx="1308" cy="161.07214285714286" r="1.8" fill="none" stroke="#0072C8" stroke-width="0.70"/><text x="1326" y="166.07214285714286" font-size="9.45" fill="#57514A">ванна 1700×700 / душ 900×900</text><rect x="1300" y="175.1082142857143" width="16" height="10" fill="#E0F0FF" stroke="#0072C8" stroke-width="0.90" rx="2"/><circle cx="1305" cy="180.1082142857143" r="1.5" fill="#0072C8"/><circle cx="1311" cy="180.1082142857143" r="1.5" fill="#0072C8"/><text x="1326" y="187.1082142857143" font-size="9.45" fill="#57514A">мойка кухонная двойная 600×500</text></g><rect x="1288" y="213.1442857142857" width="268" height="45.036071428571425" fill="none" stroke="#8A8478" stroke-width="0.80"/><text x="1298" y="230.1442857142857" font-size="10.00" font-weight="700" fill="#2E2A26">Ведомость привязок сантехники</text><rect x="1295" y="234.1442857142857" width="16" height="12" rx="2" fill="none" stroke="#0072C8" stroke-width="0.80"/><text x="1303" y="243.1442857142857" font-size="9.45" font-weight="700" text-anchor="middle" fill="#0072C8">П1</text><text x="1316" y="243.1442857142857" font-size="9.45" fill="#2E2A26">смеситель ХВ/ГВ h=820 · выпуск Ø50 h=80</text></g><g data-el="footer"><g data-el="notes"><text x="88" y="883" font-size="10.00" font-weight="700" fill="#2E2A26">Примечания:</text><text x="88" y="896" font-size="9.45" fill="#57514A">1. Привязки от оси прибора; уточнить после укладки плитки ±5 мм.</text><text x="88" y="909" font-size="9.45" fill="#57514A">2. Сантехника монтируется после завершения чистовой отделки.</text><text x="88" y="922" font-size="9.45" fill="#57514A">3. Уклон безрасчётных отводных трубопроводов — 1/d (СП 30.13330.2020, 19.1): Ø110 — 10 мм/пог.м, Ø50 — 20, Ø40 — 25; наибольший уклон не более 0,15.</text><text x="88" y="935" font-size="9.45" fill="#57514A">4. Ввод ГВС и ХВС — от существующих стояков согласно проекту ВК.</text><text x="88" y="948" font-size="9.45" fill="#57514A">5. Стояки в исходных данных не заданы: трассировка В1, Т3 и К1 на листе не показана — точки подключения определить обмером по месту и внести в бриф (object.risers).</text></g></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

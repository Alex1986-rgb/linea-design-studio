roke-width="0.29"/><g data-el="leader" stroke="#1C1C1C" stroke-width="0.29" fill="none"><line x1="145.2" y1="136" x2="167.2" y2="114"/><line x1="167.2" y1="114" x2="197.2" y2="114"/></g><circle cx="145.2" cy="136" r="1.6" fill="#1C1C1C" stroke="none"/><text x="200.2" y="111" font-size="4.00" fill="#1C1C1C">Плита перекрытия ж/б — 200 мм</text><rect x="120" y="144" width="72" height="3" fill="#7FA8C8" stroke="#2E2A26" stroke-width="0.36"/><g data-el="leader" stroke="#1C1C1C" stroke-width="0.29" fill="none"><line x1="181.2" y1="145.5" x2="203.2" y2="123.5"/><line x1="203.2" y1="123.5" x2="233.2" y2="123.5"/></g><circle cx="181.2" cy="145.5" r="1.6" fill="#1C1C1C" stroke="none"/><text x="236.2" y="120.5" font-size="4.00" fill="#1C1C1C">Гидроизоляция обмазочная, 2 слоя — 2 мм</text><rect x="120" y="147" width="72" height="4" fill="#D6D0C2" stroke="#2E2A26" stroke-width="0.36"/><g data-el="leader" stroke="#1C1C1C" stroke-width="0.29" fill="none"><line x1="145.2" y1="149" x2="123.19999999999999" y2="127"/><line x1="123.19999999999999" y1="127" x2="93.19999999999999" y2="127"/></g><circle cx="145.2" cy="149" r="1.6" fill="#1C1C1C" stroke="none"/><text x="-59.36245388681252" y="124" font-size="4.00" fill="#1C1C1C">Стяжка ЦПС, уклон 1–2% к трапу в душевой (СП 30.13330, 17.9) — 50 мм</text><rect x="120" y="151" width="72" height="3" fill="#E5B9B6" stroke="#2E2A26" stroke-width="0.36"/><g data-el="leader" stroke="#1C1C1C" stroke-width="0.29" fill="none"><line x1="181.2" y1="152.5" x2="203.2" y2="130.5"/><line x1="203.2" y1="130.5" x2="233.2" y2="130.5"/></g><circle cx="181.2" cy="152.5" r="1.6" fill="#1C1C1C" stroke="none"/><text x="236.2" y="127.5" font-size="4.00" fill="#1C1C1C">Мат тёплого пола 150 Вт/м² + клей — 6 мм</text><rect x="120" y="154" width="72" height="3" fill="#E8E3D6" stroke="#2E2A26" stroke-width="0.36"/><g data-el="leader" stroke="#1C1C1C" stroke-width="0.29" fill="none"><line x1="145.2" y1="155.5" x2="123.19999999999999" y2="133.5"/><line x1="123.19999999999999" y1="133.5" x2="93.19999999999999" y2="133.5"/></g><circle cx="145.2" cy="155.5" r="1.6" fill="#1C1C1C" stroke="none"/><text x="11.019877354040418" y="130.5" font-size="4.00" fill="#1C1C1C">Клей плиточный, гребёнка 6 мм — 5 мм</text><rect x="120" y="157" width="72" height="3" fill="#DED8CB" stroke="#2E2A26" stroke-width="0.36"/><g data-el="leader" stroke="#1C1C1C" stroke-width="0.29" fill="none"><line x1="181.2" y1="158.5" x2="203.2" y2="136.5"/><line x1="203.2" y1="136.5" x2="233.2" y2="136.5"/></g><circle cx="181.2" cy="158.5" r="1.6" fill="#1C1C1C" stroke="none"/><text x="236.2" y="133.5" font-size="4.00" fill="#1C1C1C">Керамогранит, шов 2 мм, затирка эпоксидная — 10 мм</text><g data-el="level" stroke="#2A2A2A" stroke-width="0.36" fill="none"><line x1="105" y1="123" x2="110" y2="128"/><line x1="110" y1="128" x2="115" y2="123"/><line x1="105" y1="123" x2="82" y2="123"/></g><text x="85" y="120" font-size="4.00" fill="#2A2A2A" text-anchor="start">+0,053</text><g data-el="level" stroke="#2A2A2A" stroke-width="0.36" fill="none"><line x1="105" y1="155" x2="110" y2="160"/><line x1="110" y1="160" x2="115" y2="155"/><line x1="105" y1="155" x2="82" y2="155"/></g><text x="85" y="152" font-size="4.00" fill="#2A2A2A" text-anchor="start">-0,093</text><g data-el="dim" stroke="#2A2A2A" stroke-width="0.36" fill="none"><line x1="288" y1="144" x2="288" y2="160"/><line x1="283" y1="144" x2="293" y2="144"/><line x1="283" y1="160" x2="293" y2="160"/><line x1="285" y1="147" x2="291" y2="141"/><line x1="285" y1="163" x2="291" y2="157"/></g>
<text x="294" y="152" font-size="4.67" fill="#2A2A2A" transform="rotate(-90 294 152)" text-anchor="middle">73</text><g data-el="dim" stroke="#2A2A2A" stroke-width="0.36" fill="none"><line x1="120" y1="194" x2="192" y2="194"/><line x1="120" y1="189" x2="120" y2="199"/><line x1="192" y1="189" x2="192" y2="199"/><line x1="117" y1="197" x2="123" y2="191"/><line x1="189" y1="197" x2="195" y2="191"/></g>
<text x="156" y="189" font-size="4.67" fill="#2A2A2A" text-anchor="middle">900</text><rect x="110.4" y="128" width="9.6" height="32" fill="#EFEFEF" stroke="#2E2A26" stroke-width="0.44"/><line x1="115.2" y1="144" x2="115.2" y2="134.4" stroke="#7FA8C8" stroke-width="1.07"/><text x="121.2" y="130.4" font-size="4.00" fill="#2E6FA8">гидроизоляция на стену 200 мм</text><g data-el="notes"></g><text x="120" y="196" font-size="4.00" font-weight="700" fill="#2E2A26">Примечания:</text><text x="120" y="204" font-size="4.00" fill="#57514A">1. Гидроизоляция заходит на стены не менее 200 мм от уровня покрытия, в зоне прямых струй — на всю</text><text x="120" y="210.8" font-size="4.00" fill="#57514A">    высоту замачивания (СП 29.13330.2011, 7.2).</text><text x="120" y="217.6" font-size="4.00" fill="#57514A">2. Слоёв не менее двух; под трапом и в радиусе 1 м от него — на два слоя больше, под трапом только</text><text x="120" y="224.4" font-size="4.00" fill="#57514A">    оклеечная (СП 29.13330.2011, 7.3, 7.4).</text><text x="120" y="231.2" font-size="4.00" fill="#57514A">3. Пол мокрой зоны на 15–20 мм ниже смежных помещений либо отделён порогом высотой не более 20 мм</text><text x="120" y="238" font-size="4.00" fill="#57514A">    (СП 29.13330.2011, 4.8).</text><text x="120" y="244.8" font-size="4.00" fill="#57514A">4. Датчик тёплого пола — в гофре между витками мата, доступ через терморегулятор.</text><text x="120" y="269.6" font-size="4.00" font-weight="700" fill="#2E2A26">Узел Д · Примыкание стены к полу: плинтус и теневой шов</text><text x="120" y="281.6" font-size="4.00" fill="#7A756D">два исполнения: плинтус МДФ 80 (жилые) и теневой шов 10×20 (скрытое)</text><rect x="120" y="299.6" width="56" height="3" fill="#F6F3EC" stroke="#2E2A26" stroke-width="0.53"/><g data-el="leader" stroke="#1C1C1C" stroke-width="0.29" fill="none"><line x1="139.6" y1="301.1" x2="161.6" y2="323.1"/><line x1="161.6" y1="323.1" x2="191.6" y2="323.1"/></g><circle cx="139.6" cy="301.1" r="1.6" fill="#1C1C1C" stroke="none"/><text x="194.6" y="320.1" font-size="4.00" fill="#1C1C1C">ГКЛ 12,5 по профилю (стена) — 12.5 мм</text><rect x="120" y="302.6" width="56" height="6.4" fill="#E4DFD2" stroke="#2E2A26" stroke-width="0.36"/><g data-el="leader" stroke="#1C1C1C" stroke-width="0.29" fill="none"><line x1="167.6" y1="305.8" x2="189.6" y2="283.8"/><line x1="189.6" y1="283.8" x2="219.6" y2="283.8"/></g><circle cx="167.6" cy="305.8" r="1.6" fill="#1C1C1C" stroke="none"/><text x="222.6" y="280.8" font-size="4.00" fill="#1C1C1C">Плинтус МДФ 80, эмаль в цвет стен — 80 мм</text><rect x="120" y="309" width="56" height="3" fill="#CBAE85" stroke="#2E2A26" stroke-width="0.36"/><g data-el="leader" stroke="#1C1C1C" stroke-width="0.29" fill="none"><line x1="139.6" y1="310.5" x2="117.6" y2="288.5"/><line x1="117.6" y1="288.5" x2="87.6" y2="288.5"/></g><circle cx="139.6" cy="310.5" r="1.6" fill="#1C1C1C" stroke="none"/><text x="-7.776809753619503" y="285.5" font-size="4.00" fill="#1C1C1C">Покрытие пола, зазор у стены 10 мм — 15 мм</text><g data-el="level" stroke="#2A2A2A" stroke-width="0.36" fill="none"><line x1="105" y1="294.6" x2="110" y2="299.6"/><line x1="110" y1="299.6" x2="115" y2="294.6"/><line x1="105" y1="294.6" x2="82" y2="294.6"/></g><text x="85" y="291.6" font-size="4.00" fill="#2A2A2A" text-anchor="start">+0,095</text><g data-el="level" stroke="#2A2A2A" stroke-width="0.36" fill="none"><line x1="105" y1="307" x2="110" y2="312"/><line x1="110" y1="312" x2="115" y2="307"/><line x1="105" y1="307" x2="82" y2="307"/></g><text x="85" y="304" font-size="4.00" fill="#2A2A2A" text-anchor="start">-0,095</text><g data-el="dim" stroke="#2A2A2A" stroke-width="0.36" fill="none"><line x1="272" y1="302.6" x2="272" y2="312"/><line x1="267" y1="302.6" x2="277" y2="302.6"/><line x1="267" y1="312" x2="277" y2="312"/><line x1="269" y1="305.6" x2="275" y2="299.6"/><line x1="269" y1="315" x2="275" y2="309"/></g>

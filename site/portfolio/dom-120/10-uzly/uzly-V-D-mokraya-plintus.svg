<text x="148" y="341" font-size="4.67" fill="#2A2A2A" text-anchor="middle">700</text><rect x="173.6" y="310.4" width="0.8" height="1.6" fill="#2E2A26"/><text x="173.6" y="338" font-size="4.00" fill="#57514A" text-anchor="middle">теневой шов 10×20</text><g data-el="notes"></g><text x="120" y="348" font-size="4.00" font-weight="700" fill="#2E2A26">Примечания:</text><text x="120" y="356" font-size="4.00" fill="#57514A">1. Плинтус крепится к стене, не к покрытию: покрытие должно двигаться.</text><text x="120" y="362.8" font-size="4.00" fill="#57514A">2. Теневой шов 10×20 — алюминиевый профиль, устанавливается до чистовой отделки.</text><text x="120" y="369.6" font-size="4.00" fill="#57514A">3. В мокрых зонах плинтус не устраивается: керамогранит выводится на стену.</text><line x1="112" y1="281.6" x2="512" y2="289.6" stroke="#C29A5B55" stroke-width="0.36"/><text x="120" y="400.4" font-size="4.00" fill="#57514A">Узлы вынесены с плана полов и разрезов — см. «План напольных покрытий» и разрезы альбома.</text></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

<text x="156" y="208.8" font-size="4.67" fill="#2A2A2A" text-anchor="middle">900</text><text x="120" y="104" font-size="7.11" font-weight="700" fill="#2E2A26">Узел Б · Пирог пола жилой зоны</text><text x="120" y="122" font-size="4.89" fill="#7A756D">применяется во всех жилых помещениях · отметка чистого пола 0,000</text><g data-el="notes"></g><text x="120" y="253.8" font-size="4.22" font-weight="700" fill="#2E2A26">Примечания:</text><text x="120" y="267.8" font-size="4.00" fill="#57514A">1. Стяжка выводится в ноль по всей квартире: перепад более 2 мм на 2 м — переделка.</text><text x="120" y="279.8" font-size="4.00" fill="#57514A">2. Зазор плавающей стяжки у стен, перегородок и трубопроводов — 25–30 мм на всю толщину,</text><text x="120" y="291.8" font-size="4.00" fill="#57514A">    заполняется звукоизоляционным материалом (СП 29.13330.2011, 8.10).</text><text x="120" y="303.8" font-size="4.00" fill="#57514A">3. Зазор покрытия у стены 10 мм закрывается плинтусом; плинтус крепится к стене, не к покрытию.</text><text x="120" y="315.8" font-size="4.00" fill="#57514A">4. Тёплый пол в жилых зонах не предусмотрен; в стяжке — только трассы электрики в гофре.</text><text x="120" y="327.8" font-size="4.00" fill="#57514A">5. Узел вынесен с плана полов — см. лист «План напольных покрытий» и разрезы альбома.</text></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

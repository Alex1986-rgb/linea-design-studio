-size="8.5" font-weight="700" text-anchor="middle" fill="#57514A">5</text><rect x="878" y="96" width="268" height="94" fill="none" stroke="#8A8478" stroke-width="0.8"/><text x="888" y="114" font-size="10.5" font-weight="700" fill="#2E2A26">Группы включения</text><line x1="890" y1="127" x2="906" y2="127" stroke="#C0392B" stroke-width="1.2"/><text x="916" y="133" font-size="8.7" fill="#57514A">группа 1 — точечный свет (диммер)</text><line x1="890" y1="147" x2="906" y2="147" stroke="#2980B9" stroke-width="1.2" stroke-dasharray="4 3"/><text x="916" y="153" font-size="8.7" fill="#57514A">группа 2 — скрытая LED-подсветка</text><line x1="890" y1="167" x2="906" y2="167" stroke="#27835B" stroke-width="1.2" stroke-dasharray="2 3"/><text x="916" y="173" font-size="8.7" fill="#57514A">группа 3 — подвес / трек</text><text x="70" y="750" font-size="10" font-weight="700" fill="#2E2A26">Примечания:</text><text x="70" y="764" font-size="9" fill="#57514A">1. Схема принципиальная: показывает состав групп, а не трассы кабеля.</text><text x="70" y="778" font-size="9" fill="#57514A">2. В спальне вторая точка группы 1 — проходной выключатель у изголовья.</text><text x="70" y="792" font-size="9" fill="#57514A">3. Подсветка зеркала и фартука — со своими локальными выключателями.</text><text x="70" y="806" font-size="9" fill="#57514A">4. Рекомендуется мастер-выключатель всего света у входной двери.</text><text x="70" y="44" font-size="17" font-weight="700" fill="#2E2A26">Схема включения освещения</text><text x="70" y="62" font-size="11" fill="#7A756D">Группы: какой выключатель включает какие светильники</text><g stroke="#2E2A26" stroke-width="1" fill="none">

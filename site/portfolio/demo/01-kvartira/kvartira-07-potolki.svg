«парящий» остров 3-го уровня, +2,460</text><line x1="890" y1="187" x2="906" y2="187" stroke="#C29A5B" stroke-width="1.2" stroke-dasharray="5 3"/><text x="916" y="193" font-size="8.7" fill="#57514A">LED 3000K скрытая — 55.8 м.п. всего</text><circle cx="898" cy="207" r="4" fill="#FFF" stroke="#57514A" stroke-width="0.9"/><text x="916" y="213" font-size="8.7" fill="#57514A">точечные светильники — 48 шт. всего</text><text x="70" y="750" font-size="10" font-weight="700" fill="#2E2A26">Примечания:</text><text x="70" y="764" font-size="9" fill="#57514A">1. Отметки и перепады уровней — на планах потолков помещений (раздел 05).</text><text x="70" y="778" font-size="9" fill="#57514A">2. Узел короба с LED-полкой — лист «Узел А», М 1:20.</text><text x="70" y="792" font-size="9" fill="#57514A">3. Закладные под все подвесные светильники и карнизы предусмотреть до зашивки ГКЛ.</text><text x="70" y="44" font-size="17" font-weight="700" fill="#2E2A26">План потолков</text><text x="70" y="62" font-size="11" fill="#7A756D">2–3 уровня · перепад 120 мм · скрытая LED 3000K · отметки от чистого пола</text><g stroke="#2E2A26" stroke-width="1" fill="none">

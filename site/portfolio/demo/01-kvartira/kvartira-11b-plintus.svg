856" font-size="9.45" fill="#2E2A26">Гостиная-кухня</text><text x="1548" y="249.25742857142856" font-size="9.45" text-anchor="end" fill="#57514A">12.5 м.п.</text><text x="1294" y="265.2935" font-size="9.45" fill="#2E2A26">Спальня</text><text x="1548" y="265.2935" font-size="9.45" text-anchor="end" fill="#57514A">13.9 м.п.</text><text x="1294" y="281.3295714285714" font-size="9.45" fill="#2E2A26">Детская</text><text x="1548" y="281.3295714285714" font-size="9.45" text-anchor="end" fill="#57514A">11.0 м.п.</text><text x="1294" y="297.3656428571428" font-size="9.45" fill="#2E2A26">Санузел</text><text x="1548" y="297.3656428571428" font-size="9.45" text-anchor="end" fill="#57514A">без плинтуса</text><text x="1294" y="313.40171428571426" font-size="9.45" fill="#2E2A26">Прихожая</text><text x="1548" y="313.40171428571426" font-size="9.45" text-anchor="end" fill="#57514A">10.8 м.п.</text><text x="1294" y="329.43778571428567" font-size="9.45" font-weight="700" fill="#2E2A26">Итого (+5% подрезка)</text><text x="1548" y="329.43778571428567" font-size="9.45" font-weight="700" text-anchor="end" fill="#2E2A26">50.6 м.п.</text></g></g><g data-el="footer"><g data-el="notes"><text x="88" y="909" font-size="10.00" font-weight="700" fill="#2E2A26">Примечания:</text><text x="88" y="922" font-size="9.45" fill="#57514A">1. Плинтус крепится к стене, не к покрытию — покрытие должно свободно двигаться (узел Д, сборный лист узлов).</text><text x="88" y="935" font-size="9.45" fill="#57514A">2. Метраж за вычетом дверных проёмов и фронта кухни; запас на подрезку 5% учтён в итоге.</text><text x="88" y="948" font-size="9.45" fill="#57514A">3. Стыки покрытий выполняются на осях дверных полотен без порожка, скрытым профилем (узел Г).</text></g></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

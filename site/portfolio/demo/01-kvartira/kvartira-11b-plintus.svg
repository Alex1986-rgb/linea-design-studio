0" fill="#57514A">2. Метраж за вычетом дверных проёмов и фронта кухни; запас на подрезку 5% учтён в итоге.</text><text x="70" y="762" font-size="10.00" fill="#57514A">3. Стыки покрытий выполняются на осях дверных полотен без порожка, скрытым профилем (узел Г).</text><text x="70" y="22" font-size="18.89" font-weight="700" fill="#2E2A26">План плинтусов и порожков</text><text x="70" y="40" font-size="12.22" fill="#7A756D">Трассы плинтуса · стыки покрытий на осях дверных полотен</text></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

 stroke="#2E6FA8" stroke-width="1.22" fill="#E8F2FC"><circle cx="898" cy="213.98122250275918" r="5"/><line x1="893" y1="213.98122250275918" x2="903" y2="213.98122250275918"/><line x1="898" y1="208.98122250275918" x2="898" y2="218.98122250275918"/></g><text x="916" y="219.98122250275918" font-size="10.00" fill="#57514A">стояки: канализация Ø110, вода Ø32</text><text x="916" y="233.77746700331102" font-size="10.00" fill="#57514A">— существующие, зона обслуживания</text><text x="916" y="247.57371150386285" font-size="10.00" fill="#57514A">250 мм</text></g><rect x="878" y="274.3699560044147" width="268" height="59.59248900110367" fill="none" stroke="#8A8478" stroke-width="0.89"/><text x="888" y="291.3699560044147" font-size="11.11" font-weight="700" fill="#2E2A26">Ведомость привязок сантехники</text><rect x="885" y="295.3699560044147" width="16" height="12" rx="2" fill="none" stroke="#0072C8" stroke-width="0.89"/><text x="893" y="304.3699560044147" font-size="10.00" font-weight="700" text-anchor="middle" fill="#0072C8">В1</text><text x="906" y="304.3699560044147" font-size="10.00" fill="#2E2A26">смеситель ХВ/ГВ h=820 · выпуск Ø50 h=80</text><rect x="885" y="309.1662005049665" width="16" height="12" rx="2" fill="none" stroke="#0072C8" stroke-width="0.89"/><text x="893" y="318.1662005049665" font-size="10.00" font-weight="700" text-anchor="middle" fill="#0072C8">В2</text><text x="906" y="318.1662005049665" font-size="10.00" fill="#2E2A26">выпуск Ø110 h=180 · ХВ h=250 (гибкая подводка)</text><g data-el="notes"></g><text x="70" y="720" font-size="11.11" font-weight="700" fill="#2E2A26">Примечания:</text><text x="70" y="734" font-size="10.00" fill="#57514A">1. Привязки от оси прибора; уточнить после укладки плитки ±5 мм.</text><text x="70" y="748" font-size="10.00" fill="#57514A">2. Сантехника монтируется после завершения чистовой отделки.</text><text x="70" y="762" font-size="10.00" fill="#57514A">3. Уклон безрасчётных отводных трубопроводов — 1/d (СП 30.13330.2020, 19.1): Ø110 — 10 мм/пог.м, Ø50 — 20, Ø40 — 25; наибольший уклон не более 0,15.</text><text x="70" y="776" font-size="10.00" fill="#57514A">4. Ввод ГВС и ХВС — от существующих стояков согласно проекту ВК.</text><text x="70" y="22" font-size="18.89" font-weight="700" fill="#2E2A26">Сантехника с привязками</text><text x="70" y="40" font-size="12.22" fill="#7A756D">Расположение сантехнических приборов · привязки от стен в мм</text></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

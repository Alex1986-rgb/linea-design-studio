 x="916" y="133" font-size="8.7" fill="#57514A">фальш-стена, вылет 165 мм · ТВ-ниша ГКЛ</text><text x="916" y="143" font-size="8.7" fill="#57514A">(Гостиная-кухня)</text><circle cx="898" cy="147" r="7" fill="#FFF" stroke="#3B5C77" stroke-width="0.9"/><text x="898" y="150" font-size="7.5" font-weight="700" fill="#3B5C77" text-anchor="middle">М2</text><text x="916" y="153" font-size="8.7" fill="#57514A">фальш-стена, вылет 165 мм · Мягкая</text><text x="916" y="163" font-size="8.7" fill="#57514A">панель изголовья + Ниша над изголовьем</text><text x="916" y="173" font-size="8.7" fill="#57514A">(Спальня)</text><circle cx="898" cy="167" r="7" fill="#FFF" stroke="#3B5C77" stroke-width="0.9"/><text x="898" y="170" font-size="7.5" font-weight="700" fill="#3B5C77" text-anchor="middle">М3</text><text x="916" y="173" font-size="8.7" fill="#57514A">фальш-стена, вылет 165 мм · Ниша-стеллаж</text><text x="916" y="183" font-size="8.7" fill="#57514A">с подсветкой (Детская)</text><circle cx="898" cy="187" r="7" fill="#FFF" stroke="#3B5C77" stroke-width="0.9"/><text x="898" y="190" font-size="7.5" font-weight="700" fill="#3B5C77" text-anchor="middle">М4</text><text x="916" y="193" font-size="8.7" fill="#57514A">фальш-стена, вылет 165 мм · Ниша-полка</text><text x="916" y="203" font-size="8.7" fill="#57514A">над ванной (Санузел)</text><circle cx="898" cy="207" r="7" fill="#FFF" stroke="#3B5C77" stroke-width="0.9"/><text x="898" y="210" font-size="7.5" font-weight="700" fill="#3B5C77" text-anchor="middle">М5</text><text x="916" y="213" font-size="8.7" fill="#57514A">фальш-стена, вылет 165 мм · Ниша</text><text x="916" y="223" font-size="8.7" fill="#57514A">банкетки с подсветкой (Прихожая)</text><text x="70" y="750" font-size="10" font-weight="700" fill="#2E2A26">Примечания:</text><text x="70" y="764" font-size="9" fill="#57514A">1. Внутри всех конструкций — закладные из фанеры 18 мм под навесное оборудование.</text><text x="70" y="778" font-size="9" fill="#57514A">2. Границы потолочных коробов — на плане потолков и листах раздела 05.</text><text x="70" y="792" font-size="9" fill="#57514A">3. В санузле — влагостойкий ГКЛВ · звукоизоляция минватой 50 мм в полостях.</text><text x="70" y="44" font-size="17" font-weight="700" fill="#2E2A26">План монтажа ГКЛ-конструкций</text><text x="70" y="62" font-size="11" fill="#7A756D">Фальш-стены под ниши, закладные, короба потолков · каркас ПП 60×27, ГКЛ 12,5 в 2 слоя</text><g stroke="#2E2A26" stroke-width="1" fill="none">

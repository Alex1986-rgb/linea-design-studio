 шт.</text><circle cx="898" cy="147" r="6" fill="#F5E14C66" stroke="#2E2A26" stroke-width="1"/><text x="916" y="153" font-size="8.7" fill="#57514A">подвесной светильник — 2 шт.</text><line x1="890" y1="167" x2="906" y2="167" stroke="#2E2A26" stroke-width="2.4"/><text x="916" y="173" font-size="8.7" fill="#57514A">трек-система — 1 шт.</text><line x1="890" y1="187" x2="906" y2="187" stroke="#C29A5B" stroke-width="1.2" stroke-dasharray="5 3"/><text x="916" y="193" font-size="8.7" fill="#57514A">LED 3000K скрытая — 55.8 м.п.</text><text x="70" y="750" font-size="10" font-weight="700" fill="#2E2A26">Примечания:</text><text x="70" y="764" font-size="9" fill="#57514A">1. Точная расстановка и привязки — на планах потолков помещений (раздел 05).</text><text x="70" y="778" font-size="9" fill="#57514A">2. Все группы света — на диммерах в жилых помещениях.</text><text x="70" y="792" font-size="9" fill="#57514A">3. Цветовая температура: LED 3000K, светильники 2700–3000K, CRI ≥ 90.</text><text x="70" y="44" font-size="17" font-weight="700" fill="#2E2A26">План освещения</text><text x="70" y="62" font-size="11" fill="#7A756D">Точечный свет, подвесы, треки и скрытая LED 3000K по всем помещениям</text><g stroke="#2E2A26" stroke-width="1" fill="none">

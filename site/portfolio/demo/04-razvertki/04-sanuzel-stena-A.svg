7514A">LED карниз</text><text x="572" y="270" font-size="9.50" font-weight="600" fill="#1C1C1C" text-anchor="end">1.9 м.п.</text><line x1="310" y1="278" x2="574" y2="278" stroke="#EDEBE4" stroke-width="0.68"/><text x="326" y="291" font-size="9.50" fill="#57514A">Плинтус</text><text x="572" y="291" font-size="9.50" font-weight="600" fill="#1C1C1C" text-anchor="end">1.9 м.п.</text><rect x="310" y="319" width="264" height="62" fill="#FBF9F4" stroke="#C8C0B4" stroke-width="0.80"/><text x="318" y="334" font-size="9.50" font-weight="700" fill="#2E2A26">Раскладка плитки 600×300</text><text x="318" y="347" font-size="9.45" fill="#57514A">целых 18 шт. · подрезка 18 шт. · 5.5 м² (+10%)</text><text x="318" y="359" font-size="9.45" fill="#57514A">верхний ряд 300 мм · подрезка по длине 50 мм</text><text x="318" y="372" font-size="9.45" fill="#8A6A3B">от центра стены, симметричная подрезка по краям</text><text x="310" y="391" font-size="9.45" fill="#8A8478">Арт.: Arlight · RT 2-5000 24V Warm3000 (лента) + профиль SL-LINE-2011</text><g data-el="legend"><rect x="310" y="409" width="264" height="111.11168765194672" fill="none" stroke="#8A8478" stroke-width="0.80"/><text x="320" y="427" font-size="10.50" font-weight="700" fill="#2E2A26">Условные обозначения</text><g stroke="#21A366" stroke-width="1.20" fill="none"><circle cx="328" cy="440" r="4.5"/><circle cx="328" cy="440" r="1.4" fill="#21A366"/></g><text x="348" y="446" font-size="9.45" fill="#57514A">электроточка: подпись Н=… — отметка оси от чистого пола</text><line x1="322" y1="453.5186146086578" x2="338" y2="453.5186146086578" stroke="#C29A5B" stroke-width="2.20" stroke-dasharray="6 3"/><text x="348" y="459.5186146086578" font-size="9.45" fill="#57514A">LED-подсветка: карниз, ниша, подшкафная линия</text><rect x="322" y="461.0372292173156" width="16" height="11" fill="none" stroke="#57514A" stroke-width="1.20"/><text x="348" y="473.0372292173156" font-size="9.45" fill="#57514A">ниша ГКЛ: габарит и отметка низа</text><g><rect x="322" y="474.5558438259734" width="16" height="11" fill="#F2EEE8" stroke="#C8C0B4" stroke-width="0.68"/><line x1="330" y1="474.5558438259734" x2="330" y2="485.5558438259734" stroke="#C8C0B4" stroke-width="0.68"/></g><text x="348" y="486.5558438259734" font-size="9.45" fill="#57514A">плитка 600×300, диагональ — подрезка</text><g stroke="#B0483A" stroke-width="1.40" fill="none"><line x1="322" y1="494.0744584346312" x2="336" y2="494.0744584346312"/><path d="M 332 490.0744584346312 L 337 494.0744584346312 L 332 498.0744584346312"/></g><text x="348" y="500.0744584346312" font-size="9.45" fill="#57514A">стрелка и штрихпунктир — начало раскладки плитки</text><g stroke="#2A2A2A" stroke-width="0.80" fill="none"><line x1="322" y1="506.593073043289" x2="338" y2="506.593073043289"/><line x1="323" y1="509.593073043289" x2="327" y2="503.593073043289"/><line x1="334" y1="509.593073043289" x2="338" y2="503.593073043289"/></g><text x="348" y="513.593073043289" font-size="9.45" fill="#57514A">размерная цепочка, засечки 45° (ГОСТ 2.307)</text></g></g></g><g data-el="footer"><g data-el="notes"></g><text x="88" y="890" font-size="9.50" font-weight="700" fill="#2E2A26">Примечания:</text><text x="88" y="904" font-size="9.45" fill="#57514A">1. Схема мебели на чертеже не является технической документацией для производства</text><text x="88" y="917.0360714285714" font-size="9.45" fill="#57514A">    мебели: чертежи разрабатывает изготовитель после контрольного замера на объекте.</text><text x="88" y="930.0721428571428" font-size="9.45" fill="#57514A">2. Отметки даны от уровня чистого пола 0,000; привязки розеток и выключателей</text><text x="88" y="943.1082142857143" font-size="9.45" fill="#57514A">    выдержать строго.</text><text x="88" y="956.1442857142857" font-size="9.45" fill="#57514A">3. Раскладку плитки начинать от указанного ряда; подрезку уводить в зону, скрытую</text><text x="88" y="969.1803571428571" font-size="9.45" fill="#57514A">    сантехникой.</text></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

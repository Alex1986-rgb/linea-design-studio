.11168765194674" font-size="8.00" fill="#57514A">линия</text><rect x="494" y="477.1489168692623" width="16" height="11" fill="none" stroke="#57514A" stroke-width="1.07"/><text x="520" y="489.1489168692623" font-size="8.00" fill="#57514A">ниша ГКЛ: габарит и отметка низа</text><rect x="494" y="496.1861460865779" width="16" height="11" fill="none" stroke="#2E9E4F" stroke-width="0.89"/><text x="520" y="508.1861460865779" font-size="8.00" fill="#57514A">мебель и оборудование: габарит и</text><text x="520" y="519.2233753038935" font-size="8.00" fill="#57514A">отметка</text><g stroke="#2A2A2A" stroke-width="0.71" fill="none"><line x1="494" y1="531.2606045212091" x2="510" y2="531.2606045212091"/><line x1="495" y1="534.2606045212091" x2="499" y2="528.2606045212091"/><line x1="506" y1="534.2606045212091" x2="510" y2="528.2606045212091"/></g><text x="520" y="538.2606045212091" font-size="8.00" fill="#57514A">размерная цепочка, засечки 45° (ГОСТ</text><text x="520" y="549.2978337385247" font-size="8.00" fill="#57514A">2.307)</text></g><text x="90" y="50" font-size="14.22" font-weight="700" fill="#2E2A26">Развертка · Спальня · стена B</text><text x="90" y="66" font-size="9.78" fill="#7A756D">Вид изнутри помещения · отметки от чистого пола · М 1:40</text><g data-el="notes"></g><text x="90" y="472" font-size="8.45" font-weight="700" fill="#2E2A26">Примечания:</text><text x="90" y="486" font-size="8.00" fill="#57514A">1. Схема мебели на чертеже не является технической документацией для производства</text><text x="90" y="497.0372292173156" font-size="8.00" fill="#57514A">    мебели: чертежи разрабатывает изготовитель после контрольного замера на</text><text x="90" y="508.07445843463114" font-size="8.00" fill="#57514A">    объекте.</text><text x="90" y="519.1116876519467" font-size="8.00" fill="#57514A">2. Отметки даны от уровня чистого пола 0,000; привязки розеток и выключателей</text><text x="90" y="530.1489168692623" font-size="8.00" fill="#57514A">    выдержать строго.</text><text x="90" y="541.1861460865779" font-size="8.00" fill="#57514A">3. Границы типов отделки — по маркам ведомости отделки на этом листе.</text></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

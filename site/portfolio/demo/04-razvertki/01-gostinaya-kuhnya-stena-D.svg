="1.4" fill="#21A366"/></g><text x="520" y="450" font-size="9.45" fill="#57514A">электроточка: подпись Н=… — отметка оси от чистого пола</text><line x1="494" y1="457.5186146086578" x2="510" y2="457.5186146086578" stroke="#C29A5B" stroke-width="2.20" stroke-dasharray="6 3"/><text x="520" y="463.5186146086578" font-size="9.45" fill="#57514A">LED-подсветка: карниз, ниша, подшкафная линия</text><rect x="494" y="465.0372292173156" width="16" height="11" fill="none" stroke="#57514A" stroke-width="1.20"/><text x="520" y="477.0372292173156" font-size="9.45" fill="#57514A">ниша ГКЛ: габарит и отметка низа</text><rect x="494" y="478.5558438259734" width="16" height="11" fill="none" stroke="#2E9E4F" stroke-width="1.00"/><text x="520" y="490.5558438259734" font-size="9.45" fill="#57514A">мебель и оборудование: габарит и отметка</text><g stroke="#2A2A2A" stroke-width="0.80" fill="none"><line x1="494" y1="497.0744584346312" x2="510" y2="497.0744584346312"/><line x1="495" y1="500.0744584346312" x2="499" y2="494.0744584346312"/><line x1="506" y1="500.0744584346312" x2="510" y2="494.0744584346312"/></g><text x="520" y="504.0744584346312" font-size="9.45" fill="#57514A">размерная цепочка, засечки 45° (ГОСТ 2.307)</text></g></g></g><g data-el="footer"><g data-el="notes"></g><text x="88" y="890" font-size="9.50" font-weight="700" fill="#2E2A26">Примечания:</text><text x="88" y="904" font-size="9.45" fill="#57514A">1. Схема мебели на чертеже не является технической документацией для производства</text><text x="88" y="917.0360714285714" font-size="9.45" fill="#57514A">    мебели: чертежи разрабатывает изготовитель после контрольного замера на объекте.</text><text x="88" y="930.0721428571428" font-size="9.45" fill="#57514A">2. Отметки даны от уровня чистого пола 0,000; привязки розеток и выключателей</text><text x="88" y="943.1082142857143" font-size="9.45" fill="#57514A">    выдержать строго.</text><text x="88" y="956.1442857142857" font-size="9.45" fill="#57514A">3. Границы типов отделки — по маркам ведомости отделки на этом листе.</text></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

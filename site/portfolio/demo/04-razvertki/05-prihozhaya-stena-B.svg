anchor="end">2.6 м.п.</text><text x="370" y="311" font-size="8.00" fill="#8A8478">Арт.: Arlight · RT 2-5000 24V Warm3000 (лента) + профиль SL-LINE-2011</text><g data-el="legend"><rect x="370" y="329" width="264" height="169.3350629558402" fill="none" stroke="#8A8478" stroke-width="0.71"/><text x="380" y="347" font-size="9.33" font-weight="700" fill="#2E2A26">Условные обозначения</text><g stroke="#21A366" stroke-width="1.07" fill="none"><circle cx="388" cy="360" r="4.5"/><circle cx="388" cy="360" r="1.4" fill="#21A366"/></g><text x="408" y="366" font-size="8.00" fill="#57514A">электроточка: подпись Н=… — отметка оси</text><text x="408" y="377.0372292173156" font-size="8.00" fill="#57514A">от чистого пола</text><line x1="382" y1="390.07445843463114" x2="398" y2="390.07445843463114" stroke="#C29A5B" stroke-width="1.96" stroke-dasharray="6 3"/><text x="408" y="396.07445843463114" font-size="8.00" fill="#57514A">LED-подсветка: карниз, ниша, подшкафная</text><text x="408" y="407.11168765194674" font-size="8.00" fill="#57514A">линия</text><rect x="382" y="414.1489168692623" width="16" height="11" fill="none" stroke="#57514A" stroke-width="1.07"/><text x="408" y="426.1489168692623" font-size="8.00" fill="#57514A">ниша ГКЛ: габарит и отметка низа</text><rect x="382" y="433.1861460865779" width="16" height="11" fill="none" stroke="#2E9E4F" stroke-width="0.89"/><text x="408" y="445.1861460865779" font-size="8.00" fill="#57514A">мебель и оборудование: габарит и</text><text x="408" y="456.2233753038935" font-size="8.00" fill="#57514A">отметка</text><g stroke="#2A2A2A" stroke-width="0.71" fill="none"><line x1="382" y1="468.260604521209" x2="398" y2="468.260604521209"/><line x1="383" y1="471.260604521209" x2="387" y2="465.260604521209"/><line x1="394" y1="471.260604521209" x2="398" y2="465.260604521209"/></g><text x="408" y="475.260604521209" font-size="8.00" fill="#57514A">размерная цепочка, засечки 45° (ГОСТ</text><text x="408" y="486.2978337385246" font-size="8.00" fill="#57514A">2.307)</text></g><text x="90" y="50" font-size="14.22" font-weight="700" fill="#2E2A26">Развертка · Прихожая · стена B</text><text x="90" y="66" font-size="9.78" fill="#7A756D">Вид изнутри помещения · отметки от чистого пола · М 1:40</text><g data-el="notes"></g><text x="90" y="472" font-size="8.45" font-weight="700" fill="#2E2A26">Примечания:</text><text x="90" y="486" font-size="8.00" fill="#57514A">1. Схема мебели на чертеже не является технической</text><text x="90" y="497.0372292173156" font-size="8.00" fill="#57514A">    документацией для производства мебели: чертежи</text><text x="90" y="508.07445843463114" font-size="8.00" fill="#57514A">    разрабатывает изготовитель после контрольного замера на</text><text x="90" y="519.1116876519467" font-size="8.00" fill="#57514A">    объекте.</text><text x="90" y="530.1489168692623" font-size="8.00" fill="#57514A">2. Отметки даны от уровня чистого пола 0,000; привязки</text><text x="90" y="541.1861460865779" font-size="8.00" fill="#57514A">    розеток и выключателей выдержать строго.</text><text x="90" y="552.2233753038935" font-size="8.00" fill="#57514A">3. Границы типов отделки — по маркам ведомости отделки на</text><text x="90" y="563.2606045212091" font-size="8.00" fill="#57514A">    этом листе.</text></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

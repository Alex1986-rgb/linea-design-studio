"402" y="311" font-size="8.00" fill="#8A8478">Арт.: Maytoni · трек Busbar 48V + LED Arlight Warm3000</text><text x="90" y="50" font-size="14.22" font-weight="700" fill="#2E2A26">Развертка · Детская вторая · стена D</text><text x="90" y="66" font-size="9.78" fill="#7A756D">Вид изнутри помещения · отметки от чистого пола · М 1:50</text><g data-el="notes"></g><text x="90" y="488" font-size="8.45" font-weight="700" fill="#2E2A26">Примечания:</text><text x="90" y="502" font-size="8.00" fill="#57514A">1. Схема мебели на чертеже не является технической документацией</text><text x="90" y="514" font-size="8.00" fill="#57514A">    для производства мебели: чертежи разрабатывает изготовитель</text><text x="90" y="526" font-size="8.00" fill="#57514A">    после контрольного замера на объекте.</text><text x="90" y="538" font-size="8.00" fill="#57514A">2. Отметки даны от уровня чистого пола 0,000; привязки розеток и</text><text x="90" y="550" font-size="8.00" fill="#57514A">    выключателей выдержать строго.</text><text x="90" y="562" font-size="8.00" fill="#57514A">3. Границы типов отделки — по маркам ведомости отделки на этом</text><text x="90" y="574" font-size="8.00" fill="#57514A">    листе.</text></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

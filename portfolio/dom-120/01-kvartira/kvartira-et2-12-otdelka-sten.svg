 x="944" y="122" font-size="20.00" fill="#57514A">м²</text><rect x="918" y="130" width="16" height="11" fill="none" stroke="#7FA3B5" stroke-width="2.70"/><text x="944" y="141" font-size="20.00" fill="#57514A">От-2 · керамогранит под камень · ≈29 м²</text><text x="944" y="152" font-size="20.00" fill="#57514A">(+10%)</text><line x1="918" y1="165" x2="934" y2="165" stroke="#8A5A2B" stroke-width="5.40"/><text x="944" y="171" font-size="20.00" fill="#57514A">От-3 · акцентная стена: глубокий</text><text x="944" y="182" font-size="20.00" fill="#57514A">серо-зелёный (акцентные стены) · ≈25 м²</text></g><g data-el="notes"></g><text x="70" y="906" font-size="20.00" font-weight="700" fill="#2E2A26">Примечания:</text><text x="70" y="920" font-size="20.00" fill="#57514A">1. Площади рассчитаны за вычетом проёмов; уточняются по развёрткам (раздел 04).</text><text x="70" y="934" font-size="20.00" fill="#57514A">2. Отделка каждой стены с материалом и артикулом — на развёртках и в спецификации (раздел 07).</text><text x="70" y="948" font-size="20.00" fill="#57514A">3. Стыки разных отделок — во внутренних углах, без нащельников.</text><text x="70" y="22" font-size="22.95" font-weight="700" fill="#2E2A26">План отделки стен · 2 этаж</text><text x="70" y="40" font-size="20.00" fill="#7A756D">Коды отделки по помещениям · площади за вычетом проёмов</text></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

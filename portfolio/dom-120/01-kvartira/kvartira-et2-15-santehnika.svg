 fill="#57514A">раковина 600×450</text><rect x="918" y="161" width="16" height="10" fill="#E0F0FF" stroke="#0072C8" stroke-width="0.9" rx="2"/><circle cx="926" cy="168" r="1.8" fill="none" stroke="#0072C8" stroke-width="0.7"/><text x="944" y="173" font-size="8.7" fill="#57514A">ванна 1700×700 / душ 900×900</text><rect x="918" y="181" width="16" height="10" fill="#E0F0FF" stroke="#0072C8" stroke-width="0.9" rx="2"/><circle cx="923" cy="186" r="1.5" fill="#0072C8"/><circle cx="929" cy="186" r="1.5" fill="#0072C8"/><text x="944" y="193" font-size="8.7" fill="#57514A">мойка кухонная двойная 600×500</text><line x1="918" y1="206" x2="934" y2="206" stroke="#0072C8" stroke-width="0.9" stroke-dasharray="6 3"/><text x="944" y="213" font-size="8.7" fill="#57514A">трасса ГВС/ХВС от стояка</text><text x="70" y="970" font-size="10" font-weight="700" fill="#2E2A26">Примечания:</text><text x="70" y="984" font-size="9" fill="#57514A">1. Привязки от оси прибора; уточнить после укладки плитки ±5 мм.</text><text x="70" y="998" font-size="9" fill="#57514A">2. Сантехника монтируется после завершения чистовой отделки.</text><text x="70" y="1012" font-size="9" fill="#57514A">3. Уклоны канализации ≥2% (20 мм/пог.м) в направлении стояка.</text><text x="70" y="1026" font-size="9" fill="#57514A">4. Ввод ГВС и ХВС — от существующих стояков согласно проекту ВК.</text><text x="70" y="44" font-size="17" font-weight="700" fill="#2E2A26">Сантехника с привязками · 2 этаж</text><text x="70" y="62" font-size="11" fill="#7A756D">Расположение сантехнических приборов · привязки от стен в мм</text></g><g stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

r="3" fill="#1F8A4C"/></g><text x="944" y="173" font-size="8.7" fill="#57514A">интернет / ТВ-розетка (слаботочная)</text><g stroke="#1F8A4C" stroke-width="1.2"><circle cx="925" cy="187" r="3.4" fill="#1F8A4C"/><line x1="925" y1="183.6" x2="931" y2="178"/></g><text x="944" y="193" font-size="8.7" fill="#57514A">выключатель — 12 поз.</text><rect x="918" y="202" width="16" height="11" fill="none" stroke="#C9C9C9" stroke-width="0.8"/><text x="944" y="213" font-size="8.7" fill="#57514A">мебель — подложка для привязки</text><rect x="906" y="242" width="268" height="149" fill="#FFF6F4" stroke="#B0483A" stroke-width="1"/><text x="916" y="259" font-size="10" font-weight="700" fill="#B0483A">Розетки в кухонной зоне</text><text x="916" y="274" font-size="8.6" fill="#2A2A2A">1. Холодильник</text><text x="916" y="287" font-size="8.6" fill="#2A2A2A">2. Посудомоечная машина</text><text x="916" y="300" font-size="8.6" fill="#2A2A2A">3. Варочная панель</text><text x="916" y="313" font-size="8.6" fill="#2A2A2A">4. Духовой шкаф</text><text x="916" y="326" font-size="8.6" fill="#2A2A2A">5. Вытяжка</text><text x="916" y="339" font-size="8.6" fill="#2A2A2A">6. СВЧ</text><text x="916" y="352" font-size="8.6" fill="#2A2A2A">7. Рабочая зона фартука</text><text x="916" y="367" font-size="8.2" fill="#B0483A">Итоговые размеры техники запросить у</text><text x="916" y="378" font-size="8.2" fill="#B0483A">заказчика до разводки.</text><rect x="906" y="405" width="268" height="62" fill="#FFF6F4" stroke="#B0483A" stroke-width="1"/><text x="916" y="421" font-size="10" font-weight="700" fill="#B0483A">Привязки L/H заданы:</text><text x="916" y="436" font-size="8.6" fill="#2A2A2A">— от чистого пола (высота)</text><text x="916" y="448" font-size="8.6" fill="#2A2A2A">— от угла или дверного проёма (расстояние)</text><text x="916" y="460" font-size="8.6" fill="#2A2A2A">— до центра блока розеток</text><text x="70" y="970" font-size="10" font-weight="700" fill="#2E2A26">Примечания:</text><text x="70" y="984" font-size="9" fill="#57514A">1. Все размеры даны в сантиметрах, в формате L/H.</text><text x="70" y="998" font-size="9" fill="#57514A">2. Размеры даны без учёта отделочного слоя.</text><text x="70" y="1012" font-size="9" fill="#57514A">3. * размеры уточнить после выбора мебели и техники.</text><text x="70" y="1026" font-size="9" fill="#57514A">4. ** размеры уточнить у прораба на объекте.</text><text x="70" y="1040" font-size="9" fill="#57514A">5. Санузлы: линии через УЗО 30 мА, механизмы IP44.</text><text x="70" y="1054" font-size="9" fill="#57514A">6. Электросеть прокладывать в гофрированной трубе ПВХ за подвесными потолками и в подготовке пола вдоль стен в зоне 150 мм от стен.</text><text x="70" y="44" font-size="17" font-weight="700" fill="#2E2A26">План розеток 220 В и выводов с привязками · 2 этаж</text><text x="70" y="62" font-size="11" fill="#7A756D">Привязки L/H: от угла или проёма / от чистого пола, мм</text></g><g stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

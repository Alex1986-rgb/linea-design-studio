 r="7" fill="#FFF" stroke="#3B5C77" stroke-width="1.44"/><text x="926" y="149" font-size="20.00" font-weight="700" fill="#3B5C77" text-anchor="middle">М2</text><text x="944" y="152" font-size="20.00" fill="#57514A">фальш-стена, вылет 165 мм · Ниша-стеллаж</text><text x="944" y="163" font-size="20.00" fill="#57514A">с подсветкой (Детская)</text><circle cx="926" cy="176" r="7" fill="#FFF" stroke="#3B5C77" stroke-width="1.44"/><text x="926" y="179" font-size="20.00" font-weight="700" fill="#3B5C77" text-anchor="middle">М3</text><text x="944" y="182" font-size="20.00" fill="#57514A">фальш-стена, вылет 165 мм · Ниша-стеллаж</text><text x="944" y="193" font-size="20.00" fill="#57514A">с подсветкой (Детская вторая)</text><circle cx="926" cy="206" r="7" fill="#FFF" stroke="#3B5C77" stroke-width="1.44"/><text x="926" y="209" font-size="20.00" font-weight="700" fill="#3B5C77" text-anchor="middle">М4</text><text x="944" y="212" font-size="20.00" fill="#57514A">фальш-стена, вылет 165 мм · Ниша-полка</text><text x="944" y="223" font-size="20.00" fill="#57514A">над ванной (Санузел второго этажа)</text><circle cx="926" cy="236" r="7" fill="#FFF" stroke="#3B5C77" stroke-width="1.44"/><text x="926" y="239" font-size="20.00" font-weight="700" fill="#3B5C77" text-anchor="middle">М5</text><text x="944" y="242" font-size="20.00" fill="#57514A">фальш-стена, вылет 165 мм · Ниша</text><text x="944" y="253" font-size="20.00" fill="#57514A">банкетки с подсветкой (Гардеробная)</text><circle cx="926" cy="266" r="7" fill="#FFF" stroke="#3B5C77" stroke-width="1.44"/><text x="926" y="269" font-size="20.00" font-weight="700" fill="#3B5C77" text-anchor="middle">М6</text><text x="944" y="272" font-size="20.00" fill="#57514A">фальш-стена, вылет 165 мм · Ниша</text><text x="944" y="283" font-size="20.00" fill="#57514A">банкетки с подсветкой (Холл второго</text><text x="944" y="294" font-size="20.00" fill="#57514A">этажа)</text></g><g data-el="notes"></g><text x="70" y="940" font-size="20.00" font-weight="700" fill="#2E2A26">Примечания:</text><text x="70" y="954" font-size="20.00" fill="#57514A">1. Внутри всех конструкций — закладные из фанеры 18 мм под навесное оборудование.</text><text x="70" y="968" font-size="20.00" fill="#57514A">2. Границы потолочных коробов — на плане потолков и листах раздела 05.</text><text x="70" y="982" font-size="20.00" fill="#57514A">3. В санузле — влагостойкий ГКЛВ · звукоизоляция минватой 50 мм в полостях.</text><text x="70" y="22" font-size="22.95" font-weight="700" fill="#2E2A26">План монтажа ГКЛ-конструкций · 2 этаж</text><text x="70" y="40" font-size="20.00" fill="#7A756D">Фальш-стены под ниши, закладные, короба потолков · каркас ПП 60×27, ГКЛ 12,5 в 2 слоя</text></g><g data-el="stamp" stroke="#1C1C1C" stroke-width="1" fill="none"><rect x="868" y="954" width="700" height="150"/>

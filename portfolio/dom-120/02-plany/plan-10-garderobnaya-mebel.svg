ize="8.45" fill="#1C1C1C">полотна в цвет стен</text><text x="78" y="452" font-size="8.00" fill="#7A756D">Ниши:</text><text x="122" y="452" font-size="8.00" fill="#1C1C1C">Ниша банкетки с подсветкой — 900×1350, глуб. 100, низ +0,450</text><text x="78" y="472" font-size="8.00" fill="#7A756D">Мебель:</text><text x="130" y="472" font-size="8.00" fill="#1C1C1C">Шкаф-гардероб · Банкетка</text><g data-el="legend"><rect x="78" y="374" width="300" height="130" fill="none" stroke="#8A8478" stroke-width="0.71"/><text x="88" y="392" font-size="9.33" font-weight="700" fill="#2E2A26">Условные обозначения</text><rect x="90" y="399" width="16" height="11" fill="#9A9A9A" stroke="#1C1C1C" stroke-width="0.80"/><text x="116" y="411" font-size="8.00" fill="#57514A">существующая стена / перегородка в</text><text x="116" y="422" font-size="8.00" fill="#57514A">сечении</text><rect x="90" y="429" width="16" height="11" fill="none" stroke="#2E9E4F" stroke-width="0.80"/><text x="116" y="441" font-size="8.00" fill="#57514A">мебель и оборудование, габарит в мм</text><line x1="90" y1="454" x2="106" y2="454" stroke="#2E9E4F" stroke-width="0.98" stroke-dasharray="5 3"/><text x="116" y="461" font-size="8.00" fill="#57514A">зона открывания дверей и выдвижных</text><text x="116" y="472" font-size="8.00" fill="#57514A">элементов</text><circle cx="98" cy="485" r="7" fill="none" stroke="#57514A" stroke-width="0.80"/><text x="98" y="488" font-size="8.00" text-anchor="middle" fill="#2E2A26">n</text><text x="116" y="491" font-size="8.00" fill="#57514A">номер помещения по экспликации</text></g><g data-el="notes"></g><text x="398" y="392" font-size="8.45" font-weight="700" fill="#2E2A26">Примечания:</text><text x="398" y="406" font-size="8.00" fill="#57514A">1. Габариты и артикулы мебели — в спецификации (раздел 07).</text><text x="398" y="418" font-size="8.00" fill="#57514A">2. Проходы между мебелью не менее 600 мм, в кухонной зоне — 900 мм.</text><text x="398" y="430" font-size="8.00" fill="#57514A">3. Рас
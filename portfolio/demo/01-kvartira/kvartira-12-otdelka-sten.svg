778" font-size="9" fill="#57514A">2. Отделка каждой стены с материалом и артикулом — на развёртках и в спецификации (раздел 07).</text><text x="70" y="792" font-size="9" fill="#57514A">3. Стыки разных отделок — во внутренних углах, без нащельников.</text><text x="70" y="44" font-size="17" font-weight="700" fill="#2E2A26">План отделки стен</text><text x="70" y="62" font-size="11" fill="#7A756D">Коды отделки по помещениям · площади за вычетом проёмов</text><g stroke="#2E2A26" stroke-width="1" fill="none">
